[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saber"
version = "0.1.0"
description = "Security Agent Benchmarking and Evaluation Research (SABER) - A distributed system for benchmarking agentic workflows in cybersecurity domains"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SABER Team"}
]
keywords = ["security", "agent", "benchmark", "cybersecurity", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    "docker[compose]>=7.0.0",
    "httpx>=0.24.0",
    "httpx-sse>=0.4.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "fastmcp>=0.1.0",
    "websockets>=11.0.0",
    "aiohttp>=3.12.15",
    "python-dotenv>=1.1.1",
    "openai>=1.101.0",
    "azure-identity>=1.15.0",
    "click>=8.0.0",
    "tabulate>=0.9.0",
    # inspect-ai dependency managed via tool.uv.sources for flexible installation
    "inspect-ai",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
server = [
    # Server-specific optional dependencies can go here
]
client = [
    # Client-specific optional dependencies can go here
]

# Installation method variants
local-dev = [
    # Dependencies for local development with external inspect_ai directory (now default)
    # No additional dependencies needed - just changes the source
]

[project.urls]
Homepage = "https://github.com/saber-team/saber"
Documentation = "https://saber.readthedocs.io"
Repository = "https://github.com/saber-team/saber"
Issues = "https://github.com/saber-team/saber/issues"

[project.scripts]
saber-server = "saber.server.cli:main"
saber-client = "saber.client.cli:main"
saber-mcp-service = "saber.mcp_service.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/saber"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
# PATHWAY 1: Local development with external directory (DEFAULT)
# This is the recommended approach for most users and enables local inspect_ai development
inspect-ai = { path = "./external/inspect_ai" }

# PATHWAY 2: MSEC ADO repository installation (alternative)
# To use ADO installation, comment the line above and uncomment this one:
# inspect-ai = { git = "https://MSECAIModels@dev.azure.com/MSECAIModels/Benchmarking/_git/inspect_ai" }

# Alternative: PyPI installation (if inspect-ai becomes available on PyPI)
# inspect-ai = { version = "*" }

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "docs/",
    "tests/",
    "data/",
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | .*/targets/.*
  | .*/.archive/.*
  | examples/.*
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E402"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "*/targets/*",
    "*/.archive/*",
    "examples/",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "saber.server.api.session_rest_api"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "saber.client.mcp_service.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "saber.server.api.session_mcp_api"
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config -m 'not integration'"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (run with -m integration)",
    "unit: marks tests as unit tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
