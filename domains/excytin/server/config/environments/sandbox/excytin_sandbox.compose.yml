---
# Excytin Sandbox Environment - Red Agent Pentesting
# Lightweight sandbox for XSS CTF challenges and security analysis
# This replaces the dynamic environment generation from environments.yaml
#
# Required Environment Variables:
# - EPISODE_ID: Unique identifier for episode isolation

services:
  excytin-sandbox:
    image: saber/excytin/sandbox:latest
    container_name: excytin-sandbox-${EPISODE_ID:-default}
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - EPISODE_ID=${EPISODE_ID:-default}
      - MYSQL_HOST=saber-excytin-incident-5
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=admin
      - MYSQL_DATABASE=env_monitor_db
    networks:
      - excytin-database
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    labels:
      - "saber.execution.service=true"
      - "saber.domain=excytin"
      - "saber.service.type=sandbox"
      - "saber.service.name=excytin-sandbox"
      - "saber.episode.id=${EPISODE_ID:-default}"

networks:
  # External shared network for database access (created by permanent services)
  excytin-database:
    external: true
    name: ${PERMANENT_NETWORK_PREFIX}excytin-database
