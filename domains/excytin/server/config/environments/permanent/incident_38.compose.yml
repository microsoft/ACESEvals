---
# Permanent services and networks for the Excytin cybersecurity domain - Incident 38
# This compose file defines all permanent infrastructure that runs continuously

services:
  # Incident database for storing security incidents and analysis results
  incident-38-db:
    image: saber/excytin/incident-38:latest
    container_name: saber-excytin-incident-38
    ports:
      - "3308:3306"
    volumes:
      - ./server/data/sql_files/incident_38.sql:/docker-entrypoint-initdb.d/incident_38.sql:ro
      - ./server/data/csv_files/incident_38:/var/lib/mysql-files
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: env_monitor_db
      MYSQL_ROOT_HOST: "%"
    command: --secure-file-priv=/var/lib/mysql-files --bind-address=0.0.0.0 --innodb-redo-log-capacity=2147483648 --innodb-buffer-pool-size=512M
    networks:
      - excytin-database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
    labels:
      - "saber.domain=excytin"
      - "saber.service.type=permanent"
      - "saber.service.name=incident-38-db"
      - "saber.execution.service=true"

# Shared network for communication with sandbox environments
networks:
  excytin-database:
    driver: bridge
    labels:
      - "saber.domain=excytin"
      - "saber.network.type=shared"
      - "saber.network.name=excytin-database"

# No persistent volumes needed for incident-38-db (uses container storage)
