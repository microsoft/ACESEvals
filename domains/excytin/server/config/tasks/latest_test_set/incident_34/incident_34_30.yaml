    description: 'What is the name of the file that was involved in the "Suspicious PowerShell command line" activity observed on host "vnevado-win10e"?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, an alert titled "Suspicious LDAP query" was raised on host "vnevado-win10e" (AAD Device ID: 02b8f519-1123-4228-b32a-ccb78af3449f) at 22:35:02 UTC on 2024-07-04. The activity was executed under the user account "samuelf" (SID S-1-5-21-1870156660-7534030218-135086563-1193) and involved the process "winword.exe" launching a macro-enabled document (rs4_winatp-intro-invoice.docm). While reviewing related alerts, you note that just a second earlier there was a separate alert for a "Suspicious PowerShell command line" on the same machine, suggesting the attacker may have dropped or interacted with a malicious file via PowerShell.'
      question: 'What is the name of the file that was involved in the "Suspicious PowerShell command line" activity observed on host "vnevado-win10e"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
