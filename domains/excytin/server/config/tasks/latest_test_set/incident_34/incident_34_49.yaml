tasks:
  - task_id: incident_34_latest_test_set_task_49
    title: incident_34_latest_test_set_task_49
    description: 'According to the second alert that followed moments later, which executable opened the malicious document ''rs4_winatp-intro-invoice.docm'' under C:\scripts\ ?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we noted that user account ''samuelf'' on host ''vnevado-win10e'' launched a heavily obfuscated PowerShell command to download and schedule execution of a back-door binary. This action triggered the alert “Suspicious PowerShell download or encoded command execution.” A second, related alert was raised only a few seconds later, indicating another suspicious execution chain tied to the same incident.'
      question: 'According to the second alert that followed moments later, which executable opened the malicious document ''rs4_winatp-intro-invoice.docm'' under C:\scripts\ ?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winword.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious PowerShell activity was initiated by the account with field AadUserId = `16320fec-8d90-403b-b7fe-78f715d4728d`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'That activity resulted in the creation of the process with field ProcessId__CreatedTimeUtc__CommandLine = `9780__2024-06-26t11:57:20.2959493z__"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`, which executed the malicious payload.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
