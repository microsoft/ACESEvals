tasks:
  - task_id: incident_34_latest_test_set_task_42
    title: incident_34_latest_test_set_task_42
    description: 'Following the suspicious Task Scheduler activity, security telemetry showed an additional process execution related to this incident. What is the name of the executable that was ultimately started after the scheduled task ran?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed that on host "vnevado-win10e" the user account "samuelf" ran the Windows Task Scheduler utility (`schtasks.exe`). Two commands were recorded: first a task creation that would run a backdoor executable located in the user’s OneDrive folder, and moments later a task run command executed that scheduled task. This sequence was flagged by Microsoft Defender as "Suspicious Task Scheduler activity," suggesting an attempt to gain persistence by launching malicious code.'
      question: 'Following the suspicious Task Scheduler activity, security telemetry showed an additional process execution related to this incident. What is the name of the executable that was ultimately started after the scheduled task ran?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious Task Scheduler activity was detected involving the process whose ExtractedFileName is `powershell.exe`, indicating an attempt to establish persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
