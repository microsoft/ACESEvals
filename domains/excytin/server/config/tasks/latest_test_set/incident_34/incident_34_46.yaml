tasks:
  - task_id: incident_34_latest_test_set_task_46
    title: incident_34_latest_test_set_task_46
    description: 'Which executable was identified as the process responsible for issuing the suspicious LDAP query?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of a persistence-related alert, we observed that the file `winatp-intro-backdoor.exe` was created on a host and registered under the RunOnce registry key via the following command (PID 10208, 2024-06-26T13:17:18Z):

reg  add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe

This action triggered the alert “An uncommon file was created and added to a Run Key.” Shortly after, another alert—“Suspicious LDAP query” (indicating possible domain reconnaissance)—was raised from the same machine.'
      question: 'Which executable was identified as the process responsible for issuing the suspicious LDAP query?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winword.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` created an uncommon file and added it to a Run registry key, suggesting a persistence attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
