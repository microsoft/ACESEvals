tasks:
  - task_id: incident_34_latest_test_set_task_66
    title: incident_34_latest_test_set_task_66
    description: 'According to the follow-up alert stating that PowerShell dropped and executed a suspicious file on the affected machine, what is the exact name of that file?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, an alert was generated at 22:35:02 UTC on 2024-07-04 indicating that an uncommon file had been created on a host associated with the IP address 72.5.72.208 and then placed in a registry Run key—an activity often linked to persistence techniques. Moments later, a second alert reported that PowerShell had dropped and executed a potentially malicious file on the same machine.'
      question: 'According to the follow-up alert stating that PowerShell dropped and executed a suspicious file on the affected machine, what is the exact name of that file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winatp-intro-backdoor.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account Name=samuelf created an uncommon file and added it to a Run registry key, indicating an attempt to persist after reboot.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'File Name=winatp-intro-backdoor.exe was dropped and executed by PowerShell, confirming the presence of suspicious malware on the system.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
