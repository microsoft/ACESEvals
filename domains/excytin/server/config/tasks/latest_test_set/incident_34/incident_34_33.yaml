tasks:
  - task_id: incident_34_latest_test_set_task_33
    title: incident_34_latest_test_set_task_33
    description: 'A related alert reported that an uncommon file was created and added to a Run registry key just seconds before the PowerShell activity. What is the IP address associated with that uncommon-file-creation alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation on July 4, 2024, at 22:35 UTC, a host executed a long, base-64-encoded PowerShell command from the file "powershell.exe" (process ID 8604), suggesting an attempt to download and run an external payload named "winatp-intro-backdoor.exe" via a scheduled task called "yrei". This behavior triggered the alert "Suspicious PowerShell download or encoded command execution".'
      question: 'A related alert reported that an uncommon file was created and added to a Run registry key just seconds before the PowerShell activity. What is the IP address associated with that uncommon-file-creation alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
