tasks:
  - task_id: incident_34_latest_test_set_task_23
    title: incident_34_latest_test_set_task_23
    description: 'During the investigation, analysts mapped this activity to a specific user account. What is the username (the logon name, not the SID or AAD ID) ultimately associated with this anomalous scheduled task?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4, 2024, Microsoft Defender flagged an alert on host "vnevado-win10e" after a PowerShell command dropped the file "winatp-intro-backdoor.exe" and used schtasks.exe to create and immediately run a new scheduled task—behaviour often seen when an attacker tries to gain persistence. The activity was executed under a user context identified only by its Azure AD and SID values in the initial alert.'
      question: 'During the investigation, analysts mapped this activity to a specific user account. What is the username (the logon name, not the SID or AAD ID) ultimately associated with this anomalous scheduled task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'samuelf'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created by account Name `samuelf`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
