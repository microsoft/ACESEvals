tasks:
  - task_id: incident_34_latest_test_set_task_47
    title: incident_34_latest_test_set_task_47
    description: 'According to the investigation alert generated at 22:35:00 UTC on 2024-07-04, what is the hostname of the workstation where user u141 initiated the automated investigation?'
    inherit_shared: true
    initial_context:
      incident_context: 'Following a suspicious PowerShell session in which the account "samuelf" ran an encoded command from powershell.exe (originally spawned by winword.exe), a security responder (u141@ash.alpineskihouse.co) manually kicked off an Automated Investigation to inspect the affected workstation for malicious artifacts.'
      question: 'According to the investigation alert generated at 22:35:00 UTC on 2024-07-04, what is the hostname of the workstation where user u141 initiated the automated investigation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win10e'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:00.400749+00:00, an automated investigation was manually initiated on host with HostName `vnevado-win10e`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A few seconds later, at 2024-07-04 22:35:04.145779+00:00, a suspicious PowerShell download or encoded command was executed on the same device, identified by AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
