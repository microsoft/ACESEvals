    title: incident_34_latest_test_set_task_7
    description: 'According to the "Suspicious process executed PowerShell command" alert raised moments before the registry anomaly, what is the name of the process that ran the PowerShell command?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of an endpoint, the alert system flagged an "Anomaly detected in ASEP registry" at 2024-07-04 22:35:01 UTC. The activity originated from IP address 72.5.72.208, where a process (PID 10208) ran the command: reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe. This registry modification could allow malicious code to run automatically after a reboot. Shortly before this, another alert indicated that a suspicious process executed a PowerShell command, suggesting further post-exploitation activity.'
      question: 'According to the "Suspicious process executed PowerShell command" alert raised moments before the registry anomaly, what is the name of the process that ran the PowerShell command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
