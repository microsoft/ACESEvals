tasks:
  - task_id: incident_34_latest_test_set_task_1
    title: incident_34_latest_test_set_task_1
    description: 'According to the follow-up alert that reported an uncommon file being added to a Run Key, which IP address is associated with that activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious Task Scheduler activity detected on July 4 2024 at 22:35 UTC, we saw a PowerShell script that dropped a file named "winatp-intro-backdoor.exe" onto the desktop and used "schtasks.exe" to create and immediately run a task called "yrei"—a classic persistence technique. A follow-up alert reported that an uncommon file was created and written to a Windows Run registry key on the same machine, indicating a potential attempt to maintain access across reboots.'
      question: 'According to the follow-up alert that reported an uncommon file being added to a Run Key, which IP address is associated with that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f` was observed performing suspicious Task Scheduler activity, indicating a possible attempt at establishing persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Soon after, an uncommon file was created and added to a Run Key, and the activity involved the IP address `72.5.72.208`, reinforcing the likelihood of malicious persistence on the system.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
