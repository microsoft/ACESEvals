tasks:
  - task_id: incident_34_latest_test_set_task_51
    title: incident_34_latest_test_set_task_51
    description: 'According to the follow-up alert about the malicious PowerShell activity, what is the name of the process that initiated this PowerShell execution?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious persistence mechanism, we observed that the executable "schtasks.exe" was used to create and immediately run a scheduled task named "yrei", pointing to a backdoor binary. This activity triggered the alert "Suspicious Task Scheduler activity" on 2024-07-04 22:35 UTC. Just seconds later, a separate alert flagged that PowerShell was executed in a potentially malicious fashion (download or encoded command execution), indicating that another process had invoked PowerShell for follow-up actions.'
      question: 'According to the follow-up alert about the malicious PowerShell activity, what is the name of the process that initiated this PowerShell execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winword.exe'
      scoring:
        max_score: 1.0
