tasks:
  - task_id: incident_34_latest_test_set_task_36
    title: incident_34_latest_test_set_task_36
    description: 'Shortly before the scheduled task was created, a "Suspicious PowerShell command line" alert was raised on the same endpoint. What is the name of the executable that the PowerShell command tried to run?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a recent investigation on host "vnevado-win10e" (device ID 02b8f519-1123-4228-b32a-ccb78af3449f), we observed that the user account "samuelf" (SID S-1-5-21-1870156660-7534030218-135086563-1193) used "schtasks.exe" to create an anomalous one-time scheduled task pointing to an executable stored in the user’s OneDrive Desktop folder. This activity is often associated with attempts to gain persistence on a device.'
      question: 'Shortly before the scheduled task was created, a "Suspicious PowerShell command line" alert was raised on the same endpoint. What is the name of the executable that the PowerShell command tried to run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winatp-intro-backdoor.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created by the account with Sid `S-1-5-21-1870156660-7534030218-135086563-1193`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious PowerShell command line executed a file named `winatp-intro-backdoor.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
