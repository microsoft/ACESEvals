    title: incident_34_latest_test_set_task_15
    description: 'According to the “Suspicious process executed PowerShell command” alert, what was the Process ID of the process that launched the PowerShell payload?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 an alert reported that an uncommon executable (winatp-intro-backdoor.exe) was written to disk and registered in the HKCU RunOnce key. This change was made from IP address 72.5.72.208 by a process whose command line showed it adding the registry entry so the file would run after reboot. Just seconds earlier on the same host, Microsoft Defender also raised an alert that a suspicious process had executed an extensive, Base-64-heavy PowerShell command—likely a staging action for the backdoor that had just been installed.'
      question: 'According to the “Suspicious process executed PowerShell command” alert, what was the Process ID of the process that launched the PowerShell payload?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '8604'
