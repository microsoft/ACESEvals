    title: incident_34_latest_test_set_task_80
    description: 'According to the “Anomaly detected in ASEP registry” alert that followed the suspicious PowerShell activity, what is the external IP address associated with the suspicious registry entry?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a recent threat, analysts observed a suspicious PowerShell command (PID 8604) executed via "powershell.exe" that wrote a payload named "winatp-intro-backdoor.exe" to the user’s Desktop and created a one-time scheduled task called "yrei" to run it. This activity triggered the alert “Suspicious PowerShell command line” on 2024-07-04 22:35:01 UTC. Only moments later, a second alert titled “Anomaly detected in ASEP registry” was raised, indicating that a process had registered a potentially malicious command for automatic execution on reboot—suggesting an attempt at persistence by contacting an external network location.'
      question: 'According to the “Anomaly detected in ASEP registry” alert that followed the suspicious PowerShell activity, what is the external IP address associated with the suspicious registry entry?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
