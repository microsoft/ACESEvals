tasks:
  - task_id: incident_34_latest_test_set_task_18
    title: incident_34_latest_test_set_task_18
    description: 'According to the follow-up alert, what is the exact name of the executable file that PowerShell deposited and ran on host vnevado-win10e?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 at 22:35:01 UTC, an alert titled "Suspicious PowerShell download or encoded command execution" was raised for host vnevado-win10e (user account: samuelf). The alert indicates that PowerShell was used to fetch or run potentially malicious code. Just two seconds later, a follow-up alert reported that the same PowerShell session had dropped and executed a suspicious executable on the machine.'
      question: 'According to the follow-up alert, what is the exact name of the executable file that PowerShell deposited and ran on host vnevado-win10e?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winatp-intro-backdoor.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Step 1 – HostName: `vnevado-win10e`: A process on this host executed PowerShell to download a file or run an encoded command (alert: Suspicious PowerShell download or encoded command execution).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Step 2 – Name: `winatp-intro-backdoor.exe`: That PowerShell session then dropped and executed the suspicious file winatp-intro-backdoor.exe on the machine (alert: Powershell dropped a suspicious file on the machine).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
