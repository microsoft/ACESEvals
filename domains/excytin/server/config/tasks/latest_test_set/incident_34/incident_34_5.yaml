tasks:
  - task_id: incident_34_latest_test_set_task_5
    title: incident_34_latest_test_set_task_5
    description: 'On which host did analyst u141 manually start the automated investigation?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we observed that the user account "samuelf" (AadUserId 16320fec-8d90-403b-b7fe-78f715d4728d) executed the file "winatp-intro-backdoor.exe" with process ID 10208 and modified a RunOnce registry key so the file will launch after reboot. This activity was flagged by the alert titled "An uncommon file was created and added to a Run Key." Shortly after, another alert indicates that an analyst (u141) manually triggered an automated investigation on the same machine to review and remediate any threat artifacts.'
      question: 'On which host did analyst u141 manually start the automated investigation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win10e'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'HostName=`vnevado-win10e`: An uncommon file was created and added to a Run Key, potentially establishing persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'HostName=`vnevado-win10e`: A user manually initiated an Automated Investigation on the same host to analyze and remediate the suspicious activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
