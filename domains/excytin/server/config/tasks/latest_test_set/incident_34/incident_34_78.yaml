tasks:
  - task_id: incident_34_latest_test_set_task_78
    title: incident_34_latest_test_set_task_78
    description: 'According to the follow-up alert "Powershell dropped a suspicious file on the machine", which user account carried out the PowerShell activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation on July 4th, a suspicious PowerShell command line was observed. The activity originated after the document rs4_winatp-intro-invoice.docm was opened with winword.exe (PID 9780), and shortly afterwards schtasks.exe (PID 1616) was spawned to run a task named "yrei". This chain of events triggered the alert "Suspicious PowerShell command line", indicating possible use of PowerShell for post-exploitation actions.'
      question: 'According to the follow-up alert "Powershell dropped a suspicious file on the machine", which user account carried out the PowerShell activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'samuelf'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious PowerShell command line was observed, involving the process with ExtractedFileName `powershell.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A few seconds later, PowerShell dropped and executed a suspicious file on the machine under the account Name `samuelf`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
