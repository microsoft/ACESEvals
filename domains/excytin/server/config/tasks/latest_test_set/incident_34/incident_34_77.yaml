tasks:
  - task_id: incident_34_latest_test_set_task_77
    title: incident_34_latest_test_set_task_77
    description: 'The "Anomaly detected in ASEP registry" alert references a specific external IP address related to the suspicious registration activity. What is that IP address?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a security incident on July 4, 2024, analysts observed that a PowerShell process ("powershell.exe") executed a lengthy Base64-encoded command which created and scheduled the file "winatp-intro-backdoor.exe" to run after a short delay. This activity triggered the alert titled "Powershell dropped a suspicious file on the machine". Shortly before this event, another alert was raised – "Anomaly detected in ASEP registry" – indicating that a process had registered a suspicious command or file to run automatically after reboot, a common persistence technique.'
      question: 'The "Anomaly detected in ASEP registry" alert references a specific external IP address related to the suspicious registration activity. What is that IP address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:01 UTC an anomaly was detected in the ASEP registry, and the process responsible was communicating with IP address (Field: Address) `72.5.72.208`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
