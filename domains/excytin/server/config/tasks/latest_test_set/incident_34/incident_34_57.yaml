tasks:
  - task_id: incident_34_latest_test_set_task_57
    title: incident_34_latest_test_set_task_57
    description: 'According to the alert titled "Suspicious process executed PowerShell command" raised at 2024-07-04 22:35:00 UTC, what is the Security Identifier (SID) of the account that ran the PowerShell command?'
    inherit_shared: true
    initial_context:
      incident_context: 'Microsoft security monitoring flagged that the process "winword.exe" (PID 9780) launched the document "rs4_winatp-intro-invoice.docm" on 2024-07-04 22:35:04 UTC and then invoked PowerShell to download or run an encoded command. Because attackers often use such techniques to execute malicious payloads in memory, the incident is being investigated. A related alert fired only a few seconds earlier states that a suspicious process executed a PowerShell command, and analysts need to determine which user account (identified by its SID) was responsible for that execution.'
      question: 'According to the alert titled "Suspicious process executed PowerShell command" raised at 2024-07-04 22:35:00 UTC, what is the Security Identifier (SID) of the account that ran the PowerShell command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
