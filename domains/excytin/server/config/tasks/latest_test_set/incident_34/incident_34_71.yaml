tasks:
  - task_id: incident_34_latest_test_set_task_71
    title: incident_34_latest_test_set_task_71
    description: 'According to the alert about the anomalous scheduled task creation, which user account was responsible for creating that task?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious PowerShell command execution linked to the process "winword.exe" that launched a macro-enabled document, analysts noted that the same machine soon executed a command via "schtasks.exe" to run a task named "yrei"—a known technique for gaining persistence. This behavior was captured in the alert titled "Suspicious PowerShell command line" on 2024-07-04. Minutes later, another alert reported that an anomalous scheduled task had been created on the device, suggesting an attacker might be attempting to maintain long-term access.'
      question: 'According to the alert about the anomalous scheduled task creation, which user account was responsible for creating that task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'samuelf'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious PowerShell activity was detected on host HostName=`vnevado-win10e`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'An anomalous scheduled task was subsequently created by account Name=`samuelf`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
