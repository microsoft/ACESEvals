tasks:
  - task_id: incident_34_latest_test_set_task_4
    title: incident_34_latest_test_set_task_4
    description: 'According to the "Suspicious Task Scheduler activity" alert raised at 22:35:01 UTC on 2024-07-04, what is the Azure AD user ID (AadUserId) of the account associated with this task manipulation?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into suspicious activity on July 4, 2024, analysts noted that the process "winword.exe" (PID 9780) opened a macro-enabled document (rs4_winatp-intro-invoice.docm) and later invoked a suspicious PowerShell command. This behavior suggested possible installation or lateral-movement activity. Shortly afterwards, the same attack chain triggered another alert: a process previously involved in the malicious activity leveraged Windows Task Scheduler to create or modify a scheduled task—likely to gain persistence.'
      question: 'According to the "Suspicious Task Scheduler activity" alert raised at 22:35:01 UTC on 2024-07-04, what is the Azure AD user ID (AadUserId) of the account associated with this task manipulation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '16320fec-8d90-403b-b7fe-78f715d4728d'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '16320fec-8d90-403b-b7fe-78f715d4728d'
      scoring:
        max_score: 1.0
