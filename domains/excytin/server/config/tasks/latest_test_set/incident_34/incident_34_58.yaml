tasks:
  - task_id: incident_34_latest_test_set_task_58
    title: incident_34_latest_test_set_task_58
    description: 'According to the related alert, what is the name of the executable that was ultimately invoked to run the PowerShell commands?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we observed that the user account "samuelf" (SID: S-1-5-21-1870156660-7534030218-135086563-1193) on host "vnevado-win10e" launched the file "winatp-intro-backdoor.exe", which in turn triggered the alert "Suspicious PowerShell download or encoded command execution". This indicates that the executable spawned a PowerShell process to download external content or run an encoded command, a common technique used by attackers to execute malicious payloads in memory.'
      question: 'According to the related alert, what is the name of the executable that was ultimately invoked to run the PowerShell commands?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A process with ExtractedFileName `powershell.exe` executed a suspicious PowerShell download or encoded command.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
