tasks:
  - task_id: incident_34_latest_test_set_task_9
    title: incident_34_latest_test_set_task_9
    description: 'According to the related Task Scheduler alert observed moments after the LDAP reconnaissance, which executable was responsible for the scheduler activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious LDAP query that was initiated from the process "winword.exe" (command line: "winword.exe c:\scripts\rs4_winatp-intro-invoice.docm"), we noted that attackers often leverage LDAP queries for reconnaissance to enumerate users, groups, or other domain objects. Immediately around the same time, another alert flagged the use of Task Scheduler by a process connected to this earlier malicious activity, suggesting an attempt to gain persistence.'
      question: 'According to the related Task Scheduler alert observed moments after the LDAP reconnaissance, which executable was responsible for the scheduler activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'schtasks.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert 1 – Suspicious LDAP query: The account with field AadUserId and value `16320fec-8d90-403b-b7fe-78f715d4728d` executed an LDAP query, indicating possible reconnaissance.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Alert 2 – Suspicious Task Scheduler activity: The process with field ExtractedFileName and value `schtasks.exe` was used to create or modify a scheduled task, suggesting an attempt to establish persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
