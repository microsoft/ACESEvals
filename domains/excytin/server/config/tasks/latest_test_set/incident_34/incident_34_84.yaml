    title: incident_34_latest_test_set_task_84
    description: 'According to the "Suspicious PowerShell command line" alert, what is the name of the executable file that was identified as part of the suspicious activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an ongoing investigation, Microsoft Defender raised an alert called "Suspicious PowerShell download or encoded command execution" on a workstation (host name withheld). The alert showed that Word (winword.exe) had launched PowerShell with a potentially malicious command, likely used to pull down or run additional payloads in memory. Just seconds earlier, another alert titled "Suspicious PowerShell command line" was triggered on the same device, indicating that a specific executable file was involved in the activity.'
      question: 'According to the "Suspicious PowerShell command line" alert, what is the name of the executable file that was identified as part of the suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winatp-intro-backdoor.exe'
      scoring:
        max_score: 1.0
