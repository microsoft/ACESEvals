    title: incident_34_latest_test_set_task_41
    description: 'According to the alert that was raised when user u141 manually initiated an automated investigation, what is the hostname of the device on which the investigation was started?'
    inherit_shared: true
    initial_context:
      incident_context: 'During our investigation of a suspicious PowerShell command line execution, we noted that it originated from an unidentified device (AadDeviceId withheld). Shortly afterwards, security operator u141 (u141@ash.alpineskihouse.co) manually triggered a Microsoft 365 Defender automated investigation on one of the organization’s Windows endpoints. The automated investigation alert does not specify the device in the start-alert details you are reviewing, but the end-alert record contains the hostname of the machine that was targeted.'
      question: 'According to the alert that was raised when user u141 manually initiated an automated investigation, what is the hostname of the device on which the investigation was started?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win10e'
      scoring:
        max_score: 1.0
