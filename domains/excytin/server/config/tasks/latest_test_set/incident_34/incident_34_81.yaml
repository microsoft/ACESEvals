tasks:
  - task_id: incident_34_latest_test_set_task_81
    title: incident_34_latest_test_set_task_81
    description: 'According to the "Suspicious Task Scheduler activity" alert, which executable was responsible for interacting with Task Scheduler on the affected device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, analysts noted that on July 4 a Microsoft Word process ("winword.exe" with PID 9780) launched a PowerShell command to download or run an encoded script on an endpoint whose device ID is still being confirmed. Just seconds earlier, a related alert titled "Suspicious Task Scheduler activity" indicated that a different process had been used to create or modify scheduled tasks—likely an attempt to gain persistence.'
      question: 'According to the "Suspicious Task Scheduler activity" alert, which executable was responsible for interacting with Task Scheduler on the affected device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'schtasks.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The device identified by AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f` executed a suspicious PowerShell command to download or run an encoded payload.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Immediately afterwards, the attacker leveraged Task Scheduler via the process with ExtractedFileName `schtasks.exe` to create or modify a scheduled task and gain persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
