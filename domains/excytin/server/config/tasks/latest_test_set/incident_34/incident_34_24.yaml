tasks:
  - task_id: incident_34_latest_test_set_task_24
    title: incident_34_latest_test_set_task_24
    description: 'Which user account was identified in the alert that reported PowerShell dropping a suspicious file on vnevado-win10e?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4th, 2024 at 22:35 UTC, user u141 manually kicked off an Automated Investigation against the Windows 10 endpoint vnevado-win10e (device ID 02b8f519-1123-4228-b32a-ccb78af3449f). Just a few seconds after the investigation began, Microsoft Defender raised a new alert titled “Powershell dropped a suspicious file on the machine,” indicating that a PowerShell session on the same host created and executed an unexpected file.'
      question: 'Which user account was identified in the alert that reported PowerShell dropping a suspicious file on vnevado-win10e?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'samuelf'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A manual trigger launched an automated investigation on the host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'PowerShell, executed under the account Name `samuelf`, dropped and ran a suspicious file on the machine.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
