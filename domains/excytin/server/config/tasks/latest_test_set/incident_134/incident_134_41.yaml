    description: 'During the password-spray attack detected at 14:36 UTC on 2024-07-18, what is the Azure AD User ID (AadUserId) of the account that was targeted?'
    inherit_shared: true
    initial_context:
      incident_context: 'An alert was triggered on 2024-07-18 at 13:48 UTC for a sign-in attempt coming from the known-malicious IP address 170.54.121.63. Shortly after this suspicious activity, another alert was raised at 14:36 UTC the same day indicating that a password-spray attack had been detected against an Azure AD account.'
      question: 'During the password-spray attack detected at 14:36 UTC on 2024-07-18, what is the Azure AD User ID (AadUserId) of the account that was targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
