tasks:
  - task_id: incident_134_latest_test_set_task_28
    title: incident_134_latest_test_set_task_28
    description: 'A few minutes earlier, the same user account was observed signing in from an anonymous network source. What is the IP address associated with that anonymous sign-in event?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-17 at 11:34 UTC, Microsoft security signaled a Business Email Compromise (BEC) attempt against the account “Nina Park” (Nina Park@vnevado.alpineskihouse.co, SID S-1-5-21-1874151667-3554330288-105586563-1715). The alert noted that, during a risky Azure AD session originating from the external IP address 237.7.81.122, a malicious inbox rule was created to hide incoming email—classic behaviour in financial-fraud–related BEC attacks.'
      question: 'A few minutes earlier, the same user account was observed signing in from an anonymous network source. What is the IP address associated with that anonymous sign-in event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious inbox rule was created in a risky Azure Active Directory session for the account (AadUserId: `e036dee7-fa23-42ef-a019-468c8d3401f1`), indicating a potential BEC financial fraud attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Prior to this, the same user account signed in from an anonymous IP address (Address: `170.54.121.63`), showing use of anonymizing infrastructure.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
