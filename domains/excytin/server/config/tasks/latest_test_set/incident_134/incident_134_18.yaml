tasks:
  - task_id: incident_134_latest_test_set_task_18
    title: incident_134_latest_test_set_task_18
    description: 'Looking at the earlier "Password Spray" alert that is linked to this compromise, what is the Azure AD user ID (AadUserId) of the account targeted in that password spray attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security investigation revealed that the user account "Nina Park" (email: Nina Park@vnevado.alpineskihouse.co, SID: S-1-5-21-1874151667-3554330288-105586563-1715) was flagged as "Account compromised following a password-spray attack" after a sign-in from an unusual location and browser on 2024-07-18 at 14:54 UTC.'
      question: 'Looking at the earlier "Password Spray" alert that is linked to this compromise, what is the Azure AD user ID (AadUserId) of the account targeted in that password spray attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e036dee7-fa23-42ef-a019-468c8d3401f1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'e036dee7-fa23-42ef-a019-468c8d3401f1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A password-spray attack was detected against the account (field: AadUserId, value: `e036dee7-fa23-42ef-a019-468c8d3401f1`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, the compromised account was accessed from the IP address (field: Address, value: `170.54.121.63`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
