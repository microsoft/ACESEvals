tasks:
  - task_id: incident_134_latest_test_set_task_44
    title: incident_134_latest_test_set_task_44
    description: 'According to the "Account compromised following a password-spray attack" alert, what is the Security Identifier (SID) of the affected user account?'
    inherit_shared: true
    initial_context:
      incident_context: 'During investigation of a sign-in from a known malicious IP address (170.54.121.63) on 2024-07-18 at 13:48 UTC, we observed it was associated with Azure AD user ID e036dee7-fa23-42ef-a019-468c8d3401f1. Roughly an hour later, a separate alert reported that the same user account was likely compromised following a password-spray attack, after logging on from an unusual location and browser. You have been asked to review the details of this second alert.'
      question: 'According to the "Account compromised following a password-spray attack" alert, what is the Security Identifier (SID) of the affected user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1874151667-3554330288-105586563-1715'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-1-5-21-1874151667-3554330288-105586563-1715'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in was detected from a malicious IP address for the account identified by AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, during a password-spray attack, the account with SID `S-1-5-21-1874151667-3554330288-105586563-1715` was compromised.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
