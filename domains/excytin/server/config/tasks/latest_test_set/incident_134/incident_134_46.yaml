tasks:
  - task_id: incident_134_latest_test_set_task_46
    title: incident_134_latest_test_set_task_46
    description: 'The next day, the investigation showed that a separate “Password Spray” alert was triggered against the same environment. From which IP address did this password-spray attempt originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 17 2024 at 11:34 UTC a “Suspicious inbox manipulation rule” alert was raised for user Nina Park (email: nina park@vnevado.alpineskihouse.co, SID S-1-5-21-1874151667-3554330288-105586563-1715). The activity originated from IP 237.7.81.122 and involved cloud application ID 20893. This behavior suggests a possible attacker gaining access to the mailbox and creating rules to hide or divert messages.'
      question: 'The next day, the investigation showed that a separate “Password Spray” alert was triggered against the same environment. From which IP address did this password-spray attempt originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious inbox manipulation was detected for user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` on 2024-07-17 11:34:48.784934+00:00, indicating that the attacker likely gained access to the mailbox and created malicious rules.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'One day later, on 2024-07-18 14:36:59.143748+00:00, a Password Spray attack was observed from IP address `170.54.121.63`, revealing the source that may have been used to compromise the user account.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
