tasks:
  - task_id: incident_134_latest_test_set_task_58
    title: incident_134_latest_test_set_task_58
    description: 'According to the follow-up alert linked to the suspicious URL click, what is the Windows Security Identifier (SID) of the account involved?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a potentially malicious URL click (https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/) by user Nina Park (Nina Park@vnevado.alpineskihouse.co) from sender alyssat@vnevado.alpineskihouse.co to recipient raphaelt@vnevado.alpineskihouse.co, we traced further activity associated with the same user account. A related alert was raised later in the incident that identified the Windows account behind this activity and provided its Security Identifier (SID).'
      question: 'According to the follow-up alert linked to the suspicious URL click, what is the Windows Security Identifier (SID) of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1874151667-3554330288-105586563-1715'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-1-5-21-1874151667-3554330288-105586563-1715'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user with SID `S-1-5-21-1874151667-3554330288-105586563-1715` clicked on a malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
