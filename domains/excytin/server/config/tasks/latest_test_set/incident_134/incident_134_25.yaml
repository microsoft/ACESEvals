tasks:
  - task_id: incident_134_latest_test_set_task_25
    title: incident_134_latest_test_set_task_25
    description: 'Based on the investigation, what is the display name of the user account that was ultimately confirmed to be compromised?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security monitoring has flagged an alert titled "Account compromised following a password-spray attack." The alert shows that an account (SID: S-1-5-21-1874151667-3554330288-105586563-1715, AAD User ID: e036dee7-fa23-42ef-a019-468c8d3401f1) was accessed from an unusual IP address (170.54.121.63). This suggests the attacker successfully signed in after running a password-spray, indicating the user’s credentials were exposed.'
      question: 'Based on the investigation, what is the display name of the user account that was ultimately confirmed to be compromised?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Nina Park'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The alert at 2024-07-18 14:54:18.741032+00:00 indicates that the account (Field: Name, Value: `Nina Park`) was compromised following a password-spray attack.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
