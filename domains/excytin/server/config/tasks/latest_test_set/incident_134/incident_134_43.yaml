tasks:
  - task_id: incident_134_latest_test_set_task_43
    title: incident_134_latest_test_set_task_43
    description: 'According to the alert about the suspicious BEC-related emails, what is the email address of one recipient who received one of those messages?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed a sign-in from the anonymous IP address 170.54.121.63, which raised an alert titled “Anonymous IP address.” This activity suggested that a user might be hiding their location, potentially indicating malicious intent. Less than an hour later, another alert—“Suspicious emails sent by BEC-related user”—was raised, implying that the same user may have begun sending fraudulent messages as part of a business email compromise campaign.'
      question: 'According to the alert about the suspicious BEC-related emails, what is the email address of one recipient who received one of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nathan@avoriaz.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Nathan@avoriaz.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account sign-in from an anonymous IP address was detected for AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
