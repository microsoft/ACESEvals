tasks:
  - task_id: incident_134_latest_test_set_task_55
    title: incident_134_latest_test_set_task_55
    description: 'According to the follow-up alert about the BEC attempt, what is the primary email address of the mailbox that sent the suspicious emails?'
    inherit_shared: true
    initial_context:
      incident_context: 'A password spray attack was detected on 2024-07-18 from the external IP address 170.54.121.63. Investigators noted that the attack was likely attempting to compromise an Azure AD account (user ID not yet confirmed). The following day, a related alert indicated that a possibly compromised user account was used to send suspicious emails as part of a business-email-compromise (BEC) attempt.'
      question: 'According to the follow-up alert about the BEC attempt, what is the primary email address of the mailbox that sent the suspicious emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'nathan@avoriaz.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'nathan@avoriaz.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Password-spray activity was detected against the account (field: AadUserId, value: `e036dee7-fa23-42ef-a019-468c8d3401f1`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, suspicious emails were sent from the compromised mailbox (field: MailboxPrimaryAddress, value: `nathan@avoriaz.alpineskihouse.co`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
