tasks:
  - task_id: incident_134_latest_test_set_task_9
    title: incident_134_latest_test_set_task_9
    description: 'From which IP address did the anonymous sign-in associated with the "Nina Park" account originate on 2024-07-17?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security monitoring detected that user account "Nina Park" (email: Nina Park@vnevado.alpineskihouse.co) was successfully accessed during a suspected password-spray campaign on 2024-07-18. Investigation shows that, shortly before this compromise, the same account had logged in from a network identified as an anonymous source (such as a Tor exit node or anonymizing VPN).'
      question: 'From which IP address did the anonymous sign-in associated with the "Nina Park" account originate on 2024-07-17?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` was compromised following a password-spray attack on 2024-07-18 14:54:18.741032+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The same account signed in from the anonymous IP address `170.54.121.63` on 2024-07-17 11:01:27.633644+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
