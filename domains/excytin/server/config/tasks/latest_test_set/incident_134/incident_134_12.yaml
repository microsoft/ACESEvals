tasks:
  - task_id: incident_134_latest_test_set_task_12
    title: incident_134_latest_test_set_task_12
    description: 'According to the later alert about the risky sign-in, which IP address was recognized as malicious?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of suspicious inbox manipulation for user Nina Park (email: "Nina Park@vnevado.alpineskihouse.co"), the security team noted that the activity originated from the external IP address 237.7.81.122 and was tied to cloud application ID 20893. The user’s Azure AD identifier is still being confirmed. Less than 24 hours later, another alert was raised for a sign-in attempt that Microsoft threat intelligence flagged as coming from a known malicious source.'
      question: 'According to the later alert about the risky sign-in, which IP address was recognized as malicious?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'On 2024-07-17 11:34:48.784934+00:00, a suspicious inbox rule manipulation was detected for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, on 2024-07-18 13:48:02.042756+00:00, a sign-in was observed from the malicious IP address `170.54.121.63`, suggesting that the same threat actor may have gained access to the mailbox.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
