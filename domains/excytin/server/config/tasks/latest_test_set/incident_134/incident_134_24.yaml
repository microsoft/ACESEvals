tasks:
  - task_id: incident_134_latest_test_set_task_24
    title: incident_134_latest_test_set_task_24
    description: 'According to the later "Malicious IP address" sign-in alert raised on 2024-07-18, which IP address was identified as malicious?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a Business Email Compromise (BEC) attempt, security telemetry showed that user "Nina Park" (SID S-1-5-21-1874151667-3554330288-105586563-1715) was associated with suspicious outbound emails. These emails were sent from sender address raphaelt@vnevado.alpineskihouse.co to the mailbox nathan@avoriaz.alpineskihouse.co and originated from the IP address 237.7.81.122 at 2024-07-17 11:55:04 UTC. This activity triggered the alert titled “Suspicious emails sent by BEC-related user.” Shortly after, a separate alert indicated that a sign-in had occurred from an IP address categorized as malicious.'
      question: 'According to the later "Malicious IP address" sign-in alert raised on 2024-07-18, which IP address was identified as malicious?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account, identified by AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`, was observed sending suspicious emails that are indicative of a BEC attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Soon after, there was a sign-in from the malicious IP address `170.54.121.63`, reinforcing the possibility that the same account is compromised.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
