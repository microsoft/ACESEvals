tasks:
  - task_id: incident_134_latest_test_set_task_30
    title: incident_134_latest_test_set_task_30
    description: 'According to the follow-up alert titled “Account compromised following a password-spray attack,” what is the display name of the user account that was successfully compromised?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 18 2024 at 14:36 UTC, Microsoft Defender generated a “Password Spray” alert after multiple sign-in attempts were observed against Azure AD user ID e036dee7-fa23-42ef-a019-468c8d3401f1 coming from the external IP address 170.54.121.63. Roughly 17 minutes later, a follow-up alert indicated that one of the targeted accounts had actually been accessed from an unusual location and browser, suggesting it was successfully compromised during the same password-spray campaign.'
      question: 'According to the follow-up alert titled “Account compromised following a password-spray attack,” what is the display name of the user account that was successfully compromised?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Nina Park'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A password spray attack was detected originating from IP Address `170.54.121.63` (Field: Address).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Following the spray, the user account with Name `Nina Park` (Field: Name) was reported as compromised.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
