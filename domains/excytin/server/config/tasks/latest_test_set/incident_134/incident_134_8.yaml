tasks:
  - task_id: incident_134_latest_test_set_task_8
    title: incident_134_latest_test_set_task_8
    description: 'According to the alert titled “A potentially malicious URL click was detected” raised at 10:59 UTC on 17 July 2024, what is the exact URL that the user clicked?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 17 July 2024, Microsoft security controls reported that an email from "alyssat@vnevado.alpineskihouse.co" to "raphaelt@vnevado.alpineskihouse.co" was retroactively cleaned because it carried a suspicious link hosted in an Azure Container Apps domain that includes the string "orangecliff". A few minutes earlier, a separate alert (‘A potentially malicious URL click was detected’) indicated that a user had actually clicked this same malicious link before the message was removed.'
      question: 'According to the alert titled “A potentially malicious URL click was detected” raised at 10:59 UTC on 17 July 2024, what is the exact URL that the user clicked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Step 1 – Malicious URL click detected (Field: Url, Value: http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/). A user in the tenant clicked this suspicious link.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Step 2 – Malicious-URL email removed (Field: AadUserId, Value: e036dee7-fa23-42ef-a019-468c8d3401f1). The mailbox belonging to this Azure AD user had the email with that URL recalled after delivery.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
