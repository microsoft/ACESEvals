tasks:
  - task_id: incident_134_latest_test_set_task_1
    title: incident_134_latest_test_set_task_1
    description: 'According to the subsequent “BEC financial fraud” alert, what IP address was tied to the suspicious activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 17th, 2024 at 10:59 UTC, our monitoring detected that user raphaelt@vnevado.alpineskihouse.co clicked a link later confirmed as malicious (hosted on ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io). The click originated from sender alyssat@vnevado.alpineskihouse.co via IP 254.241.243.229. Roughly 35 minutes after this event, Microsoft security signaled a new alert titled “BEC financial fraud,” noting that an attacker had created a covert inbox rule in a risky Azure AD session—suggesting an attempt at business email compromise against the same mailbox.'
      question: 'According to the subsequent “BEC financial fraud” alert, what IP address was tied to the suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '237.7.81.122'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account with Sid `S-1-5-21-1874151667-3554330288-105586563-1715` clicked a malicious URL on 2024-07-17 10:59:14.787387+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, on 2024-07-17 11:34:48.803827+00:00, a suspicious inbox rule suggesting BEC financial fraud was created from the IP address `237.7.81.122`.'
        objective: Identify key details related to the potential compromise that might
