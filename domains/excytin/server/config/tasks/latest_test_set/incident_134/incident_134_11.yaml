tasks:
  - task_id: incident_134_latest_test_set_task_11
    title: incident_134_latest_test_set_task_11
    description: 'In the subsequent alert titled “Suspicious emails sent by BEC-related user,” which email address was listed as the sender of the suspicious messages?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-17 at 11:34:48 UTC, an alert flagged a suspicious manipulation of a user’s inbox rules through a cloud application identified by AppId 20893. This activity indicates a potential compromise of the mailbox and was the first sign of a possible business-email-compromise (BEC) attempt.'
      question: 'In the subsequent alert titled “Suspicious emails sent by BEC-related user,” which email address was listed as the sender of the suspicious messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'raphaelt@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule was detected for the account with Sid `S-1-5-21-1874151667-3554330288-105586563-1715`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious emails were subsequently sent by a BEC-related user with Sender `raphaelt@vnevado.alpineskihouse.co`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
