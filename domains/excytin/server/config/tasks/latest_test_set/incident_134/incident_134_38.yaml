tasks:
  - task_id: incident_134_latest_test_set_task_38
    title: incident_134_latest_test_set_task_38
    description: 'According to the ‘Suspicious inbox manipulation rule’ alert generated at 11:34 UTC on 2024-07-17, which IP address was associated with the suspicious activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-17 at 10:59 UTC, the security platform reported that user raphaelt@vnevado.alpineskihouse.co clicked the potentially malicious link http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/ delivered from sender alyssat@vnevado.alpineskihouse.co (originating IP 254.241.243.229). This activity raised the alert “A potentially malicious URL click was detected.” Roughly 35 minutes later, the same investigation surfaced a second alert titled “Suspicious inbox manipulation rule,” indicating that someone may have gained access to the user’s mailbox and created rules to hide or exfiltrate email.'
      question: 'According to the ‘Suspicious inbox manipulation rule’ alert generated at 11:34 UTC on 2024-07-17, which IP address was associated with the suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '237.7.81.122'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'User account Name `Nina Park` clicked a potentially malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious inbox manipulation rule was later created from IP Address `237.7.81.122`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
