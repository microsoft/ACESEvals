tasks:
  - task_id: incident_134_latest_test_set_task_45
    title: incident_134_latest_test_set_task_45
    description: 'According to the alert about suspicious emails sent by a BEC-related user, what email address appears as the sender of those suspect messages?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a recent account-compromise incident, we observed multiple failed logon attempts culminating in a successful sign-in from the unusual IP address 170.54.121.63. This password-spray activity suggests an attacker may have gained control of a user account. Shortly before this, Microsoft 365 generated a separate alert titled “Suspicious emails sent by BEC-related user,” indicating that the same compromised identity was leveraged to send potentially fraudulent messages.'
      question: 'According to the alert about suspicious emails sent by a BEC-related user, what email address appears as the sender of those suspect messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'raphaelt@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'On 2024-07-18 14:54:18.741032+00:00 an attacker successfully signed in using the compromised account (Email: `Nina Park@vnevado.alpineskihouse.co`) following a password-spray attack.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Earlier, on 2024-07-17 11:55:04.449509+00:00, the environment recorded suspicious outbound email activity, with the mail message entity showing Sender: `raphaelt@vnevado.alpineskihouse.co`, consistent with a potential business-email-compromise operation.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
