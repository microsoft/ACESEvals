tasks:
  - task_id: incident_134_latest_test_set_task_26
    title: incident_134_latest_test_set_task_26
    description: 'What is the full URL that was identified as malicious in the alert about the potentially harmful link click?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a Business Email Compromise (BEC) attempt, we observed that the user raphaelt@vnevado.alpineskihouse.co sent suspicious emails from IP 237.7.81.122 to the mailbox nathan@avoriaz.alpineskihouse.co on 2024-07-17. Shortly before these emails were sent, security telemetry raised another alert indicating that a user clicked a link later classified as malicious. The details of that link were captured in the alert titled “A potentially malicious URL click was detected.”'
      question: 'What is the full URL that was identified as malicious in the alert about the potentially harmful link click?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Step 1 – account.Email `Nina Park@vnevado.alpineskihouse.co`: Suspicious emails were sent from this user, who is suspected to be involved in a BEC fraud attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Step 2 – url.Url `http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`: A potentially malicious link was clicked, suggesting further compromise activity connected to the previously flagged user.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
