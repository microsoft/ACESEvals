tasks:
  - task_id: incident_134_latest_test_set_task_34
    title: incident_134_latest_test_set_task_34
    description: 'What is the public IP address that was identified as malicious in connection with the suspicious sign-in for user ID e036dee7-fa23-42ef-a019-468c8d3401f1?'
    inherit_shared: true
    initial_context:
      incident_context: 'An ongoing investigation revealed a password-spray attack targeting the Azure AD account with user ID e036dee7-fa23-42ef-a019-468c8d3401f1. During correlation of events, analysts noticed that one of the sign-ins associated with this account originated from an IP address later classified as malicious.'
      question: 'What is the public IP address that was identified as malicious in connection with the suspicious sign-in for user ID e036dee7-fa23-42ef-a019-468c8d3401f1?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A password spray attack was detected originating from IP `170.54.121.63` (Field: Address).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The same IP address `170.54.121.63` (Field: Address) was later identified as a known malicious source during a sign-in attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
