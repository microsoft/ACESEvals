tasks:
  - task_id: incident_134_latest_test_set_task_54
    title: incident_134_latest_test_set_task_54
    description: 'Which Azure AD user object ID (AadUserId) was associated with the suspicious sign-in that originated from the anonymous IP address?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-18 an automated password-spray attack was detected against our tenant, originating from the external IP address 170.54.121.63. While reviewing related activity, analysts noticed that the same infrastructure appears in an earlier alert flagging sign-ins made through an anonymous network (e.g., Tor/VPN). The two alerts are assumed to be linked, suggesting the adversary first tested credentials via an anonymised connection before performing the large-scale spray from 170.54.121.63.'
      question: 'Which Azure AD user object ID (AadUserId) was associated with the suspicious sign-in that originated from the anonymous IP address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e036dee7-fa23-42ef-a019-468c8d3401f1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'e036dee7-fa23-42ef-a019-468c8d3401f1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A password spray attack was detected originating from IP address `170.54.121.63` (Field: Address).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A sign-in from an anonymous IP address was performed by the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` (Field: AadUserId).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
