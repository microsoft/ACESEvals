tasks:
  - task_id: incident_134_latest_test_set_task_51
    title: incident_134_latest_test_set_task_51
    description: 'According to the alert about the malicious URL click, what is the name of the user who clicked the link?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 17 2024 at 11:01 UTC, a sign-in was observed from the anonymous IP address 170.54.121.63, triggering an “Anonymous IP address” alert. Investigators suspect the same session may be related to another alert raised two minutes earlier for a user who clicked a URL later determined to be malicious.'
      question: 'According to the alert about the malicious URL click, what is the name of the user who clicked the link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Nina Park'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account sign-in anomaly detected: The user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` signed in from an anonymous IP address (e.g., Tor or VPN) at 2024-07-17 11:01:27.633644+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Malicious‐link interaction detected: The account with Name `Nina Park` clicked a potentially malicious URL at 2024-07-17 10:59:14.787387+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
