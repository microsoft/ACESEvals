tasks:
  - task_id: incident_134_latest_test_set_task_6
    title: incident_134_latest_test_set_task_6
    description: 'According to the alert about the email messages that were removed because they contained a malicious URL, what IP address was identified as the sender of those messages?'
    inherit_shared: true
    initial_context:
      incident_context: 'While investigating a Business Email Compromise (BEC) attempt, we observed that user raphaelt@vnevado.alpineskihouse.co sent suspicious emails from IP address 237.7.81.122 to nathan@avoriaz.alpineskihouse.co. Shortly afterward, a separate alert reported that several email messages containing malicious URLs were removed after they had already been delivered.'
      question: 'According to the alert about the email messages that were removed because they contained a malicious URL, what IP address was identified as the sender of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '254.241.243.229'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '254.241.243.229'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-17 11:04:19.964546+00:00, email messages containing a malicious URL were traced to the sender IP `254.241.243.229` (Field: SenderIP, Type: mailmessage).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, at 2024-07-17 11:55:04.449509+00:00, suspicious emails were sent by a potentially compromised user whose account SID is `S-1-5-21-1874151667-3554330288-105586563-1715` (Field: Sid, Type: account).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
