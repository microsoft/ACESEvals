tasks:
  - task_id: incident_134_latest_test_set_task_17
    title: incident_134_latest_test_set_task_17
    description: 'According to the later "Malicious IP address" alert for user e036dee7-fa23-42ef-a019-468c8d3401f1, which IP address was identified as malicious during the sign-in attempt on 2024-07-18?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation revealed that the Azure AD user with ID e036dee7-fa23-42ef-a019-468c8d3401f1 triggered an alert on 2024-07-17 after signing in from an anonymous network location. Roughly twenty-four hours later, the very same user account generated another alert indicating a sign-in from an IP address that Microsoft threat intelligence classifies as malicious.'
      question: 'According to the later "Malicious IP address" alert for user e036dee7-fa23-42ef-a019-468c8d3401f1, which IP address was identified as malicious during the sign-in attempt on 2024-07-18?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` signed in from an anonymous IP address.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A sign-in attempt was later observed from the malicious IP address `170.54.121.63` (Address).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
