tasks:
  - task_id: incident_134_latest_test_set_task_27
    title: incident_134_latest_test_set_task_27
    description: 'What is the primary email (mailbox) address associated with the user account that sent the suspicious BEC-related emails following the sign-in from the malicious IP 170.54.121.63?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent alert flagged a sign-in originating from the malicious IP address 170.54.121.63. Investigators noted that this IP was later linked to a user account suspected of Business Email Compromise (BEC) activity. Shortly after the sign-in, a separate alert reported that the same user account sent out multiple suspicious emails, indicating a potential compromise of the user’s mailbox.'
      question: 'What is the primary email (mailbox) address associated with the user account that sent the suspicious BEC-related emails following the sign-in from the malicious IP 170.54.121.63?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'nathan@avoriaz.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'nathan@avoriaz.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` signed in from a known malicious IP address on 2024-07-18 13:48:02 UTC.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious emails were subsequently sent from the mailbox `nathan@avoriaz.alpineskihouse.co` on 2024-07-17 11:55:04 UTC, indicating possible BEC-related compromise.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
