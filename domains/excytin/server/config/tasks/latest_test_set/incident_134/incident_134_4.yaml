tasks:
  - task_id: incident_134_latest_test_set_task_4
    title: incident_134_latest_test_set_task_4
    description: 'Which user account (display name) was ultimately correlated to the suspicious inbox-rule manipulation activity described?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-17 at 11:34 UTC, Defender flagged a "Suspicious inbox manipulation rule" alert. The activity originated from IP address 237.7.81.122 via cloud application ID 20893 and was tied to an identity with AAD user ID e036dee7-fa23-42ef-a019-468c8d3401f1 (SID S-1-5-21-1874151667-3554330288-105586563-1715). During further investigation, analysts correlated these details to a specific user account.'
      question: 'Which user account (display name) was ultimately correlated to the suspicious inbox-rule manipulation activity described?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Nina Park'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule was detected for the account with Name `Nina Park`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
