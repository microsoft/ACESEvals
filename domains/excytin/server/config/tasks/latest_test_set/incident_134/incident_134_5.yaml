tasks:
  - task_id: incident_134_latest_test_set_task_5
    title: incident_134_latest_test_set_task_5
    description: 'During the BEC financial-fraud alert that involved the creation of a suspicious inbox rule, from which external IP address did the risky Azure Active Directory session originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security monitoring has detected a password spray attack originating from the external IP address 170.54.121.63 on 2024-07-18. The attack involved attempts against an Azure AD account (user ID withheld) and is being investigated as a possible precursor to further compromise. Shortly before this, another alert in the same incident indicated that an adversary created a hidden-rule in a mailbox during a risky Azure Active Directory session, suggesting a potential Business Email Compromise (BEC) scenario.'
      question: 'During the BEC financial-fraud alert that involved the creation of a suspicious inbox rule, from which external IP address did the risky Azure Active Directory session originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '237.7.81.122'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious inbox rule was created from IP address `237.7.81.122` (Field: Address) during a risky Azure AD session, pointing to a possible BEC financial-fraud attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'One day later, a password-spray attack was detected against the Azure AD account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` (Field: AadUserId).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
