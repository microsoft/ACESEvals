    description: 'What is the Security Identifier (SID) of the account that clicked the malicious URL?'
    inherit_shared: true
    initial_context:
      incident_context: 'During investigation of a password spray attack originating from IP address 170.54.121.63, we found that the same user account later triggered another alert: the user clicked on a link that was subsequently classified as malicious. Analysts need to pivot from the original password-spray alert to this malicious-URL-click alert to fully scope the incident.'
      question: 'What is the Security Identifier (SID) of the account that clicked the malicious URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1874151667-3554330288-105586563-1715'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-1-5-21-1874151667-3554330288-105586563-1715'
      scoring:
        max_score: 1.0
