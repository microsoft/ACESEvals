tasks:
  - task_id: incident_166_latest_test_set_task_16
    title: incident_166_latest_test_set_task_16
    description: 'According to the ‘Suspicious inbox manipulation rule’ alert raised at 10:00 UTC, what is the App ID of the cloud application that performed the mailbox rule change?'
    inherit_shared: true
    initial_context:
      incident_context: 'An alert was raised at 08:45 UTC on 2024-07-22 after the external IP address 95.202.65.202 was used to sign in via an anonymous network, suggesting a potential account compromise. Later the same morning, a second alert indicated that the same user’s mailbox had a suspicious inbox-rule change, consistent with an attacker trying to hide or exfiltrate email. Security telemetry shows this rule change was carried out through a specific cloud application (its identifier is not shown here).'
      question: 'According to the ‘Suspicious inbox manipulation rule’ alert raised at 10:00 UTC, what is the App ID of the cloud application that performed the mailbox rule change?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '20893'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in was made from an anonymous IP address by the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, a suspicious inbox manipulation rule was created through the cloud application with AppId `20893`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
