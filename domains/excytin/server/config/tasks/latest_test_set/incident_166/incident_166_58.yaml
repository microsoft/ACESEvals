    title: incident_166_latest_test_set_task_58
    description: 'What is the Security Identifier (SID) of the account associated with the later “Suspicious inbox manipulation rule” that occurred at 10:00 UTC on 22 July 2024?'
    inherit_shared: true
    initial_context:
      incident_context: 'At 09:49 UTC on 22 July 2024, Microsoft Exchange Online reported a “Suspicious inbox manipulation rule” created in the mailbox of Jordan P (laylaw@vnevado.alpineskihouse.co). The action appeared to come from several unusual IP addresses (95.202.65.202, 192.238.237.190 and 180.144.153.174) via the Microsoft 365 / Exchange Online cloud applications (App ID 11161). Investigation shows this alert is linked to another inbox-rule manipulation that occurred shortly afterwards in the same incident, involving the same mailbox but referencing the underlying directory account object rather than the email address.'
      question: 'What is the Security Identifier (SID) of the account associated with the later “Suspicious inbox manipulation rule” that occurred at 10:00 UTC on 22 July 2024?'
