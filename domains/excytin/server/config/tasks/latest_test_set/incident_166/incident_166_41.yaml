    description: 'According to the inbox-manipulation alert for Jordan P’s mailbox, from which IP address did the suspicious activity originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation was opened after Microsoft Entra ID reported a suspicious SAP authentication: someone accessed the SAP cloud application (AppId 100) from the external IP 107.253.5.27. Although the responsible Azure AD user account is still being identified, this sign-in suggests the attacker may already have control of that identity. Shortly after, a second alert was raised – a suspicious inbox rule named "ITCleanup" was created in the mailbox of Jordan P (laylaw@vnevado.alpineskihouse.co), indicating possible post-compromise activity that could be used for phishing or data exfiltration.'
      question: 'According to the inbox-manipulation alert for Jordan P’s mailbox, from which IP address did the suspicious activity originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
