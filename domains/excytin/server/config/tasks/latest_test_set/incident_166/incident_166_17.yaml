tasks:
  - task_id: incident_166_latest_test_set_task_17
    title: incident_166_latest_test_set_task_17
    description: 'Analysts have now detected a suspicious inbox manipulation rule created by this user. What is the primary email address of the mailbox where this rule was configured?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an ongoing investigation, we observed a BEC-related user signing in to an SAP cloud application (App ID 100) from the external IP address 107.253.5.27. This activity is considered suspicious because the same user account is connected to previous business-email-compromise alerts and might be attempting to access sensitive financial data.'
      question: 'Analysts have now detected a suspicious inbox manipulation rule created by this user. What is the primary email address of the mailbox where this rule was configured?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'laylaw@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account (Name: `Jordan P`) signed in to SAP in a suspicious manner, suggesting possible business-email-compromise activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Mailbox (MailboxPrimaryAddress: `laylaw@vnevado.alpineskihouse.co`) had a suspicious inbox rule (''ITCleanup'' moving mail to ''RSS Feeds''), indicating that the account may be compromised and being used for malicious email manipulation.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
