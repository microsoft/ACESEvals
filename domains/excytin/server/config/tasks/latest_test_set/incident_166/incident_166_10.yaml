tasks:
  - task_id: incident_166_latest_test_set_task_10
    title: incident_166_latest_test_set_task_10
    description: 'What is the IPv4 address reported in the linked "Anonymous IP address" alert for this user?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we observed that user "Jordan P" (email: Jordan P@vnevado.alpineskihouse.co, SID: S-1-5-21-1740051960-3534030288-108486866-1602) generated the alert "Suspicious SAP authentication" at 2024-07-22 12:59:26 UTC. The SAP sign-in originated from IP 107.253.5.27 via cloud application AppId 100. A related alert entitled "Anonymous IP address"—triggered earlier the same day—indicates that the same user signed in through an anonymizing service (for example, Tor or a VPN).'
      question: 'What is the IPv4 address reported in the linked "Anonymous IP address" alert for this user?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A risky sign-in to the SAP application was performed by the Azure AD account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'That sign-in originated from the anonymous IP address with Address `95.202.65.202`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
