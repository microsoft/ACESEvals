    description: 'According to the "Password Spray" alert triggered on 2024-07-23, which IP address was identified as the source of the attack?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation was initiated after detecting a suspicious inbox manipulation rule on 2024-07-22 that was associated with the user account "Jordan P" (email: Jordan P@vnevado.alpineskihouse.co, SID: S-1-5-21-1740051960-3534030288-108486866-1602). The activity originated from the IP address 255.246.85.58 and was tied to cloud application ID 20893. On the following day, 2024-07-23, the security platform raised an additional alert named "Password Spray," indicating a credential-stuffing attempt against the environment.'
      question: 'According to the "Password Spray" alert triggered on 2024-07-23, which IP address was identified as the source of the attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
