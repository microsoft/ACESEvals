tasks:
  - task_id: incident_166_latest_test_set_task_81
    title: incident_166_latest_test_set_task_81
    description: 'Which user’s email account was identified as having a suspicious inbox manipulation rule following the password-spray activity from IP 95.202.65.202?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security monitoring has flagged a Password Spray attack originating from the external IP address 95.202.65.202 on 2024-07-23. This attack is believed to target corporate user accounts and may have led to further malicious activity. During the investigation, analysts discovered a related alert indicating that an attacker created a suspicious inbox manipulation rule on the same day, suggesting the attacker might have gained access to one of our mailboxes. The exact user account affected by the mailbox rule change needs to be determined to continue containment and remediation efforts.'
      question: 'Which user’s email account was identified as having a suspicious inbox manipulation rule following the password-spray activity from IP 95.202.65.202?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A password spray attack was detected targeting the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` at 2024-07-23 14:23:51.925093+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious inbox manipulation rules were created for the email account `Jordan P@vnevado.alpineskihouse.co` at 2024-07-22 10:00:07.502771+00:00, indicating possible unauthorized mailbox access.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
