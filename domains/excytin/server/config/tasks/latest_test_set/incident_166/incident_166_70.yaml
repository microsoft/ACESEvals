tasks:
  - task_id: incident_166_latest_test_set_task_70
    title: incident_166_latest_test_set_task_70
    description: 'According to the "Anonymous IP address" alert generated on 2024-07-22, from which IP address did the suspicious sign-in originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-23 our security monitoring flagged a "Password Spray" attempt coming from the external IP address 95.202.65.202 against an Azure AD account. During triage we noticed that the very same user account had generated an "Anonymous IP address" sign-in alert on the previous day, suggesting access through a Tor exit node or VPN.'
      question: 'According to the "Anonymous IP address" alert generated on 2024-07-22, from which IP address did the suspicious sign-in originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '192.238.237.190'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'On 2024-07-22 09:11:31.290020+00:00, a sign-in attempt was made from the anonymous IP address `192.238.237.190` (Field: Address, Type: ip), indicating the use of TOR or an anonymizing VPN.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'One day later, on 2024-07-23 14:23:51.925093+00:00, a Password Spray attack was detected against the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` (Field: AadUserId, Type: account), suggesting that the earlier anonymous connection may have been used to launch the credential-stuffing attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
