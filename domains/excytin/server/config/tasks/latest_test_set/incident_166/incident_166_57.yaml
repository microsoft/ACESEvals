    title: incident_166_latest_test_set_task_57
    description: 'What is the IP address that was the source of the password-spray attack associated with the compromised account belonging to Jordan P?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 23 2024 at 16:09 UTC, a “Possible BEC financial fraud” alert was raised for the user account “Jordan P” (Jordan P@vnevado.alpineskihouse.co). During the investigation, analysts discovered that this BEC alert is linked to an earlier “Password Spray” attack that occurred the same day. To understand the attack chain, they must identify the network location from which the password-spray originated.'
      question: 'What is the IP address that was the source of the password-spray attack associated with the compromised account belonging to Jordan P?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
