tasks:
  - task_id: incident_166_latest_test_set_task_72
    title: incident_166_latest_test_set_task_72
    description: 'According to the "Password Spray" alert triggered on 2024-07-23, what was the source IP address involved in that attack?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a Business Email Compromise (BEC) attempt, a user named "Jordan P" (email: Jordan P@vnevado.alpineskihouse.co, SID: S-1-5-21-1740051960-3534030288-108486866-1602) was observed creating a suspicious inbox rule while signed in from the IP address 255.246.85.58. The activity was flagged in a "BEC financial fraud" alert on 2024-07-22. The next day, a separate "Password Spray" alert was triggered, indicating that an attacker attempted to guess user credentials shortly after the initial BEC-related activity.'
      question: 'According to the "Password Spray" alert triggered on 2024-07-23, what was the source IP address involved in that attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
