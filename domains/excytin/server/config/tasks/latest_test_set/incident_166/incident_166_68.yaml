tasks:
  - task_id: incident_166_latest_test_set_task_68
    title: incident_166_latest_test_set_task_68
    description: 'During the suspicious SAP sign-in related to this BEC incident, what is the AppId of the cloud application the user accessed?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent business email compromise (BEC) investigation flagged user account "Jordan P" (AadUserId: 89e933b9-5b2e-4bd6-bcdf-033db707ef82) for possible financial-fraud activity. According to the initial alert, the attacker may be using the compromised mailbox of Jordan P to perpetrate fraud. Shortly before this, the same user reportedly signed in to the company’s SAP environment under suspicious circumstances, raising concern that the attacker is targeting sensitive financial data through a cloud application connected to SAP.'
      question: 'During the suspicious SAP sign-in related to this BEC incident, what is the AppId of the cloud application the user accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Possible BEC financial fraud was detected involving the account with field Email=`Jordan P@vnevado.alpineskihouse.co`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The same BEC-related user (Email=`Jordan P@vnevado.alpineskihouse.co`) then signed in suspiciously to the SAP cloud application with field AppId=`100`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
