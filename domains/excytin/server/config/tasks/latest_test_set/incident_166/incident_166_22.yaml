tasks:
  - task_id: incident_166_latest_test_set_task_22
    title: incident_166_latest_test_set_task_22
    description: 'Which user’s mailbox contained the suspicious inbox rule named "ITCleanup" that moved messages to the "RSS Feeds" folder?'
    inherit_shared: true
    initial_context:
      incident_context: 'A sign-in to Microsoft Entra ID was observed coming from the anonymous IP address 192.238.237.190. The sign-in was associated with the cloud identity whose AadUserId is 89e933b9-5b2e-4bd6-bcdf-033db707ef82, raising an "Anonymous IP address" alert. During the same incident investigation we also found that an attacker created an inbox rule named "ITCleanup" which automatically moves incoming messages to the folder "RSS Feeds"—a common technique used to hide malicious emails after compromise.'
      question: 'Which user’s mailbox contained the suspicious inbox rule named "ITCleanup" that moved messages to the "RSS Feeds" folder?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The user account `Jordan P` set up a suspicious inbox manipulation rule named ITCleanup, moving messages to the RSS Feeds folder, suggesting the mailbox may be compromised.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
