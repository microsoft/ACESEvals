tasks:
  - task_id: incident_166_latest_test_set_task_1
    title: incident_166_latest_test_set_task_1
    description: 'From the "Possible BEC financial fraud" alert raised on 23 July 2024, what is the Microsoft Entra user identifier (AadUserId) of the account implicated in the suspected BEC activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 22 July 2024 an alert titled "Suspicious SAP authentication" was raised after a risky sign-in from IP address 107.253.5.27 to the SAP cloud application (AppId 100). The following day, on 23 July 2024, a new alert "Possible BEC financial fraud" was generated, indicating that the same user account was now involved in activity characteristic of business email compromise (BEC) aimed at financial fraud.'
      question: 'From the "Possible BEC financial fraud" alert raised on 23 July 2024, what is the Microsoft Entra user identifier (AadUserId) of the account implicated in the suspected BEC activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A risky sign-in in Entra ID was followed by a suspicious SAP authentication from the account with Sid `S-1-5-21-1740051960-3534030288-108486866-1602`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was later involved in activity flagged as Possible BEC financial fraud.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
