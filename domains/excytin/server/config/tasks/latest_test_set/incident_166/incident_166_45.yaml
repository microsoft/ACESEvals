tasks:
  - task_id: incident_166_latest_test_set_task_45
    title: incident_166_latest_test_set_task_45
    description: 'According to the "Suspicious emails sent by BEC-related user" alert, what is the email address of the recipient to whom the suspicious messages were sent?'
    inherit_shared: true
    initial_context:
      incident_context: 'A password spray attack originating from the external IP address 95.202.65.202 was detected on 2024-07-23. Investigation shows that the same activity is linked to a user account which, one day earlier, triggered an alert titled "Suspicious emails sent by BEC-related user", indicating that the account may have been leveraged to conduct business-email-compromise (BEC)–style phishing. You need to review the details of that email-related alert to understand who was targeted.'
      question: 'According to the "Suspicious emails sent by BEC-related user" alert, what is the email address of the recipient to whom the suspicious messages were sent?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tony@avoriaz.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tony@avoriaz.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Password spray attack detected against account AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The compromised user subsequently sent suspicious emails to Recipient `tony@avoriaz.alpineskihouse.co`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
