    title: incident_166_latest_test_set_task_32
    description: 'When the BEC-related user signed in to SAP, what external IP address was the sign-in initiated from?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 22, a “Suspicious inbox manipulation rule” alert was raised after activity coming from cloud application ID 20893 and the external IP address 255.246.85.58. During the same investigation we discovered that the very same user later generated a “BEC-related user signed in to SAP” alert, indicating possible account compromise and unauthorized access to SAP resources.'
      question: 'When the BEC-related user signed in to SAP, what external IP address was the sign-in initiated from?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.253.5.27'
      scoring:
        max_score: 1.0
