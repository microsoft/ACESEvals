tasks:
  - task_id: incident_166_latest_test_set_task_37
    title: incident_166_latest_test_set_task_37
    description: 'According to the "Suspicious SAP authentication" alert, what is the AppId of the cloud application the attacker tried to access?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we observed an alert titled "Suspicious inbox manipulation rule" indicating that a user’s mailbox rules were altered from IP address 255.246.85.58 while interacting with cloud-application ID 20893. Later in the same incident, a related alert flagged a "Suspicious SAP authentication," suggesting that the (likely compromised) user account attempted to access an SAP environment. This latter alert involves a different cloud application than the first one.'
      question: 'According to the "Suspicious SAP authentication" alert, what is the AppId of the cloud application the attacker tried to access?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule was detected for the account with Sid `S-1-5-21-1740051960-3534030288-108486866-1602`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, a risky sign-in to SAP (cloud-application AppId `100`) was observed, indicating that the attacker may be using the compromised account to access sensitive enterprise resources.'
