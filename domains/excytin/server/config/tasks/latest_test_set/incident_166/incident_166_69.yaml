tasks:
  - task_id: incident_166_latest_test_set_task_69
    title: incident_166_latest_test_set_task_69
    description: 'According to the "Suspicious SAP authentication" alert raised at 13:19 UTC on 2024-07-22, what external IP address was used to sign in to SAP?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation you observed a sign-in coming from the anonymous IP address 95.202.65.202 at 08:45 UTC on 2024-07-22, which raised an "Anonymous IP address" alert. Several hours later the same risky user account reportedly accessed the organisation’s SAP environment, triggering a "Suspicious SAP authentication" alert.'
      question: 'According to the "Suspicious SAP authentication" alert raised at 13:19 UTC on 2024-07-22, what external IP address was used to sign in to SAP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.253.5.27'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` generated an ''Anonymous IP address'' alert on 2024-07-22 08:45:32.664841+00:00, indicating a sign-in attempt through an anonymizing service.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Several hours later, on 2024-07-22 13:19:46.630275+00:00, a ''Suspicious SAP authentication'' alert shows the same risky user accessing SAP from IP address `107.253.5.27`, confirming the attacker’s activity originated from that IP.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
