tasks:
  - task_id: incident_166_latest_test_set_task_62
    title: incident_166_latest_test_set_task_62
    description: 'What is the IP address that was flagged as the source of the Password Spray attack detected on 2024-07-23 at 14:23 UTC?'
    inherit_shared: true
    initial_context:
      incident_context: 'An alert was triggered on 2024-07-22 at 09:11 UTC after a sign-in was observed from the anonymous IP address 192.238.237.190. This activity is tied to the same user account that later became associated with a Password Spray attack detected on 2024-07-23. Investigators need to identify the external host that launched this later attack in order to update block lists and assess additional exposure.'
      question: 'What is the IP address that was flagged as the source of the Password Spray attack detected on 2024-07-23 at 14:23 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address using the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A password-spray attack was later observed coming from the IP address `95.202.65.202`.'
        objective: Identify key details related to the potential compromise that might
