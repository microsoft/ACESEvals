tasks:
  - task_id: incident_166_latest_test_set_task_8
    title: incident_166_latest_test_set_task_8
    description: 'Which email account is identified in the later "Possible BEC financial fraud" alert that appears to be the target of the fraud attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious inbox-manipulation rule, we observed that an adversary created an "ITCleanup" rule which moved messages into the "RSS Feeds" folder. This activity was logged in Exchange Online and involved several external IP addresses as well as the Office 365 cloud application. The initial alert indicates that the attacker may have gained access to a user mailbox and started preparing it for further fraudulent activity.'
      question: 'Which email account is identified in the later "Possible BEC financial fraud" alert that appears to be the target of the fraud attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule was created by the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating possible mailbox compromise.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, a possible BEC financial-fraud attempt was detected for the email account `Jordan P@vnevado.alpineskihouse.co`, suggesting the compromised mailbox is being abused.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
