tasks:
  - task_id: incident_166_latest_test_set_task_47
    title: incident_166_latest_test_set_task_47
    description: 'According to the follow-up alert about the suspicious SAP sign-in, what is the AppId of the cloud application that was accessed?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspected business-email-compromise (BEC) incident, we observed that the user account "laylaw@vnevado.alpineskihouse.co" created an unusual inbox rule named "ITCleanup" which automatically moves messages to the "RSS Feeds" folder. This activity originated from several external IP addresses and was performed through Microsoft Exchange Online and Office 365 cloud applications. Later in the same incident timeline, Microsoft Defender XDR generated another alert indicating that the same compromised user signed in to an SAP environment under suspicious circumstances.'
      question: 'According to the follow-up alert about the suspicious SAP sign-in, what is the AppId of the cloud application that was accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert 1 shows that the account (Field: Name, Value: `Jordan P`) created a suspicious inbox-manipulation rule named “ITCleanup”, indicating the user’s mailbox might be compromised.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, Alert 2 reveals that the same BEC-related user accessed the SAP cloud application (Field: AppId, Value: `100`) in a suspicious sign-in, suggesting the attacker is now abusing the compromised account to reach sensitive business systems.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
