    title: incident_166_latest_test_set_task_34
    description: 'What is the external IP address from which Jordan P’s risky sign-in to SAP was detected in the earlier “Suspicious SAP authentication” alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a business-email-compromise (BEC) incident, we observed that the account “Jordan P” (AadUserId 89e933b9-5b2e-4bd6-bcdf-033db707ef82) signed in to the organisation’s SAP environment in a suspicious manner at 14:09 UTC on 22 July 2024. Earlier the same day, a separate alert titled “Suspicious SAP authentication” had already been raised because the same risky user successfully authenticated to SAP from an external IP address that did not match the company’s normal network ranges.'
      question: 'What is the external IP address from which Jordan P’s risky sign-in to SAP was detected in the earlier “Suspicious SAP authentication” alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.253.5.27'
      scoring:
        max_score: 1.0
