    description: 'What IP address was used in the anonymous sign-in that is linked to the possible BEC attempt on Jordan P’s account?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a potential Business Email Compromise (BEC) financial-fraud attempt involving the user account "Jordan P" (email: Jordan P@vnevado.alpineskihouse.co, SID S-1-5-21-1740051960-3534030288-108486866-1602), analysts noticed that this activity is connected to an earlier alert that reported a sign-in from an anonymous IP address (for example via Tor or an anonymizing VPN). Identifying that source IP is critical to determine the origin of the suspicious access.'
      question: 'What IP address was used in the anonymous sign-in that is linked to the possible BEC attempt on Jordan P’s account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
