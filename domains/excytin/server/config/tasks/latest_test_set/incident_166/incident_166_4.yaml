tasks:
  - task_id: incident_166_latest_test_set_task_4
    title: incident_166_latest_test_set_task_4
    description: 'According to the “Suspicious SAP authentication” alert, what is the AppId of the cloud application that was accessed?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed a sign-in originating from the anonymous IP address 95.202.65.202 that triggered an “Anonymous IP address” alert in Microsoft Entra ID. Further analysis showed that the same user account later generated a “Suspicious SAP authentication” alert after successfully signing in to the company’s SAP cloud service. This second alert indicates that an attacker may have taken control of the account to access sensitive financial data in SAP.'
      question: 'According to the “Suspicious SAP authentication” alert, what is the AppId of the cloud application that was accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account (AadUserId: `89e933b9-5b2e-4bd6-bcdf-033db707ef82`) was observed signing in from an anonymous IP address.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The same account (AadUserId: `89e933b9-5b2e-4bd6-bcdf-033db707ef82`) then performed a suspicious authentication to the SAP cloud application (AppId: `100`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
