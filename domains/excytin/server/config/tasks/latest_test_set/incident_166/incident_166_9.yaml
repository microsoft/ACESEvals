tasks:
  - task_id: incident_166_latest_test_set_task_9
    title: incident_166_latest_test_set_task_9
    description: 'To correlate on-premises account information with cloud activity, what is the Azure AD (AadUserId) associated with the account involved in the possible BEC fraud?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a recent investigation, a "Possible BEC financial fraud" alert was raised. The alert points to suspicious activity involving the user account "Jordan P" (email: Jordan P@vnevado.alpineskihouse.co, SID: S-1-5-21-1740051960-3534030288-108486866-1602). Analysts suspect that an attacker may be attempting to execute business-email-compromise-style financial fraud using this identity.'
      question: 'To correlate on-premises account information with cloud activity, what is the Azure AD (AadUserId) associated with the account involved in the possible BEC fraud?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Detected possible BEC-related financial fraud activity involving the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
