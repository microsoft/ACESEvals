tasks:
  - task_id: incident_166_latest_test_set_task_65
    title: incident_166_latest_test_set_task_65
    description: 'According to the ''Suspicious SAP authentication'' alert, what is the AppId of the cloud application the attacker accessed?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security monitoring has flagged a password-spray attack originating from the external IP address 95.202.65.202. Subsequent investigation shows that the same user account (currently unidentified) later triggered a ''Suspicious SAP authentication'' alert after signing in to an SAP cloud application, suggesting the attacker may now be attempting to access sensitive financial data.'
      question: 'According to the ''Suspicious SAP authentication'' alert, what is the AppId of the cloud application the attacker accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A Password Spray attack was detected on 2024-07-23 14:23:51Z against the account whose AadUserId is `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
