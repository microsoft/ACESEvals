tasks:
  - task_id: incident_166_latest_test_set_task_78
    title: incident_166_latest_test_set_task_78
    description: 'According to the related “Anonymous IP address” alert, from which IP address did the risky sign-in originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-22 at 13:19 UTC, a “Suspicious SAP authentication” alert was raised when the user account “Jordan P” (email: Jordan P@vnevado.alpineskihouse.co, SID S-1-5-21-1740051960-3534030288-108486866-1602) accessed an SAP application (App ID 100) from the external IP address 107.253.5.27. Investigation shows that this user was also involved in an earlier sign-in that Microsoft Entra ID labeled as coming from an anonymous network source (for example, via Tor or a VPN).'
      question: 'According to the related “Anonymous IP address” alert, from which IP address did the risky sign-in originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A risky sign-in was detected where the user account with field AadUserId and value `89e933b9-5b2e-4bd6-bcdf-033db707ef82` authenticated to SAP.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'This authentication request came from an anonymous IP address with field Address and value `95.202.65.202`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
