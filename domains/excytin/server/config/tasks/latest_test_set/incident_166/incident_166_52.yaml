    description: 'What was the anonymous IP address from which the 08:45:32 UTC sign-in originated?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious inbox manipulation rule was detected on 2024-07-22 at 10:00:07 UTC for the user "Jordan P" (email "Jordan P@vnevado.alpineskihouse.co", SID S-1-5-21-1740051960-3534030288-108486866-1602). The activity was performed through cloud application ID 20893 and came from IP address 255.246.85.58. Correlation with other alerts shows that, earlier the same morning at 08:45:32 UTC, the same user account triggered an "Anonymous IP address" sign-in alert, indicating use of a privacy-enhancing service such as Tor or a VPN.'
      question: 'What was the anonymous IP address from which the 08:45:32 UTC sign-in originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
