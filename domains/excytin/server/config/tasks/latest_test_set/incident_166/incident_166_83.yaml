      incident_context: 'A “BEC financial fraud” alert was raised after the user account "Jordan P" (AadUserId 89e933b9-5b2e-4bd6-bcdf-033db707ef82, SID S-1-5-21-1740051960-3534030288-108486866-1602) created a suspicious inbox rule during a risky Azure Active Directory session. This activity suggests a possible business-email-compromise attempt aimed at financial fraud.'
      question: 'Shortly after the inbox-rule creation, sign-in telemetry shows the same account connecting from an external IP address that does not belong to the corporate network. What is that IP address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
