tasks:
  - task_id: incident_166_latest_test_set_task_49
    title: incident_166_latest_test_set_task_49
    description: 'From which external IP address did the suspicious SAP sign-in associated with the BEC-related alert originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent Password Spray alert shows multiple failed authentication attempts originating from the external IP address 95.202.65.202. The attempts were directed at an Azure AD account (user identifier not yet confirmed). Investigation reveals that the same user account later generated another alert: “BEC-related user signed in to SAP,” indicating a potentially compromised account accessing sensitive SAP resources. You need to verify the source network location of this later SAP sign-in to understand the attacker’s movement.'
      question: 'From which external IP address did the suspicious SAP sign-in associated with the BEC-related alert originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.253.5.27'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'BEC-related user signed in to SAP from suspicious IP address (Field: Address, Value: 107.253.5.27).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
