      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user account with Sid `S-1-5-21-1740051960-3534030288-108486866-1602` (field: Sid) that is already linked to Business Email Compromise (BEC) activity suspiciously signed in to SAP, indicating possible attacker control and access to sensitive financial data.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
