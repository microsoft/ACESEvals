tasks:
  - task_id: incident_166_latest_test_set_task_54
    title: incident_166_latest_test_set_task_54
    description: 'According to the related BEC financial-fraud alert, which IP address was used when the attacker created the malicious inbox rule?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious SAP authentication was detected on July 22 2024. The sign-in originated from IP address 107.253.5.27 against cloud application ID 100. The same investigation linked this event to a subsequent Business Email Compromise (BEC) attempt, where an inbox rule was created from a risky Azure AD session to hide incoming emails and facilitate financial fraud.'
      question: 'According to the related BEC financial-fraud alert, which IP address was used when the attacker created the malicious inbox rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '255.246.85.58'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` signed in to SAP in a risky manner, triggering the ''Suspicious SAP authentication'' alert at 2024-07-22 13:19:46.630275+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, the ''BEC financial fraud'' alert showed that a suspicious inbox rule was created from IP address `255.246.85.58`, indicating a potential business email compromise attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
