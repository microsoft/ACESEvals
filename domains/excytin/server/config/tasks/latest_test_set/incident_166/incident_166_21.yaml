tasks:
  - task_id: incident_166_latest_test_set_task_21
    title: incident_166_latest_test_set_task_21
    description: 'Subsequently, the same user was flagged for sending suspicious emails associated with a BEC attempt. From which IP address were these emails sent?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we identified a risky sign-in to the SAP cloud application (AppId 100) originating from IP address 107.253.5.27. This sign-in generated the alert “Suspicious SAP authentication,” indicating the user account may have been compromised and could be exploring SAP data for malicious purposes.'
      question: 'Subsequently, the same user was flagged for sending suspicious emails associated with a BEC attempt. From which IP address were these emails sent?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '255.246.85.58'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account (Email: Jordan P@vnevado.alpineskihouse.co) signed in to SAP via a risky Microsoft Entra ID session, indicating possible compromise.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious emails connected to a BEC attempt were sent from IP address (Address: 255.246.85.58), showing potential malicious activity originating from that source.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
