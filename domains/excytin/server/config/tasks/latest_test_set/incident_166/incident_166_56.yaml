tasks:
  - task_id: incident_166_latest_test_set_task_56
    title: incident_166_latest_test_set_task_56
    description: 'During the later “Suspicious SAP authentication” alert in the same incident, from which public IP address did the risky user sign in to the SAP application?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 22, 2024 at 09:49 UTC, an alert titled “Suspicious inbox manipulation rule” was raised. The mailbox of user Jordan P (laylaw@vnevado.alpineskihouse.co) had a new rule named “ITCleanup” that moved messages to the “RSS Feeds” folder, suggesting the account might have been compromised. Investigation showed multiple external IP addresses (for example 95.202.65.202, 192.238.237.190, 180.144.153.174, 255.246.85.58) interacting with the account through Microsoft Exchange Online (AppId 20893) and Office 365 (AppId 11161). Analysts are now reviewing subsequent alerts to trace the attacker’s activities within the environment.'
      question: 'During the later “Suspicious SAP authentication” alert in the same incident, from which public IP address did the risky user sign in to the SAP application?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.253.5.27'
      scoring:
        max_score: 1.0
