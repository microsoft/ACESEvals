        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule named ITCleanup was created in the mailbox of the user whose account has Sid `S-1-5-21-1740051960-3534030288-108486866-1602`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
