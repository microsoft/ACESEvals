tasks:
  - task_id: incident_166_latest_test_set_task_25
    title: incident_166_latest_test_set_task_25
    description: 'A short time earlier on the same day, the user’s mailbox had a rule named “ITCleanup” created to move messages into the “RSS Feeds” folder. From which external IP address did this earlier inbox-rule creation originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent investigation identified that at 10:00 UTC on July 22, 2024, the mailbox of user Jordan P (account SID S-1-5-21-1740051960-3534030288-108486866-1602) was accessed via cloud application 20893 from the external IP address 255.246.85.58. During that session, a suspicious inbox rule was added that could allow an attacker to hide or redirect messages.'
      question: 'A short time earlier on the same day, the user’s mailbox had a rule named “ITCleanup” created to move messages into the “RSS Feeds” folder. From which external IP address did this earlier inbox-rule creation originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '192.238.237.190'
      scoring:
        max_score: 1.0
