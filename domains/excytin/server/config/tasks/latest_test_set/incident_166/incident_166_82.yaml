tasks:
  - task_id: incident_166_latest_test_set_task_82
    title: incident_166_latest_test_set_task_82
    description: 'Later in the attack sequence, the same compromised user account was observed logging in to the company’s SAP system, triggering a ‘Suspicious SAP authentication’ alert. What was the external IP address from which this risky SAP sign-in originated?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a business-email-compromise–related incident, we identified a risky Azure AD session originating from IP address 255.246.85.58 that created a malicious inbox rule designed to hide incoming messages. This activity suggests an attacker was attempting to set up financial fraud by manipulating the victim’s mailbox.'
      question: 'Later in the attack sequence, the same compromised user account was observed logging in to the company’s SAP system, triggering a ‘Suspicious SAP authentication’ alert. What was the external IP address from which this risky SAP sign-in originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.253.5.27'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A malicious inbox rule was created for the account (Email: `Jordan P@vnevado.alpineskihouse.co`), signaling a potential business-email-compromise attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
