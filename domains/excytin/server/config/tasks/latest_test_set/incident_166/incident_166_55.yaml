    description: 'According to the "Anonymous IP address" alert associated with this user, what is the anonymized IP address from which the sign-in originated?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, you observed that the user account "Jordan P" (AadUserId omitted) was flagged for a suspicious sign-in to SAP from the IP address 107.253.5.27, raising concerns of potential business-email-compromise activity. Shortly before this SAP event, another alert titled "Anonymous IP address" indicated that the same user had logged in from a different, anonymized source. Identifying that source IP is critical for understanding the attacker’s infrastructure and possible evasion techniques.'
      question: 'According to the "Anonymous IP address" alert associated with this user, what is the anonymized IP address from which the sign-in originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
