    description: 'What is the SID of the account associated with the "ADFS private key extraction attempt" detected at 22:35:02 UTC on 2024-07-04?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of an internal phishing campaign linked to users Nina Sullivan and Lucas Grey, several earlier events on 2024-07-04 drew attention. First, a process accessed LSASS memory, suggesting credential theft activity; moments later, remote activity was initiated on the same machine. Only seconds after that, an alert titled “ADFS private key extraction attempt” was generated, indicating a suspicious LDAP query that could be used to steal ADFS private keys or enable lateral movement. Analysts need to understand which account was tied to this final LDAP-based extraction attempt.'
      question: 'What is the SID of the account associated with the "ADFS private key extraction attempt" detected at 22:35:02 UTC on 2024-07-04?'
