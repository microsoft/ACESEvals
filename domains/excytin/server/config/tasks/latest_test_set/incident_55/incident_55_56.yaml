    title: incident_55_latest_test_set_task_56
    description: 'Which user account (provide the full email address) was identified as having accessed the AD FS DKM key in the later alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of an internal phishing campaign, security telemetry showed that the account "Nina Sullivan" (Nina Sullivan@vnevado.alpineskihouse.co) sent malicious emails containing the URL http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/. Shortly after, a suspicious sequence of Windows exploration commands was executed, possibly indicating lateral movement activity. A few days later, another alert reported that an unidentified user managed to read the Data Protection (DKM) key for an AD FS object (ID 4cac49d3-29d3-407e-8c9b-b7ebb21541b2), which is a strong indicator of privilege-escalation or domain takeover attempts.'
      question: 'Which user account (provide the full email address) was identified as having accessed the AD FS DKM key in the later alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
