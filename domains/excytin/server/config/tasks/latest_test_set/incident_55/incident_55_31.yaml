      incident_context: 'As part of the investigation of an identity-related incident, we observed that domain controller MB-DC1 accessed the AD FS DKM key, followed by a suspected DCSync attempt from workstation MB-WINCLIENT initiated by a high-privilege user. Earlier in the timeline, an LDAP reconnaissance query was executed against the environment, suggesting the attacker attempted to enumerate sensitive directory information before later stages of the attack.'
