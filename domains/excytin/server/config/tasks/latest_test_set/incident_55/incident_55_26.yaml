tasks:
  - task_id: incident_55_latest_test_set_task_26
    title: incident_55_latest_test_set_task_26
    description: 'According to the concluding alert that flagged suspicious remote activity, what is the name of the executable file that was launched remotely?'
    inherit_shared: true
    initial_context:
      incident_context: 'During investigation of a sequence of potentially related security events, we noted that host "MB-DC1" accessed the AD FS DKM key, followed minutes later by a suspected DCSync replication request originating from a user on workstation MB-WINCLIENT. Shortly thereafter, a suspicious LDAP query was executed, indicative of reconnaissance activity preceding remote actions on a target machine.'
      question: 'According to the concluding alert that flagged suspicious remote activity, what is the name of the executable file that was launched remotely?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
