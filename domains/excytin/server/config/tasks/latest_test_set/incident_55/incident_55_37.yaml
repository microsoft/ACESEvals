tasks:
  - task_id: incident_55_latest_test_set_task_37
    title: incident_55_latest_test_set_task_37
    description: 'According to the follow-up alert that detected a malicious PowerShell Cmdlet on the same machine, which user account was responsible for running that Cmdlet?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent alert flagged a suspicious sequence of exploration activities in which utilities such as "whoami.exe" and an encoded PowerShell payload were run in quick succession. These commands suggest an attempt to enumerate system information and prepare for further malicious actions.'
      question: 'According to the follow-up alert that detected a malicious PowerShell Cmdlet on the same machine, which user account was responsible for running that Cmdlet?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'pwilson'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious sequence of exploration activities was executed through the process with ExtractedFileName `powershell.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, a malicious PowerShell Cmdlet was invoked by the user account whose Name is `pwilson`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
