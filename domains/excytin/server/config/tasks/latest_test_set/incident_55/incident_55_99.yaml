    initial_context:
      incident_context: 'During an investigation, we observed that the user gsmith@niseko.alpineskihouse.co created a suspicious service called "DDLOXJDSQSNGMUKKFUXQ" on host MB-ADFS (alert: "Suspicious service creation" on 2024-07-10). Shortly afterwards, telemetry showed execution of the Impacket toolkit, suggesting hands-on-keyboard activity and potential lateral movement (alert: "Ongoing hands-on-keyboard attack via Impacket toolkit" on 2024-07-04). Within the same sequence of events, a subsequent alert flagged a suspicious attempt to access the LSASS process memory—an action commonly used to harvest credentials.'
