tasks:
  - task_id: incident_55_latest_test_set_task_43
    title: incident_55_latest_test_set_task_43
    description: 'According to the correlated alert about the attempt to conceal a dual-purpose tool, what is the hostname of the device on which this renamed tool was observed?'
    inherit_shared: true
    initial_context:
      incident_context: 'During our investigation we observed that the user gsmith@niseko.alpineskihouse.co accessed the AD FS Data Protection (DKM) key on 2024-07-10, triggering the alert “Suspected AD FS DKM key read.” Correlation with earlier activity shows another alert titled “Attempt to hide use of dual-purpose tool,” which indicates that a well-known public tool was renamed and executed on a particular server to evade detection. Knowing which machine was involved is critical for scoping the incident and determining possible lateral movement paths.'
      question: 'According to the correlated alert about the attempt to conceal a dual-purpose tool, what is the hostname of the device on which this renamed tool was observed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mb-adfs'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mb-adfs'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'On 2024-07-04, the host (Field: HostName, Value: `mb-adfs`) ran a known dual-purpose tool under an unexpected filename, likely attempting to hide the tool’s use.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
