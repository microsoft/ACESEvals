tasks:
  - task_id: incident_55_latest_test_set_task_21
    title: incident_55_latest_test_set_task_21
    description: 'A few days after the remote activity on host "mb-adfs", the incident escalated when a user clicked a link that was later classified as malicious. Which mailbox was associated with this potentially malicious URL click detected on 2024-07-10 at 11:24:45 UTC?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious remote activity alert on host "mb-adfs", several processes were launched under the LocalSystem and gsmith accounts, including cmd.exe spawning an encoded-command PowerShell instance. This activity raised concerns about remote code execution and possible follow-on actions in the environment.'
      question: 'A few days after the remote activity on host "mb-adfs", the incident escalated when a user clicked a link that was later classified as malicious. Which mailbox was associated with this potentially malicious URL click detected on 2024-07-10 at 11:24:45 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bjenkins@niseko.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity was detected launching the process (ExtractedFileName = `powershell.exe`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
