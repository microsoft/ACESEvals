tasks:
  - task_id: incident_55_latest_test_set_task_1
    title: incident_55_latest_test_set_task_1
    description: 'Which account name was identified as sending the replication request during the suspected DCSync attack on MB-DC1?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we observed that the user gsmith (gsmith@niseko.alpineskihouse.co) created a suspicious service named DDLOXJDSQSNGMUKKFUXQ on host MB-ADFS. This activity may indicate an attempt to execute malicious commands or facilitate lateral movement within the environment. Shortly after, other alerts signaled hands-on-keyboard activity consistent with the Impacket toolkit and exploratory command execution. One of the later alerts flagged an unauthorized directory-service replication originating from MB-WINCLIENT to MB-DC1, suggesting a possible DCSync attack.'
      question: 'Which account name was identified as sending the replication request during the suspected DCSync attack on MB-DC1?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Luciano Herrera'
      scoring:
        max_score: 1.0
