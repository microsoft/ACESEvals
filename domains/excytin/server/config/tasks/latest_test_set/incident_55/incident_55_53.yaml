    description: 'What is the Azure AD user ID (AadUserId) of the account associated with the "Ongoing hands-on-keyboard attack via Impacket toolkit" alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation we observed that the domain controller MB-DC1 accessed the AD FS DKM key (alert: "Suspected AD FS DKM key read"). A few seconds later, a DCSync-style replication request was initiated from MB-WINCLIENT toward MB-DC1. Earlier that week, the same environment logged a "Suspicious System Hardware Discovery" event, immediately followed by an "Ongoing hands-on-keyboard attack via Impacket toolkit" on one of the devices. We need to understand which Azure AD account was used during this Impacket activity.'
      question: 'What is the Azure AD user ID (AadUserId) of the account associated with the "Ongoing hands-on-keyboard attack via Impacket toolkit" alert?'
