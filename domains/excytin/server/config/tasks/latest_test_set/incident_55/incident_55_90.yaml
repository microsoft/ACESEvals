tasks:
  - task_id: incident_55_latest_test_set_task_90
    title: incident_55_latest_test_set_task_90
    description: 'According to the alert about the suspicious LSASS access, what is the name of the DLL file that was targeted during this activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a security incident, we saw that at 2024-07-04 22:35:03 UTC the user account "pwilson" (SID S-1-5-21-551436448-9871687716-9837441745-1903, AAD ID 2de70991-2799-4a95-b734-8e3df3a50118) ran a PowerShell script (ldaprequest.ps1) with process ID 11116 to issue a suspicious LDAP query—activity often linked to domain reconnaissance. Just seconds earlier, another alert was raised for a suspicious attempt to access the LSASS service on the same host, suggesting possible credential-dumping behavior.'
      question: 'According to the alert about the suspicious LSASS access, what is the name of the DLL file that was targeted during this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cryptdll.dll'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'cryptdll.dll'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious LDAP query was executed from IP address `72.5.72.208` (Field: Address, Value: 72.5.72.208).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious access to the LSASS service was detected involving the file `cryptdll.dll` (Field: Name, Value: cryptdll.dll).'
        objective: Identify key details related to the potential compromise that might
