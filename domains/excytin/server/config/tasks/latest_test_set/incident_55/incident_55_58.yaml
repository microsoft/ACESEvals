tasks:
  - task_id: incident_55_latest_test_set_task_58
    title: incident_55_latest_test_set_task_58
    description: 'Which user account was identified as responsible for the process that performed the sensitive credential memory read from lsass.exe?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a recent investigation, security telemetry showed that a renamed executable ("iy2orr1e.rrg.exe" launched from process ID 5752 on 2024-07-06) was executed with an obfuscated PowerShell command, suggesting an attempt to conceal the use of a dual-purpose tool. Earlier in the attack chain, the same machine also triggered alerts for a suspicious sequence of Windows exploration commands, immediately followed by an event where a process accessed the memory of lsass.exe to harvest credentials.'
      question: 'Which user account was identified as responsible for the process that performed the sensitive credential memory read from lsass.exe?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bjenkins'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert on host with HostName `mb-adfs` indicates a dual-purpose tool was executed under an unexpected filename, suggesting an attempt to hide malicious activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A process with ExtractedFileName `powershell.exe` then ran a suspicious sequence of reconnaissance commands, typically used to map the environment for lateral movement.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Finally, the attacker targeted the account whose Name is `bjenkins`, dumping LSASS memory to harvest its credentials.'
        objective: Identify key details related to the potential compromise that might
