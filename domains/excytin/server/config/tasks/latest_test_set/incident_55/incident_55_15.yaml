tasks:
  - task_id: incident_55_latest_test_set_task_15
    title: incident_55_latest_test_set_task_15
    description: 'A few minutes after the credential addition, Microsoft Defender triggered an alert titled "Internal phishing lexpaign" at 2024-07-07 10:09 UTC. Which user account (email address) was observed sending the suspicious internal phishing emails in that alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an ongoing investigation, we observed that on 2024-07-07 at 09:54 UTC the user Luciano Herrera (luciano herrera@niseko.alpineskihouse.co) performed an unusual addition of a password-type credential to an OAuth application in Microsoft 365. Such activity can indicate initial steps of account compromise that might later be leveraged for further malicious actions such as phishing inside the organization.'
      question: 'A few minutes after the credential addition, Microsoft Defender triggered an alert titled "Internal phishing lexpaign" at 2024-07-07 10:09 UTC. Which user account (email address) was observed sending the suspicious internal phishing emails in that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Sullivan@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Nina Sullivan@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
