    title: incident_55_latest_test_set_task_67
    description: 'According to the alert about the unusual credential addition to "SimulandApp," what is the OAuth application’s App ID that received the new password credential?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a security incident, we observed a "Sensitive credential memory read" alert on 2024-07-04, indicating that `lsass.exe` (PID 760) had its memory accessed—an activity commonly used to extract authentication secrets. Around the same time, a "Suspicious System Hardware Discovery" alert was raised, tied to an unidentified user account. A few days later, a separate alert reported that the user Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition of password-type credentials to a cloud OAuth application named "SimulandApp."'
      question: 'According to the alert about the unusual credential addition to "SimulandApp," what is the OAuth application’s App ID that received the new password credential?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '4d9476b8-6ae6-459b-a273-5837c15b5981'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '4d9476b8-6ae6-459b-a273-5837c15b5981'
      scoring:
