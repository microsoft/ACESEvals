tasks:
  - task_id: incident_55_latest_test_set_task_47
    title: incident_55_latest_test_set_task_47
    description: 'According to the "Suspicious remote activity" alert raised on 2024-07-04 22:35:02 UTC, which executable file was identified as being used to carry out the remote activity on the affected machine?'
    inherit_shared: true
    initial_context:
      incident_context: 'Analysts are reviewing a high-risk alert titled "Suspicious access to LSASS service" that fired on host "mb-winclient" (device ID 7661dfd4-218f-4016-8a87-66d68a7f098e). The alert shows the LSASS process (pid 760, started 2024-07-02 07:28:35 UTC) interacting with several sensitive DLLs such as cryptdll.dll, vaultcli.dll, winscard.dll and hid.dll while running in the security context of user account "bjenkins" (SID S-1-5-21-561436748-3867387497-1732241745-3701). Correlation with other alerts in the same incident reveals that, moments earlier on the same machine, a separate alert titled "Suspicious remote activity" was generated, indicating a remotely initiated action that could facilitate lateral movement or the modification of system files.'
      question: 'According to the "Suspicious remote activity" alert raised on 2024-07-04 22:35:02 UTC, which executable file was identified as being used to carry out the remote activity on the affected machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity initiated the execution of file Name `powershell.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Immediately following that, an attempt was made to access the process ExtractedFileName `lsass.exe`, suggesting credential dumping from LSASS.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
