tasks:
  - task_id: incident_55_latest_test_set_task_70
    title: incident_55_latest_test_set_task_70
    description: 'In a related event from this incident, a suspicious LDAP query was run on July 4 2024. From which IP address did this LDAP query originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, analysts observed that the account "Luciano Herrera" (CIO) signed in on workstation MB-WINCLIENT and sent a single directory-replication (DCSync) request to the domain controller MB-DC1. This activity raised concerns about potential reconnaissance or credential-theft efforts within the environment.'
      question: 'In a related event from this incident, a suspicious LDAP query was run on July 4 2024. From which IP address did this LDAP query originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Step 1 – ip.Address: `72.5.72.208` – A suspicious LDAP query originated from this IP address, indicating possible reconnaissance activity against the domain controller.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Step 2 – account.Sid: `S-1-5-21-551436448-9871687716-9837441745-1903` – Days later, the same attacker leveraged this account SID to send a DCSync replication request, attempting to harvest credential data from the domain controller.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
