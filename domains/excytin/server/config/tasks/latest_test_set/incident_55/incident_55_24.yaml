    description: 'Identify the Application (client) ID of the OAuth app to which credentials were unusually added by Luciano Herrera during this incident.'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent investigation revealed that on host "mb-adfs" the SYSTEM account executed a renamed Windows executable (iy2orr1e.rrg.exe) via a PowerShell-encoded command, triggering the alert "System executable renamed and launched". Such activity often precedes further malicious actions like reconnaissance, lateral movement, or cloud abuse. Subsequent alerts in the same incident showed a suspicious sequence of Windows command-line exploration, and a few days later a user named Luciano Herrera (pwilson@niseko.alpineskihouse.co) unexpectedly added a password credential to a cloud-hosted OAuth application (SimulandApp), suggesting potential abuse of that app for broader access.'
      question: 'Identify the Application (client) ID of the OAuth app to which credentials were unusually added by Luciano Herrera during this incident.'
