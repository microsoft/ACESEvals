tasks:
  - task_id: incident_55_latest_test_set_task_88
    title: incident_55_latest_test_set_task_88
    description: 'Identify the URL that appeared in the phishing emails sent during the internal phishing campaign linked to the compromised user.'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious sequence of exploration activities on host "mb-adfs", security telemetry showed the executable "iy2orr1e.rrg.exe" being launched under the user account "gsmith" (AadUserId: ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5). The process initiated several reconnaissance commands such as "whoami.exe" and encoded PowerShell. A few days later, the same compromised user was involved in an internal phishing campaign that targeted other employees.'
      question: 'Identify the URL that appeared in the phishing emails sent during the internal phishing campaign linked to the compromised user.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'On 2024-07-04 the attacker launched a reconnaissance script via the process with ExtractedFileName `powershell.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
