    description: 'What is the full URL that was clicked on the device during the "Malicious URL was clicked on that device" alert triggered on 2024-07-10 at 11:24:45 UTC?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a security incident, we observed on July 4 2024 that the process "powershell.exe" was launched with the script "contosoadfsblatempcreds.ps1" under account "pwilson" (SID S-1-5-21-551436448-9871687716-9837441745-1903). This PowerShell session was associated with the external IP address 72.5.72.208 and ran on an internal workstation (hostname omitted). The alert was raised because the process was injected with potentially malicious code, a common technique to hide unauthorized activity in a trusted process.

A few days later, on July 10 2024 at 11:24 UTC, the same device generated another alert indicating that a user clicked a malicious URL. You have pivoted to the web-activity logs for that alert and now need to identify the exact resource that was accessed.'
      question: 'What is the full URL that was clicked on the device during the "Malicious URL was clicked on that device" alert triggered on 2024-07-10 at 11:24:45 UTC?'
