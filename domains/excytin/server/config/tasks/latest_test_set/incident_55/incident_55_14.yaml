tasks:
  - task_id: incident_55_latest_test_set_task_14
    title: incident_55_latest_test_set_task_14
    description: 'According to the alert about the unusual addition of credentials to the OAuth app "SimulandApp", what is the full name of the user account that performed this action?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a recent investigation, a device accessed the malicious URL "https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/". Not long after, the same incident timeline showed a suspicious sequence of Windows exploration commands executed under an unidentified user account. Shortly thereafter, investigators observed that credentials were unusually added to an OAuth application named "SimulandApp", suggesting possible attacker activity.'
      question: 'According to the alert about the unusual addition of credentials to the OAuth app "SimulandApp", what is the full name of the user account that performed this action?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Luciano Herrera'
      scoring:
        max_score: 1.0
