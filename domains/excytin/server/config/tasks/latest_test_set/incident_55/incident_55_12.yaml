tasks:
  - task_id: incident_55_latest_test_set_task_12
    title: incident_55_latest_test_set_task_12
    description: 'According to the alert titled "Email messages containing malicious URL removed after delivery", which mailbox was identified as the recipient of the malicious email?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a security incident, analysts observed that the user account gsmith@niseko.alpineskihouse.co created a suspicious service named DDLOXJDSQSNGMUKKFUXQ on host MB-ADFS (July 10 2024). This activity is part of a broader chain of related alerts that culminated in the removal of an email containing a malicious URL.'
      question: 'According to the alert titled "Email messages containing malicious URL removed after delivery", which mailbox was identified as the recipient of the malicious email?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bjenkins@niseko.alpineskihouse.co'
      scoring:
        max_score: 1.0
