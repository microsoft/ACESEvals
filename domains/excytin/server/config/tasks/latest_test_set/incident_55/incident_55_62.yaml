    title: incident_55_latest_test_set_task_62
    description: 'Further in the same incident, an alert titled "Internal phishing campaign" was raised on 2024-07-07. Which user account (provide the full email address) was identified as the sender of the phishing messages?'
    inherit_shared: true
    initial_context:
      incident_context: 'While reviewing a security incident, you see that on 2024-07-10 the domain controller MB-DC1 was flagged for reading the AD FS DKM key—behaviour often linked to attempts at credential compromise ahead of lateral movement.'
