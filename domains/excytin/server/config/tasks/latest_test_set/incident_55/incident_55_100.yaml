tasks:
  - task_id: incident_55_latest_test_set_task_100
    title: incident_55_latest_test_set_task_100
    description: 'According to the "Suspicious remote activity" alert triggered at 22:35:02 UTC on 2024-07-04, which file was identified as being used in that remote activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'While investigating an incident, we observed that the user account "Luciano Herrera" (email: Luciano Herrera@niseko.alpineskihouse.co) unexpectedly added a new password credential to an OAuth application called "SimulandApp" in Microsoft 365 (App ID 11161). This behavior may indicate that the application was compromised for malicious purposes such as phishing or data exfiltration. Shortly before this credential change, the same timeline shows a set of device-level alerts: first, a "Suspicious System Hardware Discovery" event where a particular executable was run, and moments later (2024-07-04 22:35:02 UTC) a "Suspicious remote activity" alert was raised on the same machine.'
      question: 'According to the "Suspicious remote activity" alert triggered at 22:35:02 UTC on 2024-07-04, which file was identified as being used in that remote activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '%comspec%'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '%comspec%'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An unusual addition of credentials to an OAuth application was performed by the account with Sid `S-1-5-21-551436448-9871687716-9837441745-1903`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The attacker later executed the process with ExtractedFileName `powershell.exe`, which was flagged for suspicious system-hardware discovery.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Finally, suspicious remote activity invoked the file with Name `%comspec%`, indicating potential command-line abuse on the target host.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
