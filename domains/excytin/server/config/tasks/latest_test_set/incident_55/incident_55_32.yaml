tasks:
  - task_id: incident_55_latest_test_set_task_32
    title: incident_55_latest_test_set_task_32
    description: 'According to the final alert in this incident, which user account (email address) was responsible for creating the suspicious Windows service on MB-ADFS?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a recent investigation, we observed that the user Luciano Herrera performed an unusual addition of credentials to an OAuth application named SimulandApp on July 7 2024. This behavior might indicate that the application or the user account was compromised. Subsequent alerts in the same incident revealed a suspicious sequence of Windows exploration commands and remote activity originating from an unidentified account. A few days later, another alert reported that a new Windows service was created on host MB-ADFS as part of potentially malicious activity.'
      question: 'According to the final alert in this incident, which user account (email address) was responsible for creating the suspicious Windows service on MB-ADFS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'gsmith@niseko.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity was initiated by the account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
