tasks:
  - task_id: incident_55_latest_test_set_task_95
    title: incident_55_latest_test_set_task_95
    description: 'According to the alert about the suspicious LDAP query, what is the name of the script file (ExtractedFileName) that was executed?'
    inherit_shared: true
    initial_context:
      incident_context: 'User account ''bjenkins'' ran several PowerShell commands, including launching the script ''contosoadfsblatempcreds.ps1''. This activity triggered an alert titled “A malicious PowerShell Cmdlet was invoked on the machine.” Shortly afterwards, a second alert reported that a suspicious LDAP query had been executed on the host, suggesting reconnaissance behaviour.'
      question: 'According to the alert about the suspicious LDAP query, what is the name of the script file (ExtractedFileName) that was executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ldaprequest.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'ldaprequest.ps1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A malicious PowerShell cmdlet was executed through the process ExtractedFileName=`powershell.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, a suspicious LDAP query was performed via the process ExtractedFileName=`ldaprequest.ps1`.'
        objective: Identify key details related to the potential compromise that might
