tasks:
  - task_id: incident_55_latest_test_set_task_9
    title: incident_55_latest_test_set_task_9
    description: 'According to the July 4th alert about code injection into a process, which user account was involved in that event?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we noted that server MB-DC1 accessed the AD FS DKM key, and shortly afterwards an account from host MB-WINCLIENT initiated a suspected DCSync replication request to the same domain controller. Looking back in the timeline, an earlier alert on 2024-07-04 reported that malicious code had been injected into a running process, suggesting that the attacker gained execution inside an existing application.'
      question: 'According to the July 4th alert about code injection into a process, which user account was involved in that event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'pwilson'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'HostName `MB-DC1` accessed (read) the AD FS DKM key at 2024-07-10 11:24:45Z, indicating possible exposure of federation service secrets.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Account Sid `S-1-5-21-551436448-9871687716-9837441745-1903` (user Luciano Herrera) sent a suspicious DCSync replication request from MB-WINCLIENT to domain controller MB-DC1 at 2024-07-10 11:24:45Z.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
