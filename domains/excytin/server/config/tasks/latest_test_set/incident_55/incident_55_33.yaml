tasks:
  - task_id: incident_55_latest_test_set_task_33
    title: incident_55_latest_test_set_task_33
    description: 'During the same time frame, investigators noted that a separate PowerShell process carrying an encoded command started just seconds earlier than the renamed executable. What was the Process ID (PID) assigned to this suspicious PowerShell process?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent alert flagged a renamed Windows executable "iy2orr1e.rrg.exe" that was launched on host "mb-adfs" under the SYSTEM account (SID S-2-2-78). The executable was started at 2024-07-02 09:48:23 UTC with a hidden window and an encoded PowerShell command, indicating a potential attempt to evade detection.'
      question: 'During the same time frame, investigators noted that a separate PowerShell process carrying an encoded command started just seconds earlier than the renamed executable. What was the Process ID (PID) assigned to this suspicious PowerShell process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '6808'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '6808'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert indicates a renamed and executed system executable: Field `ProcessId__CreatedTimeUtc__CommandLine`, Value `6808__2024-07-02t09:48:12.7628138z__powershell.exe  -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa=`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
