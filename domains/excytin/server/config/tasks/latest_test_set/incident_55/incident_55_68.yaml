    title: incident_55_latest_test_set_task_68
    description: 'Which host is reported to have read the AD FS DKM key in the final alert of this incident sequence?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4th, 2024, our monitoring detected an "ADFS private key extraction attempt" coming from host "mb-adfs", where a suspicious process (iy2orr1e.rrg.exe) was executed under the gsmith account. This initial activity was followed by a "Suspicious sequence of exploration activities" and a "Suspicious System Hardware Discovery" alert, indicating reconnaissance on the same environment. Several days later, on July 10th, the investigation timeline shows a suspected DCSync operation, after which another alert was generated for an Active Directory Federation Services (AD FS) Data Protection Manager (DKM) key access. The final alert states that one of our domain controllers accessed the DKM key for an ADFS object.'
      question: 'Which host is reported to have read the AD FS DKM key in the final alert of this incident sequence?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
