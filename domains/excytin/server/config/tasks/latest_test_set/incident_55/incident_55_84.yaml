tasks:
  - task_id: incident_55_latest_test_set_task_84
    title: incident_55_latest_test_set_task_84
    description: 'According to the "Suspicious System Hardware Discovery" alert linked to this incident, what is the user name of the account associated with that alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of an "Internal phishing campaign" detected on 2024-07-07, we observed that the compromised user accounts "Nina Sullivan" (Nina Sullivan@vnevado.alpineskihouse.co) and "Lucas Grey" (Lucas Grey@niseko.alpineskihouse.co) reportedly sent phishing emails from an internal device. This activity is tied to a broader incident in which another, earlier alert flagged the same device for "Suspicious System Hardware Discovery"—suggesting the attacker may have run reconnaissance commands after gaining access.'
      question: 'According to the "Suspicious System Hardware Discovery" alert linked to this incident, what is the user name of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bjenkins'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with Sid `S-1-5-21-561436748-3867387497-1732241745-3701` sent phishing emails internally, indicating a possible compromise.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, the account named `bjenkins` executed a suspicious system hardware discovery tool, suggesting the attacker is gathering device information for further actions.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
