    title: incident_55_latest_test_set_task_71
    description: 'During the same investigation a different alert reported that a suspicious service was created on host MB-ADFS. What is the email address of the account that created this service?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 10, 2024 a security alert was raised after user Lucas Grey clicked a URL that was later confirmed to be malicious (http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/). The click was logged for the mailbox bjenkins@niseko.alpineskihouse.co, indicating potential phishing activity targeting the Niseko environment. This URL-click alert is the starting point of a broader investigation.'
      question: 'During the same investigation a different alert reported that a suspicious service was created on host MB-ADFS. What is the email address of the account that created this service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
