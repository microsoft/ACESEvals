tasks:
  - task_id: incident_55_latest_test_set_task_63
    title: incident_55_latest_test_set_task_63
    description: 'Which user’s email address was identified as accessing the ADFS DKM key in the "Suspected AD FS DKM key read" alert raised on 2024-07-10?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a recent security incident, we observed that on 2024-07-04 a process named "svchost.exe" was launched on host "mb-winclient" by account "pwilson" (SID S-1-5-21-561436748-3867387497-1732241745-3701). This activity triggered the alert "Suspicious System Hardware Discovery." Just seconds later, another alert titled "Suspicious sequence of exploration activities" indicated that Windows commands were executed, suggesting an attacker was mapping the environment for lateral movement. Several days afterward, a follow-up alert "Suspected AD FS DKM key read" was raised, indicating that a different user account successfully accessed the DKM key for an ADFS object (ID 4cac49d3-29d3-407e-8c9b-b7ebb21541b2).'
      question: 'Which user’s email address was identified as accessing the ADFS DKM key in the "Suspected AD FS DKM key read" alert raised on 2024-07-10?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'gsmith@niseko.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious System Hardware Discovery was executed using process with ExtractedFileName `powershell.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A Suspicious sequence of exploration activities was conducted by the account with Name `gsmith`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
