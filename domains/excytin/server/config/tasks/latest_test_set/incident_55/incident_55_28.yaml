    title: incident_55_latest_test_set_task_28
    description: 'According to the alert about the unusual addition of credentials to an OAuth app, which user account (email address) performed the credential addition?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious service creation on host MB-ADFS, we found that the user gsmith@niseko.alpineskihouse.co had created a new service named DDLOXJDSQSNGMUKKFUXQ, likely to execute malicious commands. This activity was one of several alerts in the broader incident, which later also included an "Unusual addition of credentials to an OAuth app"—a sign that an attacker may have compromised an application to gain further access.'
      question: 'According to the alert about the unusual addition of credentials to an OAuth app, which user account (email address) performed the credential addition?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
