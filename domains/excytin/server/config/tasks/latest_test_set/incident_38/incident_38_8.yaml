tasks:
  - task_id: incident_38_latest_test_set_task_8
    title: incident_38_latest_test_set_task_8
    description: 'Which executable launched the encoded command that triggered the linked "Suspicious Application Window Discovery" alert at 15:49:41 UTC on 26 June 2024?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 04 July 2024 at 22:35 UTC, Defender flagged an unexpected instance of notepad.exe running without any command-line arguments from the public IP address 202.183.149.174. This behaviour can be symptomatic of code injection or a masquerading executable. Investigators later found that, just a second earlier, a related alert titled "Suspicious Application Window Discovery" was raised on the same host, indicating that an encoded command had been executed to enumerate application windows.'
      question: 'Which executable launched the encoded command that triggered the linked "Suspicious Application Window Discovery" alert at 15:49:41 UTC on 26 June 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with AadUserId `12185914-91dd-4fb9-94f9-3252203b0426` was involved in running a process that showed unexpected behavior when executed without command-line arguments (alert time: 2024-07-04 22:35:01 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'During the “Suspicious Application Window Discovery” alert, the process with ProcessId `4656`, created at `2024-06-26T15:49:41.4025245Z`, executed `"powershell.exe" -ExecutionPolicy Bypass -EncodedCommand …`—indicating potentially malicious PowerShell activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
