    title: incident_38_latest_test_set_task_1
    description: 'In the earlier "Suspicious process injection observed" alert that occurred just before the PowerShell execution, which external IP address is listed as being contacted?'
    inherit_shared: true
    initial_context:
      incident_context: 'During analysis of a suspicious process-injection incident, we noted that a process named "powershell.exe" (PID 4656) was started with a long base-64-encoded command at 2024-06-26T15:49:41Z. This activity is part of a series of "Suspicious process injection observed" alerts that suggest the injected code might be reaching out to an external host.'
      question: 'In the earlier "Suspicious process injection observed" alert that occurred just before the PowerShell execution, which external IP address is listed as being contacted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
