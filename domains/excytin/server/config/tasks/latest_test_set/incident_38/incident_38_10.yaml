tasks:
  - task_id: incident_38_latest_test_set_task_10
    title: incident_38_latest_test_set_task_10
    description: 'According to the second alert that flagged the unexpectedly behaving process, what external IP address did this process communicate with?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed a suspicious process-injection event that referenced the remote resource "https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt". Immediately after this injection, another alert was raised stating that a legitimate-looking process started with no command-line arguments and began to show unexpected behavior—an indication it may contain injected code or be a masquerading executable.'
      question: 'According to the second alert that flagged the unexpectedly behaving process, what external IP address did this process communicate with?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '202.183.149.174'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '202.183.149.174'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious process injection was detected on the host (AadDeviceId = `39d8c57f-2d08-4888-b0cd-12cd0679337a`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Immediately after the injection, the affected process showed unexpected behavior and reached out to the external IP (Address = `202.183.149.174`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
