tasks:
  - task_id: incident_38_latest_test_set_task_4
    title: incident_38_latest_test_set_task_4
    description: 'According to the "Suspicious process injection observed" alert, what exact URL did the injected process attempt to access?'
    inherit_shared: true
    initial_context:
      incident_context: 'While analyzing an alert for unexpected behavior from a process launched without any command-line arguments communicating with the external IP 202.183.149.174, a follow-up alert titled “Suspicious process injection observed” was raised. This second alert states that the injected process reached out to a cloud-hosted blob storage location to retrieve a text file, likely containing additional malicious instructions.'
      question: 'According to the "Suspicious process injection observed" alert, what exact URL did the injected process attempt to access?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious process injection observed: A process attempted to fetch and inject code from Url `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Unexpected behavior in legitimate process: The process with ExtractedFileName `notepad.exe` was run with no command-line arguments and showed anomalous activity, suggesting it may have been the injection target.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
