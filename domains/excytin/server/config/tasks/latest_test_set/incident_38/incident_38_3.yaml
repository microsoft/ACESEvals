tasks:
  - task_id: incident_38_latest_test_set_task_3
    title: incident_38_latest_test_set_task_3
    description: 'According to telemetry later in the incident timeline, what is the hostname of the Windows device that these suspicious activities ultimately affected?'
    inherit_shared: true
    initial_context:
      incident_context: 'Microsoft Defender has raised an alert for a suspicious process injection. During the investigation, it was observed that user account ''nathans'' (AadUserId 12185914-91dd-4fb9-94f9-3252203b0426, SID S-1-5-21-1240151660-3534038288-105586567-4122) executed an obfuscated PowerShell command from a file named powershell.exe (PID 4656). Shortly afterwards, the process notepad.exe (PID 8932) was also started. Network traffic was noted toward the external IP address 72.5.72.208, and the script attempted to download content from https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt. The device involved in these events is identified internally by Azure AD Device ID 39d8c57f-2d08-4888-b0cd-12cd0679337a.'
      question: 'According to telemetry later in the incident timeline, what is the hostname of the Windows device that these suspicious activities ultimately affected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11a'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win11a'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious process injection was observed on the host with HostName `vnevado-win11a`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
