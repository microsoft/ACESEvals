tasks:
  - task_id: incident_38_latest_test_set_task_5
    title: incident_38_latest_test_set_task_5
    description: 'According to the "Suspicious process injection observed" alert that followed the initial discovery activity, what is the full URL the injected process was linked to?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of the "Suspicious Application Window Discovery" alert triggered on July 4 2024, we noted that multiple PowerShell commands were executed on the host in quick succession (for example, process ID 7472 followed by 4656 running PowerShell with an encoded command). This activity suggests an attacker was actively enumerating the system. A second, related alert—"Suspicious process injection observed"—was raised only seconds later, indicating that code was injected into another process, potentially enabling it to reach out to an external resource.'
      question: 'According to the "Suspicious process injection observed" alert that followed the initial discovery activity, what is the full URL the injected process was linked to?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Step 1 – account.Name: nathans  → This user performed Suspicious Application Window Discovery on the device.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Step 2 – url.Url: https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt  → A Suspicious Process Injection referenced this URL, indicating possible file-less malware activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
