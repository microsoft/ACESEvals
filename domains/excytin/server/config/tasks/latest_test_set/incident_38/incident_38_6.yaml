    title: incident_38_latest_test_set_task_6
    description: 'According to the "Suspicious Application Window Discovery" alert that followed, what executable was launched on the device to perform the window-discovery activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious process injection event, we observed that a file-less payload was referenced from the URL https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt and code was injected into a running instance of notepad.exe. This activity occurred on the same device only seconds before another alert was raised for "Suspicious Application Window Discovery", indicating an attacker might have attempted to enumerate application windows after the injection step.'
      question: 'According to the "Suspicious Application Window Discovery" alert that followed, what executable was launched on the device to perform the window-discovery activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
