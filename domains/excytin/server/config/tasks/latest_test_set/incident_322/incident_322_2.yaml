tasks:
  - task_id: incident_322_latest_test_set_task_2
    title: incident_322_latest_test_set_task_2
    description: 'According to the alert about the NTDS.dit credential dump, what is the name of the executable that was used to perform the dump?'
    inherit_shared: true
    initial_context:
      incident_context: 'Microsoft Defender for Resource Manager raised an alert after it observed resource-management commands executed against the subscription 7e838342-601f-4552-9baf-0dfb300cf555 (resource group "ctfcat") from the proxy IP address 253.1.244.215. The activity was performed under the account of Hailey Johnson (AadUserId 5e5dd0bd-f7ed-4583-8e9e-52f91e31a360) and targeted several Azure resources related to the virtual machine "vnevado-dc". This proxy usage can be benign, but it is frequently associated with malicious operations. Within the same incident, another alert indicated that credentials were dumped from the Active Directory database file NTDS.dit on the domain controller.'
      question: 'According to the alert about the NTDS.dit credential dump, what is the name of the executable that was used to perform the dump?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'ntdsutil.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Attackers initiated a credential dump using process ExtractedFileName `ntdsutil.exe` (alert: Suspicious credential dump from NTDS.dit).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, an Azure Resource Manager operation was executed from host HostName `vnevado-dc`, which was detected coming through a suspicious proxy (alert: Azure Resource Manager operation from suspicious proxy IP address).'
        objective: Identify key details related to the potential compromise that might
