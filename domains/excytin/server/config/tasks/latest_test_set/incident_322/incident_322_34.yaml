tasks:
  - task_id: incident_322_latest_test_set_task_34
    title: incident_322_latest_test_set_task_34
    description: 'According to the "Malicious Url detected in Proxy logs" alert, which IP address on the corporate network attempted to connect to login.micro.demo.antoinetest.ovh?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspected credential-dumping activity on 2024-08-01 (alert: “Suspicious credential dump from NTDS.dit”), analysts observed that the attacker executed both an encoded PowerShell command and the tool ntdsutil.exe on an internal host, likely in preparation for extracting credentials from the domain controller. Subsequent related alerts included a resource-management action from a proxy IP and a user clicking a malicious URL from the same environment. Finally, proxy logs revealed an outbound connection from one of the organization’s Windows 11 hosts (vnevado-win11h.vnevado.alpineskihouse.co) to the domain login.micro.demo.antoinetest.ovh, which triggered the alert titled “Malicious Url detected in Proxy logs.”'
      question: 'According to the "Malicious Url detected in Proxy logs" alert, which IP address on the corporate network attempted to connect to login.micro.demo.antoinetest.ovh?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '228.3.31.94'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '228.3.31.94'
      scoring:
        max_score: 1.0
    subtasks:
