        description: 'HostName=vnevado-dc: Attackers dumped credentials from NTDS.dit on the domain controller `vnevado-dc` (Suspicious credential dump alert, 2024-08-01 12:49:26 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
