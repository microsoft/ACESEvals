tasks:
  - task_id: incident_322_latest_test_set_task_38
    title: incident_322_latest_test_set_task_38
    description: 'What is the name of the executable that was ultimately used to perform the NTDS.dit credential dump in this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of the "Suspicious credential dump from NTDS.dit" alert raised on 2024-08-01 at 12:49 UTC, analysts observed that on domain controller "vnevado-dc" a PowerShell process ("powershell.exe", PID 2556) ran a lengthy base-64-encoded command. This script likely invoked an additional executable to extract the NTDS.dit file and obtain credential data.'
      question: 'What is the name of the executable that was ultimately used to perform the NTDS.dit credential dump in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'ntdsutil.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Attackers attempted to dump credentials from NTDS.dit using a process whose ExtractedFileName was `ntdsutil.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
