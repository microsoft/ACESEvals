    title: incident_322_latest_test_set_task_4
    description: 'According to the final endpoint alert, what is the full URL that was clicked on the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a phishing-related security incident, we observed that the recipient alyssat@vnevado.alpineskihouse.co clicked a suspicious link in an email, which prompted the alert "A potentially malicious URL click was detected." Shortly afterward, additional emails containing the same malicious link were automatically removed from multiple mailboxes, as indicated by the alert "Email messages containing malicious URL removed after delivery." Later in the timeline, an endpoint alert titled "Malicious URL was clicked on that device" confirmed that the same harmful link was opened on a device.'
      question: 'According to the final endpoint alert, what is the full URL that was clicked on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
