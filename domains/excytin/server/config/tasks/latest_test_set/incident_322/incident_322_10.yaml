    title: incident_322_latest_test_set_task_10
    description: 'According to the "Malicious Url detected in Proxy logs" alert, what external IP address was observed communicating with the domain login.micro.demo.antoinetest.ovh?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an ongoing investigation, Microsoft Defender for Resource Manager raised an alert for a resource-management operation executed on the Azure VM "vnevado-dc" (subscription 7e838342-601f-4552-9baf-0dfb300cf555, resource group "ctfcat"). The operation originated from the suspicious proxy address 253.1.244.215. Shortly afterwards, another alert indicated that a malicious URL had been clicked from one of the organisation’s endpoints. A third alert, titled "Malicious Url detected in Proxy logs", reported that a workstation (vnevado-win11h.vnevado.alpineskihouse.co) reached out to the domain login.micro.demo.antoinetest.ovh, but the specific external IP seen in the proxy logs still needs to be confirmed.'
      question: 'According to the "Malicious Url detected in Proxy logs" alert, what external IP address was observed communicating with the domain login.micro.demo.antoinetest.ovh?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '228.3.31.94'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '228.3.31.94'
      scoring:
        max_score: 1.0
