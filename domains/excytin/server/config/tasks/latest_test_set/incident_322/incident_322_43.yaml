    title: incident_322_latest_test_set_task_43
    description: 'During the proxy-based alert that stemmed from the earlier risky ARM session, which external URL was contacted by the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation was initiated after suspicious Azure Resource Management (ARM) activities were performed from the external IP address 253.1.244.215 in a risky user session. This network indicator has since been tied to additional malicious activity, including a later event where a device reportedly accessed a harmful resource through the corporate proxy. Analysts now need to understand which external address was contacted in that proxy event so they can decide whether to block or monitor it further.'
      question: 'During the proxy-based alert that stemmed from the earlier risky ARM session, which external URL was contacted by the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'login.micro.demo.antoinetest.ovh'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'login.micro.demo.antoinetest.ovh'
      scoring:
        max_score: 1.0
