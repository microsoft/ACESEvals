tasks:
  - task_id: incident_322_latest_test_set_task_36
    title: incident_322_latest_test_set_task_36
    description: 'According to the “A potentially malicious URL click was detected” alert, which recipient’s email address was recorded as having clicked the malicious link?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed that the workstation "vnevado-win11h" (device ID 76707c40-3343-490e-9205-88fdb51aefe0, IP 172.33.118.200) reached out to the suspicious site https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/ via the process "msedge.exe". Shortly after this click, Microsoft 365 security generated two related alerts. First, an alert reported that email messages containing the same malicious URL were removed from user mailboxes. A follow-up alert titled “A potentially malicious URL click was detected” identified which mailbox owner actually clicked the link.'
      question: 'According to the “A potentially malicious URL click was detected” alert, which recipient’s email address was recorded as having clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'alyssat@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert 1 indicates that an email containing a malicious URL was delivered to (and subsequently removed from) the mailmessage.Recipient `alyssat@vnevado.alpineskihouse.co`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Alert 2 shows that the same mailmessage.Recipient `alyssat@vnevado.alpineskihouse.co` later clicked the potentially malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Alert 3 confirms that the account.Name `Hailey Johnson` also clicked on a malicious URL on her device, tying the user activity to the earlier email-based threat.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
