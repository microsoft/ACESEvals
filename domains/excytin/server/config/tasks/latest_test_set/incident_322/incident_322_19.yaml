        description: 'Finally, the same attack path led the user to click a malicious link (Field: Url, Value: `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`), which was later quarantined by Zero-Hour Auto Purge (ZAP).'
