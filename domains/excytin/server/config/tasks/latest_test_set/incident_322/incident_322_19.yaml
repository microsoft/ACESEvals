tasks:
  - task_id: incident_322_latest_test_set_task_19
    title: incident_322_latest_test_set_task_19
    description: 'Identify the full URL that the user clicked in the email which was later quarantined by ZAP.'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a credential-dumping attempt that leveraged the tool `ntdsutil.exe`, security telemetry shows the same activity cluster later triggered an Office 365 alert: a user clicked a link in an email that was subsequently quarantined by Zero-hour Auto Purge (ZAP). Analysts must verify details of this potentially malicious link to understand the attack chain.'
      question: 'Identify the full URL that the user clicked in the email which was later quarantined by ZAP.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The attacker first targeted the domain controller host (Field: HostName, Value: `vnevado-dc`) and successfully performed a suspicious credential dump from NTDS.dit.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'With credentials in hand, the attacker then carried out an Azure Resource Manager operation from a suspicious proxy using the compromised account (Field: Sid, Value: `S-1-5-21-1840151686-3534835288-156286563-1127`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
