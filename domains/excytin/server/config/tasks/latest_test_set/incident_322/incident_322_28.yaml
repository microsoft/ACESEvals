tasks:
  - task_id: incident_322_latest_test_set_task_28
    title: incident_322_latest_test_set_task_28
    description: 'Which user’s mailbox (provide the primary SMTP address) was identified in the alert stating that email messages containing a malicious URL were removed after delivery?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of an incident involving a suspicious Azure Resource Manager operation executed from a proxy-associated IP address (253.1.244.215) against the virtual machine "vnevado-dc" in the subscription 7e838342-601f-4552-9baf-0dfb300cf555, analysts noted that a related email security alert was also raised. The email-related alert reported that certain messages containing malicious URLs were delivered to a user’s mailbox and subsequently removed.'
      question: 'Which user’s mailbox (provide the primary SMTP address) was identified in the alert stating that email messages containing a malicious URL were removed after delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'alyssat@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious Azure Resource Manager activity originated from the account Name `Hailey Johnson`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'An email containing a malicious URL was delivered to – and later removed from – the mailbox MailboxPrimaryAddress `alyssat@vnevado.alpineskihouse.co`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
