    title: incident_322_latest_test_set_task_5
    description: 'During the suspicious Azure Resource Management (ARM) activities that followed the malicious email, what was the external IP address associated with the risky user’s session?'
    inherit_shared: true
    initial_context:
      incident_context: 'An email containing the malicious URL "dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io" was sent from raphaelt@vnevado.alpineskihouse.co to alyssat@vnevado.alpineskihouse.co and later removed after delivery. This activity raised concerns about possible follow-on actions. Shortly after, Microsoft Defender generated a separate alert indicating that a risky user carried out suspicious Azure Resource Management (ARM) operations during a high-risk session.'
      question: 'During the suspicious Azure Resource Management (ARM) activities that followed the malicious email, what was the external IP address associated with the risky user’s session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '253.1.244.215'
      scoring:
        max_score: 1.0
