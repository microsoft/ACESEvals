    description: 'According to the "Suspicious credential dump from NTDS.dit" alert, what is the process ID (PID) of the process that executed the encoded PowerShell command used for the dump?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a potential compromise, we observed that a user on host "vnevado-win11h" accessed a known malicious URL using the Microsoft Edge process (command line beginning with "msedge.exe"). This activity raised concern for possible follow-on actions such as credential theft. As we continued tracing related activity, we identified a subsequent alert titled "Suspicious credential dump from NTDS.dit," which indicates that the attacker may have attempted to extract credentials from the domain controller database.'
      question: 'According to the "Suspicious credential dump from NTDS.dit" alert, what is the process ID (PID) of the process that executed the encoded PowerShell command used for the dump?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
