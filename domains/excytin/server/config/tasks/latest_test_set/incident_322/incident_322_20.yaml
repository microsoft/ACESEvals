tasks:
  - task_id: incident_322_latest_test_set_task_20
    title: incident_322_latest_test_set_task_20
    description: 'Identify the exact URL that Hailey Johnson accessed in the email which was later quarantined by ZAP.'
    inherit_shared: true
    initial_context:
      incident_context: 'On August 1, 2024, Microsoft Defender for Office 365 generated an alert after user Hailey Johnson (AadUserId: 5e5dd0bd-f7ed-4583-8e9e-52f91e31a360) clicked a link contained in an email that was subsequently quarantined by Zero-hour Auto Purge (ZAP) due to its malicious nature.'
      question: 'Identify the exact URL that Hailey Johnson accessed in the email which was later quarantined by ZAP.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user clicked on the URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` that was later quarantined by ZAP.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
