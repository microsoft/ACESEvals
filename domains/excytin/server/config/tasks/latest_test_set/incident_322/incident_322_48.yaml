tasks:
  - task_id: incident_322_latest_test_set_task_48
    title: incident_322_latest_test_set_task_48
    description: 'According to the alert that reported the suspicious NTDS.dit credential dump, which executable was identified as performing this activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed that user alyssat@vnevado.alpineskihouse.co clicked a URL that was later confirmed to be malicious. The email containing the link was subsequently removed, and shortly after, an Azure Resource Manager operation was initiated from a proxy-associated IP address. A few minutes later, a credential dump from the domain controller’s NTDS.dit database was detected, indicating possible lateral movement and privilege escalation activity.'
      question: 'According to the alert that reported the suspicious NTDS.dit credential dump, which executable was identified as performing this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert 1 – A potentially malicious URL click was detected: Recipient `alyssat@vnevado.alpineskihouse.co` (Field = Recipient).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
