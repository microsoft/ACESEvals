tasks:
  - task_id: incident_322_latest_test_set_task_11
    title: incident_322_latest_test_set_task_11
    description: 'Proxy telemetry later flagged an outbound connection from host vnevado-win11h.vnevado.alpineskihouse.co. Which destination URL was identified as malicious in that proxy alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, security detected that the user whose mailbox is addressed to alyssat@vnevado.alpineskihouse.co clicked a link that was later determined to be malicious. The original alert, titled “A potentially malicious URL click was detected,” was generated at 12:44 UTC on 2024-08-01 after the email reached the recipient’s inbox. Subsequent alerts indicated that the offending email was removed and further activity was observed from an endpoint, suggesting the threat progressed beyond email delivery.'
      question: 'Proxy telemetry later flagged an outbound connection from host vnevado-win11h.vnevado.alpineskihouse.co. Which destination URL was identified as malicious in that proxy alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'login.micro.demo.antoinetest.ovh'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'login.micro.demo.antoinetest.ovh'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user received an email where the mailmessage.Recipient was `alyssat@vnevado.alpineskihouse.co`, and that user clicked a potentially malicious URL (Time: 2024-08-01 12:44:53 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Another message containing the same malicious URL was later removed from the mailbox whose account.Email was `Hailey Johnson@vnevado.alpineskihouse.co` (Time: 2024-08-01 12:44:53 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
