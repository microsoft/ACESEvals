tasks:
  - task_id: incident_322_latest_test_set_task_17
    title: incident_322_latest_test_set_task_17
    description: 'Which executable was identified as the process responsible for the suspicious NTDS.dit credential dump in the final alert of this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a connection from the endpoint vnevado-win11h.vnevado.alpineskihouse.co (IP 231.60.52.209) to the URL login.micro.demo.antoinetest.ovh triggered the alert "Malicious Url detected in Proxy logs" on 2024-08-01 12:47:22 UTC. Subsequent correlated alerts revealed that the attacker later performed a suspicious NTDS.dit credential dump on a domain controller, indicating an attempt to harvest user credentials.'
      question: 'Which executable was identified as the process responsible for the suspicious NTDS.dit credential dump in the final alert of this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert shows a malicious URL connection originating from HostName `vnevado-win11h`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'On that device, the Account identified by Sid `S-1-5-21-1840151686-3534835288-156286563-1127` clicked the malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
