tasks:
  - task_id: incident_322_latest_test_set_task_50
    title: incident_322_latest_test_set_task_50
    description: 'According to the alert "Ntdsutil collecting Active Directory information", what executable was run during this suspicious process?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the incident investigation we observed that a user on host "vnevado-win11h" browsed to a known-malicious URL using the process "msedge.exe" (PID 4256) at 2024-08-01T13:42:52Z. Additional correlated alerts show that shortly beforehand an alert titled "Ntdsutil collecting Active Directory information" was raised, indicating a suspicious attempt to gather AD data on the same environment. Details of that process are being examined to understand what was executed.'
      question: 'According to the alert "Ntdsutil collecting Active Directory information", what executable was run during this suspicious process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'ntdsutil.exe'
      scoring:
        max_score: 1.0
