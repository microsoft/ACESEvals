tasks:
  - task_id: incident_322_latest_test_set_task_24
    title: incident_322_latest_test_set_task_24
    description: 'Which recipient received the email messages containing the malicious URL that were later removed?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation began when a PowerShell script launched the tool "ntdsutil.exe" to harvest Active Directory data on a domain controller. Shortly afterward, a suspicious Azure Resource Manager operation was executed from a proxy IP address using a risky account SID. In the same incident timeline, Microsoft 365 security controls reported that one or more email messages containing a malicious URL were delivered to a user and later removed from their mailbox.'
      question: 'Which recipient received the email messages containing the malicious URL that were later removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'alyssat@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The alert shows that on the host with HostName `vnevado-dc`, the tool `ntdsutil` was executed to collect Active Directory information.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, an Azure Resource Manager operation was performed by a suspicious account identified by Sid `S-1-5-21-1840151686-3534835288-156286563-1127`, coming from a proxy IP address.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
