tasks:
  - task_id: incident_322_latest_test_set_task_37
    title: incident_322_latest_test_set_task_37
    description: 'A later alert titled “Malicious URL was clicked on that device” was raised for the same machine. According to this follow-up alert, which external IP address did the device attempt to contact?'
    inherit_shared: true
    initial_context:
      incident_context: 'Proxy logs show that the endpoint at IP 231.60.52.209 (host vnevado-win11h.vnevado.alpineskihouse.co) attempted to reach the suspicious site login.micro.demo.antoinetest.ovh. This activity generated the alert “Malicious URL detected in Proxy logs,” indicating the user might have interacted with a potentially harmful site.'
      question: 'A later alert titled “Malicious URL was clicked on that device” was raised for the same machine. According to this follow-up alert, which external IP address did the device attempt to contact?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '172.33.118.200'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Proxy telemetry shows that the host with HostName `vnevado-win11h` initiated a connection to the malicious URL (login.micro.demo.antoinetest.ovh).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A short time later, the device identified by IP Address `172.33.118.200` actually clicked the malicious URL, confirming user interaction and potential compromise.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
