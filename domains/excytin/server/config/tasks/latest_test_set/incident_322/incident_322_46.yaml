tasks:
  - task_id: incident_322_latest_test_set_task_46
    title: incident_322_latest_test_set_task_46
    description: 'Which user’s mailbox (provide the email address) was identified as having clicked the malicious link in the final alert of this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a proxy alert reported that host 231.60.52.209 accessed the URL login.micro.demo.antoinetest.ovh. Subsequent alerts indicated that the same malicious link was clicked on a corporate device, and later Microsoft 365 removed emails that had contained this URL after they had already reached users’ mailboxes. Finally, the system flagged a potentially malicious URL click by one of our users.'
      question: 'Which user’s mailbox (provide the email address) was identified as having clicked the malicious link in the final alert of this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'alyssat@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'HostName `vnevado-win11h` was observed reaching out to the malicious site login.micro.demo.antoinetest.ovh in the proxy logs (2024-08-01 12:47:22 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Account Name `Hailey Johnson` clicked a malicious URL on that same device, indicating potential user-level compromise (2024-08-01 13:49:58 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
