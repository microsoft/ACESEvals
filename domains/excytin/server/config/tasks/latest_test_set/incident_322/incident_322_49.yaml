https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/

Shortly after this event, another alert titled "Malicious URL was clicked on that device" was generated, indicating that the same risky URL was opened from Hailey’s device. Investigators now need to identify the network location from which this malicious URL was accessed.'
