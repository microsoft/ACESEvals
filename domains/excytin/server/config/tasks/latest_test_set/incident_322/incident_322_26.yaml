    description: 'According to the Azure Resource Manager alert that followed the NTDS.dit dumping activity, what is the Security Identifier (SID) of the account that performed the suspicious operation from the proxy IP?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a suspicious credential dumping activity was detected: the executable "ntdsutil.exe" (PID 6748, launched at 2024-08-01 12:37:30 UTC) was run via PowerShell right after an encoded-command invocation of "powershell.exe" (PID 2556). This occurred on a domain controller, indicating that an attacker may have tried to extract credentials from NTDS.dit. Later in the same incident, Microsoft Defender for Resource Manager raised an alert about a resource-management action that originated from a proxy-associated IP address, suggesting the attacker might be moving to cloud resources while attempting to stay anonymous.'
      question: 'According to the Azure Resource Manager alert that followed the NTDS.dit dumping activity, what is the Security Identifier (SID) of the account that performed the suspicious operation from the proxy IP?'
