tasks:
  - task_id: incident_322_latest_test_set_task_56
    title: incident_322_latest_test_set_task_56
    description: 'According to the alert titled "Email messages containing malicious URL removed after delivery", from which IP address were those malicious emails originally sent?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a multi-stage intrusion, analysts observed a "Suspicious credential dump from NTDS.dit" on 2024-08-01 involving the execution of both an encoded PowerShell script ("powershell.exe") and the tool "ntdsutil.exe" on an affected device. Shortly after, an "Azure Resource Manager operation from a suspicious proxy IP address" was flagged for the same activity chain, suggesting possible lateral movement to the cloud. Further review uncovered that several email messages containing a malicious URL had been delivered to users’ mailboxes and were later automatically removed by security controls.'
      question: 'According to the alert titled "Email messages containing malicious URL removed after delivery", from which IP address were those malicious emails originally sent?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '202.205.215.225'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '202.205.215.225'
      scoring:
        max_score: 1.0
