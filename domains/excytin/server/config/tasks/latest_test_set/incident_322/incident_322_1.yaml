tasks:
  - task_id: incident_322_latest_test_set_task_1
    title: incident_322_latest_test_set_task_1
    description: 'What is the email address of the recipient who clicked the potentially malicious URL?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a recent security incident, we observed that the tool "ntdsutil.exe" was launched via PowerShell on an unknown host as part of a suspicious attempt to collect Active Directory information (alert: "Ntdsutil collecting Active Directory information", time 2024-08-01 12:54 UTC). Investigation shows the same incident later generated multiple cloud- and email-related alerts, including the removal of messages that contained a malicious URL and, shortly after, a user clicking that malicious link. The email alert indicates the message was delivered, removed, and then clicked by the intended recipient.'
      question: 'What is the email address of the recipient who clicked the potentially malicious URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'alyssat@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Ntdsutil was executed on the domain-controller host with HostName `vnevado-dc`, indicating potential Active Directory reconnaissance.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
