tasks:
  - task_id: incident_322_latest_test_set_task_51
    title: incident_322_latest_test_set_task_51
    description: 'What is the full URL of the external site that vnevado-win11h tried to contact, which caused the "Malicious Url detected in Proxy logs" alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-08-01 at 12:47 UTC, the workstation vnevado-win11h (source IP 231.60.52.209) triggered a "Malicious Url detected in Proxy logs" alert after attempting an outbound connection to an unknown external login site. The specific destination URL needs to be identified to continue the investigation.'
      question: 'What is the full URL of the external site that vnevado-win11h tried to contact, which caused the "Malicious Url detected in Proxy logs" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'login.micro.demo.antoinetest.ovh'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'login.micro.demo.antoinetest.ovh'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Proxy logs revealed that the host attempted to access a malicious resource (Url: login.micro.demo.antoinetest.ovh).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
