tasks:
  - task_id: incident_322_latest_test_set_task_15
    title: incident_322_latest_test_set_task_15
    description: 'According to the final alert that reported "Suspicious Azure Resource Management activities by a risky user" at 13:19 UTC, what is the Security Identifier (SID) of the user account involved in these activities?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a credential-dumping attempt on a domain controller, we observed a process `ntdsutil.exe` (PID 6748, launched from `powershell.exe`) executed around 12:49 UTC on 2024-08-01. Shortly after, Microsoft Defender for Resource Manager flagged an operation originating from a proxy IP, apparently performed by the same user account. This sequence culminated at 13:19 UTC with an alert titled “Suspicious Azure Resource Management activities by a risky user,” indicating that the user account involved in the earlier proxy-based ARM operation proceeded to carry out additional suspicious cloud activities.'
      question: 'According to the final alert that reported "Suspicious Azure Resource Management activities by a risky user" at 13:19 UTC, what is the Security Identifier (SID) of the user account involved in these activities?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840151686-3534835288-156286563-1127'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-1-5-21-1840151686-3534835288-156286563-1127'
      scoring:
        max_score: 1.0
