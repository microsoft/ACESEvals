tasks:
  - task_id: incident_322_latest_test_set_task_29
    title: incident_322_latest_test_set_task_29
    description: 'According to the last alert in this attack chain ("Malicious URL was clicked on that device"), which IP address was associated with the device that accessed the malicious link?'
    inherit_shared: true
    initial_context:
      incident_context: 'A sequence of related security alerts began when an attacker ran "powershell.exe" with an encoded command and then executed "ntdsutil.exe" to harvest Active Directory data from a domain controller (hostname withheld). Minutes later, Microsoft Defender for Resource Manager detected the same user performing suspicious ARM operations from a proxy network. Finally, an alert titled "Malicious URL was clicked on that device" was triggered, completing the attack chain.'
      question: 'According to the last alert in this attack chain ("Malicious URL was clicked on that device"), which IP address was associated with the device that accessed the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '172.33.118.200'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Attackers executed Ntdsutil to collect Active Directory data on the host with HostName `vnevado-dc`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, a suspicious Azure Resource Manager operation originated from the account with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
