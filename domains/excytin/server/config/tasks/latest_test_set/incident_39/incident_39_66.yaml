tasks:
  - task_id: incident_39_latest_test_set_task_66
    title: incident_39_latest_test_set_task_66
    description: 'A related alert reported that a suspicious file was registered as a service for persistence on the same host shortly afterwards. According to that alert, which account was used to register the service?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024, an alert titled “Multiple dual-purpose tools were dropped” was raised for host “vnevado-win10v.” Investigators observed several potentially malicious tools—such as rubeus.exe, psexec.exe, and the script domaindominance27.ps1 launched via powershell.exe—being placed on the device, indicating possible credential-theft or lateral-movement activity.'
      question: 'A related alert reported that a suspicious file was registered as a service for persistence on the same host shortly afterwards. According to that alert, which account was used to register the service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'LocalSystem'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'LocalSystem'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A dual-purpose tool was introduced: file Name `rubeus.exe` was dropped on the device.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Malicious activity continued on host HostName `vnevado-win10b`, where the ‘Kekeo’ malware was detected during lateral movement.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'For persistence, a suspicious file was registered as a service under the account Name `LocalSystem`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
