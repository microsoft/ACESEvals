    title: incident_39_latest_test_set_task_3
    description: 'What was the process ID of the PowerShell process that executed the Set-MpPreference command to disable Microsoft Defender Antivirus real-time monitoring?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into potential human-operated malicious activity linked to the user account "kyleg" (seen coming from IP 141.216.110.153), an additional alert was raised only seconds earlier for "Microsoft Defender Antivirus tampering." According to this second alert, an attacker used PowerShell with the Set-MpPreference cmdlet to disable Defender’s real-time monitoring, indicating an evasion attempt against the device’s protections.'
      question: 'What was the process ID of the PowerShell process that executed the Set-MpPreference command to disable Microsoft Defender Antivirus real-time monitoring?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '6968'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '6968'
      scoring:
        max_score: 1.0
