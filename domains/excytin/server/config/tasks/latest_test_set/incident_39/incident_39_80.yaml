tasks:
  - task_id: incident_39_latest_test_set_task_80
    title: incident_39_latest_test_set_task_80
    description: 'According to the PsExec alert, what is the name of the executable (other than PsExec itself) that was run from the C:\temp directory on the remote host "vnevado-win10b"?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we observed that the built-in LocalSystem account on one of the servers initiated suspicious remote activity. Shortly after, a remote session dropped a file onto the same machine and executed it. A few seconds later, PsExec was used from that host to run an additional command on a remote computer named "vnevado-win10b". The PsExec command invoked cmd.exe with parameters that referenced a tool residing in the C:\temp directory, instructing it to dump service tickets and write the output to a file called adminticket.txt.'
      question: 'According to the PsExec alert, what is the name of the executable (other than PsExec itself) that was run from the C:\temp directory on the remote host "vnevado-win10b"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'rubeus.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity was detected on host with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, indicating possible lateral-movement attempts.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'During the same timeframe a file named `rubeus.exe` (ExtractedFileName = `rubeus.exe`) was dropped and executed from a remote location, suggesting the attacker deployed a credential-theft tool.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
