tasks:
  - task_id: incident_39_latest_test_set_task_32
    title: incident_39_latest_test_set_task_32
    description: 'Which user account name was identified as running the SMB session enumeration from VNEVADO-Win10V according to the later ''User and IP address reconnaissance (SMB)'' alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024 a remote session to host "vnevado-win10b" (device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb) used the local account "fk8mq" from IP 141.216.110.153 to drop and run the tool "rubeus.exe" (PID 2608, launched at 2024-06-27T14:33:27Z). Minutes later, Defender raised a second alert indicating possible use of the Rubeus kerberoasting tool on the same endpoint. Several days after these events, another alert reported that a user on workstation VNEVADO-Win10V enumerated SMB sessions on domain controller VNEVADO-DC to gather recent IP information for two accounts.'
      question: 'Which user account name was identified as running the SMB session enumeration from VNEVADO-Win10V according to the later ''User and IP address reconnaissance (SMB)'' alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Ethan Brooks'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A remote session dropped and launched the process with ExtractedFileName `rubeus.exe`, indicating the Rubeus tool was brought onto the machine.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Immediately after, the alert “Possible use of the Rubeus kerberoasting tool” shows the tool was executed by the account whose AadUserId is `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, confirming active Kerberos-related credential-theft activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Subsequently, the account with Name `Ethan Brooks` performed SMB reconnaissance, suggesting the attacker—having obtained credentials—started lateral-movement discovery inside the network.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
