tasks:
  - task_id: incident_39_latest_test_set_task_61
    title: incident_39_latest_test_set_task_61
    description: 'Immediately after the antivirus-tampering attempt, an alert titled "Suspicious process stopping services" was triggered. Which executable was responsible for issuing the command to stop services on the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 4 Jul 2024 at 22:35 UTC, Microsoft Defender detected an attempt to tamper with Microsoft Defender Antivirus on host "vnevado-win10b". The action was executed under account "fk8mq" (SID S-1-5-21-1540151660-3530000288-105586595-1517) via a PowerShell command (process ID 6968) that tried to disable real-time protection. This suspicious behaviour is part of a broader sequence of events occurring on the same system within the same minute.'
      question: 'Immediately after the antivirus-tampering attempt, an alert titled "Suspicious process stopping services" was triggered. Which executable was responsible for issuing the command to stop services on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'net.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'net.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Rubeus activity was detected when the process with ExtractedFileName `adminticket.txt` was created, indicating a kerberoasting attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Next, PsExec was used to run the process whose ExtractedFileName is `net.exe`, showing remote command execution.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'That remote command launched `net.exe` with ProcessId__CreatedTimeUtc__CommandLine `6428__2024-06-27t14:34:10.8607851z__"net.exe" stop ntds /y`, which stopped the NTDS service on the target device.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_4
        title: Checkpoint 4
        description: 'To evade defenses, the attacker account identified by Sid `S-1-5-21-1540151660-3530000288-105586595-1517` attempted to disable Microsoft Defender Antivirus, completing the attack chain.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
