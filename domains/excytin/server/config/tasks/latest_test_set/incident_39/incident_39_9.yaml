    title: incident_39_latest_test_set_task_9
    description: 'According to the ''Kekeo'' malware detection alert generated at 2024-07-04 22:35:03 UTC, what is the name of the executable file that was identified on the host?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation on domain controller "vnevado-dc", the account "lucasb" (SID S-1-5-21-1440151660-4837038288-105596163-1120) was observed running a PowerShell command that stopped the NTDS service and attempted a SID-history injection, an action often used to gain elevated privileges. Moments later, a known credential-theft tool execution was detected on the same host, and almost simultaneously Microsoft Defender flagged a piece of malware associated with the toolset "Kekeo", indicating that malicious code had been placed on the system.'
      question: 'According to the ''Kekeo'' malware detection alert generated at 2024-07-04 22:35:03 UTC, what is the name of the executable file that was identified on the host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
