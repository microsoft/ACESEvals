    title: incident_39_latest_test_set_task_28
    description: 'What is the process ID (PID) of the process that suspiciously stopped services on the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024, a “SID history injection” alert was raised after a file named "dkwj.mze" appeared and the command line "net1 stop ntds /y" was executed by process 7712. This suggests an attacker may have been attempting to tamper with Active Directory-related services. Shortly before this, another alert flagged that a different process had suspiciously stopped services on the same device.'
      question: 'What is the process ID (PID) of the process that suspiciously stopped services on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '6428'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '6428'
      scoring:
        max_score: 1.0
