tasks:
  - task_id: incident_39_latest_test_set_task_84
    title: incident_39_latest_test_set_task_84
    description: 'What is the name of the user account that was linked to the Microsoft Defender Antivirus tampering detected at 22:35:00 UTC on 2024-07-04?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of an incident where several dual-purpose tools (including psexesvc.exe, mimikatz.exe, psexec.exe, domaindominance27.ps1, and rubeus.exe) were dropped on a device on 2024-07-04 at 22:35:02 UTC, telemetry shows that just moments earlier—at 22:35:00 UTC—an alert was raised for Microsoft Defender Antivirus tampering. Identifying the user behind this tampering attempt is critical to understanding the attacker’s actions and scope.'
      question: 'What is the name of the user account that was linked to the Microsoft Defender Antivirus tampering detected at 22:35:00 UTC on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tgs2z'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools were dropped on the device, including the process with ExtractedFileName `powershell.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, an attempt to disable Microsoft Defender Antivirus was detected and tied to the account with Name `tgs2z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
