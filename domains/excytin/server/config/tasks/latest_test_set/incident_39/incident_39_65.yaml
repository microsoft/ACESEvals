    description: 'According to the "Suspicious remote activity" alert triggered at 22:35:03 UTC, which executable file name was detected on the compromised machine?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security monitoring flagged a sequence of events that might indicate human-operated malicious activity. The chain starts with user account "kyleg" on a device (device identifier withheld) at 2024-07-04 22:35:04 UTC, where multiple alerts were raised, including one titled "Potential human-operated malicious activity." Just moments earlier, at 22:35:03 UTC, the same device generated an additional alert titled "Suspicious remote activity," suggesting that an external host may have executed commands or transferred files to establish interactive control or schedule tasks.'
      question: 'According to the "Suspicious remote activity" alert triggered at 22:35:03 UTC, which executable file name was detected on the compromised machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
