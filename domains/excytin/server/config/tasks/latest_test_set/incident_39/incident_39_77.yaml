tasks:
  - task_id: incident_39_latest_test_set_task_77
    title: incident_39_latest_test_set_task_77
    description: 'According to the alert pointing to possible Rubeus kerberoasting activity, what is the name of the script or executable that was detected running on the endpoint?'
    inherit_shared: true
    initial_context:
      incident_context: 'During investigation of a recent security incident, we saw a sign-in attempt from user account "kyleg" coming from the external IP 35.202.74.47, which triggered the "Sign-in attempt with deceptive user account" alert. A few seconds later, an additional alert indicated that the Rubeus kerberoasting tool might have been executed on the same endpoint, suggesting an attempt to request and abuse Kerberos tickets for credential theft.'
      question: 'According to the alert pointing to possible Rubeus kerberoasting activity, what is the name of the script or executable that was detected running on the endpoint?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'get-krbticket.ps1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A deceptive sign-in attempt was made using account Name `tgs2z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, the Rubeus kerberoasting tool was likely executed via the process ExtractedFileName `get-krbticket.ps1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
