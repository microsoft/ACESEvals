    title: incident_39_latest_test_set_task_16
    description: 'According to the alert showing that a file was dropped and executed from a remote location, which user account name initiated that remote session?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed a PowerShell command (process ID 3780) that invoked net.exe to stop the NTDS service, potentially to tamper with Active Directory. This activity triggered the alert “Suspicious process stopping services” on 2024-07-04 22:35:01 UTC. Immediately afterward, another alert titled “File dropped and launched from remote location” was raised, indicating that a file had been transferred to the same host during a remote session and then executed.'
      question: 'According to the alert showing that a file was dropped and executed from a remote location, which user account name initiated that remote session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'fk8mq'
      scoring:
        max_score: 1.0
