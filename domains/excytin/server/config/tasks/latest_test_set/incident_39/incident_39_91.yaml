tasks:
  - task_id: incident_39_latest_test_set_task_91
    title: incident_39_latest_test_set_task_91
    description: 'According to the earlier "Malicious credential theft tool execution detected" alert that is linked to Ethan Brooks’s malicious URL click, what is the name of the account associated with the credential-theft activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security investigation was initiated after user Ethan Brooks (Ethan Brooks@vnevado.alpineskihouse.co) clicked a suspicious link hosted at https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/. This action generated the alert titled "A potentially malicious URL click was detected." During triage, analysts discovered that this alert is connected—through a shared user account SID—to an earlier alert dated 2024-07-04, which reported the execution of a known credential-theft tool on the same environment.'
      question: 'According to the earlier "Malicious credential theft tool execution detected" alert that is linked to Ethan Brooks’s malicious URL click, what is the name of the account associated with the credential-theft activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tgs2z'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Malicious credential theft tool execution detected on 2024-07-04 22:35:01.182306+00:00 by account Name `tgs2z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A potentially malicious URL was clicked on 2024-07-10 11:24:45.397218+00:00 by account Sid `S-5-7-21-1843151660-3234030288-105586167-1422`.'
