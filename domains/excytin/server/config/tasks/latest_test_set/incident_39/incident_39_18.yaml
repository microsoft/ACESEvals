tasks:
  - task_id: incident_39_latest_test_set_task_18
    title: incident_39_latest_test_set_task_18
    description: 'A few days earlier, on 2024-07-04, the alert “Possible use of the Rubeus kerberoasting tool” was raised on an endpoint. According to that alert, which account name was involved in the suspected kerberoasting activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, security telemetry flagged a potentially malicious URL click on 2024-07-10 by user Ethan Brooks (ethan brooks@vnevado.alpineskihouse.co). The click originated from a link hosted on an Azure Container Apps domain and triggered the alert “A potentially malicious URL click was detected.” Analysts suspect this activity may be related to subsequent credential-theft behavior observed elsewhere in the environment.'
      question: 'A few days earlier, on 2024-07-04, the alert “Possible use of the Rubeus kerberoasting tool” was raised on an endpoint. According to that alert, which account name was involved in the suspected kerberoasting activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tgs2z'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A potentially malicious URL was clicked by account with Sid `S-5-7-21-1843151660-3234030288-105586167-1422`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Possible use of the Rubeus kerberoasting tool was observed for account Name `tgs2z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
