tasks:
  - task_id: incident_39_latest_test_set_task_36
    title: incident_39_latest_test_set_task_36
    description: 'According to the subsequent "Suspicious service launched" alert raised at 22:35:02 Z on 2024-07-04, which executable was identified as the process that started the suspicious service?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we found that the user account "tgs2z" on host "vnevado-win10v" executed a PowerShell script (domaindominance27.ps1) and soon after ran the command `net.exe user /add bdadmin password1! /domain`, which triggered a "Suspicious account creation" alert. Immediately following these activities, another alert reported that an unexpected Windows service was started on the same device.'
      question: 'According to the subsequent "Suspicious service launched" alert raised at 22:35:02 Z on 2024-07-04, which executable was identified as the process that started the suspicious service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'services.exe'
      scoring:
        max_score: 1.0
