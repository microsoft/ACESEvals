tasks:
  - task_id: incident_39_latest_test_set_task_81
    title: incident_39_latest_test_set_task_81
    description: 'Identify the Azure AD user ID (AadUserId) tied to the "Suspicious service launched" alert that occurred at 22:35:00 UTC on 2024-07-04.'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 at 22:35:01 UTC, a “Suspicious account creation” alert was raised on host "vnevado-win10v." The investigation shows the local account "tgs2z" executing PowerShell and running the command `net.exe user /add bdadmin password1! /domain`, indicating a possible attempt to establish persistence. Just one second earlier, a related alert titled “Suspicious service launched” was triggered on the same device, suggesting that an attacker might have started a malicious service under a particular Azure Active Directory identity.'
      question: 'Identify the Azure AD user ID (AadUserId) tied to the "Suspicious service launched" alert that occurred at 22:35:00 UTC on 2024-07-04.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '7fcf9695-68fc-4258-864d-e1e5b166c66f'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '7fcf9695-68fc-4258-864d-e1e5b166c66f'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An attacker used the process with ExtractedFileName `net.exe` to create a new user account (alert: Suspicious account creation).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Immediately around the same time, the attacker (account AadUserId `7fcf9695-68fc-4258-864d-e1e5b166c66f`) launched a suspicious service to maintain persistence (alert: Suspicious service launched).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
