    title: incident_39_latest_test_set_task_46
    description: 'What is the name of the executable that was registered as a suspicious service in the alert linked to the activity originating from the account "kyleg"?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security monitoring flagged potential human-operated malicious activity associated with the user account "kyleg" on a corporate device. Among the follow-up alerts, investigators noted that an executable was registered as a Windows service—an action often used by attackers to gain persistence after initial access.'
      question: 'What is the name of the executable that was registered as a suspicious service in the alert linked to the activity originating from the account "kyleg"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'psexesvc.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Potential human-operated malicious activity was detected on host HostName=`vnevado-win10b`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
