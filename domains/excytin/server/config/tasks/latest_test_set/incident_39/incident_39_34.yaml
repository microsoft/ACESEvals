tasks:
  - task_id: incident_39_latest_test_set_task_34
    title: incident_39_latest_test_set_task_34
    description: 'In the related alert raised seconds earlier—"Multiple dual-purpose tools were dropped"—investigators observed that a well-known post-exploitation utility was written to disk. What is the name of that executable file?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, Microsoft Defender flagged an alert titled "PsExec launched a command on a remote device" on 2024-07-04. The alert showed that an attacker used PsExec (e.g., psexec.exe) together with several PowerShell-based commands such as get-krbticket.ps1 and other administrative utilities (e.g., net.exe) to run remote commands, disable real-time monitoring, and tamper with domain services. These activities indicate possible lateral-movement attempts and preparation for credential theft on the same endpoint.'
      question: 'In the related alert raised seconds earlier—"Multiple dual-purpose tools were dropped"—investigators observed that a well-known post-exploitation utility was written to disk. What is the name of that executable file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'rubeus.exe'
      scoring:
        max_score: 1.0
