tasks:
  - task_id: incident_39_latest_test_set_task_44
    title: incident_39_latest_test_set_task_44
    description: 'According to the "An active ''Kekeo'' malware was detected" alert, what is the name of the executable that was identified as running on the host?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security alert reported that at 2024-07-04 22:35:01 UTC a successful logon using an overpass-the-hash technique was made from IP address 141.216.110.153 with account SID S-2-2-78. The logon involved the process "lsass.exe" and occurred on the same host that, only two seconds later, triggered an additional alert: "An active ''Kekeo'' malware was detected." Investigators need to understand which malicious program was found running on that host after the suspicious logon.'
      question: 'According to the "An active ''Kekeo'' malware was detected" alert, what is the name of the executable that was identified as running on the host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'rubeus.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A successful overpass-the-hash logon was detected on the host with HostName `vnevado-win10b`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Active ‘Kekeo’ malware was found running as a process whose ExtractedFileName is `rubeus.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
