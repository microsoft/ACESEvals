tasks:
  - task_id: incident_39_latest_test_set_task_92
    title: incident_39_latest_test_set_task_92
    description: 'During the suspected overpass-the-hash attempt on 2024-07-10, what is the name of the Helpdesk Administrator account that tried to authenticate to VNEVADO-DC?'
    inherit_shared: true
    initial_context:
      incident_context: 'A device named VNEVADO-Win10b raised a Potential human-operated malicious activity alert on 2024-07-04. During this event we observed several suspicious processes, including the execution of rubeus.exe (Process ID 2608) launched from the command line and the creation of the file adminticket.txt. The activity involved local accounts such as fk8mq and kyleg and came from the public IP address 141.216.110.153. A few days later, another alert was generated for a suspected overpass-the-hash (Kerberos) attempt from workstation VNEVADO-Win10V against the domain controller VNEVADO-DC, performed by a Helpdesk Administrator.'
      question: 'During the suspected overpass-the-hash attempt on 2024-07-10, what is the name of the Helpdesk Administrator account that tried to authenticate to VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Emma Clark'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Emma Clark'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Potential human-operated malicious activity was observed involving the Azure AD account with field AadUserId = `97e6a954-b6bd-48a5-808c-bd8464cce677`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspected overpass-the-hash (Kerberos) attack occurred when the account with field Name = `Emma Clark` attempted to authenticate against the domain controller.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
