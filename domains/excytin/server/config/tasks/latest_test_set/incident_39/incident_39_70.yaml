tasks:
  - task_id: incident_39_latest_test_set_task_70
    title: incident_39_latest_test_set_task_70
    description: 'Which user account was associated with the "''Kekeo'' malware was detected and was active" alert triggered on host vnevado-win10v at 22:35:03 UTC on 2024-07-04?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation on host ''vnevado-win10v'' (device ID 4d8d23e9-a77d-4e33-9435-b8c457e57ca1), Microsoft Defender recorded a malware alert at 22:35:03 UTC on 2024-07-04. The alert, titled "''Kekeo'' malware was detected," indicated that suspicious activity had been identified on the endpoint and referenced an unknown file still under review. A follow-up alert seconds later reported that the same malware was not only detected but also actively running on the system.'
      question: 'Which user account was associated with the "''Kekeo'' malware was detected and was active" alert triggered on host vnevado-win10v at 22:35:03 UTC on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'fk8mq'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Kekeo malware was detected on a file with Name ''rubeus.exe''.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Kekeo malware was reported as active under an account with Name ''fk8mq''.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
