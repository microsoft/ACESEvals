tasks:
  - task_id: incident_39_latest_test_set_task_68
    title: incident_39_latest_test_set_task_68
    description: 'Provide the email address of the Helpdesk Administrator account that triggered the "Suspected overpass-the-hash attack (Kerberos)" alert.'
    inherit_shared: true
    initial_context:
      incident_context: 'Microsoft Defender has reported a sequence of related alerts suggesting malicious activity in the environment. It began on 2024-07-04 with a "Possible lateral movement" alert on host vnevado-win10b (device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb, IP 35.202.74.47). Only seconds later, the same investigation surfaced an alert that the ‘Kekeo’ malware was detected and active, raising concerns of credential-theft tooling in use. Several days after these events, an additional alert flagged a suspected overpass-the-hash Kerberos authentication attempt originating from a Helpdesk Administrator account on host VNEVADO-Win10V against the domain controller VNEVADO-DC.'
      question: 'Provide the email address of the Helpdesk Administrator account that triggered the "Suspected overpass-the-hash attack (Kerberos)" alert.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Emma Clark@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Emma Clark@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:01.716777+00:00, possible lateral movement was detected on the device with AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Two seconds later, at 2024-07-04 22:35:03.402097+00:00, the ''Kekeo'' malware was found active under the user account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`, suggesting credential-theft activity on the same timeframe.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Several days later, on 2024-07-10 11:24:45.313631+00:00, a suspected overpass-the-hash Kerberos attack was attempted by the account with Email `Emma Clark@vnevado.alpineskihouse.co`, indicating that the stolen or forged credentials were used to move laterally toward the domain controller.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
