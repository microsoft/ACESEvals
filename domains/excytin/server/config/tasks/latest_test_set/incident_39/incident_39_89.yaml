tasks:
  - task_id: incident_39_latest_test_set_task_89
    title: incident_39_latest_test_set_task_89
    description: 'Identify the recipient email address of the mail message involved in the "A potentially malicious URL click was detected" alert that occurred shortly after Julian Burke’s ticket was abused.'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, security telemetry showed that the Kerberos ticket for Julian Burke (IT director) was taken from workstation VNEVADO-Win10B and reused on another host (VNEVADO-Win10V) to access four resources. Shortly afterward, an alert was raised indicating that one of our users clicked a URL subsequently classified as malicious. The alert references an email message associated with that click, but the specific recipient address is not shown here.'
      question: 'Identify the recipient email address of the mail message involved in the "A potentially malicious URL click was detected" alert that occurred shortly after Julian Burke’s ticket was abused.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tgs2z@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An actor used the IP address (Address: 35.202.74.47) during the suspected pass-the-ticket identity-theft activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A sign-in attempt was made with a deceptive user account (Sid: S-5-7-21-1843151660-3234030288-105586167-1422).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'A user then clicked a potentially malicious URL contained in an email that was sent to Recipient: tgs2z@vnevado.alpineskihouse.co.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
