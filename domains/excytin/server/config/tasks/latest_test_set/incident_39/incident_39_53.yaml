tasks:
  - task_id: incident_39_latest_test_set_task_53
    title: incident_39_latest_test_set_task_53
    description: 'According to the alert titled "Email messages containing malicious URL removed after delivery", which email address was listed as the sender of those malicious messages?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an ongoing investigation, we observed that on July 4th a process called "psexesvc.exe" was executed remotely on host "vnevado-win10b" under the LocalSystem account, indicating potentially malicious remote activity. Shortly before that, several dual-purpose tools had been dropped on the same device. A few days later, on July 10th, security controls flagged and removed a batch of email messages that contained a malicious URL, suggesting the attacker had moved from lateral movement to an email-based delivery attempt.'
      question: 'According to the alert titled "Email messages containing malicious URL removed after delivery", which email address was listed as the sender of those malicious messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'k1pt7ez@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'k1pt7ez@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
