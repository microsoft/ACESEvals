tasks:
  - task_id: incident_39_latest_test_set_task_49
    title: incident_39_latest_test_set_task_49
    description: 'During the subsequent "Potential human-operated malicious activity" alert on 4 July, which user account was identified as being involved?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security monitoring detected an anomalous chain of account lookup commands executed via several "net.exe" processes on 27 June (e.g., "net.exe" user /domain and related group queries). This activity was flagged under the alert titled "Anomalous account lookups," suggesting an attacker might be gathering information about potential targets. Shortly afterward, another alert indicated that PsExec was used to launch a command on a remote device, reinforcing concerns of lateral movement.'
      question: 'During the subsequent "Potential human-operated malicious activity" alert on 4 July, which user account was identified as being involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'fk8mq'
      scoring:
        max_score: 1.0
