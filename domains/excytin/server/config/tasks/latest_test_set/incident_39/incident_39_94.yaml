tasks:
  - task_id: incident_39_latest_test_set_task_94
    title: incident_39_latest_test_set_task_94
    description: 'Which executable was observed running when the suspicious user account was created moments before the tools were dropped?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of an incident where several dual-purpose tools (including psexec.exe, mimikatz.exe, rubeus.exe, and a PowerShell script named domaindominance27.ps1) were dropped onto a device at 22:35:02 UTC on July 4 2024, telemetry shows that a few seconds earlier a new local user account was created on the same host. Analysts suspect this account was established to maintain persistence after the tools were staged.'
      question: 'Which executable was observed running when the suspicious user account was created moments before the tools were dropped?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'net.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'net.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The attacker used a PowerShell script (`ProcessId__CreatedTimeUtc__CommandLine` = `4676__2024-06-27t14:32:08.4041849z__"powershell.exe" -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1`) to drop multiple dual-purpose tools on the device.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, a suspicious account was created via the binary identified as (`ExtractedFileName` = `net.exe`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
