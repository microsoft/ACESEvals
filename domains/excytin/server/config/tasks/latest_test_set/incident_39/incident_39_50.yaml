tasks:
  - task_id: incident_39_latest_test_set_task_50
    title: incident_39_latest_test_set_task_50
    description: 'According to the "Mimikatz credential theft tool" alert raised at 2024-07-04 22:35:04 UTC, what is the name of the executable file that was identified on host vnevado-win10b?'
    inherit_shared: true
    initial_context:
      incident_context: 'A series of suspicious activities were observed on host "vnevado-win10b" (AadDeviceId fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb). First, Microsoft Defender for Endpoint raised a "Possible lateral movement" alert, followed moments later by a "Sign-in attempt with deceptive user account" alert. Shortly after these events, the same device triggered another alert indicating that the well-known credential-theft tool Mimikatz had been detected running on the system.'
      question: 'According to the "Mimikatz credential theft tool" alert raised at 2024-07-04 22:35:04 UTC, what is the name of the executable file that was identified on host vnevado-win10b?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:01, a sign-in attempt was made with a deceptive account (account Name: `tgs2z`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Within the same time window, the device reached out to an external destination (ip Address: `35.202.74.47`), pointing to possible lateral movement.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Seconds later, the credential-theft tool was discovered on the host (file Name: `mimikatz.exe`), confirming that the attacker is stealing credentials to facilitate further access.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
