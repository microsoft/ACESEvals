    title: incident_39_latest_test_set_task_23
    description: 'What is the username that was added in the suspicious account creation command?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation into a remote-execution incident began when a file named "psexesvc.exe" (process ID 5912) was dropped and launched on a device, triggering the alert "File dropped and launched from remote location." Moments later, additional alerts flagged potential human-operated malicious activity and possible use of the Rubeus kerberoasting tool on the same endpoint. Shortly after these events, Microsoft Defender raised a "Suspicious account creation" alert indicating that the attacker used the command "net.exe user /add … /domain" to create a new local domain user, likely to maintain persistence.'
      question: 'What is the username that was added in the suspicious account creation command?'
