    initial_context:
      incident_context: 'During the investigation we observed that, on host vnevado-win10b, the account fk8mq (SID S-1-5-21-1540151660-3530000288-105586595-1517) executed several commands, including psexesvc.exe and rubeus.exe, which are typical of kerberoasting activity. Only a few seconds later, telemetry shows PsExec being used to start a command on a remote device—an action that could indicate lateral movement by a different user.'
      question: 'What is the Azure AD user ID (AadUserId) of the account that executed the PsExec command on the remote device?'
