tasks:
  - task_id: incident_39_latest_test_set_task_90
    title: incident_39_latest_test_set_task_90
    description: 'According to the "Malicious credential theft tool execution detected" alert at 2024-07-04 22:35:03 Z, what is the name of the executable that was run?'
    inherit_shared: true
    initial_context:
      incident_context: 'On the device identified by Azure AD Device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb, Microsoft Defender for Endpoint first raised a "Possible lateral movement" alert. Almost immediately afterward, a "Sign-in attempt with deceptive user account" was detected on another host. Just a couple of seconds later, an additional alert titled "Malicious credential theft tool execution detected" was triggered, showing that a well-known credential-dumping utility had been executed from the command line. Investigators now need to determine precisely which executable was launched during this credential-theft activity.'
      question: 'According to the "Malicious credential theft tool execution detected" alert at 2024-07-04 22:35:03 Z, what is the name of the executable that was run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious lateral movement traffic was detected coming from IP address `35.202.74.47` (Field: Address).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Almost simultaneously, a deceptive sign-in attempt occurred on the device with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1` (Field: AadDeviceId), suggesting the attacker gained a foothold on that host.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Minutes later, the attacker executed a credential-theft utility with Process information `6880__2024-06-27t14:32:37.7041174z__"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit` (Field: ProcessId__CreatedTimeUtc__CommandLine), confirming malicious intent and successful execution of Mimikatz.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
