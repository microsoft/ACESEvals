tasks:
  - task_id: incident_39_latest_test_set_task_43
    title: incident_39_latest_test_set_task_43
    description: 'According to the "Possible lateral movement" alert raised at 22:35:01 UTC, to which IP address did the attacker likely attempt to move laterally?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024 at 22:35 UTC, Microsoft Defender for Endpoint raised the alert "Multiple dual-purpose tools were dropped" after files such as mimikatz.exe and other potentially malicious utilities were copied to a device. Just one second later, the same machine generated a "Suspicious remote activity" alert, indicating possible remote execution of commands. Almost simultaneously, a third alert titled "Possible lateral movement" indicated that the attacker may have pivoted from this host to another system on the network. Investigators need to identify the destination IP address involved in that lateral-movement attempt.'
      question: 'According to the "Possible lateral movement" alert raised at 22:35:01 UTC, to which IP address did the attacker likely attempt to move laterally?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '35.202.74.47'
      scoring:
        max_score: 1.0
