tasks:
  - task_id: incident_39_latest_test_set_task_41
    title: incident_39_latest_test_set_task_41
    description: 'According to the “Malicious credential theft tool execution detected” alert that followed the suspicious service launch, what is the name of the user account associated with this credential-theft activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'At 22:35:00 UTC on 4 July 2024, Microsoft Defender raised a “Suspicious service launched” alert on host vnevado-dc. The activity involved account ‘lucasb’, which executed the command line “powershell.exe  -command \"net.exe stop ntds /y; …\" followed by a separate “net.exe start ntds” command (PID 3400). Just one second later, a second alert was generated: “Malicious credential theft tool execution detected,” indicating that a credential-dumping utility was started immediately after the suspicious service event.'
      question: 'According to the “Malicious credential theft tool execution detected” alert that followed the suspicious service launch, what is the name of the user account associated with this credential-theft activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tgs2z'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious service launch detected: Process ExtractedFileName = `powershell.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Malicious credential-theft tool execution observed: Account Name = `tgs2z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
