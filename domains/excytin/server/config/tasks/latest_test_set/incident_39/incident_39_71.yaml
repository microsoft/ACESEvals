tasks:
  - task_id: incident_39_latest_test_set_task_71
    title: incident_39_latest_test_set_task_71
    description: 'Which executable did the attacker run during the "Suspicious sequence of exploration activities" alert that followed the Defender tampering attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'An alert titled "Microsoft Defender Antivirus tampering" was triggered on host vnevado-win10b after the account fk8mq (SID S-1-5-21-1540151660-3530000288-105586595-1517) ran a PowerShell command (process ID 6968) that attempted to disable Defender’s real-time monitoring. Security telemetry shows that, moments later, another alert flagged a suspicious sequence of Windows exploration commands executed on the same system—often a sign that an attacker is enumerating the environment following initial tampering. Investigators need to identify which command-line tool was used during this exploration step.'
      question: 'Which executable did the attacker run during the "Suspicious sequence of exploration activities" alert that followed the Defender tampering attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'whoami.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
