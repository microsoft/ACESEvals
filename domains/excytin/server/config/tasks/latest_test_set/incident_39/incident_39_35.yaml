tasks:
  - task_id: incident_39_latest_test_set_task_35
    title: incident_39_latest_test_set_task_35
    description: 'According to the alert raised for the credential-theft activity that followed the deceptive sign-in, what is the name of the executable file that was run?'
    inherit_shared: true
    initial_context:
      incident_context: 'A sign-in attempt using the deceptive user account "kyleg" originating from IP address 35.202.74.47 was observed. Immediately after this suspicious logon, security telemetry flagged the execution of a known credential-theft utility on the device.'
      question: 'According to the alert raised for the credential-theft activity that followed the deceptive sign-in, what is the name of the executable file that was run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in attempt was detected using a deceptive user account (Field: AadUserId, Value: `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Soon after, a malicious credential-theft tool was executed (Field: ExtractedFileName, Value: `mimikatz.exe`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
