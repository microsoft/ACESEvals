    title: incident_39_latest_test_set_task_30
    description: 'What is the SID of the account that is tied to the subsequent "Potential human-operated malicious activity" alert on vnevado-win10b?'
    inherit_shared: true
    initial_context:
      incident_context: 'A sign-in attempt using a deceptive user account was recorded on host vnevado-win10b (IP 141.216.110.153). The attempt was performed by account “kyleg” whose current SID is S-0-6-5. Just a couple of seconds later, the same device raised an alert for potential human-operated malicious activity—often a precursor to ransomware deployment.'
      question: 'What is the SID of the account that is tied to the subsequent "Potential human-operated malicious activity" alert on vnevado-win10b?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-1-5-21-1540151660-3530000288-105586595-1517'
      scoring:
