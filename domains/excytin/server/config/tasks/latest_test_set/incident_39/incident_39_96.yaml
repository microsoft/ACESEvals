    description: 'What is the name of the user account that performed the SMB session enumeration on VNEVADO-DC?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of a suspected privilege-escalation attempt, telemetry shows that the account "lucasb" executed a PowerShell-based SID history injection from host "vnevado-dc". Immediately afterwards, the environment logged anomalous user-account look-up activity, indicating possible reconnaissance. A few days later, security monitoring detected that an unidentified user on workstation "VNEVADO-Win10V" enumerated SMB sessions against the domain controller "VNEVADO-DC", collecting recent IP-address information for two different accounts.'
      question: 'What is the name of the user account that performed the SMB session enumeration on VNEVADO-DC?'
