tasks:
  - task_id: incident_39_latest_test_set_task_17
    title: incident_39_latest_test_set_task_17
    description: 'Immediately following these events, a separate alert flagged the execution of a known credential-theft tool. What executable name was identified in that final alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation we observed a remote session to host ''vnevado-win10b'' (device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb) coming from IP 141.216.110.153. In that session a file was dropped and executed with the command line: rubeus.exe  dump /service:xfbzkp /user:lucasb (process ID 2608, created 2024-06-27T14:33:27Z). This activity triggered the “File dropped and launched from remote location” alert and shortly after the “Possible use of the Rubeus kerberoasting tool” alert on the same host.'
      question: 'Immediately following these events, a separate alert flagged the execution of a known credential-theft tool. What executable name was identified in that final alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A remote session dropped and launched the process with ExtractedFileName `rubeus.exe`, indicating initial use of the Rubeus tool.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The host with HostName `vnevado-win10v` then showed activity consistent with kerberoasting, confirming possible use of Rubeus on that machine.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Soon after, another credential-theft process with ExtractedFileName `mimikatz.exe` was executed, showing the attacker expanded their toolkit to dump credentials.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
