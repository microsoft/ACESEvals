      question: 'What is the Azure AD user ID (AadUserId) of the account that was later implicated in the correlated Azure AD activity linked to this credential-theft incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
