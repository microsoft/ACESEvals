tasks:
  - task_id: incident_39_latest_test_set_task_1
    title: incident_39_latest_test_set_task_1
    description: 'According to the "Suspected DCSync attack (replication of directory services)" alert raised on 2024-07-10 11:24:45 UTC, which user account (provide the email address) initiated the replication request from VNEVADO-Win10V to VNEVADO-DC?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we observed a successful logon using an overpass-the-hash technique. The logon was performed by account "fk8mq" (SID S-2-2-78) on host "vnevado-win10b", where the process "lsass.exe" (PID 692) was spawned on 2024-06-26T17:11:52Z. A few days later, additional activity was detected: a suspected overpass-the-hash Kerberos authentication attempt originating from workstation VNEVADO-Win10V against the domain controller VNEVADO-DC. Shortly after, the attacker issued a replication request to the domain controller from the same workstation, triggering a "Suspected DCSync attack (replication of directory services)" alert.'
      question: 'According to the "Suspected DCSync attack (replication of directory services)" alert raised on 2024-07-10 11:24:45 UTC, which user account (provide the email address) initiated the replication request from VNEVADO-Win10V to VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Julian Burke@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Julian Burke@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account with Sid `S-1-5-21-1540151660-3530000288-105586595-1517` successfully logged on using an overpass-the-hash technique.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
