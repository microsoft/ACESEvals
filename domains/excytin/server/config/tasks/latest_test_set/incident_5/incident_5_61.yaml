tasks:
  - task_id: incident_5_latest_test_set_task_61
    title: incident_5_latest_test_set_task_61
    description: 'According to the "Possible lateral movement" alert raised on 2024-07-04, what IP address is linked to the suspicious lateral-movement activity?'
    inherit_shared: true
    initial_context:
      incident_context: ''
      question: 'According to the "Possible lateral movement" alert raised on 2024-07-04, what IP address is linked to the suspicious lateral-movement activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '38.142.109.10'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '38.142.109.10'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Device exhibiting ransomware-like behavior detected: AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Possible lateral movement observed from IP address `38.142.109.10`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
