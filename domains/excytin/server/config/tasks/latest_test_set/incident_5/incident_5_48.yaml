tasks:
  - task_id: incident_5_latest_test_set_task_48
    title: incident_5_latest_test_set_task_48
    description: 'Which local account name was flagged in the alert that detected the ‘CommandAndControl’ malware during lateral movement?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we noted that a Windows Sysinternals tool was renamed and executed on a host at 2024-07-04 22:35 UTC. The process list showed renamed binaries such as "mimikatz.exe" and "notepad.exe" being launched, suggesting an attempt at privilege escalation or credential theft on the same machine. Shortly afterward, activity progressed to lateral-movement tooling (including a PSExec connection toward the jump server) and, minutes later, a ransomware payload was remotely executed. Finally, an alert reported that a piece of ‘CommandAndControl’ malware was detected on another device, indicating an adversary moving laterally across the environment.'
      question: 'Which local account name was flagged in the alert that detected the ‘CommandAndControl’ malware during lateral movement?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'dp5hn'
      scoring:
        max_score: 1.0
