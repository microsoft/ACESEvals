tasks:
  - task_id: incident_5_latest_test_set_task_38
    title: incident_5_latest_test_set_task_38
    description: 'Which host generated the subsequent alert for ransomware-style file-system activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a Command-and-Control (C2) event, we observed account “dp5hn” (SID S-1-5-21-1840191660-8534830288-125585561-1522, AAD ID 731adb71-b11c-4bbf-850b-57989b350e96) executing the command line “curl http://vectorsandarrows.com” (Process ID 5572, 2024-06-20 09:32:04 UTC). Microsoft Defender flagged this activity with the alert “Command and Control behavior was blocked,” indicating possible malware attempting to communicate with an external domain. Just seconds later, a separate alert titled “Ransomware behavior detected in the file system” was raised for the same endpoint, suggesting suspicious mass-encryption activity consistent with ransomware.'
      question: 'Which host generated the subsequent alert for ransomware-style file-system activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11u'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win11u'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Step 1 – host.HostName=vnevado-win11u: Command-and-control behavior was blocked on host `vnevado-win11u` at 2024-07-04 22:35:01 UTC.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Step 2 – host.HostName=vnevado-win11u: Moments later, ransomware-style file-system changes were detected on the same host `vnevado-win11u`, indicating possible ransomware execution.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
