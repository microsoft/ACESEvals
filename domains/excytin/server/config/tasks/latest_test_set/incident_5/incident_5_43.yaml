tasks:
  - task_id: incident_5_latest_test_set_task_43
    title: incident_5_latest_test_set_task_43
    description: 'During the subsequent "System recovery setting tampering" alert, what exact Windows command was executed to disable the operating system’s recovery feature?'
    inherit_shared: true
    initial_context:
      incident_context: 'A ransomware payload was remotely launched on a device in our environment at 22:35 UTC, originating from the external IP address 99.83.111.100. This activity suggests an attempt to encrypt data and disrupt normal operations. Investigators should note that disabling built-in recovery mechanisms often follows such attacks, as adversaries seek to hinder remediation efforts.'
      question: 'During the subsequent "System recovery setting tampering" alert, what exact Windows command was executed to disable the operating system’s recovery feature?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bcdedit /set recoveryenabled no'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bcdedit /set recoveryenabled no'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A process tampered with system recovery by executing the command line `bcdedit /set recoveryenabled no` (ProcessId__CreatedTimeUtc__CommandLine = `4828__2024-06-20t09:31:59.6743318z__bcdedit /set recoveryenabled no`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
