tasks:
  - task_id: incident_5_latest_test_set_task_2
    title: incident_5_latest_test_set_task_2
    description: 'Which user account (email address) was identified in the later alert for the blocked SMB-based lateral-movement attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024, security monitoring raised an alert titled "Potentially compromised assets exhibiting ransomware-like behavior." The activity was associated with the account name "dp5hn" and several suspicious files, including script "get-userprttoken.ps1" and archives "characterical.zip" and "characterical.zip.lockbit." Days later, a follow-up alert reported that attack disruption had blocked an attempt to perform lateral movement by creating, deleting, or modifying files over the SMB protocol on multiple devices.'
      question: 'Which user account (email address) was identified in the later alert for the blocked SMB-based lateral-movement attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Grace Chen@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Grace Chen@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert indicates that the device at IP Address `99.83.111.100` is exhibiting ransomware-like behavior.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, lateral movement over SMB was blocked for the user with Email `Grace Chen@vnevado.alpineskihouse.co`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
