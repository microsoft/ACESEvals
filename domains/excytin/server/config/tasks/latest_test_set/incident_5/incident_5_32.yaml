    initial_context:
      incident_context: 'During investigation of suspicious ''GenRansom'' behaviour reported on host "vnevado-win11t" (device ID e5799261-6720-4297-961e-bd9ca4275033), we observed follow-up alerts indicating a possible attempt to access a Primary Refresh Token (PRT) just seconds earlier on the same device. Understanding which user account was associated with that PRT access attempt is essential for scoping potential credential compromise.'
