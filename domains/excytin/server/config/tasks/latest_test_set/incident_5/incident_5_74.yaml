tasks:
  - task_id: incident_5_latest_test_set_task_74
    title: incident_5_latest_test_set_task_74
    description: 'According to the "Malicious credential theft tool execution detected" alert in this incident, what is the name of the credential-theft executable that was run?'
    inherit_shared: true
    initial_context:
      incident_context: 'During our investigation of a suspicious WMI-based process creation on host "vnevado-win10r", we observed several commands executed by account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522). These commands included shadow copy deletion, boot status policy changes, PowerShell script execution, and outbound cURL traffic — all of which can be associated with ransomware preparation and defense-evasion techniques. Shortly after, multiple related alerts were raised, including one flagging the execution of a well-known credential-theft utility whose command line indicated an attempt to perform Pass-the-Hash against the domain "vnevado.alpineskihouse.co".'
      question: 'According to the "Malicious credential theft tool execution detected" alert in this incident, what is the name of the credential-theft executable that was run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
