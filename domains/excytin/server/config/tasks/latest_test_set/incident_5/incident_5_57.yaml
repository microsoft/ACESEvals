tasks:
  - task_id: incident_5_latest_test_set_task_57
    title: incident_5_latest_test_set_task_57
    description: 'Identify the security identifier (SID) of the account that carried out these system-recovery–disabling commands on the device.'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into suspicious activity on host ''vnevado-win11u'', we observed that the user account ''dp5hn'' (AadUserId 731adb71-b11c-4bbf-850b-57989b350e96) executed native Windows utilities such as ''vssblatemp.exe'' and ''bcdedit.exe'' in quick succession. The commands issued (for example, ''vssblatemp.exe delete shadows /all'' and ''bcdedit /set recoveryenabled no'') indicate an attempt to tamper with system-recovery settings—an established technique used by adversaries to disable backups and hinder recovery efforts.'
      question: 'Identify the security identifier (SID) of the account that carried out these system-recovery–disabling commands on the device.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-1-5-21-1840191660-8534830288-125585561-1522'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'System recovery setting tampering was detected, carried out by the account with Sid `S-1-5-21-1840191660-8534830288-125585561-1522`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
