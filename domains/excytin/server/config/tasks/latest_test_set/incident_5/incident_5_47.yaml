tasks:
  - task_id: incident_5_latest_test_set_task_47
    title: incident_5_latest_test_set_task_47
    description: 'According to the related alert, from which host was the suspicious remote activity initiated?'
    inherit_shared: true
    initial_context:
      incident_context: 'A possible ransomware incident was detected on host "vnevado-win11t" after numerous files—including "characterical.zip" and its encrypted variant "characterical.zip.lockbit"—were modified with an extension commonly used by ransomware. A PowerShell script named "get-userprttoken.ps1" was also present on the same device. While analyzing this initial alert, investigators discovered a second, nearly simultaneous alert reporting suspicious remote activity initiated from a different machine toward the environment.'
      question: 'According to the related alert, from which host was the suspicious remote activity initiated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10s'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win10s'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity was detected on host HostName=vnevado-win10s.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Soon after, possible ransomware activity communicated with ip Address=99.83.111.100, indicating mass encryption attempts.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
