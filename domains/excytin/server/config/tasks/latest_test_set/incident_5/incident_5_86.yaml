    title: incident_5_latest_test_set_task_86
    description: 'According to the later alert that flagged ransomware-like activity on multiple devices, what is the name of the file that was involved in that suspicious behavior?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 an alert titled “Windows Sysinternals tool renamed” was raised after a renamed utility was executed together with processes such as "mimikatz.exe" and "powershell.exe". This activity is suspected to be part of a larger intrusion that later triggered additional alerts, including the use of PsExec for lateral movement to the jump server. Investigators now need to review the subsequent ransomware-like behavior that was detected only a few seconds after the initial Sysinternals alert.'
      question: 'According to the later alert that flagged ransomware-like activity on multiple devices, what is the name of the file that was involved in that suspicious behavior?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-userprttoken.ps1'
