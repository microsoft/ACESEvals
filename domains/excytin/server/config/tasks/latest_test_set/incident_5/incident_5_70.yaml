tasks:
  - task_id: incident_5_latest_test_set_task_70
    title: incident_5_latest_test_set_task_70
    description: 'During the follow-up investigation, Microsoft Defender generated a separate alert named “Possible lateral movement.” According to that alert, what IP address was involved in the suspected lateral movement activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024, Microsoft Defender raised an alert titled “Unknown malware was detected and was active.” Analysis of the device showed multiple executions of “mimikatz.exe” spawning child processes such as notepad.exe and cmd.exe, indicating that the attacker was attempting to extract or leverage credentials. This initial alert suggests the machine may already have been compromised and is now being used as a foothold for further malicious activity, such as lateral movement inside the environment.'
      question: 'During the follow-up investigation, Microsoft Defender generated a separate alert named “Possible lateral movement.” According to that alert, what IP address was involved in the suspected lateral movement activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '83.162.58.168'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '83.162.58.168'
      scoring:
        max_score: 1.0
