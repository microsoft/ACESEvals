tasks:
  - task_id: incident_5_latest_test_set_task_100
    title: incident_5_latest_test_set_task_100
    description: 'According to the system-recovery-setting-tampering alert, what was the process ID (PID) of the executable that attempted to delete all volume shadow copies on host "vnevado-win11u"?'
    inherit_shared: true
    initial_context:
      incident_context: 'On the Windows 11 host named "vnevado-win11u" (device ID bc00e484-d0e5-4da4-9472-95568cccc07e), Microsoft Defender flagged a "Possible attempt to access Primary Refresh Token (PRT)". The activity was initiated by the process "browsercore.exe" (PID 1640) on 2024-06-20 at 09:32:12 UTC. Shortly afterwards, another alert in the same incident reported tampering with the system-recovery settings on this device, indicating that a process executed a command to delete all volume shadow copies.'
      question: 'According to the system-recovery-setting-tampering alert, what was the process ID (PID) of the executable that attempted to delete all volume shadow copies on host "vnevado-win11u"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '7236'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '7236'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert indicates that account with Name `dp5hn` was involved in a possible attempt to access a Primary Refresh Token (PRT).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, a process with ProcessId `7236`, CreatedTimeUtc `2024-06-20t09:10:51.2193152z`, and CommandLine `vssblatemp.exe delete shadows /all` was executed, showing tampering with system-recovery settings by deleting all volume shadow copies.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
