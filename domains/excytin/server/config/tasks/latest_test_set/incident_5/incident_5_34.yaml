tasks:
  - task_id: incident_5_latest_test_set_task_34
    title: incident_5_latest_test_set_task_34
    description: 'According to the alert titled "PsExec launched a command on a remote device", which executable did the attacker attempt to run remotely via PsExec?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation on host ''vnevado-win10s'', several suspicious commands were executed in quick succession, such as disabling Windows recovery, deleting VSS shadow copies, running a PowerShell script, and making an outbound curl request. These actions were observed immediately before a ‘Suspicious WMI process creation’ alert, suggesting that malware was trying to spawn additional processes and possibly move laterally by abusing WMI. A follow-on series of alerts flagged ransomware-like behavior on multiple devices and the use of PsExec for remote command execution, indicating the attacker’s attempt to spread across the network.'
      question: 'According to the alert titled "PsExec launched a command on a remote device", which executable did the attacker attempt to run remotely via PsExec?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'notepad.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'notepad.exe'
      scoring:
        max_score: 1.0
