tasks:
  - task_id: incident_5_latest_test_set_task_7
    title: incident_5_latest_test_set_task_7
    description: 'According to the "Suspicious remote activity" alert raised on 2024-07-04, which IP address was identified as the origin of the remote access to host "vnevado-win11t"?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 the device named "vnevado-win11t" (AadDeviceId: e5799261-6720-4297-961e-bd9ca4275033) generated an alert titled "System recovery setting tampering" after commands like "vssblatemp.exe delete shadows /all" (PID 1900) and "bcdedit /set recoveryenabled no" (PID 3464) were executed, indicating possible attempts to disable volume shadow copies and other recovery features. Almost simultaneously, the security system raised a second alert, "Suspicious remote activity", reporting that the same host had been accessed from an external network location. Investigators must determine the source of this remote interaction.'
      question: 'According to the "Suspicious remote activity" alert raised on 2024-07-04, which IP address was identified as the origin of the remote access to host "vnevado-win11t"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '99.83.111.100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity originated from IP address `99.83.111.100` (Field: Address).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Immediately after, system-recovery settings on the device were tampered with by the account having SID `S-1-5-21-1840191660-8534830288-125585561-1522` (Field: Sid).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
