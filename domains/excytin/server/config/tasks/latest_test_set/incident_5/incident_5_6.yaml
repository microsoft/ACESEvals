tasks:
  - task_id: incident_5_latest_test_set_task_6
    title: incident_5_latest_test_set_task_6
    description: 'Which file name is specifically called out in the later ransomware-related alert as being involved on the compromised assets?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a Windows 10 device named "vnevado-win10r" (AadDeviceId: 9d4887ba-0b69-47d6-89bc-9b32787f379e) was flagged after the process "browsercore.exe" (PID 1792) was observed at 09:11 UTC on 2024-06-20 in an alert titled "Possible attempt to access Primary Refresh Token (PRT)." Only seconds later, another alert warned that the same environment was showing ransomware-like behavior on several devices, suggesting the attacker might have begun dropping malicious payloads.'
      question: 'Which file name is specifically called out in the later ransomware-related alert as being involved on the compromised assets?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kiters.7z'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'kiters.7z'
      scoring:
        max_score: 1.0
