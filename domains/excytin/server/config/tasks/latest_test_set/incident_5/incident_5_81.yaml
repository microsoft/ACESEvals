tasks:
  - task_id: incident_5_latest_test_set_task_81
    title: incident_5_latest_test_set_task_81
    description: 'According to the "Suspicious access to LSASS service" alert raised at 22:35:00 UTC on 2024-07-04, which DLL file was identified as being involved in the attempt to access LSASS?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of a multi-step security incident, we observed the following sequence on host "vnevado-win11u" (AadDeviceId bc00e484-d0e5-4da4-9472-95568cccc07e). First, a "Ransomware behavior detected in the file system" alert was raised at 22:35:04 UTC on 2024-07-04, indicating suspicious encryption-like activity. Seconds later, two related alerts flagged possible attempts to access a Primary Refresh Token (PRT), suggesting credential-theft behavior. Finally, at 22:35:00 UTC an alert titled "Suspicious access to LSASS service" was triggered, pointing to potential dumping of credentials from LSASS memory. You need to review the artefacts associated with that last alert.'
      question: 'According to the "Suspicious access to LSASS service" alert raised at 22:35:00 UTC on 2024-07-04, which DLL file was identified as being involved in the attempt to access LSASS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samlib.dll'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'samlib.dll'
      scoring:
        max_score: 1.0
