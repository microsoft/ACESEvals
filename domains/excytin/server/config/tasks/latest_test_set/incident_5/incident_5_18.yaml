tasks:
  - task_id: incident_5_latest_test_set_task_18
    title: incident_5_latest_test_set_task_18
    description: 'In the "Windows Sysinternals tool renamed" alert that followed, what is the name of the executable that was launched after being renamed?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of an "Unknown malware was detected and was active" alert, several instances of the credential-stealing utility "mimikatz.exe" (along with its companion file "mimilib.dll") were observed running with high-privilege commands on the affected host. Just seconds later, another alert titled "Windows Sysinternals tool renamed" was raised, indicating that a legitimate Sysinternals utility had been copied under a different name and executed—often a tactic used to mask malicious activity.'
      question: 'In the "Windows Sysinternals tool renamed" alert that followed, what is the name of the executable that was launched after being renamed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'notepad.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'notepad.exe'
      scoring:
        max_score: 1.0
    subtasks:
