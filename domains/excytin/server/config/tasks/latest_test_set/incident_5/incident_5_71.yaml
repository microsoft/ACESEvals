    description: 'According to the alert titled ''Potentially compromised assets exhibiting ransomware-like behavior'', what is the name of the suspicious archive file that was identified on the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into suspected ransomware activity, security monitoring flagged host ''vnevado-win11u'' (device ID bc00e484-d0e5-4da4-9472-95568cccc07e) after unusual file-system changes consistent with mass encryption behavior. Shortly before this, the same device issued a command that deleted all file snapshots and shadow copies, a common tactic seen in ransomware attacks. A follow-up alert titled ''Potentially compromised assets exhibiting ransomware-like behavior'' indicates that an additional suspicious archive file was involved in the incident.'
      question: 'According to the alert titled ''Potentially compromised assets exhibiting ransomware-like behavior'', what is the name of the suspicious archive file that was identified on the device?'
