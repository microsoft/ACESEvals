tasks:
  - task_id: incident_5_latest_test_set_task_60
    title: incident_5_latest_test_set_task_60
    description: 'During that second alert raised at 22:35:03 UTC, which executable name was flagged as being involved in the credential-theft activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'At 22:35:01 UTC on 4 July 2024, Defender raised an alert for a known credential-theft tool after the command lines "mimikatz.exe privilege::debug sekurlsa::logonpasswords exit" were run twice on an endpoint. Just two seconds later, a related alert for the same malicious activity was triggered, indicating that an additional process was observed in the course of the attack.'
      question: 'During that second alert raised at 22:35:03 UTC, which executable name was flagged as being involved in the credential-theft activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'notepad.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'notepad.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Malicious credential-theft tool activity was first detected on host (HostName = `vnevado-win10v`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A few seconds later, the specific process responsible was identified (ExtractedFileName = `notepad.exe`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
