    title: incident_5_latest_test_set_task_45
    description: 'In the "Command and Control behavior was blocked" alert generated at 22:35:01 UTC on 2024-07-04, which exact URL was identified as the command-and-control endpoint?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 at 22:35 UTC, Microsoft Defender flagged the hack-tool Mimikatz on a device after detecting the DLL named "mimilib.dll". A few seconds later, a follow-up alert reported that outbound command-and-control activity from the same investigation was blocked, suggesting the attacker attempted to reach an external infrastructure.'
      question: 'In the "Command and Control behavior was blocked" alert generated at 22:35:01 UTC on 2024-07-04, which exact URL was identified as the command-and-control endpoint?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'http://vectorsandarrows.com/'
      scoring:
        max_score: 1.0
