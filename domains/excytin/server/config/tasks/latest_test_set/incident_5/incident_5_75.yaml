    title: incident_5_latest_test_set_task_75
    description: 'According to the alert titled “Possible compromised user account delivering ransomware-related files,” what is the SID of the user account suspected of spreading the ransomware?'
    inherit_shared: true
    initial_context:
      incident_context: 'During triage we noted that the host with IP address 107.224.99.179 ran several instances of “mimikatz.exe” (e.g., PID 3008 at 2024-06-20 09:03:30 Z) after modifying LSASS memory. Shortly afterwards, a PSExec session was launched toward the jump server “vnevado-jump,” indicating lateral movement activity that likely originated from the same source.'
      question: 'According to the alert titled “Possible compromised user account delivering ransomware-related files,” what is the SID of the user account suspected of spreading the ransomware?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-0-6-5'
      scoring:
        max_score: 1.0
