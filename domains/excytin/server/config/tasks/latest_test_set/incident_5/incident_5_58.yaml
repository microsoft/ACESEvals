    initial_context:
      incident_context: 'During the investigation of an incident that began with the execution of a known credential-theft tool ("mimikatz.exe" launched from IP address 107.224.99.179), analysts observed subsequent lateral-movement activity (PSExec to the jump server) and, moments later, a ransomware payload was remotely launched on the same device. The ransomware-related alert identifies the user account responsible for triggering the payload.'
