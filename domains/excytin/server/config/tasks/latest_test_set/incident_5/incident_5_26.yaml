tasks:
  - task_id: incident_5_latest_test_set_task_26
    title: incident_5_latest_test_set_task_26
    description: 'What is the exact file name of the credential-theft tool reported in the subsequent "Mimikatz credential theft tool" alert on the same device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation we observed that on 2024-07-04 a process named "vssblatemp.exe" (PID 1900) executed the command "delete shadows /all" on host "vnevado-win11u" under account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522). This resulted in an alert titled "File backups were deleted", a common precursor to ransomware. Within one second of this event, the same device raised another alert indicating that a credential-theft tool had been detected.'
      question: 'What is the exact file name of the credential-theft tool reported in the subsequent "Mimikatz credential theft tool" alert on the same device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity originated from IP (Field: Address) `99.83.111.100`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
