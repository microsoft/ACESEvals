tasks:
  - task_id: incident_5_latest_test_set_task_99
    title: incident_5_latest_test_set_task_99
    description: 'According to the "Malicious credential theft tool execution detected" alert on 2024-07-04 22:35:02 UTC, which external IP address was associated with this credential theft activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed that user "Grace Chen" (SID S-1-5-21-1840191660-8534830288-125585561-1522, AAD ID 731adb71-b11c-4bbf-850b-57989b350e96) on host "vnevado-win11t" (device ID e5799261-6720-4297-961e-bd9ca4275033) had an attempt to create, delete, or modify files over SMB blocked by attack disruption at 2024-07-10 11:24:45 UTC. Shortly after, an alert titled "PSExec to Vnevado-jump" indicated possible lateral movement activity. Within the same incident, an earlier alert was raised on 2024-07-04 22:35:02 UTC for a "Malicious credential theft tool execution detected," suggesting that credentials may have been dumped prior to the SMB activity.'
      question: 'According to the "Malicious credential theft tool execution detected" alert on 2024-07-04 22:35:02 UTC, which external IP address was associated with this credential theft activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
