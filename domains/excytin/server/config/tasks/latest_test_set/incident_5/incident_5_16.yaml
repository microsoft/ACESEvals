tasks:
  - task_id: incident_5_latest_test_set_task_16
    title: incident_5_latest_test_set_task_16
    description: 'According to the alert that signaled a possible attempt to access a Primary Refresh Token (PRT), which executable file was flagged as the process involved?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation on host "vnevado-win10s" (device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505), a suspicious WMI-spawned process activity was recorded. Several command-line executions were observed in quick succession, including:
 • 5512 … vssblatemp.exe delete shadows /all
 • 8136 … bcdedit /set recoveryenabled no
 • 1868 … bcdedit /set bootstatuspolicy ignoreallfailures
 • 6460 … curl http://vectorsandarrows.com
 • 6168 … powershell -file c:\scripts\get-userprttoken.ps1
These events are correlated with another alert raised at approximately the same time that warns of a possible attempt to access a Primary Refresh Token (PRT) on the same machine. Analysts must determine which executable was identified in that PRT-related alert.'
      question: 'According to the alert that signaled a possible attempt to access a Primary Refresh Token (PRT), which executable file was flagged as the process involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'browsercore.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'browsercore.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04T22:35:03Z, a suspicious WMI process creation was observed that involved the account with Name `dp5hn`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
