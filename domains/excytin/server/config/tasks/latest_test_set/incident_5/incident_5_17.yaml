tasks:
  - task_id: incident_5_latest_test_set_task_17
    title: incident_5_latest_test_set_task_17
    description: 'According to the final alert in this sequence, what is the hostname of the machine where the suspicious ''GenRansom'' activity was ultimately detected?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, security telemetry showed that account ''tgs2z'' executed a Base64-encoded PowerShell command (Process ID 2484) from workstation ''vnevado-win10v'' shortly before a ''Possible attempt to access Primary Refresh Token (PRT)'' alert was raised on 2024-07-04 at 22:35:00 UTC. Moments later, additional alerts in the same incident indicated progression of malicious activity, culminating in a detection of ransomware-like behaviour on a different machine in the environment.'
      question: 'According to the final alert in this sequence, what is the hostname of the machine where the suspicious ''GenRansom'' activity was ultimately detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win11t'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert: Possible attempt to access Primary Refresh Token (PRT) – process ExtractedFileName=`browsercore.exe` was identified.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The PRT-access attempt is tied to host HostName=`vnevado-win11t`, indicating the machine on which the suspicious process executed.'
