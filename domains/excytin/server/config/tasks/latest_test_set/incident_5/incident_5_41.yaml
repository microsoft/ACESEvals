tasks:
  - task_id: incident_5_latest_test_set_task_41
    title: incident_5_latest_test_set_task_41
    description: 'According to the "Suspicious remote activity" alert that followed the blocked C2 attempt, what is the IP address of the remote system involved?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a Command and Control (C2) attempt was blocked at 2024-07-04 22:35:01 UTC after a process on the host reached out to the URL "http://vectorsandarrows.com/"—a known indicator of malware-related activity. Just moments later, the same device generated a separate alert titled "Suspicious remote activity," indicating that a remote system attempted to interact with the machine (for example, by creating scheduled tasks or running WMI commands).'
      question: 'According to the "Suspicious remote activity" alert that followed the blocked C2 attempt, what is the IP address of the remote system involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '99.83.111.100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Command-and-control behavior was blocked when the process with field ProcessId `5572` executed the command line `curl http://vectorsandarrows.com` at CreatedTimeUtc `2024-06-20t09:32:04.8002759z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious remote activity was observed coming from the IP with field Address `99.83.111.100`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
