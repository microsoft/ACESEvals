tasks:
  - task_id: incident_5_latest_test_set_task_13
    title: incident_5_latest_test_set_task_13
    description: 'A few seconds later, another alert flagged the execution of a known credential-theft utility (process ID 2020). What is the name of the executable that was run?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4, 2024 at 22:35 UTC, host "vnevado-win10r" raised a "System recovery setting tampering" alert. The account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522) launched several commands such as "vssblatemp.exe delete shadows /all" and "bcdedit /set recoveryenabled no", actions commonly used by attackers to disable Windows-built-in recovery features before advancing their intrusion.'
      question: 'A few seconds later, another alert flagged the execution of a known credential-theft utility (process ID 2020). What is the name of the executable that was run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account (Field: Name, Value: `dp5hn`) was observed tampering with the system-recovery settings on 2024-07-04 22:35:02 UTC.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
