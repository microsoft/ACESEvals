tasks:
  - task_id: incident_5_latest_test_set_task_53
    title: incident_5_latest_test_set_task_53
    description: 'According to the ransomware-related alert, what is the name of the file that was observed with the suspicious extension?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation uncovered lateral movement activity to a jump server (alert titled "PSExec to Vnevado-jump" on 2024-07-10). The action was performed by account tgs2z (SID S-5-7-21-1843151660-3234030288-105586167-1422, email tgs2z@vnevado.alpineskihouse.co) from host vnevado-win10v, communicating over IP 141.216.110.153. Not long after, a separate alert reported that many files on another device suddenly received a file-extension commonly linked to ransomware campaigns, indicating possible mass encryption.'
      question: 'According to the ransomware-related alert, what is the name of the file that was observed with the suspicious extension?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'unstreaming.xlsx'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'unstreaming.xlsx'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Attackers initiated lateral movement by executing PSExec from the source IP address (Field: Address, Value: `99.83.111.100`) to the jump server.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, possible ransomware activity was detected on the device as numerous files—including the file (Field: Name, Value: `unstreaming.xlsx`)—were modified to include a known malicious extension.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
