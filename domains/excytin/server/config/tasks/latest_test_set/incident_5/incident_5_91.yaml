    description: 'Which IP address was highlighted in the associated "Manatee Tempest activity group" alert as part of the threat actor’s infrastructure?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 at 22:35 UTC, Microsoft Defender for Endpoint raised a "Command and Control behavior was blocked" alert on host "vnevado-win11t" (device ID: e5799261-6720-4297-961e-bd9ca4275033). The malicious activity involved a process (PID 88) launching the command "curl http://vectorsandarrows.com", indicating an attempted outbound connection to a suspicious site. Investigation linked this activity to follow-on threat intelligence that attributes related infrastructure to the Russia-based cybercriminal group tracked by Microsoft as Manatee Tempest.'
      question: 'Which IP address was highlighted in the associated "Manatee Tempest activity group" alert as part of the threat actor’s infrastructure?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
