tasks:
  - task_id: incident_5_latest_test_set_task_20
    title: incident_5_latest_test_set_task_20
    description: 'Which user account (provide the email address) was identified in the final alert that reported the blocked SMB lateral-movement attempt on July 10 2024 at 11:24:45 UTC?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4, 2024, a security alert titled "Windows Sysinternals tool renamed" indicated that a renamed administrative utility had been launched through several processes such as powershell.exe, cmd.exe and mimikatz.exe, all originating from host activities that also contacted the external IP address 107.224.99.179. A few days later, on July 10, a follow-up alert "PSExec to Vnevado-jump" suggested possible lateral movement from that host toward the organization’s jump server. Immediately after, Microsoft Defender raised another alert: "Lateral movement using SMB remote file access blocked on multiple devices," noting that a contained user attempted to create, delete, or modify files over SMB but was automatically blocked.'
      question: 'Which user account (provide the email address) was identified in the final alert that reported the blocked SMB lateral-movement attempt on July 10 2024 at 11:24:45 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Grace Chen@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Grace Chen@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with Sid `S-5-7-21-1843151660-3234030288-105586167-1422` ran a Windows Sysinternals tool after renaming it, suggesting an attempt to hide malicious activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Next, a lateral-movement attempt used PSExec from the IP Address `99.83.111.100` to reach the jump server (Vnevado-jump).'
