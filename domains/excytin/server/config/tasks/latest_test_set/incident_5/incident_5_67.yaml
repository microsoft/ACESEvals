tasks:
  - task_id: incident_5_latest_test_set_task_67
    title: incident_5_latest_test_set_task_67
    description: 'What is the external IP address that was flagged in the Manatee Tempest activity group alert raised immediately after the malware execution on host vnevado-win10s?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024, a lateral-movement alert was raised after the endpoint vnevado-win10s (device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505) executed the command line "curl http://vectorsandarrows.com" under process ID 6460. Just one second later, a separate alert identified activity attributed to the Russia-based threat actor Manatee Tempest, suggesting the same compromise might be expanding its footprint.'
      question: 'What is the external IP address that was flagged in the Manatee Tempest activity group alert raised immediately after the malware execution on host vnevado-win10s?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '198.43.121.209'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The CommandAndControl malware alert shows that the attacker leveraged the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` as part of the lateral-movement activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The follow-up alert links the malicious activity to the Manatee Tempest threat group, which is communicating with—or hosted at—the suspicious IP address `198.43.121.209`.'
        objective: Identify key details related to the potential compromise that might
