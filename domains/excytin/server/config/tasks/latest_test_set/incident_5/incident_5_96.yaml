tasks:
  - task_id: incident_5_latest_test_set_task_96
    title: incident_5_latest_test_set_task_96
    description: 'According to the related process event (PID 1332) observed during the investigation, which exact URL did the curl command attempt to access?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04, Microsoft Defender raised an alert titled "''CommandAndControl'' malware was detected during lateral movement" for the workstation "vnevado-win10r" (device ID 9d4887ba-0b69-47d6-89bc-9b32787f379e) being used by account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522). While reviewing related activity on this host, investigators spotted an earlier process (PID 1332) that started at 2024-06-20 09:10:52 UTC and launched the "curl" utility to contact an external location, which may indicate command-and-control beaconing.'
      question: 'According to the related process event (PID 1332) observed during the investigation, which exact URL did the curl command attempt to access?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'http://vectorsandarrows.com'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The ''CommandAndControl'' malware alert indicates lateral movement activity executed by the process (Field: ProcessId__CreatedTimeUtc__CommandLine, Value: `1332__2024-06-20t09:10:52.7298237z__curl http://vectorsandarrows.com`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
