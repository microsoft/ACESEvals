    inherit_shared: true
    initial_context:
      incident_context: A security incident involving possible use of the Rubeus kerberoasting
        tool was detected. This tool can perform kerberoasting, pass-the-ticket, and
        other attack techniques that exploit Kerberos authentication. During such
        attacks, attackers often request Kerberos tickets for an account's SPN and
        then decrypt them to get plaintext credentials or perform pass-the-ticket
        to authenticate without decrypting the tickets. On the noted endpoint, the
        Rubeus tool was executed with a command to dump credentials and save them
        into a file `adminticket.txt`.
      question: Regarding this incident, there was an alert about successful logon
        using overpass-the-hash with potentially stolen credentials. What IP address
        was involved in this suspicious logon attempt?
