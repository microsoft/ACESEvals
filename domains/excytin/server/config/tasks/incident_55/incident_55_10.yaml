tasks:
  - task_id: incident_55_task_91
    title: incident_55_task_91
    description: "During the same time frame, there was an attempt where a Windows executable file was renamed and launched. Can you identify the system account that was used to perform these actions?"

    inherit_shared: true

    initial_context:
      incident_context: "On 2024-07-10, during a suspected unauthorized activity, the account `gsmith@niseko.alpineskihouse.co` read the DKM key of ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2. Additionally, a suspicious LDAP query was detected that might indicate an attempt to steal ADFS private keys."
      question: "During the same time frame, there was an attempt where a Windows executable file was renamed and launched. Can you identify the system account that was used to perform these actions?"

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - "SYSTEM"
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: "The account `gsmith` read the DKM key of ADFS with object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: "A suspicious LDAP query was launched, potentially attempting to steal ADFS private keys, with the process `iy2orr1e.rrg.exe`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: "A Windows executable file, renamed as `iy2orr1e.rrg.exe`, was launched by the `SYSTEM` account to perform potentially malicious activities."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
