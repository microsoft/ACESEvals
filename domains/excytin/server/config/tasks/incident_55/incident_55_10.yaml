  - task_id: incident_55_task_97
    title: incident_55_task_97
    description: "What is the hostname of the device that sent the replication request in the suspected DCSync attack?"

    inherit_shared: true

    initial_context:
      incident_context: "A security incident involving a suspicious sequence of exploration activities involving various windows commands was observed. One of the commands executed was associated with the process `iy2orr1e.rrg.exe` on host `mb-adfs`. This activity may indicate an attacker identifying valuable assets and preparing to move laterally after compromising the machine. Following this, a malicious PowerShell Cmdlet was invoked on the machine, which could be linked to credential theft, network reconnaissance, or code injection. Later, a suspected DCSync attack was detected, where Luciano Herrera (CIO) on an unknown host sent a replication request to an entity. The last event in the sequence was that the device `MB-DC1` read the DKM key of an ADFS object."
      question: "What is the hostname of the device that sent the replication request in the suspected DCSync attack?"

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - "MB-WINCLIENT"
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: "A suspicious sequence of exploration activities was conducted via the process `powershell.exe`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: "A malicious PowerShell Cmdlet was invoked by the user with SID `S-1-5-21-551436448-9871687716-9837441745-1903`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: "Luciano Herrera (CIO) on the host `MB-WINCLIENT` sent a replication request to the host `MB-DC1`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
      - subtask_id: checkpoint_4
        title: Checkpoint 4
        description: "The host `MB-DC1` then read the DKM key of ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
