tasks:
  - task_id: incident_34_legacy_train_set_task_6
    title: incident_34_legacy_train_set_task_6
    description: 'During this security incident, a process executed PowerShell to download a file or run an encoded command. What is the Security Identifier (SID) of the account associated with this suspicious PowerShell activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04, a security incident reported suspicious Task Scheduler activity suggesting a process with earlier malicious activity used Task Scheduler to potentially launch malicious code automatically for persistence. One of the observed malicious activities involved the execution of a process `schtasks.exe` creating and running tasks.'
      question: 'During this security incident, a process executed PowerShell to download a file or run an encoded command. What is the Security Identifier (SID) of the account associated with this suspicious PowerShell activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-1-5-21-1870156660-7534030218-135086563-1193'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There was a suspicious Task Scheduler activity initiated by a user with SID `S-1-5-21-1870156660-7534030218-135086563-1193` to potentially establish persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The same user with SID `S-1-5-21-1870156660-7534030218-135086563-1193` executed a suspicious PowerShell command to download a file or run an encoded command.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
