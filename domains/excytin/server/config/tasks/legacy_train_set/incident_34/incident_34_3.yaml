    title: incident_34_legacy_train_set_task_3
    description: 'Following this activity, there was a suspicious PowerShell download or encoded command execution. Can you provide the process and command line details of the process that executed PowerShell?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of a suspicious Task Scheduler activity, we found that the process `schtasks.exe` was used to create and run a task named ''yrei'' to execute `winatp-intro-backdoor.exe`. This activity might indicate an attempt to launch malicious code automatically and establish persistence. Refer to the threat analytics report provided for more details.'
      question: 'Following this activity, there was a suspicious PowerShell download or encoded command execution. Can you provide the process and command line details of the process that executed PowerShell?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process Id: 9780, Command Line: "winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Process Id: 9780, Command Line: "winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm'
      scoring:
        max_score: 1.0
