tasks:
  - task_id: incident_34_legacy_train_set_task_8
    title: incident_34_legacy_train_set_task_8
    description: 'As part of this security incident, a suspicious process executed a PowerShell command. Can you identify the account name that was associated with this activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'An automated investigation was initiated manually by u141(u141@ash.alpineskihouse.co) on the host `vnevado-win10e`. This investigation aimed to identify and review threat artifacts for potential remediation.'
      question: 'As part of this security incident, a suspicious process executed a PowerShell command. Can you identify the account name that was associated with this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'samuelf'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'User with email `u141@ash.alpineskihouse.co` initiated an automated investigation on the device with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious process executed a PowerShell command under the account `samuelf`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
