tasks:
  - task_id: incident_34_legacy_train_set_task_31
    title: incident_34_legacy_train_set_task_31
    description: 'Related to this incident, there was also an anomaly detected in the ASEP registry. Can you identify the IP address associated with this anomaly?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a recent multi-stage security incident involving execution and discovery on a device, an anomalous scheduled task was created potentially indicating an attacker''s attempt to obtain persistence. The task involved processes such as `powershell.exe` and `schtasks.exe`. Further review of this incident is necessary.'
      question: 'Related to this incident, there was also an anomaly detected in the ASEP registry. Can you identify the IP address associated with this anomaly?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An anomalous scheduled task was created by a user with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'An anomaly was detected in ASEP registry with a suspicious entry associated with IP address `72.5.72.208`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
