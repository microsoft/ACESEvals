tasks:
  - task_id: incident_34_legacy_train_set_task_12
    title: incident_34_legacy_train_set_task_12
    description: 'Can you identify the AadUserId associated with the anomalous scheduled task that was created?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was reported involving suspicious Task Scheduler activity where a process used Task Scheduler to create, modify, or delete a task, potentially to launch malicious code automatically and establish persistence. The process involved had the command: `schtasks.exe /run /tn yrei`, with a Process ID of 1616. The alert happened on 2024-07-04 at 22:35:01.761898+00:00.'
      question: 'Can you identify the AadUserId associated with the anomalous scheduled task that was created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '16320fec-8d90-403b-b7fe-78f715d4728d'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '16320fec-8d90-403b-b7fe-78f715d4728d'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` has been involved in suspicious Task Scheduler activity, potentially attempting to launch malicious code automatically and establish persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'An anomalous scheduled task was created by the same user with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`, possibly for persistence purposes.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
