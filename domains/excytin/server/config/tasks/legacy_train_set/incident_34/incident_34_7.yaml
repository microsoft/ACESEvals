tasks:
  - task_id: incident_34_legacy_train_set_task_7
    title: incident_34_legacy_train_set_task_7
    description: 'In relation to this suspicious Task Scheduler activity, an uncommon file was later created and added to a Run Key. Can you provide the IP address associated with this uncommon file creation?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious Task Scheduler activity was detected indicating potential malicious activity. The initial process involved was likely aiming to launch malicious code automatically and establish persistence. In relation to this activity, an uncommon file was later created and added to a Run Key, suggesting further persistence mechanisms being established by the attacker.'
      question: 'In relation to this suspicious Task Scheduler activity, an uncommon file was later created and added to a Run Key. Can you provide the IP address associated with this uncommon file creation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious task scheduler activity was detected involving the process with extracted filename `winatp-intro-backdoor.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
