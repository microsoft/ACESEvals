tasks:
  - task_id: incident_34_legacy_train_set_task_10
    title: incident_34_legacy_train_set_task_10
    description: 'In relation to this incident, there is also an anomaly detected in the ASEP registry. Can you find the IP address associated with this activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving suspicious Task Scheduler activity was identified on July 4, 2024. A process involved in earlier malicious activity used Task Scheduler to create, modify, or delete a task, which might be an attempt to launch malicious code automatically and establish persistence. Further information on this threat can be found in the threat analytics report linked in the investigation.'
      question: 'In relation to this incident, there is also an anomaly detected in the ASEP registry. Can you find the IP address associated with this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with the name `samuelf` used the Task Scheduler to create, modify, or delete a task, which is suspicious.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'There was an anomaly detected in the ASEP registry from the IP address `72.5.72.208`, indicating a potential attempt to register a malicious command or file that will run after a reboot.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
