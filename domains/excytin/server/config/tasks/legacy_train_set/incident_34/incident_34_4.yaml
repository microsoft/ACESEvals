tasks:
  - task_id: incident_34_legacy_train_set_task_4
    title: incident_34_legacy_train_set_task_4
    description: 'Related to this alert, a process registered a suspicious command or file in an ASEP registry. What is the IP address associated with this anomaly?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a security incident, a suspicious PowerShell download or encoded command execution was detected. This type of activity is often used by attackers to bypass security protection mechanisms by executing their payload in memory. The execution of `powershell.exe` and `winword.exe` processes were observed. Specifically, the PowerShell command included a lengthy encoded script that might indicate an attempt to download external payloads or execute commands on the device.'
      question: 'Related to this alert, a process registered a suspicious command or file in an ASEP registry. What is the IP address associated with this anomaly?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user with SID `S-1-5-21-1870156660-7534030218-135086563-1193` was involved in a suspicious PowerShell download or encoded command execution.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
