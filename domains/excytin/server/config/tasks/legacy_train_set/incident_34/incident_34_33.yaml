tasks:
  - task_id: incident_34_legacy_train_set_task_33
    title: incident_34_legacy_train_set_task_33
    description: 'Can you obtain the name of the account involved in this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'Our organization experienced a security incident where an uncommon file `winatp-intro-backdoor.exe` was created on the host `vnevado-win10e` with the IP address `72.5.72.208`, and was added to a Run Key in the registry suggesting persistence attempts by an attacker. The file was added to the registry with the command line `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe`.'
      question: 'Can you obtain the name of the account involved in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'samuelf'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An uncommon file was created by the account `samuelf` and added to a Run Key, where it will be executed after a reboot.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
