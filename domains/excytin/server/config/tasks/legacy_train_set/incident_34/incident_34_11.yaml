tasks:
  - task_id: incident_34_legacy_train_set_task_11
    title: incident_34_legacy_train_set_task_11
    description: 'During this incident, Powershell dropped a suspicious file on the machine. Can you identify the name of the suspicious file?'
    inherit_shared: true
    initial_context:
      incident_context: 'In a recent security incident where an anomaly was detected in the ASEP registry, it was found that a process had registered a suspicious command or file in the ASEP registry key. This could be a move by an attacker to maintain persistence even after a machine reboot. This incident is connected to the IP address 72.5.72.208.'
      question: 'During this incident, Powershell dropped a suspicious file on the machine. Can you identify the name of the suspicious file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winatp-intro-backdoor.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious command or file was registered in the ASEP registry on the host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Powershell dropped and executed a suspicious file named `winatp-intro-backdoor.exe` on the machine.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
