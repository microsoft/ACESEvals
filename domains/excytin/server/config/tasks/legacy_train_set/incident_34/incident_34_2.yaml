tasks:
  - task_id: incident_34_legacy_train_set_task_2
    title: incident_34_legacy_train_set_task_2
    description: 'Related to this incident, what is the name of the suspicious process that executed a PowerShell command?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a security incident on 2024-07-04, a suspicious LDAP query was executed, indicating potential reconnaissance activity. This query usually involves attackers attempting to learn the organization''s structure by querying the domain controller for administrative users, groups, and interesting assets. Additionally, the process `winword.exe` was observed executing a file named `rs4_winatp-intro-invoice.docm`.'
      question: 'Related to this incident, what is the name of the suspicious process that executed a PowerShell command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winatp-intro-backdoor.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There was a suspicious LDAP query executed on host `vnevado-win10e`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious process with filename `winatp-intro-backdoor.exe` executed a PowerShell command.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
