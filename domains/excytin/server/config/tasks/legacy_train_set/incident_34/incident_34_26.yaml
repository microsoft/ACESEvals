    title: incident_34_legacy_train_set_task_26
    description: 'Can you find the IP address associated with the anomaly detected in the ASEP registry for this security incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a security incident, a process executed PowerShell to download a file or run an encoded command. PowerShell is often used by attackers to bypass security protection mechanisms by executing their payload in memory without leaving a trace or touching the disk. This particular instance was flagged as a suspicious PowerShell download or encoded command execution with Process ID 8604. This activity may indicate an attacker trying to download external payloads or execute commands on the device.'
      question: 'Can you find the IP address associated with the anomaly detected in the ASEP registry for this security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
