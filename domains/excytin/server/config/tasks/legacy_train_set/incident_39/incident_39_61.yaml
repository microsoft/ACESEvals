tasks:
  - task_id: incident_39_legacy_train_set_task_61
    title: incident_39_legacy_train_set_task_61
    description: 'What is the SID of the account that registered the suspicious file as a service?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of a malware detection specified as ''Kekeo'' malware, which was reported as active on 2024-07-04, a suspicious process `rubeus.exe` with ProcessId `2608` was found. This malware and related unwanted software are known to perform harmful actions on affected machines and can spread across systems. It is important to check the system thoroughly for signs of infection.'
      question: 'What is the SID of the account that registered the suspicious file as a service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-0-6-5'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The malware ''Kekeo'' was detected and was active on the account named `fk8mq`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious file was registered as a service by the user with SID `S-0-6-5`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
