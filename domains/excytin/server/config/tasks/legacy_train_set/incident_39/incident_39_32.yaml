tasks:
  - task_id: incident_39_legacy_train_set_task_32
    title: incident_39_legacy_train_set_task_32
    description: 'Can you identify the Security Identifier (SID) of the account that was used in the overpass-the-hash attack?'
    inherit_shared: true
    initial_context:
      incident_context: 'Involving a security incident where an attacker might be gathering information about potential targets, a series of anomalous account lookups were detected, with activities conducted using the `net.exe` process to query user and group information on the domain. Shortly after, suspicious access to the LSASS service was detected, indicating potential credential theft to obtain clear-text passwords, likely intending lateral movement across the network. This can lead to an attack where overpass-the-hash method is employed for successful logon using stolen credentials.'
      question: 'Can you identify the Security Identifier (SID) of the account that was used in the overpass-the-hash attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-2-78'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-2-2-78'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An anomalous chain of attempts to look up user account information has been observed on host `vnevado-win10v`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
