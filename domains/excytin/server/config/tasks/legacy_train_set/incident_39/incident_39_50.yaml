tasks:
  - task_id: incident_39_legacy_train_set_task_50
    title: incident_39_legacy_train_set_task_50
    description: 'Which file was detected as ''Kekeo'' malware during this security incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving potential human-operated malicious activity was observed on the device `vnevado-win10b`. This sequence of alerts might lead to ransomware or other payloads installed on target devices. The incident involved multiple user accounts and IP addresses including `141.216.110.153`. During the incident, one of the potentially malicious activities was detected and later, ''Kekeo'' malware was identified, which indicates an undesirable application that could perform harmful actions on affected machines and perform activities associated with cyber attacks.'
      question: 'Which file was detected as ''Kekeo'' malware during this security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'rubeus.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sequence of alerts indicative of human-operated malicious activity was observed on the device, associated with account `fk8mq`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The detected activity includes the presence of the file `rubeus.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Additionally, ''Kekeo'' malware was detected, associated with the file `rubeus.exe`, which might indicate that the malware was stopped from delivering its payload.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
