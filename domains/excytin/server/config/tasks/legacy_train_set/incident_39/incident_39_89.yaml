    title: incident_39_legacy_train_set_task_89
    description: 'What is the name of the known credential theft tool that was executed?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving a suspected identity theft (pass-the-ticket) originating from Julian Burke''s account and device VNEVADO-Win10B was detected. The attacker used the stolen Kerberos ticket on the host VNEVADO-Win10V to access several resources. Later, a suspicious process stopping services was observed, indicating potential malicious activity related to data encryption or avoidance of detection.'
      question: 'What is the name of the known credential theft tool that was executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An actor used Julian Burke (AadUserId ''7fcf9695-68fc-4258-864d-e1e5b166c66f'')''s Kerberos ticket from `VNEVADO-Win10B` to access resources on `VNEVADO-Win10V`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
