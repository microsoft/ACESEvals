    description: 'During the incident on 2024-07-04, an attempt to disable the Microsoft Defender Antivirus service was detected. Which user account was involved in this tampering attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious service `psexesvc.exe` was started on a device on 2024-07-04. Attackers might use services to launch malicious commands or programs to maintain persistence or elevate privileges on the target device. Following this, a Security IDentifcation (SID) history injection was detected on the same device. Attackers typically exploit this technique to gain elevated privileges, allowing access to sensitive files, persistence, and system modifications.'
