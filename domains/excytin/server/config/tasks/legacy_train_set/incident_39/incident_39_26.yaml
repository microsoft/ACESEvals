tasks:
  - task_id: incident_39_legacy_train_set_task_26
    title: incident_39_legacy_train_set_task_26
    description: 'Can you provide the URL that was accessed by the user in the ZAP-quarantined email?'
    inherit_shared: true
    initial_context:
      incident_context: 'A link in an email quarantined by zero-hour auto purge (ZAP) was accessed by a user, triggering a Microsoft Defender for Office 365 alert.'
      question: 'Can you provide the URL that was accessed by the user in the ZAP-quarantined email?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Multiple dual-purpose tools were dropped by the user with SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A user accessed a link in a ZAP-quarantined email with URL `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
