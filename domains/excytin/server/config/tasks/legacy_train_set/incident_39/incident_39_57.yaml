      incident_context: 'An active ''Kekeo'' malware was detected according to an alert on 2024-07-04. Malware and unwanted software can perform disruptive, or harmful actions on affected machines and may spread or receive commands from remote attackers. This malware was active, indicating it was running or had persistence mechanisms in place. Connected to this alert, PsExec was used to launch a command on a remote device, which could be part of the attacker''s method to move laterally within the organization.'
