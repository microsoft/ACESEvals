    description: 'Can you identify the security identifier (SID) of the deceptive user account involved in the sign-in attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'A known credential theft tool `mimikatz.exe` was executed from the device with URL `vnevado-dc.vnevado.alpineskihouse.co` and IP address `65.233.23.156` to dump users'' credentials. This incident triggered a malicious credential theft tool execution alert on 2024-07-04. Shortly after, there was a sign-in attempt with a deceptive user account detected, indicating that a potential attacker might be using a fake or decoy account to perform various attack activities including lateral movement and accessing sensitive data.'
      question: 'Can you identify the security identifier (SID) of the deceptive user account involved in the sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-0-6-5'
