tasks:
  - task_id: incident_39_legacy_train_set_task_20
    title: incident_39_legacy_train_set_task_20
    description: 'Following the execution of mimikatz.exe, PsExec was subsequently used to launch another command on a remote device. Can you determine the name of the script or file used in the PsExec command?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident has been detected in our organization involving the execution of a known credential theft tool. Specifically, the tool `mimikatz.exe` was executed with the command line `mimikatz.exe lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp` to potentially dump users'' credentials. This activity is indicative of malicious intent to extract sensitive information such as keys and plain-text passwords.'
      question: 'Following the execution of mimikatz.exe, PsExec was subsequently used to launch another command on a remote device. Can you determine the name of the script or file used in the PsExec command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'get-krbticket.ps1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A known credential theft tool was executed with the user having SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'PsExec was used to launch the command `get-krbticket.ps1` on a remote device.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
