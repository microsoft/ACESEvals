tasks:
  - task_id: incident_39_legacy_train_set_task_22
    title: incident_39_legacy_train_set_task_22
    description: 'In connection to these alerts, a suspicious service was launched. Can you identify the name of the process file associated with this suspicious service?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident occurred where multiple dual-purpose tools were dropped on a device named `vnevado-win10v`. These tools can potentially be used for malicious purposes, such as credential theft, privilege escalation, and lateral movement. One of the dropped files was named `domaindominance27.ps1`, launched by `powershell.exe` via a script located in the user''s downloads. Following this, there was an indication of human-operated malicious activity that might lead to serious consequences like ransomware installation.'
      question: 'In connection to these alerts, a suspicious service was launched. Can you identify the name of the process file associated with this suspicious service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'services.exe'
      scoring:
        max_score: 1.0
    subtasks:
