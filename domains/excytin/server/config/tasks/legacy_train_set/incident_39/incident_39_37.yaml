tasks:
  - task_id: incident_39_legacy_train_set_task_37
    title: incident_39_legacy_train_set_task_37
    description: 'Related to this alert, another process was executed with potential malicious intent. Can you provide the command line used during the later execution of the tool `mimikatz.exe`?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of investigating this incident, a file `mimikatz.exe` was detected being executed with this command line indicating intent to dump credentials. The Process ID was 5196. This might be an indicator of an attacker stealing credentials using this tool.'
      question: 'Related to this alert, another process was executed with potential malicious intent. Can you provide the command line used during the later execution of the tool `mimikatz.exe`?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '"mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A known credential theft tool `mimikatz.exe` was executed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The attacker launched mimikatz with the command line `mimikatz.exe lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp exit` at `2024-06-27t14:33:38.0249949z`, with Process ID `4748`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
