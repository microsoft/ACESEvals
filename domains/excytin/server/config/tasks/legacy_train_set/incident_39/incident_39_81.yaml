tasks:
  - task_id: incident_39_legacy_train_set_task_81
    title: incident_39_legacy_train_set_task_81
    description: 'What is the name of the process that was identified as launching the suspicious service?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent security incident involving suspicious services being launched on a device was flagged. Attackers might use such services to launch malicious commands or programs, which can be used to maintain persistence or elevate privileges on the target device. In this incident, an account with the name `lucasb` and multiple processes such as `powershell.exe` and `net.exe` were associated with the suspicious activity.'
      question: 'What is the name of the process that was identified as launching the suspicious service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'services.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious service was launched on the host `vnevado-dc`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The suspicious service started the process `services.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
