tasks:
  - task_id: incident_39_legacy_train_set_task_35
    title: incident_39_legacy_train_set_task_35
    description: 'Following the tampering attempt with Microsoft Defender Antivirus, malware was detected. Can you find the name of the malware file that was identified?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident occurred where an attempt to disable the Microsoft Defender Antivirus service was detected, indicating a possible evasion attempt. Alongside this, malware detection indicated potential infection.'
      question: 'Following the tampering attempt with Microsoft Defender Antivirus, malware was detected. Can you find the name of the malware file that was identified?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'rubeus.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An attempt to disable the Microsoft Defender Antivirus service was detected on the host `vnevado-win10v`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: '''Kekeo'' malware was detected, specifically associated with the file `rubeus.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
