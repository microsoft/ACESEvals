    title: incident_39_legacy_train_set_task_11
    description: 'During the security incident, a suspicious service was launched on the device. Can you get the SID of the account associated with this suspicious service launch?'
    inherit_shared: true
    initial_context:
      incident_context: 'A ''Kekeo'' malware was detected on host `vnevado-win10v` with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, and file `rubeus.exe` is associated with this alert. Since the detection might indicate that the malware was stopped from delivering its payload, it is prudent to check the machine for signs of infection. Further investigation revealed that multiple known public tools, which could also be used for malicious reasons, were dropped on this device to perform various attack stages.'
      question: 'During the security incident, a suspicious service was launched on the device. Can you get the SID of the account associated with this suspicious service launch?'
