tasks:
  - task_id: incident_39_legacy_train_set_task_52
    title: incident_39_legacy_train_set_task_52
    description: 'Related to this incident, there was a sign-in attempt using a deceptive user account. Can you provide the IP address from which the deceptive sign-in attempt was made?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving malicious credential theft occurred as indicated by the execution of a known credential theft tool. The process `mimikatz.exe` was executed with the command to dump users'' credentials. This incident happened on the device which is currently being investigated.'
      question: 'Related to this incident, there was a sign-in attempt using a deceptive user account. Can you provide the IP address from which the deceptive sign-in attempt was made?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '35.202.74.47'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A malicious credential theft tool was executed on the host `vnevado-win10v`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A sign-in attempt was detected using a deceptive user account from IP address `35.202.74.47`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
