tasks:
  - task_id: incident_39_legacy_train_set_task_60
    title: incident_39_legacy_train_set_task_60
    description: 'Can you identify the process ID and command line of the malicious credential theft tool that was executed?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving a successful logon using overpass-the-hash with potentially stolen credentials occurred on host `vnevado-win10b` using the account of SID S-1-5-21-1540151660-3530000288-105586595-1517. As part of following the activity, suspicious access to the LSASS service was detected, an indication that attackers might have been trying to decrypt user passwords from memory. Later, a known credential theft tool execution was detected indicating an attempt to dump user credentials.'
      question: 'Can you identify the process ID and command line of the malicious credential theft tool that was executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 4748, Command Line: "mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Process ID: 4748, Command Line: "mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An attacker used the process `lsass.exe` to perform an overpass-the-hash attack.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
