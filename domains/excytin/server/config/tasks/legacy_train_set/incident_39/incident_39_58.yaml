tasks:
  - task_id: incident_39_legacy_train_set_task_58
    title: incident_39_legacy_train_set_task_58
    description: 'Related to this incident, there was a sign-in attempt with a deceptive user account. Can you identify the name of the user account used in this suspicious sign-in attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent security incident indicated an attempt to tamper with Microsoft Defender Antivirus, detected on 2024-07-04. This activity might suggest an attempt to evade detection. The process `powershell.exe` was seen executing the script `get-krbticket.ps1`. Note: Tampering techniques are typically used by attackers to disable or interfere with security tools and processes.'
      question: 'Related to this incident, there was a sign-in attempt with a deceptive user account. Can you identify the name of the user account used in this suspicious sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kyleg'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'kyleg'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An attempt was detected to disable the Microsoft Defender Antivirus service by the account `tgs2z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A sign-in attempt was detected using a deceptive user account `kyleg` that might be used by an attacker to perform various attack activities, including lateral movement and accessing sensitive data.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
