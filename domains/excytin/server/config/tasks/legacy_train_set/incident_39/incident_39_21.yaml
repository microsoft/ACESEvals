tasks:
  - task_id: incident_39_legacy_train_set_task_21
    title: incident_39_legacy_train_set_task_21
    description: 'Can you identify the name of one of the dual-purpose tools that were dropped on the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a security incident, a file with suspicious attributes was registered as a service on host `vnevado-win10b`. This was flagged as a potential breach activity, with an attempt to register the file as a service for persistence. As part of further activities noticed around the same time, multiple known public tools which could also be used for malicious reasons were dropped on the device.'
      question: 'Can you identify the name of one of the dual-purpose tools that were dropped on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexec.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'psexec.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A file named `psexesvc.exe` with suspicious attributes was registered as a service, possibly for persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Multiple dual-purpose tools were dropped on the device, including a file named `psexec.exe` which could be used for malicious activities such as credential theft, privilege escalation, and lateral movement.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
