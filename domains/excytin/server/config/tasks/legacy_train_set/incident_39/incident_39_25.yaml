tasks:
  - task_id: incident_39_legacy_train_set_task_25
    title: incident_39_legacy_train_set_task_25
    description: 'In relation to the detected malicious credential theft tool execution, what is the IP address associated with this activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a sign-in attempt using a deceptive user account detected on the host `vnevado-win10b` with IP address `141.216.110.153`, attackers might be using the account to perform various attack activities, including lateral movement and accessing sensitive data. Additionally, a known credential theft tool execution was detected shortly after.'
      question: 'In relation to the detected malicious credential theft tool execution, what is the IP address associated with this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '65.233.23.156'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '65.233.23.156'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in attempt was detected using a deceptive user account `kyleg` on host `vnevado-win10v`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
