tasks:
  - task_id: incident_39_legacy_train_set_task_1
    title: incident_39_legacy_train_set_task_1
    description: 'As part of the same incident, a known credential theft tool execution was detected. What was the IP address involved in this credential theft tool execution?'
    inherit_shared: true
    initial_context:
      incident_context: 'A potentially malicious URL click was detected involving user Ethan Brooks who clicked on the URL `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`. The email associated with Ethan Brooks is `Ethan Brooks@vnevado.alpineskihouse.co`, and the mail was sent to `tgs2z@vnevado.alpineskihouse.co`. This incident is part of a broader security incident.'
      question: 'As part of the same incident, a known credential theft tool execution was detected. What was the IP address involved in this credential theft tool execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '65.233.23.156'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '65.233.23.156'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` clicked on a malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A known credential theft tool execution was detected from IP address `65.233.23.156`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
