tasks:
  - task_id: incident_39_legacy_train_set_task_78
    title: incident_39_legacy_train_set_task_78
    description: 'There is also another dual-purpose tool that was identified in this alert. Can you find out what this additional file name is?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was observed on the host `vnevado-win10v` where multiple dual-purpose tools were dropped. These tools could be used for credential theft, privilege escalation, and lateral movement. Among the files identified are `powershell.exe`, `mimikatz.exe`, `domaindominance27.ps1`, `rubeus.exe`, and `psexec.exe`. The user account involved is `tgs2z` with the SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
      question: 'There is also another dual-purpose tool that was identified in this alert. Can you find out what this additional file name is?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'psexesvc.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The attacker launched PowerShell with the command line `powershell.exe -executionpolicy bypass -file c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1` on `2024-06-27T14:32:08.4041849Z`, with Process ID `4676`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The file `psexesvc.exe` which is a known dual-purpose tool was dropped on the device.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
