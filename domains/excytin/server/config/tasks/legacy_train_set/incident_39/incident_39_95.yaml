    description: 'In the alert indicating possible use of the Rubeus kerberoasting tool, which SID was associated with the suspicious account activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A multi-stage security incident involving potential human-operated malicious activity was observed, which might lead to ransomware or other payloads installed on target devices. As part of this incident, the file `rubeus.exe` was used to dump Kerberos tickets on host `vnevado-win10b` by account `kyleg` with IP address `141.216.110.153`.'
      question: 'In the alert indicating possible use of the Rubeus kerberoasting tool, which SID was associated with the suspicious account activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-5-7-21-1843151660-3234030288-105586167-1422'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-5-7-21-1843151660-3234030288-105586167-1422'
      scoring:
        max_score: 1.0
