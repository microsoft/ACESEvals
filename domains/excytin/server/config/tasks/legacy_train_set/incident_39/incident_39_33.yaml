tasks:
  - task_id: incident_39_legacy_train_set_task_33
    title: incident_39_legacy_train_set_task_33
    description: 'A user clicked on a link in an email that was quarantined by zero-hour auto purge (ZAP). Can you identify the name of the user who accessed this link?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involved the ''Kekeo'' malware detected during lateral movement on the device `vnevado-win10b`. Subsequently, multiple dual-purpose tools were dropped on the same device. Later, a separate incident occurred where a user clicked on a link in a ZAP-quarantined email. Can you identify the name of the user related to this incident?'
      question: 'A user clicked on a link in an email that was quarantined by zero-hour auto purge (ZAP). Can you identify the name of the user who accessed this link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Ethan Brooks'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The malware `rubeus.exe` (associated with ''Kekeo'') was detected on the device at `2024-07-04 22:35:04.098458+00:00`. An attacker might be attempting to move laterally to this device from another device on the network.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
