tasks:
  - task_id: incident_39_legacy_train_set_task_70
    title: incident_39_legacy_train_set_task_70
    description: 'Related to this incident, there were emails containing a malicious URL that were delivered and later removed. Can you identify the primary email address of the mailbox involved in this alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'A known credential theft tool `mimikatz.exe` was detected running a command line involving `powershell.exe` on host `vnevado-win10v`. The process, with an ID of 6880, was executed on `2024-06-27` and utilized for privileged operations which might indicate an intent to dump users'' credentials. This is part of a broader security incident involving malicious activities across multiple endpoints.'
      question: 'Related to this incident, there were emails containing a malicious URL that were delivered and later removed. Can you identify the primary email address of the mailbox involved in this alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tgs2z@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` has executed a known credential theft tool.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
