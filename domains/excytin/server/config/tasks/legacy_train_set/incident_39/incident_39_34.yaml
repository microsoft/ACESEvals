tasks:
  - task_id: incident_39_legacy_train_set_task_34
    title: incident_39_legacy_train_set_task_34
    description: 'In the subsequent alert, a user was involved in enumerating SMB sessions on VNEVADO-DC and retrieving recent IP addresses of 2 accounts. Can you identify the name of this user?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was observed starting with a file dropped and launched from a remote location on host `vnevado-win10b`. It involved the execution of the file `psexesvc.exe` by account `fk8mq` with ProcessID `5512`. This could indicate an attacker or malware attempting lateral movement or propagation. Later, an alert was triggered indicating a suspected overpass-the-hash attack (Kerberos) attempted by Emma Clark (Helpdesk Administrator) on VNEVADO-Win10V against VNEVADO-DC.'
      question: 'In the subsequent alert, a user was involved in enumerating SMB sessions on VNEVADO-DC and retrieving recent IP addresses of 2 accounts. Can you identify the name of this user?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Ethan Brooks'
      scoring:
        max_score: 1.0
