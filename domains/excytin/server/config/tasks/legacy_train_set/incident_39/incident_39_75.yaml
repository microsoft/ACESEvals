tasks:
  - task_id: incident_39_legacy_train_set_task_75
    title: incident_39_legacy_train_set_task_75
    description: 'During the same timeframe, suspicious remote activities were observed. Can you identify the file name of the process that was involved in these suspicious remote activities?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was detected involving the use of the Rubeus tool, which is known for performing kerberoasting and other techniques using Kerberos authentication. In this case, activities involving the execution of commands via `rubeus.exe` on host `???` were observed. This could imply an attacker attempting to request Kerberos tickets to get plaintext credentials or possibly performing pass-the-ticket attacks.'
      question: 'During the same timeframe, suspicious remote activities were observed. Can you identify the file name of the process that was involved in these suspicious remote activities?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'psexesvc.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The Rubeus kerberoasting tool was possibly used on the host `vnevado-win10b`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious remote activity was observed involving the file `psexesvc.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
