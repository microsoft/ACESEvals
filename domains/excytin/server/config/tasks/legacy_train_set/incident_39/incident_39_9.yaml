tasks:
  - task_id: incident_39_legacy_train_set_task_9
    title: incident_39_legacy_train_set_task_9
    description: 'Based on the observed suspicious activities and connected entities, which user account was involved in using PsExec to launch a command on a remote device?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious behavior indicating the possible use of the Rubeus kerberoasting tool was detected on host `vnevado-win10b`. This involved several processes including `psexesvc.exe` and `rubeus.exe`, which might be an indication of an attacker attempting to request Kerberos tickets for an account''s SPN or performing pass-the-ticket techniques.'
      question: 'Based on the observed suspicious activities and connected entities, which user account was involved in using PsExec to launch a command on a remote device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tgs2z'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Activity indicating the use of the Rubeus tool was observed, which might include kerberoasting, pass-the-ticket, and other attack techniques. The tool extracted a file named `adminticket.txt`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'PsExec was used to launch a command on a remote device. The account name involved in this activity is `tgs2z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
