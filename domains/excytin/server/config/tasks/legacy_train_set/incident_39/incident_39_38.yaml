tasks:
  - task_id: incident_39_legacy_train_set_task_38
    title: incident_39_legacy_train_set_task_38
    description: 'Can you identify the name of a dropped file that might be used for credential theft, privilege escalation, or lateral movement related to this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was reported involving potential lateral movement or propagation, where a file named `psexesvc.exe` was dropped and executed from a remote location. This remote activity might indicate an attacker or malware. Subsequently, a sequence of alerts indicative of human-operated malicious activity on the same device followed, which might lead to ransomware or other payloads.'
      question: 'Can you identify the name of a dropped file that might be used for credential theft, privilege escalation, or lateral movement related to this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'domaindominance27.ps1'
      scoring:
        max_score: 1.0
