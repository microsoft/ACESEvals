tasks:
  - task_id: incident_39_legacy_train_set_task_82
    title: incident_39_legacy_train_set_task_82
    description: 'As part of the same security incident, a known credential theft tool was executed. Can you identify the name of the tool used for credential theft?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident reported suspicious sequence of exploration activities where a process called a set of Windows commands. These commands can be used by attackers to identify assets of value and coordinate lateral movement after compromising a machine. Several instances of `net.exe` and `whoami.exe` commands were executed within a short period of time.'
      question: 'As part of the same security incident, a known credential theft tool was executed. Can you identify the name of the tool used for credential theft?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A process `powershell.exe` conducted a sequence of suspicious exploration activities on 2024-07-04 22:35:02.508708+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A malicious credential theft tool `mimikatz.exe` was executed on 2024-07-04 22:35:00.823035+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
