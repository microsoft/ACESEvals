    title: incident_39_legacy_train_set_task_96
    description: 'What is the command line used by the process with ID 5176 that indicates another malicious credential theft tool execution?'
    inherit_shared: true
    initial_context:
      incident_context: 'A known credential theft tool execution command line was detected as part of a recent security incident. Specifically, a process with ID 5196 was observed executing `mimikatz.exe` with parameters aimed to dump users'' credentials, keys, plain-text passwords, and more. The command line used was `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit`.'
      question: 'What is the command line used by the process with ID 5176 that indicates another malicious credential theft tool execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit'
      scoring:
        max_score: 1.0
