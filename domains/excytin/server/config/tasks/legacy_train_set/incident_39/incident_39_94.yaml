tasks:
  - task_id: incident_39_legacy_train_set_task_94
    title: incident_39_legacy_train_set_task_94
    description: 'Can you identify the name of the file associated with the detected malware activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving a file being dropped and launched from a remote location was detected. During this incident, an attacker or malware might be attempting to move laterally or propagate. The remote session involved an account with the SID `S-0-6-5` and an IP address `141.216.110.153`.'
      question: 'Can you identify the name of the file associated with the detected malware activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'rubeus.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A remote session dropped and executed the file `rubeus.exe` with the command line `rubeus.exe dump /service:xfbzkp /user:lucasb` on 2024-06-27 at 14:33:27.7927134 UTC, with Process ID `2608`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The file `rubeus.exe` was detected as ''Kekeo'' malware and was active.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
