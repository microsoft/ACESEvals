tasks:
  - task_id: incident_39_legacy_train_set_task_45
    title: incident_39_legacy_train_set_task_45
    description: 'Can you identify the process that executed the suspicious sequence of exploration activities?'
    inherit_shared: true
    initial_context:
      incident_context: 'As an addition to the Kekeo malware investigation on host `vnevado-win10b`, there was also a suspicious sequence of exploration activities identified. Such windows commands can be leveraged by attackers for reconnaissance and to coordinate lateral movement after compromising a machine. We need to further analyze this by identifying the specific process that performed these reconnaissance activities.'
      question: 'Can you identify the process that executed the suspicious sequence of exploration activities?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'whoami.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'whoami.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An active ''Kekeo'' malware was detected running the process `rubeus.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'PsExec was used to launch a command on a remote device, running the process `net.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
