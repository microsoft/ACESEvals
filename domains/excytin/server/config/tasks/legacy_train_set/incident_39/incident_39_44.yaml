tasks:
  - task_id: incident_39_legacy_train_set_task_44
    title: incident_39_legacy_train_set_task_44
    description: 'In a related alert, it was observed that the Rubeus tool might have been used to perform kerberoasting on this endpoint. What is the username of the account for which Kerberos tickets were requested?'
    inherit_shared: true
    initial_context:
      incident_context: 'A user named Ethan Brooks from the email `Ethan Brooks@vnevado.alpineskihouse.co` accessed a possibly malicious link `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/` in an email that was quarantined by zero-hour auto purge (ZAP). This alert was triggered based on a Microsoft Defender for Office 365 alert.'
      question: 'In a related alert, it was observed that the Rubeus tool might have been used to perform kerberoasting on this endpoint. What is the username of the account for which Kerberos tickets were requested?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tgs2z'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` accessed a link in an email that was quarantined by zero-hour auto purge (ZAP).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Activity indicating the use of the Rubeus kerberoasting tool was observed on the account `tgs2z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
