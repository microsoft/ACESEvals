tasks:
  - task_id: incident_39_legacy_train_set_task_19
    title: incident_39_legacy_train_set_task_19
    description: 'During this incident, there was also suspicious access to the LSASS service. Can you identify the name of the file used for this access?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a security incident on 2024-07-04, the Mimikatz credential theft tool was detected on a device. Mimikatz is known for harvesting plaintext passwords, password hashes, smartcard PINs, and Kerberos tickets. This detection shows an attempt to use `mimikatz.exe` for credential theft. The following command lines were observed: `4748__2024-06-27t14:33:38.0249949z__mimikatz.exe lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp exit` and `5176__2024-06-27t14:33:32.4282796z__mimikatz.exe privilege::debug kerberos::ptt c:\m365dattack\admin-tickets exit`. The aim of this attack could be to harvest credentials to log into this or other devices within the network.'
      question: 'During this incident, there was also suspicious access to the LSASS service. Can you identify the name of the file used for this access?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'get-krbticket.ps1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The Mimikatz hacktool was detected executing with Process ID `6880` at `2024-06-27t14:32:37.7041174z`, using the command line `mimikatz.exe privilege::debug sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co /run:"powershell.exe dir \vnevado-win10bideshare"`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'There was suspicious access to the LSASS service involving the file `get-krbticket.ps1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
