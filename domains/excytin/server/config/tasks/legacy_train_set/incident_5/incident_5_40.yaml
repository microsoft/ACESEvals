tasks:
  - task_id: incident_5_legacy_train_set_task_40
    title: incident_5_legacy_train_set_task_40
    description: 'Can you identify the AadDeviceId of the host in which suspicious file system changes, indicative of ransomware activity, were detected?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was reported in which potentially compromised assets are exhibiting ransomware-like behavior, impacting several devices. An attacker may be operating using the specified user account, IP, or device to move laterally across the network and infect as many devices as possible with ransomware. The device involved in this alert is ''vnevado-win11t'' with AadDeviceId ''e5799261-6720-4297-961e-bd9ca4275033''. Additionally, a file named ''characterical.zip.lockbit'' was identified. A connected alert also indicated a possible attempt to access the Primary Refresh Token (PRT) used to enable single sign-on (SSO) across applications on different devices.'
      question: 'Can you identify the AadDeviceId of the host in which suspicious file system changes, indicative of ransomware activity, were detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account `dp5hn` is potentially compromised and is exhibiting ransomware-like behavior.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'There was a possible attempt to access the Primary Refresh Token (PRT) on the host with HostName `vnevado-win11u`.'
