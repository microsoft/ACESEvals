tasks:
  - task_id: incident_5_legacy_train_set_task_1
    title: incident_5_legacy_train_set_task_1
    description: 'What is the URL associated with the Manatee Tempest activity group observed in this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious and anomalous user behavior was detected on the device `vnevado-win11t` indicating potential compromise. This could be a part of a possible human-operated attack. This suspicious behavior caused several alerts related to the user, including a change in the frequency and usage pattern of tools or applications.'
      question: 'What is the URL associated with the Manatee Tempest activity group observed in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vectorsandarrows.com'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vectorsandarrows.com'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user with SID `S-1-5-21-1840191660-8534830288-125585561-1522` exhibited suspicious and anomalous behavior, which may indicate a possible human-operated attack.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The Manatee Tempest activity group has been identified, which is known for cybercriminal activity and has compromised the URL `vectorsandarrows.com`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
