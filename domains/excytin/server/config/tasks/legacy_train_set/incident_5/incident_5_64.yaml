tasks:
  - task_id: incident_5_legacy_train_set_task_64
    title: incident_5_legacy_train_set_task_64
    description: 'What is the name of the account associated with the possible ransomware activity detected on 2024-07-04?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the same investigation, lateral movement to the jump server (vnevado-jump) was also detected via PSExec, however the IP address remains unknown at the moment. Later, possible ransomware activity based on a known malicious extension was observed on the device on 2024-07-04. This activity involved substantial file system changes and is indicative of mass encryption of files by ransomware.'
      question: 'What is the name of the account associated with the possible ransomware activity detected on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'dp5hn'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A known credential theft tool was executed by the user account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'There was a lateral movement to the jump server `Vnevado-jump` from the IP address `99.83.111.100` using PSExec.'
