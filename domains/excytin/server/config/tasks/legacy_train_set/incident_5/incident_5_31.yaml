    title: incident_5_legacy_train_set_task_31
    description: 'Who was the user account detected in the subsequent alert for the same attempt to access the Primary Refresh Token (PRT)?'
    inherit_shared: true
    initial_context:
      incident_context: 'The possible attempt to access Primary Refresh Token (PRT) was detected on 2024-07-04 22:35:00.619840+00:00. It involves key artifacts of Azure AD authentication. Attackers might use PRT to move laterally or steal credentials within the organization. The alert is linked with process activity involving `powershell.exe` and `browsercore.exe`.'
      question: 'Who was the user account detected in the subsequent alert for the same attempt to access the Primary Refresh Token (PRT)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'dp5hn'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There was a possible attempt to access Primary Refresh Token (PRT) using the process with filename `browsercore.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
