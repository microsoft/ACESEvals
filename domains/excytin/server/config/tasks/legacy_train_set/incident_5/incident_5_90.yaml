tasks:
  - task_id: incident_5_legacy_train_set_task_90
    title: incident_5_legacy_train_set_task_90
    description: 'Related to this incident, there was also a malware that established command and control behavior. Can you provide the URL that was associated with this command and control activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was identified where potentially compromised assets exhibited ransomware-like behavior, impacting multiple devices. An attacker may have used a specific user account or IP to move laterally across the network, spreading ransomware. Automated remediation might be necessary to disable the compromised account or device. The IP `99.83.111.100` and file `kiters.7z` were involved in this activity.'
      question: 'Related to this incident, there was also a malware that established command and control behavior. Can you provide the URL that was associated with this command and control activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'http://vectorsandarrows.com/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Potentially compromised assets exhibiting ransomware-like behavior were detected on the host `vnevado-win11u`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A command and control behavior was blocked, associated with the URL `http://vectorsandarrows.com/`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
