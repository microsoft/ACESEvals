    title: incident_5_legacy_train_set_task_6
    description: 'What is the URL associated with the Manatee Tempest group''s activity in this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a potential ransomware activity on the device `vnevado-win11t`, several file system changes were discovered. The files included `get-userprttoken.ps1`, `characterical.zip`, and `characterical.zip.lockbit`. These changes, indicative of a ransomware attack, were linked back to activities of the Manatee Tempest group. This Russia-based cybercriminal group is known for deploying the Dridex banking trojan and collaborating with Mustard Tempest to gain network access. They use drive-by downloads, malvertising, and FakeUpdates to initiate attacks and then deploy Cobalt Strike for lateral movement and ransomware. More details can be found in the Actor Profile: Manatee Tempest Threat Analytics report.'
      question: 'What is the URL associated with the Manatee Tempest group''s activity in this incident?'
