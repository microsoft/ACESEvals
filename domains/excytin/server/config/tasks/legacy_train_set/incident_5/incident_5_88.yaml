      incident_context: 'In a recent security incident, a Command and Control behavior was blocked after detecting malware on a machine. The malware might have received commands from remote attackers. A related entity was the URL `http://vectorsandarrows.com/`, which could have been involved in malicious activity. Shortly after, a ransomware payload was remotely launched on the same device, potentially aimed at encrypting the content and rendering it unusable for users. Later, there was evidence of lateral movement to the jump server Vnevado-jump using PSExec. Following these events, the Mimikatz credential theft tool was detected on the device, potentially used to harvest credentials.'
