tasks:
  - task_id: incident_5_legacy_train_set_task_81
    title: incident_5_legacy_train_set_task_81
    description: 'During this investigation, it was found that there was also a possible ransomware activity involving numerous file system changes. What is the file name of the file that was appended with a known ransomware extension?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious WMI process creation was observed on the machine `vnevado-win10s`. This machine has seen multiple processes such as `vssblatemp.exe`, `bcdedit`, `curl`, and a PowerShell script `get-userprttoken.ps1` being executed in a short time frame. This malware activity is known to frequently use WMI to spawn new processes and could be indicative of a further infection.'
      question: 'During this investigation, it was found that there was also a possible ransomware activity involving numerous file system changes. What is the file name of the file that was appended with a known ransomware extension?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip.lockbit'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'characterical.zip.lockbit'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious WMI process was created on the machine using the account `dp5hn`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Possible ransomware activity was detected where files were appended with the extension `.lockbit`, specifically `characterical.zip.lockbit`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
