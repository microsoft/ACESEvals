tasks:
  - task_id: incident_5_legacy_train_set_task_18
    title: incident_5_legacy_train_set_task_18
    description: 'Following this incident, numerous file system changes were detected indicating possible ransomware activity. One of the files observed in this context is a PowerShell script. What is the name of this PowerShell script?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was reported where all file snapshots and shadow copies were deleted via WMI or VSSAdmin, which is a common indicator of ransomware infection. The file `vssblatemp.exe` was launched on the host `vnevado-win11t` with the command line `vssblatemp.exe delete shadows /all`. The Process ID was 1900.'
      question: 'Following this incident, numerous file system changes were detected indicating possible ransomware activity. One of the files observed in this context is a PowerShell script. What is the name of this PowerShell script?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-userprttoken.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'get-userprttoken.ps1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'All file snapshots and shadow copies were deleted via WMI or VSSAdmin by an account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`, which is common during a ransomware infection.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A possible ransomware activity was detected involving numerous file system changes and appending a known malicious file extension, including the file `get-userprttoken.ps1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
