tasks:
  - task_id: incident_5_legacy_train_set_task_75
    title: incident_5_legacy_train_set_task_75
    description: 'Can you identify the name of the file that shows ransomware-like behavior in the end alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving possible ransomware activity, which includes appending a known malicious file extension, has been detected. Various files including `kiters.7z.lockbit`, `ponceau.7z`, `syncretic.7z.lockbit`, `earlap.doc`, `syncretic.7z`, `unstreaming.xlsx`, `ponceau.7z.lockbit`, `kiters.7z` and `unstreaming.xlsx.lockbit` were affected on the device with the AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`.'
      question: 'Can you identify the name of the file that shows ransomware-like behavior in the end alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip.lockbit'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'characterical.zip.lockbit'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account `dp5hn` is linked to potential ransomware activity, as numerous file system changes have been observed indicating mass encryption.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A file named `characterical.zip.lockbit` is also linked to ransomware-like behavior, suggesting it is a part of the compromised assets showing such behavior.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
