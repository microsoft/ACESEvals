    title: incident_5_legacy_train_set_task_86
    description: 'What was the IP address associated with the Manatee Tempest activity group mentioned in the related alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'A command and control behavior incident involving malware was blocked. This malware could receive commands from remote attackers and perform activities associated with cyber attacks. The malware was found on the machine with hostname `vnevado-win10r`, it seemed to access the URL `http://vectorsandarrows.com/` using the command `curl http://vectorsandarrows.com`.'
      question: 'What was the IP address associated with the Manatee Tempest activity group mentioned in the related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '198.43.121.209'
      scoring:
        max_score: 1.0
