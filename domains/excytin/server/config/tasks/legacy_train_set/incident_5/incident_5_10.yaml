tasks:
  - task_id: incident_5_legacy_train_set_task_10
    title: incident_5_legacy_train_set_task_10
    description: 'In connection with this malicious activity, ''CommandAndControl'' malware was detected during an attempt to move laterally within the network. Can you provide the process command line that was used to execute the detected ''CommandAndControl'' malware?'
    inherit_shared: true
    initial_context:
      incident_context: 'A significant security incident was reported where all file snapshots and shadow copies were deleted via WMI or VSSAdmin, which is often associated with ransomware infections. The process involved was `vssblatemp.exe` and it was launched with the command line `vssblatemp.exe delete shadows /all`. This incident ties back to the Iranian MOIS operators who have been known to deploy limited-impact wipers.'
      question: 'In connection with this malicious activity, ''CommandAndControl'' malware was detected during an attempt to move laterally within the network. Can you provide the process command line that was used to execute the detected ''CommandAndControl'' malware?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '5572__2024-06-20t09:32:04.8002759z__curl http://vectorsandarrows.com'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '5572__2024-06-20t09:32:04.8002759z__curl http://vectorsandarrows.com'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account `dp5hn` was involved in the deletion of file backups via WMI or VSSAdmin, which is a common tactic during Ransomware infections.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The ''CommandAndControl'' malware was detected on a device, indicating that an attacker might be using this malware to move laterally within the network with the process ID `5572`, created on `2024-06-20t09:32:04.8002759z`, using the command line `curl http://vectorsandarrows.com`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
