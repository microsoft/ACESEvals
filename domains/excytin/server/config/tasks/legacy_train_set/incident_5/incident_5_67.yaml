tasks:
  - task_id: incident_5_legacy_train_set_task_67
    title: incident_5_legacy_train_set_task_67
    description: 'As part of investigating this incident, there was a suspicious WMI process creation observed. Can you find out the file name of the process that was created?'
    inherit_shared: true
    initial_context:
      incident_context: 'A Command and Control behavior was blocked due to malware running on the machine. The malware, which was considered active, had a URL `http://vectorsandarrows.com/` involved in its activities. Active malware detections have higher severity ratings, and precautionary measures should be taken to check for residual signs of infection.'
      question: 'As part of investigating this incident, there was a suspicious WMI process creation observed. Can you find out the file name of the process that was created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vssblatemp.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Malware exhibiting Command and Control behavior was detected and blocked for the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
