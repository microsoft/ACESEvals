tasks:
  - task_id: incident_5_legacy_train_set_task_49
    title: incident_5_legacy_train_set_task_49
    description: 'Following the compromise, there was a possible lateral movement observed. Can you identify the IP address involved in the lateral movement attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving a possible compromised user account was reported, where the account was observed dropping ransomware-related files (`get-userprttoken.ps1`, `characterical.zip`, and `characterical.zip.lockbit`) on several devices. This suggests that an attacker may have compromised the user account to infect many devices with ransomware. The compromised account has the following details: Name: `dp5hn`, AadUserId: `731adb71-b11c-4bbf-850b-57989b350e96`, Sid: `S-1-5-21-1840191660-8534830288-125585561-1522`, IP Address: `99.83.111.100`. Automated remediation actions may have been taken to disable the account.'
      question: 'Following the compromise, there was a possible lateral movement observed. Can you identify the IP address involved in the lateral movement attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '83.162.58.168'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '83.162.58.168'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user account was observed dropping a ransomware-related file on the host `vnevado-win11t`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Lateral movement was observed from the IP address `83.162.58.168` in close time proximity to a suspicious network event.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
