tasks:
  - task_id: incident_5_legacy_train_set_task_63
    title: incident_5_legacy_train_set_task_63
    description: 'Based on the observed Manatee Tempest activity, can you provide the hostname of another endpoint involved in this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'The actor group relies on tactics such as using domain fronting for command-and-control channels. One command observed was to use `curl` to access vectorsandarrows.com from a specific host.'
      question: 'Based on the observed Manatee Tempest activity, can you provide the hostname of another endpoint involved in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10s'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win10s'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` is associated with Manatee Tempest cybercriminal group activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The host `vnevado-win10s` is also linked to activities performed by the Manatee Tempest cybercriminal group.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
