tasks:
  - task_id: incident_5_legacy_train_set_task_45
    title: incident_5_legacy_train_set_task_45
    description: 'A few days later, suspicious activity involving SMB remote file access was blocked. Can you provide the name of the account associated with this SMB activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4, 2024, a ransomware payload was remotely launched on the device `vnevado-win11u` which is associated with the account `dp5hn` and the host with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`. This attack aims to encrypt the content on the device, making it inaccessible to users. For more information, read the Threat Analytics report, Threat overview: Human-operated ransomware.'
      question: 'A few days later, suspicious activity involving SMB remote file access was blocked. Can you provide the name of the account associated with this SMB activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Grace Chen'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Grace Chen'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched using the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A lateral movement attempt using SMB remote file access was blocked for the user account `Grace Chen` on multiple devices.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
