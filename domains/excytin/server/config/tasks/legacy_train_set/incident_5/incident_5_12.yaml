tasks:
  - task_id: incident_5_legacy_train_set_task_12
    title: incident_5_legacy_train_set_task_12
    description: 'In relation to this remote activity, it was found that all file backups were deleted. Can you identify the hostname of the machine on which these deletions occurred?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious remote activity was observed on the machine `vnevado-win11t`. This alert indicates attempts to initiate interactive sessions, modify files, pass WMI commands, create scheduled tasks, or other potentially malicious activities were initiated remotely on this machine. Notably, there were several processes involved preceding this observation including the execution of the file `get-userprttoken.ps1` via PowerShell, and execution of commands `bcdedit /set recoveryenabled no` and `bcdedit /set bootstatuspolicy ignoreallfailures`.'
      question: 'In relation to this remote activity, it was found that all file backups were deleted. Can you identify the hostname of the machine on which these deletions occurred?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10s'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win10s'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There was a suspicious remote activity initiated by the user with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
