tasks:
  - task_id: incident_5_legacy_train_set_task_43
    title: incident_5_legacy_train_set_task_43
    description: 'There is a linked suspicious remote activity involved in this incident. Can you determine the name of the script file that was remotely executed?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the recent incident on July 4th, 2024, there was possible ransomware activity identified, where numerous file system changes involved appending the extension `.lockbit` to the file `characterical.zip`. This is suspected to be indicative of mass encryption by ransomware. This suspicious activity was flagged based on known malicious extensions from past ransomware incidents.'
      question: 'There is a linked suspicious remote activity involved in this incident. Can you determine the name of the script file that was remotely executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-userprttoken.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'get-userprttoken.ps1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Possible ransomware activity was detected based on a known malicious extension and observed file system changes on the device associated with the account `dp5hn`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious remote activity was detected on the machine involving the process `get-userprttoken.ps1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
