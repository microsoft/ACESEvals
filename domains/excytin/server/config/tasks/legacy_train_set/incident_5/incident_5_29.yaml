tasks:
  - task_id: incident_5_legacy_train_set_task_29
    title: incident_5_legacy_train_set_task_29
    description: 'A suspicious WMI process creation has been observed related to this incident. Can you identify the command line used by the suspicious WMI process?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a security incident concerning potentially compromised assets exhibiting ransomware-like behavior affecting multiple devices, several files including `syncretic.7z` and `ponceau.7z` with extensions `.lockbit`, and an IP `99.83.111.100` were flagged. The attack may involve an attacker moving laterally across the network using the account with SID `S-0-6-5`.'
      question: 'A suspicious WMI process creation has been observed related to this incident. Can you identify the command line used by the suspicious WMI process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'curl http://vectorsandarrows.com'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'curl http://vectorsandarrows.com'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account `dp5hn` is exhibiting ransomware-like behavior, potentially impacting several devices.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious WMI process creation was observed with Process ID `5572` at `2024-06-20t09:32:04.8002759z`. The command line used was `curl http://vectorsandarrows.com`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
