tasks:
  - task_id: incident_5_legacy_train_set_task_78
    title: incident_5_legacy_train_set_task_78
    description: 'Can you determine the hostname of the endpoint where ransomware behavior was detected in the file system?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of investigating a multi-stage security incident involving potentially compromised assets exhibiting ransomware-like behavior on the host `vnevado-win11t`, a suspicious remote activity was observed. This activity is commonly flagged for initiating interactive sessions, modifying files, or other potentially malicious actions remotely. An automated remediation action might be taken to disable the account or device used by the attacker.'
      question: 'Can you determine the hostname of the endpoint where ransomware behavior was detected in the file system?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11u'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win11u'
      scoring:
        max_score: 1.0
