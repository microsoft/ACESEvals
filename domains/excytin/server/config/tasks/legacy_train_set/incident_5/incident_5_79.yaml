tasks:
  - task_id: incident_5_legacy_train_set_task_79
    title: incident_5_legacy_train_set_task_79
    description: 'Following up on this incident, ransomware-like behavior was observed. Could you identify the file name that was associated with this ransomware attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent command and control behavior was blocked on the host `vnevado-win10s`. The host made a suspicious request using `curl http://vectorsandarrows.com`, and this suspicious activity could be associated with malware capable of receiving commands from remote attackers. Additionally, because the malware was active, higher severity ratings were assigned, and precautionary measures were recommended to prevent further infection.'
      question: 'Following up on this incident, ransomware-like behavior was observed. Could you identify the file name that was associated with this ransomware attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'syncretic.7z.lockbit'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'syncretic.7z.lockbit'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Malware with command and control behavior was detected and blocked on the account `dp5hn`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A potentially compromised asset exhibited ransomware-like behavior with the file `syncretic.7z.lockbit`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
