tasks:
  - task_id: incident_5_legacy_train_set_task_2
    title: incident_5_legacy_train_set_task_2
    description: 'What is the hostname of the device where suspicious file system changes indicative of ransomware activity were detected?'
    inherit_shared: true
    initial_context:
      incident_context: 'In a recent incident, a ransomware payload was remotely launched, suggesting possible file encryption attempts to render the device unusable to users. The user''s account identified in this incident is `dp5hn` with a Sid of `S-1-5-21-1840191660-8534830288-125585561-1522`, and an associated AadUserId of `731adb71-b11c-4bbf-850b-57989b350e96`. The suspicious activity originated from IP address `99.83.111.100`.'
      question: 'What is the hostname of the device where suspicious file system changes indicative of ransomware activity were detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win11t'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched on the device with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious file system changes indicating ransomware activity were detected on the host `vnevado-win11t`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
