tasks:
  - task_id: incident_5_legacy_train_set_task_4
    title: incident_5_legacy_train_set_task_4
    description: 'Can you identify the AadDeviceId associated with the suspicious ''GenRansom'' behavior detected on 2024-07-04?'
    inherit_shared: true
    initial_context:
      incident_context: 'A potentially compromised asset exhibiting ransomware-like behavior was detected on 2024-07-04. This incident might involve multiple devices and could be driven by an attacker using the specified user account or IP address to spread the ransomware. Automated remediation might be initiated to disable the account or device involved. However, there was a suspicious ''GenRansom'' behavior detected around the same time, indicating active malware that can replicate or receive commands from remote attackers.'
      question: 'Can you identify the AadDeviceId associated with the suspicious ''GenRansom'' behavior detected on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e` is exhibiting ransomware-like behavior and is potentially compromised.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The same device with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e` was found running active malware with ''GenRansom'' behavior.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
