    initial_context:
      incident_context: 'A potential security incident involving a possible attempt to access the Primary Refresh Token (PRT) was detected, wherein an attacker might be trying to gain access to Azure AD authentication tokens on host `vnevado-win11t`. The process involved had the ProcessId__CreatedTimeUtc__CommandLine `7036__2024-06-20t09:29:49.304018z__''browsercore.exe''`. This incident might be related to malicious activities associated with accessing critical resources for lateral movement or credential theft.'
      question: 'During this incident, it was found that malware was detected and active. Can you identify the file name of the malware that was found to be active?'
