tasks:
  - task_id: incident_5_legacy_train_set_task_5
    title: incident_5_legacy_train_set_task_5
    description: 'During the investigation, it was found that lateral movement using SMB remote file access was blocked on multiple devices. Can you identify the email of the user whose attempt to create, delete, or modify files over SMB was blocked?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was flagged indicating potentially compromised assets exhibiting ransomware-like behavior. This incident impacts several devices, and an attacker might be using a specified user account, IP, or device to move laterally across the network and spread ransomware. A file named `unstreaming.xlsx.lockbit` was identified on the host `vnevado-win11u`, associated with the user account `dp5hn`. Automated remediation actions might be taken to disable the compromised account or device used by the attacker.'
      question: 'During the investigation, it was found that lateral movement using SMB remote file access was blocked on multiple devices. Can you identify the email of the user whose attempt to create, delete, or modify files over SMB was blocked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Grace Chen@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Grace Chen@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` is potentially compromised and exhibiting ransomware-like behavior.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The email account `Grace Chen@vnevado.alpineskihouse.co` attempted lateral movement using SMB remote file access and was blocked by attack disruption.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
