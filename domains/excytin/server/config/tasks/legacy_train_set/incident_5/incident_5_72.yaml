tasks:
  - task_id: incident_5_legacy_train_set_task_72
    title: incident_5_legacy_train_set_task_72
    description: 'There is also a suspicious WMI process creation related to this incident. Can you provide the command line details of the process observed?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security incident involving a compromised user account with the account SID `S-0-6-5` delivering ransomware files. The alert was triggered due to the suspicious WMI process creation observed on the machine, which is possibly used by malware to spawn new processes.'
      question: 'There is also a suspicious WMI process creation related to this incident. Can you provide the command line details of the process observed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '`powershell -file c:\scripts\get-userprttoken.ps1`'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '`powershell -file c:\scripts\get-userprttoken.ps1`'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user account was seen delivering ransomware-related files on host `vnevado-win11t`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious WMI process was created with process ID `6280` at `2024-06-20t09:29:43.9198085z` using the command line `powershell -file c:\scripts\get-userprttoken.ps1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
