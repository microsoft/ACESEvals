tasks:
  - task_id: incident_5_legacy_train_set_task_13
    title: incident_5_legacy_train_set_task_13
    description: 'Related to this malware detection, it is observed that potentially compromised assets are exhibiting ransomware-like behavior. Can you identify the name of the file involved in this ransomware activity?'
    inherit_shared: true
    initial_context:
      incident_context: '''CommandAndControl'' malware was detected on the device `vnevado-win10s` with AadDeviceId `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`, which may indicate an attacker attempting to move laterally from another device in the network. The process ID associated with this activity is `6460` and it was created at `2024-06-20T09:10:51.7817908Z` with the command line `curl http://vectorsandarrows.com`.'
      question: 'Related to this malware detection, it is observed that potentially compromised assets are exhibiting ransomware-like behavior. Can you identify the name of the file involved in this ransomware activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kiters.7z.lockbit'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'kiters.7z.lockbit'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was involved in an incident where ''CommandAndControl'' malware was detected during lateral movement.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A file named `kiters.7z.lockbit` was detected exhibiting ransomware-like behavior on potentially compromised assets.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
