    description: 'What is the hostname of the system involved in the detected ransomware behavior in the file system?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent security incident involved suspicious ''GenRansom'' behavior detected on host `vnevado-win11u`, sourced from a machine that showed signs of active malware. The incident involved malware that could potentially replicate and execute commands from remote attackers. The initial alert indicated an active infection requiring precautionary measures and checks for residual signs. Following this, a command and control behavior was blocked and file backups were deleted, which is a common action during a ransomware infection.'
      question: 'What is the hostname of the system involved in the detected ransomware behavior in the file system?'
