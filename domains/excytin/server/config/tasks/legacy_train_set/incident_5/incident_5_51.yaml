tasks:
  - task_id: incident_5_legacy_train_set_task_51
    title: incident_5_legacy_train_set_task_51
    description: 'What is the hostname of the device on which the ransomware payload was remotely launched?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious remote activity was observed on the machine with hostname `vnevado-win11u`. This alert indicated potential attempts to initiate interactive sessions, modify files, pass WMI commands, create scheduled tasks, or other potentially malicious activities from a remote machine. In connection with this incident, a ransomware payload was remotely launched on a device shortly after, likely attempting to encrypt content and render the device unusable.'
      question: 'What is the hostname of the device on which the ransomware payload was remotely launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win11t'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious activity initiated remotely was observed from IP `99.83.111.100`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A ransomware payload was remotely launched on the device with HostName `vnevado-win11t`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
