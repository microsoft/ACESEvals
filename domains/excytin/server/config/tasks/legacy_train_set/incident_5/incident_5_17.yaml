    description: 'Which URL associated with the Manatee Tempest activity group was involved in this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a security incident, we detected active unknown malware running on the machine. This was followed by a possible attempt to access the Primary Refresh Token (PRT); PRT is a key artifact of Azure AD authentication and can enable lateral movement or credential theft. Further investigation revealed activities consistent with the Manatee Tempest group, a Russia-based cybercriminal group involved in various sophisticated cyber attacks such as drive-by downloads, malvertising, FakeUpdates infections, and the use of BLISTER loader to deliver Cobalt Strike beacons for lateral movement and ransomware deployment.'
      question: 'Which URL associated with the Manatee Tempest activity group was involved in this incident?'
