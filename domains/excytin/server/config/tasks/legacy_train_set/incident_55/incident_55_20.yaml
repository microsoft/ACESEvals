    title: incident_55_legacy_train_set_task_20
    description: 'What is the primary email address of the mailbox to which emails containing malicious URL were delivered and later removed?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a security incident, a suspicious system hardware discovery was detected on 2024-07-04. The file `svchost.exe` was observed running on host `mb-winclient` by user accounts including `bjenkins` and `pwilson`. This was followed by an internal phishing campaign where a user was observed to have sent phishing emails from this device to recipients inside the organization. This internal phishing activity was flagged by Microsoft Defender for Office 365.'
      question: 'What is the primary email address of the mailbox to which emails containing malicious URL were delivered and later removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'santiago@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
