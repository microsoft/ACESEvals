tasks:
  - task_id: incident_55_legacy_train_set_task_16
    title: incident_55_legacy_train_set_task_16
    description: 'What account was responsible for the launching of the renamed and executed system executable in the end alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious remote activity on a machine occurred as part of a recent security incident. This incident involved attempts to initiate interactive sessions, modify files, pass WMI commands, create scheduled tasks, and other potentially malicious activities from a remote machine. Notably, the file `cmd.exe` was executed with ProcessId `8896` on 2024-07-02, indicating a possibility of a remote activity. The compromised machine is yet to be identified (host name missing).'
      question: 'What account was responsible for the launching of the renamed and executed system executable in the end alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'SYSTEM'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed on the host `mb-adfs` which could involve actions such as initiating interactive sessions, modifying files, passing WMI commands, or creating scheduled tasks.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A system executable that was renamed was launched on the account `SYSTEM`, indicating possible attempts to use it for malicious activities or to connect to an attacker-controlled network.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
