tasks:
  - task_id: incident_55_legacy_train_set_task_70
    title: incident_55_legacy_train_set_task_70
    description: 'A related alert indicates a suspicious service registration. Can you identify the name of the process that was registered as a service?'
    inherit_shared: true
    initial_context:
      incident_context: 'A known public tool observed under an unexpected filename `iy2orr1e.rrg.exe` was launched by an account with Sid `S-2-5-21-571436798-3864380397-1837441745-3206` and associated with process ID 3116. This might be an attempt to hide the usage of that tool for malicious purposes.'
      question: 'A related alert indicates a suspicious service registration. Can you identify the name of the process that was registered as a service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'services.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A known public tool, which could be used for malicious reasons, was observed under an unexpected filename on host `mb-adfs`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A system program `services.exe` was registered as a service, indicating a possible attempt to establish persistence or gain system privileges.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
