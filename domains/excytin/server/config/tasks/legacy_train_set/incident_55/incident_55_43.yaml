    description: 'A suspicious remote activity was observed related to this machine. Can you provide the account name associated with this remote activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident indicated by unusual addition of credentials to an OAuth app was observed. The user Luciano Herrera from the organization niseko.alpineskihouse.co performed this addition of credentials. The user added a password to the app SimulandApp, potentially indicating that the app might be compromised for malicious purposes such as phishing, data exfiltration, or gaining access to other accounts and devices. Additionally, there was a report of a malicious PowerShell Cmdlet being invoked on a machine.'
      question: 'A suspicious remote activity was observed related to this machine. Can you provide the account name associated with this remote activity?'
