tasks:
  - task_id: incident_55_legacy_train_set_task_88
    title: incident_55_legacy_train_set_task_88
    description: 'As part of this incident, emails with malicious URLs were delivered and later removed. What was the IP address of the sender for these malicious emails?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving an internal phishing campaign was reported where a user named Nina Sullivan sent phishing emails from her device to other users inside the organization, indicating that her account might have been compromised. The alert was triggered based on a Microsoft Defender for Office 365 alert. The phishing email contained a malicious URL: `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`.'
      question: 'As part of this incident, emails with malicious URLs were delivered and later removed. What was the IP address of the sender for these malicious emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '119.36.50.193'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '119.36.50.193'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` sent phishing emails within the organization, indicating a potential compromise of the user account.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Emails containing malicious URLs, which were sent from the sender IP `119.36.50.193`, were delivered and later removed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
