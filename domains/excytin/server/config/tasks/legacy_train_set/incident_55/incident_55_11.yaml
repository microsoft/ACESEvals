tasks:
  - task_id: incident_55_legacy_train_set_task_11
    title: incident_55_legacy_train_set_task_11
    description: 'Can you identify the sender''s email address of the malicious email messages that were delivered and later removed as part of the phishing campaign?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of an ongoing security incident, a hands-on-keyboard attack via Impacket toolkit was observed, indicating an attempt to move laterally across the network. During this attack, a command was suspiciously executed on the device named `mb-adfs`. The attack involved multiple stages and tactics, including credentials memory read and a phishing campaign originating from a compromised internal user account.'
      question: 'Can you identify the sender''s email address of the malicious email messages that were delivered and later removed as part of the phishing campaign?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '4qs6v9m@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '4qs6v9m@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A command via Impacket was executed by the process `lsass.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
