tasks:
  - task_id: incident_55_legacy_train_set_task_53
    title: incident_55_legacy_train_set_task_53
    description: 'There is also an attempt to hide the use of a dual-purpose tool under an unexpected filename in the same incident. Can you find the name of the account involved in this activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving suspicious service registration was flagged indicating a system program `services.exe` was registered as a service. This can indicate malicious intent to establish persistence or gain system privileges.'
      question: 'There is also an attempt to hide the use of a dual-purpose tool under an unexpected filename in the same incident. Can you find the name of the account involved in this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'gsmith'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A system program was registered as a service on host `mb-adfs`, which could indicate malicious intent to establish persistence or gain system privileges.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The account `gsmith` was detected attempting to hide the use of a dual-purpose tool under an unexpected filename, indicating potential malicious activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
