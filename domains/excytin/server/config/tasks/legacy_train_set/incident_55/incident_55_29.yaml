tasks:
  - task_id: incident_55_legacy_train_set_task_29
    title: incident_55_legacy_train_set_task_29
    description: 'Which user account was associated with invoking a malicious PowerShell Cmdlet on the machine during this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a recent incident where a suspicious LDAP (Lightweight Directory Access Protocol) query was executed, a script file `ldaprequest.ps1` was launched using PowerShell. This indicates potential reconnaissance activity, as LDAP queries are often used by attackers to learn the organization''s structure by querying the domain controller for administrative users, groups, and interesting assets. This information could be used by attackers to gain higher privileges and access important assets in the organization.'
      question: 'Which user account was associated with invoking a malicious PowerShell Cmdlet on the machine during this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bjenkins'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspect LDAP query indicating potential reconnaissance activity was executed from the host with AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A malicious PowerShell Cmdlet associated with potential malicious activities such as credential theft, exploitation, network reconnaissance or code injection was invoked by the account named `bjenkins`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
