tasks:
  - task_id: incident_55_legacy_train_set_task_5
    title: incident_55_legacy_train_set_task_5
    description: 'Which specific process was identified attempting to access and potentially extract sensitive information from the security system?'
    inherit_shared: true
    initial_context:
      incident_context: 'Suspicious activity has been detected involving a process trying to read sensitive credential data by accessing the memory of a crucial security system process. Such actions allow an attacker to extract authentication hashes or passwords, which might be written to the file system for exfiltration.'
      question: 'Which specific process was identified attempting to access and potentially extract sensitive information from the security system?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lsass.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'lsass.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious system hardware discovery was performed by an account with SID `S-1-5-21-561436748-3867387497-1732241745-3701`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A process with Process ID `760` and Command Line `lsass.exe` created on `2024-07-02t07:28:35.8580921z` scanned or dumped memory from the Local Security Authority Subsystem Service (lsass.exe), potentially extracting sensitive credentials.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
