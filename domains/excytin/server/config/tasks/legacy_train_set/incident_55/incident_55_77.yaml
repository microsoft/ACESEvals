tasks:
  - task_id: incident_55_legacy_train_set_task_77
    title: incident_55_legacy_train_set_task_77
    description: 'What was the name of the file associated with the suspicious remote activity observed shortly after the impacket execution?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious execution of a command via Impacket was observed on a device with hostname `mb-adfs`. This tool connects to other hosts to explore network shares and execute commands, indicating that attackers might be attempting lateral movement across the network. This activity is often linked to hands-on-keyboard attacks where ransomware and other payloads are installed. During the investigation, multiple files including `powershell.exe` were identified as part of the ongoing attack.'
      question: 'What was the name of the file associated with the suspicious remote activity observed shortly after the impacket execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cmd.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'cmd.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious execution of a command via the Impacket toolkit was observed with the `%comspec%` file.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
