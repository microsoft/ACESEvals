tasks:
  - task_id: incident_55_legacy_train_set_task_59
    title: incident_55_legacy_train_set_task_59
    description: 'Identify the account name associated with the action of reading the DKM key for the specified ADFS object.'
    inherit_shared: true
    initial_context:
      incident_context: 'An alert was triggered indicating that an individual accessed a sensitive DKM key related to an ADFS object with the ID 4cac49d3-29d3-407e-8c9b-b7ebb21541b2. The SID linked to this activity is `S-2-5-21-571436798-3864380397-1837441745-3206` and the associated Azure AD UserID is `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.'
      question: 'Identify the account name associated with the action of reading the DKM key for the specified ADFS object.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'gsmith'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account `gsmith` read the DKM key of the ADFS object with id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
