tasks:
  - task_id: incident_55_legacy_train_set_task_46
    title: incident_55_legacy_train_set_task_46
    description: 'What is the name of the account that was involved in the suspicious system hardware discovery incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'A potentially malicious URL click was detected, involving user Lucas Grey who clicked on `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. The suspicious activity then led to hardware discovery on the target device, which seems to have been done by another account.'
      question: 'What is the name of the account that was involved in the suspicious system hardware discovery incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'pwilson'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` clicked on a potentially malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
