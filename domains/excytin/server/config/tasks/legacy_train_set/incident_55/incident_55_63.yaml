tasks:
  - task_id: incident_55_legacy_train_set_task_63
    title: incident_55_legacy_train_set_task_63
    description: 'In a related alert, it was observed that a user was sending phishing emails internally, potentially indicating a compromised account. What is the name of the user whose account might have been compromised?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a recent multi-stage incident involving execution & collection on multiple endpoints, it was observed that email messages containing malicious URLs were delivered and later removed. The emails were sent to Santiago from a suspicious sender, potentially as part of an effort to compromise the organization. Note: This agianst on internal user phishing emails might be part of a larger attack campaign.'
      question: 'In a related alert, it was observed that a user was sending phishing emails internally, potentially indicating a compromised account. What is the name of the user whose account might have been compromised?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Lucas Grey'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Lucas Grey'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An email account with AadUserId `28058d92-fc24-4869-9231-6546a34b00f2` received an email with a malicious URL, which was later removed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The account `Lucas Grey` was observed sending phishing emails to recipients within the organization, indicating a potential account compromise.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
