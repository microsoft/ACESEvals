tasks:
  - task_id: incident_55_legacy_train_set_task_28
    title: incident_55_legacy_train_set_task_28
    description: 'Related to this alert, there was a detection of a potentially malicious URL click. Can you get the email of the user who clicked on the malicious URL?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent security incident involving suspicious system hardware discovery was detected where attackers might be gathering information about the target device or network for later attacks. During the investigation, it was identified that a script `powershell.exe` was executed on the host `mb-winclient`. Additionally, a process `svchost.exe` with Process ID `2880` was executed with command line options indicative of gathering system information. The account entity of interest has an AAD User ID: 2de70991-2799-4a95-b734-8e3df3a50118.'
      question: 'Related to this alert, there was a detection of a potentially malicious URL click. Can you get the email of the user who clicked on the malicious URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Lucas Grey@niseko.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Lucas Grey@niseko.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There was a suspicious system hardware discovery attempt by a user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A user with the email `Lucas Grey@niseko.alpineskihouse.co` clicked on a potentially malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
