tasks:
  - task_id: incident_55_legacy_train_set_task_25
    title: incident_55_legacy_train_set_task_25
    description: 'During the suspicious sequence of exploration activities, which executable file was used to run the windows commands, and when was it executed?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a security incident involving suspicious system hardware discovery on 2024-07-04, a file `svchost.exe` was executed with the command line `svchost.exe -k netsvcs -p -s winmgmt` and had a Process ID of 2880. Furthermore, a PowerShell script named `contosoadfsblatempcreds.ps1` was executed from `c:\script\`, associated with user ID `2de70991-2799-4a95-b734-8e3df3a50118` and was part of a user `pwilson` session. Attackers might be trying to gather information about the target device or network for later attacks.'
      question: 'During the suspicious sequence of exploration activities, which executable file was used to run the windows commands, and when was it executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Executable file: whoami.exe, Execution time: 2024-07-02t09:47:29.6970346'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Executable file: whoami.exe, Execution time: 2024-07-02t09:47:29.6970346'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious system hardware discovery was made using the process `powershell.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious sequence of exploration activities was performed using the process `whoami.exe` with Process ID `13812`, created on `2024-07-02t09:47:29.6970346z`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
