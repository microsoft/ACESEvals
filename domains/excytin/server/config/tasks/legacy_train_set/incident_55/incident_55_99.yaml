tasks:
  - task_id: incident_55_legacy_train_set_task_99
    title: incident_55_legacy_train_set_task_99
    description: 'During the recent incident, regarding email messages containing malicious URLs that were removed after delivery, can you provide the sender''s IP address of these emails?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving credential access and potential exfiltration was detected on host `mb-winclient`, linked to user `bjenkins`. Further investigation indicated that during this period, emails containing malicious URLs were delivered and removed. These activities may be related.'
      question: 'During the recent incident, regarding email messages containing malicious URLs that were removed after delivery, can you provide the sender''s IP address of these emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '119.36.50.193'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '119.36.50.193'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A process accessed the memory of the Local Security Authority Subsystem Service (lsass.exe) on 2024-07-04 to extract credentials associated with the user having AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'An email containing a malicious URL was sent from the IP address `119.36.50.193` on 2024-07-09 and later removed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
