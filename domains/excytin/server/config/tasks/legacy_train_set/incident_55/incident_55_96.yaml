tasks:
  - task_id: incident_55_legacy_train_set_task_96
    title: incident_55_legacy_train_set_task_96
    description: 'Can you identify the account name associated with the suspicious system hardware discovery activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A suspicious sequence of exploration activities was detected on the network where multiple instances of `whoami.exe` were executed with different command lines indicating potential reconnaissance activities by an attacker. The process IDs observed were 13812, 14260, and 1104, each running `whoami.exe` with various parameters to gather user information.'
      question: 'Can you identify the account name associated with the suspicious system hardware discovery activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bjenkins'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious sequence of exploration activities was conducted by the account `bjenkins`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious system hardware discovery was performed using the account `bjenkins`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
