tasks:
  - task_id: incident_55_legacy_train_set_task_45
    title: incident_55_legacy_train_set_task_45
    description: 'Who is the CIO involved in the suspected DCSync attack, and what is the name of the machine from which the replication request was sent?'
    inherit_shared: true
    initial_context:
      incident_context: 'Based on the security incident reported, there was a follow-up alert indicating suspicious activities involving sequences of window commands used to identify assets and plan lateral movements within the network. This was related to a suspected DCSync attack on 2024-07-10, where `Luciano Herrera` (CIO) on `MB-WINCLIENT` sent a replication request to MB-DC1.'
      question: 'Who is the CIO involved in the suspected DCSync attack, and what is the name of the machine from which the replication request was sent?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera, MB-WINCLIENT'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Luciano Herrera, MB-WINCLIENT'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user with SID `S-1-5-21-561436748-3867387497-1732241745-3701` received an email with a malicious URL which was later removed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
