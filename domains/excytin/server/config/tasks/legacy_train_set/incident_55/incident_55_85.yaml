tasks:
  - task_id: incident_55_legacy_train_set_task_85
    title: incident_55_legacy_train_set_task_85
    description: 'Can you identify the recipient of the email message that contained the malicious URL?'
    inherit_shared: true
    initial_context:
      incident_context: 'An alert was triggered on 2024-07-09 indicating that email messages containing a malicious URL were delivered and later removed. The sender of these emails was santiago@vnevado.alpineskihouse.co, with the sender IP address being 119.36.50.193. The malicious URL in the emails was https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/. Following this, on 2024-07-10, we detected that one of our users clicked on this malicious URL, resulting in a second alert.'
      question: 'Can you identify the recipient of the email message that contained the malicious URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Recipient: ???'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Recipient: ???'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The email account `bjenkins@niseko.alpineskihouse.co` received an email with a malicious URL, which was later removed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A potentially malicious URL `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked by one of the users.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
