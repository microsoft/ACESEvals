      incident_context: 'A security incident report indicates that a process scanned or dumped memory from the Local Security Authority Subsystem Service (lsass.exe) on the host `mb-winclient`, used by account `bjenkins`. This action can enable an attacker to extract sensitive credentials. The involved process was `powershell.exe`. Additionally, there was a suspicious registration of a system program as a service.'
