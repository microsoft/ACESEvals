    title: incident_55_legacy_train_set_task_52
    description: 'Related to this alert, there was a Windows executable file that was renamed and launched. Can you identify the account name associated with the system executable that was renamed and launched?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving suspicious exploration activities was detected. A process on host `mb-winclient` invoked a series of Windows commands using `powershell.exe`. This host relates to several accounts, including ''pwilson''. Some of the commands and processes identified include `powershell.exe c:\script\contosoadfsblatempcreds.ps1` and `whoami.exe /user`. The suspicious activity indicates that attackers may be attempting to identify valuable assets and coordinate lateral movement across the network.'
      question: 'Related to this alert, there was a Windows executable file that was renamed and launched. Can you identify the account name associated with the system executable that was renamed and launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'SYSTEM'
      scoring:
        max_score: 1.0
