tasks:
  - task_id: incident_134_legacy_train_set_task_11
    title: incident_134_legacy_train_set_task_11
    description: 'Can you identify the IP address involved with the BEC-related suspicious emails?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving a Password Spray attack was detected on 2024-07-18 from the IP address `170.54.121.63`. Password spray attacks typically involve attempting to gain unauthorized access to a large number of accounts using a few common passwords. This incident is linked to a suspicious email activity, believed to be related to a business email compromise (BEC) fraud attempt.'
      question: 'Can you identify the IP address involved with the BEC-related suspicious emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '237.7.81.122'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A password spray attack was detected involving the user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious emails related to a potential BEC fraud attempt were sent from the IP address `237.7.81.122`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
