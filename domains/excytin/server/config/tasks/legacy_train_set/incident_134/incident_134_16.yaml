tasks:
  - task_id: incident_134_legacy_train_set_task_16
    title: incident_134_legacy_train_set_task_16
    description: 'Can you find the email address of the account involved in the BEC financial fraud alert that was detected in a risky Azure Active Directory session?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent security incident involving a sign-in from a known malicious IP address `170.54.121.63` was detected, which happened during or around the time of a sign-in. This incident was part of a larger threat that could lead to business email compromise (BEC) financial fraud. Attackers might be attempting to conduct BEC by creating suspicious inbox rules that hide incoming email messages during risky Azure Active Directory sessions.'
      question: 'Can you find the email address of the account involved in the BEC financial fraud alert that was detected in a risky Azure Active Directory session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Nina Park@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There was a sign-in attempt from a known malicious IP address for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious inbox rule was created for the email account `Nina Park@vnevado.alpineskihouse.co`, indicating a potential BEC financial fraud attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
