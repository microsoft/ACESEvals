tasks:
  - task_id: incident_134_legacy_train_set_task_8
    title: incident_134_legacy_train_set_task_8
    description: 'There is a possible connection to a BEC financial fraud incident involving the creation of a suspicious inbox rule. Can you provide the name of the account involved in this BEC financial fraud?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a security investigation, it was identified that a sign-in was made from an anonymous IP address `170.54.121.63`. This access potentially indicates malicious activity since such IP addresses are commonly associated with anonymizers like Tor browser or VPNs.'
      question: 'There is a possible connection to a BEC financial fraud incident involving the creation of a suspicious inbox rule. Can you provide the name of the account involved in this BEC financial fraud?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Nina Park'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address for the user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session by the user `Nina Park`. This may indicate an attempt to conduct business email compromise (BEC) financial fraud.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
