    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was reported involving a Password Spray attack on an IP address `170.54.121.63`. Password spray attacks typically involve attackers attempting multiple passwords against many accounts, and this event indicates a potential compromise of user accounts. During this investigation, we observed some connections to other suspicious activities.'
