tasks:
  - task_id: incident_134_legacy_train_set_task_7
    title: incident_134_legacy_train_set_task_7
    description: 'Can you identify the malicious URL that was included in the email messages which were later removed after delivery?'
    inherit_shared: true
    initial_context:
      incident_context: ''
      question: 'Can you identify the malicious URL that was included in the email messages which were later removed after delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` had their inbox rules manipulated suspiciously, suggesting possible unauthorized access.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'An email containing the malicious URL `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/` was delivered and later removed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
