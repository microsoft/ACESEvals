tasks:
  - task_id: incident_134_legacy_train_set_task_6
    title: incident_134_legacy_train_set_task_6
    description: 'Can you identify the cloud application ID involved in the suspicious inbox manipulation rule incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'The incident started with BEC financial fraud and extended to a suspicious inbox manipulation rule, suggesting an attacker might have gained access to a user''s inbox for malicious purposes.'
      question: 'Can you identify the cloud application ID involved in the suspicious inbox manipulation rule incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '20893'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There was a creation of a suspicious inbox rule in the email account `Nina Park@vnevado.alpineskihouse.co` during a risky Azure Active Directory session, indicating a potential business email compromise (BEC) attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious manipulation of inbox rules was detected in cloud application with AppId `20893`, hinting at possible unauthorized access and data exfiltration.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
