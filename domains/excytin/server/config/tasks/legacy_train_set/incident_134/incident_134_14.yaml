tasks:
  - task_id: incident_134_legacy_train_set_task_14
    title: incident_134_legacy_train_set_task_14
    description: 'During the investigation, it was found that emails containing malicious URLs were delivered and later removed. Can you identify the primary address of the mailbox where these emails were delivered?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving Business Email Compromise (BEC) financial fraud was identified when a suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session. The incident involves an IP address `237.7.81.122`.'
      question: 'During the investigation, it was found that emails containing malicious URLs were delivered and later removed. Can you identify the primary address of the mailbox where these emails were delivered?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'raphaelt@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The email account `Nina Park` was involved in a suspicious activity where an inbox rule was created to hide incoming email messages, indicating potential BEC financial fraud.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The mailbox with the primary address `raphaelt@vnevado.alpineskihouse.co` received email messages containing a malicious URL which were later removed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
