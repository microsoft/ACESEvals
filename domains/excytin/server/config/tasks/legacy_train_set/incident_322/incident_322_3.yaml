tasks:
  - task_id: incident_322_legacy_train_set_task_3
    title: incident_322_legacy_train_set_task_3
    description: 'Can you determine the SID (Security Identifier) of the account that accessed the link in the email which was subsequently quarantined by ZAP?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was triggered when a connection from IP address 231.60.52.209 (host ''vnevado-win11h.vnevado.alpineskihouse.co'') to URL `login.micro.demo.antoinetest.ovh` was detected in proxy logs. Subsequently, it was reported that a malicious URL was clicked on a device. The incident continued with a user accessing a link in an email that was later quarantined by zero-hour auto purge (ZAP) based on a Microsoft Defender for Office 365 alert.'
      question: 'Can you determine the SID (Security Identifier) of the account that accessed the link in the email which was subsequently quarantined by ZAP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840151686-3534835288-156286563-1127'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-1-5-21-1840151686-3534835288-156286563-1127'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The host `vnevado-win11h` made a connection to a suspicious URL `login.micro.demo.antoinetest.ovh` identified in proxy logs.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The user account `Hailey Johnson` clicked on a malicious URL on the device `vnevado-win11h`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'The user with SID `S-1-5-21-1840151686-3534835288-156286563-1127` accessed a link in an email that was later quarantined by zero-hour auto purge (ZAP).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
