    inherit_shared: true
    initial_context:
      incident_context: 'During a recent security investigation, we identified multiple suspicious activities involving various endpoints and alerts. Initially, a connection from IP `231.60.52.209` - `vnevado-win11h.vnevado.alpineskihouse.co` to a malicious URL `login.micro.demo.antoinetest.ovh` was detected in proxy logs. This raised concerns about potential unauthorized access or malicious activities on the affected system.'
