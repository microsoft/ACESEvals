    title: incident_322_legacy_train_set_task_10
    description: 'During the investigation, we found that attackers might be using Ntdsutil to gather information for persistence or lateral movement. What was the name of the extracted file used in this process?'
    inherit_shared: true
    initial_context:
      incident_context: ''
      question: 'During the investigation, we found that attackers might be using Ntdsutil to gather information for persistence or lateral movement. What was the name of the extracted file used in this process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
