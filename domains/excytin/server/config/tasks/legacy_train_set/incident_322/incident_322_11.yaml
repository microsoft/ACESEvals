tasks:
  - task_id: incident_322_legacy_train_set_task_11
    title: incident_322_legacy_train_set_task_11
    description: 'What was the malicious URL that the user accessed from the email that was later quarantined by ZAP?'
    inherit_shared: true
    initial_context:
      incident_context: 'In a recent event on 2024-08-01, an email containing a malicious URL was sent from `raphaelt@vnevado.alpineskihouse.co` to `alyssat@vnevado.alpineskihouse.co`. The email was later removed after delivery due to its malicious content. Subsequently, a user accessed a link from an email which was later quarantined by zero-hour auto purge (ZAP). This raised a Microsoft Defender for Office 365 alert.'
      question: 'What was the malicious URL that the user accessed from the email that was later quarantined by ZAP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user with SID `S-1-5-21-1840151686-3534835288-156286563-1127` received an email containing a malicious URL, which was subsequently removed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The user accessed the link `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` in an email that was later quarantined by zero-hour auto purge (ZAP).'
        objective: Identify key details related to the potential compromise that might
