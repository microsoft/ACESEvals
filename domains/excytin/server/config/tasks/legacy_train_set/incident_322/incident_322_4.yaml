    description: 'Can you identify the Azure resource that was involved in the suspicious operation from the proxy IP address?'
    inherit_shared: true
    initial_context:
      incident_context: 'We observed a recent security incident involving a user clicking on a potentially malicious URL. This was followed by the removal of email messages containing the malicious URL after delivery. As part of the incident investigation, it was detected that a resource management operation was performed from a suspicious IP address through a proxy service by using the Azure Resource Manager.'
      question: 'Can you identify the Azure resource that was involved in the suspicious operation from the proxy IP address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.compute/virtualmachines/vnevado-dc'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.compute/virtualmachines/vnevado-dc'
