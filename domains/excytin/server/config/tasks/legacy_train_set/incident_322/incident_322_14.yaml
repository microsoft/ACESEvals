tasks:
  - task_id: incident_322_legacy_train_set_task_14
    title: incident_322_legacy_train_set_task_14
    description: 'Related to this malicious URL, an email message containing it was delivered and later removed. Can you identify the sender of this email?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving a suspicious click on a malicious URL, `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`, was reported. The click was made on the device named `vnevado-win11h` with the IP `172.33.118.200`. This activity involved the executable `msedge.exe` with a specific process ID `4256` created at the given time.'
      question: 'Related to this malicious URL, an email message containing it was delivered and later removed. Can you identify the sender of this email?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'raphaelt@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The email account `raphaelt@vnevado.alpineskihouse.co` sent an email with a malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The user `Hailey Johnson` clicked on the malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
