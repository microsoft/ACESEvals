tasks:
  - task_id: incident_322_legacy_train_set_task_6
    title: incident_322_legacy_train_set_task_6
    description: 'Can you identify the email recipient who clicked on the potentially malicious URL recently?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a suspicious Azure Resource Management (ARM) activity documented on 2024-08-01, we noted an IP address `253.1.244.215` linked with risky user actions. There were also email messages containing a malicious URL that were delivered and later removed. Evidence suggests this may involve a user clicking on a potentially malicious URL identified in the same timeframe.'
      question: 'Can you identify the email recipient who clicked on the potentially malicious URL recently?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'alyssat@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious ARM activities were performed by a user account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` that logged into a risky session.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The email recipient `alyssat@vnevado.alpineskihouse.co` received emails with malicious URLs which were later removed.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
