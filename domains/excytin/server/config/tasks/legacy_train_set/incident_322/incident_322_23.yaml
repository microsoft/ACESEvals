    title: incident_322_legacy_train_set_task_23
    description: 'Following this incident, an Azure Resource Manager operation was detected from a suspicious proxy IP address. Can you identify the Subscription ID involved in this suspicious activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was reported where a user accessed a link in an email that was subsequently quarantined by zero-hour auto purge (ZAP). This alert triggers further investigations as it could indicate potential malicious activities. The link accessed by the user was `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`.'
      question: 'Following this incident, an Azure Resource Manager operation was detected from a suspicious proxy IP address. Can you identify the Subscription ID involved in this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '7e838342-601f-4552-9baf-0dfb300cf555'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '7e838342-601f-4552-9baf-0dfb300cf555'
      scoring:
        max_score: 1.0
