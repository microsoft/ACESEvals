tasks:
  - task_id: incident_322_legacy_train_set_task_19
    title: incident_322_legacy_train_set_task_19
    description: 'What is the IP address associated with the suspicious Azure Resource Management activities performed by Hailey Johnson?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving suspicious Azure Resource Management (ARM) activities by a risky user Hailey Johnson was flagged. The user signed in to a risky session according to a Microsoft Defender for Cloud alert related to ARM and Microsoft Entra ID Protection risk scores.'
      question: 'What is the IP address associated with the suspicious Azure Resource Management activities performed by Hailey Johnson?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '253.1.244.215'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There are suspicious Azure Resource Management activities performed by a risky user from IP address `253.1.244.215`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
