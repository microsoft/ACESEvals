    title: incident_166_legacy_train_set_task_29
    description: 'What is the IP address associated with the suspicious inbox rule created during the BEC financial fraud incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident involving possible BEC financial fraud was identified. Suspicious events with business email compromise (BEC) characteristics were observed involving the user account Jordan P whose email is JordanP@vnevado.alpineskihouse.co. This incident might indicate that an attacker is attempting to conduct a fraud attack against the organization.'
      question: 'What is the IP address associated with the suspicious inbox rule created during the BEC financial fraud incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '255.246.85.58'
      scoring:
        max_score: 1.0
