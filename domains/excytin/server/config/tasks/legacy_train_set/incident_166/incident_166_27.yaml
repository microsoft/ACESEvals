tasks:
  - task_id: incident_166_legacy_train_set_task_27
    title: incident_166_legacy_train_set_task_27
    description: 'Which user account was identified as suspicious and sending BEC-related emails?'
    inherit_shared: true
    initial_context:
      incident_context: 'An anonymous sign-in was detected from the IP address `95.202.65.202` at 2024-07-22 08:45:32.664841+00:00. This could have been done using tools like the Tor browser or anonymizer VPNs. There is an ongoing investigation related to BEC (business email compromise) fraud attempts.'
      question: 'Which user account was identified as suspicious and sending BEC-related emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious emails were sent by the account `Jordan P`, likely as part of a business email compromise (BEC) fraud attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
