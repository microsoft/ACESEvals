    title: incident_166_legacy_train_set_task_3
    description: 'What is the AppId of the cloud application that was used when the suspicious inbox manipulation rule was set in the user''s mailbox?'
    inherit_shared: true
    initial_context:
      incident_context: 'In a recent security incident, a suspicious SAP authentication was detected where a user account with a risky sign-in alert in Microsoft Entra ID accessed SAP. This might indicate that an attacker has taken control of the user account, potentially searching SAP for sensitive financial information to use in later stages of an attack, such as phishing or social engineering. The suspicious activity originated from the IP address `107.253.5.27`, using the cloud application with AppId `100`.'
      question: 'What is the AppId of the cloud application that was used when the suspicious inbox manipulation rule was set in the user''s mailbox?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '11161'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '11161'
      scoring:
        max_score: 1.0
