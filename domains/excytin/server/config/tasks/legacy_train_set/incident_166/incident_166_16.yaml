tasks:
  - task_id: incident_166_legacy_train_set_task_16
    title: incident_166_legacy_train_set_task_16
    description: 'Related to this alert, there is a suspicious SAP authentication involving a risky sign-in. Can you get the AppId for the cloud application involved in the suspicious SAP authentication?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was detected involving suspicious inbox manipulation rules indicating potential unauthorized access to a user''s inbox. The attacker''s IP address `255.246.85.58` was identified, and they possibly manipulated the user''s inbox rules to delete or move messages or folders. The AppId for the cloud application involved is `20893`. In connection with this incident, there was also a suspicious SAP authentication involving a risky sign-in, which might have involved the same attacker.'
      question: 'Related to this alert, there is a suspicious SAP authentication involving a risky sign-in. Can you get the AppId for the cloud application involved in the suspicious SAP authentication?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '100'
      scoring:
        max_score: 1.0
