tasks:
  - task_id: incident_166_legacy_train_set_task_9
    title: incident_166_legacy_train_set_task_9
    description: 'Related to this incident, the attacker might be attempting a business email compromise (BEC) financial fraud. Can you provide the email of the user whose inbox rules were suspiciously manipulated in a risky Azure Active Directory session?'
    inherit_shared: true
    initial_context:
      incident_context: 'A user''s inbox rules were manipulated in a suspicious manner, indicating that an attacker might be trying to exfiltrate data by deleting or moving messages. This incident involved a cloud application with the AppId `20893`.'
      question: 'Related to this incident, the attacker might be attempting a business email compromise (BEC) financial fraud. Can you provide the email of the user whose inbox rules were suspiciously manipulated in a risky Azure Active Directory session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The email account `Jordan P` had their inbox rules manipulated in a suspicious manner.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session for the email `Jordan P@vnevado.alpineskihouse.co`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
