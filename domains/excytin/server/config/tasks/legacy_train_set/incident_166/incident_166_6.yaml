    title: incident_166_legacy_train_set_task_6
    description: 'During this incident, there was also suspicious manipulation of a user''s inbox rules. Can you identify the IP address associated with the suspicious inbox manipulation rule?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was detected involving an anonymous sign-in from IP address `192.238.237.190`. Such sign-ins often involve the use of tools like Tor browser or anonymizer VPNs to mask the user''s identity. It''s crucial to determine if any further suspicious activities are linked to this sign-in.'
      question: 'During this incident, there was also suspicious manipulation of a user''s inbox rules. Can you identify the IP address associated with the suspicious inbox manipulation rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '255.246.85.58'
      scoring:
        max_score: 1.0
