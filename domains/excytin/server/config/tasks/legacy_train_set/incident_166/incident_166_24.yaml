tasks:
  - task_id: incident_166_legacy_train_set_task_24
    title: incident_166_legacy_train_set_task_24
    description: 'Related to this incident, there are notorious events indicating business email compromise (BEC). Who is the account implicated in this possible fraud attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident was identified involving a sign-in from an anonymous IP address `192.238.237.190` on 2024-07-22. Such sign-ins could be using anonymizers like Tor browser or VPNs. This was flagged as potentially suspicious access to our systems.'
      question: 'Related to this incident, there are notorious events indicating business email compromise (BEC). Who is the account implicated in this possible fraud attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There was a sign-in from an anonymous IP address to the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'There were suspicious events with business email compromise characteristics involving the account `Jordan P`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
