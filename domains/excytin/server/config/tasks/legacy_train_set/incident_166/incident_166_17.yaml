tasks:
  - task_id: incident_166_legacy_train_set_task_17
    title: incident_166_legacy_train_set_task_17
    description: 'Can you identify the email address of the account that was likely targeted in the possible BEC financial fraud?'
    inherit_shared: true
    initial_context:
      incident_context: 'A Password Spray attack was detected from IP address `95.202.65.202` on 2024-07-23 14:23:51.925093+00:00. This indicates a possible attempt by an attacker to gain unauthorized access to multiple accounts by trying common passwords. During the same incident, suspicious events with characteristics of a Business Email Compromise (BEC) were observed, which suggest an attacker might be conducting a Fraud attack against the organization.'
      question: 'Can you identify the email address of the account that was likely targeted in the possible BEC financial fraud?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
