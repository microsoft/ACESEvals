tasks:
  - task_id: incident_166_legacy_train_set_task_7
    title: incident_166_legacy_train_set_task_7
    description: 'Can you identify the name of the user account involved in the suspicious SAP authentication?'
    inherit_shared: true
    initial_context:
      incident_context: 'A password spray attack was detected originating from IP address `95.202.65.202`. This attack is part of a broader security incident. A password spray attack is often used to attempt a large number of passwords against a list of usernames to identify valid credential combinations. It was connected to a suspicious SAP authentication event where a user account with a risky sign-in alert in Microsoft Entra ID signed in to SAP. This user account may have been compromised to search through sensitive SAP financial information.'
      question: 'Can you identify the name of the user account involved in the suspicious SAP authentication?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A password spray attack was detected for the Azure Active Directory user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious SAP authentication was detected for the user account named `Jordan P`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
