tasks:
  - task_id: incident_166_legacy_train_set_task_15
    title: incident_166_legacy_train_set_task_15
    description: 'The suspicious SAP authentication alert indicates that a user may have signed in from a risky IP address. Can you find the IP address from which this suspicious sign-in to SAP occurred?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security incident indicating Possible BEC financial fraud was observed, where suspicious events with business email compromise characteristics were noted. The flagged user account belongs to Jordan P with email `Jordan P@vnevado.alpineskihouse.co`. There might be an attempt to conduct a fraud attack against the organization. As part of investigating this incident, we need to look into any risky sign-in alerts that might have been triggered.'
      question: 'The suspicious SAP authentication alert indicates that a user may have signed in from a risky IP address. Can you find the IP address from which this suspicious sign-in to SAP occurred?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.253.5.27'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'There is a possible business email compromise attempt involving the account `Jordan P`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious SAP authentication occurred from the IP address `107.253.5.27` where the attacker might have controlled a user account to search or modify sensitive financial information.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
