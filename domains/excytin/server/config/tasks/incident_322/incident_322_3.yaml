tasks:
  - task_id: incident_322_task_21
    title: incident_322_task_21
    description: "During this investigation, what is the name of the Azure resource group involved in the suspicious Azure Resource Manager operation?"

    inherit_shared: true

    initial_context:
      incident_context: "A suspicious credential dump from NTDS.dit has been detected. Attackers might be trying to obtain user's credentials stored in the domain controller. During the same multi-stage incident, it was noted that a file named `ntdsutil.exe` was executed, along with another process `powershell.exe` with an encoded command. Further investigation led to a connection involving suspicious Azure Resource Manager operations originating from a proxy IP address."
      question: "During this investigation, what is the name of the Azure resource group involved in the suspicious Azure Resource Manager operation?"

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - "ctfcat"
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: "There is a suspicious credential dump from NTDS.dit detected on the host `vnevado-dc`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: "There is an Azure Resource Manager operation detected from a suspicious proxy IP address, and it's associated with the Resource Group `ctfcat`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
