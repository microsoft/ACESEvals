      strategy: static
      criteria:
        expected_answers:
        - "/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.devtestlab/schedules/shutdown-computevm-vnevado-dc"
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: "The email account `Hailey Johnson@vnevado.alpineskihouse.co` received an email with a malicious URL which was later removed."
