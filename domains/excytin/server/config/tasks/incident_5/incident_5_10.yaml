tasks:
  - task_id: incident_5_task_91
    title: incident_5_task_91
    description: During the ransomware attack incident on `vnevado-win11u`, a process
      was used to delete all file snapshots and shadow copies via WMI or VSSAdmin. Can
      you identify the name of this process?

    sandbox_environment: excytin_sandbox

    initial_context:
      incident_context: A ransomware payload was remotely launched on the device with
        hostname `vnevado-win11u` and IP address `99.83.111.100`. The attackers might
        be attempting to encrypt content on this device, rendering it unusable to users.
        It is crucial to note that this is indicative of a potential ransomware attack,
        and further information can be found in the Threat Analytics report provided.
      question: During the ransomware attack incident on `vnevado-win11u`, a process
        was used to delete all file snapshots and shadow copies via WMI or VSSAdmin.
        Can you identify the name of this process?

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - vssblatemp.exe
      scoring:
        max_score: 1.0
    subtasks:
    - subtask_id: checkpoint_1
      title: Checkpoint 1
      description: The ransomware payload was remotely launched for the account `dp5hn`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_2
      title: Checkpoint 2
      description: File backups were deleted by the process `vssblatemp.exe` which is
        common during a ransomware infection.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

