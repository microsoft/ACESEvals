  - task_id: incident_5_task_93
    title: incident_5_task_93
    description: What is the name of the file that is associated with the ransomware-like
      behavior?

    sandbox_environment: excytin_sandbox

    initial_context:
      incident_context: A security incident involving ransomware-like behavior impacting
        several devices has been observed. Initial detection included the use of PsExec
        to launch a command on a remote device, suggesting lateral movement using this
        tool. This was followed by suspicious activities leading to compromised assets
        exhibiting ransomware-like behavior. The attacker might be using the specified
        user account, IP, or device to infect multiple devices with ransomware. Automated
        remediation actions were considered to address the threat.
      question: What is the name of the file that is associated with the ransomware-like
        behavior?

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - ponceau.7z
      scoring:
        max_score: 1.0
    subtasks:
    - subtask_id: checkpoint_1
      title: Checkpoint 1
      description: An attacker used the account `tgs2z` to launch a command on a remote
        device via PsExec.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_2
      title: Checkpoint 2
      description: There was a lateral movement to the jump server with IP address `99.83.111.100`
        using PsExec.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_3
      title: Checkpoint 3
      description: A file named `ponceau.7z` is associated with ransomware-like behavior,
        indicating potentially compromised assets.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

  - task_id: incident_5_task_94
    title: incident_5_task_94
    description: During this investigation, it was also noted that a user account was
      dropping a ransomware-related file on several devices. Can you identify the name
      of the ransomware-related file?

    sandbox_environment: excytin_sandbox

    initial_context:
      incident_context: As part of a security incident involving the Manatee Tempest
        activity group, a URL `vectorsandarrows.com` was accessed from the host `vnevado-win11u`
        using the command `curl http://vectorsandarrows.com`, initiated by process ID
        5572 associated with IP address `198.43.121.209`. The actor Manatee Tempest
        is known for utilizing various methods like drive-by downloads and domain fronting
        to establish command-and-control channels, and is linked with ransomware deployments
        facilitated by Mustard Tempest.
      question: During this investigation, it was also noted that a user account was
        dropping a ransomware-related file on several devices. Can you identify the
        name of the ransomware-related file?

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - characterical.zip.lockbit
      scoring:
        max_score: 1.0
    subtasks:
    - subtask_id: checkpoint_1
      title: Checkpoint 1
      description: The user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`
        is associated with activity from the Manatee Tempest group, known for its cybercriminal
        activities and partnerships.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_2
      title: Checkpoint 2
      description: A possible compromised user account is observed dropping a ransomware-related
        file named `characterical.zip.lockbit` on several devices, indicating potential
        lateral movement and infection attempts across the network.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

