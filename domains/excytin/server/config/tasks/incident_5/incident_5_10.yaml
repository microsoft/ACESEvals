  - task_id: incident_5_task_96
    title: incident_5_task_96
    description: What is the process ID and command line of the process that was used
      in the possible attempt to access the Primary Refresh Token (PRT)?

    sandbox_environment: excytin_sandbox

    initial_context:
      incident_context: A security incident involving potentially compromised assets
        exhibiting ransomware-like behavior was detected, with the malicious presence
        identified through specific files `get-userprttoken.ps1`, `characterical.zip`,
        and `characterical.zip.lockbit` from IP address `99.83.111.100` and user account
        `S-0-6-5`. This activity may allow attackers to move laterally across the network
        and infect multiple devices with ransomware. Automated remediation action might
        be taken to disable the account or device the attacker used related to this
        incident. There is also an indication of a possible attempt to access a Primary
        Refresh Token (PRT) reported.
      question: What is the process ID and command line of the process that was used
        in the possible attempt to access the Primary Refresh Token (PRT)?

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - 'Process Id: 7036, Command Line: "browsercore.exe"'
      scoring:
        max_score: 1.0
    subtasks:
    - subtask_id: checkpoint_1
      title: Checkpoint 1
      description: There is ransomware-like behavior detected on the host `vnevado-win11t`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_2
      title: Checkpoint 2
      description: There was a possible attempt to access a Primary Refresh Token using
        the process `browsercore.exe` with the command line `browsercore.exe` at `2024-06-20t09:29:49.304018z`,
        with Process ID `7036`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

