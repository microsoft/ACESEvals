tasks:
  - task_id: incident_5_task_41
    title: incident_5_task_41
    description: During this investigation, a potentially compromised user account was
      identified. Can you provide the SID of the user account that may be operating
      with ransomware-like behavior?

    inherit_shared: true
    initial_context:
      incident_context: During a recent security investigation, it was found that a
        malicious credential theft tool `mimikatz.exe` was executed with the process
        ID 4464 on 2024-06-20 at 09:03:04.6442161, originating from IP address `107.224.99.179`.
        The command line included attempts to leverage credentials from the domain `vnevado.alpineskihouse.co`.
        This execution was flagged on 2024-07-04 at 22:35:03.869406+00:00 for its intent
        to dump user credentials. Subsequently, there was a lateral movement attempt
        to the jump server `Vnevado-jump` on 2024-07-10 at 11:24:45.260113+00:00.
      question: During this investigation, a potentially compromised user account was
        identified. Can you provide the SID of the user account that may be operating
        with ransomware-like behavior?

    submission_evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - S-1-5-21-1840191660-8534830288-125585561-1522
      scoring:
        max_score: 1.0

    subtasks:
    - subtask_id: checkpoint_1
      title: Checkpoint 1
      description: A known credential theft tool execution command was detected on the
        account with the name `tgs2z`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_2
      title: Checkpoint 2
      description: Lateral movement to the jump server `Vnevado-jump` was performed
        from the IP address `99.83.111.100`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_3
      title: Checkpoint 3
      description: The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`
        was exhibiting ransomware-like behavior, impacting several devices.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

  - task_id: incident_5_task_42
    title: incident_5_task_42
    description: Following this incident, 'CommandAndControl' malware was detected on
      another device during lateral movement. What is the AadDeviceId of this affected
