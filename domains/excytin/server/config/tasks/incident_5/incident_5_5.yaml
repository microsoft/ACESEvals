  - task_id: incident_5_task_45
    title: incident_5_task_45
    description: Can you provide the command line details of the suspicious WMI process
      observed on the machine?

    inherit_shared: true
    initial_context:
      incident_context: A security incident involving the Manatee Tempest activity group
        was reported. This Russia-based cybercriminal group, which has been active since
        June 2014, is known for malware campaigns including the Dridex banking trojan.
        They often gain initial access through methods such as drive-by downloads and
        malvertising, facilitated by their partnership with Mustard Tempest. As part
        of this security incident, a suspicious WMI process creation was observed on
        the machine `vnevado-win10r`, which might be an indicator of malware using WMI
        to spawn new processes and further infect the machine.
      question: Can you provide the command line details of the suspicious WMI process
        observed on the machine?

    submission_evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - 7332__2024-06-20t09:32:01.3894288z__bcdedit /set bootstatuspolicy ignoreallfailures
      scoring:
        max_score: 1.0

    subtasks:
    - subtask_id: checkpoint_1
      title: Checkpoint 1
      description: The Russia-based cybercriminal group Manatee Tempest is involved
        in an activity targeting an account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_2
      title: Checkpoint 2
      description: A suspicious WMI process creation was observed with Process ID `7332`
