        HostName `vnevado-win10s` and AadDeviceId `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`,
        where the process `browsercore.exe` (ProcessId `2676` created at `2024-06-20T09:10:59.867384Z`)
        was running. Attackers may use this to move laterally within the organization.
      question: Following this incident, 'CommandAndControl' malware was detected on
        another device during lateral movement. What is the AadDeviceId of this affected
        device?

    submission_evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - bc00e484-d0e5-4da4-9472-95568cccc07e
      scoring:
        max_score: 1.0

    subtasks:
