    description: "A related alert indicates suspicious activity involving PowerShell to download a file or run an encoded command. Can you identify the process that was used in this suspicious activity?"

    inherit_shared: true

    initial_context:
      incident_context: "A security incident involving an anomalous scheduled task was created on a device using `schtasks.exe`. This incident could be used by an attacker to obtain persistence on the device. The command involved in this alert was: `schtasks.exe /create /sc once /tn yrei /tr \"c:\\users\\samuelf\\onedrive - (new) alpineskihouse\\desktop\\winatp-intro-backdoor.exe\" /st 11:58 /f`. This suggests that the attacker may be trying to gain persistence by scheduling the execution of a potentially malicious executable."
      question: "A related alert indicates suspicious activity involving PowerShell to download a file or run an encoded command. Can you identify the process that was used in this suspicious activity?"

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - "winword.exe"
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: "An anomalous scheduled task was created using `powershell.exe`, which might be used by an attacker to obtain persistence on the device."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
      - subtask_id: checkpoint_2
