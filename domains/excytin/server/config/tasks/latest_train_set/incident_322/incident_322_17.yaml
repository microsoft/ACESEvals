tasks:
  - task_id: incident_322_latest_train_set_task_17
    title: incident_322_latest_train_set_task_17
    description: 'According to the alert that fired when the malicious URL was clicked, what IP address was assigned to the device that accessed the link?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, security detected that an email containing the URL "dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io" was delivered to and later removed from the mailbox "alyssat@vnevado.alpineskihouse.co". The sender was "raphaelt@vnevado.alpineskihouse.co" and the sender’s IP was 202.205.215.225. Shortly after, the same malicious URL was clicked on a workstation, triggering a separate alert titled "Malicious URL was clicked on that device."'
      question: 'According to the alert that fired when the malicious URL was clicked, what IP address was assigned to the device that accessed the link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '172.33.118.200'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'account.Email: `Hailey Johnson@vnevado.alpineskihouse.co` – An email containing a malicious URL was delivered to (and later removed from) this mailbox.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'ip.Address: `172.33.118.200` – A device using this IP address subsequently clicked on the malicious URL, showing that the threat progressed to the endpoint.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
