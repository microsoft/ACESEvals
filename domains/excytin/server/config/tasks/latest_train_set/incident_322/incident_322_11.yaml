tasks:
  - task_id: incident_322_latest_train_set_task_11
    title: incident_322_latest_train_set_task_11
    description: 'According to the alert "A potentially malicious URL click was detected", which email address was listed as the recipient of the malicious message?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an ongoing investigation, we observed that a user clicked on the URL "https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/" contained in an email that was later quarantined by Zero-hour Auto Purge (ZAP). Shortly before that, Microsoft Defender for Office 365 removed several emails carrying this same malicious link. A follow-up alert titled "A potentially malicious URL click was detected" was raised to indicate that one of the recipients actually clicked the link.'
      question: 'According to the alert "A potentially malicious URL click was detected", which email address was listed as the recipient of the malicious message?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'alyssat@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account.Name = ''Hailey Johnson'' accessed a link in an email that was later quarantined by Zero-hour Auto Purge (ZAP).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'MailMessage.Recipient = ''alyssat@vnevado.alpineskihouse.co'' received an email containing a malicious URL that was removed after delivery.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'MailMessage.Recipient = ''alyssat@vnevado.alpineskihouse.co'' was also involved in a detected click on a potentially malicious URL.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
