    description: 'What is the email address of the recipient whose message was involved in the "potentially malicious URL click" alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we observed suspicious Azure Resource Management (ARM) activity from the IP address 253.1.244.215. Shortly after, security controls flagged and removed several email messages that had contained malicious links. One of those links was clicked by a user, triggering a "potentially malicious URL click" alert. You need to confirm which mailbox was involved in that click event.'
      question: 'What is the email address of the recipient whose message was involved in the "potentially malicious URL click" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
