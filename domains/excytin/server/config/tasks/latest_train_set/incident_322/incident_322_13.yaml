tasks:
  - task_id: incident_322_latest_train_set_task_13
    title: incident_322_latest_train_set_task_13
    description: 'From which IP address did the risky session that triggered the "Suspicious Azure Resource Management activities" alert originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of an investigation, we discovered a malicious URL click from a user’s mailbox (alyssat@vnevado.alpineskihouse.co) that was blocked and subsequently removed. Shortly afterward, there was a follow-up security alert regarding potentially suspicious Azure Resource Management (ARM) activity performed by a risky user session. We want to confirm from which IP address this risky session originated.'
      question: 'From which IP address did the risky session that triggered the "Suspicious Azure Resource Management activities" alert originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '253.1.244.215'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A potentially malicious URL was clicked by the mail message recipient (Field: Recipient, Value: `alyssat@vnevado.alpineskihouse.co`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'An email that contained this malicious URL was later removed from the mailbox belonging to the account (Field: Name, Value: `Hailey Johnson`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Suspicious Azure Resource Management activity was then observed coming from the IP address (Field: Address, Value: `253.1.244.215`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
