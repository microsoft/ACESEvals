tasks:
  - task_id: incident_322_latest_train_set_task_12
    title: incident_322_latest_train_set_task_12
    description: 'What is the display name of the user account responsible for the suspicious ARM activities described above?'
    inherit_shared: true
    initial_context:
      incident_context: 'A recent alert flagged suspicious Azure Resource Management (ARM) operations that were executed during a risky session. The operations originated from IP address 253.1.244.215 and were tied to a user whose security identifier (SID) is S-1-5-21-1840151686-3534835288-156286563-1127 and Azure AD object ID 5e5dd0bd-f7ed-4583-8e9e-52f91e31a360. Investigators now need to identify exactly which user account carried out these actions.'
      question: 'What is the display name of the user account responsible for the suspicious ARM activities described above?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Hailey Johnson'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Hailey Johnson'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious ARM activities were performed by risky user with Name `Hailey Johnson`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
