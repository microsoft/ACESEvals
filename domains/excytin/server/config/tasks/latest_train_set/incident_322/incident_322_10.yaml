tasks:
  - task_id: incident_322_latest_train_set_task_10
    title: incident_322_latest_train_set_task_10
    description: 'A follow-up alert titled "Suspicious Azure Resource Management activities by a risky user" was raised shortly afterward. According to that alert, from which IP address were the risky ARM operations performed?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of investigating suspicious Azure activity, a resource management operation on the VM ''vnevado-dc'' (subscription 7e838342-601f-4552-9baf-0dfb300cf555, resource group ''ctfcat'') was flagged because it originated from a proxy service. This indicates potential malicious activity attempting to hide its origin.'
      question: 'A follow-up alert titled "Suspicious Azure Resource Management activities by a risky user" was raised shortly afterward. According to that alert, from which IP address were the risky ARM operations performed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '253.1.244.215'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account Name: `Hailey Johnson` carried out an Azure Resource Manager operation that originated from a suspicious proxy-associated IP address (detected at 2024-08-01 13:09:13.222398+00:00).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'IP Address: `253.1.244.215` was later observed performing additional risky Azure Resource Management activities (detected at 2024-08-01 13:19:20.704658+00:00).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
