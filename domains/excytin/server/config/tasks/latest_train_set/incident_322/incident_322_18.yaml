    title: incident_322_latest_train_set_task_18
    description: 'What was the exact URL that the user clicked in the email which was subsequently quarantined by ZAP?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we observed suspicious Azure Resource Management (ARM) operations originating from the external IP 253.1.244.215. Additional pivoting on the same user session revealed that, a short time earlier, the user had clicked a link contained in an email message that was later quarantined by Zero-Hour Auto Purge (ZAP).'
      question: 'What was the exact URL that the user clicked in the email which was subsequently quarantined by ZAP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
