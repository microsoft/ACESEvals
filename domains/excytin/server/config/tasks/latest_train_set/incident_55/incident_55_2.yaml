tasks:
  - task_id: incident_55_latest_train_set_task_2
    title: incident_55_latest_train_set_task_2
    description: 'According to the alert “Suspicious sequence of exploration activities,” which Security Identifier (SID) is associated with the account that executed those discovery commands?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a suspicious access to the LSASS service was detected on an Azure AD-joined workstation (device ID 7661dfd4-218f-4016-8a87-66d68a7f098e). The activity was initiated from the PowerShell process (PID 12412) started by user a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0, shortly after LSASS (PID 760) was observed in memory. A collection of DLLs such as vaultcli.dll, cryptdll.dll, winscard.dll and hid.dll were also referenced during this period, suggesting credential-harvesting attempts. Immediately after this LSASS access, the security platform raised another alert titled “Suspicious sequence of exploration activities,” indicating that an attacker may have begun asset-discovery commands on the same host.'
      question: 'According to the alert “Suspicious sequence of exploration activities,” which Security Identifier (SID) is associated with the account that executed those discovery commands?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-2-5-21-571436798-3864380397-1837441745-3206'
      scoring:
        max_score: 1.0
    subtasks:
