        title: Checkpoint 1
        description: 'Step 1 – process.ExtractedFileName: The suspicious process `powershell.exe` accessed the LSASS service’s memory (2024-07-04 22:35:02 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
