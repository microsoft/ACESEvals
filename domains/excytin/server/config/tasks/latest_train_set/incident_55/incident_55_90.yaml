tasks:
  - task_id: incident_55_latest_train_set_task_90
    title: incident_55_latest_train_set_task_90
    description: 'According to the July 10 2024 alert about the malicious URL click, what is the primary email address of the mailbox associated with the user who clicked the link?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024, Microsoft Defender raised an alert titled “A malicious PowerShell Cmdlet was invoked on the machine.” The command line showed PowerShell running the script “contosoadfsblatempcreds.ps1” from the Downloads folder of user “bjenkins” on host “mb-winclient.” That activity is connected—through the same Azure AD identity—to another alert a few days later. On July 10 2024, an alert reported that the same user clicked a link that was later determined to be malicious.'
      question: 'According to the July 10 2024 alert about the malicious URL click, what is the primary email address of the mailbox associated with the user who clicked the link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bjenkins@niseko.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A malicious PowerShell Cmdlet was invoked by the account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, a potentially malicious URL was clicked from the mailbox with MailboxPrimaryAddress `bjenkins@niseko.alpineskihouse.co`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
