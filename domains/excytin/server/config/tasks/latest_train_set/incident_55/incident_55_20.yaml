    title: incident_55_latest_train_set_task_20
    description: 'According to the “Attempt to hide use of dual-purpose tool” alert triggered on 2024-07-06, what was the unexpected executable filename the attacker ran to conceal the dual-purpose tool?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation began after malicious emails were delivered to the mailbox of santiago@vnevado.alpineskihouse.co and were later removed. Evidence suggests the same user account was used to send an internal phishing campaign and run suspicious PowerShell commands from a compromised device. Shortly afterward, on 2024-07-06 an alert titled “Attempt to hide use of dual-purpose tool” was raised, indicating the attacker tried to disguise a well-known public utility by executing it under an unexpected filename.'
      question: 'According to the “Attempt to hide use of dual-purpose tool” alert triggered on 2024-07-06, what was the unexpected executable filename the attacker ran to conceal the dual-purpose tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
