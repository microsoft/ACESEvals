    title: incident_55_latest_train_set_task_69
    description: 'What is the OAuth application object ID (OAuthObjectId) of the "SimulandApp" instance to which Luciano Herrera added the suspicious credential?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an ongoing hands-on-keyboard attack, the Impacket toolkit was used to execute suspicious commands on the server "mb-adfs" under the account "gsmith". Shortly after, code-injection activity was detected, suggesting the attacker was attempting to hide malicious code inside a trusted process. Days later, investigators saw that user Luciano Herrera (pwilson@niseko.alpineskihouse.co) added a new password-type credential to an OAuth application named "SimulandApp"—a behavior that can signal preparation for later abuse of the cloud app.'
      question: 'What is the OAuth application object ID (OAuthObjectId) of the "SimulandApp" instance to which Luciano Herrera added the suspicious credential?'
