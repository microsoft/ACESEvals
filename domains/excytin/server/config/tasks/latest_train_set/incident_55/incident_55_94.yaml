    description: 'For the "Suspicious LDAP query" alert that followed the renamed-executable activity, what is the Azure AD user ID (AadUserId) of the account that executed the query?'
    inherit_shared: true
    initial_context:
      incident_context: 'On host "mb-adfs" a suspicious file named "iy2orr1e.rrg.exe" (a renamed Windows executable) was launched under the SYSTEM account using a Base-64 encoded PowerShell command. This behaviour triggered the alert "System executable renamed and launched" because attackers often rename built-in executables to evade detection. Only a couple of seconds later another alert was raised: "Suspicious LDAP query", indicating possible directory reconnaissance that could leverage information gathered by the earlier process launch.'
      question: 'For the "Suspicious LDAP query" alert that followed the renamed-executable activity, what is the Azure AD user ID (AadUserId) of the account that executed the query?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
