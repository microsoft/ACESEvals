tasks:
  - task_id: incident_55_latest_train_set_task_80
    title: incident_55_latest_train_set_task_80
    description: 'According to the Impacket-related alert that occurred moments before the exploration sequence, what is the name of the executable file the attacker ran?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation on host "mb-winclient", the user account "bjenkins" was seen issuing reconnaissance commands such as "whoami.exe /user" shortly before 22:35 UTC on 2024-07-04. This activity triggered the alert "Suspicious sequence of exploration activities", suggesting the attacker was enumerating the system for later lateral movement. A closely-related alert, raised just two seconds earlier, warns of an "Ongoing hands-on-keyboard attack via Impacket toolkit", indicating that the adversary was actively executing commands from the compromised machine.'
      question: 'According to the Impacket-related alert that occurred moments before the exploration sequence, what is the name of the executable file the attacker ran?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:01.395957+00:00, an attacker-controlled Impacket session launched a file (Field: Name, Value: `powershell.exe`), marking the beginning of hands-on-keyboard activity for lateral movement.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'At 2024-07-04 22:35:03.197761+00:00, that same process (Field: ExtractedFileName, Value: `powershell.exe`) executed a suspicious sequence of Windows exploration commands, confirming post-compromise reconnaissance on the host.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
