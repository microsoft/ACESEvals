tasks:
  - task_id: incident_55_latest_train_set_task_54
    title: incident_55_latest_train_set_task_54
    description: 'Later in the same incident, an alert reported that a domain controller read the Directory Services DKM key associated with an ADFS object. What is the hostname of the machine that performed this read operation?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a recent incident, a suspicious LDAP query was executed from host "mb-winclient" by user "pwilson". The command line shows the script ldaprequest.ps1 being launched through powershell.exe, originating from the external IP address 72.5.72.208. This activity may indicate reconnaissance aimed at enumerating directory information.'
      question: 'Later in the same incident, an alert reported that a domain controller read the Directory Services DKM key associated with an ADFS object. What is the hostname of the machine that performed this read operation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'MB-DC1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` executed a suspicious LDAP query, indicating reconnaissance activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
