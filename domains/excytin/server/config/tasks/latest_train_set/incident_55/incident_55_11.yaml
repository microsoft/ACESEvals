tasks:
  - task_id: incident_55_latest_train_set_task_11
    title: incident_55_latest_train_set_task_11
    description: 'During the "Suspicious access to LSASS service" alert that followed the execution of the renamed binary, which DLL file was targeted in the attempt to access LSASS?'
    inherit_shared: true
    initial_context:
      incident_context: 'On the host "mb-adfs", a renamed executable "iy2orr1e.rrg.exe" was launched from a PowerShell command. This activity triggered the alert "System executable renamed and launched", suggesting an attempt to evade detection. Immediately after, another alert flagged a "Suspicious access to LSASS service", indicating that the attacker might be trying to extract credentials from memory.'
      question: 'During the "Suspicious access to LSASS service" alert that followed the execution of the renamed binary, which DLL file was targeted in the attempt to access LSASS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vaultcli.dll'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vaultcli.dll'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Process with ExtractedFileName `powershell.exe` was detected—indicating the renamed system executable was launched.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'File with Name `vaultcli.dll` was involved in suspicious access to LSASS service.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
