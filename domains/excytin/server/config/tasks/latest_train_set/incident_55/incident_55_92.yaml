    description: 'According to the follow-up alert about the suspicious exploration commands, what is the SID of the account that ran those commands?'
    inherit_shared: true
    initial_context:
      incident_context: 'At 22:35:01 UTC on 2024-07-04, an alert titled “System executable renamed and launched” was raised after a Windows executable was run under the built-in SYSTEM account (SID S-2-2-78). Only two seconds later, a follow-up alert, “Suspicious sequence of exploration activities,” indicated that a different user account executed a chain of reconnaissance commands, suggesting possible lateral-movement preparation.'
      question: 'According to the follow-up alert about the suspicious exploration commands, what is the SID of the account that ran those commands?'
