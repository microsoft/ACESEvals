    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-2-5-21-571436798-3864380397-1837441745-3206'
      scoring:
        max_score: 1.0
