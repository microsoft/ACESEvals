tasks:
  - task_id: incident_55_latest_train_set_task_34
    title: incident_55_latest_train_set_task_34
    description: 'What is the hostname of the device that accessed the AD FS DKM key, as reported in the "Suspected AD FS DKM key read" alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we noted that a malicious URL (https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/) was clicked from an endpoint, which later showed signs of system-hardware discovery activity. A few minutes after that, a “Suspected DCSync attack” alert reported that the workstation MB-WINCLIENT attempted directory-service replication. Shortly thereafter, another alert titled “Suspected AD FS DKM key read” indicated that a different device (a domain controller) accessed the AD FS Distributed Key Manager (DKM) key.'
      question: 'What is the hostname of the device that accessed the AD FS DKM key, as reported in the "Suspected AD FS DKM key read" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'MB-DC1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert shows a malicious URL was clicked on the device with HostName = `mb-winclient`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The same device then raised an alert for Suspicious System Hardware Discovery performed under the account with Sid = `S-1-5-21-551436448-9871687716-9837441745-1903`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
