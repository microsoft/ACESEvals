tasks:
  - task_id: incident_55_latest_train_set_task_27
    title: incident_55_latest_train_set_task_27
    description: 'According to the "Suspicious service creation" alert, which user account (provide the email address) created the service named "DDLOXJDSQSNGMUKKFUXQ" on host MB-ADFS?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of a suspicious service registration involving the binary "services.exe" (Process ID 764, created 2024-06-20 08:30:13 UTC), analysts noted that the same host later showed activity consistent with an ongoing hands-on-keyboard attack carried out with the Impacket toolkit. A few days after these events, another alert was raised for a newly created Windows service named "DDLOXJDSQSNGMUKKFUXQ" on the system "MB-ADFS". The alert indicates that this service was created by a specific user account, suggesting the attacker may have achieved persistence under that identity.'
      question: 'According to the "Suspicious service creation" alert, which user account (provide the email address) created the service named "DDLOXJDSQSNGMUKKFUXQ" on host MB-ADFS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'gsmith@niseko.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An alert showed that a system program was registered as a service on the host with HostName `mb-adfs`, indicating a possible attempt at persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
