tasks:
  - task_id: incident_55_latest_train_set_task_36
    title: incident_55_latest_train_set_task_36
    description: 'According to the "Suspicious LDAP query" alert that followed the Impacket activity, what is the name of the user account that executed the LDAP query?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of an ongoing hands-on-keyboard attack via the Impacket toolkit on host "mb-adfs", analysts observed a PowerShell command launched under the LocalSystem context (Process ID 6808) as well as activity involving "lsass.exe". Only a moment later, the system generated another alert titled "Suspicious LDAP query", indicating reconnaissance behavior aimed at enumerating directory information. The alert specifies that a particular user account issued the LDAP query, but the account name has not yet been confirmed.'
      question: 'According to the "Suspicious LDAP query" alert that followed the Impacket activity, what is the name of the user account that executed the LDAP query?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'pwilson'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Attackers employed Impacket, spawning a process with ExtractedFileName `powershell.exe` (process field: ExtractedFileName = `powershell.exe`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Soon after, an account with Name `pwilson` (account field: Name = `pwilson`) issued a suspicious LDAP query, suggesting reconnaissance activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
