tasks:
  - task_id: incident_55_latest_train_set_task_15
    title: incident_55_latest_train_set_task_15
    description: 'In the follow-up alert that reported a suspected AD FS DKM key read, what is the hostname of the domain controller that accessed the DKM key?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security monitoring recently flagged suspicious activity: the account pwilson@niseko.alpineskihouse.co (user "Luciano Herrera") unusually added a password-based credential to the OAuth application "SimulandApp" from the IPv6 address 2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3. Only seconds later, a separate alert showed this same user issuing a DCSync-style directory replication request from the workstation "MB-WINCLIENT" toward a domain controller, implying possible preparation for further directory compromise.'
      question: 'In the follow-up alert that reported a suspected AD FS DKM key read, what is the hostname of the domain controller that accessed the DKM key?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'MB-DC1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account with Sid `S-1-5-21-551436448-9871687716-9837441745-1903` added a password credential to the OAuth application ''SimulandApp'', which is considered unusual.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
