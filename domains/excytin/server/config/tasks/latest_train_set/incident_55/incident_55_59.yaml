        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:00.746663+00:00, a suspicious system hardware discovery was executed by the account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
