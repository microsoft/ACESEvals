tasks:
  - task_id: incident_55_latest_train_set_task_59
    title: incident_55_latest_train_set_task_59
    description: 'Identify the Azure AD user associated with the “Suspicious System Hardware Discovery” alert. What is the AadUserId of this account?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a possible credential-dumping attempt, analysts observed a “Suspicious access to LSASS service” alert on 2024-07-04 at 22:35 UTC. The process `lsass.exe` (PID 760) was seen loading several libraries such as `cryptdll.dll`, `hid.dll`, `winscard.dll`, and `vaultcli.dll`, which can indicate an attempt to extract clear-text passwords from LSASS memory. This alert is linked—through a common user account—to another event that occurred moments earlier on the same device: a “Suspicious System Hardware Discovery” alert, suggesting the attacker may have been performing reconnaissance after accessing sensitive credentials.'
      question: 'Identify the Azure AD user associated with the “Suspicious System Hardware Discovery” alert. What is the AadUserId of this account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2de70991-2799-4a95-b734-8e3df3a50118'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '2de70991-2799-4a95-b734-8e3df3a50118'
      scoring:
        max_score: 1.0
    subtasks:
