tasks:
  - task_id: incident_55_latest_train_set_task_31
    title: incident_55_latest_train_set_task_31
    description: 'Two days later, an alert titled "Attempt to hide use of dual-purpose tool" was generated for the same device. Under which unexpected executable filename was the public tool run in this later alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 our monitoring picked up a "Suspicious sequence of exploration activities" on host mb-winclient. The activity involved a PowerShell session (PID 12412) launched from the user’s Downloads folder and several follow-up commands such as whoami.exe. Because such command-line enumeration is often a prelude to lateral movement, the alert was flagged for further review.'
      question: 'Two days later, an alert titled "Attempt to hide use of dual-purpose tool" was generated for the same device. Under which unexpected executable filename was the public tool run in this later alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'iy2orr1e.rrg.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'iy2orr1e.rrg.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious reconnaissance was performed by the account (Field: Name, Value: gsmith).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
