tasks:
  - task_id: incident_55_latest_train_set_task_78
    title: incident_55_latest_train_set_task_78
    description: 'According to the final alert in this sequence ("Attempt to hide use of dual-purpose tool"), which user account was associated with that suspicious activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, analysts observed that the domain controller "MB-DC1" accessed an AD FS DKM key on 2024-07-10, triggering the alert "Suspected AD FS DKM key read". A series of related alerts followed the same threat path, and the final alert in this chain—raised on 2024-07-04 22:35:01 UTC—reported an attempt to hide the use of a dual-purpose tool on a machine.'
      question: 'According to the final alert in this sequence ("Attempt to hide use of dual-purpose tool"), which user account was associated with that suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'gsmith'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An attempt was made to hide a dual-purpose tool by the account with Name `gsmith` (account Name).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.2
            weight: 1.0
