tasks:
  - task_id: incident_55_latest_train_set_task_82
    title: incident_55_latest_train_set_task_82
    description: 'According to the related alert that followed this Impacket activity, which Windows process (file name) — commonly targeted for credential dumping — was observed running on the affected device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an ongoing hands-on-keyboard attack, a suspicious PowerShell command was executed through the Impacket toolkit on host "mb-adfs" under account "gsmith". The activity is indicative of lateral movement attempts within the network and is part of a broader incident flagged as "Ongoing hands-on-keyboard attack via Impacket toolkit." Analysts suspect the attacker may be attempting to access sensitive credentials after the initial network exploration.'
      question: 'According to the related alert that followed this Impacket activity, which Windows process (file name) — commonly targeted for credential dumping — was observed running on the affected device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lsass.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'lsass.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Ongoing hands-on-keyboard attack via Impacket toolkit shows suspicious execution of process with ExtractedFileName `lsass.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
