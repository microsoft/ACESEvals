tasks:
  - task_id: incident_55_latest_train_set_task_52
    title: incident_55_latest_train_set_task_52
    description: 'Identify the exact malicious URL that was contained in the emails subsequently removed, as reported by the 2024-07-07 08:54:40Z alert "Email messages containing malicious URL removed after delivery".'
    inherit_shared: true
    initial_context:
      incident_context: 'A "Sensitive credential memory read" alert was triggered on 2024-07-04 against host "mb-winclient" (device ID 7661dfd4-218f-4016-8a87-66d68a7f098e). The process "powershell.exe" (PID 12412) running under user account "bjenkins" accessed the memory of "lsass.exe", which may allow an attacker to dump authentication secrets. A few days later, additional mail-related alerts appeared, including an "Internal phishing campaign" originating from the same environment and, shortly after, an alert indicating that certain email messages containing a malicious URL were removed after delivery.'
      question: 'Identify the exact malicious URL that was contained in the emails subsequently removed, as reported by the 2024-07-07 08:54:40Z alert "Email messages containing malicious URL removed after delivery".'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A process accessed LSASS memory, and the involved user account had AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`, indicating possible credential theft.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, the compromised account with Email `Nina Sullivan@vnevado.alpineskihouse.co` began an internal phishing campaign from its device.'
        objective: Identify key details related to the potential compromise that might
