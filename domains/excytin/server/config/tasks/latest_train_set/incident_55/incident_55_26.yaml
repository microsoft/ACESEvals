tasks:
  - task_id: incident_55_latest_train_set_task_26
    title: incident_55_latest_train_set_task_26
    description: 'Which user account name was identified in the "Suspicious sequence of exploration activities" alert from 4 July 2024?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 9 2024, Microsoft 365 security signaled that an email containing a malicious URL (https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/) was sent from santiago@vnevado.alpineskihouse.co to an internal mailbox and subsequently removed after delivery. This e-mail activity is linked—through shared account identifiers—to an earlier endpoint alert raised on July 4 2024 for a "Suspicious sequence of exploration activities," where a compromised user appears to have executed a series of Windows discovery commands to map the environment.'
      question: 'Which user account name was identified in the "Suspicious sequence of exploration activities" alert from 4 July 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bjenkins'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Email messages containing a malicious URL were delivered to, and later removed from, the account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious sequence of exploration activities (multiple reconnaissance commands) was executed by the account with Name `bjenkins`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
