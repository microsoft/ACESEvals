tasks:
  - task_id: incident_55_latest_train_set_task_9
    title: incident_55_latest_train_set_task_9
    description: 'Subsequent analysis revealed an alert about an unusual addition of a password-type credential to an OAuth application. Which cloud application was involved in this suspicious credential addition?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, the domain controller named "MB-DC1" was observed reading the AD FS DKM key, an action that can precede attempts to abuse directory services. This suspicious activity raises concern that the same threat actor might be targeting other resources in the environment.'
      question: 'Subsequent analysis revealed an alert about an unusual addition of a password-type credential to an OAuth application. Which cloud application was involved in this suspicious credential addition?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'office 365'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'office 365'
      scoring:
        max_score: 1.0
