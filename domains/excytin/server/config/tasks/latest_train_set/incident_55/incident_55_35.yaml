tasks:
  - task_id: incident_55_latest_train_set_task_35
    title: incident_55_latest_train_set_task_35
    description: 'Just two seconds after the renamed executable was run, a new alert titled "Suspicious service registration" was raised. Which executable was registered as a service in this follow-up alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed that a Windows executable had been renamed and launched on a host (name redacted). Specifically, the attacker first executed `powershell.exe` with an encoded command, followed by launching a renamed system binary `iy2orr1e.rrg.exe` under the SYSTEM account. This activity triggered the alert "System executable renamed and launched" because adversaries often rename Windows executables to bypass security controls before using them for follow-on actions.'
      question: 'Just two seconds after the renamed executable was run, a new alert titled "Suspicious service registration" was raised. Which executable was registered as a service in this follow-up alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'services.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A system executable was renamed and launched on HostName `mb-adfs`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The renamed executable with ExtractedFileName `services.exe` was then registered as a suspicious service.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
