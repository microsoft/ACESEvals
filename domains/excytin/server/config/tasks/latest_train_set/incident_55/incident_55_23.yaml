tasks:
  - task_id: incident_55_latest_train_set_task_23
    title: incident_55_latest_train_set_task_23
    description: 'Which user’s mailbox was identified as the recipient of the emails that contained the malicious URL and were subsequently removed on July 9 2024?'
    inherit_shared: true
    initial_context:
      incident_context: 'Investigators observed a suspicious LDAP query on July 2 2024 executed by the PowerShell script "ldaprequest.ps1" (process ID 11116). This was followed by a sequence of exploration commands on the same host. Several days later, on July 9 2024, the security system raised an alert titled "Email messages containing malicious URL removed after delivery," indicating that offending emails were automatically purged from a user’s mailbox.'
      question: 'Which user’s mailbox was identified as the recipient of the emails that contained the malicious URL and were subsequently removed on July 9 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bjenkins@niseko.alpineskihouse.co'
      scoring:
        max_score: 1.0
