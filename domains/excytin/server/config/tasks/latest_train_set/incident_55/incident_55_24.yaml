tasks:
  - task_id: incident_55_latest_train_set_task_24
    title: incident_55_latest_train_set_task_24
    description: 'According to the later "System executable renamed and launched" alert, which account was recorded as running the renamed executable?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4th, 2024 an alert titled "Attempt to hide use of dual-purpose tool" was raised. It involved the on-premises account gsmith (SID S-2-5-21-571436798-3864380397-1837441745-3206; AAD ID ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5). Investigators believe the same host later triggered another alert when a Windows system executable was renamed and executed, a common technique for evading behavior-based detection.'
      question: 'According to the later "System executable renamed and launched" alert, which account was recorded as running the renamed executable?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'SYSTEM'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A dual-purpose tool was observed under an unexpected filename on host `mb-adfs` (HostName=mb-adfs).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A renamed Windows executable was launched by the `SYSTEM` account (Name=SYSTEM).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
