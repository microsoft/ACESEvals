tasks:
  - task_id: incident_55_latest_train_set_task_33
    title: incident_55_latest_train_set_task_33
    description: 'Which user account was identified as adding the Password credential to the OAuth application "SimulandApp" in the alert raised on 2024-07-10?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an ongoing investigation we observed a series of related alerts. First, on 2024-07-04 a process named lsass.exe (PID 760) accessed sensitive DLLs (cryptdll.dll, hid.dll, winscard.dll, vaultcli.dll), triggering the alert “Suspicious access to LSASS service”, a common sign of credential-dumping activity. Seconds later, a follow-up alert reported that a malicious PowerShell Cmdlet had been invoked on the same machine, suggesting the attacker might be continuing credential-theft or lateral-movement actions. Nearly six days later, on 2024-07-10 at 11:24 UTC, another alert titled “Unusual addition of credentials to an OAuth app” indicated that a single user unexpectedly added a Password-type credential to the application named "SimulandApp", a behavior often associated with application compromise or preparation for wider access.'
      question: 'Which user account was identified as adding the Password credential to the OAuth application "SimulandApp" in the alert raised on 2024-07-10?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Luciano Herrera'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account.Name `bjenkins` triggered a suspicious access to the LSASS service, a common step for credential dumping.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
