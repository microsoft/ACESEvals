tasks:
  - task_id: incident_55_latest_train_set_task_3
    title: incident_55_latest_train_set_task_3
    description: 'In the "Ongoing hands-on-keyboard attack via Impacket toolkit" alert raised at 22:35:01 UTC, which executable did the attacker run on the affected device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we noted a "Suspicious remote activity" alert on July 4 2024 at 22:35 UTC that showed an external party launching the Windows utility "cmd.exe" on a host, likely to perform malicious remote actions. Just moments earlier, another alert reported an ongoing hands-on-keyboard attack using the Impacket toolkit, suggesting the attacker was executing additional commands on the same machine.'
      question: 'In the "Ongoing hands-on-keyboard attack via Impacket toolkit" alert raised at 22:35:01 UTC, which executable did the attacker run on the affected device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The Impacket toolkit executed the file Name `powershell.exe`, indicating hands-on-keyboard activity on the device (2024-07-04 22:35:01.395957 +00:00).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Immediately after, suspicious remote activity was performed under the account Name `LocalSystem`, suggesting the attacker leveraged SYSTEM-level privileges to proceed laterally or run remote commands (2024-07-04 22:35:02.377104 +00:00).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
