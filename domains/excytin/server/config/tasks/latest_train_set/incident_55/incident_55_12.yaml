tasks:
  - task_id: incident_55_latest_train_set_task_12
    title: incident_55_latest_train_set_task_12
    description: 'According to the alert, which built-in Windows command-line utility did the attacker run—likely to discover the current user context—during this suspicious exploration sequence?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a recently detected alert titled "Suspicious sequence of exploration activities", an executable named "iy2orr1e.rrg.exe" was observed running multiple times with Base-64-encoded PowerShell commands under the user whose SID is S-2-5-21-571436798-3864380397-1837441745-3206 (AadUserId: ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5). These commands are typically used by attackers to enumerate information about the compromised system and prepare for lateral movement.'
      question: 'According to the alert, which built-in Windows command-line utility did the attacker run—likely to discover the current user context—during this suspicious exploration sequence?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'whoami.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'whoami.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The process with ExtractedFileName `whoami.exe` was executed as part of a suspicious sequence of exploration activities, indicating possible reconnaissance by an attacker.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
