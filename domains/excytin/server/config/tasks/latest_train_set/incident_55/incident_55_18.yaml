tasks:
  - task_id: incident_55_latest_train_set_task_18
    title: incident_55_latest_train_set_task_18
    description: 'Which user account was identified as initiating the replication request to MB-DC1 in the suspected DCSync attack alert generated on 2024-07-10?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a recent incident, analysts observed a suspicious sequence of exploration activities on host "mb-adfs". A process named "iy2orr1e.rrg.exe" was launched in hidden mode via an encoded PowerShell command, followed by multiple invocations of "whoami.exe". These activities were tied to the account with SID S-2-5-21-571436798-3864380397-1837441745-3206. Shortly afterward, another alert indicated that malicious code had been injected into a different process, again involving the same host. A few days later, a critical alert reported a suspected DCSync attack, stating that a user from workstation MB-WINCLIENT initiated a directory replication request to domain controller MB-DC1.'
      question: 'Which user account was identified as initiating the replication request to MB-DC1 in the suspected DCSync attack alert generated on 2024-07-10?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Luciano Herrera'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The attacker executed an exploration sequence using the process ExtractedFileName `powershell.exe` (2024-07-04 22:35:03 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
