tasks:
  - task_id: incident_55_latest_train_set_task_50
    title: incident_55_latest_train_set_task_50
    description: 'According to the later alert titled "Suspected DCSync attack (replication of directory services)" raised on 2024-07-10 11:24:45 UTC, which user account name initiated the unauthorized directory replication request from host MB-WINCLIENT to MB-DC1?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 our monitoring flagged host "mb-winclient" after it ran several reconnaissance-style Windows commands from processes such as "powershell.exe" and "whoami.exe" under different local user accounts (e.g., "pwilson", "bjenkins"). This activity was captured in the alert titled "Suspicious sequence of exploration activities," suggesting the machine might have been preparing for further lateral-movement or credential-focused attacks.'
      question: 'According to the later alert titled "Suspected DCSync attack (replication of directory services)" raised on 2024-07-10 11:24:45 UTC, which user account name initiated the unauthorized directory replication request from host MB-WINCLIENT to MB-DC1?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Luciano Herrera'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious sequence of exploration activities was executed by the user whose AadUserId is `2de70991-2799-4a95-b734-8e3df3a50118` (2024-07-04 22:35:03 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Soon after, a suspected DCSync attack was performed by the user account with Name `Luciano Herrera`, indicating possible privilege-escalation and credential-theft activity (2024-07-10 11:24:45 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
