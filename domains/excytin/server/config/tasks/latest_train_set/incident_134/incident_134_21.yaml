tasks:
  - task_id: incident_134_latest_train_set_task_21
    title: incident_134_latest_train_set_task_21
    description: 'What is the Azure AD user ID (AadUserId) of the account that attempted to sign in from the malicious IP address 170.54.121.63?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-18 at 13:48 UTC, our monitoring flagged a "Malicious IP address" alert after a sign-in attempt originated from the known-bad IP 170.54.121.63. The investigation shows that this risky connection was tied to a single Azure AD account.'
      question: 'What is the Azure AD user ID (AadUserId) of the account that attempted to sign in from the malicious IP address 170.54.121.63?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e036dee7-fa23-42ef-a019-468c8d3401f1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'e036dee7-fa23-42ef-a019-468c8d3401f1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in was detected from a known malicious IP address for the user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
