tasks:
  - task_id: incident_134_latest_train_set_task_4
    title: incident_134_latest_train_set_task_4
    description: 'According to the later "Account compromised following a password-spray attack" alert, what is the email address of the user whose account was compromised?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 17 2024, at 11:01 UTC, Microsoft Entra ID raised an “Anonymous IP address” alert after the account with ID e036dee7-fa23-42ef-a019-468c8d3401f1 signed in from the external IP address 170.54.121.63, indicating possible use of an anonymizing service. The next day, a separate alert warned that the same investigation path ended with a confirmation that the user’s credentials had been compromised during a password-spray attack from an unusual location and browser.'
      question: 'According to the later "Account compromised following a password-spray attack" alert, what is the email address of the user whose account was compromised?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Nina Park@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in attempt originated from the anonymous IP address `170.54.121.63`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, the user account with Email `Nina Park@vnevado.alpineskihouse.co` was reported as compromised after a password-spray attack.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
