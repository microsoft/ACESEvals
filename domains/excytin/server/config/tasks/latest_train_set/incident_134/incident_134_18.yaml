tasks:
  - task_id: incident_134_latest_train_set_task_18
    title: incident_134_latest_train_set_task_18
    description: 'According to the "Anonymous IP address" sign-in alert linked to this incident, what is the IP address from which the suspicious sign-in attempt originated?'
    inherit_shared: true
    initial_context:
      incident_context: 'Microsoft security telemetry shows that an email containing a malicious URL (https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/) was delivered to raphaelt@vnevado.alpineskihouse.co from alyssat@vnevado.alpineskihouse.co (sender IP 254.241.243.229) and later removed by the protection system. The message was associated with the user account "Nina Park" (SID S-1-5-21-1874151667-3554330288-105586563-1715). A related Microsoft Entra ID alert, raised just minutes earlier, indicated a sign-in originating from an anonymous network source.'
      question: 'According to the "Anonymous IP address" sign-in alert linked to this incident, what is the IP address from which the suspicious sign-in attempt originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account (Field: AadUserId, Value: `e036dee7-fa23-42ef-a019-468c8d3401f1`) had an email with a malicious URL that was removed after delivery.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'This same account (Field: AadUserId, Value: `e036dee7-fa23-42ef-a019-468c8d3401f1`) later signed in from an anonymous IP address (Field: Address, Value: `170.54.121.63`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
