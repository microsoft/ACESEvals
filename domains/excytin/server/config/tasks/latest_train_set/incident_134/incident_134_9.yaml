tasks:
  - task_id: incident_134_latest_train_set_task_9
    title: incident_134_latest_train_set_task_9
    description: 'According to the “Account compromised following a password-spray attack” alert, from which IP address did the unusual sign-in occur?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-17, a security alert reported suspicious manipulation of an employee’s inbox rules through cloud application ID 20893, originating from IP 237.7.81.122. The following day, the same user triggered another alert: “Account compromised following a password-spray attack,” after an unexpected sign-in from a different location and browser.'
      question: 'According to the “Account compromised following a password-spray attack” alert, from which IP address did the unusual sign-in occur?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious inbox manipulation was detected for the account with Name `Nina Park`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The same account was later compromised through a password-spray attack originating from the IP Address `170.54.121.63`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
