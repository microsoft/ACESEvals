tasks:
  - task_id: incident_134_latest_train_set_task_5
    title: incident_134_latest_train_set_task_5
    description: 'According to the follow-up alert about the email cleanup, what is the exact HTTPS URL that was stripped from the delivered messages?'
    inherit_shared: true
    initial_context:
      incident_context: 'A security alert was raised after a user clicked on the link "http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/", which was flagged as potentially malicious. Shortly afterward, the security system reported that email messages containing a related malicious URL were automatically removed from user mailboxes.'
      question: 'According to the follow-up alert about the email cleanup, what is the exact HTTPS URL that was stripped from the delivered messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
      scoring:
        max_score: 1.0
