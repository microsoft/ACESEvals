tasks:
  - task_id: incident_134_latest_train_set_task_22
    title: incident_134_latest_train_set_task_22
    description: 'During the password-spray–related compromise of the user account on 18 July 2024, from which public IP address did the suspicious sign-in originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 17 July 2024, Microsoft 365 Defender raised an alert titled "A potentially malicious URL click was detected" after the user raphaelt@vnevado.alpineskihouse.co clicked the suspicious link hosted at ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io. The message originated from sender alyssat@vnevado.alpineskihouse.co and came from the IP address 254.241.243.229. Less than a day later, a follow-up alert reported that the same user account was involved in "Account compromised following a password-spray attack," indicating the attacker may have leveraged the earlier phishing email to gain access.'
      question: 'During the password-spray–related compromise of the user account on 18 July 2024, from which public IP address did the suspicious sign-in originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '170.54.121.63'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1874151667-3554330288-105586563-1715` clicked a URL that was later identified as malicious on 2024-07-17 10:59:14 UTC.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The same account was subsequently accessed from the unusual IP address `170.54.121.63` during a password-spray attack on 2024-07-18 14:54:18 UTC, indicating a likely compromise.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
