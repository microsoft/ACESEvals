      incident_context: 'During investigation of a suspicious inbox manipulation rule on user Jordan P’s mailbox (laylaw@vnevado.alpineskihouse.co), we noted that the rule ‘ITCleanup’ was created to move email to the RSS Feeds folder – an action often observed when adversaries attempt to hide malicious or phishing messages. Pivoting from this alert we discovered a related sign-in event that originated from an anonymous IP address (for example, Tor or a VPN).'
      question: 'According to the related “Anonymous IP address” alert, what is the Azure AD user ID (AadUserId) of the account that performed the anonymous sign-in?'
