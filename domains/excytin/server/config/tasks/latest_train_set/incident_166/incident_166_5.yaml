tasks:
  - task_id: incident_166_latest_train_set_task_5
    title: incident_166_latest_train_set_task_5
    description: 'Which cloud application (specify its App ID) is recorded in the alert that tracks the suspicious inbox manipulation rule set by laylaw@vnevado.alpineskihouse.co?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we found that the account laylaw@vnevado.alpineskihouse.co sent a series of suspicious emails to tony@avoriaz.alpineskihouse.co from the IP address 255.246.85.58, raising concerns of a business-email-compromise attempt. Shortly beforehand, the same user created an inbox rule named “ITCleanup” that automatically moves messages to the “RSS Feeds” folder – a common sign of mailbox manipulation by attackers.'
      question: 'Which cloud application (specify its App ID) is recorded in the alert that tracks the suspicious inbox manipulation rule set by laylaw@vnevado.alpineskihouse.co?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '11161'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '11161'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account.Name = Jordan P: Suspicious emails were sent by the possibly-compromised user “Jordan P,” indicating a BEC-related threat.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
