tasks:
  - task_id: incident_166_latest_train_set_task_19
    title: incident_166_latest_train_set_task_19
    description: 'According to the follow-up alert "Possible BEC financial fraud" generated on July 23, which user account name was implicated in this suspected business email compromise activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 22, 2024 an alert titled "Suspicious SAP authentication" was raised after a risky Microsoft Entra ID sign-in to the SAP cloud application (App ID 100) originating from IP address 107.253.5.27. This activity suggested a potential attacker may have gained access to SAP in order to view or manipulate sensitive financial data.'
      question: 'According to the follow-up alert "Possible BEC financial fraud" generated on July 23, which user account name was implicated in this suspected business email compromise activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Initial alert shows suspicious SAP authentication by user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequent alert indicates possible BEC-related financial fraud involving the account with Name `Jordan P`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
