tasks:
  - task_id: incident_166_latest_train_set_task_24
    title: incident_166_latest_train_set_task_24
    description: 'According to the “Password Spray” alert raised on 2024-07-23, what is the source IP address associated with this password-spray activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During investigation of a Business Email Compromise (BEC) incident, we observed that on 2024-07-22 a user account belonging to “Jordan P” (email: Jordan P@vnevado.alpineskihouse.co) sent suspicious messages from the IP address 255.246.85.58 to the mailbox tony@avoriaz.alpineskihouse.co. Approximately one day later, the monitoring system raised an additional alert titled “Password Spray,” indicating that an attacker attempted to guess multiple passwords for various accounts in the tenant.'
      question: 'According to the “Password Spray” alert raised on 2024-07-23, what is the source IP address associated with this password-spray activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was observed sending suspicious emails related to a potential Business Email Compromise attempt (timestamp: 2024-07-22 10:14:23.841423+00:00).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
