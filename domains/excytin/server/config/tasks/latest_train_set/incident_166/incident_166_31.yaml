tasks:
  - task_id: incident_166_latest_train_set_task_31
    title: incident_166_latest_train_set_task_31
    description: 'During the "Password Spray" alert raised on 2024-07-23 14:23:51 UTC, which IP address was identified as the source of the attack?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 22 2024, the user account "Jordan P" (email: Jordan P@vnevado.alpineskihouse.co, signing in from 107.253.5.27) triggered a "Suspicious SAP authentication" alert that may indicate an attacker accessed SAP to look for sensitive financial data. The next day, on July 23 2024 at 14:23:51 UTC, a separate "Password Spray" alert was raised, suggesting further malicious activity likely related to the same campaign.'
      question: 'During the "Password Spray" alert raised on 2024-07-23 14:23:51 UTC, which IP address was identified as the source of the attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '95.202.65.202'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A risky sign-in to SAP was performed by the account with field AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating the user may already be compromised.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The next day, a Password Spray attack was detected from the IP address with field Address `95.202.65.202`, suggesting this source may have been used to brute-force and obtain the above account’s credentials.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
