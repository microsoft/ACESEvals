    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we observed that a user who triggered a “BEC-related user signed in to SAP” alert accessed the SAP cloud application (AppId 100) from the external IP address 107.253.5.27. This same user is also tied to an earlier alert titled “BEC financial fraud,” which indicates that a suspicious inbox rule was created in a risky Azure Active Directory session—likely part of a Business Email Compromise attempt. You have the details for the first sign-in; now confirm the network information tied to the financial-fraud alert.'
      question: 'What external IP address is associated with the "BEC financial fraud" alert in this incident?'
