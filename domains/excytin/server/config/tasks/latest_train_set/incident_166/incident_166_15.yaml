tasks:
  - task_id: incident_166_latest_train_set_task_15
    title: incident_166_latest_train_set_task_15
    description: 'What is the email address of the account that triggered the "BEC-related user signed in to SAP" alert later in the day?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious SAP authentication detected at 2024-07-22 12:59:26 UTC, analysts noted that an Azure AD user (ID 89e933b9-5b2e-4bd6-bcdf-033db707ef82, SID S-1-5-21-1740051960-3534030288-108486866-1602) accessed the SAP application (AppId 100) from IP address 107.253.5.27. A few hours later, a related alert reported that the same account—already tied to a business-email-compromise (BEC) investigation—again signed in to SAP in a suspicious manner.'
      question: 'What is the email address of the account that triggered the "BEC-related user signed in to SAP" alert later in the day?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user with Sid `S-1-5-21-1740051960-3534030288-108486866-1602` performed a suspicious authentication to the SAP application.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
