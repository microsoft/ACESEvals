tasks:
  - task_id: incident_166_latest_train_set_task_32
    title: incident_166_latest_train_set_task_32
    description: 'Looking back at the Suspicious SAP authentication alert generated a few minutes earlier at 12:59:26 UTC on 2024-07-22, what is the display name of the account that performed that sign-in?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of risky sign-ins to our SAP enterprise application, we identified that at 13:19 UTC on 2024-07-22 a user with Id 89e933b9-5b2e-4bd6-bcdf-033db707ef82 and SID S-1-5-21-1740051960-3534030288-108486866-1602 accessed SAP (AppId 100) from the external IP address 107.253.5.27. This activity triggered a “Suspicious SAP authentication” alert, indicating the account may have been compromised.'
      question: 'Looking back at the Suspicious SAP authentication alert generated a few minutes earlier at 12:59:26 UTC on 2024-07-22, what is the display name of the account that performed that sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious SAP authentication was initiated by the account with Name `Jordan P`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The risky sign-in was directed at the cloud application with AppId `100`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
