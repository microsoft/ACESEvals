tasks:
  - task_id: incident_166_latest_train_set_task_12
    title: incident_166_latest_train_set_task_12
    description: 'During the investigation you notice another alert called “Suspicious inbox manipulation rule.” Which cloud application (AppId) is recorded as being used for that suspicious rule change?'
    inherit_shared: true
    initial_context:
      incident_context: 'Earlier today, the security team observed a Business Email Compromise (BEC)–related alert titled “Suspicious emails sent by BEC-related user.” According to the alert, user tony@avoriaz.alpineskihouse.co (with messages apparently sent from laylaw@vnevado.alpineskihouse.co via the IP address 255.246.85.58) was involved in sending potentially malicious emails. Investigators are now reviewing follow-on activity that might reveal how the attacker is maintaining access or exfiltrating data, including any changes to the victim’s mailbox rules.'
      question: 'During the investigation you notice another alert called “Suspicious inbox manipulation rule.” Which cloud application (AppId) is recorded as being used for that suspicious rule change?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '20893'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious emails were sent from the IP address `255.246.85.58` (Field: Address, Type: ip).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Prior to that, a suspicious inbox manipulation rule was created by the cloud application with AppId `20893` (Field: AppId, Type: cloud-application).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
