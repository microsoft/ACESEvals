tasks:
  - task_id: incident_166_latest_train_set_task_11
    title: incident_166_latest_train_set_task_11
    description: 'According to the "Suspicious SAP authentication" alert, which external IP address was used for the risky sign-in to SAP?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we observed that user Jordan P (laylaw@vnevado.alpineskihouse.co) created a suspicious inbox rule named "ITCleanup" to divert messages into the "RSS Feeds" folder. The activity originated from several IPs (for example 95.202.65.202 and 192.238.237.190) and involved Microsoft Exchange Online (AppId 20893) and Microsoft 365 (AppId 11161). A few hours later, the same user triggered an additional alert titled "Suspicious SAP authentication" after signing in to the organisation’s SAP environment from an external location.'
      question: 'According to the "Suspicious SAP authentication" alert, which external IP address was used for the risky sign-in to SAP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.253.5.27'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious inbox rule (named ''ITCleanup'') was created on the mailbox of the account with Email `Jordan P@vnevado.alpineskihouse.co`, indicating a possible compromise of this user.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, a risky SAP authentication was performed from IP Address `107.253.5.27`, suggesting the attacker leveraged the compromised account to access enterprise resources.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
