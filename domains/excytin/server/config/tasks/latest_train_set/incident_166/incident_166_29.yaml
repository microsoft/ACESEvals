tasks:
  - task_id: incident_166_latest_train_set_task_29
    title: incident_166_latest_train_set_task_29
    description: 'Which user’s email account was identified in the alert about the suspicious inbox manipulation rule that occurred after the sign-in from IP 192.238.237.190?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a sign-in to the environment was observed from the anonymous IP address 192.238.237.190. This activity triggered an alert titled “Anonymous IP address”, indicating the user may have accessed the tenant through anonymizing infrastructure (e.g., Tor or VPN). Shortly after this sign-in, another alert indicated that the same user’s mailbox had a “Suspicious inbox manipulation rule” created—suggesting the attacker might be trying to hide or divert emails for further malicious activity.'
      question: 'Which user’s email account was identified in the alert about the suspicious inbox manipulation rule that occurred after the sign-in from IP 192.238.237.190?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account activity: The user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address on 2024-07-22 09:11:31.290020+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Mailbox tampering: The mailbox with Email `Jordan P@vnevado.alpineskihouse.co` had a suspicious inbox manipulation rule created on 2024-07-22 10:00:07.502771+00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
