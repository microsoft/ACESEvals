tasks:
  - task_id: incident_166_latest_train_set_task_1
    title: incident_166_latest_train_set_task_1
    description: 'In a related alert, the same user account was observed signing in from an anonymous network. What is the IP address that was flagged as coming from an anonymous source?'
    inherit_shared: true
    initial_context:
      incident_context: 'A user named Jordan P (email: Jordan P@vnevado.alpineskihouse.co, SID: S-1-5-21-1740051960-3534030288-108486866-1602) was recently involved in a business-email-compromise–related alert after signing in to SAP from IP address 107.253.5.27. This potentially indicates an attacker has gained control of the account to access sensitive financial data in SAP.'
      question: 'In a related alert, the same user account was observed signing in from an anonymous network. What is the IP address that was flagged as coming from an anonymous source?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '192.238.237.190'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user involved in a BEC alert signed in to SAP suspiciously (account.AadUserId: 89e933b9-5b2e-4bd6-bcdf-033db707ef82).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A sign-in was observed from an anonymous IP address (ip.Address: 192.238.237.190), suggesting the attacker may be hiding their location.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
