tasks:
  - task_id: incident_166_latest_train_set_task_2
    title: incident_166_latest_train_set_task_2
    description: 'According to the BEC financial fraud alert, what is the display name of the user account that created the inbox rule designed to hide incoming emails?'
    inherit_shared: true
    initial_context:
      incident_context: 'A password spray attack originating from the external IP address 95.202.65.202 was detected on 2024-07-23. Investigators believe that one of the targeted Azure AD accounts was subsequently abused in a risky session to create an inbox rule that hides incoming email—an activity consistent with business email compromise (BEC)–style financial fraud. The analyst needs to identify which specific user account was involved in creating this suspicious inbox rule.'
      question: 'According to the BEC financial fraud alert, what is the display name of the user account that created the inbox rule designed to hide incoming emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: '2024-07-23 14:23:51.925093+00:00 – A password-spray attack was detected against an Azure AD account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: '2024-07-22 10:00:07.521914+00:00 – In what appears to be a related campaign, a suspicious inbox rule was created for user account `Jordan P`, indicating a possible Business Email Compromise (BEC) financial-fraud attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
