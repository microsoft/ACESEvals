tasks:
  - task_id: incident_166_latest_train_set_task_3
    title: incident_166_latest_train_set_task_3
    description: 'What is the AppId of the cloud application that appears on the same alert path as the suspicious inbox-manipulation rule?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-22 a suspicious inbox-manipulation rule was created in Jordan P’s mailbox (Jordan P@vnevado.alpineskihouse.co) from IP address 255.246.85.58. This behavior suggests a possible takeover of the user’s account. During triage, analysts noticed that an OAuth / cloud application was tied to the same activity path, indicating it may have been authorized to help perform or automate the rule changes.'
      question: 'What is the AppId of the cloud application that appears on the same alert path as the suspicious inbox-manipulation rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '20893'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule was detected on the cloud-application with AppId `20893`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
