tasks:
  - task_id: incident_166_latest_train_set_task_7
    title: incident_166_latest_train_set_task_7
    description: 'In the follow-up alert titled "Possible BEC financial fraud" generated on 2024-07-23, which user account name was flagged for the suspicious activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-22, Microsoft Defender XDR raised a "BEC-related user signed in to SAP" alert after detecting a sign-in to the SAP cloud application (AppId 100) from the external IP address 107.253.5.27. This activity suggested that an attacker may have gained control of a user account involved in a previous business email compromise (BEC) incident and was potentially exploring sensitive financial data in SAP.'
      question: 'In the follow-up alert titled "Possible BEC financial fraud" generated on 2024-07-23, which user account name was flagged for the suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Jordan P'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious SAP sign-in was detected for account Email `Jordan P@vnevado.alpineskihouse.co`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Possible BEC-related financial fraud activity was later observed involving account Name `Jordan P`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
