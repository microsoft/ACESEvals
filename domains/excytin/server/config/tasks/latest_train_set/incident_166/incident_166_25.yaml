tasks:
  - task_id: incident_166_latest_train_set_task_25
    title: incident_166_latest_train_set_task_25
    description: 'In the "Suspicious SAP authentication" alert linked to the earlier inbox-rule manipulation, what is the AppId of the cloud application the attacker accessed?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a suspicious inbox-rule manipulation that originated from IP address 255.246.85.58 and involved cloud application ID 20893, we discovered that the same (currently unidentified) user account later triggered another security alert. This follow-up alert indicates a risky sign-in to an SAP enterprise application, suggesting the attacker may now be attempting to access or modify sensitive financial data.'
      question: 'In the "Suspicious SAP authentication" alert linked to the earlier inbox-rule manipulation, what is the AppId of the cloud application the attacker accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A user''s mailbox was tampered with: account AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` had a suspicious inbox-manipulation rule created.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly afterwards the same risky identity attempted to access the SAP cloud application (AppId `100`), triggering a “Suspicious SAP authentication” alert.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
