tasks:
  - task_id: incident_5_latest_train_set_task_87
    title: incident_5_latest_train_set_task_87
    description: 'Reviewing the details of the lateral-movement alert, what was the full command line (including any URL) executed by the malicious process with PID 88?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a potential credential-theft incident, the endpoint with process "browsercore.exe" (PID 7036) was flagged for a possible attempt to access a Primary Refresh Token (PRT). Just one second later, a second alert reported that ‘CommandAndControl’ malware had been detected during a suspected lateral-movement attempt on the same device. This second alert indicates a process identified as the utility "curl" (PID 88) was launched, suggesting the attacker tried to reach out to an external server.'
      question: 'Reviewing the details of the lateral-movement alert, what was the full command line (including any URL) executed by the malicious process with PID 88?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '"curl http://vectorsandarrows.com"'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '"curl http://vectorsandarrows.com"'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A possible attempt to access a Primary Refresh Token (PRT) was detected on the host with field AadDeviceId=`e5799261-6720-4297-961e-bd9ca4275033`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'During lateral movement, ''CommandAndControl'' malware launched a process with field ProcessId=`88`, CreatedTimeUtc=`2024-06-20t09:29:42.3927529z`, CommandLine=`curl http://vectorsandarrows.com`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
