tasks:
  - task_id: incident_5_latest_train_set_task_95
    title: incident_5_latest_train_set_task_95
    description: 'What IP address was listed in the Manatee Tempest activity-group alert generated at 2024-07-04 22:35:01 UTC?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation began when Microsoft Defender flagged a "Suspicious access to LSASS service" alert on 2024-07-04. Mimikatz-style commands were executed (for example: "mimikatz.exe privilege::debug sekurlsa::pth … /run:..\notepad.exe"), indicating that an attacker tried to read credentials from LSASS. A few days later, additional alerts showed attempts to move laterally, including a "PSExec to Vnevado-jump" event and a blocked SMB file-access attempt. Ultimately, the activity was attributed to the Russia-based threat actor tracked as Manatee Tempest. One of the artifacts recorded in that Manatee Tempest alert was a specific IP address that communicated with the environment.'
      question: 'What IP address was listed in the Manatee Tempest activity-group alert generated at 2024-07-04 22:35:01 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '198.43.121.209'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The alert on ''Manatee Tempest activity group'' shows the attacker infrastructure communicating from IP (Address) `198.43.121.209`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Almost simultaneously, the attacker abused the local account (Name) `tgs2z` to access the LSASS process and dump credentials.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
