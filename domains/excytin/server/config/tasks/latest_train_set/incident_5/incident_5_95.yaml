      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Those stolen credentials surfaced as cloud account (AadUserId) `731adb71-b11c-4bbf-850b-57989b350e96`, which tried – but was blocked – to move laterally via SMB file operations.'
        objective: Identify key details related to the potential compromise that might
