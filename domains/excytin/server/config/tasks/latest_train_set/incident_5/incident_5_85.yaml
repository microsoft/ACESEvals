tasks:
  - task_id: incident_5_latest_train_set_task_85
    title: incident_5_latest_train_set_task_85
    description: 'According to the follow-up ransomware alert, what is the name of the file that was identified as having the suspicious ransomware-related extension?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a "Command and Control behavior was blocked" alert was raised after the process with command line `curl http://vectorsandarrows.com` (PID 88, created at 2024-06-20 09:29:42 UTC) attempted to reach the URL `http://vectorsandarrows.com/`. This activity suggested that malware on the device might be trying to communicate with an external server. Immediately afterward, the same device generated an additional high-severity alert reporting possible ransomware activity, where many files were suddenly renamed with a known malicious extension—an indicator of mass-encryption behavior.'
      question: 'According to the follow-up ransomware alert, what is the name of the file that was identified as having the suspicious ransomware-related extension?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'characterical.zip'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An account with Sid `S-1-5-21-1840191660-8534830288-125585561-1522` was involved in an alert where Command-and-Control behavior was blocked, indicating active malware on the device.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, a file named `characterical.zip` was flagged for exhibiting a known ransomware extension, suggesting possible mass-encryption activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
