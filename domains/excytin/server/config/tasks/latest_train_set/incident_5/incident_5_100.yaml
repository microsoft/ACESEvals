tasks:
  - task_id: incident_5_latest_train_set_task_100
    title: incident_5_latest_train_set_task_100
    description: 'Identify the external IP address associated with the "Malicious credential theft tool execution detected" alert that fired moments after the ransomware files were dropped.'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed that the user account "dp5hn" (AadUserId 731adb71-b11c-4bbf-850b-57989b350e96, SID S-1-5-21-1840191660-8534830288-125585561-1522) dropped several ransomware-related files such as "ponceau.7z", "earlap.doc.lockbit", and others on multiple devices. This activity triggered the alert "Possible compromised user account delivering ransomware-related files" on 2024-07-04. Just two seconds later, another alert indicated that a known credential-theft tool was executed in the environment, suggesting the attacker tried to dump credentials immediately after planting the ransomware payloads.'
      question: 'Identify the external IP address associated with the "Malicious credential theft tool execution detected" alert that fired moments after the ransomware files were dropped.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.224.99.179'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:00.773532+00:00 the alert ''Possible compromised user account delivering ransomware-related files'' was raised, showing activity from the ip.Address `99.83.111.100`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'At 2024-07-04 22:35:02.702215+00:00 the alert ''Malicious credential theft tool execution detected'' followed, involving the ip.Address `107.224.99.179`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
