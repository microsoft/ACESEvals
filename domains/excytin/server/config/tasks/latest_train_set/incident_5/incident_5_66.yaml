tasks:
  - task_id: incident_5_latest_train_set_task_66
    title: incident_5_latest_train_set_task_66
    description: 'According to the alert that reported the deletion of file backups, what is the name of the executable that was run to perform the shadow-copy deletion?'
    inherit_shared: true
    initial_context:
      incident_context: 'The investigation began when an external IP address 99.83.111.100 was seen initiating a ‘Ransomware payload remotely launched’ alert on one of our devices. This alert suggests that attackers may be attempting to encrypt content on the targeted host. Shortly after, a second alert indicated that all file snapshots and shadow copies had been deleted via WMI or VSSAdmin—an action frequently used by ransomware operators to prevent restoration from backups.'
      question: 'According to the alert that reported the deletion of file backups, what is the name of the executable that was run to perform the shadow-copy deletion?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vssblatemp.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A ransomware payload was remotely launched on the host whose AadDeviceId is `e5799261-6720-4297-961e-bd9ca4275033`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The attackers then deleted all file backups using the process identified by ProcessId__CreatedTimeUtc__CommandLine `1900__2024-06-20t09:29:40.8785892z__vssblatemp.exe delete shadows /all`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
