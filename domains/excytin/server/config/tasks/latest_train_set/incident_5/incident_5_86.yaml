tasks:
  - task_id: incident_5_latest_train_set_task_86
    title: incident_5_latest_train_set_task_86
    description: 'According to the related "File backups were deleted" alert, which executable was responsible for issuing the command that wiped all shadow copies on the affected host?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a lateral-movement event, security telemetry showed that on host "vnevado-win11u" (AAD device ID bc00e484-d0e5-4da4-9472-95568cccc07e) an attacker-controlled process issued the command "curl http://vectorsandarrows.com" (PID 5572, 2024-06-20 09:32 UTC). In the same incident, a subsequent alert reported that all Volume Shadow Copy backups were removed via a malicious command—an action commonly linked to ransomware activity.'
      question: 'According to the related "File backups were deleted" alert, which executable was responsible for issuing the command that wiped all shadow copies on the affected host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vssblatemp.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The process with ProcessId `1900` executed at `2024-06-20T09:29:40.8785892Z` used the command line `vssblatemp.exe delete shadows /all` to erase all file snapshots and shadow copies.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The account with Sid `S-1-5-21-1840191660-8534830288-125585561-1522` was detected hosting ''CommandAndControl'' malware during an attempted lateral movement.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
