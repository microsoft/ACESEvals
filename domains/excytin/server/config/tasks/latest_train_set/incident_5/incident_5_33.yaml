tasks:
  - task_id: incident_5_latest_train_set_task_33
    title: incident_5_latest_train_set_task_33
    description: 'According to the command line captured in the "Suspicious WMI process creation" alert, which executable did the WMI-spawned process attempt to run?'
    inherit_shared: true
    initial_context:
      incident_context: 'During investigation of the "Command and Control behavior was blocked" alert on host "vnevado-win11u" (device ID bc00e484-d0e5-4da4-9472-95568cccc07e), we observed a process (PID 5572) that executed a curl command to reach the domain "vectorsandarrows.com". This activity suggests that malware on the device may be attempting to communicate with an external command-and-control server. Soon after, a related alert flagged a suspicious WMI-based process creation on the same machine, indicating that the malware might be spawning additional payloads through WMI.'
      question: 'According to the command line captured in the "Suspicious WMI process creation" alert, which executable did the WMI-spawned process attempt to run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vssblatemp.exe'
