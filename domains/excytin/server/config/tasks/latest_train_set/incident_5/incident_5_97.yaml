tasks:
  - task_id: incident_5_latest_train_set_task_97
    title: incident_5_latest_train_set_task_97
    description: 'In the “Malicious credential theft tool execution detected” alert that followed the suspected ransomware file drops, which IP address was identified as involved in the credential-theft activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024 at 22:35 UTC, an alert titled “Possible compromised user account delivering ransomware-related files” was raised. The alert indicated that a user account (SID S-1-5-21-1840191660-8534830288-125585561-1522) had dropped several suspicious files — such as ponceau.7z, syncretic.7z, earlap.doc.lockbit and others — across multiple devices (one identified by AadDeviceId bc00e484-d0e5-4da4-9472-95568cccc07e). This behavior suggested the account might have been compromised to facilitate lateral movement and ransomware deployment. Immediately after, another alert titled “Malicious credential theft tool execution detected” was generated, flagging an attempt to dump user credentials.'
      question: 'In the “Malicious credential theft tool execution detected” alert that followed the suspected ransomware file drops, which IP address was identified as involved in the credential-theft activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.224.99.179'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A ransomware-related file was dropped, indicating that the source IP Address `99.83.111.100` is involved in the compromise.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The attacker then used PSExec to move laterally to the HostName `vnevado-win10v`, suggesting further internal spread.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Finally, a credential-theft tool was executed from IP Address `107.224.99.179`, revealing the endpoint that performed the credential dumping activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
