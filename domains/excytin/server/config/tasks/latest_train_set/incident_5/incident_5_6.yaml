tasks:
  - task_id: incident_5_latest_train_set_task_6
    title: incident_5_latest_train_set_task_6
    description: 'According to the “LSASS process memory modified” alert that followed the suspicious remote activity, which IP address was involved in this event?'
    inherit_shared: true
    initial_context:
      incident_context: 'During investigation we observed a sequence of malicious commands executed remotely on a host, such as ''vssblatemp.exe delete shadows /all'' and a PowerShell script invocation using account ID 731adb71-b11c-4bbf-850b-57989b350e96. This activity coincided with an alert titled “Suspicious remote activity” at 2024-07-04 22:35 UTC. Only seconds later, the host generated a more severe alert: “LSASS process memory modified”, suggesting an attempt to access sensitive credentials stored in LSASS.'
      question: 'According to the “LSASS process memory modified” alert that followed the suspicious remote activity, which IP address was involved in this event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.224.99.179'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious remote activity was initiated from the IP address `99.83.111.100` (Entity type: ip, Field: Address).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Following that activity, the attacker used the account `tgs2z` (Entity type: account, Field: Name) to perform lateral movement to the jump-server through PSExec.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
