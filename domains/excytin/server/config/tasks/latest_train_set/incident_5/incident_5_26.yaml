tasks:
  - task_id: incident_5_latest_train_set_task_26
    title: incident_5_latest_train_set_task_26
    description: 'According to the "Suspicious WMI process creation" alert that preceded the blocked C2 traffic, which PowerShell script file was specified in the command line of the process that was started?'
    inherit_shared: true
    initial_context:
      incident_context: 'An alert was generated after Microsoft Defender blocked Command-and-Control (C2) traffic to the external URL "http://vectorsandarrows.com/" on one of the organisation’s workstations late on 4 July 2024. In the minutes leading up to that network activity, the same machine raised another alert for a suspicious WMI-spawned PowerShell process—often a sign that malware is trying to run follow-on commands before reaching out to its C2 server.'
      question: 'According to the "Suspicious WMI process creation" alert that preceded the blocked C2 traffic, which PowerShell script file was specified in the command line of the process that was started?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'c:\scripts\get-userprttoken.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'c:\scripts\get-userprttoken.ps1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Command and control behavior was blocked on host with HostName `vnevado-win11t`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious WMI process was created with ProcessId__CreatedTimeUtc__CommandLine `6280__2024-06-20t09:29:43.9198085z__powershell -file c:\scripts\get-userprttoken.ps1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
