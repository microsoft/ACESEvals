tasks:
  - task_id: incident_5_latest_train_set_task_70
    title: incident_5_latest_train_set_task_70
    description: 'What is the name of the file identified in the ransomware-related alert that shows the suspicious extension?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4, 2024 a process (PID 5572) executed the command `curl http://vectorsandarrows.com`, which triggered a "Command and Control behavior was blocked" alert. Just seconds later, another alert flagged possible ransomware activity on the same device, noting that many files were being modified with a known malicious extension.'
      question: 'What is the name of the file identified in the ransomware-related alert that shows the suspicious extension?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'syncretic.7z'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'syncretic.7z'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:01.038630Z, command-and-control behavior was blocked on the device (entity field: AadDeviceId, value: `bc00e484-d0e5-4da4-9472-95568cccc07e`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Two seconds later, possible ransomware activity was detected on the same device, with the malware encrypting files such as (entity field: Name, value: `syncretic.7z`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
