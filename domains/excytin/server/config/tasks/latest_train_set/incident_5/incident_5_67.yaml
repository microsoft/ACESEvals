    description: 'According to the alert indicating that a Windows Sysinternals tool was renamed and launched, which external IP address was involved in this activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a series of events that began with a “Suspicious remote activity” alert on host "vnevado-win10r", several potentially malicious commands were executed (for example, "vssblatemp.exe delete shadows /all" and a PowerShell script launch). Just seconds later, another alert reported that a Windows Sysinternals tool had been renamed and executed—often a sign an attacker is trying to hide the use of Sysinternals utilities after gaining remote access. Analysts need to identify the network origin of that renamed-tool execution to understand the scope of the intrusion.'
      question: 'According to the alert indicating that a Windows Sysinternals tool was renamed and launched, which external IP address was involved in this activity?'
