    title: incident_5_latest_train_set_task_59
    description: 'According to the final alert that reported a suspicious attempt to access the LSASS service’s memory, what is the name of the file implicated in that activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a ransomware-related incident on host "vnevado-win11t" (device ID e5799261-6720-4297-961e-bd9ca4275033), analysts observed a series of suspicious events. The timeline starts with a "Ransomware behavior detected in the file system" alert, followed seconds later by two consecutive alerts warning about possible attempts to access a Primary Refresh Token (PRT). These findings indicate that the attacker may be attempting credential theft and lateral movement techniques immediately after the ransomware-like activity. Shortly thereafter, another alert was raised for a suspicious attempt to read the LSASS process memory—an activity commonly associated with harvesting clear-text credentials.'
      question: 'According to the final alert that reported a suspicious attempt to access the LSASS service’s memory, what is the name of the file implicated in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
