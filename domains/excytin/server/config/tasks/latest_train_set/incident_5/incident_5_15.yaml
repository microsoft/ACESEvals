tasks:
  - task_id: incident_5_latest_train_set_task_15
    title: incident_5_latest_train_set_task_15
    description: 'A few milliseconds later, during the subsequent alert "''CommandAndControl'' malware was detected during lateral movement", which user account was identified on the targeted device?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024, at 22:35 UTC, Microsoft Defender raised an alert titled “Malicious credential theft tool execution detected” after the file “mimikatz.exe” was launched with a pass-the-hash command to run Notepad on the remote host vnevado-jump through cmd.exe. This activity suggests an attacker was attempting to harvest credentials on the device.'
      question: 'A few milliseconds later, during the subsequent alert "''CommandAndControl'' malware was detected during lateral movement", which user account was identified on the targeted device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'dp5hn'
      scoring:
        max_score: 1.0
