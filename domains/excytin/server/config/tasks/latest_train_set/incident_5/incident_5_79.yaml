tasks:
  - task_id: incident_5_latest_train_set_task_79
    title: incident_5_latest_train_set_task_79
    description: 'Shortly after these WMI-spawned processes ran, the endpoint generated an alert for possible ransomware activity due to files being renamed with a known malicious extension. Which specific file was identified with the “.lockbit” extension appended?'
    inherit_shared: true
    initial_context:
      incident_context: 'On device ''vnevado-win10s'' (AadDeviceId: f5b847aa-8712-4bf6-b4f7-ed6cd89e1505), a series of suspicious commands were executed within seconds of each other, including disabling recovery features via ''bcdedit'', deleting volume shadow copies with ''vssblatemp.exe'', and running a PowerShell script ''get-userprttoken.ps1''. This activity triggered the “Suspicious WMI process creation” alert, suggesting malicious use of WMI to spawn new processes—behaviour often seen in ransomware attacks.'
      question: 'Shortly after these WMI-spawned processes ran, the endpoint generated an alert for possible ransomware activity due to files being renamed with a known malicious extension. Which specific file was identified with the “.lockbit” extension appended?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'unstreaming.xlsx.lockbit'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'unstreaming.xlsx.lockbit'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious WMI process creation was observed involving the account with Sid `S-1-5-21-1840191660-8534830288-125585561-1522`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Possible ransomware activity was detected when the file with Name `unstreaming.xlsx.lockbit` appeared on the device.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
