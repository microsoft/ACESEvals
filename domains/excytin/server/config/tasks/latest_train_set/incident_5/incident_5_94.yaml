tasks:
  - task_id: incident_5_latest_train_set_task_94
    title: incident_5_latest_train_set_task_94
    description: 'Identify the external IP address that was observed in the "Windows Sysinternals tool renamed" alert triggered moments after the ransomware files were dropped.'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed that user account "dp5hn" (AadUserId: 731adb71-b11c-4bbf-850b-57989b350e96) dropped several ransomware-related files such as syncretic.7z.lockbit, kiters.7z.lockbit, and a PowerShell script named get-userprttoken.ps1 on device bc00e484-d0e5-4da4-9472-95568cccc07e. Shortly after this activity, another alert reported that a Windows Sysinternals tool had been renamed and executed—an action often used to mask malicious tooling.'
      question: 'Identify the external IP address that was observed in the "Windows Sysinternals tool renamed" alert triggered moments after the ransomware files were dropped.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.224.99.179'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Initial compromise: A device with IP Address `99.83.111.100` dropped ransomware-related files across several endpoints (alert: Possible compromised user account delivering ransomware-related files, 2024-07-04 22:35:00 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Lateral movement: The attacker leveraged the account Name `tgs2z` to run PSExec against the jump server Vnevado-jump (alert: PSExec to Vnevado-jump, 2024-07-10 11:24:45 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Defense evasion: From IP Address `107.224.99.179`, a Windows Sysinternals tool was renamed and executed, likely to mask malicious activity (alert: Windows Sysinternals tool renamed, 2024-07-04 22:35:02 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
