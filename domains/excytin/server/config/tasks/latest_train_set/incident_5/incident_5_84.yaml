tasks:
  - task_id: incident_5_latest_train_set_task_84
    title: incident_5_latest_train_set_task_84
    description: 'According to the "Suspicious WMI process creation" alert that followed the ransomware activity, what exact command line was executed by the process started through WMI on the host "vnevado-win11u"?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a ransomware event, it was noted that a payload had been remotely launched on the workstation named "vnevado-win11u" (device ID bc00e484-d0e5-4da4-9472-95568cccc07e) communicating with the external IP 99.83.111.100. Shortly afterwards, another alert on the same device reported a suspicious WMI-initiated process, suggesting malware may be trying to manipulate system-level settings to hamper recovery efforts.'
      question: 'According to the "Suspicious WMI process creation" alert that followed the ransomware activity, what exact command line was executed by the process started through WMI on the host "vnevado-win11u"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bcdedit /set bootstatuspolicy ignoreallfailures'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bcdedit /set bootstatuspolicy ignoreallfailures'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Ransomware payload was remotely launched by account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
