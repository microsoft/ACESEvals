    title: incident_5_latest_train_set_task_8
    description: 'What is the Azure AD device ID of the host on which the "Command and Control behavior was blocked" alert was raised?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, security telemetry showed ransomware-like file system activity on the workstation named "vnevado-win11t" (Azure AD device ID e5799261-6720-4297-961e-bd9ca4275033). A few seconds later, another alert indicated that malicious command-and-control (C2) traffic was actively blocked on a different device in the environment. Analysts need to correlate these events to understand the lateral movement of the threat.'
      question: 'What is the Azure AD device ID of the host on which the "Command and Control behavior was blocked" alert was raised?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
