tasks:
  - task_id: incident_5_latest_train_set_task_88
    title: incident_5_latest_train_set_task_88
    description: 'According to the "File backups were deleted" alert that followed the PRT-access attempt, which executable was used to issue the command that removed all shadow copies?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed a process named "browsercore.exe" (PID 7036) starting on a Windows device at 2024-06-20 09:29:49 UTC. This activity triggered the alert "Possible attempt to access Primary Refresh Token (PRT)" on 2024-07-04 22:35 UTC, indicating a potential bid to obtain valuable authentication material that could enable lateral movement. Just one second later, a second alert titled "File backups were deleted" was raised, noting that all file snapshots and shadow copies had been removed through WMI or VSSAdmin—behaviour frequently associated with ransomware or wiper activity. The alert description implies a malicious process was responsible for issuing the deletion command, but its name is not shown here.'
      question: 'According to the "File backups were deleted" alert that followed the PRT-access attempt, which executable was used to issue the command that removed all shadow copies?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vssblatemp.exe'
      scoring:
        max_score: 1.0
    subtasks:
