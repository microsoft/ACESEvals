tasks:
  - task_id: incident_5_latest_train_set_task_64
    title: incident_5_latest_train_set_task_64
    description: 'Which external IP address was recorded as the source that remotely launched the ransomware payload on the affected device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of potentially compromised assets showing ransomware-like behavior, several suspicious files were observed (e.g., get-userprttoken.ps1, characterical.zip, characterical.zip.lockbit) associated with the same user SID S-0-6-5. Evidence indicates the attacker leveraged a remote network location to execute a ransomware payload on one of the devices.'
      question: 'Which external IP address was recorded as the source that remotely launched the ransomware payload on the affected device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '99.83.111.100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert: Potentially compromised assets exhibiting ransomware-like behavior – entity field Address with value `99.83.111.100` is flagged as the source IP involved in the suspicious, ransomware-style activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Alert: Ransomware payload remotely launched – the same entity field Address with value `99.83.111.100` is identified as the IP that initiated the remote ransomware payload.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
