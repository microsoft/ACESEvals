    description: 'According to the "Unknown malware was detected and was active" alert, what is the name of the DLL file that was flagged by Microsoft Defender?'
    inherit_shared: true
    initial_context:
      incident_context: 'During investigation of an intrusion attributed to the Russia-based Manatee Tempest group, telemetry showed a host contacting the malicious domain "vectorsandarrows.com" (IP 198.43.121.209). Within seconds of this activity, Microsoft Defender generated an alert stating that "Unknown malware was detected and was active" on the same machine, indicating a suspicious DLL had been loaded. Identifying this file is important to scope the compromise and plan remediation.'
      question: 'According to the "Unknown malware was detected and was active" alert, what is the name of the DLL file that was flagged by Microsoft Defender?'
