tasks:
  - task_id: incident_5_latest_train_set_task_16
    title: incident_5_latest_train_set_task_16
    description: 'What is the name of the executable that was flagged as the active malware in the second alert on host "vnevado-win10r"?'
    inherit_shared: true
    initial_context:
      incident_context: 'Defender recently raised a "CommandAndControl" malware-during-lateral-movement alert on host "vnevado-win10r". The alert showed process 1332 (command line: "curl http://vectorsandarrows.com") started by account "dp5hn" (AAD user ID 731adb71-b11c-4bbf-850b-57989b350e96). A short time later, the same endpoint generated a second alert reporting that an unknown malware sample was still active on the machine, implying the attacker had achieved persistence.'
      question: 'What is the name of the executable that was flagged as the active malware in the second alert on host "vnevado-win10r"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An attacker-controlled account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was observed running ‘CommandAndControl’ malware, showing the account is already compromised.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'From the external IP address `99.83.111.100` (Field: Address) the attacker attempted SMB-based lateral movement, which was automatically blocked.'
        objective: Identify key details related to the potential compromise that might
