tasks:
  - task_id: incident_5_latest_train_set_task_41
    title: incident_5_latest_train_set_task_41
    description: 'Within this same incident, investigators also received the alert "Windows Sysinternals tool renamed." According to that alert, what is the name of the executable that was renamed and executed?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024 at 22:35 UTC, account "dp5hn" on host "vnevado-win11u" triggered an alert titled "Ransomware payload remotely launched." This indicated that attackers may have attempted to encrypt data on the device. Shortly afterward, other related alerts appeared in the same incident sequence, including a notice of lateral movement using PSExec to a jump server.'
      question: 'Within this same incident, investigators also received the alert "Windows Sysinternals tool renamed." According to that alert, what is the name of the executable that was renamed and executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An external attacker initiated the incident by remotely launching a ransomware payload from IP Address `99.83.111.100` (entity field: Address).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
