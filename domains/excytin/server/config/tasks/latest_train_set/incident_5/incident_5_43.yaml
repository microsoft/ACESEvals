tasks:
  - task_id: incident_5_latest_train_set_task_43
    title: incident_5_latest_train_set_task_43
    description: 'What is the name of the executable that was flagged in the alert "Unknown malware was detected and was active" raised immediately after the file-backup deletion activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a suspected ransomware incident, we observed that on 2024-07-04 at 22:35:00 UTC the account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522) executed the process "vssblatemp.exe" with the command line "vssblatemp.exe delete shadows /all" on host "vnevado-win10r" (AAD Device ID 9d4887ba-0b69-47d6-89bc-9b32787f379e). This activity triggered the alert "File backups were deleted," suggesting typical pre-ransomware behavior. Just seconds later, another alert titled "Unknown malware was detected and was active" was raised on the same machine, indicating the presence of malicious software that Windows Defender had blocked.'
      question: 'What is the name of the executable that was flagged in the alert "Unknown malware was detected and was active" raised immediately after the file-backup deletion activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` deleted all file backups and shadow copies via WMI or VSSAdmin, an action that is typical during a ransomware attack.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
