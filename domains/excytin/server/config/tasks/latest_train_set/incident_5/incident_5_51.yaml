tasks:
  - task_id: incident_5_latest_train_set_task_51
    title: incident_5_latest_train_set_task_51
    description: 'Which specific file name is highlighted in the alert that describes the potentially compromised assets exhibiting ransomware-like behavior?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a security incident on July 4 2024, an alert reported a possible attempt to access a Primary Refresh Token (PRT) from the host "vnevado-win10s" (device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505). The activity originated from the process "browsercore.exe" (PID 2676, created at 2024-06-20 09:10:59 UTC). Correlation with other alerts from the same timeframe shows that additional devices later raised an alert for ransomware-like behavior potentially linked to the same activity.'
      question: 'Which specific file name is highlighted in the alert that describes the potentially compromised assets exhibiting ransomware-like behavior?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'unstreaming.xlsx'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'unstreaming.xlsx'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account Name: `dp5hn` was involved in a possible attempt to access a Primary Refresh Token (PRT) on 2024-07-04 22:35:01.972458 UTC.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'File Name: `unstreaming.xlsx` is exhibiting ransomware-like behavior and is suspected to be part of the same compromise path.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
