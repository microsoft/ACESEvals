tasks:
  - task_id: incident_5_latest_train_set_task_22
    title: incident_5_latest_train_set_task_22
    description: 'According to the "System recovery setting tampering" alert, what exact command was run to turn off the Windows recovery feature on the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation we observed a Command-and-Control attempt that was blocked on host "vnevado-win11u" (device ID bc00e484-d0e5-4da4-9472-95568cccc07e). The blocked activity originated from process ID 5572, which launched the command line "curl http://vectorsandarrows.com". This shows the attacker already had code-execution capability on the endpoint. Shortly after, a separate alert titled "System recovery setting tampering" was raised on the same device, indicating the adversary tried to disable Windows recovery mechanisms.'
      question: 'According to the "System recovery setting tampering" alert, what exact command was run to turn off the Windows recovery feature on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bcdedit /set recoveryenabled no'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'bcdedit /set recoveryenabled no'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An account with field AadUserId and value `731adb71-b11c-4bbf-850b-57989b350e96` triggered the alert "Command and Control behavior was blocked," indicating that active malware was attempting to communicate with a remote server.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Seconds later, a process with field ProcessId__CreatedTimeUtc__CommandLine and value `4312__2024-06-20t09:10:48.0676225z__bcdedit /set recoveryenabled no` executed, showing that ProcessId `4312` ran the command `bcdedit /set recoveryenabled no` at `2024-06-20t09:10:48.0676225z`, tampering with system-recovery settings.'
        objective: Identify key details related to the potential compromise that might
