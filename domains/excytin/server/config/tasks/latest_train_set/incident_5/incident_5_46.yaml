tasks:
  - task_id: incident_5_latest_train_set_task_46
    title: incident_5_latest_train_set_task_46
    description: 'What URL did the malware attempt to contact in the "Command and Control behavior was blocked" alert that followed the deletion of the system’s shadow copies?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of a ransomware-like incident, analysts observed that all file snapshots and shadow copies were wiped from host "vnevado-win11u" (device ID bc00e484-d0e5-4da4-9472-95568cccc07e) when the process "vssblatemp.exe" executed the command "vssblatemp.exe delete shadows /all" on 2024-06-20. Just one second later, Microsoft Defender raised a "Command and Control behavior was blocked" alert, suggesting the malware tried to contact an external resource.'
      question: 'What URL did the malware attempt to contact in the "Command and Control behavior was blocked" alert that followed the deletion of the system’s shadow copies?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'http://vectorsandarrows.com/'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account (Name: `dp5hn`) executed actions that deleted all file snapshots and shadow copies, indicating possible ransomware activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A Command-and-Control connection attempt to the URL (Url: `http://vectorsandarrows.com/`) was detected and blocked, preventing further malicious communication.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
