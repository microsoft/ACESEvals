tasks:
  - task_id: incident_5_latest_train_set_task_80
    title: incident_5_latest_train_set_task_80
    description: 'During the "Malicious credential theft tool execution detected" alert that fired immediately after the ransomware launch on host "vnevado-win11t", which external IP address was involved in that credential-theft activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'At 22:35:03 UTC on 4 July 2024, a ransomware payload was remotely launched on the Windows 11 host "vnevado-win11t" under the local account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522). Just one second later, an additional alert flagged the execution of a known credential-theft tool on the same device, indicating that the attacker was attempting to dump user credentials.'
      question: 'During the "Malicious credential theft tool execution detected" alert that fired immediately after the ransomware launch on host "vnevado-win11t", which external IP address was involved in that credential-theft activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.224.99.179'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The ransomware payload was remotely launched from the IP address `99.83.111.100`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Attackers then used PSExec for lateral movement to the jump server while operating under the account with SID `S-5-7-21-1843151660-3234030288-105586167-1422`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'A malicious credential-theft tool was subsequently executed from the IP address `107.224.99.179`, indicating further compromise.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
