tasks:
  - task_id: incident_5_latest_train_set_task_27
    title: incident_5_latest_train_set_task_27
    description: 'During the follow-up alert that states a ransomware payload was remotely launched, which IP address is associated with that malicious activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'An alert flagged on 2024-07-04 reported that the process with ID 5572 executed a curl command to reach the URL http://vectorsandarrows.com, indicating possible lateral movement by ‘CommandAndControl’ malware. This activity is part of the same incident that later escalated to a ransomware payload being remotely launched on the device.'
      question: 'During the follow-up alert that states a ransomware payload was remotely launched, which IP address is associated with that malicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '99.83.111.100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The ''CommandAndControl'' malware was detected during lateral movement associated with the account Name `dp5hn`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A ransomware payload was remotely launched from the IP Address `99.83.111.100`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
