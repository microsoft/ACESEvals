tasks:
  - task_id: incident_5_latest_train_set_task_75
    title: incident_5_latest_train_set_task_75
    description: 'During the "Possible lateral movement" alert that followed the LSASS access, which remote IP address was identified as the destination involved in that lateral movement?'
    inherit_shared: true
    initial_context:
      incident_context: 'Investigators are analyzing a sequence of alerts that began with "Suspicious access to LSASS service" after a Mimikatz execution was observed. The attacker appeared to elevate privileges on the original host, then attempted lateral movement. This activity was followed shortly by an alert titled "Possible lateral movement" that referenced a remote IP address suspected to be the destination of the attacker’s next step.'
      question: 'During the "Possible lateral movement" alert that followed the LSASS access, which remote IP address was identified as the destination involved in that lateral movement?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '38.142.109.10'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '38.142.109.10'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious credential dumping activity was detected when the account with Sid `S-5-7-21-1843151660-3234030288-105586167-1422` accessed the LSASS service.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
