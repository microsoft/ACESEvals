tasks:
  - task_id: incident_5_latest_train_set_task_28
    title: incident_5_latest_train_set_task_28
    description: 'What is the name of the executable that invoked the command to delete all shadow copies, as reported in the ''File backups were deleted'' alert at 2024-07-04 22:35:00 UTC?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of a Command and Control (C2) attempt, analysts observed a process (PID 1332) launching a curl command to reach the domain http://vectorsandarrows.com. This activity was blocked and flagged as potential malware behavior. Shortly before this activity, another alert (''File backups were deleted'') indicated that a separate process had executed a command to remove all Volume Shadow Copies, a tactic frequently associated with ransomware attempting to prevent system recovery.'
      question: 'What is the name of the executable that invoked the command to delete all shadow copies, as reported in the ''File backups were deleted'' alert at 2024-07-04 22:35:00 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vssblatemp.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A command-and-control attempt was blocked on the host whose AadDeviceId is `9d4887ba-0b69-47d6-89bc-9b32787f379e`, indicating active malware on that machine.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Soon after, the process entry with value `7236__2024-06-20t09:10:51.2193152z__vssblatemp.exe delete shadows /all` (field ProcessId__CreatedTimeUtc__CommandLine) shows that `vssblatemp.exe` (PID 7236) ran at 2024-06-20 09:10:51 UTC and deleted all VSS shadow copies, a technique commonly used by ransomware to remove file backups.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
