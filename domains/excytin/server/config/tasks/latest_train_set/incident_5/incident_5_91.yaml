tasks:
  - task_id: incident_5_latest_train_set_task_91
    title: incident_5_latest_train_set_task_91
    description: 'In the follow-up alert that signalled "Possible ransomware activity based on a known malicious extension", what is the name of the file that was observed being modified?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we saw an alert titled "Possible attempt to access Primary Refresh Token (PRT)" on July 4, which originated from the external IP address 107.224.99.179 and involved a suspicious PowerShell command executed as powershell.exe, followed moments later by browsercore.exe on the same device. Just seconds after this initial activity, another alert fired on that device indicating widespread file-system changes consistent with ransomware behaviour (files being renamed with a known malicious extension).'
      question: 'In the follow-up alert that signalled "Possible ransomware activity based on a known malicious extension", what is the name of the file that was observed being modified?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'characterical.zip'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious activity began with a possible attempt to access a Primary Refresh Token on the host identified by AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
