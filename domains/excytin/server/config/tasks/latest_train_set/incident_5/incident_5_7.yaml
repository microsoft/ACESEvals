tasks:
  - task_id: incident_5_latest_train_set_task_7
    title: incident_5_latest_train_set_task_7
    description: 'According to the related alert that occurred at 22:35:00 UTC, what is the name of the additional ransomware-related archive that was dropped by the compromised user account?'
    inherit_shared: true
    initial_context:
      incident_context: 'On host "vnevado-win11t" (AadDeviceId: e5799261-6720-4297-961e-bd9ca4275033), an alert titled "Possible compromised user account delivering ransomware-related files" was raised at 2024-07-04 22:35:01 UTC. During this alert, the compromised user was seen dropping ransomware-associated files such as "characterical.zip" and its encrypted counterpart "characterical.zip.lockbit". A nearly simultaneous, related alert (triggered just a fraction of a second earlier) referenced an additional malicious archive whose name is not shown in the current context.'
      question: 'According to the related alert that occurred at 22:35:00 UTC, what is the name of the additional ransomware-related archive that was dropped by the compromised user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ponceau.7z'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'ponceau.7z'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The compromised user account was observed dropping ransomware-related file (Field: Name, Value: `get-userprttoken.ps1`) on multiple devices at 2024-07-04 22:35:01.491898 +00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Moments earlier, the same compromised account also dropped another ransomware-related file (Field: Name, Value: `ponceau.7z`) at 2024-07-04 22:35:00.773532 +00:00.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
