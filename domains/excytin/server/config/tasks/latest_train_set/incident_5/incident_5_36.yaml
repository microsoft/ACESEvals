    title: incident_5_latest_train_set_task_36
    description: 'Which user account was responsible for the suspicious WMI process creation detected right after the renamed Sysinternals tool was launched on 2024-07-04?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of an attack sequence that began when a Windows Sysinternals tool was renamed and executed (detected on 2024-07-04 22:35 UTC), analysts noted several related events. These included the launch of tools such as "mimikatz.exe" and attempts at lateral movement via PSExec to the server vnevado-jump, followed by SMB file-share activity blocked across multiple devices. Immediately after the renamed Sysinternals execution, another alert flagged a suspicious WMI-based process creation on the same machine—an action frequently used by malware to spawn child processes and evade standard monitoring.'
      question: 'Which user account was responsible for the suspicious WMI process creation detected right after the renamed Sysinternals tool was launched on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
