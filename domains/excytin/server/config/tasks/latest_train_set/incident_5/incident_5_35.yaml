tasks:
  - task_id: incident_5_latest_train_set_task_35
    title: incident_5_latest_train_set_task_35
    description: 'What was the name of the executable that the later alert identified as the active unknown malware on the affected device?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04, the device named “vnevado-win11t” (AAD device ID e5799261-6720-4297-961e-bd9ca4275033) raised an alert for suspicious “GenRansom” behaviour, suggesting ransomware-style activity. A few seconds later, another alert reported that an unknown piece of malware was actively running on the same machine, indicating the threat had already achieved execution and persistence.'
      question: 'What was the name of the executable that the later alert identified as the active unknown malware on the affected device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious ''GenRansom'' behavior was detected on the host with HostName `vnevado-win11t`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
