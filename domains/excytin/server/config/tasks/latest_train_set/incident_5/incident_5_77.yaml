tasks:
  - task_id: incident_5_latest_train_set_task_77
    title: incident_5_latest_train_set_task_77
    description: 'According to the Mimikatz credential theft alert that followed the recovery-setting tampering, what is the name of the driver file that was detected on the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we observed system-recovery tampering on host "vnevado-win10s". The attacker, using account "dp5hn", ran commands such as "vssblatemp.exe delete shadows /all" and "bcdedit /set recoveryenabled no", which are often used to disable Windows recovery options. Just seconds later another alert was raised on the same device indicating that the well-known credential-theft tool Mimikatz had been detected.'
      question: 'According to the Mimikatz credential theft alert that followed the recovery-setting tampering, what is the name of the driver file that was detected on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimidrv.sys'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimidrv.sys'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity originated from IP.Address `99.83.111.100`, suggesting an external attacker gained a foothold.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Using account.Name `dp5hn`, the attacker tampered with system recovery settings to disable backups and hinder system recovery.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
