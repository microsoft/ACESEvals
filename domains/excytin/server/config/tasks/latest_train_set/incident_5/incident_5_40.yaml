tasks:
  - task_id: incident_5_latest_train_set_task_40
    title: incident_5_latest_train_set_task_40
    description: 'According to the "PsExec launched a command on a remote device" alert generated at 2024-07-04 22:35:01 UTC, which executable was launched remotely using PsExec?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a lateral-movement incident, we observed the following sequence: an account named "dp5hn" executed a suspicious curl command from host "vnevado-win11t" (alert titled "''CommandAndControl'' malware was detected during lateral movement"). Moments later, multiple related alerts were raised, eventually leading to an alert at 2024-07-04 22:35:01 UTC indicating that PsExec had been used to launch a command on a remote device. Analysts must identify exactly what binary was executed via PsExec in that final alert.'
      question: 'According to the "PsExec launched a command on a remote device" alert generated at 2024-07-04 22:35:01 UTC, which executable was launched remotely using PsExec?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cmd.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'cmd.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'PsExec with ProcessId__CreatedTimeUtc__CommandLine `8656__2024-06-20t09:07:09.5458894z__cmd.exe` was used to launch a remote command, indicating the start of lateral movement.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
