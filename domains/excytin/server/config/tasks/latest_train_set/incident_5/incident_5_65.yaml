      incident_context: 'Security monitoring detected a possible attempt to access a Primary Refresh Token (PRT) on host "vnevado-win11t" under account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522). Just a few seconds later, another alert was raised on the same machine indicating that a known credential-theft tool was executed, suggesting the attacker may have tried to dump user credentials.'
      question: 'According to the follow-up alert titled "Malicious credential theft tool execution detected" at 22:35:04 UTC, what is the name of the executable that was identified as running during this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
