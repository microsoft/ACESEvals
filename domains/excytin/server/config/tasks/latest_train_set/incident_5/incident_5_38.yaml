tasks:
  - task_id: incident_5_latest_train_set_task_38
    title: incident_5_latest_train_set_task_38
    description: 'What is the external IP address that remotely launched the ransomware payload on host "vnevado-win10r"?'
    inherit_shared: true
    initial_context:
      incident_context: 'During incident triage we observed system recovery settings being tampered with on host "vnevado-win10r". Specifically, the executable "vssblatemp.exe" was used to delete all shadow copies (PID 7236, executed at 2024-06-20T09:10:51Z) and the command "bcdedit /set recoveryenabled no" (PID 4312) was run to disable Windows recovery. These activities indicate an attempt to hinder restoration options prior to a larger attack. Immediately after this tampering, another alert was raised stating that a ransomware payload was remotely launched on the same device.'
      question: 'What is the external IP address that remotely launched the ransomware payload on host "vnevado-win10r"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '99.83.111.100'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'System recovery settings were tampered with by an account whose SID is `S-1-5-21-1840191660-8534830288-125585561-1522`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
