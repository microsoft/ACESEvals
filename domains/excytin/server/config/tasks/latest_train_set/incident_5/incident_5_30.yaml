tasks:
  - task_id: incident_5_latest_train_set_task_30
    title: incident_5_latest_train_set_task_30
    description: 'What is the file name of the DLL that was flagged when the Mimikatz credential theft tool was detected on the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'Incident review: On July 4 2024, the endpoint "vnevado-win11t" (AadDeviceId: e5799261-6720-4297-961e-bd9ca4275033) generated a "Suspicious remote activity" alert. The activity involved the local account "dp5hn" executing several commands, such as disabling recovery options with "bcdedit" and deleting volume-shadow copies via "vssblatemp.exe". These actions suggest an attempt to hinder system recovery and may precede additional malicious behavior like credential theft. Shortly after, another alert indicated that the well-known credential-dumping tool Mimikatz was found on the same machine.'
      question: 'What is the file name of the DLL that was flagged when the Mimikatz credential theft tool was detected on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimilib.dll'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity originated from the IP address with field Address=`99.83.111.100`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
