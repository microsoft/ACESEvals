tasks:
  - task_id: incident_5_latest_train_set_task_62
    title: incident_5_latest_train_set_task_62
    description: 'According to the alert that reported the credential-theft tool execution, what IP address was involved in that activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-10 our monitoring flagged a lateral-movement attempt on host "vnevado-win11t" that was automatically blocked when the user account "Grace Chen" tried to modify files over SMB. Shortly afterwards, PSExec activity toward the internal jump server was recorded. Earlier in the same incident, Defender detected the execution of a known credential-theft tool, suggesting the attacker was trying to collect credentials before moving laterally.'
      question: 'According to the alert that reported the credential-theft tool execution, what IP address was involved in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '107.224.99.179'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Step 1 – Malicious credential dump: A known credential-theft tool was executed from the machine communicating with IP Address `107.224.99.179` (Field: Address, Value: 107.224.99.179).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
