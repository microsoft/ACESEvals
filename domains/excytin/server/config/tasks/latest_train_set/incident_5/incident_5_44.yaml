tasks:
  - task_id: incident_5_latest_train_set_task_44
    title: incident_5_latest_train_set_task_44
    description: 'What is the name of the executable that was remotely launched to issue the "delete shadows /all" command?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the same timeframe in which several files (e.g., get-userprttoken.ps1, characterical.zip, characterical.zip.lockbit) were modified with a known ransomware-related extension, telemetry also recorded a suspicious remote session. In that remote session, a process was launched that executed the command "delete shadows /all", indicating an attempt to remove Volume Shadow Copies before (or while) encrypting data. The exact executable name used in this command has not yet been identified.'
      question: 'What is the name of the executable that was remotely launched to issue the "delete shadows /all" command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vssblatemp.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Possible ransomware encryption was observed under the account (Name) `dp5hn`, which appended a known malicious extension to many files.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Suspicious remote activity ran the process (ProcessId__CreatedTimeUtc__CommandLine) `1900__2024-06-20t09:29:40.8785892z__vssblatemp.exe delete shadows /all`, attempting to delete shadow copies on the machine.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
