tasks:
  - task_id: incident_5_latest_train_set_task_55
    title: incident_5_latest_train_set_task_55
    description: 'According to the "Suspicious WMI process creation" alert raised at 22:35:03 UTC on 2024-07-04, what is the host name of the machine where this activity was observed?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a possible ransomware incident, the device with host name "vnevado-win11u" (AAD device ID bc00e484-d0e5-4da4-9472-95568cccc07e) generated an alert titled "Ransomware behavior detected in the file system." This was quickly followed by another alert indicating that multiple assets were exhibiting ransomware-like behavior. Only a few seconds later, security telemetry reported a separate alert for a "Suspicious WMI process creation" on a different machine, suggesting that the attacker might be pivoting between hosts using WMI to spawn malicious processes.'
      question: 'According to the "Suspicious WMI process creation" alert raised at 22:35:03 UTC on 2024-07-04, what is the host name of the machine where this activity was observed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10r'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-win10r'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The potentially compromised account (Name: `dp5hn`) is exhibiting ransomware-like behavior that could be used for lateral movement.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious WMI process was then created on the host (HostName: `vnevado-win10r`), indicating malware execution on that machine.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
