tasks:
  - task_id: incident_5_latest_train_set_task_24
    title: incident_5_latest_train_set_task_24
    description: 'According to the alert that reported an "Active unknown malware was detected" at 2024-07-04 22:35:03 UTC, what is the name of the malicious file that was identified?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a command-and-control (C2) behavior originating from the URL http://vectorsandarrows.com/ was blocked on 2024-07-04. This activity indicated active malware communicating with a remote attacker. Shortly afterward, the security system raised additional alerts: one for a possibly compromised user account dropping ransomware-related files, and another for lateral movement via PSExec to a jump server named Vnevado-jump. Within the same timeframe, a separate alert reported that an active piece of unknown malware had been detected running on a device, suggesting that the threat had already achieved persistence.'
      question: 'According to the alert that reported an "Active unknown malware was detected" at 2024-07-04 22:35:03 UTC, what is the name of the malicious file that was identified?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Command-and-control activity was blocked for the account with field Sid and value `S-1-5-21-1840191660-8534830288-125585561-1522`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Ransomware-related files were dropped from the source with field Address and value `99.83.111.100`.'
        objective: Identify key details related to the potential compromise that might
