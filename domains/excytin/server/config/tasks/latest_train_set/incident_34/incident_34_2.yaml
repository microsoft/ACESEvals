tasks:
  - task_id: incident_34_latest_train_set_task_2
    title: incident_34_latest_train_set_task_2
    description: 'Which executable was responsible for creating the anomalous scheduled task detected at 22:35:01 UTC on 2024-07-04?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, we observed that the document ‘rs4_winatp-intro-invoice.docm’ was opened with the process `winword.exe` (Process ID 9780) on 2024-07-04 at 22:35 UTC. Immediately afterward, this Word session executed a suspicious PowerShell command to download or run encoded content, an activity frequently leveraged by attackers for in-memory execution. A few seconds later, security telemetry reported that a new and anomalous scheduled task was created on the same host—often a sign of an attempt to establish persistence.'
      question: 'Which executable was responsible for creating the anomalous scheduled task detected at 22:35:01 UTC on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'schtasks.exe'
      scoring:
        max_score: 1.0
