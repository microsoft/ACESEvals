tasks:
  - task_id: incident_34_latest_train_set_task_22
    title: incident_34_latest_train_set_task_22
    description: 'According to the alert about the anomalous scheduled task, which executable was invoked to create that task?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a persistence-related incident, we observed that an external IP address 72.5.72.208 was involved when a registry RunOnce entry was added to launch the file "winatp-intro-backdoor.exe" after reboot. Just seconds earlier, a separate alert reported that an anomalous scheduled task called "yrei" was created – a common technique for maintaining access after system restarts.'
      question: 'According to the alert about the anomalous scheduled task, which executable was invoked to create that task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'powershell.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The process with field ProcessId__CreatedTimeUtc__CommandLine and value `8604__2024-06-26t12:00:39.2886108z__"powershell.exe" -w movedn -exec bypass -command ...` was executed to create an anomalous scheduled task, suggesting an attempt at persistence.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The attacker account with field AadUserId and value `16320fec-8d90-403b-b7fe-78f715d4728d` created an uncommon file and added it to a Run registry key so it will launch automatically after a reboot.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
