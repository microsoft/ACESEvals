tasks:
  - task_id: incident_34_latest_train_set_task_33
    title: incident_34_latest_train_set_task_33
    description: 'Which account was identified as initiating the suspicious Task Scheduler activity detected immediately after the automated investigation began on host vnevado-win10e?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04, an analyst manually kicked off an automated investigation on host vnevado-win10e (device ID 02b8f519-1123-4228-b32a-ccb78af3449f). Only a second after the investigation began, Microsoft Defender surfaced a new alert on the same machine: “Suspicious Task Scheduler activity,” indicating that a process previously flagged as malicious attempted to create, modify, or delete a scheduled task—likely an effort to establish persistence.'
      question: 'Which account was identified as initiating the suspicious Task Scheduler activity detected immediately after the automated investigation began on host vnevado-win10e?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'samuelf'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An automated investigation was manually triggered on the device whose AadDeviceId is `02b8f519-1123-4228-b32a-ccb78af3449f`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'During the investigation, a Suspicious Task Scheduler activity was detected that involved the account Name `samuelf`, indicating a possible persistence attempt.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
