tasks:
  - task_id: incident_34_latest_train_set_task_28
    title: incident_34_latest_train_set_task_28
    description: 'A closely-related alert called "Suspicious PowerShell command line" was triggered on the same endpoint moments earlier and refers to the payload the script tried to use. What is the file name of that payload?'
    inherit_shared: true
    initial_context:
      incident_context: 'On host vnevado-win10e, signed in as user account ''samuelf'', a detection titled "Suspicious PowerShell download or encoded command execution" was raised at 22:35:01 UTC on 2024-07-04. The alert noted that PowerShell was launched, suggesting an attempt to download or execute a payload from memory – a common attacker tactic to evade disk-based defenses.'
      question: 'A closely-related alert called "Suspicious PowerShell command line" was triggered on the same endpoint moments earlier and refers to the payload the script tried to use. What is the file name of that payload?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winatp-intro-backdoor.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious PowerShell command line activity involved the file with Name `winatp-intro-backdoor.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, a process executed PowerShell (`ExtractedFileName = powershell.exe`) to download a file or run an encoded command.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
