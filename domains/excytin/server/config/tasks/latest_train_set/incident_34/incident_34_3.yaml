tasks:
  - task_id: incident_34_latest_train_set_task_3
    title: incident_34_latest_train_set_task_3
    description: 'According to the “Suspicious Task Scheduler activity” alert raised at 2024-07-04 22:35:01 UTC, which executable was used to run the scheduled task named "yrei"?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, analysts observed that on host vnevado-win10e (device ID 02b8f519-1123-4228-b32a-ccb78af3449f) a suspicious PowerShell command was executed by user account ‘samuelf’. Just one second later, another alert titled “Suspicious Task Scheduler activity” was generated, indicating that the same workflow attempted to launch a scheduled task named “yrei” – a common tactic to achieve persistence.'
      question: 'According to the “Suspicious Task Scheduler activity” alert raised at 2024-07-04 22:35:01 UTC, which executable was used to run the scheduled task named "yrei"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'schtasks.exe'
      scoring:
        max_score: 1.0
