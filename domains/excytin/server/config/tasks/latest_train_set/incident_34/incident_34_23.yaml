tasks:
  - task_id: incident_34_latest_train_set_task_23
    title: incident_34_latest_train_set_task_23
    description: 'According to the alert about the uncommon file being added to a Run Key, which IP address is associated with this activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'A few seconds after a suspicious PowerShell command was executed—one that dropped a file named "winatp-intro-backdoor.exe" on the desktop and scheduled it to run via the task "yrei"—another alert was generated. This follow-up alert states that an uncommon file was created and added to a Run Key, suggesting the attacker is attempting to establish persistence on the same machine.'
      question: 'According to the alert about the uncommon file being added to a Run Key, which IP address is associated with this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious process executed a PowerShell command on host with HostName `vnevado-win10e`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'An uncommon file was created and added to a Run Key from IP Address `72.5.72.208`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
