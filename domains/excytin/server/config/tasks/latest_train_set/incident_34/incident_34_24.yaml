tasks:
  - task_id: incident_34_latest_train_set_task_24
    title: incident_34_latest_train_set_task_24
    description: 'Which on-premises user account name was ultimately linked to the follow-up activity associated with the suspicious LDAP query?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a suspicious LDAP query originating from the workstation vnevado-win10e, analysts observed that the query was executed from the process "winword.exe" (PID 9780) launched by a user whose SID is S-1-5-21-1870156660-7534030218-135086563-1193. This activity suggests reconnaissance aimed at enumerating users and groups within the domain, a common precursor to privilege-escalation attempts. A related alert in the same incident pointed to a specific on-premises user account that appears to have been involved in follow-up activity tied to the LDAP reconnaissance.'
      question: 'Which on-premises user account name was ultimately linked to the follow-up activity associated with the suspicious LDAP query?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'samuelf'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account Name: `samuelf` performed a suspicious LDAP query, indicating potential reconnaissance activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
