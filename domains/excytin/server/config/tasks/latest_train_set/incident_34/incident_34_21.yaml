tasks:
  - task_id: incident_34_latest_train_set_task_21
    title: incident_34_latest_train_set_task_21
    description: 'According to the "Anomaly detected in ASEP registry" alert that immediately followed the suspicious PowerShell activity, what IP address is associated with this persistence attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'During a recent investigation, we observed a suspicious PowerShell command launched from the file "powershell.exe" (Process ID 8604) on an endpoint (host name withheld). The script wrote a back-door executable to disk and created a scheduled task named "yrei" for persistence. Just seconds later, another alert titled "Anomaly detected in ASEP registry" indicated that a process had registered a suspicious command to run after reboot, suggesting an attempt to maintain long-term access.'
      question: 'According to the "Anomaly detected in ASEP registry" alert that immediately followed the suspicious PowerShell activity, what IP address is associated with this persistence attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious process executed a PowerShell command on host with HostName `vnevado-win10e`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, an anomaly was detected in the ASEP registry originating from the IP Address `72.5.72.208`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
