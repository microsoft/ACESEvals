tasks:
  - task_id: incident_34_latest_train_set_task_1
    title: incident_34_latest_train_set_task_1
    description: 'In the subsequent alert titled "Suspicious PowerShell command line", the process "schtasks.exe" was used to run the task that had just been created. What is the name of that scheduled task?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into a PowerShell-based intrusion on host "vnevado-win10e", we observed that PowerShell (executed by user "samuelf") dropped and launched a back-door executable. As part of the same script, a scheduled task was first created and then invoked, but the exact task name was not logged in the initial alert.'
      question: 'In the subsequent alert titled "Suspicious PowerShell command line", the process "schtasks.exe" was used to run the task that had just been created. What is the name of that scheduled task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'yrei'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'yrei'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious PowerShell activity was observed: process field `ProcessId__CreatedTimeUtc__CommandLine` had the value `1616__2024-06-26t12:00:40.6793914z__"schtasks.exe" /run /tn yrei`, indicating schtasks.exe was invoked via PowerShell.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, PowerShell dropped and executed a suspicious file on the machine while running under the account field `Name` with value `samuelf`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
