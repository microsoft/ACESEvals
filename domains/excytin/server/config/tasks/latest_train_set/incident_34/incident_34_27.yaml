tasks:
  - task_id: incident_34_latest_train_set_task_27
    title: incident_34_latest_train_set_task_27
    description: 'Around the same time as the suspicious scheduled task was created, another alert reported that a process had registered a malicious command in an Auto-Start Extension Point (ASEP) registry key. Which external IP address is associated with this ASEP registry anomaly?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a recent security incident, we observed that an attacker used PowerShell (`powershell.exe`) to drop a file named `winatp-intro-backdoor.exe` onto the desktop of user **SamuelF** and then created a one-time scheduled task (`schtasks.exe`) called `yrei` to run that file. This activity was captured in the alert titled “An anomalous scheduled task was created,” indicating a likely attempt at establishing persistence on the affected endpoint.'
      question: 'Around the same time as the suspicious scheduled task was created, another alert reported that a process had registered a malicious command in an Auto-Start Extension Point (ASEP) registry key. Which external IP address is associated with this ASEP registry anomaly?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '72.5.72.208'
      scoring:
        max_score: 1.0
