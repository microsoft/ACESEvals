tasks:
  - task_id: incident_34_latest_train_set_task_5
    title: incident_34_latest_train_set_task_5
    description: 'According to the alert about the anomalous scheduled task, what name did the attacker give to the task when creating it with schtasks.exe?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a suspicious PowerShell activity on host "vnevado-win10e", analysts observed a lengthy, encoded PowerShell command that wrote a file named "winatp-intro-backdoor.exe" to the user’s Desktop. Shortly afterward, a second alert reported that schtasks.exe had been used to create a one-time scheduled task pointing to this backdoor—an indicator the attacker was attempting to establish persistence.'
      question: 'According to the alert about the anomalous scheduled task, what name did the attacker give to the task when creating it with schtasks.exe?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'yrei'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'yrei'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'On host `HostName: vnevado-win10e`, PowerShell was executed to download a file or run an encoded command, indicating possible payload delivery or in-memory execution.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A suspicious scheduled task was created via `ProcessId__CreatedTimeUtc__CommandLine: 1348__2024-06-26t12:00:40.0878355z__"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f`, suggesting the attacker established persistence to launch the backdoor executable.'
        objective: Identify key details related to the potential compromise that might
