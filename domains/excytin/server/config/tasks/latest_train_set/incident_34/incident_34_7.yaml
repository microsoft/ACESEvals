tasks:
  - task_id: incident_34_latest_train_set_task_7
    title: incident_34_latest_train_set_task_7
    description: 'To complete the host profile for this incident, identify the Azure AD device ID (AadDeviceId) of the machine where the malicious RunOnce entry was created.'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of an alert titled "An uncommon file was created and added to a Run Key" (triggered on 2024-07-04), we observed suspicious persistence activity on host "vnevado-win10e" (IP 72.5.72.208). The executable "winatp-intro-backdoor.exe" was added to the user’s RunOnce registry location via the command line `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe`. This change was performed under account "samuelf" (SID S-1-5-21-1870156660-7534030218-135086563-1193, Azure AD user ID 16320fec-8d90-403b-b7fe-78f715d4728d).'
      question: 'To complete the host profile for this incident, identify the Azure AD device ID (AadDeviceId) of the machine where the malicious RunOnce entry was created.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '02b8f519-1123-4228-b32a-ccb78af3449f'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '02b8f519-1123-4228-b32a-ccb78af3449f'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An uncommon file was created and added to a Run registry key on the host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f`, indicating a possible persistence mechanism.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 1.0
            weight: 1.0
