tasks:
  - task_id: incident_34_latest_train_set_task_19
    title: incident_34_latest_train_set_task_19
    description: 'According to the ‘Suspicious PowerShell command line’ alert triggered at 22:35 UTC on 2024-07-04, what is the name of the executable that the malicious PowerShell script attempted to invoke?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation we observed that the external IP address 72.5.72.208 was involved in registering a suspicious command in an Auto-Start Extensibility Point (ASEP) registry key on 2024-07-04 22:35 UTC. This technique is often used to preserve malware persistence after a reboot. A few seconds earlier on the same host, Microsoft Defender also raised an alert for a ‘Suspicious PowerShell command line’, suggesting the attacker leveraged PowerShell as part of the intrusion chain.'
      question: 'According to the ‘Suspicious PowerShell command line’ alert triggered at 22:35 UTC on 2024-07-04, what is the name of the executable that the malicious PowerShell script attempted to invoke?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winatp-intro-backdoor.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious PowerShell command line used the file (Field: Name, Value: `winatp-intro-backdoor.exe`).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'The attacker then added an Auto-Start Extensibility Point (ASEP) registry entry under the account (Field: Sid, Value: `S-1-5-21-1870156660-7534030218-135086563-1193`) to ensure persistence after reboot.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
