tasks:
  - task_id: incident_34_latest_train_set_task_26
    title: incident_34_latest_train_set_task_26
    description: 'Just three seconds later, a related alert reported that PowerShell dropped and executed a suspicious file on the same machine. What is the name of the file that was dropped?'
    inherit_shared: true
    initial_context:
      incident_context: 'On host vnevado-win10e, user account samuelf triggered an alert titled "Suspicious process executed PowerShell command" at 22:35:00 UTC on 2024-07-04. PowerShell was launched by an unidentified executable, suggesting that an attacker might be using in-memory commands to avoid leaving traces on disk.'
      question: 'Just three seconds later, a related alert reported that PowerShell dropped and executed a suspicious file on the same machine. What is the name of the file that was dropped?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winatp-intro-backdoor.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious process executed a PowerShell command; the process’s ExtractedFileName was `winatp-intro-backdoor.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Subsequently, PowerShell dropped and executed a suspicious file whose Name was `winatp-intro-backdoor.exe`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
