tasks:
  - task_id: incident_34_latest_train_set_task_14
    title: incident_34_latest_train_set_task_14
    description: 'The LDAP query was issued from a Word process. What is the full path of the document that Word (winword.exe) tried to open when this alert was raised?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04 we observed an "Anomaly detected in ASEP registry" alert after the executable "winatp-intro-backdoor.exe" was added to the RunOnce key via a REG ADD command. This suspicious persistence change was made from a process running under PID 10208, and the same host subsequently generated a "Suspicious LDAP query" alert—suggesting possible follow-up reconnaissance activity.'
      question: 'The LDAP query was issued from a Word process. What is the full path of the document that Word (winword.exe) tried to open when this alert was raised?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'c:\scripts\rs4_winatp-intro-invoice.docm'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'c:\scripts\rs4_winatp-intro-invoice.docm'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A process registered a suspicious command or file in an ASEP registry key, performed by the account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Soon after, a suspicious LDAP query was executed by the process with ProcessId `9780`, CreatedTimeUtc `2024-06-26t11:57:20.2959493z`, and CommandLine `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
