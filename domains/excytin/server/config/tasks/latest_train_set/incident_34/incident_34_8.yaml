tasks:
  - task_id: incident_34_latest_train_set_task_8
    title: incident_34_latest_train_set_task_8
    description: 'Which executable (process name) was responsible for launching the command that performed the suspicious LDAP query detected immediately after the PowerShell activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a security incident on July 4 2024, a suspicious process ran a lengthy PowerShell command that wrote a file named "winatp-intro-backdoor.exe" to the system and scheduled it to run. This activity originated from the executable "powershell.exe". Moments later, a separate alert flagged a suspicious LDAP query, indicating potential directory reconnaissance.'
      question: 'Which executable (process name) was responsible for launching the command that performed the suspicious LDAP query detected immediately after the PowerShell activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'winword.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The user account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` executed a suspicious PowerShell command.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Moments later, the process with ProcessId `9780`, CreatedTime `2024-06-26t11:57:20.2959493z`, and CommandLine `"winword.exe" c:\scripts\rs4_winatp-intro-invoice.docm` initiated a suspicious LDAP query.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
