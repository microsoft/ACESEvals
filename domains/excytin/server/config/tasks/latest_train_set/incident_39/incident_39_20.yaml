tasks:
  - task_id: incident_39_latest_train_set_task_20
    title: incident_39_latest_train_set_task_20
    description: 'A few days earlier, the same incident timeline shows an attempt to disable Microsoft Defender Antivirus, which is usually a sign of defense evasion. What is the account name associated with this antivirus-tampering attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we have identified suspicious activity that began with a suspected identity-theft (pass-the-ticket) attack. The attacker extracted IT director Julian Burke’s Kerberos ticket from host VNEVADO-Win10B and used it on VNEVADO-Win10V to access several resources.'
      question: 'A few days earlier, the same incident timeline shows an attempt to disable Microsoft Defender Antivirus, which is usually a sign of defense evasion. What is the account name associated with this antivirus-tampering attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'fk8mq'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Account|Name: `fk8mq` attempted to disable Microsoft Defender Antivirus on 2024-07-04 22:35:03, indicating tampering with endpoint protection.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Account|AadUserId: `97e6a954-b6bd-48a5-808c-bd8464cce677` initiated a suspected overpass-the-hash attack on 2024-07-10 11:24:45, trying to authenticate against Host|HostName: `VNEVADO-DC`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Host|HostName: `VNEVADO-DC` was also the target of a suspected pass-the-ticket attack on 2024-07-10 11:24:45, where Julian Burke’s Kerberos ticket was reused from another machine.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
