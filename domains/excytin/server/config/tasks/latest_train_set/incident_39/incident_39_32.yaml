tasks:
  - task_id: incident_39_latest_train_set_task_32
    title: incident_39_latest_train_set_task_32
    description: 'Separate from the initial activity, a later alert flagged a suspected overpass-the-hash (Kerberos) attempt originating from VNEVADO-Win10V against the domain controller. What is the email address of the account that tried to authenticate in this suspected attack?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a potential human-operated malicious activity on host "vnevado-win10b" (device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb), several user accounts such as "fk8mq" and "kyleg" were seen active, together with traffic from IP address 141.216.110.153. This sequence of alerts raised concerns that the device might be staging for more serious follow-on actions like ransomware deployment.'
      question: 'Separate from the initial activity, a later alert flagged a suspected overpass-the-hash (Kerberos) attempt originating from VNEVADO-Win10V against the domain controller. What is the email address of the account that tried to authenticate in this suspected attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Emma Clark@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Emma Clark@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` was involved in activity flagged as potential human-operated malicious behavior.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, the account with Email `Emma Clark@vnevado.alpineskihouse.co` attempted an overpass-the-hash Kerberos authentication from host VNEVADO-Win10V to VNEVADO-DC.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
