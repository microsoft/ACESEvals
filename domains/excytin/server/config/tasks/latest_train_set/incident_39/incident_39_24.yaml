    title: incident_39_latest_train_set_task_24
    description: 'What was the full command line of the process that was used to stop the services on the device?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation of a lateral-movement attempt, we saw a remote session drop and run the file "psexesvc.exe" (PID 7668) from IP 141.216.110.153 on 2024-06-27. Shortly after, a second alert reported that a different process on the same device intentionally stopped Windows services—an action often used by attackers to disable defenses before continuing their attack.'
      question: 'What was the full command line of the process that was used to stop the services on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '"net.exe" stop ntds /y'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '"net.exe" stop ntds /y'
      scoring:
        max_score: 1.0
