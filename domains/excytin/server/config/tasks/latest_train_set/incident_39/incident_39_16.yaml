tasks:
  - task_id: incident_39_latest_train_set_task_16
    title: incident_39_latest_train_set_task_16
    description: 'According to the deceptive sign-in alert, what is the Security Identifier (SID) of the suspicious user account that attempted to sign in?'
    inherit_shared: true
    initial_context:
      incident_context: 'A malicious credential-theft tool (mimikatz.exe) was executed on one of the endpoints with the command line:
"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit
Immediately afterwards, Microsoft Defender raised a separate alert titled "Sign-in attempt with deceptive user account," indicating that an attacker may have tried to log on using a decoy account on the same device.'
      question: 'According to the deceptive sign-in alert, what is the Security Identifier (SID) of the suspicious user account that attempted to sign in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-0-6-5'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in attempt was detected from a deceptive user account with Name `kyleg`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
