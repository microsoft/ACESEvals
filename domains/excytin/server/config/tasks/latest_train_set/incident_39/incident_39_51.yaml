    title: incident_39_latest_train_set_task_51
    description: 'According to the PsExec alert that immediately followed the credential-dump activity, what is the name of the file that PsExec attempted to execute on the remote device?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of a recent multi-stage security incident involving Execution & Discovery on one endpoint was reported by Microsoft Defender Advanced Threat Protection along with 11 flagged alerts. As part of investigating this incident, we observed a file `ntdsutil.exe` was launched with this command line: `ntdsutil.exe ac i ntds ifm create full c:  emp q q`. The Process ID was 6748. This process might be an indicator of an attacker dumping NTDS.dit in order to obtain user''s credentials which are stored in the domain controller.'
      question: 'According to the PsExec alert that immediately followed the credential-dump activity, what is the name of the file that PsExec attempted to execute on the remote device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'adminticket.txt'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'adminticket.txt'
      scoring:
        max_score: 1.0
