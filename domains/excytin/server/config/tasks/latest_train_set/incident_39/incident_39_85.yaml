    title: incident_39_latest_train_set_task_85
    description: 'According to the "Possible lateral movement" alert that was raised shortly after the service-stopping activity, what is the name of the workstation the attacker is suspected to have moved to?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4, 2024, Microsoft Defender for Endpoint raised an alert titled "Suspicious process stopping services" on host vnevado-dc. The activity involved the user account "lucasb" launching the commands "powershell.exe" and "net.exe" to stop the NTDS service—behavior often associated with attempts to disable security controls before further malicious actions. A few days later, additional alerts suggested identity-theft activity (pass-the-ticket) and indicated that the attacker might have moved to another workstation in the environment.'
      question: 'According to the "Possible lateral movement" alert that was raised shortly after the service-stopping activity, what is the name of the workstation the attacker is suspected to have moved to?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10b'
