    title: incident_39_latest_train_set_task_78
    description: 'According to the SID history injection alert that followed these events, what is the name of the file involved in this privileged-escalation attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation into potential human-operated malicious activity on host "vnevado-win10b", we observed several suspicious processes, including a PowerShell command that disabled real-time monitoring and the execution of the credential-theft tool Rubeus. Shortly afterward, multiple dual-purpose tools were dropped to the device, and a subsequent alert reported a SID history injection—an attack technique often used to grant elevated privileges by manipulating Security Identifiers (SIDs).'
      question: 'According to the SID history injection alert that followed these events, what is the name of the file involved in this privileged-escalation attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
