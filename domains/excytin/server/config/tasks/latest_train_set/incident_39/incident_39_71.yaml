tasks:
  - task_id: incident_39_latest_train_set_task_71
    title: incident_39_latest_train_set_task_71
    description: 'Which executable was invoked to carry out the suspicious account-creation command detected immediately after the Mimikatz activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'At 22:35 UTC on 4 July 2024, Microsoft Defender raised an alert after the well-known credential-theft utility "mimikatz.exe" ran with a DCSync command against the vnevado.alpineskihouse.co domain. Just one second later, a second alert flagged that a new user account had been created on the same device—likely an attacker attempt to establish persistence. Details of the exact command used in that second event are not shown here, but they point to a built-in system tool being invoked to add the account.'
      question: 'Which executable was invoked to carry out the suspicious account-creation command detected immediately after the Mimikatz activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'net.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'net.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'On the host identified by AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, a malicious credential-theft tool execution was detected.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A process with ProcessId `3624` started at `2024-06-27t14:33:43.4299474z` using CommandLine `"net.exe" user /add bdadmin password1! /domain`, indicating a suspicious account creation.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
