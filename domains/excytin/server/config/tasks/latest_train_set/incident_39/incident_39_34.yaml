tasks:
  - task_id: incident_39_latest_train_set_task_34
    title: incident_39_latest_train_set_task_34
    description: 'What is the name of the executable file that was detected by the July 4 2024 credential-theft (Mimikatz) alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 10 2024, the account “Ethan Brooks” was observed from host VNEVADO-Win10V performing SMB enumeration against the domain controller VNEVADO-DC, likely gathering information about recent IP sessions. During the wider investigation, another alert—dated July 4 2024—reported that a well-known credential-theft tool had been detected on a device in the environment. Analysts need to identify the specific malicious executable associated with that credential-theft alert in order to scope further response actions.'
      question: 'What is the name of the executable file that was detected by the July 4 2024 credential-theft (Mimikatz) alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'mimikatz.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'SMB reconnaissance was carried out by the account (Field: Sid, Value: `S-5-7-21-1843151660-3234030288-105586167-1422`), which enumerated sessions and gathered IP-address information.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
