tasks:
  - task_id: incident_39_latest_train_set_task_6
    title: incident_39_latest_train_set_task_6
    description: 'According to the "Suspicious service launched" alert raised at 22:35:02 UTC on 2024-07-04, what is the name of the executable that was started as the suspicious service (i.e., the image name of the process with PID 7668)?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation you observe that PsExec was used to run several remote commands from host ID 4d8d23e9-a77d-4e33-9435-b8c457e57ca1. For example, command lines show tools such as "psexec.exe" executing PowerShell scripts (domaindominance27.ps1, get-krbticket.ps1) and even disabling real-time monitoring through Windows Defender settings. These activities triggered the alert “PsExec launched a command on a remote device,” which is often an indicator of lateral-movement attempts. Shortly after, a “SID history injection” alert fired on host vnevado-win10b, suggesting the attacker tried to escalate privileges. Seconds later, another alert reported that a suspicious service was started on the same timeline, implying the attacker may have installed a service to maintain persistence.'
      question: 'According to the "Suspicious service launched" alert raised at 22:35:02 UTC on 2024-07-04, what is the name of the executable that was started as the suspicious service (i.e., the image name of the process with PID 7668)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
