    initial_context:
      incident_context: 'An alert was raised after the process "mimikatz.exe" (PID 5176) was executed with parameters indicating credential theft activity on 2024-06-27. Moments later, a separate alert reported that PsExec was leveraged to run a command on a remote host, implying an attempt at lateral movement.'
