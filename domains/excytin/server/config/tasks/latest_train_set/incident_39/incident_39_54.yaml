    title: incident_39_latest_train_set_task_54
    description: 'A few seconds before the PsExec activity, there was a sign-in attempt that used a deceptive (fake) user account. From what IP address did that suspicious sign-in originate?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we observed PsExec being used to run several PowerShell-based commands that attempted to stop the NTDS service, manipulate SID history, and disable real-time protection on remote hosts. This PsExec activity was recorded on 2024-07-04 at 22:35:03 UTC and may indicate an attacker trying to move laterally inside the environment.'
      question: 'A few seconds before the PsExec activity, there was a sign-in attempt that used a deceptive (fake) user account. From what IP address did that suspicious sign-in originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '35.202.74.47'
