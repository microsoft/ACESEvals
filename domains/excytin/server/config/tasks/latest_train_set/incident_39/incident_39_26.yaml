tasks:
  - task_id: incident_39_latest_train_set_task_26
    title: incident_39_latest_train_set_task_26
    description: 'Which user account was flagged in the subsequent "Microsoft Defender Antivirus tampering" alert for attempting to turn off the antivirus service?'
    inherit_shared: true
    initial_context:
      incident_context: 'Soon after a suspicious network connection was made from the external IP address 35.202.74.47, Microsoft Defender for Endpoint generated an alert titled "Possible lateral movement." This suggested an attacker might be pivoting to another device in the environment. A second alert was then raised on that (unidentified) host indicating an attempt to disable Microsoft Defender Antivirus, which is a common evasion technique.'
      question: 'Which user account was flagged in the subsequent "Microsoft Defender Antivirus tampering" alert for attempting to turn off the antivirus service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'fk8mq'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Alert at 2024-07-04 22:35:01.716777+00:00 reported Possible lateral movement on the host with HostName `vnevado-win10b`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Shortly after, at 2024-07-04 22:35:03.300438+00:00, the Microsoft Defender Antivirus tampering alert showed an attempt to disable AV protection by the account with Name `fk8mq`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
