tasks:
  - task_id: incident_39_latest_train_set_task_65
    title: incident_39_latest_train_set_task_65
    description: 'According to the subsequent "Anomalous account lookups" alert, which executable carried out the command to enumerate domain groups (`group /domain`)?'
    inherit_shared: true
    initial_context:
      incident_context: 'As part of investigating the alert "Multiple dual-purpose tools were dropped", we observed that several known offensive utilities (e.g., mimikatz.exe) and PowerShell scripts were written to disk on the affected device at 22:35:02 UTC. Just one second later, the system generated a new alert titled "Anomalous account lookups", indicating that the attacker began querying user and group information within the domain.'
      question: 'According to the subsequent "Anomalous account lookups" alert, which executable carried out the command to enumerate domain groups (`group /domain`)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'net.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'net.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A dual-purpose tool was dropped on the device: File Name `domaindominance27.ps1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
