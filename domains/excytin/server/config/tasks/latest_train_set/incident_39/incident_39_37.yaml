tasks:
  - task_id: incident_39_latest_train_set_task_37
    title: incident_39_latest_train_set_task_37
    description: 'According to the ‘User accessed link in ZAP-quarantined email’ alert raised on 10 July 2024, which user (provide the full email address) clicked the malicious link?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4 2024, Defender raised a ‘SID history injection’ alert on host vnevado-dc. The activity was executed under the domain account ‘lucasb’ (SID S-1-5-21-1440151660-4837038288-105596163-1120) via a PowerShell command that stopped the NTDS service, attempted to add SID history to the ‘bdadmin’ account, and then restarted the service. In the same incident, a follow-up alert reported that several dual-purpose tools had been dropped on the device. A few days later, another related alert indicated that a user had clicked a link contained in an email that had already been quarantined by Zero-hour Auto Purge (ZAP).'
      question: 'According to the ‘User accessed link in ZAP-quarantined email’ alert raised on 10 July 2024, which user (provide the full email address) clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Ethan Brooks@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Process (ExtractedFileName: `powershell.exe`) executed a SID history injection on 2024-07-04 22:35:03, indicating an attempt to gain elevated privileges.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Just seconds earlier, the account (Sid: `S-5-7-21-1843151660-3234030288-105586167-1422`) dropped multiple dual-purpose tools on the same device, providing the attacker with software needed for further exploitation.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Subsequently, on 2024-07-10 11:24:45, the user mailbox (Email: `Ethan Brooks@vnevado.alpineskihouse.co`) clicked a link in a ZAP-quarantined email, suggesting the compromise may have extended to this user.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
