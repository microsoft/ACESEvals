tasks:
  - task_id: incident_39_latest_train_set_task_2
    title: incident_39_latest_train_set_task_2
    description: 'According to the “Suspected identity theft (pass-the-ticket)” alert, what is the Security Identifier (SID) of the compromised account whose Kerberos ticket was misused?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4th, an alert reported that the malware tool “Kekeo” (observed running as rubeus.exe, PID 2608, launched by account fk8mq) was active on one of our endpoints. Less than a week later, further activity escalated: a suspected overpass-the-hash attempt was logged when Emma Clark (Helpdesk Administrator) on host VNEVADO-Win10V tried to authenticate against the domain controller. Immediately afterward, a follow-up alert flagged a suspected pass-the-ticket identity-theft incident in which an attacker reused Julian Burke’s Kerberos ticket from VNEVADO-Win10B on VNEVADO-Win10V to access several resources.'
      question: 'According to the “Suspected identity theft (pass-the-ticket)” alert, what is the Security Identifier (SID) of the compromised account whose Kerberos ticket was misused?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-0-25-1848151668-3534030238-185306563-542'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-1-0-25-1848151668-3534030238-185306563-542'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Malware ''Kekeo'' activity was detected on an account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` (2024-07-04 22:35:03 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
