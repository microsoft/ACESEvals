tasks:
  - task_id: incident_39_latest_train_set_task_64
    title: incident_39_latest_train_set_task_64
    description: 'According to the alert titled "Email messages containing malicious URL removed after delivery", to which mailbox (recipient email address) had the malicious message been delivered before it was removed?'
    inherit_shared: true
    initial_context:
      incident_context: 'On host "vnevado-dc" a suspicious process (powershell.exe spawning net.exe) was observed stopping the NTDS service under the user account "lucasb". A short time later, the same device triggered an alert for a suspicious sequence of exploration activities. Several days after these device-centric events, Microsoft 365 Defender raised a separate alert indicating that email messages containing a malicious URL were removed after delivery to a user in the same tenant.'
      question: 'According to the alert titled "Email messages containing malicious URL removed after delivery", to which mailbox (recipient email address) had the malicious message been delivered before it was removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'tgs2z@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A suspicious process with ExtractedFileName `powershell.exe` stopped services on the device.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
