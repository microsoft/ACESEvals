    description: 'According to the alert stating that the ''Kekeo'' malware was detected and active, what is the Azure AD user ID (AadUserId) associated with the account involved in this activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'An investigation began after an email with the malicious URL "https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/" was sent from k1pt7ez@vnevado.alpineskihouse.co (sender IP 118.254.65.186) to the mailbox tgs2z@vnevado.alpineskihouse.co, an account belonging to Ethan Brooks. Although the message was removed post-delivery, follow-up alerts showed that multiple dual-purpose tools were subsequently dropped on the same device. Minutes later, Microsoft Defender flagged that the credential-theft tool “Kekeo” was running, indicating possible privilege-escalation activity tied to a specific Azure AD account.'
      question: 'According to the alert stating that the ''Kekeo'' malware was detected and active, what is the Azure AD user ID (AadUserId) associated with the account involved in this activity?'
