tasks:
  - task_id: incident_39_latest_train_set_task_77
    title: incident_39_latest_train_set_task_77
    description: 'What is the username of the account that appears in the alert reporting that the ''Kekeo'' malware was detected and active?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation, we observed a sign-in attempt with a deceptive user account named "kyleg" coming from IP address 141.216.110.153 on 2024-07-04 at 22:35:02 UTC. Immediately afterward, another alert was raised on the same device reporting that the "Kekeo" malware was detected and active. Analysts now need to understand which account was implicated in that malware-related alert.'
      question: 'What is the username of the account that appears in the alert reporting that the ''Kekeo'' malware was detected and active?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'fk8mq'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
