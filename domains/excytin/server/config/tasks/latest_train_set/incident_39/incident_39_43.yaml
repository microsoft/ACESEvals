tasks:
  - task_id: incident_39_latest_train_set_task_43
    title: incident_39_latest_train_set_task_43
    description: 'Identify the executable name of the process that was started by the suspicious service according to the "Suspicious service launched" alert raised at 22:35:02 UTC on 2024-07-04.'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a security incident, several "Anomalous account lookups" were observed after a rapid sequence of enumeration commands such as "net.exe user /domain" and "net.exe group \"domain admins\" /domain" on 2024-06-27. Moments later, additional alerts indicated that multiple dual-purpose tools had been dropped and the ‘Kekeo’ malware was detected, pointing to possible lateral-movement activity. Shortly thereafter, a new alert reported that a suspicious Windows service had been launched on the affected device, potentially to establish persistence or escalate privileges.'
      question: 'Identify the executable name of the process that was started by the suspicious service according to the "Suspicious service launched" alert raised at 22:35:02 UTC on 2024-07-04.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'psexesvc.exe'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An account with field AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` was observed performing anomalous user-lookup activity.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.25
            weight: 1.0
      - subtask_id: checkpoint_2
