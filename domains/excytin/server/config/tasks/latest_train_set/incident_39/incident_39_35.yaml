    title: incident_39_latest_train_set_task_35
    description: 'According to the SID history injection alert that followed the suspicious remote activity, what is the name of the file that was involved in the injection?'
    inherit_shared: true
    initial_context:
      incident_context: 'On July 4th 2024, host "vnevado-win10b" raised a "Suspicious remote activity" alert. The activity was carried out under the accounts "fk8mq" and "LocalSystem" (SIDs S-1-5-21-1540151660-3530000288-105586595-1517 and S-0-6-5) and involved the process "psexesvc.exe" that had started at 14:33 UTC. A few seconds later, additional alerts were triggered, including one that reported a Security ID (SID) history injection on the same device.'
      question: 'According to the SID history injection alert that followed the suspicious remote activity, what is the name of the file that was involved in the injection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dkwj.mze'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'dkwj.mze'
      scoring:
        max_score: 1.0
