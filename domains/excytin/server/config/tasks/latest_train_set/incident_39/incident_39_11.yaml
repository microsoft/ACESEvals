tasks:
  - task_id: incident_39_latest_train_set_task_11
    title: incident_39_latest_train_set_task_11
    description: 'Immediately following the suspicious account creation, another alert flagged a sign-in attempt with a deceptive user account. What is the Security Identifier (SID) of that deceptive account?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we saw a PowerShell script (domaindominance27.ps1) launched via "powershell.exe" and the built-in tool "net.exe" used to add a new domain user ("net.exe user /add bdadmin password1! /domain"). This activity generated a "Suspicious account creation" alert on 2024-07-04 at 22:35:01 UTC, indicating an attacker might be establishing persistence.'
      question: 'Immediately following the suspicious account creation, another alert flagged a sign-in attempt with a deceptive user account. What is the Security Identifier (SID) of that deceptive account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-0-6-5'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A new user account was created on the host with HostName `vnevado-win10v`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A deceptive sign-in attempt was detected using the account with Name `kyleg`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
