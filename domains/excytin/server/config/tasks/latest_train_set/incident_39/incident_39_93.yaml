tasks:
  - task_id: incident_39_latest_train_set_task_93
    title: incident_39_latest_train_set_task_93
    description: 'According to the "Suspicious account creation" alert that preceded the SID history injection, what is the Azure AD User ID (AadUserId) of the newly created account?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of a SID history injection detected on host "vnevado-dc", we observed user "lucasb" executing a PowerShell command that modified NTDS settings, potentially to escalate privileges. This activity is closely linked in time to a prior "Suspicious account creation" alert, which indicates that an attacker may have created a new user account to maintain access. Details of that newly-created account are needed to assess the scope of the compromise.'
      question: 'According to the "Suspicious account creation" alert that preceded the SID history injection, what is the Azure AD User ID (AadUserId) of the newly created account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'SID history injection was performed via process with ExtractedFileName `powershell.exe` at 2024-07-04 22:35:03 UTC, indicating an attempt to gain elevated privileges.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Immediately after, a suspicious new user account was created with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, likely using the privileges obtained from the SID history injection.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
