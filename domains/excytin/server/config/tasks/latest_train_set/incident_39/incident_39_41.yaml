tasks:
  - task_id: incident_39_latest_train_set_task_41
    title: incident_39_latest_train_set_task_41
    description: 'What is the email address of the user account that performed the SMB reconnaissance from VNEVADO-Win10V against VNEVADO-DC?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, the endpoint vnevado-win10b triggered the alert "’Kekeo’ malware was detected and was active." The malicious activity involved the process rubeus.exe (PID 2608) executed by the local account fk8mq on 2024-06-27. Shortly after, a suspected overpass-the-hash attempt originating from VNEVADO-Win10V was observed. In the same time-frame, that machine also carried out User and IP address reconnaissance over SMB against the domain controller VNEVADO-DC.'
      question: 'What is the email address of the user account that performed the SMB reconnaissance from VNEVADO-Win10V against VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks@vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Ethan Brooks@vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'The account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` was associated with the detection of ‘Kekeo’ malware running on the machine (2024-07-04 22:35:03 UTC).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
