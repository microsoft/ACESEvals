tasks:
  - task_id: incident_39_latest_train_set_task_91
    title: incident_39_latest_train_set_task_91
    description: 'What is the name of the script file that was executed during the anomalous account lookup activity related to this incident?'
    inherit_shared: true
    initial_context:
      incident_context: 'Security analysts are currently investigating a credential-theft–focused intrusion. The investigation began when Microsoft Defender flagged a "Possible use of the Rubeus kerberoasting tool" alert on 2024-07-04. Telemetry shows several processes executed in quick succession on the affected host, including:
• rubeus.exe (often used for Kerberos ticket theft)
• get-krbticket.ps1 launched by powershell.exe (PID 6636 at 2024-06-27T14:32:46Z)
• psexec.exe (PID 5924 at 2024-06-27T14:33:14Z) used to remotely invoke rubeus.exe and redirect its output to adminticket.txt.
This activity suggests the attacker was harvesting Kerberos tickets and possibly moving laterally. Soon after, a separate alert was raised for a burst of suspicious account-lookup queries, indicating reconnaissance against directory services. Investigators want to identify the specific script file implicated in that account-lookup phase.'
      question: 'What is the name of the script file that was executed during the anomalous account lookup activity related to this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'domaindominance27.ps1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:03.136659+00:00, the attacker executed the PowerShell script with file Name `domaindominance27.ps1`, triggering a series of anomalous user-account lookups.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
