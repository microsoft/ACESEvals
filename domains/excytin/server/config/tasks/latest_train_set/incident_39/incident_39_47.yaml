tasks:
  - task_id: incident_39_latest_train_set_task_47
    title: incident_39_latest_train_set_task_47
    description: 'Which user account is identified in the subsequent "Potential human-operated malicious activity" alert?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a "Suspicious remote activity" alert was triggered after the executable "psexesvc.exe" (running under the LocalSystem account) was launched on a host via remote execution. Almost immediately afterward, a new alert titled "Potential human-operated malicious activity" was raised on the same device, suggesting that the attacker may be progressing toward ransomware or another malicious payload.'
      question: 'Which user account is identified in the subsequent "Potential human-operated malicious activity" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kyleg'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'kyleg'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'Suspicious remote activity was observed originating from account Name `fk8mq`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Potential human-operated malicious activity was subsequently detected involving account Name `kyleg`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
