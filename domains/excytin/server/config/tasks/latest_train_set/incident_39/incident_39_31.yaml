    description: 'According to the deceptive sign-in alert that occurred moments after the Mimikatz activity, what IP address was the sign-in attempt made from?'
    inherit_shared: true
    initial_context:
      incident_context: 'Shortly after a Mimikatz credential theft tool was detected running multiple commands on the device, our logs show a "Sign-in attempt with deceptive user account" alert, indicating that someone may have tried to log in using a fake account—possibly leveraging credentials harvested by Mimikatz. The two alerts are linked through the same investigation timeline.'
      question: 'According to the deceptive sign-in alert that occurred moments after the Mimikatz activity, what IP address was the sign-in attempt made from?'
