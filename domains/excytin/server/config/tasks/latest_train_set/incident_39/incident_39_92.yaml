tasks:
  - task_id: incident_39_latest_train_set_task_92
    title: incident_39_latest_train_set_task_92
    description: 'Which user account name was involved in the final "Sign-in attempt with deceptive user account" alert that followed the detection of ''Kekeo'' malware on host vnevado-win10b?'
    inherit_shared: true
    initial_context:
      incident_context: 'During analysis of a recent lateral-movement incident, Microsoft Defender reported the presence of the “Kekeo” credential-theft malware on host vnevado-win10b (AadDeviceId: fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb). The malicious activity involved the file rubeus.exe and the service executable psexesvc.exe launched under the local account fk8mq (SID S-1-5-21-1540151660-3530000288-105586595-1517). Just seconds later, another alert indicated that multiple dual-purpose tools were dropped on the same device, again associated with a suspicious user account. Immediately following these two alerts, a separate warning was raised for a sign-in attempt using a deceptive user account, suggesting the attacker might be trying to leverage a fake identity for further access.'
      question: 'Which user account name was involved in the final "Sign-in attempt with deceptive user account" alert that followed the detection of ''Kekeo'' malware on host vnevado-win10b?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kyleg'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'kyleg'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'A sign-in attempt was detected using a deceptive user account with field Name `kyleg`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Multiple dual-purpose tools were later dropped on the device by the account with field Name `tgs2z`.'
        objective: Identify key details related to the potential compromise that might
