tasks:
  - task_id: incident_39_latest_train_set_task_86
    title: incident_39_latest_train_set_task_86
    description: 'According to the Microsoft Defender Antivirus tampering alert raised at 22:35:00 UTC, what is the name of the file that was used in the tampering attempt?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation on host vnevado-win10b (device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb), we observed that account fk8mq (SID S-1-5-21-1540151660-3530000288-105586595-1517) registered a suspicious file as a Windows service. Just seconds later, several dual-purpose tools were dropped on the same machine, and an alert was raised indicating an attempt to disable Microsoft Defender Antivirus, suggesting the attacker was trying to evade detection.'
      question: 'According to the Microsoft Defender Antivirus tampering alert raised at 22:35:00 UTC, what is the name of the file that was used in the tampering attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'get-krbticket.ps1'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
