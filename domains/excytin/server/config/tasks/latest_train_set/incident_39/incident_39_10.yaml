tasks:
  - task_id: incident_39_latest_train_set_task_10
    title: incident_39_latest_train_set_task_10
    description: 'A few days later, security telemetry recorded SMB session enumeration against the domain controller VNEVADO-DC coming from the same workstation (VNEVADO-Win10V). Which user account carried out this SMB reconnaissance activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we saw account "tgs2z" on host "vnevado-win10v" running several net.exe commands (e.g., "net.exe" group /domain) that triggered the alert "Anomalous account lookups" on 2024-07-04. This suggested an attempt to harvest information about users and groups in the domain from that workstation.'
      question: 'A few days later, security telemetry recorded SMB session enumeration against the domain controller VNEVADO-DC coming from the same workstation (VNEVADO-Win10V). Which user account carried out this SMB reconnaissance activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'Ethan Brooks'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'An anomalous chain of account look-ups was detected, performed by the account whose AadUserId is `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'Later, the account with Name `Ethan Brooks` executed SMB reconnaissance, enumerating sessions and collecting recent IP addresses.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
