tasks:
  - task_id: incident_39_latest_train_set_task_87
    title: incident_39_latest_train_set_task_87
    description: 'According to the ‘Malicious credential theft tool execution detected’ alert raised at 22:35:04 UTC on 2024-07-04, which URL (or fully-qualified domain name) was involved in this credential-theft activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation of suspicious activity on host vnevado-win10b (AAD device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb), we first saw an alert for possible lateral movement that coincided with a suspicious network event. Almost immediately afterward, a sign-in attempt using a deceptive user account was flagged on the same device. Just a few seconds later, Microsoft Defender raised a separate alert indicating that a known credential-theft tool had executed on the device, suggesting the attacker was attempting to dump credentials or other sensitive data.'
      question: 'According to the ‘Malicious credential theft tool execution detected’ alert raised at 22:35:04 UTC on 2024-07-04, which URL (or fully-qualified domain name) was involved in this credential-theft activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-dc.vnevado.alpineskihouse.co'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'vnevado-dc.vnevado.alpineskihouse.co'
      scoring:
        max_score: 1.0
    subtasks:
