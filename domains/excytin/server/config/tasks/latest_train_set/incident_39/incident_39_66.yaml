tasks:
  - task_id: incident_39_latest_train_set_task_66
    title: incident_39_latest_train_set_task_66
    description: 'In a subsequent alert that was raised as "Potential human-operated malicious activity", what is the Security Identifier (SID) of the account that was implicated?'
    inherit_shared: true
    initial_context:
      incident_context: 'During the investigation we observed an alert titled "User and IP address reconnaissance (SMB)" in which the user account Ethan Brooks (Account Executive) operating from the workstation VNEVADO-Win10V enumerated SMB sessions on the domain controller VNEVADO-DC. This reconnaissance activity is often an early step attackers take before moving on to more aggressive techniques.'
      question: 'In a subsequent alert that was raised as "Potential human-operated malicious activity", what is the Security Identifier (SID) of the account that was implicated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-0-6-5'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'On 2024-07-10 11:24:45Z, the host with HostName `VNEVADO-Win10V` was used to enumerate SMB sessions on VNEVADO-DC, gathering recent IP information (User and IP address reconnaissance alert).'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_2
        title: Checkpoint 2
        description: 'A few milliseconds later, the account identified by AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` attempted a suspected overpass-the-hash Kerberos authentication from the same device VNEVADO-Win10V toward VNEVADO-DC.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.333
            weight: 1.0
      - subtask_id: checkpoint_3
        title: Checkpoint 3
        description: 'Prior to these two events, on 2024-07-04 22:35:03Z, the account with Sid `S-0-6-5` was flagged in a Potential human-operated malicious activity alert, suggesting that this SID may be tied to the broader malicious campaign.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
