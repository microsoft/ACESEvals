    title: incident_39_latest_train_set_task_76
    description: 'According to the alert indicating that a suspicious file was registered as a service, what is the SID of the account that performed this registration?'
    inherit_shared: true
    initial_context:
      incident_context: 'On 2024-07-04, an alert flagged the execution of the credential-theft tool “mimikatz.exe” (process ID 4748) on an endpoint, suggesting an attempt to dump credentials. Seconds later, additional dual-purpose tools were dropped. Almost simultaneously, another alert reported that a suspicious file had been registered as a service on the same machine—an action commonly associated with establishing persistence. The service registration was carried out under a particular user account whose security identifier (SID) was captured by the alert.'
      question: 'According to the alert indicating that a suspicious file was registered as a service, what is the SID of the account that performed this registration?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: 'S-0-6-5'
      scoring:
        max_score: 1.0
