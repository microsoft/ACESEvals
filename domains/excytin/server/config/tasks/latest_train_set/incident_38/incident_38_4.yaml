tasks:
  - task_id: incident_38_latest_train_set_task_4
    title: incident_38_latest_train_set_task_4
    description: 'What is the IP address that was involved in the "Unexpected behavior observed by a process ran with no command line arguments" alert which followed the suspicious PowerShell activity?'
    inherit_shared: true
    initial_context:
      incident_context: 'During an investigation, a "Suspicious Application Window Discovery" alert was triggered on July 4, 2024 at 22:35 UTC. The alert showed that PowerShell (powershell.exe) was executed twice in quick succession—once as a simple launch, and again 26 seconds later with a long base-64–encoded command and the ExecutionPolicy bypass flag. This activity suggests an attacker might be running discovery commands on the host right before another alert—"Unexpected behavior observed by a process run with no command-line arguments"—was raised a second later. Analysts now need to understand what network location that second process interacted with.'
      question: 'What is the IP address that was involved in the "Unexpected behavior observed by a process ran with no command line arguments" alert which followed the suspicious PowerShell activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '202.183.149.174'
    submission_evaluation_config:
      strategy: llm_judge
      criteria:
        model: openai/azure/gpt-4.1
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        golden_answer: '202.183.149.174'
      scoring:
        max_score: 1.0
    subtasks:
      - subtask_id: checkpoint_1
        title: Checkpoint 1
        description: 'At 2024-07-04T22:35:00.593840Z, the account (Field: Name, Value: `nathans`) was observed running a tool that triggered the ''Suspicious Application Window Discovery'' alert.'
        objective: Identify key details related to the potential compromise that might
          help in solving the main task.
        step_evaluation_config:
          strategy: llm_judge
          criteria:
            model: openai/azure/gpt-4.1
            judge_system_template: judge/checkpoint_judge_system.md
            judge_user_template: judge/checkpoint_judge_user.md
            steps_per_message: 50
          scoring:
            max_score: 0.5
            weight: 1.0
      - subtask_id: checkpoint_2
