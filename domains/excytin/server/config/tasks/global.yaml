domain: excytin
permanent_environments:
  - incident_5
  - incident_34
  - incident_38
  - incident_39
  - incident_55
  - incident_134
  - incident_166
  - incident_322

global_defaults:
  prompts:
    instruction: "instructions/excytin_demo.md"
    assistant: "assistants/inspect_assistant.md"
    submit: "submits/inspect_submit.md"

  execution_config:
    allowed_executors:
      - bash
      - python
    timeout: 30

  episode_config:
    max_steps: 15

  benchmark_config:
    episode_attempts: 3

  # Dependency resolution configuration
  dependency_config:
    wait_seconds: 10.0               # Maximum time to wait for episode dependencies
    retry_interval: 0.5              # Initial retry interval in seconds
    max_retry_interval: 2.0          # Maximum retry interval for exponential backoff
