domain: excytin
# Permanent environment with all 8 incident databases
permanent_environment: all_incidents

global_defaults:
  prompts:
    instruction: "instructions/excytin_demo.md"
    assistant: "assistants/inspect_assistant.md"
    submit: "submits/inspect_submit.md"
    continue: "continues/inspect_continue.md"

  execution_config:
    executors:
      bash:
        timeout: 180
      python:
        timeout: 180

  episode_config:
    max_steps: 15

    # Transcript coordination configuration
    # Single-agent tasks use default settings (push enabled, pull disabled)
    transcript_config:
      websocket:
        push:
          enabled: true
        pull:
          enabled: false

  benchmark_config:
    episode_attempts: 3

  # Dependency resolution configuration
  dependency_config:
    wait_seconds: 10.0               # Maximum time to wait for episode dependencies
    retry_interval: 0.5              # Initial retry interval in seconds
    max_retry_interval: 2.0          # Maximum retry interval for exponential backoff
