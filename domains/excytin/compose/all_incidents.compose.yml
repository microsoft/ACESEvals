# Excytin permanent database services — all 8 incident MySQL instances
# Lifecycle: task_init → compose up, task_cleanup → compose down
# Managed by SaberSandboxEnvironment, NOT by inspect_ai

services:
  incident-5-db:
    image: saber/excytin/incident-5:latest
    container_name: saber-excytin-incident-5
    ports:
      - "3306:3306"
    volumes:
      - ./data/sql_files/incident_5.sql:/docker-entrypoint-initdb.d/incident_5.sql:ro
      - ./data/csv_files/incident_5:/var/lib/mysql-files
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: env_monitor_db
      MYSQL_ROOT_HOST: "%"
    command: --secure-file-priv=/var/lib/mysql-files --bind-address=0.0.0.0 --innodb-redo-log-capacity=2147483648 --innodb-buffer-pool-size=512M --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=0
    networks:
      - excytin-database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
    labels:
      - "saber.domain=excytin"

