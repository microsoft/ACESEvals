# SABER Configuration - Excytin Domain
# Auto-hydrated configuration for saber-domain test command

# Server configuration (auto mode - URLs injected at runtime)
server:
  mode: auto  # URLs will be hydrated by saber-domain test command
  client_id: "saber-client"

# Task configuration
tasks:
  task_ids: ["incident_34_task_1"]

# Agent configuration
agents:
  - id: "inspect_react"
    model: "openai/azure/gpt-4.1"
    tasks: ["incident_34_task_1"]  # Specific task assignment

# Execution configuration
log_level: "INFO"
log_dir: "logs/client-logs"

# Endpoint configuration for model API requests
endpoint_configuration:
  timeout: null  # Model API request timeout in seconds (null = no timeout, use provider defaults)
  max_retries: null  # Maximum number of retry attempts for model API (null = unlimited retries)
  max_connections: null  # Maximum concurrent connections to model API (null = use default of 10)

# Log upload configuration
log_upload:
  enabled: true  # Enable automatic upload of eval log files to server
  max_retries: 3  # Maximum retry attempts for failed uploads
  timeout: 30.0  # Upload timeout in seconds
  fail_on_error: false  # Whether to fail evaluation if log upload fails

# eval_async specific configuration
parallel_execution: true
max_parallel_samples: 8  # Maximum number of samples to run in parallel (controls concurrency)
# max_subprocesses defaults to os.cpu_count() if not specified - usually best to leave it unset
container_timeout: 300