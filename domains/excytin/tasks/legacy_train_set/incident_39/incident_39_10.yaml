tasks:
- task_id: incident_39_legacy_train_set_task_10
  title: incident_39_legacy_train_set_task_10
  description: 'Can you identify the Azure AD user ID related to the account observed using the Rubeus kerberoasting tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent security incident starting from the alert ''Multiple dual-purpose tools were dropped'',
      multiple known public tools, which could also be used for malicious reasons were dropped on a device. This might indicate
      attackers attempting credential theft, privilege escalation, and lateral movement. Following this, there was an alert
      regarding a suspicious file registered as a service, suggesting an attacker might be attempting persistence. The next
      alert, ''Possible use of the Rubeus kerberoasting tool'', suggests that the Rubeus tool was observed on the endpoint,
      which can perform attacks related to Kerberos authentication, such as kerberoasting or pass-the-ticket attacks.'
    question: 'Can you identify the Azure AD user ID related to the account observed using the Rubeus kerberoasting tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Multiple dual-purpose tools, including `psexesvc.exe`, were dropped on the device.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious file was registered as a service on the host `vnevado-win10b`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The Rubeus kerberoasting tool was possibly used by the account with AadUserId 
          `97e6a954-b6bd-48a5-808c-bd8464cce677`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
