tasks:
- task_id: incident_39_legacy_train_set_task_34
  title: incident_39_legacy_train_set_task_34
  description: 'In the subsequent alert, a user was involved in enumerating SMB sessions on VNEVADO-DC and retrieving recent
    IP addresses of 2 accounts. Can you identify the name of this user?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was observed starting with a file dropped and launched from a remote location on
      host `vnevado-win10b`. It involved the execution of the file `psexesvc.exe` by account `fk8mq` with ProcessID `5512`.
      This could indicate an attacker or malware attempting lateral movement or propagation. Later, an alert was triggered
      indicating a suspected overpass-the-hash attack (Kerberos) attempted by Emma Clark (Helpdesk Administrator) on VNEVADO-Win10V
      against VNEVADO-DC.'
    question: 'In the subsequent alert, a user was involved in enumerating SMB sessions on VNEVADO-DC and retrieving recent
      IP addresses of 2 accounts. Can you identify the name of this user?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An account with Sid `S-1-5-21-1540151660-3530000288-105586595-1517` was used in a remote session to
          drop and execute a file, potentially by an attacker or malware attempting lateral movement.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Emma Clark (Helpdesk Administrator) on host `VNEVADO-Win10V` attempted to authenticate against 
          `VNEVADO-DC`, suspected to be an overpass-the-hash attack involving Kerberos.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Ethan Brooks (Account Executive) on host `VNEVADO-Win10V` performed SMB reconnaissance to enumerate
          SMB sessions on `VNEVADO-DC` and retrieved recent IP addresses of 2 accounts.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
