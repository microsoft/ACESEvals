tasks:
- task_id: incident_39_legacy_train_set_task_55
  title: incident_39_legacy_train_set_task_55
  description: 'During this security incident, a SID history injection was also detected on this device. Can you provide the
    SID value associated with the affected account?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was detected involving multiple dual-purpose tools being dropped on the device
      `vnevado-win10v`. These tools include `domaindominance27.ps1`, `rubeus.exe`, `mimikatz.exe`, and `psexec.exe`. The process
      `powershell.exe` was launched with the file `domaindominance27.ps1` which could potentially be used for credential theft,
      privilege escalation, and lateral movement.'
    question: 'During this security incident, a SID history injection was also detected on this device. Can you provide the
      SID value associated with the affected account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1440151660-4837038288-105596163-1120'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1440151660-4837038288-105596163-1120'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Multiple dual-purpose tools like `powershell.exe` were dropped on the device.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A SID history injection was detected involving an account with SID 
          `S-1-5-21-1440151660-4837038288-105596163-1120`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
