tasks:
- task_id: incident_39_legacy_train_set_task_96
  title: incident_39_legacy_train_set_task_96
  description: 'What is the command line used by the process with ID 5176 that indicates another malicious credential theft
    tool execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'A known credential theft tool execution command line was detected as part of a recent security incident.
      Specifically, a process with ID 5196 was observed executing `mimikatz.exe` with parameters aimed to dump users'' credentials,
      keys, plain-text passwords, and more. The command line used was `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords
      exit`.'
    question: 'What is the command line used by the process with ID 5176 that indicates another malicious credential theft
      tool execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The attacker executed the credential theft tool `mimikatz.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The process with Process ID `5176` and command line `mimikatz.exe privilege::debug kerberos::ptt 
          c:\m365dattack\admin-tickets exit` was created at `2024-06-27t14:33:32.4282796z`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
