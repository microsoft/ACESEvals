tasks:
- task_id: incident_39_legacy_train_set_task_86
  title: incident_39_legacy_train_set_task_86
  description: 'An analysis indicated that a known malicious credential theft tool was executed. Can you find the Azure Active
    Directory User ID (AadUserId) related to this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04, our systems detected the ''Kekeo'' malware, an undesirable application that performs
      annoying, disruptive, or harmful actions on affected machines. The detection might indicate that the malware was stopped
      from delivering its payload, but it is prudent to check the machine for signs of infection. As part of this investigation,
      the file `rubeus.exe` was identified as associated with the malware activity.'
    question: 'An analysis indicated that a known malicious credential theft tool was executed. Can you find the Azure Active
      Directory User ID (AadUserId) related to this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The 'Kekeo' malware was detected on host `vnevado-win10v`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A malicious credential theft tool execution was detected connected to the account with AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
