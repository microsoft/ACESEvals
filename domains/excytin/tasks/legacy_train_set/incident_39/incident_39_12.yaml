  description: 'Can you identify the Azure Active Directory User Id (AadUserId) for the account associated with the detected
    ''Kekeo'' malware activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A potentially malicious URL click was detected involving user Ethan Brooks and the malicious URL `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`.
      This incident is connected to another alert where PsExec''s usage indicated a possible lateral movement attempt by an
      attacker. The command launched by PsExec could indicate the presence of more severe threats. Subsequently, it was discovered
      that ''Kekeo'' malware was detected and active during this investigation. Malware and unwanted software are undesirable
      applications that can replicate, spread, and receive commands from remote attackers.'
    question: 'Can you identify the Azure Active Directory User Id (AadUserId) for the account associated with the detected
      ''Kekeo'' malware activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A user with SID `S-5-7-21-1843151660-3234030288-105586167-1422` clicked on a potentially malicious 
          URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: PsExec was used to launch a command on a remote device via the file `rubeus.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
