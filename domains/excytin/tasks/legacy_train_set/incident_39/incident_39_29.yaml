tasks:
- task_id: incident_39_legacy_train_set_task_29
  title: incident_39_legacy_train_set_task_29
  description: 'What was the name of the file associated with the ''Kekeo'' malware detected during this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A remote session on host `vnevado-win10b` dropped and executed a file, potentially indicating an attempt
      by an attacker or malware to move laterally or propagate. During this incident, a detected malware named ''Kekeo'' was
      flagged. Such malware can perform annoying, disruptive, or harmful actions on affected machines, and potentially replicate
      and spread to other machines.'
    question: 'What was the name of the file associated with the ''Kekeo'' malware detected during this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A remote session dropped a file and executed it on the account `fk8mq`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The 'Kekeo' malware was detected in the file named `rubeus.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The 'Kekeo' malware was detected again in the file named `rubeus.exe` and it was active.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
