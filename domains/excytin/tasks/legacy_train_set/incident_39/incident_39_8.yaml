tasks:
- task_id: incident_39_legacy_train_set_task_8
  title: incident_39_legacy_train_set_task_8
  description: 'Can you identify the account name associated with the human-operated malicious activity observed on the device
    on 2024-07-04 at 22:35:03.712134+00:00?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we noted a file `psexesvc.exe` was dropped and launched from a remote location,
      which might be an attempt by an attacker or malware to move laterally or propagate. This was flagged as part of a larger
      incident observed on 2024-07-04 at 22:35:01.862275+00:00.'
    question: 'Can you identify the account name associated with the human-operated malicious activity observed on the device
      on 2024-07-04 at 22:35:03.712134+00:00?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kyleg'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'kyleg'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A file was dropped and executed from a remote location by the account with SID 
          `S-1-5-21-1540151660-3530000288-105586595-1517`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Potential human-operated malicious activity was observed, involving the user account `kyleg`, which
          might indicate ransomware or other malicious payloads.
  scoring_aggregation:
    max:
      scores:
