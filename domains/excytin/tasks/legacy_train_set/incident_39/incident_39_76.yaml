tasks:
- task_id: incident_39_legacy_train_set_task_76
  title: incident_39_legacy_train_set_task_76
  description: 'During the investigation, an anomalous chain of attempts to look up user account information was observed.
    Can you identify the name of the suspicious file associated with this alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving a remote session dropping and executing a file named `rubeus.exe` on
      host `vnevado-win10b` with IP address `141.216.110.153` was detected. This activity is related to the use of the Rubeus
      kerberoasting tool, designed to exploit Kerberos authentication. The process was executed with command line: `rubeus.exe
      dump /service:xfbzkp /user:lucasb`, and the incident was traced back to the suspicious account `fk8mq` with Azure AD
      user ID `97e6a954-b6bd-48a5-808c-bd8464cce677`.'
    question: 'During the investigation, an anomalous chain of attempts to look up user account information was observed.
      Can you identify the name of the suspicious file associated with this alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A file named `rubeus.exe` was dropped and launched from a remote location.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Activity indicating the use of the Rubeus tool, which can perform kerberoasting and other Kerberos 
          authentication attacks, was observed. The suspect account has AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An anomalous account lookup was performed using the file `domaindominance27.ps1`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
