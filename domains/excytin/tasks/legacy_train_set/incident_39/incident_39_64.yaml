tasks:
- task_id: incident_39_legacy_train_set_task_64
  title: incident_39_legacy_train_set_task_64
  description: 'Can you provide the name of the process that was used to launch the suspicious service on the target device?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving a potentially malicious URL click was detected, where Ethan Brooks clicked
      on a malicious link `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`. During the investigation,
      it was identified that multiple public tools, which can be used for various attack stages including credential theft,
      privilege escalation, and lateral movement, were dropped on the device. Subsequently, a suspicious service was also
      started on this device, indicating potential use by attackers to maintain persistence or elevate privileges.'
    question: 'Can you provide the name of the process that was used to launch the suspicious service on the target device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: One of the users with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` clicked on a link that was 
          found to be malicious.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Multiple known public tools including `powershell.exe` were dropped on the device.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: A suspicious service was launched on the host `vnevado-dc`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Another suspicious service was launched involving `services.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
