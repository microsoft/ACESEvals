tasks:
- task_id: incident_39_legacy_train_set_task_54
  title: incident_39_legacy_train_set_task_54
  description: 'What is the SID of the deceptive user account involved in the sign-in attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was identified involving processes and services manipulation on a device. Initially,
      a process ''powershell.exe'' suspiciously stopped services running on the device. An attacker might do this to avoid
      detection or to facilitate further malicious activities. In close proximity, a file was dropped and launched from a
      remote location, indicating a possible lateral movement attempt.'
    question: 'What is the SID of the deceptive user account involved in the sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A process suspiciously stopped services on host `vnevado-dc`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A file was dropped and launched from a remote location with IP address `141.216.110.153`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A sign-in attempt was detected using a deceptive user account with SID `S-0-6-5`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
