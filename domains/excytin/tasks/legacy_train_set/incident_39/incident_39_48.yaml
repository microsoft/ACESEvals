tasks:
- task_id: incident_39_legacy_train_set_task_48
  title: incident_39_legacy_train_set_task_48
  description: 'Can you identify the account name associated with the active ''Kekeo'' malware detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was reported where a suspicious service was launched on a device, and PsExec was
      used to launch a command on a remote device. These activities suggest that an attacker might be using services to maintain
      persistence or elevate privileges, and leveraging PsExec to move laterally in the organization. During the investigation,
      an active ''Kekeo'' malware was detected. This malware can perform annoying, disruptive, or harmful actions on affected
      machines and can be controlled remotely by attackers.'
    question: 'Can you identify the account name associated with the active ''Kekeo'' malware detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious service `powershell.exe` was launched on the device.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: PsExec was used to launch a command on a remote device using `rubeus.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An active 'Kekeo' malware was detected, associated with the account `fk8mq`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
