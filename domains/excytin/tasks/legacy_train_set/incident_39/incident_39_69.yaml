  initial_context:
    incident_context: 'A known credential theft tool execution command line was detected on host `vnevado-win10v`, involving
      processes such as `powershell.exe` and `mimikatz.exe`. The credential theft tool `mimikatz.exe` was executed with Process
      ID 4112 and the following command line: `mimikatz.exe privilege::debug sekurlsa::pth /user:kyleg /ntlm:96def1a633fc6790124d5f8fe31cc72b
      /domain:vnevado.alpineskihouse.co /run:"powershell.exe dir \vnevado-win10b\c$"` on the host. Subsequently, PsExec was
      used to launch a command on a remote device. There was also activity indicating the use of the Rubeus tool for potential
      kerberoasting attacks. Finally, a suspicious service was launched on the device during this sequence of events.'
    question: 'Can you provide the ProcessId, CreatedTime, and CommandLine for the suspicious service that was launched on
      the device?'
