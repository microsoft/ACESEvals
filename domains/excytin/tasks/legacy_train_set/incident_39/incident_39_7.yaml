tasks:
- task_id: incident_39_legacy_train_set_task_7
  title: incident_39_legacy_train_set_task_7
  description: 'Can you find the account name associated with the dropped dual-purpose tools during the incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A multi-stage incident involving the Kekeo malware was identified on the endpoint. During this incident,
      a malicious file ''rubeus.exe'' was executed by account fk8mq on host vnevado-win10b, possibly indicating credential
      theft attempts. Additionally, dual-purpose tools were dropped to the same device.'
    question: 'Can you find the account name associated with the dropped dual-purpose tools during the incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The 'Kekeo' malware named `rubeus.exe` was detected and active on a machine.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Multiple dual-purpose tools were dropped on the device by the account `tgs2z`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
