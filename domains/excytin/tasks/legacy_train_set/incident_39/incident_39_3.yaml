tasks:
- task_id: incident_39_legacy_train_set_task_3
  title: incident_39_legacy_train_set_task_3
  description: 'What is the Security Identifier (Sid) of the user account involved in the successful logon using an overpass-the-hash
    attack?'
  inherit_shared: true
  initial_context:
    incident_context: 'A sign-in attempt was detected using a deceptive user account `kyleg` with potential attacker activity
      on the host `vnevado-win10v`. The incident involved human-operated malicious activity, and might potentially lead to
      ransomware or other harmful payloads on target devices. This activity escalated into a successful logon using overpass-the-hash
      with potentially stolen credentials.'
    question: 'What is the Security Identifier (Sid) of the user account involved in the successful logon using an overpass-the-hash
      attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-2-78'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-2-78'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A sign-in attempt was detected using a deceptive user account `kyleg`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Potential human-operated malicious activity was observed on the host `vnevado-win10b`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An attacker accessed a resource with a potentially stolen credential in an overpass-the-hash attack
          using the account SID `S-2-2-78`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
