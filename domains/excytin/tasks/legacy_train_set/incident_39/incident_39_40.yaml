tasks:
- task_id: incident_39_legacy_train_set_task_40
  title: incident_39_legacy_train_set_task_40
  description: 'Can you provide the Security Identifier (SID) of the account involved in the lateral movement detection of
    ''Kekeo'' malware?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident where a known credential theft tool named ''mimikatz.exe'' was executed
      on the host `vnevado-win10v`, it was detected through the command line indicating attempts to dump users'' credentials
      and passwords. Multiple dual-purpose tools were then dropped on the same device, and subsequently, ''Kekeo'' malware
      was identified during a lateral movement attempt.'
    question: 'Can you provide the Security Identifier (SID) of the account involved in the lateral movement detection of
      ''Kekeo'' malware?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1540151660-3530000288-105586595-1517'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A known credential theft tool named `mimikatz.exe` was executed.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Multiple dual-purpose tools including `rubeus.exe` were dropped on the device, which might be used 
          for credential theft, privilege escalation, and lateral movement.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The 'Kekeo' malware was detected on the device, indicating an attempt for lateral movement, 
          involving the account with SID `S-1-5-21-1540151660-3530000288-105586595-1517`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
