tasks:
- task_id: incident_39_legacy_train_set_task_18
  title: incident_39_legacy_train_set_task_18
  description: 'What was the filename of the suspicious process that was started as a service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a security incident involving Mimikatz credential theft tool detected on
      the device, it was found that the file `mimikatz.exe` was executed multiple times with various commands on host `vnevado-win10v`.
      Mimikatz is a credential theft tool that can harvest plaintext passwords, password hashes, smartcard PINs, and Kerberos
      tickets, potentially allowing attackers to harvest credentials to log into this or other devices on the network by impersonating
      a valid user. We also observed a suspicious service was launched on the device, which could be used by attackers to
      maintain persistence or elevate privileges.'
    question: 'What was the filename of the suspicious process that was started as a service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The Mimikatz credential theft tool was detected using `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious service was launched on the host `vnevado-dc`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Another suspicious service was launched using `services.exe` on the host `vnevado-dc`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
