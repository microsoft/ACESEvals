tasks:
- task_id: incident_39_legacy_train_set_task_13
  title: incident_39_legacy_train_set_task_13
  description: 'Can you retrieve the email address of the user who performed the suspected DCSync attack (replication of directory
    services) on VNEVADO-Win10V?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a recent security incident where a file was dropped and launched from a remote location,
      an account named `fk8mq` executed `rubeus.exe` on host `vnevado-win10b`. The process was run with ProcessId__CreatedTimeUtc__CommandLine
      `2608__2024-06-27t14:33:27.7927134z__rubeus.exe dump /service:xfbzkp /user:lucasb`. This activity could indicate an
      attacker attempting to move laterally or propagate within the network.'
    question: 'Can you retrieve the email address of the user who performed the suspected DCSync attack (replication of directory
      services) on VNEVADO-Win10V?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Julian Burke@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Julian Burke@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A remote session dropped and launched a file using the account with SID 
          `S-1-5-21-1540151660-3530000288-105586595-1517`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: There was a suspected overpass-the-hash attack (Kerberos) attempt by Emma Clark (Helpdesk 
          Administrator) on host `VNEVADO-DC`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Julian Burke (IT director) with the email `Julian Burke@vnevado.alpineskihouse.co` sent a 
          replication request to the host `VNEVADO-DC` in a suspected DCSync attack.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
