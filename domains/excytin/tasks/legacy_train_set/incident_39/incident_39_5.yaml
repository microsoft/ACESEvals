tasks:
- task_id: incident_39_legacy_train_set_task_5
  title: incident_39_legacy_train_set_task_5
  description: 'What was the IP address related to the suspicious file that was registered as a service?'
  inherit_shared: true
  initial_context:
    incident_context: 'A Mimikatz credential theft tool activity was detected on a device, with Mimikatz attempting to use
      DCSync functionality to harvest credentials and potentially impersonate a valid user. This activity was tracked as part
      of investigating a larger security incident. Additionally, multiple known public tools that could be used maliciously
      were dropped on the same device.'
    question: 'What was the IP address related to the suspicious file that was registered as a service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A Mimikatz credential theft tool script named `get-krbticket.ps1` was detected.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A dual-purpose tool named `psexesvc.exe` was dropped on the device.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A suspicious file was registered as a service originating from IP address `141.216.110.153`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
