tasks:
- task_id: incident_39_legacy_train_set_task_72
  title: incident_39_legacy_train_set_task_72
  description: 'During the same incident, there was an execution of a known credential theft tool. Can you identify the account
    name associated with the execution of this malicious tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was identified involving the launch of a suspicious service on a device, which
      may be used by attackers to run malicious commands, maintain persistence, or elevate privileges. The incident involved
      multiple processes including `psexesvc.exe` and `services.exe`. The alert was triggered for a suspicious service start,
      initially observed with Process ID 7668 and timestamp 2024-06-27T14:34:10.0201983Z for `psexesvc.exe` and Process ID
      652 and timestamp 2024-06-19T12:56:00.7201251Z for `services.exe`.'
    question: 'During the same incident, there was an execution of a known credential theft tool. Can you identify the account
      name associated with the execution of this malicious tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: There was a suspicious service launched on the host `vnevado-dc`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The process `powershell.exe` was started suspiciously on the host `vnevado-dc`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The malicious credential theft tool was executed by the account with the name `tgs2z`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
