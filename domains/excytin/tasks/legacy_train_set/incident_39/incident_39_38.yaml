tasks:
- task_id: incident_39_legacy_train_set_task_38
  title: incident_39_legacy_train_set_task_38
  description: 'Can you identify the name of a dropped file that might be used for credential theft, privilege escalation,
    or lateral movement related to this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was reported involving potential lateral movement or propagation, where a file
      named `psexesvc.exe` was dropped and executed from a remote location. This remote activity might indicate an attacker
      or malware. Subsequently, a sequence of alerts indicative of human-operated malicious activity on the same device followed,
      which might lead to ransomware or other payloads.'
    question: 'Can you identify the name of a dropped file that might be used for credential theft, privilege escalation,
      or lateral movement related to this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A file was dropped and launched from the remote IP address `141.216.110.153`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A potential human-operated malicious activity was observed involving the file `rubeus.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Multiple dual-purpose tools, including `domaindominance27.ps1`, were dropped on the device for 
          potential malicious use.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
