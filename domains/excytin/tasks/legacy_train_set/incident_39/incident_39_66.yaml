tasks:
- task_id: incident_39_legacy_train_set_task_66
  title: incident_39_legacy_train_set_task_66
  description: 'Which individual was responsible for sending the replication request from VNEVADO-Win10V to VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'A known credential theft tool was executed on host `vnevado-win10v` under the account `tgs2z`, indicating
      an intent to dump credentials. Additionally, a process suspiciously stopped services on this host, likely to avoid detection
      and facilitate data encryption or destruction. This sequence of malicious activities culminated in an attack that involved
      a replication request sent from VNEVADO-Win10V to VNEVADO-DC.'
    question: 'Which individual was responsible for sending the replication request from VNEVADO-Win10V to VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Julian Burke'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Julian Burke'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A credential theft tool was executed using `powershell.exe` command line.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious process was detected, involving the account with AadUserId 
          `7fcf9695-68fc-4258-864d-e1e5b166c66f`, that stopped services on the device.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A suspected DCSync attack was performed by Julian Burke (IT director) from VNEVADO-Win10V, as he 
          sent 1 replication request to VNEVADO-DC.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
