tasks:
- task_id: incident_39_legacy_train_set_task_98
  title: incident_39_legacy_train_set_task_98
  description: 'Who was the individual identified as the Helpdesk Administrator attempting to authenticate against VNEVADO-DC
    during the suspected overpass-the-hash attack (Kerberos)?'
  inherit_shared: true
  initial_context:
    incident_context: 'A series of security alerts were noted, including a suspicious account creation, user and IP address
      reconnaissance via SMB, and a suspected overpass-the-hash attack involving authentication attempts against VNEVADO-DC.'
    question: 'Who was the individual identified as the Helpdesk Administrator attempting to authenticate against VNEVADO-DC
      during the suspected overpass-the-hash attack (Kerberos)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Emma Clark'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Emma Clark'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A new user account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` was created, which might 
          indicate an attempt to maintain access to the device or organization.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Ethan Brooks (Account Executive) on host `VNEVADO-Win10V` enumerated SMB sessions on host 
          `VNEVADO-DC`, retrieving recent IP addresses of 2 accounts.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Emma Clark (Helpdesk Administrator) on host `VNEVADO-Win10V` attempted to authenticate against host
          `VNEVADO-DC`, which might indicate a suspected overpass-the-hash attack.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
