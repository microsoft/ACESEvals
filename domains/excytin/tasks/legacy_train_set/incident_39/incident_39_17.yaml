tasks:
- task_id: incident_39_legacy_train_set_task_17
  title: incident_39_legacy_train_set_task_17
  description: 'Which suspicious service was started using the `net.exe` command?'
  inherit_shared: true
  initial_context:
    incident_context: 'There has been a sequence of alerts indicating potential human-operated malicious activity which might
      lead to ransomware or other payloads being installed on target devices. Some of the notable processes executed include
      `powershell.exe` to disable real-time monitoring, `psexesvc.exe`, and `rubeus.exe` used to extract service tickets.
      These actions were observed on host `vnevado-win10b` and involved accounts such as `kyleg` (AadUserId: 97e6a954-b6bd-48a5-808c-bd8464cce677)
      and `fk8mq` (Sid: S-1-5-21-1540151660-3530000288-105586595-1517). One particular instance included the extraction of
      credentials using the Rubeus tool, which was later executed via command line by the user `lucasb`.'
    question: 'Which suspicious service was started using the `net.exe` command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntds'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ntds'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious service was launched with command line `net.exe start ntds` at 
          `2024-06-27t14:34:44.6620407z`, with Process ID `3400`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Multiple dual-purpose tools, such as `powershell.exe`, were dropped on the device.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Potential human-operated malicious activity was detected involving the execution of `rubeus.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
