tasks:
- task_id: incident_39_legacy_train_set_task_46
  title: incident_39_legacy_train_set_task_46
  description: 'An actor stole a Kerberos ticket from Julian Burke and used it to access resources. Can you identify the security
    identifier (SID) associated with Julian Burke''s account?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, multiple known public tools like `domaindominance27.ps1`, `psexec.exe`,
      `mimikatz.exe`, and `rubeus.exe`, which may be used for malicious reasons, were dropped on a device. This might indicate
      steps for credential theft, privilege escalation, or lateral movement by attackers. Subsequently, a sign-in attempt
      was detected using a deceptive user account, suggesting a potential attacker might use a decoy account on the device.'
    question: 'An actor stole a Kerberos ticket from Julian Burke and used it to access resources. Can you identify the security
      identifier (SID) associated with Julian Burke''s account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-0-25-1848151668-3534030238-185306563-542'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-0-25-1848151668-3534030238-185306563-542'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Multiple dual-purpose tools that could be used for malicious activities were dropped on a device by
          an account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A sign-in attempt was detected using a deceptive user account from IP address `35.202.74.47`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A suspected identity theft (pass-the-ticket) occurred where an actor took Julian Burke (IT 
          director)'s Kerberos ticket from VNEVADO-Win10B and used it on VNEVADO-Win10V to access 4 resources, with the 
          account having SID `S-1-0-25-1848151668-3534030238-185306563-542`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
