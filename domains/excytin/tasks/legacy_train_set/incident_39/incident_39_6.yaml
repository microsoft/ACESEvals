tasks:
- task_id: incident_39_legacy_train_set_task_6
  title: incident_39_legacy_train_set_task_6
  description: 'What is the name of the account linked to the suspicious file that was registered as a service?'
  inherit_shared: true
  initial_context:
    incident_context: 'In connection with a security incident involving credential theft tool execution and the dropping of
      dual-purpose tools on a device, a suspicious file was registered as a service, likely for persistence. This activity
      was associated with a specific account.'
    question: 'What is the name of the account linked to the suspicious file that was registered as a service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A malicious credential theft tool was executed by a user with AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Multiple dual-purpose tools, including `psexesvc.exe`, were dropped on a device.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A file registered as a suspicious service by a user with account name `fk8mq`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
