tasks:
- task_id: incident_39_legacy_train_set_task_15
  title: incident_39_legacy_train_set_task_15
  description: 'As part of this series of alerts, a remote session was seen dropping and executing a file. What is the IP
    address associated with this remote session?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious sequence of exploration activities was detected which involved a process executing a set
      of windows commands that could be used by attackers to identify valuable assets and coordinate lateral movement after
      compromising a machine. The commands executed suggest attempts to add users, query domain groups, and manipulate domain
      accounts. Following this, activity indicating the use of the Rubeus tool for actions such as kerberoasting and pass-the-ticket
      techniques was observed on the same endpoint. This suggests further steps in credential harvesting were being performed.'
    question: 'As part of this series of alerts, a remote session was seen dropping and executing a file. What is the IP address
      associated with this remote session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious sequence of exploration activities was observed involving the account with SID 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The use of the Rubeus kerberoasting tool was detected, with the tool being identified as 
          `rubeus.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A file was dropped and launched from the remote IP address `141.216.110.153` indicating a possible 
          lateral movement or malware propagation attempt.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
