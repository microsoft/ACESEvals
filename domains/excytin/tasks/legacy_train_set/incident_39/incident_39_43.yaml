tasks:
- task_id: incident_39_legacy_train_set_task_43
  title: incident_39_legacy_train_set_task_43
  description: 'There is also a suspected DCSync attack (replication of directory services) within the same incident. Can
    you identify the email of the user involved in the DCSync attack?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was detected involving a SID history injection. This SID history injection is detected
      on a device and was traced back to the account `lucasb` with a PowerShell command involving `net.exe` and `powershell.exe`
      on the host `vnevado-dc`. The detected process ids with their respective command lines are `3780` and `7712`. This suggests
      an attacker might be using SID history changes to achieve elevated privileges. Note: SID history is an attribute that
      supports migration scenarios and is usually targeted by attackers to gain elevated privileges and persist in the system.'
    question: 'There is also a suspected DCSync attack (replication of directory services) within the same incident. Can you
      identify the email of the user involved in the DCSync attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Julian Burke@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Julian Burke@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A SID history injection was detected on the account with AadUserId 
          `7fcf9695-68fc-4258-864d-e1e5b166c66f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspected DCSync attack was performed by `Julian Burke (IT director)` using the email `Julian 
          Burke@vnevado.alpineskihouse.co` on device `VNEVADO-Win10V`, sending a replication request to `VNEVADO-DC`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
