tasks:
- task_id: incident_39_legacy_train_set_task_91
  title: incident_39_legacy_train_set_task_91
  description: 'What is the identifier (Name) of the account from the final alert associated with the execution of the malicious
    credential theft tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was reported involving Julian Burke (IT director) who sent a replication request
      to VNEVADO-DC from the machine VNEVADO-Win10V, which is suspected to be a DCSync attack. During the investigation, it
      was found that Ethan Brooks (Account Executive) on the same machine enumerated SMB sessions on VNEVADO-DC to retrieve
      IP addresses of 2 accounts. Ultimately, there was a detection of a command line execution of a known malicious credential
      theft tool that indicated an intent to dump users'' credentials, keys, and plain-text passwords.'
    question: 'What is the identifier (Name) of the account from the final alert associated with the execution of the malicious
      credential theft tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Julian Burke (IT director) on host `VNEVADO-Win10V` sent 1 replication request to `VNEVADO-DC`, 
          indicating a suspected DCSync attack.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Ethan Brooks (Account Executive) on host `VNEVADO-Win10V` enumerated SMB sessions on `VNEVADO-DC`, 
          retrieving recent IP addresses of 2 accounts. The AadUserId associated with this activity is 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A malicious credential theft tool execution was detected with the intent to dump users' 
          credentials. The account linked to this activity is `tgs2z`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
