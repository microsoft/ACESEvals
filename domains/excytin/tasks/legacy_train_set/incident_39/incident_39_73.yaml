tasks:
- task_id: incident_39_legacy_train_set_task_73
  title: incident_39_legacy_train_set_task_73
  description: 'Who was the user account that had a Security Identification (SID) history injection detected in this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving the Mimikatz credential theft tool was detected on the device `vnevado-win10v`
      on 2024-07-04. Mimikatz is used by attackers to harvest credentials such as plaintext passwords, password hashes, smartcard
      PINs, and Kerberos tickets. The presence of the Mimikatz tool indicates that an attacker might be attempting to log
      into this or other devices on the network by impersonating a valid user.'
    question: 'Who was the user account that had a Security Identification (SID) history injection detected in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The credential theft tool Mimikatz was detected being executed by `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was a Security Identification (SID) history injection detected involving the account 
          `lucasb`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
