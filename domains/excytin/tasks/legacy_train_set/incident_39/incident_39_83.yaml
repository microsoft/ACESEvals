tasks:
- task_id: incident_39_legacy_train_set_task_83
  title: incident_39_legacy_train_set_task_83
  description: 'In a related alert about suspected identity theft (pass-the-ticket), which user had their Kerberos ticket
    stolen and used on another machine?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was identified where a file `psexesvc.exe` was dropped and executed remotely, which
      might indicate an attacker or a malware attempting to move laterally or propagate. The process ID associated with `psexesvc.exe`
      was 7668, and it was launched on host `vnevado-dc` by the user account `lucasb`. The IP address involved in this activity
      was `141.216.110.153`.'
    question: 'In a related alert about suspected identity theft (pass-the-ticket), which user had their Kerberos ticket stolen
      and used on another machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Julian Burke@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Julian Burke@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attacker or malware used a remote session to drop a file and execute it, involving the user with
          AadUserId `7fcf9695-68fc-4258-864d-e1e5b166c66f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was suspected identity theft involving Julian Burke (IT director), where an actor took his 
          Kerberos ticket from VNEVADO-Win10B and used it on VNEVADO-Win10V to access 4 resources. His email is `Julian 
          Burke@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
