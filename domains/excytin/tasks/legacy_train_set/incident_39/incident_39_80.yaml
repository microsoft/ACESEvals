tasks:
- task_id: incident_39_legacy_train_set_task_80
  title: incident_39_legacy_train_set_task_80
  description: 'For the malicious credential theft tool execution detected, can you provide the SID of the account involved
    in this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A multi-stage security incident involving suspicious activities was detected on host `vnevado-dc`.
      A suspicious service was launched using `net.exe`, which might be an indicator of attackers trying to maintain persistence
      or elevate privileges on the target device. The process was initiated by account named `lucasb` with SID `S-1-5-21-1440151660-4837038288-105596163-1120`.
      Following this, further suspicious activities were observed indicating a potential execution of a credential theft tool.'
    question: 'For the malicious credential theft tool execution detected, can you provide the SID of the account involved
      in this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-5-7-21-1843151660-3234030288-105586167-1422'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-5-7-21-1843151660-3234030288-105586167-1422'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious service was launched using `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A known credential theft tool execution command line was detected associated with the user account 
          having SID `S-5-7-21-1843151660-3234030288-105586167-1422`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
