tasks:
- task_id: incident_39_legacy_train_set_task_42
  title: incident_39_legacy_train_set_task_42
  description: 'What is the name of the account associated with the malicious credential theft tool execution detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident has been identified where a suspicious service was started on a device on 2024-07-04.
      The suspicious process `services.exe` with Process ID 684 and `psexesvc.exe` with Process ID 5912 were involved. This
      service could be used by attackers to launch malicious commands or programs. Subsequently, ''Kekeo'' malware was detected
      on the same device, indicating possible lateral movement by the attacker. Also, multiple dual-purpose tools, which could
      be used for credential theft, privilege escalation, and lateral movement, were dropped. Finally, a known credential
      theft tool submission was detected, suggesting an attempt to steal credentials.'
    question: 'What is the name of the account associated with the malicious credential theft tool execution detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious service was launched with command line `psexesvc.exe` at 
          `2024-06-27t14:33:27.3525354z`, with Process ID `5512`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: The 'Kekeo' malware was detected with the filename `rubeus.exe` during lateral movement.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Multiple dual-purpose tools were dropped on the device by the AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: A malicious credential theft tool execution was detected, executed by the account with Name 
          `tgs2z`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
