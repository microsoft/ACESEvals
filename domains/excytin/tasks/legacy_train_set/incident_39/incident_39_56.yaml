tasks:
- task_id: incident_39_legacy_train_set_task_56
  title: incident_39_legacy_train_set_task_56
  description: 'Can you analyze the suspicious service activity and provide the command line details for the process involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'A multi-faceted security incident started with emails containing a malicious URL `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`
      being delivered and later removed. The emails were associated with accounts including Ethan Brooks with the email address
      `Ethan Brooks@vnevado.alpineskihouse.co`. Later, there was activity indicating the use of Rubeus tool to perform kerberoasting
      or pass-the-ticket attacks, followed by detection of ''Kekeo'' malware which could have been stopped before paying out
      its payload.'
    question: 'Can you analyze the suspicious service activity and provide the command line details for the process involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '5912__2024-06-27t14:32:53.2267179z__psexesvc.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '5912__2024-06-27t14:32:53.2267179z__psexesvc.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The email account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` received an email with a 
          malicious URL which was later removed.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: The Rubeus kerberoasting tool was detected with the executable name `rubeus.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: The host `vnevado-win10b` was found to have the 'Kekeo' malware.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: A suspicious service was launched with Process ID `5912` at `2024-06-27t14:32:53.2267179z` using 
          the command line `psexesvc.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
