tasks:
- task_id: incident_39_legacy_train_set_task_27
  title: incident_39_legacy_train_set_task_27
  description: 'Regarding a related alert, can you find the name of the account associated with the execution of a known malicious
    credential theft tool?'
  inherit_shared: true
  initial_context:
    incident_context: ''
    question: 'Regarding a related alert, can you find the name of the account associated with the execution of a known malicious
      credential theft tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The email account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` received an email with a
          malicious URL, which was later removed.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A malicious credential theft tool was executed by the account with the name `tgs2z`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
