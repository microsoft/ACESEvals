tasks:
- task_id: incident_39_legacy_train_set_task_49
  title: incident_39_legacy_train_set_task_49
  description: 'In relation to this malware activity, there was also a detection of a malicious credential theft tool execution.
    Can you identify the account name associated with this credential theft tool execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'A ''Kekeo'' malware detection was reported on 2024-07-04. The malware and unwanted software typically
      perform disruptive or harmful actions on the affected machines and might replicate or spread. It is important to check
      the machine for signs of infection. This detection included a file `rubeus.exe` indicating potential malware activity.'
    question: 'In relation to this malware activity, there was also a detection of a malicious credential theft tool execution.
      Can you identify the account name associated with this credential theft tool execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The 'Kekeo' malware was detected on the host with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A malicious credential theft tool was executed by the account `tgs2z`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
