tasks:
- task_id: incident_39_legacy_train_set_task_85
  title: incident_39_legacy_train_set_task_85
  description: 'What is the file name associated with potential human-operated malicious activity observed on the same device?'
  inherit_shared: true
  initial_context:
    incident_context: 'A sign-in attempt using a deceptive user account was detected on the device with hostname `vnevado-win10v`
      and IP address `35.202.74.47`. The account involved had the name `tgs2z` and the SID `S-5-7-21-1843151660-3234030288-105586167-1422`.
      This may indicate an attacker using a fake or decoy account to perform attack activities, including lateral movement
      and accessing sensitive data.'
    question: 'What is the file name associated with potential human-operated malicious activity observed on the same device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A sign-in attempt was detected using a deceptive user account `kyleg`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A sequence of potential human-operated malicious activities was observed, involving a file named 
          `rubeus.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
