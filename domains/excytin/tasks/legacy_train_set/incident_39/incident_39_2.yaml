tasks:
- task_id: incident_39_legacy_train_set_task_2
  title: incident_39_legacy_train_set_task_2
  description: 'What is the name of the malicious credential theft tool that was executed according to the end alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'An active ''Kekeo'' malware was detected on the machine identified by hostname `vnevado-win10b`. This
      machine has the associated account `fk8mq`, and an AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677`. The malware is
      known for performing annoying, disruptive, or harmful actions and has persistence mechanisms, making it a high-severity
      threat. Additionally, activity indicating the use of the Rubeus tool, which can perform kerberoasting and pass-the-ticket
      techniques, was observed. This is often seen during attacks where attackers request Kerberos tickets to decrypt credentials
      or authenticate directly.'
    question: 'What is the name of the malicious credential theft tool that was executed according to the end alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An active 'Kekeo' malware was detected with the executable file named `rubeus.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Possible use of the Rubeus kerberoasting tool was observed, involving the account with SID 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A malicious credential theft tool execution command line was detected, referring to the file named 
          `get-krbticket.ps1`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
