tasks:
- task_id: incident_39_legacy_train_set_task_47
  title: incident_39_legacy_train_set_task_47
  description: 'Who is the account associated with the file that was dropped and launched from a remote location in this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving malware detection and lateral movement attempt was reported. An active
      ''Kekeo'' malware was detected running on the host `vnevado-win10b`, which was identified with the file `rubeus.exe`
      linked to the account `fk8mq` (SID: S-1-5-21-1540151660-3530000288-105586595-1517, AadUserId: 97e6a954-b6bd-48a5-808c-bd8464cce677).
      This was followed by an alert indicating that a file was dropped and launched from a remote location, potentially by
      an attacker or malware attempting to move laterally or propagate.'
    question: 'Who is the account associated with the file that was dropped and launched from a remote location in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An active 'Kekeo' malware was detected on the host with AadDeviceId 
          `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A file named `psexesvc.exe` was dropped and launched during a remote session.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The file was dropped and launched from an account with the name `lucasb`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
