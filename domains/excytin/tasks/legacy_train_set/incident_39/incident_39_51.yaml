tasks:
- task_id: incident_39_legacy_train_set_task_51
  title: incident_39_legacy_train_set_task_51
  description: 'What was the IP address used in the deceptive user account sign-in attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a recent security incident involving credential theft using Mimikatz and lateral movement,
      the Mimikatz tool was detected and various command lines involving `mimikatz.exe` were executed to harvest credentials
      and potentially log into other devices on the network. Subsequently, a sign-in attempt was detected using a deceptive
      user account on this device, which might be part of the attack activities aimed at lateral movement and accessing sensitive
      data.'
    question: 'What was the IP address used in the deceptive user account sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Mimikatz credential theft tool was detected on a device and an account with SID 
          `S-5-7-21-1843151660-3234030288-105586167-1422` might be compromised.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A sign-in attempt was detected using a deceptive user account named `kyleg`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The sign-in attempt using the deceptive user account `kyleg` originated from the IP address 
          `141.216.110.153`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
