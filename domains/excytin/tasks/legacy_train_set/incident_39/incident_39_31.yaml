tasks:
- task_id: incident_39_legacy_train_set_task_31
  title: incident_39_legacy_train_set_task_31
  description: 'What is the name of the account that was observed in the end alert, possibly involved in the kerberoasting
    attack using the Rubeus tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was detected involving PsExec being used to launch a command on a remote device
      `vnevado-win10v`. This incident might indicate an attacker leveraging PsExec to execute malicious commands and move
      laterally within the organization. One of the commands involved launching the `rubeus.exe` tool, which is often used
      for Kerberos ticket attacks.'
    question: 'What is the name of the account that was observed in the end alert, possibly involved in the kerberoasting
      attack using the Rubeus tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: PsExec was used to launch a command on a remote device, with the associated file `adminticket.txt`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The account `fk8mq` was involved in activity indicating the use of the Rubeus kerberoasting tool, 
          which can perform attacks such as kerberoasting and pass-the-ticket.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
