tasks:
- task_id: incident_39_legacy_train_set_task_45
  title: incident_39_legacy_train_set_task_45
  description: 'Can you identify the process that executed the suspicious sequence of exploration activities?'
  inherit_shared: true
  initial_context:
    incident_context: 'As an addition to the Kekeo malware investigation on host `vnevado-win10b`, there was also a suspicious
      sequence of exploration activities identified. Such windows commands can be leveraged by attackers for reconnaissance
      and to coordinate lateral movement after compromising a machine. We need to further analyze this by identifying the
      specific process that performed these reconnaissance activities.'
    question: 'Can you identify the process that executed the suspicious sequence of exploration activities?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'whoami.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'whoami.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An active 'Kekeo' malware was detected running the process `rubeus.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: PsExec was used to launch a command on a remote device, running the process `net.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A suspicious sequence of exploration activities was detected, with the command line process 
          `whoami.exe` executed at `2024-06-27t14:32:19.285352z` with Process ID `6512`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
