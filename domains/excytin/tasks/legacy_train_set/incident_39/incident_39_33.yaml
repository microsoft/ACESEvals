tasks:
- task_id: incident_39_legacy_train_set_task_33
  title: incident_39_legacy_train_set_task_33
  description: 'A user clicked on a link in an email that was quarantined by zero-hour auto purge (ZAP). Can you identify
    the name of the user who accessed this link?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involved the ''Kekeo'' malware detected during lateral movement on the device `vnevado-win10b`.
      Subsequently, multiple dual-purpose tools were dropped on the same device. Later, a separate incident occurred where
      a user clicked on a link in a ZAP-quarantined email. Can you identify the name of the user related to this incident?'
    question: 'A user clicked on a link in an email that was quarantined by zero-hour auto purge (ZAP). Can you identify the
      name of the user who accessed this link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The malware `rubeus.exe` (associated with 'Kekeo') was detected on the device at `2024-07-04 
          22:35:04.098458+00:00`. An attacker might be attempting to move laterally to this device from another device 
          on the network.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Multiple public tools which could potentially be used for malicious purposes were dropped on the 
          device around `2024-07-04 22:35:02.325756+00:00`, by the user with AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The user `Ethan Brooks` accessed a link in an email that was quarantined by zero-hour auto purge 
          (ZAP) on `2024-07-10 11:24:45.448724+00:00`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
