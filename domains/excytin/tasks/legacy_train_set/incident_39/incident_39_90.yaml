tasks:
- task_id: incident_39_legacy_train_set_task_90
  title: incident_39_legacy_train_set_task_90
  description: 'Which user was reported to perform SMB session enumeration on VNEVADO-DC to retrieve account-related IP addresses?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert reported a user on VNEVADO-Win10V performing reconnaissance activities, specifically enumerating
      SMB sessions on VNEVADO-DC and retrieving IP addresses associated with accounts.'
    question: 'Which user was reported to perform SMB session enumeration on VNEVADO-DC to retrieve account-related IP addresses?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The malware 'Kekeo' was detected on the machine with the file name `rubeus.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Multiple dual-purpose tools were dropped by the account with SID 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The user `Ethan Brooks` performed IP address reconnaissance (SMB) on the device `VNEVADO-Win10V` 
          and enumerated SMB sessions on `VNEVADO-DC`, retrieving recent IP addresses of 2 accounts.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
