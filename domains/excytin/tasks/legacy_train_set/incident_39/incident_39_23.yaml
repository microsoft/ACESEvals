tasks:
- task_id: incident_39_legacy_train_set_task_23
  title: incident_39_legacy_train_set_task_23
  description: 'Related to this incident, there was observed lateral movement to another device following a suspicious network
    event. Can you identify the IP address associated with the device to which the attacker was moving laterally?'
  inherit_shared: true
  initial_context:
    incident_context: 'A multi-stage security incident involving initial access and possible lateral movement was reported.
      During the investigation, it was identified that a file `psexesvc.exe` was launched, and commands initiating `rubeus.exe`
      were executed. This activity is indicative of the Rubeus tool usage to perform Kerberoasting and possibly pass-the-ticket
      attack techniques.'
    question: 'Related to this incident, there was observed lateral movement to another device following a suspicious network
      event. Can you identify the IP address associated with the device to which the attacker was moving laterally?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '35.202.74.47'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There is activity indicating the use of the Rubeus tool on host with AadDeviceId 
          `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was a lateral movement observed from IP address `35.202.74.47`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
