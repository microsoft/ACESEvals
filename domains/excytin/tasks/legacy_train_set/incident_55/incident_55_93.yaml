tasks:
- task_id: incident_55_legacy_train_set_task_93
  title: incident_55_legacy_train_set_task_93
  description: 'What is the mailbox primary address associated with the emails containing malicious URL that were removed
    after delivery?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert was generated on 2024-07-06 indicating an attempt to hide the use of a dual-purpose tool under
      an unexpected filename. The process involved had a ProcessId of 5752 and was run with the command line: `iy2orr1e.rrg.exe
      -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`.
      This is part of an investigation into a multi-stage incident concerning various exploration activities, suspicious access
      to LSASS service, and an internal phishing campaign.'
    question: 'What is the mailbox primary address associated with the emails containing malicious URL that were removed after
      delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: The account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` is observed using a tool known
          for both legitimate and malicious purposes, potentially under a deceptive filename.
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: A process named `powershell.exe` executed a series of suspicious commands potentially used for 
          asset identification and lateral movement.
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: The account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` accessed the LSASS service, which
          could be an attempt to obtain clear-text passwords for further lateral movement.
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: The user account `Nina Sullivan` sent phishing emails internally, indicating a possible compromise 
          and an attempt for lateral movement within the organization.
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: Emails containing a malicious URL were sent to the mailbox `santiago@vnevado.alpineskihouse.co` and
          subsequently removed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
