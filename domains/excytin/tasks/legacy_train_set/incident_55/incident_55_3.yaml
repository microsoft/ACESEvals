tasks:
- task_id: incident_55_legacy_train_set_task_3
  title: incident_55_legacy_train_set_task_3
  description: 'Can you identify the IP address associated with the suspicious system hardware discovery alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a recent security incident, a suspicious DCSync attack was detected involving Luciano Herrera
      (CIO) on the host MB-WINCLIENT. Luciano sent a replication request to MB-DC1. There was also a related alert involving
      suspicious system hardware discovery, which indicates that attackers might be trying to gather information about the
      target device or network for later attacks.'
    question: 'Can you identify the IP address associated with the suspicious system hardware discovery alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A DCSync attack was detected, where the account with AadUserId 
          `2de70991-2799-4a95-b734-8e3df3a50118` sent a replication request from MB-WINCLIENT to MB-DC1.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious system hardware discovery was attempted from the IP address `72.5.72.208`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
