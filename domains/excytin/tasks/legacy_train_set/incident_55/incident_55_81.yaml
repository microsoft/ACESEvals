tasks:
- task_id: incident_55_legacy_train_set_task_81
  title: incident_55_legacy_train_set_task_81
  description: 'Can you identify the recipient of the email messages containing the malicious URL that were removed after
    delivery?'
  inherit_shared: true
  initial_context:
    incident_context: 'A multi-stage security incident involving various malicious activities was observed. Initially, a suspicious
      file named `iy2orr1e.rrg.exe` was launched on the host `mb-adfs` by the account `gsmith`. This might have been an attempt
      to hide the use of a dual-purpose tool for malicious activities. Following this, there were signs of a system executable
      being renamed and possibly used for malicious purposes, code injection into processes, and an account sending phishing
      emails. The incident eventually led to malicious URL-containing emails being delivered and then removed.'
    question: 'Can you identify the recipient of the email messages containing the malicious URL that were removed after delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: The host `mb-adfs` saw an attempt to hide the use of a dual-purpose tool.
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: A renamed Windows executable `powershell.exe` was launched, potentially for malicious activities.
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: Code injection was detected in a process belonging to an account with SID 
          `S-1-5-21-561436748-3867387497-1732241745-3701`.
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: An internal user account `Nina Sullivan@vnevado.alpineskihouse.co` sent phishing emails within the 
          organization, indicating possible account compromise.
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: Emails containing malicious URLs and sent to `santiago@vnevado.alpineskihouse.co` were removed 
          after delivery.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
