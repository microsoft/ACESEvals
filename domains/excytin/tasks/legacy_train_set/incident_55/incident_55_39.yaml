tasks:
- task_id: incident_55_legacy_train_set_task_39
  title: incident_55_legacy_train_set_task_39
  description: 'Can you identify the email address of the user who created the suspicious service `DDLOXJDSQSNGMUKKFUXQ` on
    MB-ADFS?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a security incident involving multiple alerts, a malicious email with a URL (`http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`)
      was sent to and removed from the mailbox of `santiago@vnevado.alpineskihouse.co`. Later, the incident revealed an internal
      phishing campaign and a sequence of suspicious exploration activities, which indicated that an attacker might be coordinating
      lateral movements. Finally, it was observed that a suspicious service was created to execute potentially malicious commands
      on MB-ADFS.'
    question: 'Can you identify the email address of the user who created the suspicious service `DDLOXJDSQSNGMUKKFUXQ` on
      MB-ADFS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: The user account with SID `S-1-5-11-7842151660-4834030208-105586563-1139` received an email 
          containing a malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: The user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` was observed sending 
          phishing emails internally, possibly indicating compromise.
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: A suspicious process `powershell.exe` was detected executing a series of windows commands, likely 
          performing exploration activities.
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: The process was initiated by a user with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: The user `gsmith@niseko.alpineskihouse.co` created a suspicious service `DDLOXJDSQSNGMUKKFUXQ` on 
          `MB-ADFS` to potentially execute malicious commands.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
