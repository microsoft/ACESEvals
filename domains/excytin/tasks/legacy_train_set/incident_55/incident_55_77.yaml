tasks:
- task_id: incident_55_legacy_train_set_task_77
  title: incident_55_legacy_train_set_task_77
  description: 'What was the name of the file associated with the suspicious remote activity observed shortly after the impacket
    execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious execution of a command via Impacket was observed on a device with hostname `mb-adfs`.
      This tool connects to other hosts to explore network shares and execute commands, indicating that attackers might be
      attempting lateral movement across the network. This activity is often linked to hands-on-keyboard attacks where ransomware
      and other payloads are installed. During the investigation, multiple files including `powershell.exe` were identified
      as part of the ongoing attack.'
    question: 'What was the name of the file associated with the suspicious remote activity observed shortly after the impacket
      execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cmd.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'cmd.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious execution of a command via the Impacket toolkit was observed with the `%comspec%` file.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious remote activity was observed involving the `cmd.exe` file which can include attempts to 
          initiate interactive sessions, modify files, pass WMI commands, create scheduled tasks, and other potentially 
          malicious activities.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
