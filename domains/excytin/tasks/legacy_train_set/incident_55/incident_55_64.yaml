tasks:
- task_id: incident_55_legacy_train_set_task_64
  title: incident_55_legacy_train_set_task_64
  description: 'What is the name and instance of the cloud application to which Luciano Herrera added credentials?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving suspicious task scheduler activity was observed, where a process used
      Task Scheduler to create, modify, or delete a task, potentially aiming to launch malicious code automatically and establish
      persistence. The ProcessId__CreatedTimeUtc__CommandLine details of `6808__2024-07-02t09:48:12.7628138z__powershell.exe
      -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqbl... somemore... --field-handle setup. The host involved
      in this activity is `mb-adfs`. This suspicious activity continued with an LDAP query indicative of potential reconnaissance.
      Finally, there was an unusual addition of credentials to an OAuth application ''SimulandApp'' by the user Luciano Herrera
      (pwilson@niseko.alpineskihouse.co).'
    question: 'What is the name and instance of the cloud application to which Luciano Herrera added credentials?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'office 365__microsoft 365'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'office 365__microsoft 365'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The process `powershell.exe` was used in a suspicious Task Scheduler activity on `2024-07-04` at 
          `22:35:02.074477+00:00`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious LDAP query was executed by an account with AadUserId 
          `2de70991-2799-4a95-b734-8e3df3a50118` on `2024-07-04` at `22:35:03.848291+00:00`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: On `2024-07-07`, Luciano Herrera (pwilson@niseko.alpineskihouse.co) performed an unusual addition 
          of credentials to an OAuth app named `office 365__microsoft 365`, which may indicate that the app has been 
          compromised.
