tasks:
- task_id: incident_55_legacy_train_set_task_91
  title: incident_55_legacy_train_set_task_91
  description: 'In relation to a suspicious service creation on host `MB-ADFS`, which user account is associated with this
    activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious LDAP query aimed at extracting ADFS private keys or facilitating lateral movement on the
      network was flagged on host `mb-adfs`. The suspicious process `iy2orr1e.rrg.exe` was launched multiple times with hidden
      window style and encoded commands. This incident is part of a larger investigation where we need to identify the user''s
      activities that might be malicious.'
    question: 'In relation to a suspicious service creation on host `MB-ADFS`, which user account is associated with this
      activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account `gsmith` executed a suspicious LDAP query targeting ADFS private keys on `2024-07-04 
          22:35:02.751926+00:00`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same account `gsmith` (Email: `gsmith@niseko.alpineskihouse.co`) created a suspicious service named
          `DDLOXJDSQSNGMUKKFUXQ` on `2024-07-10 11:24:45.488649+00:00` to execute potentially malicious commands on MB-ADFS.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
