      Grey` with email `Lucas Grey@niseko.alpineskihouse.co`.'
    question: 'During the investigation of the incident, a suspicious sequence of exploration activities was detected. Can
      you provide the Security Identifier (Sid) of the account involved in these suspicious activities?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
