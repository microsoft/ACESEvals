tasks:
- task_id: incident_55_legacy_train_set_task_20
  title: incident_55_legacy_train_set_task_20
  description: 'What is the primary email address of the mailbox to which emails containing malicious URL were delivered and
    later removed?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a security incident, a suspicious system hardware discovery was detected on 2024-07-04.
      The file `svchost.exe` was observed running on host `mb-winclient` by user accounts including `bjenkins` and `pwilson`.
      This was followed by an internal phishing campaign where a user was observed to have sent phishing emails from this
      device to recipients inside the organization. This internal phishing activity was flagged by Microsoft Defender for
      Office 365.'
    question: 'What is the primary email address of the mailbox to which emails containing malicious URL were delivered and
      later removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A user with SID `S-1-5-21-561436748-3867387497-1732241745-3701` engaged in suspicious system 
          hardware discovery.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The user with SID `S-1-5-11-7842151660-4834030208-105586563-1139` sent phishing emails internally 
          within the organization, indicating a potential account compromise.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An email containing a malicious URL was sent to the mailbox with the primary address 
          `santiago@vnevado.alpineskihouse.co`, and it was later removed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
