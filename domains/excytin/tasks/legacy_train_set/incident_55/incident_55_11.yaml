tasks:
- task_id: incident_55_legacy_train_set_task_11
  title: incident_55_legacy_train_set_task_11
  description: 'Can you identify the sender''s email address of the malicious email messages that were delivered and later
    removed as part of the phishing campaign?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of an ongoing security incident, a hands-on-keyboard attack via Impacket toolkit was observed,
      indicating an attempt to move laterally across the network. During this attack, a command was suspiciously executed
      on the device named `mb-adfs`. The attack involved multiple stages and tactics, including credentials memory read and
      a phishing campaign originating from a compromised internal user account.'
    question: 'Can you identify the sender''s email address of the malicious email messages that were delivered and later
      removed as part of the phishing campaign?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '4qs6v9m@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '4qs6v9m@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A command via Impacket was executed by the process `lsass.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A sensitive credential memory read was performed by a user with AadUserId 
          `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` on `lsass.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: An internal phishing campaign was executed by a user with AadUserId 
          `28058d92-fc24-4869-9231-6546a34b00f2`, indicating potential compromise.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Email messages containing a malicious URL were sent by `4qs6v9m@vnevado.alpineskihouse.co` and 
          later removed after delivery.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
