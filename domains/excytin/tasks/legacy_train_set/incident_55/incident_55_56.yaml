tasks:
- task_id: incident_55_legacy_train_set_task_56
  title: incident_55_legacy_train_set_task_56
  description: 'As part of this incident, there was an attempt to extract ADFS private keys. Can you provide the AadUserId
    of the account suspected in this ADFS private key extraction attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving the use of malicious PowerShell Cmdlets was reported on the machine `mb-winclient`.
      The process ID `12412` was running the command line `powershell.exe -noexit -command set-location -literalpath ''c:\users\bjenkins\downloads\midnight14''`.
      This Cmdlet may be associated with credential theft, exploitation, network reconnaissance, or code injection. There
      was also a suspicious sequence of exploration activities recorded where a process invoked a set of windows commands
      which can be used by attackers to identify assets of value and coordinate lateral movement after compromising a machine.'
    question: 'As part of this incident, there was an attempt to extract ADFS private keys. Can you provide the AadUserId
      of the account suspected in this ADFS private key extraction attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A malicious PowerShell Cmdlet `powershell.exe` was invoked on the machine.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious sequence of exploration activities was detected from process with Process ID `8764`, 
          created at `2024-07-04T00:00:01.698205Z`, with command line `iy2orr1e.rrg.exe -windowstyle hidden 
          -encodedcommand 
          qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: There was an ADFS private key extraction attempt with an LDAP query by a user with AadUserId 
          `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.
