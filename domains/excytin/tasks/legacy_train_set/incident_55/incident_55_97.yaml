tasks:
- task_id: incident_55_legacy_train_set_task_97
  title: incident_55_legacy_train_set_task_97
  description: 'Following the initial alert regarding process injection, an internal phishing campaign was detected. Can you
    identify the Azure Active Directory (AAD) User ID associated with the compromised account that sent phishing emails internally
    on July 7th, 2024?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was detected where a process was injected with potentially malicious code on July
      4th, 2024, at 22:35:02 UTC. The process injection may indicate suspicious code being run in the target process memory,
      which could lead to abnormal behaviors such as opening a listening port or connecting to a command and control server.'
    question: 'Following the initial alert regarding process injection, an internal phishing campaign was detected. Can you
      identify the Azure Active Directory (AAD) User ID associated with the compromised account that sent phishing emails
      internally on July 7th, 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '28058d92-fc24-4869-9231-6546a34b00f2'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '28058d92-fc24-4869-9231-6546a34b00f2'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A process was injected with potentially malicious code by the user with AadUserId 
          `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An internal phishing campaign was observed, where a user with AadUserId 
          `28058d92-fc24-4869-9231-6546a34b00f2` sent phishing emails inside the organization.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
