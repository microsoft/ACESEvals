tasks:
- task_id: incident_55_legacy_train_set_task_72
  title: incident_55_legacy_train_set_task_72
  description: 'Which account name was associated with the renamed and launched Windows executable?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent security incident started with a malicious email delivered to `santiago@vnevado.alpineskihouse.co`
      and led to a series of events, including an internal phishing campaign, suspicious system hardware discovery, and eventually
      a renamed Windows executable being launched by a certain account.'
    question: 'Which account name was associated with the renamed and launched Windows executable?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The email account `Nina Sullivan@vnevado.alpineskihouse.co` received an email with a malicious URL,
          which was later removed.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A user account with SID `S-1-5-21-561436748-3867387497-1732241745-3701` sent phishing emails to 
          recipients within the organization.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: A suspicious system hardware discovery action was performed using `powershell.exe`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: A system executable was renamed and launched by the `SYSTEM` account.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
