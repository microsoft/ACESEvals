tasks:
- task_id: incident_55_legacy_train_set_task_52
  title: incident_55_legacy_train_set_task_52
  description: 'Related to this alert, there was a Windows executable file that was renamed and launched. Can you identify
    the account name associated with the system executable that was renamed and launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving suspicious exploration activities was detected. A process on host `mb-winclient`
      invoked a series of Windows commands using `powershell.exe`. This host relates to several accounts, including ''pwilson''.
      Some of the commands and processes identified include `powershell.exe c:\script\contosoadfsblatempcreds.ps1` and `whoami.exe
      /user`. The suspicious activity indicates that attackers may be attempting to identify valuable assets and coordinate
      lateral movement across the network.'
    question: 'Related to this alert, there was a Windows executable file that was renamed and launched. Can you identify
      the account name associated with the system executable that was renamed and launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A process `powershell.exe` was used to execute a suspicious sequence of exploration activities on 
          2024-07-04 22:35:03.197761+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A system executable file was renamed and launched, potentially by a `SYSTEM` account, on 2024-07-04
          22:35:01.543723+00:00.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
