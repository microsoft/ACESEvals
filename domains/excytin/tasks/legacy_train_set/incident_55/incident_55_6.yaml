tasks:
- task_id: incident_55_legacy_train_set_task_6
  title: incident_55_legacy_train_set_task_6
  description: 'In the final alert, who was the user account involved in attempting to hide the use of a dual-purpose tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, a series of events were flagged indicating suspicious sequence of exploration
      activities starting with a powershell script `contosoadfsblatempcreds.ps1` being executed and multiple `whoami.exe`
      checks being run. One notable observation was a process making use of a series of Windows commands which could be utilized
      to identify assets of value and coordinate lateral movement post-compromise.'
    question: 'In the final alert, who was the user account involved in attempting to hide the use of a dual-purpose tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A process called `whoami.exe` was launched, which can be used for malicious exploration activities.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The suspicious commands were executed by a user with AadUserId 
          `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A known public tool that could be used for malicious purposes was observed under an unexpected 
          filename, associated with the account `gsmith`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
