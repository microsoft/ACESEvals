tasks:
- task_id: incident_55_legacy_train_set_task_40
  title: incident_55_legacy_train_set_task_40
  description: 'During our investigation, we observed an attempt to hide the use of a dual-purpose tool under an unexpected
    filename. This was associated with an account. Can you identify the name of the account related to this suspicious attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'In our investigation of a suspicious system hardware discovery incident which involved activities likely
      aimed at gathering information about the target device or network, we noted the presence of several significant processes
      executed on the host `mb-winclient`. For example, the process `svchost.exe` with command line `2880__2024-07-02t07:28:40.7133644z__svchost.exe
      -k netsvcs -p -s winmgmt` and another process involving a PowerShell script `contosoadfsblatempcreds.ps1` were identified.'
    question: 'During our investigation, we observed an attempt to hide the use of a dual-purpose tool under an unexpected
      filename. This was associated with an account. Can you identify the name of the account related to this suspicious attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: There is a suspicious system hardware discovery performed using `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious sequence of exploration activities was performed with Process ID `3116` at 
          `2024-07-02T09:48:23.9439954Z` using the command line `iy2orr1e.rrg.exe` -windowstyle hidden -encodedcommand 
          qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An attempt to hide the use of a dual-purpose tool was detected under an account named `gsmith`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
