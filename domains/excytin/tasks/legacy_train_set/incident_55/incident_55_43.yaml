tasks:
- task_id: incident_55_legacy_train_set_task_43
  title: incident_55_legacy_train_set_task_43
  description: 'A suspicious remote activity was observed related to this machine. Can you provide the account name associated
    with this remote activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident indicated by unusual addition of credentials to an OAuth app was observed. The
      user Luciano Herrera from the organization niseko.alpineskihouse.co performed this addition of credentials. The user
      added a password to the app SimulandApp, potentially indicating that the app might be compromised for malicious purposes
      such as phishing, data exfiltration, or gaining access to other accounts and devices. Additionally, there was a report
      of a malicious PowerShell Cmdlet being invoked on a machine.'
    question: 'A suspicious remote activity was observed related to this machine. Can you provide the account name associated
      with this remote activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'LocalSystem'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'LocalSystem'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The user `Luciano Herrera` (pwilson@niseko.alpineskihouse.co) performed an unusual addition of 
          credentials to the application `SimulandApp`, using a credential of type `Password`. This was observed on the 
          account with SID `S-1-5-21-551436448-9871687716-9837441745-1903`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A malicious PowerShell Cmdlet was invoked, with the process `powershell.exe` on the machine.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Suspicious remote activity was observed, initiated by the account `LocalSystem`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
