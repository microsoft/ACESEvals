tasks:
- task_id: incident_55_legacy_train_set_task_8
  title: incident_55_legacy_train_set_task_8
  description: 'Can you identify the command line and process ID of the registered suspicious service?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident report indicates that a process scanned or dumped memory from the Local Security
      Authority Subsystem Service (lsass.exe) on the host `mb-winclient`, used by account `bjenkins`. This action can enable
      an attacker to extract sensitive credentials. The involved process was `powershell.exe`. Additionally, there was a suspicious
      registration of a system program as a service.'
    question: 'Can you identify the command line and process ID of the registered suspicious service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '764__2024-06-20t08:30:13.7925191z__services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '764__2024-06-20t08:30:13.7925191z__services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A process named `powershell.exe` scanned or dumped memory from lsass.exe to extract sensitive 
          credentials on `2024-07-04 22:35:04.120690+00:00`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A system executable renamed and launched on host `mb-adfs` on `2024-07-04 22:35:01.543723+00:00`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A system program `services.exe` was registered as a service with Process ID `764`, Created Time 
          `2024-06-20t08:30:13.7925191z`, on `2024-07-04 22:35:03.448593+00:00`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
