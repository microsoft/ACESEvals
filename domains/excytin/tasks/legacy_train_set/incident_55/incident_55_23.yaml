        description: Suspicious access to LSASS service was attempted using the process `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: There were suspicious exploration activities on host `mb-adfs`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An attempt to hide the use of a dual-purpose tool was detected for the user with AadUserId 
