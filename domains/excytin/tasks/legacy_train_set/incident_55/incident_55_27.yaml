  description: 'Can you provide the App ID for the OAuth application SimulandApp where the unusual addition of credentials
    took place?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving a malicious PowerShell Cmdlet being invoked on the machine `mb-winclient`
      occurred. The relevant file is `contosoadfsblatempcreds.ps1`, executed by user `bjenkins` using `powershell.exe`. This
      event was followed up with an unusual addition of credentials to an OAuth app called SimulandApp by the user Luciano
      Herrera (pwilson@niseko.alpineskihouse.co). This behavior may indicate that an attacker has compromised the app, potentially
      using it to spread phishing, exfiltrate data, or gain access to other accounts and devices. The user added a credential
      type Password.'
    question: 'Can you provide the App ID for the OAuth application SimulandApp where the unusual addition of credentials
      took place?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '11161'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
