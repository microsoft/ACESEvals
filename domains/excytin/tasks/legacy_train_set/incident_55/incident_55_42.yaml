tasks:
- task_id: incident_55_legacy_train_set_task_42
  title: incident_55_legacy_train_set_task_42
  description: 'What is the name of the account that was involved in the suspicious access to the LSASS service?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involved email messages containing malicious URLs, which were initially delivered
      and later removed. The malicious URL `http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was
      sent from the mailbox `4qs6v9m@vnevado.alpineskihouse.co` to `santiago@vnevado.alpineskihouse.co` with sender IP `106.214.87.198`.
      Subsequently, it was observed that a user sent phishing emails from within the organization, indicating a possible compromised
      account being used to move laterally.'
    question: 'What is the name of the account that was involved in the suspicious access to the LSASS service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The email account `Nina Sullivan` received an email with a malicious URL that was later removed.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The user with SID `S-1-5-21-561436748-3867387497-1732241745-3701` sent phishing emails to 
          recipients inside the organization, indicating a compromised account.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The account `bjenkins` was involved in suspicious access to the LSASS service, indicating potential
          attempts to decrypt clear-text passwords.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
