tasks:
- task_id: incident_55_legacy_train_set_task_48
  title: incident_55_legacy_train_set_task_48
  description: 'What was the executable file name registered as a suspicious service during the final step of this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'An email containing a malicious URL was delivered and later removed. The email was sent to `santiago@vnevado.alpineskihouse.co`
      from the IP address `106.214.87.198`. The sender''s email address was `4qs6v9m@vnevado.alpineskihouse.co` and the malicious
      URL included in the email was `http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. Following
      this, an internal phishing campaign was detected involving a compromised user account, and suspicious access to the
      LSASS service was observed. Additionally, a system executable was renamed and launched, indicating potential evasion
      of behavior-based detection mechanisms. The final alert indicated that a system program was registered as a suspicious
      service.'
    question: 'What was the executable file name registered as a suspicious service during the final step of this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: The email account with SID `S-1-5-11-7842151660-4834030208-105586563-1139` received an email with a
          malicious URL that was removed after delivery.
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: The user with account SID `S-1-5-21-561436748-3867387497-1732241745-3701` was observed sending 
          phishing emails to recipients inside the organization, indicating a potential compromise and lateral movement 
          attempt by an attacker.
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: There was a suspicious access to the LSASS service using the process `powershell.exe` to 
          potentially obtain clear-text passwords.
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: A Windows executable renamed and launched on the host `mb-adfs`, possibly to avoid detection and 
          run malicious code or connect to an attacker-controlled network address.
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: A system program `services.exe` was suspiciously registered as a service, indicating potential 
          malicious intent to establish persistence or gain system privileges.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
