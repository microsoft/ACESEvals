tasks:
- task_id: incident_55_legacy_train_set_task_76
  title: incident_55_legacy_train_set_task_76
  description: 'Can you find the email address associated with the account that created the suspicious service DDLOXJDSQSNGMUKKFUXQ
    on MB-ADFS?'
  inherit_shared: true
  initial_context:
    incident_context: 'Recently, there was an incident reported where a user clicked on a potentially malicious URL via the
      email address `bjenkins@niseko.alpineskihouse.co`. Earlier, suspicious remote activity was observed on the machine which
      involved potentially malicious actions. Additionally, the machine was scanned or dumped memory from the Local Security
      Authority Subsystem Service (lsass.exe) allowing extraction of sensitive credentials.'
    question: 'Can you find the email address associated with the account that created the suspicious service DDLOXJDSQSNGMUKKFUXQ
      on MB-ADFS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` clicked on a potentially malicious 
          URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: The process `powershell.exe` was used to scan or dump memory from the Local Security Authority 
          Subsystem Service (lsass.exe) to extract sensitive credentials.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Suspicious remote activity was observed on the machine and initiated by the user with AadUserId 
          `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: The user `gsmith` with email `gsmith@niseko.alpineskihouse.co` created a suspicious service 
          DDLOXJDSQSNGMUKKFUXQ on MB-ADFS to potentially execute malicious commands.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
