tasks:
- task_id: incident_55_legacy_train_set_task_12
  title: incident_55_legacy_train_set_task_12
  description: 'There was a suspected AD FS DKM key read in the final alert, which host was involved in reading the DKM key?'
  inherit_shared: true
  initial_context:
    incident_context: 'There has been an ongoing hands-on-keyboard attack via the Impacket toolkit. Suspicious execution of
      a command was observed on a device. This tool connects to other hosts to explore network shares and execute commands,
      often used in hands-on-keyboard attacks where ransomware and other payloads are installed on target devices. During
      this incident, a malicious PowerShell Cmdlet was invoked on the machine, likely associated with credential theft, exploitation,
      network reconnaissance, or code injection. Following this, Luciano Herrera (CIO) on `MB-WINCLIENT` sent one replication
      request to another host on the network.'
    question: 'There was a suspected AD FS DKM key read in the final alert, which host was involved in reading the DKM key?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious execution of a command via Impacket toolkit observed on process `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A malicious PowerShell Cmdlet invoked by the account with AadUserId 
          `2de70991-2799-4a95-b734-8e3df3a50118`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Luciano Herrera (CIO) on MB-WINCLIENT sent 1 replication request to host `MB-DC1`, indicating a 
          suspected DCSync attack.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Host `MB-DC1` read the DKM key of ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`, signalling
          a suspected AD FS DKM key read.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
