        title: Checkpoint 1
        description: The account `gsmith` created a suspicious service named `DDLOXJDSQSNGMUKKFUXQ` on `MB-ADFS` to 
          execute potentially malicious commands.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
