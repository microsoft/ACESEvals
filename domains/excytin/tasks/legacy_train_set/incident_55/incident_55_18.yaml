        description: A process named `powershell.exe` executed a series of windows commands likely in exploration 
          activities to identify assets and coordinate lateral movement after potentially compromising a machine.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A process `contosoadfsblatempcreds.ps1` was injected with potentially malicious code, which may 
