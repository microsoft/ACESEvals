tasks:
- task_id: incident_55_legacy_train_set_task_15
  title: incident_55_legacy_train_set_task_15
  description: 'Can you identify the Process ID and Command Line of the process related to the suspicious Task Scheduler activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a recent security incident, a malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`
      was accessed, followed by a malicious PowerShell Cmdlet invocation on the device. Both events are related to suspicious
      activities, including network reconnaissance, code injection, and potentially credential theft. An alert of suspicious
      Task Scheduler activity reported a process potentially used for launching malicious code automatically and establishing
      persistence.'
    question: 'Can you identify the Process ID and Command Line of the process related to the suspicious Task Scheduler activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process Id: 6808, Command Line: powershell.exe  -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa='
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process Id: 6808, Command Line: powershell.exe  -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa='
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The device with hostname `mb-winclient` had a malicious URL clicked on.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A malicious PowerShell Cmdlet, `powershell.exe`, was invoked on the same device.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Suspicious Task Scheduler activity involved the process `powershell.exe` with Process ID `6808` and
          command line `powershell.exe  -encodedcommand 
          qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa=` was observed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
