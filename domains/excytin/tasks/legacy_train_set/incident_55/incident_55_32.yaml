tasks:
- task_id: incident_55_legacy_train_set_task_32
  title: incident_55_legacy_train_set_task_32
  description: 'What is the email address that received the message containing a malicious URL which was later removed after
    delivery?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a recent security incident, a Windows executable file that had been renamed was launched
      on the host `mb-adfs`. The file executed was `iy2orr1e.rrg.exe` with process ID 3116, an action that could indicate
      malicious intent such as running unauthorized code or connecting to an attacker-controlled network address. Following
      this, a malicious PowerShell Cmdlet was invoked, which could be associated with credential theft or network reconnaissance.
      Ultimately, emails containing a malicious URL were detected and removed after delivery.'
    question: 'What is the email address that received the message containing a malicious URL which was later removed after
      delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A renamed system executable `powershell.exe` was launched on the machine.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A malicious PowerShell Cmdlet was invoked by the user with AadUserId 
          `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An email containing a malicious URL was delivered and then removed. The recipient was 
          `bjenkins@niseko.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
