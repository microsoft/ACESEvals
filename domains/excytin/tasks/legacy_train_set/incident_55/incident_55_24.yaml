tasks:
- task_id: incident_55_legacy_train_set_task_24
  title: incident_55_legacy_train_set_task_24
  description: 'What is the mailbox primary address associated with the email messages containing the malicious URL that were
    removed after delivery?'
  inherit_shared: true
  initial_context:
    incident_context: 'An incident started with a suspicious sequence of exploration activities where certain windows commands
      were executed by a process. This process likely belongs to an attacker trying to identify valuable assets and coordinate
      lateral movement. Later, a process was injected with potentially malicious code, indicating malicious activity. The
      investigation progressed to email messages containing malicious URLs being removed after delivery.'
    question: 'What is the mailbox primary address associated with the email messages containing the malicious URL that were
      removed after delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious sequence of exploration activities was observed executed by the process 
          `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` had a process injected with 
          potentially malicious code.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Email messages containing a malicious URL were removed from the mailbox 
          `bjenkins@niseko.alpineskihouse.co` after delivery.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
