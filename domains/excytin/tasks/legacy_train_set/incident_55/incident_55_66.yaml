tasks:
- task_id: incident_55_legacy_train_set_task_66
  title: incident_55_legacy_train_set_task_66
  description: 'In due course of these incidents, an email containing a malicious URL was detected and removed after delivery.
    Can you identify the IP address from which this email was sent?'
  inherit_shared: true
  initial_context:
    incident_context: 'There has been a sequence of suspicious activities involving an OAuth application associated with user
      Luciano Herrera (Luciano Herrera@niseko.alpineskihouse.co). Initially, there was an unusual addition of credentials
      to the OAuth app SimulandApp. This pattern is indicative of potential app compromise, potentially spreading phishing,
      exfiltrating data, or gaining access to other accounts and devices. Later, a sequence of exploration activities involving
      windows commands was observed, which can be used by attackers to identify valuable assets and coordinate lateral movement.'
    question: 'In due course of these incidents, an email containing a malicious URL was detected and removed after delivery.
      Can you identify the IP address from which this email was sent?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '119.36.50.193'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '119.36.50.193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: User Luciano Herrera with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` performed an unusual 
          addition of credentials to the OAuth app SimulandApp using a Password type credential.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Another user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` executed a suspicious sequence 
          of exploration activities.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An email containing a malicious URL, sent from IP address `119.36.50.193`, was delivered and later 
          removed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
