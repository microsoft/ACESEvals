tasks:
- task_id: incident_55_legacy_train_set_task_55
  title: incident_55_legacy_train_set_task_55
  description: 'Can you identify the name of the account associated with the process that was injected with potentially malicious
    code?'
  inherit_shared: true
  initial_context:
    incident_context: 'A known public tool, which could also be used for malicious reasons, was observed under an unexpected
      filename on 2024-07-06. The tool might be attempting to hide its usage for malicious purposes. Following this, on 2024-07-04,
      a process involved in earlier malicious activity used Task Scheduler to create, modify, or delete a task, potentially
      to automatically launch malicious code and establish persistence. For further information on this threat, you can read
      the following threat analytics report: https://security.microsoft.com/threatanalytics3/c9709a39-ac8d-493d-9a63-71da3ca1e745/analystreport.
      Ultimately, a process has injected code into another process, indicating that suspicious code is running in the target
      process memory. Injection is often used to hide malicious code execution within a trusted process, leading to possible
      abnormal behaviors such as opening a listening port or connecting to a command and control server.'
    question: 'Can you identify the name of the account associated with the process that was injected with potentially malicious
      code?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A process with the filename `iy2orr1e.rrg.exe` was detected, which might be attempting to hide the 
          usage of a dual-purpose tool for malicious purposes.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A process `powershell.exe` involved in earlier suspicious activity used Task Scheduler to 
          potentially create, modify, or delete tasks, indicating an attempt to launch malicious code automatically and 
          establish persistence.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A process was injected with potentially malicious code, and the associated account is `bjenkins`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
