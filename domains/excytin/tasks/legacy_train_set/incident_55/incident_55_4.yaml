tasks:
- task_id: incident_55_legacy_train_set_task_4
  title: incident_55_legacy_train_set_task_4
  description: 'What was the process registered as a service, indicating potentially malicious intent to establish persistence
    or gain system privileges?'
  inherit_shared: true
  initial_context:
    incident_context: 'The incident progressed with a suspicious sequence of exploration activities on an unspecified host,
      resulting in the registration of a system program as a service on 2024-07-04. This action could indicate malicious intent
      for persistence or privilege escalation.'
    question: 'What was the process registered as a service, indicating potentially malicious intent to establish persistence
      or gain system privileges?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The user with SID `S-1-5-21-561436748-3867387497-1732241745-3701` clicked on a potentially 
          malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A process named `whoami.exe` was executed on the host `mb-adfs`, which may be part of a suspicious 
          exploration activity.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An executable `services.exe` with Process ID `764` was started at `2024-06-20t08:30:13.7925191z`, 
          and it was registered as a service, indicating a potential attempt to establish persistence or gain system 
          privileges.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
