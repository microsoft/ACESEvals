tasks:
- task_id: incident_55_legacy_train_set_task_78
  title: incident_55_legacy_train_set_task_78
  description: 'Relating to this alert, what was the hostname of the device involved in the attempt to hide the use of a dual-purpose
    tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-10, an alert was raised for a suspected AD FS DKM key read by the account with email `gsmith@niseko.alpineskihouse.co`.
      Specifically, gsmith read the DKM key of ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2.'
    question: 'Relating to this alert, what was the hostname of the device involved in the attempt to hide the use of a dual-purpose
      tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mb-adfs'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mb-adfs'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` read the DKM key of ADFS object 
          id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was an attempt to hide use of a dual-purpose tool on host `mb-adfs`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
