tasks:
- task_id: incident_55_legacy_train_set_task_34
  title: incident_55_legacy_train_set_task_34
  description: 'What is the recipient email address that received the malicious URL in the phishing email sent during this
    incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving internal phishing was detected where a user named Lucas Grey with an
      email Lucas Grey@niseko.alpineskihouse.co was observed to have sent phishing emails from their device to recipients
      inside the organization. This user account might have been compromised as part of a lateral movement attempt by an attacker.
      The malicious URL involved in the phishing email was `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`.'
    question: 'What is the recipient email address that received the malicious URL in the phishing email sent during this
      incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account with email `Nina Sullivan@vnevado.alpineskihouse.co` was observed sending phishing 
          emails internally, suggesting possible account compromise.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The email account `santiago@vnevado.alpineskihouse.co` received emails containing malicious URLs, 
          which were later removed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
