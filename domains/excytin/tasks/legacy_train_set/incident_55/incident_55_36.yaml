tasks:
- task_id: incident_55_legacy_train_set_task_36
  title: incident_55_legacy_train_set_task_36
  description: 'Can you identify the account name of the system executable that was renamed and launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a security incident involving an ongoing hands-on-keyboard attack via the
      Impacket toolkit, it was found that a suspicious command was executed. This tool is noted for its use in lateral movement
      across the network and in deploying ransomware or other payloads. A relevant piece in the investigation is the `lsass.exe`
      process, with a Process ID of 780, which might indicate an attacker''s activity on the system.'
    question: 'Can you identify the account name of the system executable that was renamed and launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious execution of a command via Impacket toolkit was observed with the command line 
          `powershell.exe -encodedcommand 
          qwa6afwauwbjahiaaqbwahqacwbcafiazqbuageabqblafaabwb3aguacgbzaggazqbsagwalgbwahmamqa=` at 
          `2024-07-02t09:48:12.7628138z`, with Process ID `6808`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A Windows executable file that has been renamed was launched using the `SYSTEM` account.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
