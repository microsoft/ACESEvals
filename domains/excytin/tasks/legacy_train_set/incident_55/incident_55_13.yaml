tasks:
- task_id: incident_55_legacy_train_set_task_13
  title: incident_55_legacy_train_set_task_13
  description: 'What is the hostname of the device involved in the suspicious Task Scheduler activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent security investigation, it was identified that host `MB-DC1` read the DKM key of an
      ADFS object (`4cac49d3-29d3-407e-8c9b-b7ebb21541b2`). Following this, there was a suspected DCSync attack where a replication
      request was sent from `MB-WINCLIENT` by Luciano Herrera (CIO) to `MB-DC1`. Then, it was observed that a known tool or
      technique was used to gather information on a device in a suspicious system hardware discovery attempt. Eventually,
      a suspicious Task Scheduler activity was reported where a process involved in earlier malicious activity used Task Scheduler
      to create, modify, or delete a task. This might be an attempt to launch malicious code automatically and establish persistence.
      For further information on this threat, read the corresponding threat analytics report.'
    question: 'What is the hostname of the device involved in the suspicious Task Scheduler activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mb-adfs'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mb-adfs'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The host `MB-DC1` read the DKM key of ADFS object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: The account with AadUserID `2de70991-2799-4a95-b734-8e3df3a50118`, used the host `MB-WINCLIENT` to 
          send a replication request to `MB-DC1`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: A known tool or technique using `powershell.exe` was used to gather system hardware information.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: A process associated with suspicious activity used Task Scheduler on the host `mb-adfs` to create, 
          modify, or delete a task.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
