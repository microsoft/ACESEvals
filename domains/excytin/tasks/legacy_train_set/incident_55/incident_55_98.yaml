tasks:
- task_id: incident_55_legacy_train_set_task_98
  title: incident_55_legacy_train_set_task_98
  description: 'Regarding the associated suspicious remote activity mentioned in the incident, what was the involved file''s
    name?'
  inherit_shared: true
  initial_context:
    incident_context: 'An incident involving suspicious LDAP query execution was detected on hostname `mb-winclient` from
      IP address `72.5.72.208`, by `pwilson` (AadUserId: 2de70991-2799-4a95-b734-8e3df3a50118). The process `powershell.exe`
      executed a script `ldaprequest.ps1` created on 2024-07-02 at 09:47:42. The nature of LDAP queries suggests potential
      reconnaissance attempts to map out administrative users and systems.'
    question: 'Regarding the associated suspicious remote activity mentioned in the incident, what was the involved file''s
      name?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cmd.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'cmd.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious LDAP query was executed using `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was suspicious remote activity involving the file `cmd.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
