tasks:
- task_id: incident_55_legacy_train_set_task_90
  title: incident_55_legacy_train_set_task_90
  description: 'Can you identify the Azure Active Directory (AAD) user ID related to the suspicious sequence of exploration
    activities?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspected Active Directory attack was detected on host `MB-DC1` where it read the DKM key of ADFS
      object id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`. Following this, Luciano Herrera (CIO) on host `MB-WINCLIENT` sent
      1 replication request to `MB-DC1`, indicating a possible DCSync attack. Further investigation revealed a suspicious
      LDAP query executed on the host, indicating potential reconnaissance activity which could be used by attackers to gain
      higher privileges and access important assets in the organization.'
    question: 'Can you identify the Azure Active Directory (AAD) user ID related to the suspicious sequence of exploration
      activities?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The host `MB-DC1` read the DKM key of ADFS object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2, which is
          suspected to be malicious.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: The account with Sid `S-1-5-21-551436448-9871687716-9837441745-1903`, belonging to Luciano Herrera 
          (CIO) on host `MB-WINCLIENT`, sent a replication request to `MB-DC1`, suspected of a DCSync attack.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: A suspicious LDAP query was executed using the process `powershell.exe`, indicating potential 
          reconnaissance activity.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Suspicious exploration activities were performed by the account with AadUserId 
          `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`, involving a set of windows commands that could be used to identify 
          valuable assets and coordinate lateral movement.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
