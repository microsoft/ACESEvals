  title: incident_55_legacy_train_set_task_9
  description: 'Can you identify the process id, created time and command line of the attempted hidden execution of the dual-purpose
    tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing hands-on-keyboard attack via the Impacket toolkit, suspicious activity with the `powershell.exe`
      and `lsass.exe` processes was observed. This indicates a potential attempt by attackers to move laterally across the
      network to execute commands on other hosts. Attackers often use tools like Impacket in hands-on-keyboard attacks to
      install ransomware or other malicious payloads onto target devices.'
    question: 'Can you identify the process id, created time and command line of the attempted hidden execution of the dual-purpose
      tool?'
