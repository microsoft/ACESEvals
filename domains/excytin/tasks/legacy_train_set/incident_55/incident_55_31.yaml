tasks:
- task_id: incident_55_legacy_train_set_task_31
  title: incident_55_legacy_train_set_task_31
  description: 'Who is the account associated with the process that accessed the Local Security Authority Subsystem Service
    (lsass.exe) memory?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent security incident on the host `mb-adfs` involved multiple malicious activities. Initially,
      the system executable `iy2orr1e.rrg.exe` was renamed and launched, potentially by an attacker aiming to run malicious
      code or connect to an attacker-controlled network address while avoiding certain behavior-based detection technologies.
      The process is associated with the account `SYSTEM` with SID `S-2-2-78`.'
    question: 'Who is the account associated with the process that accessed the Local Security Authority Subsystem Service
      (lsass.exe) memory?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A renamed executable file `powershell.exe` was launched.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The account `bjenkins` was involved in a sensitive credential memory read from the Local Security 
          Authority Subsystem Service (lsass.exe).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
