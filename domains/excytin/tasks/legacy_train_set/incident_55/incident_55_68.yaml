  initial_context:
    incident_context: 'During a recent security incident, an account `gsmith` on host `mb-adfs` was found to run a potentially
      malicious process `iy2orr1e.rrg.exe` with process ID 3116. This process utilized encoded commands and might be an attempt
      to hide the usage of a public tool for malicious purposes.'
    question: 'As part of suspicious exploration activities following the initial alert, what was the IP address involved
      in the later stages of the incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The host `mb-adfs` had an attempt to hide the use of a dual-purpose tool under an unexpected 
          filename.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The process `whoami.exe` executed a suspicious sequence of exploration activities.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A suspicious sequence of exploration activities was also observed involving the IP address 
          `72.5.72.208`.
