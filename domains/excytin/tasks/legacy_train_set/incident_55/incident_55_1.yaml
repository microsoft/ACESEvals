tasks:
- task_id: incident_55_legacy_train_set_task_1
  title: incident_55_legacy_train_set_task_1
  description: 'A recent security incident included another instance of potentially malicious URL click on the same device.
    Can you identify the URL?'
  inherit_shared: true
  initial_context:
    incident_context: 'We have detected that one of your users has recently clicked on a link that was found to be malicious:
      `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`. This is part of a broader security incident
      involving suspicious exploration activities including the use of multiple Windows commands which can be used by attackers
      to identify assets of value and coordinate lateral movement after compromising a machine.'
    question: 'A recent security incident included another instance of potentially malicious URL click on the same device.
      Can you identify the URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A potentially malicious URL was clicked by a user with SID 
          `S-1-5-21-561436748-3867387497-1732241745-3701`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: There was a suspicious sequence of exploration activities on host `mb-winclient`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The malicious URL clicked was 
          `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
