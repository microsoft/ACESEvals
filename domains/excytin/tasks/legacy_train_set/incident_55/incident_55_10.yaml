tasks:
- task_id: incident_55_legacy_train_set_task_10
  title: incident_55_legacy_train_set_task_10
  description: 'Which host accessed the AD FS DKM key during the final alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious service registration involving the executable `services.exe` was detected on a system,
      indicating possible malicious activities aimed at persistence or escalating privileges. Subsequent alerts identified
      additional suspicious behaviors, culminating in an alert where a host access a critical directory key.'
    question: 'Which host accessed the AD FS DKM key during the final alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: A system program was registered as a service on host `mb-adfs`.
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: A renamed system executable `powershell.exe` was launched.
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: A process was injected with potentially malicious code by an account with SID 
          `S-1-5-21-551436448-9871687716-9837441745-1903`.
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: Luciano Herrera (CIO) on MB-WINCLIENT sent a suspected DCSync attack replication request to host 
          `MB-DC1`.
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: Host `MB-DC1` read the DKM key of the ADFS object with id `4cac49d3-29d3-407e-8c9b-b7ebb21541b2`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
