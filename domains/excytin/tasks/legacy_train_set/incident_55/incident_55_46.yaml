tasks:
- task_id: incident_55_legacy_train_set_task_46
  title: incident_55_legacy_train_set_task_46
  description: 'What is the name of the account that was involved in the suspicious system hardware discovery incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A potentially malicious URL click was detected, involving user Lucas Grey who clicked on `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`.
      The suspicious activity then led to hardware discovery on the target device, which seems to have been done by another
      account.'
    question: 'What is the name of the account that was involved in the suspicious system hardware discovery incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'pwilson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` clicked on a potentially malicious 
          URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The account `pwilson` was involved in suspicious system hardware discovery.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
