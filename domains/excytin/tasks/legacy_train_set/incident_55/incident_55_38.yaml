tasks:
- task_id: incident_55_legacy_train_set_task_38
  title: incident_55_legacy_train_set_task_38
  description: 'During further analysis, it was found that a renamed Windows executable file was launched. Can you identify
    the account name that was used to launch this executable?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious Task Scheduler activity was observed, where a process used Task Scheduler to create and
      run a task with the intention of launching malicious code automatically and establishing persistence. The process `schtasks.exe`
      was involved. Further analysis can be found in the threat analytics report. The activity involved creating a task to
      run a command with `schtasks.exe` using Windows accounts for scheduled tasks.'
    question: 'During further analysis, it was found that a renamed Windows executable file was launched. Can you identify
      the account name that was used to launch this executable?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A task was created, modified, or deleted using Task Scheduler on host `mb-adfs`, potentially to 
          launch malicious code automatically and establish persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The `SYSTEM` account launched a renamed Windows executable, suggesting attackers might be using it 
          to perform malicious activities.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
