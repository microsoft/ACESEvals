tasks:
- task_id: incident_55_legacy_train_set_task_16
  title: incident_55_legacy_train_set_task_16
  description: 'What account was responsible for the launching of the renamed and executed system executable in the end alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious remote activity on a machine occurred as part of a recent security incident. This incident
      involved attempts to initiate interactive sessions, modify files, pass WMI commands, create scheduled tasks, and other
      potentially malicious activities from a remote machine. Notably, the file `cmd.exe` was executed with ProcessId `8896`
      on 2024-07-02, indicating a possibility of a remote activity. The compromised machine is yet to be identified (host
      name missing).'
    question: 'What account was responsible for the launching of the renamed and executed system executable in the end alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was observed on the host `mb-adfs` which could involve actions such as 
          initiating interactive sessions, modifying files, passing WMI commands, or creating scheduled tasks.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A system executable that was renamed was launched on the account `SYSTEM`, indicating possible 
          attempts to use it for malicious activities or to connect to an attacker-controlled network.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
