tasks:
- task_id: incident_55_legacy_train_set_task_33
  title: incident_55_legacy_train_set_task_33
  description: 'Which mailbox received the email containing the malicious URL that was later removed in the security incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A potential malicious URL click was detected and reported for the mailbox `bjenkins@niseko.alpineskihouse.co`
      on 2024-07-10. This incident suggests that an attacker might have leveraged this click to compromise the user''s account
      and send phishing emails internally. Following this, it was observed that a user was sending phishing emails from a
      device on 2024-07-07, which indicates a possible lateral movement by the attacker within the organization. This alert
      was a result of a Microsoft Defender for Office 365 alert.'
    question: 'Which mailbox received the email containing the malicious URL that was later removed in the security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The user with SID `S-1-5-21-561436748-3867387497-1732241745-3701` clicked on a potentially 
          malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A phishing campaign was launched from the device associated with the user account having AadUserId 
          `28058d92-fc24-4869-9231-6546a34b00f2`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An email containing a malicious URL was delivered to the mailbox 
          `santiago@vnevado.alpineskihouse.co` and later removed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
