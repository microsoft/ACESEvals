tasks:
- task_id: incident_34_legacy_train_set_task_7
  title: incident_34_legacy_train_set_task_7
  description: 'In relation to this suspicious Task Scheduler activity, an uncommon file was later created and added to a
    Run Key. Can you provide the IP address associated with this uncommon file creation?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious Task Scheduler activity was detected indicating potential malicious activity. The initial
      process involved was likely aiming to launch malicious code automatically and establish persistence. In relation to
      this activity, an uncommon file was later created and added to a Run Key, suggesting further persistence mechanisms
      being established by the attacker.'
    question: 'In relation to this suspicious Task Scheduler activity, an uncommon file was later created and added to a Run
      Key. Can you provide the IP address associated with this uncommon file creation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious task scheduler activity was detected involving the process with extracted filename 
          `winatp-intro-backdoor.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An uncommon file connected to IP address `72.5.72.208` was created and added to a Run Key.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
