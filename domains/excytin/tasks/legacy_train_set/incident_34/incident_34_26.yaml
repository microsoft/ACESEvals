tasks:
- task_id: incident_34_legacy_train_set_task_26
  title: incident_34_legacy_train_set_task_26
  description: 'Can you find the IP address associated with the anomaly detected in the ASEP registry for this security incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a security incident, a process executed PowerShell to download a file or run an encoded
      command. PowerShell is often used by attackers to bypass security protection mechanisms by executing their payload in
      memory without leaving a trace or touching the disk. This particular instance was flagged as a suspicious PowerShell
      download or encoded command execution with Process ID 8604. This activity may indicate an attacker trying to download
      external payloads or execute commands on the device.'
    question: 'Can you find the IP address associated with the anomaly detected in the ASEP registry for this security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A process executed PowerShell to download a file or run an encoded command by a user with AadUserId
          `16320fec-8d90-403b-b7fe-78f715d4728d`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A process registered a suspicious command or file in ASEP registry key from IP address 
          `72.5.72.208`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
