tasks:
- task_id: incident_34_legacy_train_set_task_18
  title: incident_34_legacy_train_set_task_18
  description: 'What is the name of the suspicious file that was dropped and executed on the machine by Powershell?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious Task Scheduler activity was detected, in which the `schtasks.exe` process executed a task
      with the process ID 1616 on 2024-06-26 at 12:00:40.6793914 UTC. This kind of activity might be an attempt to launch
      malicious code automatically and establish persistence. For more details, refer to the relevant threat analytics report
      here: https://security.microsoft.com/threatanalytics3/c9709a39-ac8d-493d-9a63-71da3ca1e745/analystreport.'
    question: 'What is the name of the suspicious file that was dropped and executed on the machine by Powershell?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There is a suspicious Task Scheduler activity observed on the host with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Powershell executed a suspicious file named `winatp-intro-backdoor.exe` on the same host.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
