tasks:
- task_id: incident_34_legacy_train_set_task_13
  title: incident_34_legacy_train_set_task_13
  description: 'What process executed a PowerShell command to download a file during the same security incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'Description: Potential reconnaissance activity involving a suspicious LDAP query was detected on host
      `vnevado-win10e`. Furthermore, a PowerShell command was executed soon after on this host to download a file or run an
      encoded command, which can be seen as an attempt to bypass security mechanisms.'
    question: 'What process executed a PowerShell command to download a file during the same security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious LDAP query was executed using the process `winword.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A process with ID `8604` executed `powershell.exe` on `2024-06-26t12:00:39.2886108z` with a complex
          command targeting the creation and execution of a file named `winatp-intro-backdoor.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
