tasks:
- task_id: incident_34_legacy_train_set_task_1
  title: incident_34_legacy_train_set_task_1
  description: 'What is the SID of the account observed in the alert indicating that an uncommon file was created and added
    to a Run Key?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into an advanced security incident, an anomaly was detected in the ASEP registry,
      indicating that a process named `winatp-intro-backdoor.exe` with ProcessId__CreatedTimeUtc__CommandLine `10208__2024-06-26t13:17:18.8268389z__reg  add
      hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe`
      was registered to run after a reboot on host `vnevado-win10e` linked to user `samuelf`.'
    question: 'What is the SID of the account observed in the alert indicating that an uncommon file was created and added
      to a Run Key?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An anomaly detected in ASEP registry involved the account with SID 
          `S-1-5-21-1870156660-7534030218-135086563-1193`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An uncommon file was created and added to a Run Key involving the same account with SID 
          `S-1-5-21-1870156660-7534030218-135086563-1193`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
