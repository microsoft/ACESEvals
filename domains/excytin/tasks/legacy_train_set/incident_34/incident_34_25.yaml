tasks:
- task_id: incident_34_legacy_train_set_task_25
  title: incident_34_legacy_train_set_task_25
  description: 'What is the name of the executable associated with the suspicious PowerShell command line activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was detected involving suspicious Task Scheduler activity, with the process `schtasks.exe`
      being used to create a task scheduled to run a potentially harmful executable on the host `vnevado-win10e`. The account
      associated with this activity is identified as `samuelf`.'
    question: 'What is the name of the executable associated with the suspicious PowerShell command line activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A process with Process ID `8604` launched `powershell.exe` on `2024-06-26t12:00:39.2886108z` with a
          command to create a scheduled task that might be used for malicious purposes.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious PowerShell command was executed which created a file named 
          `winatp-intro-backdoor.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
