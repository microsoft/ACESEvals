tasks:
- task_id: incident_34_legacy_train_set_task_4
  title: incident_34_legacy_train_set_task_4
  description: 'Related to this alert, a process registered a suspicious command or file in an ASEP registry. What is the
    IP address associated with this anomaly?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a security incident, a suspicious PowerShell download or encoded command execution was detected.
      This type of activity is often used by attackers to bypass security protection mechanisms by executing their payload
      in memory. The execution of `powershell.exe` and `winword.exe` processes were observed. Specifically, the PowerShell
      command included a lengthy encoded script that might indicate an attempt to download external payloads or execute commands
      on the device.'
    question: 'Related to this alert, a process registered a suspicious command or file in an ASEP registry. What is the IP
      address associated with this anomaly?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user with SID `S-1-5-21-1870156660-7534030218-135086563-1193` was involved in a suspicious 
          PowerShell download or encoded command execution.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There is an anomaly detected in the ASEP registry associated with the IP address `72.5.72.208`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
