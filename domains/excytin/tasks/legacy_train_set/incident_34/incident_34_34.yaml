tasks:
- task_id: incident_34_legacy_train_set_task_34
  title: incident_34_legacy_train_set_task_34
  description: 'Can you identify the Azure Active Directory (AAD) User ID associated with the account that executed the suspicious
    PowerShell command to download a file or run an encoded command?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a recent security incident, a suspicious PowerShell command execution was observed. This involves
      the host `vnevado-win10e` and user account `samuelf` (SID: `S-1-5-21-1870156660-7534030218-135086563-1193`). PowerShell
      is often used by attackers to execute payloads in memory without touching the disk.'
    question: 'Can you identify the Azure Active Directory (AAD) User ID associated with the account that executed the suspicious
      PowerShell command to download a file or run an encoded command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '16320fec-8d90-403b-b7fe-78f715d4728d'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '16320fec-8d90-403b-b7fe-78f715d4728d'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious process executed a PowerShell command on a device with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A PowerShell command was used to download a file or execute an encoded command by an account with 
          AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
