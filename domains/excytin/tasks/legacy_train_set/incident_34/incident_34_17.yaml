tasks:
- task_id: incident_34_legacy_train_set_task_17
  title: incident_34_legacy_train_set_task_17
  description: 'What was the executable file involved in the suspicious PowerShell activity observed on the host?'
  inherit_shared: true
  initial_context:
    incident_context: 'A process executed PowerShell on the host `vnevado-win10e`. The account associated with this activity
      is `samuelf` with SID `S-1-5-21-1870156660-7534030218-135086563-1193` and AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`.
      This incident involves potentially harmful activity leveraging PowerShell to execute payloads that bypass security mechanisms.'
    question: 'What was the executable file involved in the suspicious PowerShell activity observed on the host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: There was a suspicious PowerShell download or encoded command execution on 
          `2024-06-26t12:00:39.2886108z` with Process ID `8604`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The command executed was `powershell.exe -w movedn -exec bypass -command cd /; $filebase64prefix = 
          ''; $filebase64prefix= $filebase64prefix + 'tvq'; ... $filebase64prefix= $filebase64prefix + 
          'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa=='; $filebase64= 
          $filebase64prefix + $filebase64suffix; $file= [convert]::frombase64string([string]$filebase64); $filename= 
          'winatp-intro-backdoor.exe'; $desktop=[environment]::getfolderpath('desktop'); $fullpath = join-path $desktop 
          $filename; [io.file]::writeallbytes($fullpath,$file); copy $fullpath $desktop; schtasks /create /sc once /tn 
          yrei /tr $fullpath /st (get-date).addminutes(-2).tostring('hh:mm') /f; $settings = 
          new-scheduledtasksettingsset -allowstartifonbatteries -dontstopifgoingonbatteries; set-scheduledtask -taskname
          'yrei' -settings $settings; schtasks /run /tn yrei`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A suspicious file `winatp-intro-backdoor.exe` was created by the PowerShell command.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
