tasks:
- task_id: incident_34_legacy_train_set_task_27
  title: incident_34_legacy_train_set_task_27
  description: 'Can you identify the IP address associated with the creation of the uncommon file that was added to the run
    key?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a recent security incident, a PowerShell command was executed on 2024-07-04 to download a file or
      run an encoded command. This is often used by attackers to bypass security protection mechanisms by executing their
      payload in memory. The command executed was: `powershell.exe -w movedn -exec bypass -command cd /;$filebase64prefix
      = ...`. This activity was detected under the alert ''Suspicious PowerShell download or encoded command execution''.
      This incident is suspected to be part of an attack where an uncommon file was created and added to a run key to ensure
      the attacker retains access after a reboot.'
    question: 'Can you identify the IP address associated with the creation of the uncommon file that was added to the run
      key?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious PowerShell download or encoded command execution was executed by the account 
          `samuelf`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An uncommon file was created and added to a Run Key from IP address `72.5.72.208`. This might be an
          attempt to maintain persistence on the device by an attacker.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
