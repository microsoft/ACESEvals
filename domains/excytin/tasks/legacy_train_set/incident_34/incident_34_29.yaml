tasks:
- task_id: incident_34_legacy_train_set_task_29
  title: incident_34_legacy_train_set_task_29
  description: 'What is the name of the file that the attackers potentially used with the suspicious PowerShell command on
    the machine `vnevado-win10e`?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident occurred on host `vnevado-win10e` involving an anomalous scheduled task creation.
      This suspicious task creation is often used by attackers to obtain persistence on the device. Further investigation
      into this incident revealed the execution of `powershell.exe` which may indicate the use of PowerShell for malicious
      activities such as installation, exploration, or lateral movement.'
    question: 'What is the name of the file that the attackers potentially used with the suspicious PowerShell command on
      the machine `vnevado-win10e`?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An anomalous scheduled task was created using `schtasks.exe` on 2024-07-04 22:35:01.260626+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious PowerShell command line led to the usage of file `winatp-intro-backdoor.exe` on 
          2024-07-04 22:35:01.005559+00:00.
  scoring_aggregation:
