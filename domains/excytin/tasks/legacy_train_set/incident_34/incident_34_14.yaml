tasks:
- task_id: incident_34_legacy_train_set_task_14
  title: incident_34_legacy_train_set_task_14
  description: 'Which process was executed to create, modify, or delete a task using Task Scheduler during this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a recent security incident, a process executed PowerShell to download a file or run an encoded command.
      This often indicates that an attacker might be trying to download external payloads or execute commands on the device
      without leaving a trace. Additionally, earlier in the same incident, the process `winword.exe` was found to be executed
      with a suspicious command line on June 26, 2024 (Process ID: 9780). Furthermore, we observed that a process involved
      in this malicious activity used Task Scheduler to create, modify, or delete a task, potentially as an attempt to launch
      malicious code automatically and establish persistence.'
    question: 'Which process was executed to create, modify, or delete a task using Task Scheduler during this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'schtasks.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The attacker executed a PowerShell command that downloaded or ran an encoded command, resulting in 
          the file `winatp-intro-backdoor.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The attacker used the Task Scheduler with the command line `schtasks.exe /run /tn yrei` at 
          `2024-06-26t12:00:40.6793914z`, with Process ID `1616` to create, modify, or delete a task for persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
