tasks:
- task_id: incident_34_legacy_train_set_task_16
  title: incident_34_legacy_train_set_task_16
  description: 'What is the name of the process that was used to download or execute PowerShell commands on the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involved the execution of a suspicious LDAP query, indicating potential reconnaissance
      activity. Attackers often use LDAP queries to learn the organization''s structure, such as administrative users, groups,
      and interesting assets. These queries help the attacker gain higher privileges and access important assets in the organization.
      During the investigation, we observed that the process `winword.exe` launched with the command line `winword.exe c:\scripts\rs4_winatp-intro-invoice.docm`.'
    question: 'What is the name of the process that was used to download or execute PowerShell commands on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious LDAP query was executed from host with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`, indicating potential reconnaissance activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A process on the same device executed PowerShell to download or run a file named 
          `winatp-intro-backdoor.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
