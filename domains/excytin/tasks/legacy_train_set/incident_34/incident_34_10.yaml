tasks:
- task_id: incident_34_legacy_train_set_task_10
  title: incident_34_legacy_train_set_task_10
  description: 'In relation to this incident, there is also an anomaly detected in the ASEP registry. Can you find the IP
    address associated with this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving suspicious Task Scheduler activity was identified on July 4, 2024. A
      process involved in earlier malicious activity used Task Scheduler to create, modify, or delete a task, which might
      be an attempt to launch malicious code automatically and establish persistence. Further information on this threat can
      be found in the threat analytics report linked in the investigation.'
    question: 'In relation to this incident, there is also an anomaly detected in the ASEP registry. Can you find the IP address
      associated with this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account with the name `samuelf` used the Task Scheduler to create, modify, or delete a task, 
          which is suspicious.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was an anomaly detected in the ASEP registry from the IP address `72.5.72.208`, indicating a 
          potential attempt to register a malicious command or file that will run after a reboot.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
