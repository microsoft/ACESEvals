tasks:
- task_id: incident_34_legacy_train_set_task_28
  title: incident_34_legacy_train_set_task_28
  description: 'During a related event, an uncommon file was created and added to a Run Key, and an attacker might have used
    it to maintain access. Can you find the IP address related to this suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a security incident where PowerShell was used to drop a suspicious file named `winatp-intro-backdoor.exe`
      on the machine and executed it, the command line arguments used for PowerShell included several base64 encoded strings
      indicative of a potential attack. This was part of a multi-stage incident involving several processes.'
    question: 'During a related event, an uncommon file was created and added to a Run Key, and an attacker might have used
      it to maintain access. Can you find the IP address related to this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` executed a suspicious 
          file via Powershell on the machine.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An uncommon file was created from IP address `72.5.72.208` and was added to a Run Key, indicating a
          potential persistence mechanism by an attacker.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
