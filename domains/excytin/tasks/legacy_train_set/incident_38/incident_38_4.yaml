tasks:
- task_id: incident_38_legacy_train_set_task_4
  title: incident_38_legacy_train_set_task_4
  description: 'Following the suspicious code injection, an unexpected behavior was observed in a process without command
    line arguments. Identify the IP address connected by this process.'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving a suspicious process injection was detected on 2024-07-04, where a URL
      `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt` was accessed. This incident
      could result in abnormal behaviors like opening a listening port or connecting to a command and control server.'
    question: 'Following the suspicious code injection, an unexpected behavior was observed in a process without command line
      arguments. Identify the IP address connected by this process.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '202.183.149.174'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '202.183.149.174'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There was a suspicious process injection observed on host `vnevado-win11a`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An unexpected behavior was observed from a process without command line arguments, exhibiting 
          unusual communication with the IP address `202.183.149.174`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
