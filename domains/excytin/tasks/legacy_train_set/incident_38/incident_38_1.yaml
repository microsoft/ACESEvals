tasks:
- task_id: incident_38_legacy_train_set_task_1
  title: incident_38_legacy_train_set_task_1
  description: 'During the investigation of this incident, another alert indicated the use of a known tool or technique for
    gathering information on the device. Can you provide the command line used to launch the `powershell.exe` process associated
    with this suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving a suspicious process injection was observed on 2024-07-04. An abnormal
      code was injected into another process and as a result, unexpected code might be running in the targeted process memory.
      One of the involved processes was `notepad.exe` with a Process ID `8932__2024-06-26t15:49:51.3043595z`. This might lead
      to abnormal behaviors. A URL linked with this event is `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`.'
    question: 'During the investigation of this incident, another alert indicated the use of a known tool or technique for
      gathering information on the device. Can you provide the command line used to launch the `powershell.exe` process associated
      with this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '7472__2024-06-26t15:49:15.7860486z__powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '7472__2024-06-26t15:49:15.7860486z__powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There was a suspicious process injection observed on the host `vnevado-win11a`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious application window discovery was conducted using the command line `powershell.exe` 
          with Process ID `7472` at `2024-06-26T15:49:15.7860486Z`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
