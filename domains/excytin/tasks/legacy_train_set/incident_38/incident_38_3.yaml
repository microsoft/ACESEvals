tasks:
- task_id: incident_38_legacy_train_set_task_3
  title: incident_38_legacy_train_set_task_3
  description: 'As part of this incident, suspicious process injection was also observed. Can you find the URL associated
    with this process injection?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involved gathering information on a device using a known tool or technique. This
      was detected when a process with ID 7472 and the command line `powershell.exe` was executed at `2024-06-26T15:49:15.7860486Z`.
      This is an indication that attackers might be attempting to collect information about the target device or network for
      future attacks.'
    question: 'As part of this incident, suspicious process injection was also observed. Can you find the URL associated with
      this process injection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account with AadUserId `12185914-91dd-4fb9-94f9-3252203b0426` was involved in a suspicious 
          application window discovery activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious process injection was observed involving the URL 
          `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
