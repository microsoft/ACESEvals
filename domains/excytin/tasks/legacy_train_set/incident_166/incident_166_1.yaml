tasks:
- task_id: incident_166_legacy_train_set_task_1
  title: incident_166_legacy_train_set_task_1
  description: 'A subsequent suspicious SAP authentication was linked to the incident. Can you identify the IP address that
    was used during this suspicious SAP authentication?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a recent security investigation involving an anonymous IP address, a sign-in attempt was
      detected from the IP address `95.202.65.202` which is often associated with anonymizers such as Tor or anonymizer VPNs.
      This might indicate an attacker attempting to disguise their origin.'
    question: 'A subsequent suspicious SAP authentication was linked to the incident. Can you identify the IP address that
      was used during this suspicious SAP authentication?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There was a sign-in from an anonymous IP address using the account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A user with a risky sign-in alerted on Microsoft Entra ID signed in to SAP from the IP address 
          `107.253.5.27`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
