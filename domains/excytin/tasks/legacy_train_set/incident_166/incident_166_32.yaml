tasks:
- task_id: incident_166_legacy_train_set_task_32
  title: incident_166_legacy_train_set_task_32
  description: 'Can you identify the Azure Active Directory (AAD) user ID of the account associated with the possible BEC
    financial fraud?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving business email compromise (BEC) was reported, where a user signed in
      to SAP in a suspicious manner. The incident was detected by Microsoft Defender XDR and highlighted an attacker gaining
      control of a user account to possibly modify or record sensitive financial information in SAP. This activity is suspected
      to be linked to a larger series of malicious actions aimed at financial fraud.'
    question: 'Can you identify the Azure Active Directory (AAD) user ID of the account associated with the possible BEC financial
      fraud?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user account named `Jordan P` signed in to SAP in a suspicious manner associated with a business 
          email compromise-related alert.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was involved in possible BEC financial
          fraud.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
