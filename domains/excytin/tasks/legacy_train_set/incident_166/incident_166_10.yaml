tasks:
- task_id: incident_166_legacy_train_set_task_10
  title: incident_166_legacy_train_set_task_10
  description: 'In relation to the suspicious email activity, there is also an alert about inbox rule manipulation. Can you
    identify the AppId of the cloud application involved in this suspicious inbox manipulation rule?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious email was sent by user `laylaw@vnevado.alpineskihouse.co` to `tony@avoriaz.alpineskihouse.co`,
      with the sender IP being `255.246.85.58`. This email is related to a Business Email Compromise (BEC) fraud attempt,
      and it has raised concerns about potential malicious activities involving compromised user accounts.'
    question: 'In relation to the suspicious email activity, there is also an alert about inbox rule manipulation. Can you
      identify the AppId of the cloud application involved in this suspicious inbox manipulation rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious emails were sent by the account named `Jordan P`, potentially compromised in a BEC fraud
          attempt.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious inbox manipulation rule was detected in the cloud application with AppId `20893`, 
          indicating possible unauthorized access.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
