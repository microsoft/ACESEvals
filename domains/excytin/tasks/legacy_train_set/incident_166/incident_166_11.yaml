tasks:
- task_id: incident_166_legacy_train_set_task_11
  title: incident_166_legacy_train_set_task_11
  description: 'What is the Security Identifier (Sid) of the user account that was involved in the suspicious SAP authentication?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of investigating a suspicious SAP authentication incident where a user account with a risky
      sign-in alert in Microsoft Entra ID signed in to SAP, we identified a user account `Jordan P` with email `Jordan P@vnevado.alpineskihouse.co`
      and associated IP address `107.253.5.27`. This suspicious activity might indicate that an attacker took control of the
      user account to search through SAP for modifying or recording sensitive financial information, which could be utilized
      for later stages such as phishing or social engineering.'
    question: 'What is the Security Identifier (Sid) of the user account that was involved in the suspicious SAP authentication?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1740051960-3534030288-108486866-1602'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1740051960-3534030288-108486866-1602'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account `Jordan P` signed in to SAP with a risky sign-in alert.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The user with SID `S-1-5-21-1740051960-3534030288-108486866-1602` signed in to SAP with a risky 
          sign-in alert.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
