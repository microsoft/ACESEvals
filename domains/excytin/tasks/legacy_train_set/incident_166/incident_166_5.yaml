tasks:
- task_id: incident_166_legacy_train_set_task_5
  title: incident_166_legacy_train_set_task_5
  description: 'Related to this incident, suspicious emails were later sent by a possibly compromised user account. Can you
    find the sender IP address of those emails?'
  inherit_shared: true
  initial_context:
    incident_context: 'In the context of a security incident, a user account with a risky sign-in alert in Microsoft Entra
      ID signed in to an SAP cloud application using IP address `107.253.5.27`. This action triggered an alert due to a suspicious
      SAP authentication. The potential attacker might have taken control of a user account to search through SAP with the
      intention of recording or modifying sensitive financial information, which could be used for later stages in the attack,
      such as phishing or social engineering.'
    question: 'Related to this incident, suspicious emails were later sent by a possibly compromised user account. Can you
      find the sender IP address of those emails?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account with email `Jordan P@vnevado.alpineskihouse.co` performed a suspicious sign-in to 
          SAP, potentially indicating an attacker attempting to access sensitive financial information.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious emails were sent from the IP address `255.246.85.58`, in relation to a BEC fraud 
          attempt, suggesting a compromised user account was involved in sending these emails.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
