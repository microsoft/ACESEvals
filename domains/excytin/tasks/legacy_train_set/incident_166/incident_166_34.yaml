tasks:
- task_id: incident_166_legacy_train_set_task_34
  title: incident_166_legacy_train_set_task_34
  description: 'A related alert indicates a suspicious SAP authentication involving a cloud application. Can you identify
    the AppId of the cloud application that was involved in the suspicious SAP authentication?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving BEC financial fraud occurred, where a suspicious inbox rule that hides
      incoming email messages was created in a risky Azure Active Directory session. An attacker might be attempting to conduct
      financial fraud via business email compromise (BEC). The source of this activity was traced to the IP address `255.246.85.58`.'
    question: 'A related alert indicates a suspicious SAP authentication involving a cloud application. Can you identify the
      AppId of the cloud application that was involved in the suspicious SAP authentication?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious inbox rule that hides incoming email messages was created for the email account 
          `Jordan P@vnevado.alpineskihouse.co`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A user account with a risky sign-in alert in Microsoft Entra ID signed in to the SAP application 
          with AppId `100`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
