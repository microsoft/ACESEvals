tasks:
- task_id: incident_166_legacy_train_set_task_6
  title: incident_166_legacy_train_set_task_6
  description: 'During this incident, there was also suspicious manipulation of a user''s inbox rules. Can you identify the
    IP address associated with the suspicious inbox manipulation rule?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was detected involving an anonymous sign-in from IP address `192.238.237.190`.
      Such sign-ins often involve the use of tools like Tor browser or anonymizer VPNs to mask the user''s identity. It''s
      crucial to determine if any further suspicious activities are linked to this sign-in.'
    question: 'During this incident, there was also suspicious manipulation of a user''s inbox rules. Can you identify the
      IP address associated with the suspicious inbox manipulation rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There was a sign-in from an anonymous IP address using AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious inbox manipulation rule was identified from IP address `255.246.85.58`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
