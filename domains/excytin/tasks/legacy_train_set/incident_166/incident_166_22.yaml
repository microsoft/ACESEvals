tasks:
- task_id: incident_166_legacy_train_set_task_22
  title: incident_166_legacy_train_set_task_22
  description: 'What was the anonymous IP address seen in the end alert related to this security incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involves suspicious emails sent by a possibly compromised user account from the
      IP address `255.246.85.58`. Additionally, an end alert shows sign-in from an anonymous IP address.'
    question: 'What was the anonymous IP address seen in the end alert related to this security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious emails were sent by a possibly compromised user account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was a sign-in from an anonymous IP address `95.202.65.202`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
