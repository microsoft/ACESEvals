tasks:
- task_id: incident_166_legacy_train_set_task_25
  title: incident_166_legacy_train_set_task_25
  description: 'Related to this alert, there is also a suspicious inbox manipulation rule set on a user''s mailbox. Can you
    find the IP address from which this suspicious activity was detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'There was an alert involving Business Email Compromise (BEC) where a user signed in to SAP in a suspicious
      manner. This behavior suggests that an attacker might have taken control of a user account to search through SAP with
      the intention of recording or modifying sensitive financial information. This alert was triggered based on a Microsoft
      Defender XDR alert. The login to this cloud-application happens from IP address `107.253.5.27` and the application has
      an AppId of `100`.'
    question: 'Related to this alert, there is also a suspicious inbox manipulation rule set on a user''s mailbox. Can you
      find the IP address from which this suspicious activity was detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user account named `Jordan P` involved in a business email compromise-related alert signed in to 
          SAP in a suspicious manner.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The inbox of the user `Jordan P` (laylaw@vnevado.alpineskihouse.co) had a suspicious inbox 
          manipulation rule set, moving messages to a folder named RSS Feeds using an IP address `192.238.237.190`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
