  description: 'What is the IP address associated with the suspicious inbox rule created during the BEC financial fraud incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving possible BEC financial fraud was identified. Suspicious events with business
      email compromise (BEC) characteristics were observed involving the user account Jordan P whose email is JordanP@vnevado.alpineskihouse.co.
      This incident might indicate that an attacker is attempting to conduct a fraud attack against the organization.'
    question: 'What is the IP address associated with the suspicious inbox rule created during the BEC financial fraud incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There were suspicious events with BEC characteristics observed for the account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious inbox rule that hides incoming email messages was created from an IP address 
          `255.246.85.58`, indicating BEC financial fraud.
  scoring_aggregation:
