tasks:
- task_id: incident_166_legacy_train_set_task_16
  title: incident_166_legacy_train_set_task_16
  description: 'Related to this alert, there is a suspicious SAP authentication involving a risky sign-in. Can you get the
    AppId for the cloud application involved in the suspicious SAP authentication?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was detected involving suspicious inbox manipulation rules indicating potential
      unauthorized access to a user''s inbox. The attacker''s IP address `255.246.85.58` was identified, and they possibly
      manipulated the user''s inbox rules to delete or move messages or folders. The AppId for the cloud application involved
      is `20893`. In connection with this incident, there was also a suspicious SAP authentication involving a risky sign-in,
      which might have involved the same attacker.'
    question: 'Related to this alert, there is a suspicious SAP authentication involving a risky sign-in. Can you get the
      AppId for the cloud application involved in the suspicious SAP authentication?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user's inbox with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` had its rules manipulated in a
          suspicious manner, potentially as part of an attack to delete or move messages or folders.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in to SAP (AppId `100`)
          with a risky sign-in alert, indicating that an attacker might be searching through SAP with the intention of 
          recording or modifying sensitive financial information.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
