tasks:
- task_id: incident_166_legacy_train_set_task_14
  title: incident_166_legacy_train_set_task_14
  description: 'Can you identify the application ID of the cloud application used during the suspicious SAP sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'A sign-in from an anonymous IP address `95.202.65.202` was observed which could indicate the use of
      Tor browser or anonymizer VPNs. This sign-in was flagged as a potential security incident. In connection with this incident,
      further investigation led to a suspicious sign-in to SAP by a user involved in a business email compromise (BEC) alert.
      The attacker might have taken control of this user account to browse through SAP, possibly with intentions to record
      or alter sensitive financial information, for use in later stages of attack such as phishing or social engineering.'
    question: 'Can you identify the application ID of the cloud application used during the suspicious SAP sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There was a sign-in from an anonymous IP address for the account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, involved in a business email 
          compromise-related alert, also signed in to the cloud application SAP (AppId `100`) in a suspicious manner.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
