tasks:
- task_id: incident_166_legacy_train_set_task_23
  title: incident_166_legacy_train_set_task_23
  description: 'What is the anonymous IP address involved in the suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving suspicious SAP authentication was flagged as a user account with a high-risk
      sign-in alert in Microsoft Entra ID accessed SAP. This indicates that potentially an attacker took control of the account
      to search for or modify sensitive financial information. The possibly compromised user account has the email `Jordan
      P@vnevado.alpineskihouse.co` and SID `S-1-5-21-1740051960-3534030288-108486866-1602`. Additionally, the incident was
      linked to a suspicious sign-in from an anonymous IP address.'
    question: 'What is the anonymous IP address involved in the suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in to SAP with a 
          risky sign-in alert.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was a sign-in from an anonymous IP address `95.202.65.202`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
