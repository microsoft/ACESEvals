  description: 'Can you provide the Azure Active Directory (AAD) User ID involved in the password spray attack?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of an investigation into a security incident, there was a sign-in attempt from the anonymous
      IP address `95.202.65.202`, which could indicate a possible use of a Tor browser or VPN anonymizer. This was detected
      on 2024-07-22 at 08:45:32. Following this, a password spray attack was detected.'
    question: 'Can you provide the Azure Active Directory (AAD) User ID involved in the password spray attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A sign-in attempt was made from an anonymous IP address `95.202.65.202`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A password spray attack was detected targeting the user account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
