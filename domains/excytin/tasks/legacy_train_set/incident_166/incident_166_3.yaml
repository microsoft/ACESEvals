tasks:
- task_id: incident_166_legacy_train_set_task_3
  title: incident_166_legacy_train_set_task_3
  description: 'What is the AppId of the cloud application that was used when the suspicious inbox manipulation rule was set
    in the user''s mailbox?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a recent security incident, a suspicious SAP authentication was detected where a user account with
      a risky sign-in alert in Microsoft Entra ID accessed SAP. This might indicate that an attacker has taken control of
      the user account, potentially searching SAP for sensitive financial information to use in later stages of an attack,
      such as phishing or social engineering. The suspicious activity originated from the IP address `107.253.5.27`, using
      the cloud application with AppId `100`.'
    question: 'What is the AppId of the cloud application that was used when the suspicious inbox manipulation rule was set
      in the user''s mailbox?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '11161'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '11161'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There was a suspicious SAP authentication by a user account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, potentially indicating that an attacker might have taken control of 
          the user account.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious inbox manipulation rule was set on the inbox of Jordan P 
          (laylaw@vnevado.alpineskihouse.co), indicating that the account might be compromised. The user created a 
          MoveToFolder rule named ITCleanup to move messages to a folder named RSS Feeds. This activity was performed by
          the cloud application with AppId `11161`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
