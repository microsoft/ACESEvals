tasks:
- task_id: incident_166_legacy_train_set_task_19
  title: incident_166_legacy_train_set_task_19
  description: 'What was the anonymous IP address that was flagged in connection with this security incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving business email compromise (BEC) financial fraud was identified where
      a suspicious inbox rule that hides incoming email messages was created in a risky Azure Active Directory session. The
      involved account is Jordan P, with the email address Jordan P@vnevado.alpineskihouse.co and IP address 255.246.85.58.'
    question: 'What was the anonymous IP address that was flagged in connection with this security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attacker might be attempting to conduct business email compromise (BEC) by creating a suspicious
          inbox rule to hide incoming emails in an Azure Active Directory session associated with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was a sign-in from an anonymous IP address `95.202.65.202`, indicating potential suspicious 
          activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
