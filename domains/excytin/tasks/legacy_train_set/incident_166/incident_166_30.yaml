tasks:
- task_id: incident_166_legacy_train_set_task_30
  title: incident_166_legacy_train_set_task_30
  description: 'Can you identify the IP address associated with the BEC-related user when they signed into SAP in a suspicious
    manner?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious email was sent by a potentially compromised user account `tony@avoriaz.alpineskihouse.co`
      from the IP address `255.246.85.58` as part of an ongoing business email compromise (BEC) fraud attempt. The email had
      the sender `laylaw@vnevado.alpineskihouse.co`. This alert is related to a BEC incident possibly involving SAP systems.'
    question: 'Can you identify the IP address associated with the BEC-related user when they signed into SAP in a suspicious
      manner?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious emails were sent by a potentially compromised user account with SID 
          `S-1-5-21-1740051960-3534030288-108486866-1602` related to a business email compromise fraud attempt.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A BEC-related user signed in to SAP from IP address `107.253.5.27` in a suspicious manner, 
          indicating the account may have been compromised to access or modify sensitive financial information.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
