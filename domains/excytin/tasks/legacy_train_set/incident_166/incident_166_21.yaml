tasks:
- task_id: incident_166_legacy_train_set_task_21
  title: incident_166_legacy_train_set_task_21
  description: 'For the suspicious events with business email compromise (BEC) characteristics observed later, what is the
    Security Identifier (SID) of the account involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent security incident was detected involving suspicious SAP authentication. A user account with
      a risky sign-in alert in Microsoft Entra ID signed in to SAP, potentially allowing an attacker to record or modify sensitive
      financial information. This activity was traced to the application with AppId `100` and IP address `107.253.5.27`.'
    question: 'For the suspicious events with business email compromise (BEC) characteristics observed later, what is the
      Security Identifier (SID) of the account involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1740051960-3534030288-108486866-1602'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1740051960-3534030288-108486866-1602'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in to SAP with a risky sign-in alert.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There were observed suspicious events with business email compromise characteristics involving the 
          user with SID `S-1-5-21-1740051960-3534030288-108486866-1602`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
