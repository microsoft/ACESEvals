tasks:
- task_id: incident_166_legacy_train_set_task_18
  title: incident_166_legacy_train_set_task_18
  description: 'What is the IP address used by the user involved in the business email compromise-related alert when signing
    in to SAP?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of a recent suspicious SAP authentication incident, a user account named Jordan P with email
      `Jordan P@vnevado.alpineskihouse.co` and associated with the risky sign-in alert from Microsoft Entra ID accessed the
      SAP enterprise application software. The attacker potentially gained control of the user account to search through SAP,
      aiming to record or modify sensitive financial information for future attacks such as phishing or social engineering.'
    question: 'What is the IP address used by the user involved in the business email compromise-related alert when signing
      in to SAP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user with SID `S-1-5-21-1740051960-3534030288-108486866-1602` with a risky sign-in alert in 
          Microsoft Entra ID signed in to SAP.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The user involved in a business email compromise-related alert signed in to SAP from the suspicious
          IP address `107.253.5.27`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
