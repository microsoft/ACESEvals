tasks:
- task_id: incident_166_legacy_train_set_task_20
  title: incident_166_legacy_train_set_task_20
  description: 'In relation to this alert, there is also an alert about a suspicious inbox manipulation rule set up in the
    email account of Jordan P. Can you identify the IP address related to this suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving possible BEC financial fraud was detected, where suspicious events indicated
      an attacker might be attempting fraud against the organization. The account involved in the start alert has the details
      – Name: Jordan P, Email: Jordan P@vnevado.alpineskihouse.co, SID: S-1-5-21-1740051960-3534030288-108486866-1602.'
    question: 'In relation to this alert, there is also an alert about a suspicious inbox manipulation rule set up in the
      email account of Jordan P. Can you identify the IP address related to this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was observed in suspicious events with 
          business email compromise (BEC) characteristics, indicating a potential attempt to conduct financial fraud 
          against the organization.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was a suspicious inbox manipulation rule created by the user Jordan P 
          (laylaw@vnevado.alpineskihouse.co). The rule, named ITCleanup, moves messages to a folder named RSS Feeds, and
          the activity was linked to the IP address `95.202.65.202`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
