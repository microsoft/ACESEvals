tasks:
- task_id: incident_5_legacy_train_set_task_37
  title: incident_5_legacy_train_set_task_37
  description: 'What is the name of the credential theft tool that was detected at the end of this security incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A multi-stage security incident was detected on a machine involving suspicious WMI process creation
      and a potential attempt to access a Primary Refresh Token (PRT). This incident may involve the attacker trying to move
      laterally in the organization or perform credential theft. In the process, several Suspicious WMI process creation and
      attempts to access PRT tokens were recorded.'
    question: 'What is the name of the credential theft tool that was detected at the end of this security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious WMI process creation was observed on the machine with the user SID 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: There was a possible attempt to access the Primary Refresh Token (PRT) using the process 
          `browsercore.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: A possible attempt to access the Primary Refresh Token (PRT) was detected on the host with 
          AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: A malicious credential theft tool execution was detected using the process `mimikatz.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
