tasks:
- task_id: incident_5_legacy_train_set_task_89
  title: incident_5_legacy_train_set_task_89
  description: 'A ransomware payload was remotely launched on another device. Can you identify the host name of this second
    device where the ransomware payload was launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving a possible compromised user account delivering ransomware-related files
      was reported. The user account dropped a ransomware-related file on several devices, including the host `vnevado-win11t`.
      The file names involved were `get-userprttoken.ps1`, `characterical.zip`, and `characterical.zip.lockbit`. Automated
      remediation actions may be taken to disable the compromised account.'
    question: 'A ransomware payload was remotely launched on another device. Can you identify the host name of this second
      device where the ransomware payload was launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11u'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11u'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was observed dropping 
          ransomware-related files on several devices.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A ransomware payload was remotely launched on the host `vnevado-win11u`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
