tasks:
- task_id: incident_5_legacy_train_set_task_62
  title: incident_5_legacy_train_set_task_62
  description: 'Can you identify the URL associated with the activities of the Manatee Tempest group in this security incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a recent security incident, a ransomware payload was remotely launched on the host `vnevado-win11t`
      with the IP address `99.83.111.100`. This might indicate an attempt by attackers to encrypt content on the device, rendering
      it unusable to users. For more information, read the Threat Analytics report on human-operated ransomware. The incident
      also involves another linked alert related to Manatee Tempest, a Russia-based cybercriminal group active since June
      2014. This group is notorious for its involvement in various cybercriminal activities, including drive-by download attacks,
      FakeUpdates infections, lateral movement using Cobalt Strike beacons, and ransomware deployment. Specifically, they
      have also targeted organizations using techniques which include malvertising and domain fronting.'
    question: 'Can you identify the URL associated with the activities of the Manatee Tempest group in this security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vectorsandarrows.com'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vectorsandarrows.com'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A ransomware payload was remotely launched by the account `dp5hn` on this device at 2024-07-04 
          22:35:03.280964+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The Manatee Tempest activity group, a Russia-based cybercriminal group active since June 2014, is 
          known for tactics such as drive-by downloads, BLISTER loader, and Cobalt Strike beacons. They use domain 
          fronting for their command-and-control channels through URLs such as `vectorsandarrows.com`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
