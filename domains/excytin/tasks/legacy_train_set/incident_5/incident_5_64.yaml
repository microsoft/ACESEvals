tasks:
- task_id: incident_5_legacy_train_set_task_64
  title: incident_5_legacy_train_set_task_64
  description: 'What is the name of the account associated with the possible ransomware activity detected on 2024-07-04?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the same investigation, lateral movement to the jump server (vnevado-jump) was also detected
      via PSExec, however the IP address remains unknown at the moment. Later, possible ransomware activity based on a known
      malicious extension was observed on the device on 2024-07-04. This activity involved substantial file system changes
      and is indicative of mass encryption of files by ransomware.'
    question: 'What is the name of the account associated with the possible ransomware activity detected on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A known credential theft tool was executed by the user account with AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: There was a lateral movement to the jump server `Vnevado-jump` from the IP address `99.83.111.100` 
          using PSExec.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Possible ransomware activity was detected on the device with changes involving the account named 
          `dp5hn` indicating mass encryption of files by ransomware.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
