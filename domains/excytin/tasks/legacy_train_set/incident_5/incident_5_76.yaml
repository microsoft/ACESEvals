tasks:
- task_id: incident_5_legacy_train_set_task_76
  title: incident_5_legacy_train_set_task_76
  description: 'Related to this alert, suspicious hands-on keyboard behavior was observed. Can you find the hostname of the
    device where the suspicious user behavior was detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving file backups being deleted was reported. On host `vnevado-win11u`, a
      process `vssblatemp.exe` with ProcessId `1900` was run to delete all shadow copies at 2024-06-20t09:32:02.4640548z.
      This is a common tactic during ransomware infection.'
    question: 'Related to this alert, suspicious hands-on keyboard behavior was observed. Can you find the hostname of the
      device where the suspicious user behavior was detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11t'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account `dp5hn` deleted all file snapshots and shadow copies, which is a common action during a
          Ransomware infection.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious hands on keyboard behavior was observed on host `vnevado-win11t`, indicating a possible 
          human-operated attack.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
