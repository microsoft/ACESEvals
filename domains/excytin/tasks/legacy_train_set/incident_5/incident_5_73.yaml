tasks:
- task_id: incident_5_legacy_train_set_task_73
  title: incident_5_legacy_train_set_task_73
  description: 'Can you identify the host name where the ''CommandAndControl'' malware was detected during the lateral movement?'
  inherit_shared: true
  initial_context:
    incident_context: 'Integrated alert details indicate that ''CommandAndControl'' malware was detected likely during lateral
      movement from another network device.'
    question: 'Can you identify the host name where the ''CommandAndControl'' malware was detected during the lateral movement?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10r'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10r'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An actor associated with Russia-based Manatee Tempest, targeting industries with their diverse 
          methods, and using domain fronting to establish command-and-control channels, had access via an account with 
          AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The 'CommandAndControl' malware was detected on the host named `vnevado-win10r`, indicating an 
          attempt at lateral movement by an attacker.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
