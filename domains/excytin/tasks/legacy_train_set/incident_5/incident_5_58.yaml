tasks:
- task_id: incident_5_legacy_train_set_task_58
  title: incident_5_legacy_train_set_task_58
  description: 'What is the Security Identifier (SID) of the account involved in the PSExec to the jump server `Vnevado-jump`?'
  inherit_shared: true
  initial_context:
    incident_context: 'An incident was reported involving ''CommandAndControl'' malware detected during lateral movement on
      the device `vnevado-win11t`. It seems that the attacker might be attempting to move laterally to this device from another
      device on the network. The command executed was `curl http://vectorsandarrows.com`. Additionally, suspicious remote
      activity was observed, raising concerns about potential malicious activities.'
    question: 'What is the Security Identifier (SID) of the account involved in the PSExec to the jump server `Vnevado-jump`?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-5-7-21-1843151660-3234030288-105586167-1422'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-5-7-21-1843151660-3234030288-105586167-1422'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: "'CommandAndControl' malware was detected on the device associated with the account `dp5hn`."
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious remote activity was observed on this machine from the IP address `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Lateral movement to the jump server `Vnevado-jump` was conducted by the user with SID 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
