tasks:
- task_id: incident_5_legacy_train_set_task_79
  title: incident_5_legacy_train_set_task_79
  description: 'Following up on this incident, ransomware-like behavior was observed. Could you identify the file name that
    was associated with this ransomware attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent command and control behavior was blocked on the host `vnevado-win10s`. The host made a suspicious
      request using `curl http://vectorsandarrows.com`, and this suspicious activity could be associated with malware capable
      of receiving commands from remote attackers. Additionally, because the malware was active, higher severity ratings were
      assigned, and precautionary measures were recommended to prevent further infection.'
    question: 'Following up on this incident, ransomware-like behavior was observed. Could you identify the file name that
      was associated with this ransomware attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'syncretic.7z.lockbit'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'syncretic.7z.lockbit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Malware with command and control behavior was detected and blocked on the account `dp5hn`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A potentially compromised asset exhibited ransomware-like behavior with the file 
          `syncretic.7z.lockbit`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
