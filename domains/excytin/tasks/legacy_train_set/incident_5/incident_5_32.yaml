tasks:
- task_id: incident_5_legacy_train_set_task_32
  title: incident_5_legacy_train_set_task_32
  description: 'Based on this incident, can you determine the name of another file that is exhibiting ransomware-like behavior,
    found at the same time as the compromised assets on host `vnevado-win11t`?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at 22:35:02, a security incident involving potentially compromised assets exhibiting
      ransomware-like behavior was detected. Multiple devices, including host `vnevado-win11t`, appear to be infected by files
      such as `characterical.zip` and `characterical.zip.lockbit`. An attacker potentially used the specified user account,
      IP, or device to move laterally across the network and infect other devices with ransomware.'
    question: 'Based on this incident, can you determine the name of another file that is exhibiting ransomware-like behavior,
      found at the same time as the compromised assets on host `vnevado-win11t`?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'unstreaming.xlsx.lockbit'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'unstreaming.xlsx.lockbit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account with SID `S-0-6-5` is exhibiting ransomware-like behavior.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The file `unstreaming.xlsx.lockbit` suggests ransomware-like activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
