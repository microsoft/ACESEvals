tasks:
- task_id: incident_5_legacy_train_set_task_19
  title: incident_5_legacy_train_set_task_19
  description: 'What is the name of the process that was executed as a credential theft tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving the Manatee Tempest activity group was observed, which is a Russia-based
      cybercriminal group known for using tactics such as drive-by downloads and domain fronting to deliver malware like Cobalt
      Strike beacons. During this incident, which started with the URL `vectorsandarrows.com` and IP address `198.43.121.209`,
      there were multiple alerts including attempts to access Primary Refresh Token (PRT) and execution of a known credential
      theft tool. The alert mentioned that a known credential theft tool''s command line was detected, indicating an intent
      to dump users'' credentials, keys, plain-text passwords and more.'
    question: 'What is the name of the process that was executed as a credential theft tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cmd.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'cmd.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: There is a detected activity involving the Russia-based cybercriminal group known as Manatee 
          Tempest, involving an account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A possible attempt to access Primary Refresh Token (PRT) has been detected, with the involved 
          process being `browsercore.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Another possible attempt to access Primary Refresh Token (PRT) has been detected on the host 
          `vnevado-win10v`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: A known malicious credential theft tool was executed with the process `cmd.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
