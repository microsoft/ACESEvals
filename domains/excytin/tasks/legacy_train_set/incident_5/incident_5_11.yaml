tasks:
- task_id: incident_5_legacy_train_set_task_11
  title: incident_5_legacy_train_set_task_11
  description: 'What is the Azure Active Directory User ID (AadUserId) of the account associated with the potentially compromised
    assets exhibiting ransomware-like behavior?'
  inherit_shared: true
  initial_context:
    incident_context: 'A known credential theft tool named `mimikatz.exe` was executed on 2024-07-04, indicating a potential
      credential theft attempt, involving a series of processes like `notepad.exe` and `cmd.exe`. Following this activity,
      there was a lateral movement alert reported on 2024-07-10 towards the jump server `Vnevado-jump`. In another connected
      alert on 2024-07-04, there was an indication of potentially compromised assets exhibiting ransomware-like behavior,
      suggesting that an attacker might be using a specific user account, IP, or device to spread ransomware.'
    question: 'What is the Azure Active Directory User ID (AadUserId) of the account associated with the potentially compromised
      assets exhibiting ransomware-like behavior?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '731adb71-b11c-4bbf-850b-57989b350e96'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '731adb71-b11c-4bbf-850b-57989b350e96'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A known credential theft tool execution was detected on host `vnevado-win10v`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: There was a lateral movement detected to the jump server from IP address `99.83.111.100` using 
          PSExec.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Potentially compromised assets are exhibiting ransomware-like behavior, an attacker might be using 
          the user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
