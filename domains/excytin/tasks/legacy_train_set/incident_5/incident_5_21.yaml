tasks:
- task_id: incident_5_legacy_train_set_task_21
  title: incident_5_legacy_train_set_task_21
  description: 'In close proximity to this event, lateral movement was observed on another device. What is the IP address
    associated with this potential lateral movement?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involved a potential attempt to access a Primary Refresh Token (PRT) on the host
      `vnevado-win11u` with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`. This attempt could be indicative of lateral
      movement or credential theft, as attackers often seek to exploit PRTs to gain unauthorized access to multiple services
      and applications.'
    question: 'In close proximity to this event, lateral movement was observed on another device. What is the IP address associated
      with this potential lateral movement?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '83.162.58.168'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '83.162.58.168'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: There was a possible attempt to access the Primary Refresh Token by an account with SID 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Possible ransomware activity has been detected on host `vnevado-win11t` based on numerous file 
          system changes and a known malicious extension.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Possible lateral movement was observed involving a suspicious network event from IP address 
          `83.162.58.168`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
