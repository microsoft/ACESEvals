tasks:
- task_id: incident_5_legacy_train_set_task_77
  title: incident_5_legacy_train_set_task_77
  description: 'Can you provide the account name used in the ''CommandAndControl'' malware detected during lateral movement?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was identified involving possible lateral movement across devices on the network.
      The incident involves a suspicious IP address `83.162.58.168` and a triggered Microsoft Defender for Endpoint alert
      suggesting an attacker might be trying to move laterally to gather data or elevate privileges.'
    question: 'Can you provide the account name used in the ''CommandAndControl'' malware detected during lateral movement?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Lateral movement was observed on the host `vnevado-win11t`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: An attacker might be attempting to move laterally to the device from another device on the network.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: "'CommandAndControl' malware was detected during lateral movement involving the account `dp5hn`."
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
