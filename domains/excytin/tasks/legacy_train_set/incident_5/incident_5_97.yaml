tasks:
- task_id: incident_5_legacy_train_set_task_97
  title: incident_5_legacy_train_set_task_97
  description: 'During this incident, it was found that malware was detected and active. Can you identify the file name of
    the malware that was found to be active?'
  inherit_shared: true
  initial_context:
    incident_context: 'A potential security incident involving a possible attempt to access the Primary Refresh Token (PRT)
      was detected, wherein an attacker might be trying to gain access to Azure AD authentication tokens on host `vnevado-win11t`.
      The process involved had the ProcessId__CreatedTimeUtc__CommandLine `7036__2024-06-20t09:29:49.304018z__''browsercore.exe''`.
      This incident might be related to malicious activities associated with accessing critical resources for lateral movement
      or credential theft.'
    question: 'During this incident, it was found that malware was detected and active. Can you identify the file name of
      the malware that was found to be active?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: There was a possible attempt to access Primary Refresh Token (PRT) using the file 
          `browsercore.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The attempt to access Primary Refresh Token (PRT) was detected from the IP address 
          `107.224.99.179`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An unknown malware with the file name `mimilib.dll` was detected and was active.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
