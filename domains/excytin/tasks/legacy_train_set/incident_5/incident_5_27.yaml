tasks:
- task_id: incident_5_legacy_train_set_task_27
  title: incident_5_legacy_train_set_task_27
  description: 'Can you identify the AadUserId related to the suspicious WMI process creation event?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving suspicious access to the LSASS service was recorded, where multiple public
      tools or custom ones could be used by attackers to obtain clear-text passwords from LSASS service''s memory. This was
      followed by lateral movement activities involving PSExec to jump server and ransomware payload remotely launched on
      a device. The attackers might be attempting to encrypt content on the device, making it unusable to users. The next
      alert triggered was due to a suspicious WMI process creation, potentially used by malware to spawn new processes and
      further infect the machine.'
    question: 'Can you identify the AadUserId related to the suspicious WMI process creation event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '731adb71-b11c-4bbf-850b-57989b350e96'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '731adb71-b11c-4bbf-850b-57989b350e96'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: There was a suspicious access to the LSASS service by the user with SID 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A ransomware payload was remotely launched by the user with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Suspicious WMI process creation was observed on the machine and was linked to the user with 
          AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Lateral movement to the jump server was performed using PSExec by an IP address `99.83.111.100`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
