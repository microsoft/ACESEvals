tasks:
- task_id: incident_5_legacy_train_set_task_23
  title: incident_5_legacy_train_set_task_23
  description: 'Can you identify the account name involved in the Command and Control behavior from this security incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'In relation to a security incident involving lateral movement attempts using SMB remote file access,
      a previous alert on 2024-07-04 highlighted that Command and Control behavior was blocked due to active malware. The
      involved account name needs to be identified.'
    question: 'Can you identify the account name involved in the Command and Control behavior from this security incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A contained user tried to create, delete, or modify files over SMB protocol on host 
          `vnevado-win11t`, but these actions were blocked as they could be lateral movement attempts.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Command and Control behavior of active malware was blocked on the user account named `dp5hn`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
