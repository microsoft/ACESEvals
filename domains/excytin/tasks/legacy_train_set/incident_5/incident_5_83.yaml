tasks:
- task_id: incident_5_legacy_train_set_task_83
  title: incident_5_legacy_train_set_task_83
  description: 'An alert also indicated possible lateral movement associated with this incident. Can you identify the IP address
    of the device where lateral movement was observed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of possible ransomware activity, several file system changes were detected
      on the device, including the files `get-userprttoken.ps1`, `characterical.zip`, and `characterical.zip.lockbit`. These
      changes suggest potential ransomware activity due to the known malicious extensions. The suspected ransomware attack
      was linked to account with Name `dp5hn` and associated IP address `99.83.111.100`.'
    question: 'An alert also indicated possible lateral movement associated with this incident. Can you identify the IP address
      of the device where lateral movement was observed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '83.162.58.168'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '83.162.58.168'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There is possible ransomware activity on the device with AadDeviceId 
          `e5799261-6720-4297-961e-bd9ca4275033`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious lateral movement was detected with a network event involving IP address `83.162.58.168`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
