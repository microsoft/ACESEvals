tasks:
- task_id: incident_5_legacy_train_set_task_70
  title: incident_5_legacy_train_set_task_70
  description: 'Can you determine the specific active malware detected following the modification of the critical security
    process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident on host ''vnevado-win10v'', a critical process responsible for enforcing
      security policies was maliciously altered. Various accounts and processes, including the execution of suspicious commands,
      were involved in the incident.'
    question: 'Can you determine the specific active malware detected following the modification of the critical security
      process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The LSASS process memory on the host with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1` was 
          modified.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Active malware named `mimikatz.exe` was detected running on the same host.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
