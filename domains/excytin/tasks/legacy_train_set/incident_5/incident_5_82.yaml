tasks:
- task_id: incident_5_legacy_train_set_task_82
  title: incident_5_legacy_train_set_task_82
  description: 'What was the IP address used in the PsExec command to launch a remote device command as part of this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A user account, identified as `dp5hn` and possibly compromised, was observed delivering ransomware-related
      files such as `characterical.zip` and `characterical.zip.lockbit` on host `vnevado-win11t`. This incident was flagged
      on July 4, 2024, and indicated as part of a possible ransomware attack where an attacker might also be attempting lateral
      movement within the network.'
    question: 'What was the IP address used in the PsExec command to launch a remote device command as part of this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A ransomware-related file was dropped using the IP address `99.83.111.100`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Lateral movement using PSExec was done to the host with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: PSExec was used to launch a command on a remote device with IP address `107.224.99.179`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
