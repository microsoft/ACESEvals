tasks:
- task_id: incident_5_legacy_train_set_task_100
  title: incident_5_legacy_train_set_task_100
  description: 'What is the name of the malware detected as active and running on the system?'
  inherit_shared: true
  initial_context:
    incident_context: 'A multi-stage security incident involving system recovery setting tampering was detected on host `vnevado-win11u`.
      A file `vssblatemp.exe` was observed being used to delete volume shadow copies on the system. This action might be an
      attempt by adversaries to prevent system recovery and deny access to backups. Multiple alerts have been flagged in relation
      to this incident, one of which involves a user account dropping ransomware-related files on several devices, and another
      indicating lateral movement to the jump server.'
    question: 'What is the name of the malware detected as active and running on the system?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The user with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was involved in tampering with 
          system recovery settings.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A user account associated with IP address `99.83.111.100` was observed delivering 
          ransomware-related files.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Lateral movement was carried out to the jump server identified by AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1` using PSExec.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: An active malware identified as `mimikatz.exe` was detected.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
