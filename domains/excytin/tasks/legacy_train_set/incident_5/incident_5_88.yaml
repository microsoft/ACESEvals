tasks:
- task_id: incident_5_legacy_train_set_task_88
  title: incident_5_legacy_train_set_task_88
  description: 'What is the name of the file detected as the Mimikatz credential theft tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a recent security incident, a Command and Control behavior was blocked after detecting malware on
      a machine. The malware might have received commands from remote attackers. A related entity was the URL `http://vectorsandarrows.com/`,
      which could have been involved in malicious activity. Shortly after, a ransomware payload was remotely launched on the
      same device, potentially aimed at encrypting the content and rendering it unusable for users. Later, there was evidence
      of lateral movement to the jump server Vnevado-jump using PSExec. Following these events, the Mimikatz credential theft
      tool was detected on the device, potentially used to harvest credentials.'
    question: 'What is the name of the file detected as the Mimikatz credential theft tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilove.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilove.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was involved in Command and 
          Control behavior that was blocked.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A ransomware payload was remotely launched from the IP address `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: There was lateral movement using PSExec to the jump server `vnevado-win10v`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: The Mimikatz credential theft tool, detected as `mimilove.exe`, was found on the device.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
