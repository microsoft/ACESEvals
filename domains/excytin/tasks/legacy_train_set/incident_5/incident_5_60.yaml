tasks:
- task_id: incident_5_legacy_train_set_task_60
  title: incident_5_legacy_train_set_task_60
  description: 'During the same incident, suspicious remote activity was observed on the machine. Can you determine the SID
    of the account involved in this remote activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving the Manatee Tempest activity group was flagged. The Manatee Tempest is
      a Russia-based cybercriminal group known for its association with the Dridex banking trojan and other malicious activities,
      including domain fronting to establish command-and-control channels for Cobalt Strike beacons. As part of the incident,
      a curl command was executed to access the URL `vectorsandarrows.com` from the host `vnevado-win11u`.'
    question: 'During the same incident, suspicious remote activity was observed on the machine. Can you determine the SID
      of the account involved in this remote activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account `dp5hn` is associated with the Manatee Tempest activity group, which is a Russia-based 
          cybercriminal group known for using various malware and attack techniques.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There is suspicious remote activity involving an account with SID `S-0-6-5`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
