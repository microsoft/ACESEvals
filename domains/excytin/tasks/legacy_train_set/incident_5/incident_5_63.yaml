tasks:
- task_id: incident_5_legacy_train_set_task_63
  title: incident_5_legacy_train_set_task_63
  description: 'Based on the observed Manatee Tempest activity, can you provide the hostname of another endpoint involved
    in this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'The actor group relies on tactics such as using domain fronting for command-and-control channels. One
      command observed was to use `curl` to access vectorsandarrows.com from a specific host.'
    question: 'Based on the observed Manatee Tempest activity, can you provide the hostname of another endpoint involved in
      this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10s'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10s'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522` is associated with Manatee 
          Tempest cybercriminal group activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The host `vnevado-win10s` is also linked to activities performed by the Manatee Tempest 
          cybercriminal group.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
