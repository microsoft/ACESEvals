tasks:
- task_id: incident_5_legacy_train_set_task_20
  title: incident_5_legacy_train_set_task_20
  description: 'Can you identify the URL associated with the activities of the Manatee Tempest group detected in this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a recent security incident, a known credential theft tool execution command line was detected indicating
      potential credential dumping. The process `mimikatz.exe` was executed, which might have been an attempt to dump users''
      credentials, keys, and plain-text passwords. This incident reported malicious activities from the actor Manatee Tempest,
      a Russia-based cybercriminal group active since June 2014. They are known for using malware campaigns such as the Dridex
      banking trojan and establish command-and-control channels for Cobalt Strike beacons through domain fronting.'
    question: 'Can you identify the URL associated with the activities of the Manatee Tempest group detected in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vectorsandarrows.com'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vectorsandarrows.com'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A known credential theft tool was detected on the host with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Lateral movement to the jump server `Vnevado-jump` was conducted via IP `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Suspicious remote activity was observed involving the user with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Activity linked to the Manatee Tempest cybercriminal group was observed, with a URL potentially associated
          with the group: `vectorsandarrows.com`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
