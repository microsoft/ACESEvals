tasks:
- task_id: incident_5_legacy_train_set_task_34
  title: incident_5_legacy_train_set_task_34
  description: 'As part of a follow-up investigation, what is the file name of the malware detected and was active in the
    final alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent security incident involving possible ransomware actions and credential theft attempts has
      been flagged. Initially, we observed that all file snapshots and shadow copies were deleted using `vssblatemp.exe` on
      the host `vnevado-win10r`. This may have been an attempt to cover tracks commonly associated with ransomware infections.
      Subsequently, there were attempts to access the Primary Refresh Token (PRT) which is critical for Azure AD authentication
      on various devices. These activities could enable attackers to move laterally within the organization or steal credentials.
      The incident may be connected with ongoing investigations into the Midnight Blizzard credential attacks.'
    question: 'As part of a follow-up investigation, what is the file name of the malware detected and was active in the final
      alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The account `dp5hn` deleted all file snapshots and shadow copies, which is common during ransomware
          infection.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: There was a possible attempt to access Primary Refresh Token (PRT) via the process 
          `browsercore.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: There was another possible attempt to access Primary Refresh Token (PRT) on the host with 
          AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Unknown malware named `mimikatz.exe` was detected and was active.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
