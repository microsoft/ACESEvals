tasks:
- task_id: incident_5_legacy_train_set_task_52
  title: incident_5_legacy_train_set_task_52
  description: 'Can you identify the hostname of the machine where the suspicious WMI process creation was last observed?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious ransomware behavior was detected on the file system of the host `vnevado-win11u`, which
      might indicate mass encryption of files by ransomware. This potential ransomware activity could be indicative of ransomware
      activity. Following this, a suspicious WMI process creation was observed on the same machine at around the same time.
      Malware frequently uses WMI to spawn new processes, breaking process trees and further infecting a machine.'
    question: 'Can you identify the hostname of the machine where the suspicious WMI process creation was last observed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11t'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious file system changes indicating potential ransomware activity were detected on the host 
          `vnevado-win11u`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious WMI process creation was observed on the machine associated with the account with SID 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A suspicious WMI process creation was observed on the host `vnevado-win11t`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
