tasks:
- task_id: incident_5_legacy_train_set_task_99
  title: incident_5_legacy_train_set_task_99
  description: 'What is the URL associated with the blocked Command and Control behavior?'
  inherit_shared: true
  initial_context:
    incident_context: 'A ''CommandAndControl'' malware was detected on the host `vnevado-win11t`, which might be an indicator
      of an attacker attempting to move laterally to this device from another device on the network. A process involving `curl
      http://vectorsandarrows.com` on this host with ID `e5799261-6720-4297-961e-bd9ca4275033` was flagged during this detection.'
    question: 'What is the URL associated with the blocked Command and Control behavior?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The 'CommandAndControl' malware was detected on the device associated with the account `dp5hn`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A command and control behavior from the URL `http://vectorsandarrows.com/` was blocked, indicating 
          that the malware was active and attempting to perform malicious activities.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
