tasks:
- task_id: incident_5_legacy_train_set_task_46
  title: incident_5_legacy_train_set_task_46
  description: 'What is the name of the ransomware-related file that was delivered by the compromised user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was flagged when a known credential theft tool execution `mimikatz.exe` with ProcessId
      `6600` and command line intended to dump users'' credentials, keys, plain-text passwords was detected. The IP address
      associated was `107.224.99.179`. This incident is indicative of malicious activity, potentially compromising user accounts
      for lateral movement within the network.'
    question: 'What is the name of the ransomware-related file that was delivered by the compromised user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip.lockbit'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip.lockbit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A known credential theft tool was detected on the host with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: PSExec was used for lateral movement to the jump server at IP address `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A possible compromised user account delivered ransomware-related file `characterical.zip.lockbit` 
          on several devices.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
