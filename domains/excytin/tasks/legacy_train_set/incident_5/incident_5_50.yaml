  description: 'Can you identify what process was used to disable the system recovery feature on the same indar kasoo'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident flagged a possible attempt to access a Primary Refresh Token (PRT) on a system,
      executed by the process `browsercore.exe` with Process ID 2676 on 2024-06-20t09:10:59.867384z. PRT is crucial for Azure
      AD authentication and attackers might be targeting it for lateral movement or credential theft.'
    question: 'Can you identify what process was used to disable the system recovery feature on the same indar kasoo'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '8136__2024-06-20t09:10:48.0438707z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
