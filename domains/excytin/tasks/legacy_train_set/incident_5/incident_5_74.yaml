tasks:
- task_id: incident_5_legacy_train_set_task_74
  title: incident_5_legacy_train_set_task_74
  description: 'What is the name of the host involved in the deletion of file snapshots and shadow copies during the subsequent
    ransomware infection?'
  inherit_shared: true
  initial_context:
    incident_context: 'There was a security incident involving system recovery setting tampering on the device `vnevado-win11u`.
      Adversaries might be attempting to delete or remove built-in operating system data and turn off recovery services to
      prevent recovering a corrupted system. Specifically, the commands ''vssblatemp.exe delete shadows /all'' and ''bcdedit
      /set recoveryenabled no'' were executed on the host `vnevado-win11u` which could indicate an attempt to disable or delete
      system recovery features.'
    question: 'What is the name of the host involved in the deletion of file snapshots and shadow copies during the subsequent
      ransomware infection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11t'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There was system recovery setting tampering observed on this device by the user with SID 
          `S-1-5-21-1840191660-8534830288-125585561-1522`. Adversaries may be attempting to delete or remove built-in 
          operating system data and turn off recovery services.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: All file snapshots and shadow copies were deleted on the host `vnevado-win11t`, which is common 
          during ransomware infection.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
