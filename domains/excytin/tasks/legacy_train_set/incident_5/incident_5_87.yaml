tasks:
- task_id: incident_5_legacy_train_set_task_87
  title: incident_5_legacy_train_set_task_87
  description: 'Regarding the observed suspicious activity on `vnevado-win11u`, can you identify the host that had its system
    recovery settings tampered with?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert indicates suspicious remote activity initiated on a machine, which may include actions like
      initiating interactive sessions, modifying files, passing WMI commands, creating scheduled tasks, and other potentially
      malicious activities from a remote machine. There are multiple processes observed during this activity such as `get-userprttoken.ps1`
      executed by powershell script, several `bcdedit` commands altering boot status and recovery settings, and even a curl
      request to vectorsandarrows.com. This alert occurred on host `vnevado-win11u`.'
    question: 'Regarding the observed suspicious activity on `vnevado-win11u`, can you identify the host that had its system
      recovery settings tampered with?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11t'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was initiated which led to the execution of `vssblatemp.exe` on host 
          `vnevado-win11t`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: vssblatemp.exe was likely used to tamper with system recovery settings on host `vnevado-win11t`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
