tasks:
- task_id: incident_5_legacy_train_set_task_41
  title: incident_5_legacy_train_set_task_41
  description: 'What is the name of the file involved in the suspicious access to LSASS service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a security incident on 2024-07-04, a known credential theft tool execution
      command line involving `conhost.exe` was detected. This indicates an attempt to dump users'' credentials, keys, and
      plain-text passwords using the tool.'
    question: 'What is the name of the file involved in the suspicious access to LSASS service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'hid.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'hid.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` executed a known credential theft
          tool.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious access was detected to the LSASS service involving file `hid.dll`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
