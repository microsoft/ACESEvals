tasks:
- task_id: incident_5_legacy_train_set_task_85
  title: incident_5_legacy_train_set_task_85
  description: 'In relation to this sequence of activities, there was also a possible attempt to access the Primary Refresh
    Token (PRT). Can you identify the file name of the process used in this attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent incident involved using PsExec to remotely execute commands, potentially indicating lateral
      movement attempts by an attacker. Specifically, the commands executed include `notepad.exe` and `cmd.exe`, with `cmd.exe`
      having a Process ID of 8656 and timestamp `2024-06-20t09:07:09.5458894z`. This activity suggests attackers may be targeting
      devices within the organization.'
    question: 'In relation to this sequence of activities, there was also a possible attempt to access the Primary Refresh
      Token (PRT). Can you identify the file name of the process used in this attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: PsExec launched a command on a remote device with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was a possible attempt to access the Primary Refresh Token using the process 
          `powershell.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
