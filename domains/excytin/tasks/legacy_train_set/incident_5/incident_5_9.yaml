tasks:
- task_id: incident_5_legacy_train_set_task_9
  title: incident_5_legacy_train_set_task_9
  description: 'Following this alert, a malicious credential theft tool was executed. Can you identify the file name of the
    process used to perform this credential theft?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent security incident that involved a possible attempt to access the Primary Refresh Token
      (PRT), a file `browsercore.exe` was executed on the host `vnevado-win10r` by the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`.
      The PRT is crucial for Azure AD authentication and its access could be an indicator of an attack aiming to move laterally
      or perform credential theft.'
    question: 'Following this alert, a malicious credential theft tool was executed. Can you identify the file name of the
      process used to perform this credential theft?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cmd.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'cmd.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: There was a possible attempt to access the Primary Refresh Token with the process 
          `browsercore.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious Primary Refresh Token access attempt was associated with the account having AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Malicious credential theft tool execution was detected with the process `cmd.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
