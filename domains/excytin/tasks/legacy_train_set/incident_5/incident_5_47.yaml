tasks:
- task_id: incident_5_legacy_train_set_task_47
  title: incident_5_legacy_train_set_task_47
  description: 'What was the command line used to delete the snapshots and shadow copies, and what is the process ID associated
    with this command?'
  inherit_shared: true
  initial_context:
    incident_context: 'A possible attempt to access a Primary Refresh Token (PRT) was detected, potentially compromising Azure
      AD authentication on a Windows 10 device for the user `tgs2z` using the IP `107.224.99.179`. Moreover, in another related
      alert, there was an indication that all file snapshots and shadow copies were deleted through the utility `vssblatemp.exe`,
      which is a typical sign of a ransomware infection.'
    question: 'What was the command line used to delete the snapshots and shadow copies, and what is the process ID associated
      with this command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process ID: 5512, Command Line: vssblatemp.exe delete shadows /all'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process ID: 5512, Command Line: vssblatemp.exe delete shadows /all'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: There was a possible attempt to access the Primary Refresh Token (PRT) using the process 
          `browsercore.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: There was another attempt to access the PRT by an account with SID 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: File backups were deleted using the process `vssblatemp.exe` with the command line `delete shadows 
          /all` at `2024-06-20t09:10:50.2899021z`, with Process ID `5512`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
