      group active since June 2014, known for deploying tactics such as drive-by downloads, BLISTER loader, and Cobalt Strike
      beacons for lateral movement and ransomware deployment. Following these observations, `CommandAndControl` malware was
      detected, indicating an attempt at lateral movement to another device on the network.'
