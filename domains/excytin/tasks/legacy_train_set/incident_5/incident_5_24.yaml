tasks:
- task_id: incident_5_legacy_train_set_task_24
  title: incident_5_legacy_train_set_task_24
  description: 'During a potential lateral movement, an IP address is associated with another device. Can you provide the
    IP address that was related to the possible lateral movement attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'In the investigation of a security incident involving active unknown malware that was detected on a
      machine, it was identified that a user account might have been compromised and used to drop ransomware-related files
      on several devices. This could potentially be part of an attack aiming at lateral movement across the network.'
    question: 'During a potential lateral movement, an IP address is associated with another device. Can you provide the IP
      address that was related to the possible lateral movement attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '38.142.109.10'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '38.142.109.10'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: There is a detection of active unknown malware on the host with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: There was lateral movement to the jump server from IP address `99.83.111.100` using PSExec.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: There is a possible compromised user account delivering ransomware-related files on host 
          `vnevado-win11u`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Possible lateral movement was observed from IP address `38.142.109.10`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
