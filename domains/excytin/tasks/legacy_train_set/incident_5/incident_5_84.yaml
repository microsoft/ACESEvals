tasks:
- task_id: incident_5_legacy_train_set_task_84
  title: incident_5_legacy_train_set_task_84
  description: 'Can you determine the IP address from which the possible attempt to access the Primary Refresh Token (PRT)
    was made?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a recent attempt to move laterally within our network, a user account associated with Grace Chen
      (email: Grace Chen@vnevado.alpineskihouse.co) had its attempts to modify files over server message block (SMB) protocol
      blocked by an automated attack disruption. This incident is part of a broader security concern involving possible attempts
      to access the Primary Refresh Token (PRT), which is a crucial artifact for Azure AD authentication on various devices.'
    question: 'Can you determine the IP address from which the possible attempt to access the Primary Refresh Token (PRT)
      was made?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An attempt to create, delete, or modify files over the SMB protocol was blocked on the device with 
          AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A possible attempt to access the Primary Refresh Token (PRT) using the process `browsercore.exe` 
          was detected.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A possible attempt to access the Primary Refresh Token (PRT) was detected from IP address 
          `107.224.99.179`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
