tasks:
- task_id: incident_5_legacy_train_set_task_17
  title: incident_5_legacy_train_set_task_17
  description: 'Which URL associated with the Manatee Tempest activity group was involved in this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident, we detected active unknown malware running on the machine. This was followed
      by a possible attempt to access the Primary Refresh Token (PRT); PRT is a key artifact of Azure AD authentication and
      can enable lateral movement or credential theft. Further investigation revealed activities consistent with the Manatee
      Tempest group, a Russia-based cybercriminal group involved in various sophisticated cyber attacks such as drive-by downloads,
      malvertising, FakeUpdates infections, and the use of BLISTER loader to deliver Cobalt Strike beacons for lateral movement
      and ransomware deployment.'
    question: 'Which URL associated with the Manatee Tempest activity group was involved in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vectorsandarrows.com'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vectorsandarrows.com'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Active unknown malware was detected on the IP address `107.224.99.179`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: There was a possible attempt to access Primary Refresh Token (PRT) involving the process with the 
          file name `browsercore.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: There was a possible attempt to access Primary Refresh Token (PRT) by an account with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Activities from the Manatee Tempest cybercriminal group were detected involving the URL 
          `vectorsandarrows.com`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
