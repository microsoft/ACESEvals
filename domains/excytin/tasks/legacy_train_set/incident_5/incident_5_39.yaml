tasks:
- task_id: incident_5_legacy_train_set_task_39
  title: incident_5_legacy_train_set_task_39
  description: 'In relation to this incident, we have observed activity linked to the Manatee Tempest cybercriminal group.
    Can you identify the IP address associated with this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a recent incident, ''CommandAndControl'' malware was detected on the device with hostname `vnevado-win11t`.
      This could be an indication of an attacker trying to move laterally within the network. The investigation started from
      the account `dp5hn`, which used the process `curl http://vectorsandarrows.com` and was found on the device with AadDeviceId
      `e5799261-6720-4297-961e-bd9ca4275033`.'
    question: 'In relation to this incident, we have observed activity linked to the Manatee Tempest cybercriminal group.
      Can you identify the IP address associated with this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The 'CommandAndControl' malware was detected during lateral movement on the device with AadDeviceId
          `e5799261-6720-4297-961e-bd9ca4275033`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The Manatee Tempest activity group, a Russia-based cybercriminal group known for various malware 
          campaigns, is associated with the IP address `198.43.121.209`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
