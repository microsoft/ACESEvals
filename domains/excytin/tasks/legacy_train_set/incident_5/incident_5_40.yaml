tasks:
- task_id: incident_5_legacy_train_set_task_40
  title: incident_5_legacy_train_set_task_40
  description: 'Can you identify the AadDeviceId of the host in which suspicious file system changes, indicative of ransomware
    activity, were detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was reported in which potentially compromised assets are exhibiting ransomware-like
      behavior, impacting several devices. An attacker may be operating using the specified user account, IP, or device to
      move laterally across the network and infect as many devices as possible with ransomware. The device involved in this
      alert is ''vnevado-win11t'' with AadDeviceId ''e5799261-6720-4297-961e-bd9ca4275033''. Additionally, a file named ''characterical.zip.lockbit''
      was identified. A connected alert also indicated a possible attempt to access the Primary Refresh Token (PRT) used to
      enable single sign-on (SSO) across applications on different devices.'
    question: 'Can you identify the AadDeviceId of the host in which suspicious file system changes, indicative of ransomware
      activity, were detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The user account `dp5hn` is potentially compromised and is exhibiting ransomware-like behavior.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: There was a possible attempt to access the Primary Refresh Token (PRT) on the host with HostName 
          `vnevado-win11u`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Ransomware behavior was detected on the host with AadDeviceId 
          `bc00e484-d0e5-4da4-9472-95568cccc07e`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
