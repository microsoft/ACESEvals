tasks:
- task_id: incident_5_legacy_train_set_task_22
  title: incident_5_legacy_train_set_task_22
  description: 'What was the name of the process involved in deleting all volume shadow copies during the system recovery
    tampering incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A system recovery tampering incident was observed on host `vnevado-win11t`. The incident involved the
      deletion of volume shadow copies, which compromises the system''s recovery capabilities by removing backup options.'
    question: 'What was the name of the process involved in deleting all volume shadow copies during the system recovery tampering
      incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vssblatemp.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was observed using the process `vssblatemp.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: System recovery settings were tampered using the process `vssblatemp.exe` with command line 
          `vssblatemp.exe delete shadows /all` on `2024-06-20t09:32:02.4640548z` with Process ID `1900`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
