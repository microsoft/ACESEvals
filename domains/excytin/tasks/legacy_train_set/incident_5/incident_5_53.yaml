tasks:
- task_id: incident_5_legacy_train_set_task_53
  title: incident_5_legacy_train_set_task_53
  description: 'What is the name of the file associated with the unknown malware detected on the host `vnevado-win11u`?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent security incident, ransomware behavior was detected on the host `vnevado-win11u` with
      AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`. This incident involved suspicious file system changes which are
      indicative of potential ransomware activity. Further investigation identified suspicious remote activity, and subsequent
      lateral movement to the jump server `Vnevado-jump` using PSExec. The host was later detected with unknown malware that
      was active, which Windows Defender might have blocked.'
    question: 'What is the name of the file associated with the unknown malware detected on the host `vnevado-win11u`?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious file system changes indicating potential ransomware activity were detected, involving a 
          host with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious remote activity was observed from IP address `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Lateral movement was detected with PSExec to the jump server, involving an account with SID 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: An unknown malware named `mimikatz.exe` was detected and was active on the host.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
