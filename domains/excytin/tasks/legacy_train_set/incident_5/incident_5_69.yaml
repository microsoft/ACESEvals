tasks:
- task_id: incident_5_legacy_train_set_task_69
  title: incident_5_legacy_train_set_task_69
  description: 'During the investigation of this incident, there was a possible attempt to access a Primary Refresh Token
    (PRT). Can you identify the AadDeviceId of the host involved in this end alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving suspicious WMI process creation was reported on the machine `vnevado-win11u`.
      This machine also saw multiple suspicious processes including `curl http://vectorsandarrows.com`, `vssblatemp.exe delete
      shadows /all`, and `get-userprttoken.ps1` on 2024-06-20. The incident is related to potential malware activity which
      might be using WMI to spawn new processes and further infect the machine.'
    question: 'During the investigation of this incident, there was a possible attempt to access a Primary Refresh Token (PRT).
      Can you identify the AadDeviceId of the host involved in this end alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e5799261-6720-4297-961e-bd9ca4275033'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e5799261-6720-4297-961e-bd9ca4275033'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious WMI process creation was observed involving the user with SID 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was a possible attempt to access the Primary Refresh Token (PRT) on the host with AadDeviceId
          `e5799261-6720-4297-961e-bd9ca4275033`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
