tasks:
- task_id: incident_5_legacy_train_set_task_56
  title: incident_5_legacy_train_set_task_56
  description: 'During the investigation of this security incident, the Mimikatz credential theft tool was detected. Can you
    provide the file name associated with this detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was reported involving system recovery setting tampering and possible attempts
      to access Primary Refresh Token (PRT). It was observed that the file `vssblatemp.exe` was executed on host `vnevado-win11t`
      with commands like `vssblatemp.exe delete shadows /all` and `bcdedit /set recoveryenabled no`. This suggests that adversaries
      might be trying to delete built-in operating system data and turn off recovery services. Subsequently, there were attempts
      to access the PRT on the same device.'
    question: 'During the investigation of this security incident, the Mimikatz credential theft tool was detected. Can you
      provide the file name associated with this detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimidrv.sys'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimidrv.sys'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: System recovery setting tampering was observed on a device by an account with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: There was a possible attempt to access Primary Refresh Token (PRT) by a process with 
          ExtractedFileName `browsercore.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: There was another possible attempt to access Primary Refresh Token (PRT) on a host with AadDeviceId
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: The Mimikatz credential theft tool was detected on the device, specifically the file `mimidrv.sys`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
