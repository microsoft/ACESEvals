  title: incident_5_legacy_train_set_task_35
  description: 'What is the file name of the Windows Sysinternals tool that was renamed and launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'In a security incident, there was a possible attempt to access Primary Refresh Token (PRT) detected
      on the host `vnevado-win10s`. The process `browsercore.exe` with Process ID 2676 was involved in this alert. This could
      potentially indicate an attack to move laterally or perform credential theft by accessing this key artifact of Azure
      AD authentication. Following this, a suspicious activity involved renaming and launching of a Windows Sysinternals tool.'
    question: 'What is the file name of the Windows Sysinternals tool that was renamed and launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A possible attempt to access the Primary Refresh Token (PRT) was detected using the process 
          `browsercore.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Another attempt to access the Primary Refresh Token (PRT) was detected using the process 
          `powershell.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A Windows Sysinternals tool, specifically `mimikatz.exe`, was renamed and launched, potentially 
          indicating a covert attempt to use the tool for malicious purposes.
