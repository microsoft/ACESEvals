tasks:
- task_id: incident_5_legacy_train_set_task_61
  title: incident_5_legacy_train_set_task_61
  description: 'Can you identify the IP address associated with the possible lateral movement observed in close proximity
    to the suspicious network event?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was reported where LSASS process memory was modified, indicating potential attempts
      to bypass security mechanisms or circumvent legitimate checks. During this investigation, Mimikatz.exe was found running
      multiple commands involving privilege escalation and lateral movement, particularly targeting ''vnevado-jump''. Subsequently,
      there were alerts indicating ransomware payloads being remotely launched and possible lateral movements detected across
      devices.'
    question: 'Can you identify the IP address associated with the possible lateral movement observed in close proximity to
      the suspicious network event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '38.142.109.10'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '38.142.109.10'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` was involved in modifying the 
          LSASS process memory.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: There was a lateral movement to the jump server indicated by the PSExec operation from IP address 
          `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: A ransomware payload was remotely launched on the host with AadDeviceId 
          `bc00e484-d0e5-4da4-9472-95568cccc07e`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: A possible lateral movement was observed involving the IP address `38.142.109.10`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
