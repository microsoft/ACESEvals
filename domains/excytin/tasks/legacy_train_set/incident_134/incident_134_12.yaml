tasks:
- task_id: incident_134_legacy_train_set_task_12
  title: incident_134_legacy_train_set_task_12
  description: 'During a password spray attack detected on 2024-07-18, which IP address was recognized in the end alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was discovered involving suspicious inbox manipulation where Nina Park''s inbox
      rules were altered, likely indicating an attacker had gained access to her inbox to manipulate rules for potential data
      exfiltration. Her user details are associated with email `Nina Park@vnevado.alpineskihouse.co`, AppId `20893`, and IP
      address `237.7.81.122`.'
    question: 'During a password spray attack detected on 2024-07-18, which IP address was recognized in the end alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` had their inbox rules manipulated in
          a suspicious manner.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A password spray attack was detected coming from IP address `170.54.121.63`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
