tasks:
- task_id: incident_134_legacy_train_set_task_14
  title: incident_134_legacy_train_set_task_14
  description: 'During the investigation, it was found that emails containing malicious URLs were delivered and later removed.
    Can you identify the primary address of the mailbox where these emails were delivered?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving Business Email Compromise (BEC) financial fraud was identified when a
      suspicious inbox rule that hides incoming email messages was created during a risky Azure Active Directory session.
      The incident involves an IP address `237.7.81.122`.'
    question: 'During the investigation, it was found that emails containing malicious URLs were delivered and later removed.
      Can you identify the primary address of the mailbox where these emails were delivered?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The email account `Nina Park` was involved in a suspicious activity where an inbox rule was created
          to hide incoming email messages, indicating potential BEC financial fraud.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The mailbox with the primary address `raphaelt@vnevado.alpineskihouse.co` received email messages 
          containing a malicious URL which were later removed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
