tasks:
- task_id: incident_134_legacy_train_set_task_10
  title: incident_134_legacy_train_set_task_10
  description: 'Following the incident of the malicious URL click, there was a subsequent account compromise. Can you identify
    the IP address from which the compromised account was accessed?'
  inherit_shared: true
  initial_context:
    incident_context: ''
    question: 'Following the incident of the malicious URL click, there was a subsequent account compromise. Can you identify
      the IP address from which the compromised account was accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The email account `Nina Park@vnevado.alpineskihouse.co` clicked on a link found to be malicious.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A compromised account was detected with an unusual sign-in from IP address `170.54.121.63` 
          following a password-spray attack.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
