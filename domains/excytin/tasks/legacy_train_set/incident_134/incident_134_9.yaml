tasks:
- task_id: incident_134_legacy_train_set_task_9
  title: incident_134_legacy_train_set_task_9
  description: 'There was also a suspicious inbox manipulation rule associated with this incident. Can you identify the application
    ID of the cloud application involved in the inbox manipulation?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident flagged as business email compromise (BEC) fraud attempt indicated that suspicious
      emails were sent by a possibly compromised user account `raphaelt@vnevado.alpineskihouse.co` to `nathan@avoriaz.alpineskihouse.co`
      with a sender IP of `237.7.81.122`. As part of this incident, we are investigating the email activity to determine any
      malicious patterns. Additionally, a user''s inbox rules were manipulated in a suspicious manner, which might be part
      of the attacker''s attempt to exfiltrate data.'
    question: 'There was also a suspicious inbox manipulation rule associated with this incident. Can you identify the application
      ID of the cloud application involved in the inbox manipulation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There were suspicious emails sent by a possibly compromised user account from the IP address 
          `237.7.81.122` related to an ongoing BEC fraud attempt.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A user's inbox rules were manipulated suspiciously on the cloud application with AppId `20893`, 
          indicating possible attacker access and data exfiltration efforts.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
