tasks:
- task_id: incident_134_legacy_train_set_task_7
  title: incident_134_legacy_train_set_task_7
  description: 'Can you identify the malicious URL that was included in the email messages which were later removed after
    delivery?'
  inherit_shared: true
  initial_context:
    incident_context: ''
    question: 'Can you identify the malicious URL that was included in the email messages which were later removed after delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` had their inbox rules 
          manipulated suspiciously, suggesting possible unauthorized access.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An email containing the malicious URL 
          `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/` was delivered and later removed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
