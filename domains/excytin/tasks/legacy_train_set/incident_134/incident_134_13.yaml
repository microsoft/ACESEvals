tasks:
- task_id: incident_134_legacy_train_set_task_13
  title: incident_134_legacy_train_set_task_13
  description: 'Shortly after the emails were sent, there was a sign-in from a known malicious IP address. What is the address
    of this malicious IP?'
  inherit_shared: true
  initial_context:
    incident_context: 'There was a security incident involving suspicious emails sent by a possibly compromised user account
      as part of a BEC (business email compromise) fraud attempt. One of the associated users was `Nina Park` with the email
      `Nina Park@vnevado.alpineskihouse.co`. Suspicious emails were sent from this account using the IP address `237.7.81.122`.
      An alert was triggered based on a previous BEC-related alert.'
    question: 'Shortly after the emails were sent, there was a sign-in from a known malicious IP address. What is the address
      of this malicious IP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A potentially compromised user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` sent 
          suspicious emails related to a business email compromise (BEC) fraud attempt.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: There was a sign-in from a known malicious IP address `170.54.121.63` during or around the time of 
          the suspicious email activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
