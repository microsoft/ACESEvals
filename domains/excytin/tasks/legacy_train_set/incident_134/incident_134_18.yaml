tasks:
- task_id: incident_134_legacy_train_set_task_18
  title: incident_134_legacy_train_set_task_18
  description: 'Who was the owner of the account involved in the second alert where email messages containing malicious URLs
    were removed after delivery?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 17, 2024, there were two security alerts. The first alert, occurring at 11:01:27, was related
      to a sign-in from an anonymous IP address 170.54.121.63. The second alert, triggered at 11:04:19, involved the removal
      of email messages containing a malicious URL that had been delivered.'
    question: 'Who was the owner of the account involved in the second alert where email messages containing malicious URLs
      were removed after delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` signed in from an anonymous IP 
          address.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The email account `Nina Park` received an email with a malicious URL that was later removed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
