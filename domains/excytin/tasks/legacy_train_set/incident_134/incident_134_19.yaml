tasks:
- task_id: incident_134_legacy_train_set_task_19
  title: incident_134_legacy_train_set_task_19
  description: 'Can you identify the IP address associated with the suspicious login activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident indicating that an account belonging to Nina Park (Email: Nina Park@vnevado.alpineskihouse.co)
      with the SID S-1-5-21-1874151667-3554330288-105586563-1715 and AadUserId e036dee7-fa23-42ef-a019-468c8d3401f1, was potentially
      compromised following a password-spray attack. The user was signed in from an unusual location and browser. This incident
      suggests an attacker might have accessed the network using this compromised account, posing serious security risks.'
    question: 'Can you identify the IP address associated with the suspicious login activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: A user account was compromised from an unusual location and browser during a password spray attack 
          originating from IP address `170.54.121.63`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
