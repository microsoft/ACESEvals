tasks:
- task_id: incident_134_legacy_train_set_task_6
  title: incident_134_legacy_train_set_task_6
  description: 'Can you identify the cloud application ID involved in the suspicious inbox manipulation rule incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'The incident started with BEC financial fraud and extended to a suspicious inbox manipulation rule,
      suggesting an attacker might have gained access to a user''s inbox for malicious purposes.'
    question: 'Can you identify the cloud application ID involved in the suspicious inbox manipulation rule incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: There was a creation of a suspicious inbox rule in the email account `Nina 
          Park@vnevado.alpineskihouse.co` during a risky Azure Active Directory session, indicating a potential business
          email compromise (BEC) attempt.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious manipulation of inbox rules was detected in cloud application with AppId `20893`, 
          hinting at possible unauthorized access and data exfiltration.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
