tasks:
- task_id: incident_134_legacy_train_set_task_2
  title: incident_134_legacy_train_set_task_2
  description: 'In relation to the detected potentially malicious URL click, who was the recipient of the malicious email
    message?'
  inherit_shared: true
  initial_context:
    incident_context: 'A sign-in was detected from an anonymous IP address `170.54.121.63` (e.g., Tor browser or anonymizer
      VPNs). This is part of a broader multi-stage security incident where a user account was involved.'
    question: 'In relation to the detected potentially malicious URL click, who was the recipient of the malicious email message?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` signed in from an anonymous IP 
          address.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The mail recipient `raphaelt@vnevado.alpineskihouse.co` clicked on a malicious URL.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
