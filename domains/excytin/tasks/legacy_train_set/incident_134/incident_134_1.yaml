tasks:
- task_id: incident_134_legacy_train_set_task_1
  title: incident_134_legacy_train_set_task_1
  description: 'Can you identify the URL that was detected as potentially malicious according to the recent alert?'
  inherit_shared: true
  initial_context:
    incident_context: '{ "security_report": { "incident_name": "Email messages containing malicious URL removed after delivery",
      "incident_description": "Emails with malicious URL that were delivered and later removed", "sent_from": "alyssat@vnevado.alpineskihouse.co",
      "sent_to": "raphaelt@vnevado.alpineskihouse.co", "connected_account": "Nina Park", "malicious_url": "https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io"
      } }'
    question: 'Can you identify the URL that was detected as potentially malicious according to the recent alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The email account `Nina Park@vnevado.alpineskihouse.co` received an email with a malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A user clicked on the malicious URL 
          `http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
