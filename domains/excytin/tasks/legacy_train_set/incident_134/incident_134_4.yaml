tasks:
- task_id: incident_134_legacy_train_set_task_4
  title: incident_134_legacy_train_set_task_4
  description: 'Can you identify the AAD user ID associated with the suspicious sign-in from the anonymous IP address `170.54.121.63`?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert was triggered for a sign-in from an anonymous IP address (e.g. Tor browser, anonymizer VPNs)
      with IP address `170.54.121.63`. This may indicate a potential security risk or unauthorized access attempt.'
    question: 'Can you identify the AAD user ID associated with the suspicious sign-in from the anonymous IP address `170.54.121.63`?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e036dee7-fa23-42ef-a019-468c8d3401f1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e036dee7-fa23-42ef-a019-468c8d3401f1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: There was a sign-in from an anonymous IP address by the user with AadUserId 
          `e036dee7-fa23-42ef-a019-468c8d3401f1`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
