tasks:
- task_id: incident_322_legacy_train_set_task_15
  title: incident_322_legacy_train_set_task_15
  description: 'What tool is reported being used to collect Active Directory information in this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious credential dump from NTDS.dit occurred on host `vnevado-dc`, potentially indicating an
      attempt to obtain user''s credentials stored in the domain controller. The process identifier was associated with the
      file `powershell.exe`. Attackers often use this in conjunction with other tools to gather information or persist in
      their access.'
    question: 'What tool is reported being used to collect Active Directory information in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ntdsutil.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attacker used `ntdsutil.exe` to dump NTDS.dit, which could be used to obtain user credentials 
          from the domain controller.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The same `ntdsutil.exe` process was used to collect Active Directory information, which may help 
          attackers in persistence or lateral movement within the network.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
