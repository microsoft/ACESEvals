tasks:
- task_id: incident_322_legacy_train_set_task_18
  title: incident_322_legacy_train_set_task_18
  description: 'Can you provide the URL that was clicked on the device as part of this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'We detected that a user clicked on a malicious URL and several emails with the malicious URL were delivered
      and later removed. One user whose email was impacted is `alyssat@vnevado.alpineskihouse.co`. As part of this investigation,
      it was found that a malicious URL was clicked on a device involved in this incident.'
    question: 'Can you provide the URL that was clicked on the device as part of this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The email account `alyssat@vnevado.alpineskihouse.co` received an email with a potentially 
          malicious URL and clicked on it.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The email account `Hailey Johnson` received an email with a malicious URL which was later removed.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A malicious URL `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/` was clicked 
          on a device.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
