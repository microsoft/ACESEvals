tasks:
- task_id: incident_322_legacy_train_set_task_9
  title: incident_322_legacy_train_set_task_9
  description: 'Can you find the email of the user who was associated with the suspicious Azure Resource Manager operation?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious Azure Resource Manager operation was detected on 2024-08-01 from the host ''vnevado-dc''.
      The resource management operation originated from an IP address associated with proxy services (IP: 253.1.244.215).
      The resource involved was part of the ''ctfcat'' resource group under the subscription id ''7e838342-601f-4552-9baf-0dfb300cf555''.
      This operation is potentially malicious as attackers often use proxy services to conceal their source IP.'
    question: 'Can you find the email of the user who was associated with the suspicious Azure Resource Manager operation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Hailey Johnson@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Hailey Johnson@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: There is a suspicious Azure Resource Manager operation from a proxy IP address associated with the 
          email account `Hailey Johnson@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
