tasks:
- task_id: incident_322_legacy_train_set_task_4
  title: incident_322_legacy_train_set_task_4
  description: 'Can you identify the Azure resource that was involved in the suspicious operation from the proxy IP address?'
  inherit_shared: true
  initial_context:
    incident_context: 'We observed a recent security incident involving a user clicking on a potentially malicious URL. This
      was followed by the removal of email messages containing the malicious URL after delivery. As part of the incident investigation,
      it was detected that a resource management operation was performed from a suspicious IP address through a proxy service
      by using the Azure Resource Manager.'
    question: 'Can you identify the Azure resource that was involved in the suspicious operation from the proxy IP address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.compute/virtualmachines/vnevado-dc'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.compute/virtualmachines/vnevado-dc'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The email account `alyssat@vnevado.alpineskihouse.co` clicked on a potentially malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The email account `Hailey Johnson` received an email with a malicious URL that was later removed.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: There was an Azure Resource Manager operation from a suspicious proxy IP address involving the 
          resource with ResourceId 
          `/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.compute/virtualmachines/vnevado-dc`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
