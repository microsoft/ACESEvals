tasks:
- task_id: incident_322_legacy_train_set_task_10
  title: incident_322_legacy_train_set_task_10
  description: 'During the investigation, we found that attackers might be using Ntdsutil to gather information for persistence
    or lateral movement. What was the name of the extracted file used in this process?'
  inherit_shared: true
  initial_context:
    incident_context: ''
    question: 'During the investigation, we found that attackers might be using Ntdsutil to gather information for persistence
      or lateral movement. What was the name of the extracted file used in this process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The email account `Hailey Johnson@vnevado.alpineskihouse.co` received and then had an email with a 
          malicious URL removed.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: There was a suspicious Azure Resource Manager operation detected from a host with the name 
          `vnevado-dc`, originating from a proxy IP address.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The attacker used `ntdsutil` to collect Active Directory information through the process 
          `powershell.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
