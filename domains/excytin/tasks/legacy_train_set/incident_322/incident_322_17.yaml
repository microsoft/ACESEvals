tasks:
- task_id: incident_322_legacy_train_set_task_17
  title: incident_322_legacy_train_set_task_17
  description: 'What is the primary mailbox address associated with the email message containing the malicious URL that was
    removed?'
  inherit_shared: true
  initial_context:
    incident_context: 'A user clicked on a link in an email `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`
      which was later quarantined by zero-hour auto purge (ZAP). This alert was triggered based on a Microsoft Defender for
      Office 365 alert.'
    question: 'What is the primary mailbox address associated with the email message containing the malicious URL that was
      removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user `Hailey Johnson@vnevado.alpineskihouse.co` accessed a link in an email that was later 
          quarantined by ZAP.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The mailbox with the primary address `alyssat@vnevado.alpineskihouse.co` received an email 
          containing a malicious URL, which was subsequently removed after delivery.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
