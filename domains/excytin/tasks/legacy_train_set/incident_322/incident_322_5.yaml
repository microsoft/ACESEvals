tasks:
- task_id: incident_322_legacy_train_set_task_5
  title: incident_322_legacy_train_set_task_5
  description: 'As part of our investigation, we also discovered that attackers might be using a certain process to gather
    information for persistence or lateral movement in the network. Can you identify the file name of the process that was
    used in this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent security investigation, we identified multiple suspicious activities involving various
      endpoints and alerts. Initially, a connection from IP `231.60.52.209` - `vnevado-win11h.vnevado.alpineskihouse.co` to
      a malicious URL `login.micro.demo.antoinetest.ovh` was detected in proxy logs. This raised concerns about potential
      unauthorized access or malicious activities on the affected system.'
    question: 'As part of our investigation, we also discovered that attackers might be using a certain process to gather
      information for persistence or lateral movement in the network. Can you identify the file name of the process that was
      used in this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ntdsutil.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A malicious URL was detected in proxy logs from the host `vnevado-win11h` with the IP address 
          `231.60.52.209` connecting to `login.micro.demo.antoinetest.ovh`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A malicious URL was clicked by the user account `Hailey Johnson`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: There was an Azure Resource Manager operation from a suspicious proxy IP address linked to the host
          `vnevado-dc`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: The attacker used `ntdsutil.exe` to gather Active Directory information.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
