tasks:
- task_id: incident_322_legacy_train_set_task_14
  title: incident_322_legacy_train_set_task_14
  description: 'Related to this malicious URL, an email message containing it was delivered and later removed. Can you identify
    the sender of this email?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving a suspicious click on a malicious URL, `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`,
      was reported. The click was made on the device named `vnevado-win11h` with the IP `172.33.118.200`. This activity involved
      the executable `msedge.exe` with a specific process ID `4256` created at the given time.'
    question: 'Related to this malicious URL, an email message containing it was delivered and later removed. Can you identify
      the sender of this email?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The email account `raphaelt@vnevado.alpineskihouse.co` sent an email with a malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The user `Hailey Johnson` clicked on the malicious URL.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
