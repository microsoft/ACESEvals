  description: 'What was the URL the user accessed in the email that was subsequently quarantined by ZAP?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent security incident involved multiple stages and suspicious activities. Initially, there was
      a suspicious credential dump from NTDS.dit indicating attackers attempting to obtain user credentials stored in the
      domain controller. This was followed by a resource management operation detected from a proxy IP address by Microsoft
      Defender for Resource Manager. Finally, it was noted that a user accessed a link in an email which was subsequently
      quarantined by zero-hour auto purge (ZAP) feature based on a Microsoft Defender for Office 365 alert.'
    question: 'What was the URL the user accessed in the email that was subsequently quarantined by ZAP?'
