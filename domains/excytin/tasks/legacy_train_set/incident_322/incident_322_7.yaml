      were sent from `raphaelt@vnevado.alpineskihouse.co` to `alyssat@vnevado.alpineskihouse.co`. The URL was subsequently
      clicked on a device, triggering a related alert.'
    question: 'In the latest proxy logs, what IP address is shown connecting to `login.micro.demo.antoinetest.ovh`?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '231.60.52.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '231.60.52.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The email account with SID `S-1-5-21-1840151686-3534835288-156286563-1127` received an email with a
          malicious URL which was later removed.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
