tasks:
- task_id: incident_34_latest_train_set_task_20
  title: incident_34_latest_train_set_task_20
  description: 'According to the "Anomaly detected in ASEP registry" alert that immediately followed the manual investigation,
    what is the Azure AD user ID (AadUserId) associated with the account involved in this anomaly?'
  inherit_shared: true
  initial_context:
    incident_context: 'An automated investigation was manually initiated on the workstation vnevado-win10e (device ID 02b8f519-1123-4228-b32a-ccb78af3449f).
      Just a second after the investigation began, a separate alert reported that a process had added a suspicious persistence
      entry in the ASEP registry on the same device, suggesting an attacker might be trying to survive a reboot.'
    question: 'According to the "Anomaly detected in ASEP registry" alert that immediately followed the manual investigation,
      what is the Azure AD user ID (AadUserId) associated with the account involved in this anomaly?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '16320fec-8d90-403b-b7fe-78f715d4728d'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '16320fec-8d90-403b-b7fe-78f715d4728d'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A manual automated investigation was initiated on the host with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: During the investigation, an ASEP-registry anomaly was detected and attributed to the account with 
          AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
