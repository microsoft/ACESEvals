tasks:
- task_id: incident_34_latest_train_set_task_2
  title: incident_34_latest_train_set_task_2
  description: 'Which executable was responsible for creating the anomalous scheduled task detected at 22:35:01 UTC on 2024-07-04?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that the document ‘rs4_winatp-intro-invoice.docm’ was opened with
      the process `winword.exe` (Process ID 9780) on 2024-07-04 at 22:35 UTC. Immediately afterward, this Word session executed
      a suspicious PowerShell command to download or run encoded content, an activity frequently leveraged by attackers for
      in-memory execution. A few seconds later, security telemetry reported that a new and anomalous scheduled task was created
      on the same host—often a sign of an attempt to establish persistence.'
    question: 'Which executable was responsible for creating the anomalous scheduled task detected at 22:35:01 UTC on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'schtasks.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious PowerShell download or encoded command execution was performed by the account with Sid 
          `S-1-5-21-1870156660-7534030218-135086563-1193`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Just prior to that, an anomalous scheduled task was created via the process with ExtractedFileName 
          `schtasks.exe`, indicating a likely attempt at persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
