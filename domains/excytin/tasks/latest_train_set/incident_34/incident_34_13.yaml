tasks:
- task_id: incident_34_latest_train_set_task_13
  title: incident_34_latest_train_set_task_13
  description: 'According to the related "Suspicious PowerShell download or encoded command execution" alert that followed,
    what is the name of the executable file that PowerShell ultimately launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed a suspicious LDAP query on 2024-07-04 that originated from the
      process "winword.exe" (launched from c:\scripts\rs4_winatp-intro-invoice.docm). This activity suggests the attacker
      might have been performing reconnaissance to learn about privileged users or assets. Shortly before this LDAP-related
      event, another alert in the same incident indicated that PowerShell was used to download or run a payload on the device.'
    question: 'According to the related "Suspicious PowerShell download or encoded command execution" alert that followed,
      what is the name of the executable file that PowerShell ultimately launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A PowerShell process downloaded or executed the file with ExtractedFileName 
          `winatp-intro-backdoor.exe` at 2024-07-04 22:35:01.807662+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Immediately after, the account with Name `samuelf` issued a suspicious LDAP query at 2024-07-04 
          22:35:02.608830+00:00, indicating reconnaissance activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
