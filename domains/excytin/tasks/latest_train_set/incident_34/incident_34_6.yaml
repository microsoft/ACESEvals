tasks:
- task_id: incident_34_latest_train_set_task_6
  title: incident_34_latest_train_set_task_6
  description: 'On which host was the automated investigation initiated by user u141 according to the follow-up alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security incident on July 4th, 2024, a suspicious PowerShell command was executed by the process
      "powershell.exe" under the user account "samuelf". The command attempted to write a back-door executable ("winatp-intro-backdoor.exe")
      to the system and schedule it for execution. A few seconds later, another alert reported that user u141 (u141@ash.alpineskihouse.co)
      manually kicked off an automated investigation on a particular Windows 10 endpoint to review and remediate related threat
      artifacts.'
    question: 'On which host was the automated investigation initiated by user u141 according to the follow-up alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An alert reported that a suspicious process executed a PowerShell command on host with HostName 
          `vnevado-win10e`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly afterward, user u141 manually started an automated investigation on the same host with 
          HostName `vnevado-win10e`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
