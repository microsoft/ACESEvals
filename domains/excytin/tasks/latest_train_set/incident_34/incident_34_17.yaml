tasks:
- task_id: incident_34_latest_train_set_task_17
  title: incident_34_latest_train_set_task_17
  description: 'According to the alert stating that analyst u141 manually started an Automated investigation, what is the
    hostname of the device that was investigated?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an incident involving a suspicious PowerShell script executed by user ''samuelf'', an analyst
      manually initiated an Automated investigation targeting the affected device.'
    question: 'According to the alert stating that analyst u141 manually started an Automated investigation, what is the hostname
      of the device that was investigated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Alert indicates a suspicious PowerShell download or encoded command execution on host (HostName: `vnevado-win10e`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A user manually initiated an automated investigation on the same host (HostName: `vnevado-win10e`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
