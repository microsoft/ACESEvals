tasks:
- task_id: incident_34_latest_train_set_task_10
  title: incident_34_latest_train_set_task_10
  description: 'In the follow-up alert titled "Suspicious Task Scheduler activity", what was the process ID of the instance
    of "schtasks.exe" that tried to run the task "yrei"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we saw that on host "vnevado-win10e" a suspicious task named "yrei" was created
      via Task Scheduler by user "samuelf" (through a chain that began with PowerShell and dropped the file "winatp-intro-backdoor.exe").
      This creation triggered the alert "An anomalous scheduled task was created", highlighting a likely persistence attempt.'
    question: 'In the follow-up alert titled "Suspicious Task Scheduler activity", what was the process ID of the instance
      of "schtasks.exe" that tried to run the task "yrei"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1616'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '1616'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The attacker created an anomalous scheduled task using process field ExtractedFileName with value 
          `schtasks.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, the attacker executed the task via Task Scheduler, as shown by process field 
          ProcessId__CreatedTimeUtc__CommandLine with value `1616__2024-06-26t12:00:40.6793914z__"schtasks.exe" /run /tn
          yrei`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
