tasks:
- task_id: incident_34_latest_train_set_task_3
  title: incident_34_latest_train_set_task_3
  description: 'According to the “Suspicious Task Scheduler activity” alert raised at 2024-07-04 22:35:01 UTC, which executable
    was used to run the scheduled task named "yrei"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, analysts observed that on host vnevado-win10e (device ID 02b8f519-1123-4228-b32a-ccb78af3449f)
      a suspicious PowerShell command was executed by user account ‘samuelf’. Just one second later, another alert titled
      “Suspicious Task Scheduler activity” was generated, indicating that the same workflow attempted to launch a scheduled
      task named “yrei” – a common tactic to achieve persistence.'
    question: 'According to the “Suspicious Task Scheduler activity” alert raised at 2024-07-04 22:35:01 UTC, which executable
      was used to run the scheduled task named "yrei"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'schtasks.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Account (AadUserId: `16320fec-8d90-403b-b7fe-78f715d4728d`) executed a suspicious PowerShell command.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Process (ProcessId: `1616`, CreatedTimeUtc: `2024-06-26t12:00:40.6793914z`, CommandLine: `"schtasks.exe"
          /run /tn yrei`) used Task Scheduler, indicating possible persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
