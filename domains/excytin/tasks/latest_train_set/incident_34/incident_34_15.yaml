tasks:
- task_id: incident_34_latest_train_set_task_15
  title: incident_34_latest_train_set_task_15
  description: 'Which executable (process file name) was responsible for running the suspicious LDAP query detected right
    after the malicious PowerShell activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed a process launching PowerShell with a long, base-64–encoded command
      that wrote a file named ''winatp-intro-backdoor.exe'' to the user’s Desktop and created a scheduled task called ''yrei''
      to run it. This activity triggered the alert titled "Suspicious PowerShell download or encoded command execution" on
      2024-07-04 at 22:35 UTC. Just one second later, a second alert—"Suspicious LDAP query"—was raised on the same device,
      suggesting the attacker began reconnaissance against the domain controller.'
    question: 'Which executable (process file name) was responsible for running the suspicious LDAP query detected right after
      the malicious PowerShell activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winword.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An account with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` executed PowerShell to download a 
          file or run an encoded command.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, the process with ExtractedFileName `winword.exe` performed a suspicious LDAP query, 
          suggesting reconnaissance activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
