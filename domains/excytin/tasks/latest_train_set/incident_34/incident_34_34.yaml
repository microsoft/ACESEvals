tasks:
- task_id: incident_34_latest_train_set_task_34
  title: incident_34_latest_train_set_task_34
  description: 'What is the hostname of the machine on which the analyst manually started the automated investigation?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, the user account "samuelf" (SID S-1-5-21-1870156660-7534030218-135086563-1193)
      executed the file "winatp-intro-backdoor.exe" from a RunOnce registry location, which raised the alert "Anomaly detected
      in ASEP registry." To follow up, a security analyst manually kicked off an automated investigation on the same machine
      in order to collect and remediate any additional artifacts.'
    question: 'What is the hostname of the machine on which the analyst manually started the automated investigation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10e'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An automated investigation was manually initiated on the host (HostName: `vnevado-win10e`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, the investigation detected a suspicious Auto-Start Extensibility Point registry entry
          on the same device (AadDeviceId: `02b8f519-1123-4228-b32a-ccb78af3449f`), indicating potential persistence via the
          ASEP registry.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
