tasks:
- task_id: incident_34_latest_train_set_task_12
  title: incident_34_latest_train_set_task_12
  description: 'Identify the Azure AD user ID (AadUserId) of the account that ultimately executed the suspicious PowerShell
    command according to the related “Suspicious process executed PowerShell command” alert.'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a recent incident, we observed a series of process-related activities on
      an endpoint. First, `winword.exe` opened a macro-enabled document (`rs4_winatp-intro-invoice.docm`). Shortly afterward,
      `schtasks.exe` was used both to create and run a one-time task that launched a file named `winatp-intro-backdoor.exe`.
      Around the same timeframe (22:35 UTC on 2024-07-04) Microsoft Defender raised an alert titled “Suspicious PowerShell
      command line,” indicating that PowerShell was likely invoked for potentially malicious actions. The alert is associated
      with an Azure AD account, but its identifier was not immediately visible in the initial telemetry.'
    question: 'Identify the Azure AD user ID (AadUserId) of the account that ultimately executed the suspicious PowerShell
      command according to the related “Suspicious process executed PowerShell command” alert.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '16320fec-8d90-403b-b7fe-78f715d4728d'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '16320fec-8d90-403b-b7fe-78f715d4728d'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – account.AadUserId: `16320fec-8d90-403b-b7fe-78f715d4728d` executed a PowerShell command through
          a suspicious process at 2024-07-04 22:35:00.698 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – account.AadUserId: `16320fec-8d90-403b-b7fe-78f715d4728d` was then seen running another suspicious
          PowerShell command line at 2024-07-04 22:35:01.006 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
