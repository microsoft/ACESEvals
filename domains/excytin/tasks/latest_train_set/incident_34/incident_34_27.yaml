tasks:
- task_id: incident_34_latest_train_set_task_27
  title: incident_34_latest_train_set_task_27
  description: 'Around the same time as the suspicious scheduled task was created, another alert reported that a process had
    registered a malicious command in an Auto-Start Extension Point (ASEP) registry key. Which external IP address is associated
    with this ASEP registry anomaly?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a recent security incident, we observed that an attacker used PowerShell
      (`powershell.exe`) to drop a file named `winatp-intro-backdoor.exe` onto the desktop of user **SamuelF** and then created
      a one-time scheduled task (`schtasks.exe`) called `yrei` to run that file. This activity was captured in the alert titled
      “An anomalous scheduled task was created,” indicating a likely attempt at establishing persistence on the affected endpoint.'
    question: 'Around the same time as the suspicious scheduled task was created, another alert reported that a process had
      registered a malicious command in an Auto-Start Extension Point (ASEP) registry key. Which external IP address is associated
      with this ASEP registry anomaly?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An anomalous scheduled task was created on the host with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`, suggesting a potential attempt to establish persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A process registered a suspicious command in an ASEP registry key that contacts the IP address 
          `72.5.72.208`, indicating a possible remote-controlled persistence mechanism.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
