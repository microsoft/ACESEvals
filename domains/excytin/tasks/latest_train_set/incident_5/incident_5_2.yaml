tasks:
- task_id: incident_5_latest_train_set_task_2
  title: incident_5_latest_train_set_task_2
  description: 'What was the name of the renamed executable that Defender detected being launched as a Windows Sysinternals
    tool on vnevado-win10s?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4th 2024, Defender raised an alert indicating that “CommandAndControl” malware was detected
      during suspected lateral movement on host vnevado-win10s. The activity was tied to account dp5hn (SID S-1-5-21-1840191660-8534830288-125585561-1522)
      and a process (PID 6460) that executed a curl command to an external domain. Just seconds later, another alert reported
      that a Windows Sysinternals tool on the same device had been renamed and run – a common tactic to hide offensive security
      utilities.'
    question: 'What was the name of the renamed executable that Defender detected being launched as a Windows Sysinternals
      tool on vnevado-win10s?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:00.619840+00:00 a Possible attempt to access a Primary Refresh Token (PRT) was 
          detected involving the account with Sid `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Seconds later, at 2024-07-04 22:35:00.967905+00:00, another PRT-access attempt was observed coming 
          from the process whose ExtractedFileName is `browsercore.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Immediately after, at 2024-07-04 22:35:01.592226+00:00, 'CommandAndControl' malware activity 
          suggesting lateral movement was reported for the account with Sid 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Finally, at 2024-07-04 22:35:02.452887+00:00, a Windows Sysinternals tool was found renamed and 
          executed as the file `mimikatz.exe`, indicating a likely attempt to harvest credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
