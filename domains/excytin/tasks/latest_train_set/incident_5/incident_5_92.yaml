tasks:
- task_id: incident_5_latest_train_set_task_92
  title: incident_5_latest_train_set_task_92
  description: 'According to the “Windows Sysinternals tool renamed” alert triggered at 22:35:02 UTC on July 4 2024, what
    external IP address was associated with this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024 at 22:35 UTC, the device identified by AadDeviceId bc00e484-d0e5-4da4-9472-95568cccc07e
      raised a “Suspicious remote activity” alert after several unusual commands were executed, including a renamed binary
      “vssblatemp.exe” and PowerShell scripts such as get-userprttoken.ps1. Just one second later, the same host generated
      another alert titled “Windows Sysinternals tool renamed,” indicating that an administrative utility had been copied
      under a different name and launched—an action often seen when attackers try to hide their tools.'
    question: 'According to the “Windows Sysinternals tool renamed” alert triggered at 22:35:02 UTC on July 4 2024, what external
      IP address was associated with this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Alert 'Suspicious remote activity' shows activity that originated from ip.Address `99.83.111.100`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Alert 'Windows Sysinternals tool renamed' indicates a renamed tool was executed from ip.Address 
          `107.224.99.179`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Alert 'PSExec to Vnevado-jump' confirms lateral movement to host.HostName `vnevado-win10v`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
