tasks:
- task_id: incident_5_latest_train_set_task_50
  title: incident_5_latest_train_set_task_50
  description: 'In the alert titled "Possible attempt to access Primary Refresh Token (PRT)", which executable was the process
    responsible for this suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a "CommandAndControl" malware detection on host vnevado-win10s (AadDeviceId
      f5b847aa-8712-4bf6-b4f7-ed6cd89e1505), we observed a curl command (process ID 6460) reaching out to vectorsandarrows.com
      on 2024-06-20 09:10:51 UTC. This activity suggests the attacker was attempting lateral movement. A related alert was
      raised shortly afterwards for a possible attempt to access a Primary Refresh Token (PRT), which could indicate credential-theft
      or further lateral-movement efforts.'
    question: 'In the alert titled "Possible attempt to access Primary Refresh Token (PRT)", which executable was the process
      responsible for this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'browsercore.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'browsercore.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: "A 'CommandAndControl' malware alert shows that the attacker was operating with the account (Field: Name)
          value `dp5hn`."
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, a PRT-access attempt was observed from the process (Field: ProcessId__CreatedTimeUtc__CommandLine)
          value `7036__2024-06-20t09:29:49.304018z__"browsercore.exe"`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
