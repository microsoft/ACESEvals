tasks:
- task_id: incident_5_latest_train_set_task_9
  title: incident_5_latest_train_set_task_9
  description: 'In the related alert that flagged ransomware-like behavior, investigators identified a specific file on the
    affected device. What is the name of that file?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, the endpoint vnevado-win10r (AadDeviceId: 9d4887ba-0b69-47d6-89bc-9b32787f379e)
      triggered a “Suspicious WMI process creation” alert. Several unusual commands were executed in quick succession, including
      deletion of VSS shadow copies (vssblatemp.exe delete shadows /all), modifications to boot configuration using bcdedit,
      and a PowerShell script (get-userprttoken.ps1) launched from C:\scripts. These activities suggest preparation steps
      often associated with ransomware attacks, and the incident is linked to a second alert reporting ransomware-like behavior
      across multiple devices.'
    question: 'In the related alert that flagged ransomware-like behavior, investigators identified a specific file on the
      affected device. What is the name of that file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'earlap.doc'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'earlap.doc'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious WMI process was created by the account with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Devices subsequently exhibited ransomware-like behavior associated with the file `earlap.doc`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
