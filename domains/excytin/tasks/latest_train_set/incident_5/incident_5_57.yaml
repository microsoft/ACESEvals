tasks:
- task_id: incident_5_latest_train_set_task_57
  title: incident_5_latest_train_set_task_57
  description: 'What is the URL that the malware tried to reach, as reported in the "Command and Control behavior was blocked"
    alert associated with this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we noted a "Suspicious remote activity" alert on a host (hostname redacted)
      where commands such as "vssblatemp.exe delete shadows /all" and PowerShell execution of "get-userprttoken.ps1" were
      launched within seconds of one another. Around the same time, Microsoft Defender raised a separate alert indicating
      that an active malware’s command-and-control traffic from this same machine had been blocked.'
    question: 'What is the URL that the malware tried to reach, as reported in the "Command and Control behavior was blocked"
      alert associated with this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attempted command-and-control connection to the URL `http://vectorsandarrows.com/` (Url field) 
          was detected and blocked.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, suspicious remote activity was observed on the host with HostName field value 
          `vnevado-win10s`, indicating possible follow-up actions on the compromised machine.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
