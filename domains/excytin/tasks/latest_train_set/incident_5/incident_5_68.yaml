tasks:
- task_id: incident_5_latest_train_set_task_68
  title: incident_5_latest_train_set_task_68
  description: 'According to the related "File backups were deleted" alert, what is the hostname of the machine where the
    snapshots and shadow copies were removed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we observed suspicious remote activity on host "vnevado-win11u" where several
      commands were executed in rapid succession, including disabling recovery options and deleting VSS shadow copies. This
      behavior often precedes or accompanies ransomware-style attacks. A related alert in the same incident reports that all
      file snapshots and shadow copies were deleted via WMI/VSSAdmin on a different machine.'
    question: 'According to the related "File backups were deleted" alert, what is the hostname of the machine where the snapshots
      and shadow copies were removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10r'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10r'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was detected from the account with Name `dp5hn`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Immediately afterwards, all file backups were deleted on the host with HostName `vnevado-win10r`, 
          indicating possible ransomware or destructive actions.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
