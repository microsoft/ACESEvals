tasks:
- task_id: incident_5_latest_train_set_task_75
  title: incident_5_latest_train_set_task_75
  description: 'During the "Possible lateral movement" alert that followed the LSASS access, which remote IP address was identified
    as the destination involved in that lateral movement?'
  inherit_shared: true
  initial_context:
    incident_context: 'Investigators are analyzing a sequence of alerts that began with "Suspicious access to LSASS service"
      after a Mimikatz execution was observed. The attacker appeared to elevate privileges on the original host, then attempted
      lateral movement. This activity was followed shortly by an alert titled "Possible lateral movement" that referenced
      a remote IP address suspected to be the destination of the attacker’s next step.'
    question: 'During the "Possible lateral movement" alert that followed the LSASS access, which remote IP address was identified
      as the destination involved in that lateral movement?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '38.142.109.10'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '38.142.109.10'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious credential dumping activity was detected when the account with Sid 
          `S-5-7-21-1843151660-3234030288-105586167-1422` accessed the LSASS service.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Immediately after, a ransomware payload was remotely launched on the device whose HostName is 
          `vnevado-win11u`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Close in time, possible lateral movement was observed involving the IP Address `38.142.109.10`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: A few days later, PSExec was used to connect to the jump server from the IP Address 
          `99.83.111.100`, indicating continued lateral movement.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
