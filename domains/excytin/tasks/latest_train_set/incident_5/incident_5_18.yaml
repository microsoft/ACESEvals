tasks:
- task_id: incident_5_latest_train_set_task_18
  title: incident_5_latest_train_set_task_18
  description: 'What is the name of the executable that was started in the suspicious WMI process creation which followed
    the PRT access attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a possible attempt to access a Primary Refresh Token (PRT) on host "vnevado-win10r",
      the process "browsercore.exe" (PID 1792) was observed executing on 2024-06-20 at 09:11 UTC. Just seconds after this
      PRT-related activity, the same machine generated a separate alert for a suspicious WMI-based process creation—an indicator
      often used by malware to break the normal process tree and persist on the system.'
    question: 'What is the name of the executable that was started in the suspicious WMI process creation which followed the
      PRT access attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vssblatemp.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Possible attempt to access a Primary Refresh Token (PRT) by the account with Sid 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious WMI process creation detected: Process with ProcessId `5512`, CreatedTimeUtc `2024-06-20t09:10:50.2899021z`,
          and CommandLine `vssblatemp.exe delete shadows /all`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
