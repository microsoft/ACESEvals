tasks:
- task_id: incident_5_latest_train_set_task_89
  title: incident_5_latest_train_set_task_89
  description: 'In the "Possible lateral movement" alert that followed these events, which IP address was identified as part
    of the lateral movement attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04, the endpoint named "vnevado-win10r" (device ID 9d4887ba-0b69-47d6-89bc-9b32787f379e)
      executed a suspicious command – `curl http://vectorsandarrows.com` – which was immediately blocked as command-and-control
      behaviour. Within seconds, Defender also raised a "Suspicious remote activity" alert, followed by a "Possible lateral
      movement" alert indicating that an attacker might be pivoting to another device on the network.'
    question: 'In the "Possible lateral movement" alert that followed these events, which IP address was identified as part
      of the lateral movement attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '83.162.58.168'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '83.162.58.168'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Command-and-control behavior was blocked for the account with Sid 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious remote activity was detected on host `vnevado-win11t`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Possible lateral movement was observed coming from IP address `83.162.58.168`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
