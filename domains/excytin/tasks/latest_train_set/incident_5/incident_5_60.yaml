tasks:
- task_id: incident_5_latest_train_set_task_60
  title: incident_5_latest_train_set_task_60
  description: 'Shortly before this PRT-related activity, Defender flagged a well-known credential-theft tool on the same
    device. According to that detection, what is the name of the malicious DLL associated with the tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at 22:35:01 UTC, a "Possible attempt to access Primary Refresh Token (PRT)" alert was
      raised for user account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522) on the workstation "vnevado-win10s".
      The activity involved the process "browsercore.exe" (PID 2676) and suggested that an attacker might be trying to obtain
      Azure AD tokens for lateral movement or credential theft.'
    question: 'Shortly before this PRT-related activity, Defender flagged a well-known credential-theft tool on the same device.
      According to that detection, what is the name of the malicious DLL associated with the tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious activity detected on device with AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, 
          indicating an attempt to access a Primary Refresh Token (PRT).
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The process `browsercore.exe` (ExtractedFileName = `browsercore.exe`) was involved in the 
          PRT-access attempt, suggesting it was used to try and steal authentication tokens.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The credential-theft file `mimilib.dll` (Name = `mimilib.dll`) associated with the Mimikatz tool 
          was also detected on the same device, confirming that an attacker is attempting to harvest credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
