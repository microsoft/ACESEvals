tasks:
- task_id: incident_5_latest_train_set_task_59
  title: incident_5_latest_train_set_task_59
  description: 'According to the final alert that reported a suspicious attempt to access the LSASS service’s memory, what
    is the name of the file implicated in that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a ransomware-related incident on host "vnevado-win11t" (device ID e5799261-6720-4297-961e-bd9ca4275033),
      analysts observed a series of suspicious events. The timeline starts with a "Ransomware behavior detected in the file
      system" alert, followed seconds later by two consecutive alerts warning about possible attempts to access a Primary
      Refresh Token (PRT). These findings indicate that the attacker may be attempting credential theft and lateral movement
      techniques immediately after the ransomware-like activity. Shortly thereafter, another alert was raised for a suspicious
      attempt to read the LSASS process memory—an activity commonly associated with harvesting clear-text credentials.'
    question: 'According to the final alert that reported a suspicious attempt to access the LSASS service’s memory, what
      is the name of the file implicated in that activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'hid.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'hid.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Host with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033` exhibited ransomware-like file-system 
          behavior.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Process with ExtractedFileName `browsercore.exe` was detected attempting to access a Primary 
          Refresh Token (PRT).
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Account with Name `tgs2z` was associated with the PRT-access attempt.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: File with Name `hid.dll` was involved in suspicious access to the LSASS service, indicating 
          possible credential theft.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
