tasks:
- task_id: incident_5_latest_train_set_task_61
  title: incident_5_latest_train_set_task_61
  description: 'According to the Mimikatz credential-theft alert raised during this incident, which specific file (DLL) was
    identified on the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into activity attributed to the Russia-based group Manatee Tempest, a device
      connected out to the domain vectorsandarrows.com from the external IP 198.43.121.209. Moments later, Defender flagged
      suspicious remote activity and recorded a PSExec-based lateral movement attempt toward a jump server. Around the same
      timeframe, Microsoft Defender generated an additional alert indicating that the Mimikatz credential-theft tool had been
      discovered on the compromised host.'
    question: 'According to the Mimikatz credential-theft alert raised during this incident, which specific file (DLL) was
      identified on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Actor Manatee Tempest is associated with the user account that has field AadUserId = 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious remote activity originated from the IP address with field Address = `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: The attacker then performed lateral movement via PSExec to the jump-server with field HostName = 
          `vnevado-win10v`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: On that host, the credential-theft component of Mimikatz with file field Name = `mimilib.dll` was 
          detected, confirming the attacker’s presence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
