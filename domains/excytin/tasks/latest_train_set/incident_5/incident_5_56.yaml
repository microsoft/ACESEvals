tasks:
- task_id: incident_5_latest_train_set_task_56
  title: incident_5_latest_train_set_task_56
  description: 'Identify the hostname of the device that generated the "Ransomware behavior detected in the file system" alert
    at 22:35:01 UTC on 2024-07-04.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that on 2024-07-04 at 22:35:01 UTC, a command-and-control (C2)
      attempt was blocked on host “vnevado-win10s” (device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505) after a process (PID 6460)
      executed a suspicious curl command to an external site. Just seconds later, a “Suspicious WMI process creation” alert
      was raised on another device in the same incident. Almost simultaneously, a separate alert reported possible ransomware-style
      file-system changes on a different endpoint within the environment.'
    question: 'Identify the hostname of the device that generated the "Ransomware behavior detected in the file system" alert
      at 22:35:01 UTC on 2024-07-04.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11t'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: '2024-07-04 22:35:01.785 – Alert “Command and Control behavior was blocked”: the activity is tied to
          the compromised user account (Field: AadUserId, Value: 731adb71-b11c-4bbf-850b-57989b350e96).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: '2024-07-04 22:35:03.378 – Alert “Suspicious WMI process creation”: that same activity is observed coming
          from the affected device (Field: AadDeviceId, Value: e5799261-6720-4297-961e-bd9ca4275033).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: '2024-07-04 22:35:01.737 – Alert “Ransomware behavior detected in the file system”: the malware actions
          are confirmed on the machine itself (Field: HostName, Value: vnevado-win11t).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
