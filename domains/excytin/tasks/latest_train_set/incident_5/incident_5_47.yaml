tasks:
- task_id: incident_5_latest_train_set_task_47
  title: incident_5_latest_train_set_task_47
  description: 'From the alert that reported "''CommandAndControl'' malware was detected during lateral movement", what is
    the Security Identifier (SID) of the account associated with that malicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert was raised after the execution of a known credential-theft tool (mimikatz.exe), indicating
      possible harvesting of user credentials on one of our endpoints. Shortly afterwards, additional alerts in the same incident
      signalled lateral-movement behaviour, including a PSExec connection to a jump server and then ransomware-style file-system
      activity. The sequence culminated in an alert titled "''CommandAndControl'' malware was detected during lateral movement,"
      suggesting the attacker successfully reached another device using a compromised account.'
    question: 'From the alert that reported "''CommandAndControl'' malware was detected during lateral movement", what is
      the Security Identifier (SID) of the account associated with that malicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840191660-8534830288-125585561-1522'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:01 UTC, a malicious credential-theft tool was executed by the account with 
          AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Two seconds later, at 2024-07-04 22:35:03 UTC, widespread file changes showing the ransomware 
          extension were performed by the account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Immediately afterward, still at 2024-07-04 22:35:03 UTC, ‘CommandAndControl’ malware activity 
          during lateral movement was observed under the account with Sid 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Several days later, on 2024-07-10 11:24:45 UTC, the attacker used PsExec for lateral movement to 
          the jump server from the source IP address `99.83.111.100`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
