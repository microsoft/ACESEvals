tasks:
- task_id: incident_5_latest_train_set_task_76
  title: incident_5_latest_train_set_task_76
  description: 'According to the subsequent alert titled "Suspicious remote activity" raised at 2024-07-04 22:35 UTC, what
    is the Azure AD user ID (AadUserId) associated with the account that initiated the remote activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security incident, analysts observed that PsExec was used to launch a
      command on a remote device on 2024-07-04 at 22:35 UTC. The command originated from IP address 107.224.99.179 and involved
      the execution of cmd.exe and notepad.exe. This behavior suggests possible lateral movement activity within the environment.'
    question: 'According to the subsequent alert titled "Suspicious remote activity" raised at 2024-07-04 22:35 UTC, what
      is the Azure AD user ID (AadUserId) associated with the account that initiated the remote activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '731adb71-b11c-4bbf-850b-57989b350e96'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '731adb71-b11c-4bbf-850b-57989b350e96'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: PsExec was used to run a command on the remote host with HostName `vnevado-win10v`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Further PsExec activity showed lateral movement to the jump server at IP Address `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: This remote activity is linked to the user account identified by AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
