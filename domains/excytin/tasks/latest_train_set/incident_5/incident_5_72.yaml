tasks:
- task_id: incident_5_latest_train_set_task_72
  title: incident_5_latest_train_set_task_72
  description: 'According to the follow-up alert that reported numerous files being appended with a known malicious extension,
    which user account was associated with this suspected ransomware activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent security incident flagged potential ransomware behavior on the workstation named "vnevado-win11t"
      (AadDeviceId: e5799261-6720-4297-961e-bd9ca4275033). The initial alert reported suspicious file-system modifications
      consistent with mass file encryption tactics often observed in ransomware attacks. Investigators are now reviewing subsequent
      alerts to identify the principal actor behind the follow-up activity.'
    question: 'According to the follow-up alert that reported numerous files being appended with a known malicious extension,
      which user account was associated with this suspected ransomware activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Ransomware-like file system behavior was detected on the device identified by HostName 
          `vnevado-win11t`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, mass file-extension changes linked to ransomware were observed under the account Name
          `dp5hn`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
