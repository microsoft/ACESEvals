tasks:
- task_id: incident_5_latest_train_set_task_53
  title: incident_5_latest_train_set_task_53
  description: 'According to the "''CommandAndControl'' malware was detected during lateral movement" alert raised right after
    the ransomware drop, what is the Azure AD device ID of the device where this malware was found?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security investigators are analyzing a recent alert titled "Possible compromised user account delivering
      ransomware-related files" that occurred on 2024-07-04. In this alert, a potentially compromised user account was seen
      distributing several ransomware-related files (for example, get-userprttoken.ps1, kiters.7z.lockbit, unstreaming.xlsx,
      and others) across multiple devices. One of the affected devices is identified by the Azure AD device ID bc00e484-d0e5-4da4-9472-95568cccc07e.
      Soon after, a second alert was triggered indicating that a ''CommandAndControl'' malware sample was detected on another
      device within the environment, suggesting lateral movement from the initial point of compromise.'
    question: 'According to the "''CommandAndControl'' malware was detected during lateral movement" alert raised right after
      the ransomware drop, what is the Azure AD device ID of the device where this malware was found?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'f5b847aa-8712-4bf6-b4f7-ed6cd89e1505'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'f5b847aa-8712-4bf6-b4f7-ed6cd89e1505'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Account (Sid: `S-1-5-21-1840191660-8534830288-125585561-1522`) was observed dropping ransomware-related
          files, indicating that the user account is likely compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: "Later, a host (AadDeviceId: `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`) was found running 'CommandAndControl'
          malware during lateral movement, showing that the threat actor pivoted to this device."
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
