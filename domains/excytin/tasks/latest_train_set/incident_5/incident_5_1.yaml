tasks:
- task_id: incident_5_latest_train_set_task_1
  title: incident_5_latest_train_set_task_1
  description: 'During the “Manatee Tempest activity group” alert, which IP address was identified as part of the threat actor’s
    activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'Microsoft Defender has raised a sequence of alerts starting with the detection of the Mimikatz credential-theft
      tool (e.g., "mimikatz.exe" launched from "cmd.exe" on 2024-06-20). Subsequent alerts showed lateral movement with PSExec
      to the jump server and signs of ransomware-like behavior across multiple devices. These events were later correlated
      to a high-profile threat actor alert titled “Manatee Tempest activity group,” linking the earlier credential theft and
      lateral movement to a known Russia-based cybercriminal group.'
    question: 'During the “Manatee Tempest activity group” alert, which IP address was identified as part of the threat actor’s
      activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Ransomware-like behavior was detected originating from the account field AadUserId with value 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: The Manatee Tempest threat actor was observed communicating from the ip field Address with value 
          `198.43.121.209`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: A credential-theft attempt was identified when the account field AadUserId with value 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` executed the Mimikatz tool.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Subsequently, lateral movement was attempted to the jump server using PSExec from the ip field 
          Address with value `99.83.111.100`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
