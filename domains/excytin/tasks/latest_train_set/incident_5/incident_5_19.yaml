tasks:
- task_id: incident_5_latest_train_set_task_19
  title: incident_5_latest_train_set_task_19
  description: 'According to the ransomware-related alert that followed the command-and-control detection, what is the external
    IP address involved in launching the ransomware payload on host "vnevado-win10s"?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring flagged a host named "vnevado-win10s" (device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505)
      after it executed the command "curl http://vectorsandarrows.com" under process ID 6460 on 2024-06-20 at 09:10 UTC. This
      activity triggered an alert titled "''CommandAndControl'' malware was detected during lateral movement," suggesting
      an attacker might be pivoting across the network. Shortly afterward, another alert indicated that a ransomware payload
      was remotely launched on the same device.'
    question: 'According to the ransomware-related alert that followed the command-and-control detection, what is the external
      IP address involved in launching the ransomware payload on host "vnevado-win10s"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '99.83.111.100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: "The 'CommandAndControl' malware was detected during lateral movement by the account (Field: Name) `dp5hn`
          at 2024-07-04 22:35:01.592226+00:00."
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Moments later, a ransomware payload was remotely launched from the IP (Field: Address) `99.83.111.100`
          at 2024-07-04 22:35:01.951341+00:00.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
