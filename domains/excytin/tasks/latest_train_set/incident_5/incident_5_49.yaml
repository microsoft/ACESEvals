tasks:
- task_id: incident_5_latest_train_set_task_49
  title: incident_5_latest_train_set_task_49
  description: 'During the "Possible attempt to access Primary Refresh Token (PRT)" alert, what was the external IP address
    from which the attempt originated?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security Center has raised an alert titled "Potentially compromised assets exhibiting ransomware-like
      behavior" for several devices in our environment. The incident involves suspicious files such as kiters.7z, syncretic.7z,
      and a PowerShell script named get-userprttoken.ps1 that were observed on the affected host. The activity is associated
      with the built-in SID S-0-6-5, often used by attackers after compromising a system. In addition to the ransomware-style
      encryption activity, telemetry shows a nearly simultaneous alert indicating a "Possible attempt to access Primary Refresh
      Token (PRT)"—a known technique to facilitate lateral movement and credential theft. Investigators need to identify the
      network origin of this PRT-access attempt to understand the adversary’s foothold and plan containment.'
    question: 'During the "Possible attempt to access Primary Refresh Token (PRT)" alert, what was the external IP address
      from which the attempt originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:00.619840+00:00, a possible attempt to access a Primary Refresh Token (PRT) was
          made from IP address `107.224.99.179` (Field: Address, Value: 107.224.99.179).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A few seconds later, at 2024-07-04 22:35:03.502972+00:00, devices communicating with IP address `99.83.111.100`
          (Field: Address, Value: 99.83.111.100) began to exhibit ransomware-like behavior, indicating the threat actor was
          able to progress in the attack.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Subsequently, on 2024-07-10 11:24:45.260113+00:00, the attacker used the account `tgs2z` (Field: Name,
          Value: tgs2z) to perform PSExec lateral movement to the jump server `Vnevado-jump`, showing further compromise and
          spread across the network.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
