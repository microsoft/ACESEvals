tasks:
- task_id: incident_5_latest_train_set_task_30
  title: incident_5_latest_train_set_task_30
  description: 'What is the file name of the DLL that was flagged when the Mimikatz credential theft tool was detected on
    the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'Incident review: On July 4 2024, the endpoint "vnevado-win11t" (AadDeviceId: e5799261-6720-4297-961e-bd9ca4275033)
      generated a "Suspicious remote activity" alert. The activity involved the local account "dp5hn" executing several commands,
      such as disabling recovery options with "bcdedit" and deleting volume-shadow copies via "vssblatemp.exe". These actions
      suggest an attempt to hinder system recovery and may precede additional malicious behavior like credential theft. Shortly
      after, another alert indicated that the well-known credential-dumping tool Mimikatz was found on the same machine.'
    question: 'What is the file name of the DLL that was flagged when the Mimikatz credential theft tool was detected on the
      device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity originated from the IP address with field Address=`99.83.111.100`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The attacker then performed lateral movement using PSExec to the jump-server whose host field 
          AadDeviceId=`4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: On that compromised device, the credential-theft component Mimikatz was identified via the file 
          field Name=`mimilib.dll`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
