tasks:
- task_id: incident_5_latest_train_set_task_81
  title: incident_5_latest_train_set_task_81
  description: 'According to the follow-up alert “Ransomware payload remotely launched” raised at 22:35:03 UTC on July 4 2024,
    which user account was recorded as executing the ransomware payload?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024 at 22:35:01 UTC, a security alert titled “PsExec launched a command on a remote device”
      was raised. It indicated that PsExec had been used from the public IP address 107.224.99.179 to run several commands
      (for example, “cmd.exe” and “notepad.exe”) against the jump-server host vnevado-jump, suggesting possible lateral-movement
      activity. Investigators suspect this initial PsExec activity is linked to a subsequent event in which a ransomware payload
      was remotely executed only two seconds later on the same device.'
    question: 'According to the follow-up alert “Ransomware payload remotely launched” raised at 22:35:03 UTC on July 4 2024,
      which user account was recorded as executing the ransomware payload?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An attacker using the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` executed PsExec
          to run a command on a remote device (2024-07-04 22:35:01 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Seconds later, the ransomware payload was remotely launched under the account Name `dp5hn`, 
          indicating the same attacker is attempting to encrypt data on the target device (2024-07-04 22:35:03 UTC).
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A few days later the activity continued from IP Address `99.83.111.100`, where PsExec was used 
          again to laterally move to the jump server `Vnevado-jump` (2024-07-10 11:24:45 UTC).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
