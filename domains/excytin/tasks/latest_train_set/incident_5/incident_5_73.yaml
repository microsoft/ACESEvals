tasks:
- task_id: incident_5_latest_train_set_task_73
  title: incident_5_latest_train_set_task_73
  description: 'In the Manatee Tempest alert correlated with this incident, which suspicious domain was highlighted as being
    contacted by the threat actor’s tooling?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of lateral movement activity, the fileless ''CommandAndControl'' malware was
      detected on the workstation named "vnevado-win11u" (device ID bc00e484-d0e5-4da4-9472-95568cccc07e). Follow-on threat
      intelligence attributed related behavior to the Russia-based cybercriminal group Manatee Tempest, which frequently relies
      on drive-by downloads and malvertising to establish command-and-control beacons inside victim networks.'
    question: 'In the Manatee Tempest alert correlated with this incident, which suspicious domain was highlighted as being
      contacted by the threat actor’s tooling?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vectorsandarrows.com'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vectorsandarrows.com'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: "Alert 1 highlights an account compromise: entity field AadUserId with value `731adb71-b11c-4bbf-850b-57989b350e96`
          is tied to the detection of 'CommandAndControl' malware during lateral movement."
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Alert 2 links a malicious infrastructure component to the threat actor: entity field Url with value
          `vectorsandarrows.com` is associated with the Manatee Tempest activity group.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
