tasks:
- task_id: incident_5_latest_train_set_task_42
  title: incident_5_latest_train_set_task_42
  description: 'According to the alert about the renamed Windows Sysinternals utility, what is the name of the executable
    file that was run after being renamed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a credential theft attempt, analysts observed the process "conhost.exe"
      (PID 7948, created 2024-06-20 08:59:42 Z) running on an as-yet-unidentified host. This activity triggered the alert
      "Malicious credential theft tool execution detected," suggesting the attacker was attempting to dump user credentials.
      A separate but related alert was raised moments earlier titled "Windows Sysinternals tool renamed," indicating that
      the adversary had renamed a well-known Sysinternals utility and executed it—likely to conceal malicious intent.'
    question: 'According to the alert about the renamed Windows Sysinternals utility, what is the name of the executable file
      that was run after being renamed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Attackers executed a credential-theft tool on host `vnevado-win10v` (HostName = vnevado-win10v).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: They attempted to hide the activity by renaming and launching the Sysinternals tool as 
          `mimikatz.exe` (File.Name = mimikatz.exe).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
