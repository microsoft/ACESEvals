tasks:
- task_id: incident_5_latest_train_set_task_14
  title: incident_5_latest_train_set_task_14
  description: 'During this incident, the attackers also deleted all file backups on another device. What is the Azure AD
    device ID of the host where the file snapshots and shadow copies were removed?'
  inherit_shared: true
  initial_context:
    incident_context: 'A ransomware payload was remotely launched on host vnevado-win11u (Azure AD device ID: bc00e484-d0e5-4da4-9472-95568cccc07e,
      IP: 99.83.111.100). This activity is commonly followed by attempts to hinder recovery, such as deleting file snapshots
      and shadow copies.'
    question: 'During this incident, the attackers also deleted all file backups on another device. What is the Azure AD device
      ID of the host where the file snapshots and shadow copies were removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '9d4887ba-0b69-47d6-89bc-9b32787f379e'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '9d4887ba-0b69-47d6-89bc-9b32787f379e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: File snapshots and shadow copies were deleted on host with AadDeviceId 
          `9d4887ba-0b69-47d6-89bc-9b32787f379e`, likely to prevent recovery.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Immediately afterwards, a ransomware payload was remotely launched by the account `dp5hn`, 
          indicating active encryption activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
