tasks:
- task_id: incident_5_latest_train_set_task_4
  title: incident_5_latest_train_set_task_4
  description: 'A follow-up alert indicated that a ransomware payload was remotely launched against the same device. From
    which IP address was this ransomware payload initiated?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a "System recovery setting tampering" alert on host "vnevado-win10s" (device
      ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505), we observed commands such as "vssblatemp.exe delete shadows /all" (PID 5512)
      and "bcdedit /set recoveryenabled no" (PID 8136). These commands suggest an attacker attempted to disable Windows recovery
      features and delete shadow copies, a common precursor to ransomware activity.'
    question: 'A follow-up alert indicated that a ransomware payload was remotely launched against the same device. From which
      IP address was this ransomware payload initiated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '99.83.111.100'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '99.83.111.100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: System recovery settings were tampered with by the account whose AadUserId is 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A ransomware payload was remotely launched from the IP Address `99.83.111.100`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
