tasks:
- task_id: incident_5_latest_train_set_task_39
  title: incident_5_latest_train_set_task_39
  description: 'In that ransomware-related alert, which file was flagged as part of the suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, a process executed with command line "curl http://vectorsandarrows.com" (PID
      88 at 2024-06-20 09:29 UTC) on a device tied to a user whose behaviour triggered the alert "Suspicious hands on keyboard
      user behavior" on 2024-07-04. Only a few seconds later, a follow-up alert reported that multiple assets were showing
      ransomware-like activity, suggesting the attacker might be moving laterally.'
    question: 'In that ransomware-related alert, which file was flagged as part of the suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious hands-on-keyboard activity was observed from the account Name `dp5hn`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A file Name `characterical.zip` is showing ransomware-like behavior on multiple assets.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
