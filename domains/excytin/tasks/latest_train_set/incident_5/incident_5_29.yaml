tasks:
- task_id: incident_5_latest_train_set_task_29
  title: incident_5_latest_train_set_task_29
  description: 'In the alert titled "Suspicious access to LSASS service" that occurred on 2024-07-04, which DLL file was reported
    as being accessed by the attacker?'
  inherit_shared: true
  initial_context:
    incident_context: 'On host "vnevado-win10s", the user account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522)
      executed the process "browsercore.exe" just before a pair of alerts flagged a possible attempt to access a Primary Refresh
      Token (PRT). Almost simultaneously, another alert reported suspicious access to the LSASS service on the same machine,
      indicating a likely credential-dumping attempt against LSASS.'
    question: 'In the alert titled "Suspicious access to LSASS service" that occurred on 2024-07-04, which DLL file was reported
      as being accessed by the attacker?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samlib.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samlib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Process: ExtractedFileName = `browsercore.exe` - The executable browsercore.exe attempted to access
          a Primary Refresh Token (PRT).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Account: Sid = `S-5-7-21-1843151660-3234030288-105586167-1422` - The PRT-access attempt is tied to the
          user account with this SID, suggesting possible credential theft targeting that identity.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'File: Name = `samlib.dll` - Almost simultaneously, samlib.dll was used in a suspicious LSASS access,
          reinforcing the likelihood of an ongoing attempt to harvest credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
