tasks:
- task_id: incident_5_latest_train_set_task_12
  title: incident_5_latest_train_set_task_12
  description: 'A second device triggered an almost identical "File backups were deleted" alert two seconds earlier. What
    is the Azure AD device ID of that other compromised host?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a ransomware-style event on 2024-07-04, shadow copies were wiped from host "vnevado-win11t"
      (device ID e5799261-6720-4297-961e-bd9ca4275033) via the process "vssblatemp.exe delete shadows /all" (PID 1900, UTC
      time 2024-06-20T09:29:40Z). The alert raised was "File backups were deleted", indicating an attacker removed all file
      snapshots using VSSAdmin or WMI.'
    question: 'A second device triggered an almost identical "File backups were deleted" alert two seconds earlier. What is
      the Azure AD device ID of that other compromised host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'f5b847aa-8712-4bf6-b4f7-ed6cd89e1505'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'f5b847aa-8712-4bf6-b4f7-ed6cd89e1505'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: File backups and shadow copies were deleted on the device with AadDeviceId 
          `f5b847aa-8712-4bf6-b4f7-ed6cd89e1505`, indicating a possible ransomware-style attack.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The deletion activity was performed by (or in the security context of) the account with SID 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
