tasks:
- task_id: incident_5_latest_train_set_task_96
  title: incident_5_latest_train_set_task_96
  description: 'What is the Azure AD device ID of the host on which the ransomware payload was remotely launched at 22:35:03
    UTC on 2024-07-04?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 an endpoint named "vnevado-win10r" (device ID 9d4887ba-0b69-47d6-89bc-9b32787f379e) triggered
      a "Suspicious remote activity" alert after several risky commands were executed, including the deletion of shadow copies
      with vssblatemp.exe and the launch of a PowerShell script (get-userprttoken.ps1). Only three seconds later, a new alert
      indicated that a ransomware payload was remotely launched on a different device elsewhere in the environment.'
    question: 'What is the Azure AD device ID of the host on which the ransomware payload was remotely launched at 22:35:03
      UTC on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:00.896765+00:00, suspicious remote activity was carried out by the account with
          field AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Three seconds later, at 2024-07-04 22:35:03.038773+00:00, a ransomware payload was remotely 
          launched on the host whose field AadDeviceId is `bc00e484-d0e5-4da4-9472-95568cccc07e`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
