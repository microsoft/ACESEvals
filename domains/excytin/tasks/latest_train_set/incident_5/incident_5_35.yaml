tasks:
- task_id: incident_5_latest_train_set_task_35
  title: incident_5_latest_train_set_task_35
  description: 'What was the name of the executable that the later alert identified as the active unknown malware on the affected
    device?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04, the device named “vnevado-win11t” (AAD device ID e5799261-6720-4297-961e-bd9ca4275033)
      raised an alert for suspicious “GenRansom” behaviour, suggesting ransomware-style activity. A few seconds later, another
      alert reported that an unknown piece of malware was actively running on the same machine, indicating the threat had
      already achieved execution and persistence.'
    question: 'What was the name of the executable that the later alert identified as the active unknown malware on the affected
      device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious 'GenRansom' behavior was detected on the host with HostName `vnevado-win11t`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A ransomware payload was remotely launched from the IP address `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: PsExec lateral movement to Vnevado-jump was carried out by an account with AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: An active unknown malware file named `mimikatz.exe` was discovered, indicating potential 
          credential-dumping activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
