tasks:
- task_id: incident_5_latest_train_set_task_8
  title: incident_5_latest_train_set_task_8
  description: 'What is the Azure AD device ID of the host on which the "Command and Control behavior was blocked" alert was
    raised?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, security telemetry showed ransomware-like file system activity on the workstation
      named "vnevado-win11t" (Azure AD device ID e5799261-6720-4297-961e-bd9ca4275033). A few seconds later, another alert
      indicated that malicious command-and-control (C2) traffic was actively blocked on a different device in the environment.
      Analysts need to correlate these events to understand the lateral movement of the threat.'
    question: 'What is the Azure AD device ID of the host on which the "Command and Control behavior was blocked" alert was
      raised?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'f5b847aa-8712-4bf7-ed6cd89e1505'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'f5b847aa-8712-4bf7-ed6cd89e1505'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Ransomware-style file system changes were detected on host `HostName=vnevado-win11t`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A potentially compromised user account with `Sid=S-1-5-21-1840191660-8534830288-125585561-1522` was
          observed dropping ransomware-related files.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Command-and-control traffic from device `AadDeviceId=f5b847aa-8712-4bf6-b4f7-ed6cd89e1505` was 
          blocked, showing active malware activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
