tasks:
- task_id: incident_5_latest_train_set_task_83
  title: incident_5_latest_train_set_task_83
  description: 'Analysts determined that the Manatee Tempest alert involved a connection to a specific external IP address.
    What is that IP address?'
  inherit_shared: true
  initial_context:
    incident_context: 'A ''Suspicious remote activity'' alert was raised after a series of destructive commands were executed
      remotely on a host, including ‘vssblatemp.exe delete shadows /all’, changes to the boot configuration with ‘bcdedit’,
      and the launch of a PowerShell script ‘get-userprttoken.ps1’. The incident was later correlated with a threat-actor
      alert titled “Manatee Tempest activity group”, indicating that the same timeline of events is linked to this Russia-based
      cyber-criminal group.'
    question: 'Analysts determined that the Manatee Tempest alert involved a connection to a specific external IP address.
      What is that IP address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` initiated suspicious remote 
          activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: This activity is linked to infrastructure used by Manatee Tempest, communicating with the IP 
          Address `198.43.121.209`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
