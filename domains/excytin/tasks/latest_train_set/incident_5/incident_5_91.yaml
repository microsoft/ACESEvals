tasks:
- task_id: incident_5_latest_train_set_task_91
  title: incident_5_latest_train_set_task_91
  description: 'In the follow-up alert that signalled "Possible ransomware activity based on a known malicious extension",
    what is the name of the file that was observed being modified?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we saw an alert titled "Possible attempt to access Primary Refresh Token (PRT)"
      on July 4, which originated from the external IP address 107.224.99.179 and involved a suspicious PowerShell command
      executed as powershell.exe, followed moments later by browsercore.exe on the same device. Just seconds after this initial
      activity, another alert fired on that device indicating widespread file-system changes consistent with ransomware behaviour
      (files being renamed with a known malicious extension).'
    question: 'In the follow-up alert that signalled "Possible ransomware activity based on a known malicious extension",
      what is the name of the file that was observed being modified?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious activity began with a possible attempt to access a Primary Refresh Token on the host 
          identified by AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The attacker then leveraged PSExec from the external IP Address `99.83.111.100`, indicating lateral
          movement toward the jump server.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, possible ransomware behavior was detected when numerous files were renamed to include the 
          malicious extension, exemplified by the file Name `characterical.zip`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
