tasks:
- task_id: incident_5_latest_train_set_task_90
  title: incident_5_latest_train_set_task_90
  description: 'According to the ''Mimikatz credential theft tool'' alert raised at 2024-07-04 22:35 UTC, what is the name
    of the file that was detected on the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed that on host ''vnevado-win11u'' the user ''dp5hn'' (AadUserId 731adb71-b11c-4bbf-850b-57989b350e96)
      executed commands such as "vssblatemp.exe delete shadows /all" and "bcdedit /set recoveryenabled no" on 2024-07-04 22:35
      UTC, triggering a ''System recovery setting tampering'' alert. Just seconds later, another alert titled ''Mimikatz credential
      theft tool'' was raised on the same device, indicating the presence of a known credential-theft component.'
    question: 'According to the ''Mimikatz credential theft tool'' alert raised at 2024-07-04 22:35 UTC, what is the name
      of the file that was detected on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'File.Name `mimilib.dll` was detected as the Mimikatz credential-theft tool on the device (alert: “Mimikatz
          credential theft tool”).'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Account.AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` tampered with system recovery settings on the
          host (alert: “System recovery setting tampering”).'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Ip.Address `99.83.111.100` was the remote source of suspicious activity on the machine (alert: “Suspicious
          remote activity”).'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Host.AadDeviceId `4d8d23e9-a77d-4e33-9435-b8c457e57ca1` was accessed via PSExec for lateral movement
          to the jump server (alert: “PSExec to Vnevado-jump”).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
