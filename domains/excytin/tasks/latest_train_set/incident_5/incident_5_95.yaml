tasks:
- task_id: incident_5_latest_train_set_task_95
  title: incident_5_latest_train_set_task_95
  description: 'What IP address was listed in the Manatee Tempest activity-group alert generated at 2024-07-04 22:35:01 UTC?'
  inherit_shared: true
  initial_context:
    incident_context: 'An investigation began when Microsoft Defender flagged a "Suspicious access to LSASS service" alert
      on 2024-07-04. Mimikatz-style commands were executed (for example: "mimikatz.exe privilege::debug sekurlsa::pth … /run:..\notepad.exe"),
      indicating that an attacker tried to read credentials from LSASS. A few days later, additional alerts showed attempts
      to move laterally, including a "PSExec to Vnevado-jump" event and a blocked SMB file-access attempt. Ultimately, the
      activity was attributed to the Russia-based threat actor tracked as Manatee Tempest. One of the artifacts recorded in
      that Manatee Tempest alert was a specific IP address that communicated with the environment.'
    question: 'What IP address was listed in the Manatee Tempest activity-group alert generated at 2024-07-04 22:35:01 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The alert on 'Manatee Tempest activity group' shows the attacker infrastructure communicating from 
          IP (Address) `198.43.121.209`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Almost simultaneously, the attacker abused the local account (Name) `tgs2z` to access the LSASS 
          process and dump credentials.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Those stolen credentials surfaced as cloud account (AadUserId) 
          `731adb71-b11c-4bbf-850b-57989b350e96`, which tried – but was blocked – to move laterally via SMB file 
          operations.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Finally, the attacker switched to remote execution: PSExec was launched from IP (Address) `99.83.111.100`,
          reaching the Vnevado-jump server and completing the lateral-movement path.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
