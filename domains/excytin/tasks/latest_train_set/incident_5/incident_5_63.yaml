tasks:
- task_id: incident_5_latest_train_set_task_63
  title: incident_5_latest_train_set_task_63
  description: 'A second, closely-related alert shows the attacker rerunning mimikatz and this time supplying a specific NTLM
    hash after the "/ntlm:" switch. What NTLM hash value did the attacker use in that later command?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a credential-theft attempt, we observed an initial execution of "mimikatz.exe"
      on 2024-06-20 at 09:03:04 Z with the command line `privilege::debug sekurlsa::pth /user:fk8mq /ntlm: /domain:vnevado.alpineskihouse.co
      /run:..\notepad.exe //vnevado-jumpv cmd.exe`. Notice that the NTLM hash parameter after `/ntlm:` was left blank in this
      first invocation.'
    question: 'A second, closely-related alert shows the attacker rerunning mimikatz and this time supplying a specific NTLM
      hash after the "/ntlm:" switch. What NTLM hash value did the attacker use in that later command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '96def1a633fc6790124d5f8fe21cc72b'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '96def1a633fc6790124d5f8fe21cc72b'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Malicious credential-theft tool detected: process field ProcessId__CreatedTimeUtc__CommandLine with
          value `6600__2024-06-20t09:05:15.5627318z__"mimikatz.exe" privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b
          /domain:vnevado.alpineskihouse.co /run:..\notepad.exe \\vnevado-jump cmd.exe"` executed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The suspicious process was executed by the account whose Sid field has value 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
