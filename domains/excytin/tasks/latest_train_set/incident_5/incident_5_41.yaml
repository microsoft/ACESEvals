tasks:
- task_id: incident_5_latest_train_set_task_41
  title: incident_5_latest_train_set_task_41
  description: 'Within this same incident, investigators also received the alert "Windows Sysinternals tool renamed." According
    to that alert, what is the name of the executable that was renamed and executed?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024 at 22:35 UTC, account "dp5hn" on host "vnevado-win11u" triggered an alert titled "Ransomware
      payload remotely launched." This indicated that attackers may have attempted to encrypt data on the device. Shortly
      afterward, other related alerts appeared in the same incident sequence, including a notice of lateral movement using
      PSExec to a jump server.'
    question: 'Within this same incident, investigators also received the alert "Windows Sysinternals tool renamed." According
      to that alert, what is the name of the executable that was renamed and executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An external attacker initiated the incident by remotely launching a ransomware payload from IP Address
          `99.83.111.100` (entity field: Address).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'After gaining a foothold, the attacker performed lateral movement using PSExec to the jump-server whose
          AadDeviceId is `4d8d23e9-a77d-4e33-9435-b8c457e57ca1` (entity field: AadDeviceId).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'To escalate the attack, the adversary renamed and executed a Sysinternals tool as the file `mimikatz.exe`
          (entity field: Name) in order to harvest credentials.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
