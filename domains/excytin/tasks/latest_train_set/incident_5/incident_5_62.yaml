tasks:
- task_id: incident_5_latest_train_set_task_62
  title: incident_5_latest_train_set_task_62
  description: 'According to the alert that reported the credential-theft tool execution, what IP address was involved in
    that activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-10 our monitoring flagged a lateral-movement attempt on host "vnevado-win11t" that was automatically
      blocked when the user account "Grace Chen" tried to modify files over SMB. Shortly afterwards, PSExec activity toward
      the internal jump server was recorded. Earlier in the same incident, Defender detected the execution of a known credential-theft
      tool, suggesting the attacker was trying to collect credentials before moving laterally.'
    question: 'According to the alert that reported the credential-theft tool execution, what IP address was involved in that
      activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – Malicious credential dump: A known credential-theft tool was executed from the machine communicating
          with IP Address `107.224.99.179` (Field: Address, Value: 107.224.99.179).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – SMB lateral-movement attempt: Shortly after, an attempt to create / modify files over SMB was
          made from IP Address `99.83.111.100` (Field: Address, Value: 99.83.111.100) and was automatically blocked.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – PSExec to jump server: The attacker then tried to move laterally to the jump server “Vnevado-jump”
          using the compromised account with SID `S-5-7-21-1843151660-3234030288-105586167-1422` (Field: Sid, Value: S-5-7-21-1843151660-3234030288-105586167-1422).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
