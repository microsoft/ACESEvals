tasks:
- task_id: incident_5_latest_train_set_task_31
  title: incident_5_latest_train_set_task_31
  description: 'A second "System recovery setting tampering" alert was raised a fraction of a second earlier for a different
    machine in the environment. What is the hostname of that other device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation you observe a "System recovery setting tampering" alert on host "vnevado-win11t"
      (device ID e5799261-6720-4297-961e-bd9ca4275033). Around the same moment, native Windows utilities such as vssblatemp.exe
      and bcdedit.exe were executed with commands intended to delete shadow copies and disable recovery features, indicating
      an attempt to hinder system restoration options.'
    question: 'A second "System recovery setting tampering" alert was raised a fraction of a second earlier for a different
      machine in the environment. What is the hostname of that other device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11u'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11u'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious process with ExtractedFileName `vssblatemp.exe` was executed, indicating an attempt to
          delete volume shadow copies and tamper with system-recovery settings.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: This tampering activity took place on the host with HostName `vnevado-win11u`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
