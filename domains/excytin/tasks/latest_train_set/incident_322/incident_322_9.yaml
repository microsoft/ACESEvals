tasks:
- task_id: incident_322_latest_train_set_task_9
  title: incident_322_latest_train_set_task_9
  description: 'According to the correlated telemetry, what was the process ID (PID) of the PowerShell process that ran the
    encoded command on host "vnevado-dc" at 2024-08-01 12:37:29 UTC?'
  inherit_shared: true
  initial_context:
    incident_context: 'While investigating an alert titled "Ntdsutil collecting Active Directory information", we observed
      that the binary "ntdsutil.exe" (PID 6748) ran on the domain controller "vnevado-dc" at 2024-08-01 12:54 UTC. This activity
      may indicate an attacker attempting to enumerate or export Active Directory data. Correlated telemetry shows that, seconds
      earlier, a separate PowerShell process launched on the same host and executed a long Base64-encoded command, suggesting
      possible follow-on actions by the adversary.'
    question: 'According to the correlated telemetry, what was the process ID (PID) of the PowerShell process that ran the
      encoded command on host "vnevado-dc" at 2024-08-01 12:37:29 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2556'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '2556'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: The attacker executed a PowerShell process with entity field 
          `ProcessId__CreatedTimeUtc__CommandLine`, value `2556__2024-08-01t12:37:29.6522416z__"powershell.exe" 
