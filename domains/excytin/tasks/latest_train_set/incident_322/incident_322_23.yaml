tasks:
- task_id: incident_322_latest_train_set_task_23
  title: incident_322_latest_train_set_task_23
  description: 'According to the later alert showing Ntdsutil activity, what was the process ID of the Ntdsutil instance that
    collected Active Directory information?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a credential-dump attempt on domain controller "vnevado-dc", we observed
      a suspicious PowerShell process (PID 2556) executing an encoded command, as well as the presence of the binary "ntdsutil.exe"—an
      indication that the attacker might be trying to access NTDS.dit data. A few minutes later, another alert was raised
      indicating that Ntdsutil was actively collecting Active Directory information on the same host.'
    question: 'According to the later alert showing Ntdsutil activity, what was the process ID of the Ntdsutil instance that
      collected Active Directory information?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '6748'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '6748'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious credentials were dumped from NTDS.dit via process (ExtractedFileName: `powershell.exe`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then executed ntdsutil (ProcessId__CreatedTimeUtc__CommandLine: `6748__2024-08-01t12:37:30.2769191z__"ntdsutil.exe"
          "ac i ntds" ifm "create full c:\temp" q q`) to collect additional Active Directory information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
