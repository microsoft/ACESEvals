tasks:
- task_id: incident_322_latest_train_set_task_7
  title: incident_322_latest_train_set_task_7
  description: 'During the Azure Resource Manager activity that originated from the suspicious proxy IP, what is the name
    of the resource group that was targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'A user clicked on the URL https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/ that
      later got quarantined by zero-hour auto purge (ZAP). Shortly afterward, Microsoft Defender for Resource Manager raised
      an alert because a management action was performed from an IP address linked to proxy services (e.g., TOR).'
    question: 'During the Azure Resource Manager activity that originated from the suspicious proxy IP, what is the name of
      the resource group that was targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ctfcat'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ctfcat'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user with account Name `Hailey Johnson` accessed a link in an email that was later quarantined by
          ZAP at 2024-08-01 12:54:55.663380+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Not long after, an Azure Resource Manager operation was carried out on ResourceGroup `ctfcat` from 
          a suspicious proxy IP at 2024-08-01 13:09:13.222398+00:00.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
