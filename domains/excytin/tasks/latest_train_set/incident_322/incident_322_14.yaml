tasks:
- task_id: incident_322_latest_train_set_task_14
  title: incident_322_latest_train_set_task_14
  description: 'Which mailbox (provide the full email address) was identified in the follow-up alert as having clicked the
    malicious URL?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation we observed that an email originating from sender raphaelt@vnevado.alpineskihouse.co
      (IP 202.205.215.225) contained the suspicious URL dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io. The message
      was later removed by the security system under the alert “Email messages containing malicious URL removed after delivery.”
      A short time later, a second alert titled “A potentially malicious URL click was detected” indicated that the recipient
      of the original message actually clicked the malicious link.'
    question: 'Which mailbox (provide the full email address) was identified in the follow-up alert as having clicked the
      malicious URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An email message addressed to recipient `alyssat@vnevado.alpineskihouse.co` was delivered and later
          removed because it contained a malicious URL (Entity field: Recipient, Value: `alyssat@vnevado.alpineskihouse.co`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same recipient `alyssat@vnevado.alpineskihouse.co` subsequently clicked on the malicious URL detected
          in the email (Entity field: Recipient, Value: `alyssat@vnevado.alpineskihouse.co`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
