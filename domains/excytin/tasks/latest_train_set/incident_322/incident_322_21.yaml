tasks:
- task_id: incident_322_latest_train_set_task_21
  title: incident_322_latest_train_set_task_21
  description: 'Which Azure resource (provide the full Resource ID) was involved in the suspicious Azure Resource Manager
    operation detected from a proxy IP address?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an email-based attack, multiple messages containing the malicious URL "dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io"
      were delivered to the mailbox of alyssat@vnevado.alpineskihouse.co and subsequently removed. The messages originated
      from raphaelt@vnevado.alpineskihouse.co and were sent through the IP address 202.205.215.225. While reviewing the same
      incident, Microsoft Defender for Resource Manager later raised an alert indicating that a resource-management operation
      was performed from a suspicious proxy (for example TOR).'
    question: 'Which Azure resource (provide the full Resource ID) was involved in the suspicious Azure Resource Manager operation
      detected from a proxy IP address?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.network/networkinterfaces/vnevado-dc-nic'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.network/networkinterfaces/vnevado-dc-nic'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The email account (Field: Email) `Hailey Johnson@vnevado.alpineskihouse.co` received an email containing
          a malicious URL that was subsequently removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious Azure Resource Manager operation targeted the Azure resource (Field: ResourceId) `/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.network/networkinterfaces/vnevado-dc-nic`.'
