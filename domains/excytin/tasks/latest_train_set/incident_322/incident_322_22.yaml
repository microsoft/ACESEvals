tasks:
- task_id: incident_322_latest_train_set_task_22
  title: incident_322_latest_train_set_task_22
  description: 'What is the email address of the recipient whose message was involved in the "potentially malicious URL click"
    alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed suspicious Azure Resource Management (ARM) activity from the IP
      address 253.1.244.215. Shortly after, security controls flagged and removed several email messages that had contained
      malicious links. One of those links was clicked by a user, triggering a "potentially malicious URL click" alert. You
      need to confirm which mailbox was involved in that click event.'
    question: 'What is the email address of the recipient whose message was involved in the "potentially malicious URL click"
      alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious Azure Resource Management activity was performed from an account with Sid 
          `S-1-5-21-1840151686-3534835288-156286563-1127`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: An e-mail containing a malicious URL was delivered and later removed; the mailmessage Recipient was
          `alyssat@vnevado.alpineskihouse.co`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A potentially malicious URL click was detected from the same mailmessage Recipient 
          `alyssat@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
