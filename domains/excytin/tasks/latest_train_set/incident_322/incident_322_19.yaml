tasks:
- task_id: incident_322_latest_train_set_task_19
  title: incident_322_latest_train_set_task_19
  description: 'What is the name of the executable that was used to perform the NTDS.dit credential dump in the related alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a cloud-based incident, Microsoft Defender for Cloud raised an alert about
      suspicious Azure Resource Management activity. The activity originated from the user account "Hailey Johnson" (SID:
      S-1-5-21-1840151686-3534835288-156286563-1127) signing in from the external IP address 253.1.244.215. While following
      the alert chain, analysts found a later event involving a credential dump of the Active Directory database (NTDS.dit).'
    question: 'What is the name of the executable that was used to perform the NTDS.dit credential dump in the related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ntdsutil.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The account with Sid `S-1-5-21-1840151686-3534835288-156286563-1127` initiated suspicious Azure 
          Resource Management (ARM) activities from a risky session.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: These ARM operations were observed coming from host with HostName `vnevado-dc`, which had been 
          flagged for use of a proxy (e.g., TOR).
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: On that host, the process with ExtractedFileName `ntdsutil.exe` was executed to dump NTDS.dit, 
          indicating an attempt to harvest domain credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
