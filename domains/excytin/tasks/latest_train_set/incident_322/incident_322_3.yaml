tasks:
- task_id: incident_322_latest_train_set_task_3
  title: incident_322_latest_train_set_task_3
  description: 'During the “Ntdsutil collecting Active Directory information” alert raised at 12:54:34 UTC on 2024-08-01,
    what was the Process ID (PID) of the command that was executed?'
  inherit_shared: true
  initial_context:
    incident_context: 'Investigation revealed that a malicious email was sent from raphaelt@vnevado.alpineskihouse.co to alyssat@vnevado.alpineskihouse.co,
      containing the suspicious link dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io. Although the message was
      removed after delivery, related activity soon followed: Microsoft Defender for Resource Manager flagged an operation
      originating from a proxy IP, and shortly afterward an alert indicated that the built-in Windows utility Ntdsutil was
      executed to gather Active Directory data on one of the domain controllers.'
    question: 'During the “Ntdsutil collecting Active Directory information” alert raised at 12:54:34 UTC on 2024-08-01, what
      was the Process ID (PID) of the command that was executed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '6748'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '6748'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The email account (field: Name) `Hailey Johnson` received a message that contained a malicious URL,
          which was later removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious Azure Resource Manager operation was performed from the host (field: HostName) `vnevado-dc`,
          indicating possible proxy (TOR) usage.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'The attacker executed the process (field: ProcessId__CreatedTimeUtc__CommandLine) `6748__2024-08-01t12:37:30.2769191z__"ntdsutil.exe"
          "ac i ntds" ifm "create full c:\temp" q q`, using ntdsutil.exe to collect Active Directory information.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
