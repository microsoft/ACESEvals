tasks:
- task_id: incident_322_latest_train_set_task_5
  title: incident_322_latest_train_set_task_5
  description: 'According to the Ntdsutil execution alert uncovered in this incident, what is the Process ID (PID) of the
    process that ran the Ntdsutil command?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an email-borne threat, we observed that a user clicked the URL https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/
      in a message that was later removed by Zero-hour Auto Purge (ZAP). Shortly after, Microsoft Defender raised an alert
      for an Azure Resource Manager action originating from a suspicious proxy IP, indicating possible attacker follow-on
      activity. Pivoting from these events, analysts discovered an additional alert indicating that the Ntdsutil tool had
      been executed to collect Active Directory data, suggesting an attempt at credential access or lateral movement.'
    question: 'According to the Ntdsutil execution alert uncovered in this incident, what is the Process ID (PID) of the process
      that ran the Ntdsutil command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '6748'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '6748'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An email account accessed a suspicious link: account.Name = `Hailey Johnson`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious Azure Resource Manager operation occurred on host: host.HostName = `vnevado-dc`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'An attacker leveraged Ntdsutil to gather Active Directory data: process.ProcessId__CreatedTimeUtc__CommandLine
          = `6748__2024-08-01t12:37:30.2769191z__"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
