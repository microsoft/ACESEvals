tasks:
- task_id: incident_55_latest_train_set_task_77
  title: incident_55_latest_train_set_task_77
  description: 'What is the exact URL that the user clicked on 10 July 2024 which triggered the "A potentially malicious URL
    click was detected" alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we noted that on July 4 2024 a suspicious service registration occurred when
      the system program "services.exe" (PID 764) was installed as a service, followed immediately by exploration commands
      and an attempt to access LSASS—behaviour often linked to credential theft and lateral movement. Several days later,
      on July 10 2024, the same incident chain culminated in a security alert indicating that a user had clicked a link subsequently
      classified as malicious.'
    question: 'What is the exact URL that the user clicked on 10 July 2024 which triggered the "A potentially malicious URL
      click was detected" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'HostName: `mb-adfs` – A suspicious system program was registered as a service on this host (2024-07-04
          22:35:03.448593 UTC).'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'ExtractedFileName: `powershell.exe` – The same host launched PowerShell, triggering a suspicious sequence
          of exploration commands (2024-07-04 22:35:03.106654 UTC).'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'AadUserId: `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` – This account accessed LSASS memory, likely to harvest
          credentials (2024-07-04 22:35:02.783154 UTC).'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Url: `http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` – Days later, the user
          clicked this malicious URL, indicating the attack progressed to an external payload delivery stage (2024-07-10 11:24:45.507742
          UTC).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
