tasks:
- task_id: incident_55_latest_train_set_task_8
  title: incident_55_latest_train_set_task_8
  description: 'According to the "Internal phishing campaign" alert raised on 2024-07-07, which user email address was used
    to send the phishing messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing investigation we noted that, on July 4 2024, a PowerShell script named "contosoadfsblatempcreds.ps1"
      was executed on host "mb-winclient" (device ID 7661dfd4-218f-4016-8a87-66d68a7f098e) from IP 72.5.72.208. The command
      line shows it was run via "powershell.exe" (PID 12412) under user accounts linked to pwilson and bjenkins. This activity
      triggered the alert "A process was injected with potentially malicious code", suggesting code injection into another
      process. Three days later, another alert titled "Internal phishing campaign" was generated because a compromised user
      sent phishing emails from the same device to internal recipients.'
    question: 'According to the "Internal phishing campaign" alert raised on 2024-07-07, which user email address was used
      to send the phishing messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Sullivan@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Sullivan@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A potentially malicious code injection was observed running under the user account with Sid 
          `S-1-5-21-561436748-3867387497-1732241745-3701`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, an internal phishing campaign originated from the email account `Nina 
          Sullivan@vnevado.alpineskihouse.co`, suggesting that this user may have been compromised.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
