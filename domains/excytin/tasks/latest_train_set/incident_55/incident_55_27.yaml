tasks:
- task_id: incident_55_latest_train_set_task_27
  title: incident_55_latest_train_set_task_27
  description: 'According to the "Suspicious service creation" alert, which user account (provide the email address) created
    the service named "DDLOXJDSQSNGMUKKFUXQ" on host MB-ADFS?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a suspicious service registration involving the binary "services.exe" (Process
      ID 764, created 2024-06-20 08:30:13 UTC), analysts noted that the same host later showed activity consistent with an
      ongoing hands-on-keyboard attack carried out with the Impacket toolkit. A few days after these events, another alert
      was raised for a newly created Windows service named "DDLOXJDSQSNGMUKKFUXQ" on the system "MB-ADFS". The alert indicates
      that this service was created by a specific user account, suggesting the attacker may have achieved persistence under
      that identity.'
    question: 'According to the "Suspicious service creation" alert, which user account (provide the email address) created
      the service named "DDLOXJDSQSNGMUKKFUXQ" on host MB-ADFS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An alert showed that a system program was registered as a service on the host with HostName 
          `mb-adfs`, indicating a possible attempt at persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Soon after, an ongoing hands-on-keyboard attack was detected where the account with Name `gsmith` 
          executed commands through the Impacket toolkit, suggesting lateral-movement activity.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Several days later, the same user—identified by Email `gsmith@niseko.alpineskihouse.co`—created the
          suspicious service “DDLOXJDSQSNGMUKKFUXQ” on host MB-ADFS, reinforcing the evidence of malicious persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
