tasks:
- task_id: incident_55_latest_train_set_task_21
  title: incident_55_latest_train_set_task_21
  description: 'Identify the name of the executable that was ultimately registered as a Windows service in the final "Suspicious
    service registration" alert.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that a user clicked the malicious URL "https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/"
      on an endpoint (host name still being confirmed). Follow-up telemetry shows a chain of related alerts on the same machine:
      first a suspicious LDAP query was executed, then a series of exploration commands were run, and finally a system program
      was registered as a Windows service—an action often associated with establishing persistence.'
    question: 'Identify the name of the executable that was ultimately registered as a Windows service in the final "Suspicious
      service registration" alert.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Malicious URL click was detected on host with HostName `mb-winclient`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Process `powershell.exe` (ExtractedFileName) executed a suspicious LDAP query.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Host `mb-adfs` (HostName) was involved in a suspicious sequence of exploration activities.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Process `services.exe` (ExtractedFileName) was registered as a suspicious service.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
