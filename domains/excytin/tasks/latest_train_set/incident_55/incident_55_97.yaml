tasks:
- task_id: incident_55_latest_train_set_task_97
  title: incident_55_latest_train_set_task_97
  description: 'What is the exact URL that was clicked on MB-ADFS, which triggered the "Malicious URL was clicked on that
    device" alert at 11:24:45 UTC on 2024-07-10?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed that the user gsmith@niseko.alpineskihouse.co created a suspicious
      service named "DDLOXJDSQSNGMUKKFUXQ" on host MB-ADFS. Shortly after, the same device generated an alert titled "Malicious
      URL was clicked on that device" (time stamp 2024-07-10 11:24:45 UTC), indicating that a potentially harmful website
      had been accessed from MB-ADFS.'
    question: 'What is the exact URL that was clicked on MB-ADFS, which triggered the "Malicious URL was clicked on that device"
      alert at 11:24:45 UTC on 2024-07-10?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – Account (Field: Name): The user account `gsmith` created the suspicious service DDLOXJDSQSNGMUKKFUXQ
          on host MB-ADFS (2024-07-10 11:24:45 UTC).'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – Process (Field: ExtractedFileName): A process named `powershell.exe` executed a suspicious
          set of Windows discovery commands (2024-07-04 22:35:03 UTC).'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – Host (Field: AadDeviceId): The host with AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`
          was observed accessing the LSASS service, indicating possible credential dumping (2024-07-04 22:35:02 UTC).'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Step 4 – URL (Field: Url): From that same device, the malicious URL `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`
          was clicked (2024-07-10 11:24:45 UTC).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
