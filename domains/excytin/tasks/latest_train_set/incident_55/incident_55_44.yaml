tasks:
- task_id: incident_55_latest_train_set_task_44
  title: incident_55_latest_train_set_task_44
  description: 'According to the alert titled “A potentially malicious URL click was detected” raised on 10 July 2024, what
    is the name of the user account that clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation we noted an unusual addition of credentials to the OAuth application “SimulandApp”.
      This suspicious activity was performed by the user account Luciano Herrera (Luciano Herrera@niseko.alpineskihouse.co)
      on July 7 2024. Such behaviour can indicate that an attacker may have compromised the application for further malicious
      activity such as phishing or data exfiltration. We are now trying to understand how this activity correlates with later
      events in the same incident, including a subsequent alert about a user who clicked a link that was later classified
      as malicious.'
    question: 'According to the alert titled “A potentially malicious URL click was detected” raised on 10 July 2024, what
      is the name of the user account that clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Lucas Grey'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Lucas Grey'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-07 09:54:21.810789+00:00, the account with Sid 
          `S-1-5-21-551436448-9871687716-9837441745-1903` added a password credential to the OAuth application 
          'SimulandApp', indicating a possible compromise of that application.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-04 22:35:03.012758+00:00, the account with AadUserId 
          `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` executed a malicious PowerShell Cmdlet on its machine, suggesting 
          credential theft or code-execution activity.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: At 2024-07-10 11:24:45.507742+00:00, the user account named `Lucas Grey` clicked on a URL that was 
          later determined to be malicious.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
