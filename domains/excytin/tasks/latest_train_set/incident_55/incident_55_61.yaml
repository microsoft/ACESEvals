tasks:
- task_id: incident_55_latest_train_set_task_61
  title: incident_55_latest_train_set_task_61
  description: 'What is the Azure AD user ID (AadUserId) of the account linked to the "Suspicious sequence of exploration
    activities" alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the incident investigation, we observed that user account "bjenkins" on host "mb-winclient"
      (IP 72.5.72.208) executed a PowerShell command and a memory-dump operation targeting lsass.exe, triggering the alert
      "Sensitive credential memory read" on 2024-07-04. Shortly before this, another alert titled "Suspicious sequence of
      exploration activities" was generated and is believed to be related to the same compromise. You need to identify which
      Azure AD user was associated with that second alert.'
    question: 'What is the Azure AD user ID (AadUserId) of the account linked to the "Suspicious sequence of exploration activities"
      alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Sensitive credentials were accessed when the process with field ExtractedFileName and value 
          `powershell.exe` read LSASS memory.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious exploration sequence was then executed by the account with field AadUserId and value 
          `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
