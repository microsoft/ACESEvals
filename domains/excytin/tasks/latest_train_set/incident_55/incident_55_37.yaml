tasks:
- task_id: incident_55_latest_train_set_task_37
  title: incident_55_latest_train_set_task_37
  description: 'What is the exact name of the PowerShell script file that was identified as the payload in the code-injection
    alert related to this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 10 2024, the user account “Luciano Herrera” (Luciano Herrera@niseko.alpineskihouse.co) used
      IP address 2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3 to add a new password-type credential to an OAuth application (App
      ID 11161, OAuth App ID 4d9476b8-6ae6-459b-a273-5837c15b5981) linked to Microsoft 365. This behavior was flagged as an
      unusual addition of credentials to an OAuth app and may indicate that the application has been compromised for malicious
      activity. Shortly before this credential-related event, security telemetry recorded that a process on one of the organization’s
      endpoints was injected with suspicious code, suggesting an attempt to execute hidden malware within a trusted process.'
    question: 'What is the exact name of the PowerShell script file that was identified as the payload in the code-injection
      alert related to this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'contosoadfsblatempcreds.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'contosoadfsblatempcreds.ps1'
        max_score: 1.0
      checkpoint_1:
