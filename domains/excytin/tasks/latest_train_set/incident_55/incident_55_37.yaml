        title: Checkpoint 1
        description: 'Account entity (field: AadUserId) with value `2de70991-2799-4a95-b734-8e3df3a50118` added a Password
          credential to the OAuth application SimulandApp, which is an unusual and suspicious activity.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'File entity (field: Name) with value `contosoadfsblatempcreds.ps1` was involved in a process injection
          event, suggesting that malicious code was executed within another process.'
  scoring_aggregation:
