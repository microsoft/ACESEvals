tasks:
- task_id: incident_55_latest_train_set_task_94
  title: incident_55_latest_train_set_task_94
  description: 'For the "Suspicious LDAP query" alert that followed the renamed-executable activity, what is the Azure AD
    user ID (AadUserId) of the account that executed the query?'
  inherit_shared: true
  initial_context:
    incident_context: 'On host "mb-adfs" a suspicious file named "iy2orr1e.rrg.exe" (a renamed Windows executable) was launched
      under the SYSTEM account using a Base-64 encoded PowerShell command. This behaviour triggered the alert "System executable
      renamed and launched" because attackers often rename built-in executables to evade detection. Only a couple of seconds
      later another alert was raised: "Suspicious LDAP query", indicating possible directory reconnaissance that could leverage
      information gathered by the earlier process launch.'
    question: 'For the "Suspicious LDAP query" alert that followed the renamed-executable activity, what is the Azure AD user
      ID (AadUserId) of the account that executed the query?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2de70991-2799-4a95-b734-8e3df3a50118'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '2de70991-2799-4a95-b734-8e3df3a50118'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A renamed system executable was launched: ExtractedFileName = `powershell.exe`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Soon after, a suspicious LDAP query was executed by the account: AadUserId = `2de70991-2799-4a95-b734-8e3df3a50118`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
