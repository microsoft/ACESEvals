tasks:
- task_id: incident_55_latest_train_set_task_38
  title: incident_55_latest_train_set_task_38
  description: 'According to the final alert in this incident, which user account (email address) was reported to have read
    the AD FS DKM key?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we observed that the user Luciano Herrera (luciano herrera@niseko.alpineskihouse.co)
      added a password-type credential to an OAuth application (AppId 11161) from IP 36.193.21.220. This suspicious action
      was correlated with follow-up alerts for system hardware discovery and remote activity on a device. A few days later,
      another alert titled “Suspected AD FS DKM key read” indicated that someone had accessed the Directory Key Material (DKM)
      for an ADFS object (ID 4cac49d3-29d3-407e-8c9b-b7ebb21541b2).'
    question: 'According to the final alert in this incident, which user account (email address) was reported to have read
      the AD FS DKM key?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious system hardware discovery was executed with process ExtractedFileName = 
          `powershell.exe` on 2024-07-04 22:35:00.746663+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Two seconds later, suspicious remote activity was initiated by account Sid = 
          `S-2-5-21-571436798-3864380397-1837441745-3206` on 2024-07-04 22:35:02.377104+00:00.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: On 2024-07-07 09:54:21.810789+00:00, account Sid = `S-1-5-21-551436448-9871687716-9837441745-1903` 
          (Luciano Herrera) performed an unusual addition of password credentials to the OAuth application SimulandApp.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Finally, on 2024-07-10 11:24:45.601805+00:00, account Email = `gsmith@niseko.alpineskihouse.co` was
          detected reading the AD FS DKM key, suggesting a potential compromise of federation services.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
