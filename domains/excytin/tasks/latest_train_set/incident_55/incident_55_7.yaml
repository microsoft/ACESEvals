tasks:
- task_id: incident_55_latest_train_set_task_7
  title: incident_55_latest_train_set_task_7
  description: 'What is the Object ID of the OAuth application ("SimulandApp") to which Luciano Herrera added an unusual password
    credential on July 7th?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed a suspicious access to the Local Security Authority Subsystem
      Service (LSASS) on July 4th, where the process "lsass.exe" (PID 760) was interacting with several security-related DLLs
      (cryptdll.dll, hid.dll, winscard.dll, vaultcli.dll). This activity can be an early stage of credential theft that may
      enable lateral movement. Just seconds later, a malicious PowerShell cmdlet was executed, tied to an as-yet-unidentified
      user account. Three days later, on July 7th, the same investigation linked these events to an alert reporting that user
      "Luciano Herrera (pwilson@niseko.alpineskihouse.co)" added a new password credential to a cloud-hosted OAuth application
      named "SimulandApp," suggesting possible application compromise.'
    question: 'What is the Object ID of the OAuth application ("SimulandApp") to which Luciano Herrera added an unusual password
      credential on July 7th?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'a66a4b44-d1f7-4563-95bf-a89d1b05b325'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'a66a4b44-d1f7-4563-95bf-a89d1b05b325'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An external attacker from IP Address `72.5.72.208` attempted to read LSASS memory to harvest 
          clear-text credentials.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: With the stolen credentials, the attacker (AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`) 
          executed a malicious PowerShell Cmdlet on the compromised machine to extend their foothold.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, the same threat actor leveraged the compromised identity to add a new password credential 
          to the OAuth application identified by OAuthObjectId `a66a4b44-d1f7-4563-95bf-a89d1b05b325`, giving them 
          persistent cloud access.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
