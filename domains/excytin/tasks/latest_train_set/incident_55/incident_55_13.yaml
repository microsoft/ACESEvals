tasks:
- task_id: incident_55_latest_train_set_task_13
  title: incident_55_latest_train_set_task_13
  description: 'According to the final alert "Attempt to hide use of dual-purpose tool," which user account was associated
    with this suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that a user clicked the malicious URL "https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/"
      on a corporate device, which led to several follow-up alerts. Shortly after the click, a malicious PowerShell cmdlet
      was executed, and a system executable was renamed and launched, indicating an evasion attempt. The sequence culminated
      in an alert titled "Attempt to hide use of dual-purpose tool," suggesting that the threat actor tried to disguise a
      legitimate utility under an unexpected filename.'
    question: 'According to the final alert "Attempt to hide use of dual-purpose tool," which user account was associated
      with this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A renamed system executable was executed with ProcessId__CreatedTimeUtc__CommandLine 
          `3116__2024-07-02t09:48:23.9439954z__iy2orr1e.rrg.exe -windowstyle hidden -encodedcommand 
          qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: That executable ran a malicious PowerShell script, identified by ExtractedFileName 
          `powershell.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: The activity was carried out under the account Name `gsmith`, indicating an attempt to hide the use
          of a dual-purpose tool.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Later, a malicious URL was clicked from the device with AadDeviceId 
          `7661dfd4-218f-4016-8a87-66d68a7f098e`, confirming compromise of the host.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
