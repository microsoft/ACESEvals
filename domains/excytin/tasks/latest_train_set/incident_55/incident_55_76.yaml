tasks:
- task_id: incident_55_latest_train_set_task_76
  title: incident_55_latest_train_set_task_76
  description: 'A later alert in the same incident reported that code was injected into a process and ultimately led to suspicious
    access to the LSASS service. According to that LSASS access alert, what is the name of the file that was involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that on 2024-07-10 the user "Luciano Herrera" (Luciano Herrera@niseko.alpineskihouse.co)
      performed an unusual addition of a password-type credential to the OAuth application "SimulandApp" (AppId 11161) while
      connected from IPv6 address 2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3. This activity raised concerns that the application
      or account might have been compromised.'
    question: 'A later alert in the same incident reported that code was injected into a process and ultimately led to suspicious
      access to the LSASS service. According to that LSASS access alert, what is the name of the file that was involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'hid.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'hid.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Alert 1 (2024-07-10 11:24:45.686939+00:00): The user with account Sid `S-1-5-21-551436448-9871687716-9837441745-1903`
          added a new password-type credential to the OAuth application SimulandApp – an unusual activity that could enable
          further compromise.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Alert 2 (2024-07-04 22:35:02.726557+00:00): A process-injection event was observed coming from the account
          Name `bjenkins`, suggesting malicious code was placed inside another running process.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Alert 3 (2024-07-04 22:35:02.783154+00:00): Suspicious access to LSASS involved the file Name `hid.dll`,
          pointing to a likely attempt to dump credentials from memory.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
