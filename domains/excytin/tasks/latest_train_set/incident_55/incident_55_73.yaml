tasks:
- task_id: incident_55_latest_train_set_task_73
  title: incident_55_latest_train_set_task_73
  description: 'What is the primary email address of the mailbox associated with the user who clicked the malicious URL detected
    on 10 July 2024?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024, a "Sensitive credential memory read" alert was triggered on host "mb-winclient" (Device
      ID 7661dfd4-218f-4016-8a87-66d68a7f098e). The activity originated from process "powershell.exe" (PID 12412) that later
      interacted with "lsass.exe" (PID 760), potentially allowing an attacker to dump credentials for exfiltration. This occurred
      while the machine was communicating with the external IP address 72.5.72.208. Several days after this credential-theft
      attempt, a separate alert indicated that one of the organization’s users clicked a link that was subsequently identified
      as malicious.'
    question: 'What is the primary email address of the mailbox associated with the user who clicked the malicious URL detected
      on 10 July 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An account identified by Sid `S-1-5-21-561436748-3867387497-1732241745-3701` performed a sensitive 
          credential memory read from lsass.exe.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, the mailbox with MailboxPrimaryAddress `bjenkins@niseko.alpineskihouse.co` clicked a 
          malicious URL.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
