tasks:
- task_id: incident_55_latest_train_set_task_83
  title: incident_55_latest_train_set_task_83
  description: 'During the same incident, a malicious PowerShell Cmdlet was later executed on a machine. Which user account
    (provide the sign-in name) was recorded as having invoked that Cmdlet?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of investigating a cloud-related security alert, we observed that Luciano Herrera (luciano
      herrera@niseko.alpineskihouse.co) unexpectedly added a password credential to an OAuth application (AppId 11161) from
      IP 36.193.21.220. Such behavior can indicate adversary access and may precede further malicious activity, including
      endpoint exploitation.'
    question: 'During the same incident, a malicious PowerShell Cmdlet was later executed on a machine. Which user account
      (provide the sign-in name) was recorded as having invoked that Cmdlet?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` unusually added a password 
          credential to the OAuth application “SimulandApp”.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The account with Name `bjenkins` invoked a malicious PowerShell Cmdlet on the machine.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
