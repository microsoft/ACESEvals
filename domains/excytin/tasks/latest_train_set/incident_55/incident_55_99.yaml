tasks:
- task_id: incident_55_latest_train_set_task_99
  title: incident_55_latest_train_set_task_99
  description: 'Which user account (provide the full email address) was identified as having read the AD FS DKM key in the
    final alert of this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 7 July, emails containing the malicious link "http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/"
      were delivered to – and later removed from – the mailbox of santiago@vnevado.alpineskihouse.co. The messages originated
      from 4qs6v9m@vnevado.alpineskihouse.co using the external IP 106.214.87.198. Subsequent alerts indicated the compromised
      user began an internal phishing campaign and later carried out credential-theft activity and hands-on-keyboard actions.
      A few days afterward, the attacker accessed an AD FS Data Protection (DKM) key—an action highlighting potential domain-wide
      compromise.'
    question: 'Which user account (provide the full email address) was identified as having read the AD FS DKM key in the
      final alert of this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – account.Email: `Nina Sullivan@vnevado.alpineskihouse.co` A malicious URL-bearing message was
          delivered to (and later removed from) the mailbox of Nina Sullivan, indicating initial compromise by email.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – account.Sid: `S-1-5-21-561436748-3867387497-1732241745-3701` The compromised user began an
          internal phishing campaign, sending malicious emails to other employees from this SID, showing the attacker moving
          laterally inside the organization.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – process.ExtractedFileName: `lsass.exe` On the same device, a process accessed the memory of
          lsass.exe, dumping credentials that the attacker could reuse for further privilege escalation.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'Step 4 – account.Name: `gsmith` Using the harvested credentials, the attacker operated the Impacket
          toolkit under the user name gsmith, executing commands across the network (hands-on-keyboard activity).'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'Step 5 – account.Email: `gsmith@niseko.alpineskihouse.co` Finally, with the gsmith account the attacker
          read the AD FS DKM key, completing the credential-theft chain and obtaining high-value secrets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
