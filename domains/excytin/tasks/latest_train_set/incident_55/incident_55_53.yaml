tasks:
- task_id: incident_55_latest_train_set_task_53
  title: incident_55_latest_train_set_task_53
  description: 'Which Windows process had its memory accessed in the "Sensitive credential memory read" alert that occurred
    moments after the hardware-discovery activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024, our monitoring flagged a "Suspicious System Hardware Discovery" alert. The activity
      was tied to processes such as "svchost.exe" (PID 2880, running under the netsvcs service host) and a PowerShell script
      (PID 13968) launched by the user account "pwilson" (SID S-1-5-21-551436448-9871687716-9837441745-1903). Just a few seconds
      later, an additional alert titled "Sensitive credential memory read" was raised, indicating that an attacker attempted
      to read the memory of a critical Windows security process in order to harvest credentials.'
    question: 'Which Windows process had its memory accessed in the "Sensitive credential memory read" alert that occurred
      moments after the hardware-discovery activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lsass.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lsass.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: "First, a suspicious process (field: ProcessId__CreatedTimeUtc__CommandLine, value: `12412__2024-07-02T09:47:16.330794Z__\"\
          powershell.exe\" -noexit -command set-location -literalpath 'c:\\users\\bjenkins\\downloads\\midnight14'`) executed
          PowerShell to perform system-hardware discovery."
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, another process accessed LSASS memory (field: ProcessId__CreatedTimeUtc__CommandLine,
          value: `760__2024-07-02T07:28:35.8580921Z__lsass.exe`), indicating a credential-dumping attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
