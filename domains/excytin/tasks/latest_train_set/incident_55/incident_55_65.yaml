tasks:
- task_id: incident_55_latest_train_set_task_65
  title: incident_55_latest_train_set_task_65
  description: 'According to the "Suspicious service registration" alert at 2024-07-04 22:35:03 UTC, which executable was
    registered as a service on the affected system?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that user "Lucas Grey" (email: Lucas Grey@niseko.alpineskihouse.co)
      clicked the malicious URL http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/ from the mailbox
      bjenkins@niseko.alpineskihouse.co on 2024-07-10. Subsequent correlated alerts show that the same activity chain involved
      a malicious PowerShell cmdlet execution and later a suspicious Task Scheduler modification on an endpoint, ultimately
      leading to a suspicious service registration on 2024-07-04 22:35:03 UTC. You are reviewing details of that final "Suspicious
      service registration" alert to determine what file was registered as a service.'
    question: 'According to the "Suspicious service registration" alert at 2024-07-04 22:35:03 UTC, which executable was registered
      as a service on the affected system?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with Sid `S-1-5-21-561436748-3867387497-1732241745-3701` clicked on a malicious URL (alert:
          A potentially malicious URL click was detected).'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'On the same machine, a malicious PowerShell command was executed with ExtractedFileName `powershell.exe`
          (alert: A malicious PowerShell Cmdlet was invoked on the machine).'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'The host `mb-adfs` (HostName `mb-adfs`) showed suspicious Task Scheduler activity aimed at persistence
          (alert: Suspicious Task Scheduler activity).'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Finally, a system program was registered as a service, with ProcessId__CreatedTimeUtc__CommandLine `764__2024-06-20t08:30:13.7925191z__services.exe`,
          indicating another attempt at persistence or privilege escalation (alert: Suspicious service registration).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
