tasks:
- task_id: incident_55_latest_train_set_task_22
  title: incident_55_latest_train_set_task_22
  description: 'A short time later, a separate alert reported that an account accessed the AD FS Delegated Key Management
    (DKM) key. What is the email address of the account that performed this suspected DKM key read?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring has flagged an unusual addition of credentials to an OAuth application named “SimulandApp.”
      The operation was performed by user Luciano Herrera (email: Luciano Herrera@niseko.alpineskihouse.co) from IP address
      2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3 on 2024-07-10. This could indicate that the app was compromised for malicious
      purposes such as phishing or data exfiltration.'
    question: 'A short time later, a separate alert reported that an account accessed the AD FS Delegated Key Management (DKM)
      key. What is the email address of the account that performed this suspected DKM key read?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: An unusual credential of type Password was added to the OAuth application by account Sid 
          `S-1-5-21-551436448-9871687716-9837441745-1903`, indicating possible compromise of user Luciano Herrera.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Immediately before this, reconnaissance was carried out on the host via the process 
          ExtractedFileName `powershell.exe`, flagged as Suspicious System Hardware Discovery.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Hands-on-keyboard lateral-movement activity then occurred when the Impacket toolkit executed a 
          command under account Sid `S-2-5-21-571436798-3864380397-1837441745-3206`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: The attack chain culminated when account Email `gsmith@niseko.alpineskihouse.co` read the AD FS DKM
          key, giving the attacker access to highly sensitive federation secrets.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
