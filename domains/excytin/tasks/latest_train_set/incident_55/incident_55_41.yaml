tasks:
- task_id: incident_55_latest_train_set_task_41
  title: incident_55_latest_train_set_task_41
  description: 'According to the alert about the unusual credential addition, what is the App ID of the cloud application
    “SimulandApp” that received the new password credential?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspected DCSync attack was observed where the account associated with Luciano
      Herrera on workstation MB-WINCLIENT initiated a single directory-replication request to the domain controller MB-DC1.
      Shortly after this activity, the same user performed an unusual action: adding a new password-type credential to the
      cloud application named “SimulandApp,” which could indicate that the application has been compromised and is being leveraged
      for malicious purposes.'
    question: 'According to the alert about the unusual credential addition, what is the App ID of the cloud application “SimulandApp”
      that received the new password credential?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '11161'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '11161'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account Name `Luciano Herrera` initiated a suspected DCSync replication request to MB-DC1.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, the same user added a Password credential to the cloud-application AppId `11161` 
          (SimulandApp), which is considered unusual.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
