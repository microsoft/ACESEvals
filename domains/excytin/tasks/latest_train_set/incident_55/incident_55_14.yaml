tasks:
- task_id: incident_55_latest_train_set_task_14
  title: incident_55_latest_train_set_task_14
  description: 'According to the “System executable renamed and launched” alert that occurred moments after the initial DCSync
    attempt, which account was used to run the renamed Windows executable?'
  inherit_shared: true
  initial_context:
    incident_context: 'Following a suspected DCSync attack in which the user Luciano Herrera (CIO) on workstation MB-WINCLIENT
      initiated a single replication request to domain controller MB-DC1, additional suspicious activity was detected on the
      same day. Shortly after, another alert titled “System executable renamed and launched” was raised, indicating that a
      Windows system executable had been renamed and executed—potentially to evade security controls.'
    question: 'According to the “System executable renamed and launched” alert that occurred moments after the initial DCSync
      attempt, which account was used to run the renamed Windows executable?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-04 22:35:00 UTC, a reconnaissance action was performed with process ExtractedFileName 
          `powershell.exe`, indicating suspicious system-hardware discovery.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: One second later, at 2024-07-04 22:35:01 UTC, a renamed system executable was started under account
          Name `SYSTEM`, showing the attacker escalating activity on the host.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Several days later, on 2024-07-10 11:24:45 UTC, the attacker leveraged the compromised account 
          AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` to perform a DCSync replication request against domain 
          controller MB-DC1, attempting to exfiltrate directory data.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
