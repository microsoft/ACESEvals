tasks:
- task_id: incident_55_latest_train_set_task_39
  title: incident_55_latest_train_set_task_39
  description: 'According to the "Suspicious access to LSASS service" alert, which specific file was involved in the suspicious
    activity against LSASS?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we observed that the user account "pwilson" (SID: S-1-5-21-551436448-9871687716-9837441745-1903)
      ran a PowerShell script named "contosoadfsblatempcreds.ps1" (process ID 13968) on an unidentified host, which triggered
      the alert "A malicious PowerShell Cmdlet was invoked on the machine" at 2024-07-04 22:35:03 UTC. A closely related alert
      raised just moments earlier reported "Suspicious access to LSASS service," indicating potential credential theft activity.'
    question: 'According to the "Suspicious access to LSASS service" alert, which specific file was involved in the suspicious
      activity against LSASS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vaultcli.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vaultcli.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A malicious PowerShell Cmdlet was executed on the host with HostName `mb-winclient`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Immediately before, the file `vaultcli.dll` was used in a suspicious access to the LSASS service, 
          indicating a potential attempt to dump credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
