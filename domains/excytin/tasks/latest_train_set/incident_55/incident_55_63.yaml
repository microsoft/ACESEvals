tasks:
- task_id: incident_55_latest_train_set_task_63
  title: incident_55_latest_train_set_task_63
  description: 'What is the Azure AD user ID (AadUserId) associated with the account that invoked the malicious PowerShell
    Cmdlet?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at 22:35:04 UTC, a "Sensitive credential memory read" alert was raised because memory
      belonging to lsass.exe (process ID 760) was accessed, potentially exposing password hashes. A few seconds earlier, another
      alert on the same host indicated that a malicious PowerShell Cmdlet had been executed. Investigators need to understand
      which user account was responsible for launching that PowerShell activity.'
    question: 'What is the Azure AD user ID (AadUserId) associated with the account that invoked the malicious PowerShell
      Cmdlet?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2de70991-2799-4a95-b734-8e3df3a50118'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '2de70991-2799-4a95-b734-8e3df3a50118'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:03.012758+00:00 a malicious PowerShell Cmdlet was invoked by the user account 
          with field AadUserId=`2de70991-2799-4a95-b734-8e3df3a50118`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: One second later, at 2024-07-04 22:35:04.120690+00:00, a sensitive credential memory read on 
          lsass.exe occurred and was associated with the IP whose Address=`72.5.72.208`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
