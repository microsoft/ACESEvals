tasks:
- task_id: incident_55_latest_train_set_task_68
  title: incident_55_latest_train_set_task_68
  description: 'According to the earlier "Suspicious Task Scheduler activity" alert in this incident, what is the name of
    the executable that the attacker attempted to run through Task Scheduler?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that user account "gsmith" (SID: S-2-5-21-571436798-3864380397-1837441745-3206)
      executed a renamed utility ("iy2orr1e.rrg.exe") from a hidden PowerShell command at 2024-07-06 00:00 UTC. This behavior
      triggered the alert "Attempt to hide use of dual-purpose tool," indicating possible efforts to conceal malicious activity.
      Earlier in the same incident, a related alert reported that the same compromised environment used Windows Task Scheduler
      to automatically run another process, suggesting the attacker was trying to establish persistence.'
    question: 'According to the earlier "Suspicious Task Scheduler activity" alert in this incident, what is the name of the
      executable that the attacker attempted to run through Task Scheduler?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:02.074477+00:00, a Suspicious Task Scheduler activity was detected that used 
          the process with ExtractedFileName `powershell.exe`, indicating an attempt to establish persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, at 2024-07-06 00:09:58.973357+00:00, on the host with HostName `mb-adfs`, an Attempt to hide
          the use of a dual-purpose tool was observed, suggesting the attacker is now operating on this machine while 
          trying to evade detection.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
