  title: incident_55_latest_train_set_task_88
  description: 'A few days after these host-based findings, investigators saw an alert for an "Unusual addition of credentials
    to an OAuth app." What is the Object ID of the OAuth application to which the new password-type credential was added?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4th, an alert indicated that account "gsmith" on host "mb-adfs" launched an unexpectedly-named
      executable (iy2orr1e.rrg.exe) from a hidden PowerShell command, suggesting an attempt to disguise the use of a dual-purpose
      tool. This activity was quickly followed by additional alerts for suspicious remote actions and LDAP reconnaissance,
      pointing to a possible lateral-movement sequence within the environment.'
    question: 'A few days after these host-based findings, investigators saw an alert for an "Unusual addition of credentials
      to an OAuth app." What is the Object ID of the OAuth application to which the new password-type credential was added?'
