tasks:
- task_id: incident_55_latest_train_set_task_30
  title: incident_55_latest_train_set_task_30
  description: 'What is the name of the PowerShell script that was flagged as malicious during this Cmdlet execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, host MB-DC1 was observed reading the AD FS Distributed Key Manager (DKM)
      key (object id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2). A short time later, the user Luciano Herrera (CIO) on workstation
      MB-WINCLIENT initiated a suspected DCSync request to MB-DC1, suggesting possible credential-harvesting activity. Around
      the same period, security telemetry indicates that a malicious PowerShell Cmdlet was executed on a machine—an action
      typically associated with credential theft or reconnaissance.'
    question: 'What is the name of the PowerShell script that was flagged as malicious during this Cmdlet execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'contosoadfsblatempcreds.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'contosoadfsblatempcreds.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A malicious PowerShell Cmdlet was invoked using the file Name `contosoadfsblatempcreds.ps1`, 
          indicating the start of credential-theft activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The attacker then used the account with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118` to perform
          a suspected DCSync attack and replicate directory data from a domain controller.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, the domain controller identified by HostName `MB-DC1` read the AD FS DKM key, confirming 
          that highly sensitive secrets were accessed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
