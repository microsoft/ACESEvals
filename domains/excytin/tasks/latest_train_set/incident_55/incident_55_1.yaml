tasks:
- task_id: incident_55_latest_train_set_task_1
  title: incident_55_latest_train_set_task_1
  description: 'Later in the same incident, an alert flagged a suspected AD FS DKM (Distributed Key Management) key read.
    Which host was reported to have read the DKM key?'
  inherit_shared: true
  initial_context:
    incident_context: 'You are reviewing an incident where the user gsmith (gsmith@niseko.alpineskihouse.co) created a suspicious
      service named DDLOXJDSQSNGMUKKFUXQ on the server MB-ADFS. This activity is being investigated for potential lateral-movement
      or privilege-escalation attempts within the environment.'
    question: 'Later in the same incident, an alert flagged a suspected AD FS DKM (Distributed Key Management) key read. Which
      host was reported to have read the DKM key?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker account (Field: Sid, Value: `S-1-5-21-551436448-9871687716-9837441745-1903`) carried out
          a suspicious system-hardware discovery operation on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'Almost simultaneously, a malicious process (Field: ExtractedFileName, Value: `powershell.exe`) was executed
          through the Impacket toolkit, suggesting hands-on-keyboard lateral-movement activity.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'Several days later, a user (Field: AadUserId, Value: `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`) created
          the suspicious service “DDLOXJDSQSNGMUKKFUXQ” on host MB-ADFS to run potential malicious commands.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'This activity escalated to a suspected DCSync attack in which the domain controller (Field: HostName,
          Value: `MB-DC1`) received an unauthorized directory-replication request.'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'Finally, the same domain controller (Field: HostName, Value: `MB-DC1`) was observed reading the AD FS
          DKM key, confirming compromise of the critical security infrastructure.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
