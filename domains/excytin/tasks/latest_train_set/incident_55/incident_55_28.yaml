tasks:
- task_id: incident_55_latest_train_set_task_28
  title: incident_55_latest_train_set_task_28
  description: 'In the related alert that reports a process being injected with potentially malicious code, what is the name
    of the file (PowerShell script) that was involved in the injection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed a suspected DCSync attack where the user account "Luciano Herrera"
      (CIO) on workstation MB-WINCLIENT issued a single directory-replication request to domain controller MB-DC1 at 2024-07-10
      11:24:45 UTC. This activity raised concerns of credential theft or domain reconnaissance and is linked to additional
      alerts in the same incident.'
    question: 'In the related alert that reports a process being injected with potentially malicious code, what is the name
      of the file (PowerShell script) that was involved in the injection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'contosoadfsblatempcreds.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'contosoadfsblatempcreds.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspected DCSync attack was initiated by the account with AadUserId 
          `2de70991-2799-4a95-b734-8e3df3a50118`, which sent a replication request from host MB-WINCLIENT to domain 
          controller MB-DC1.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Earlier, a process‐injection event involved the file `contosoadfsblatempcreds.ps1`, indicating 
          potentially malicious code was loaded into another process.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
