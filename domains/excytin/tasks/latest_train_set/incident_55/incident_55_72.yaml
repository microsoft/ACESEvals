tasks:
- task_id: incident_55_latest_train_set_task_72
  title: incident_55_latest_train_set_task_72
  description: 'According to the alert titled "Attempt to hide use of dual-purpose tool", what is the Azure AD user ID (AadUserId)
    of the account associated with this suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious sequence of exploration activities, several processes were
      observed on a compromised host, including multiple invocations of "powershell.exe" with encoded commands, a suspiciously-named
      executable ("iy2orr1e.rrg.exe") running hidden, and reconnaissance commands such as "whoami.exe". Just moments later,
      another alert flagged an "Attempt to hide use of dual-purpose tool", indicating that an attacker tried to disguise a
      publicly available utility by renaming it. This second alert is tied to a specific Azure Active Directory (AAD) user
      account identified in the telemetry, which is important for attributing the activity to a particular identity.'
    question: 'According to the alert titled "Attempt to hide use of dual-purpose tool", what is the Azure AD user ID (AadUserId)
      of the account associated with this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious exploration process was executed (Field: ProcessId__CreatedTimeUtc__CommandLine, Value:
          `3116__2024-07-02t09:48:23.9439954z__"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, an attempt to hide the use of a dual-purpose tool was linked to a risky user (Field: AadUserId,
          Value: `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
