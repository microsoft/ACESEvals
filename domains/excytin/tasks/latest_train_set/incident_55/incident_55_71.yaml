tasks:
- task_id: incident_55_latest_train_set_task_71
  title: incident_55_latest_train_set_task_71
  description: 'According to the "Suspicious service registration" alert raised on 2024-07-04 at 22:35:03 UTC, which executable
    was registered as a Windows service (provide only the executable file name)?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation that began with the removal of emails containing a malicious URL sent to the
      mailbox santiago@vnevado.alpineskihouse.co, several follow-on alerts were generated. After the initial email threat,
      the same user account was later observed sending internal phishing messages, and malicious PowerShell activity was detected
      on an endpoint that subsequently showed signs of an Impacket-based hands-on-keyboard attack. A few seconds later, Microsoft
      Defender raised a "Suspicious service registration" alert indicating that an attacker had registered a system program
      as a Windows service in order to establish persistence or elevate privileges.'
    question: 'According to the "Suspicious service registration" alert raised on 2024-07-04 at 22:35:03 UTC, which executable
      was registered as a Windows service (provide only the executable file name)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'Phishing phase: An email containing a malicious URL was delivered and later removed for the user account
          with field AadUserId=`28058d92-fc24-4869-9231-6546a34b00f2`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'Account takeover & propagation: The (likely) compromised user with field Sid=`S-1-5-21-561436748-3867387497-1732241745-3701`
          then sent an internal phishing campaign to other employees.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'Execution: A malicious PowerShell command was run via the process with field ExtractedFileName=`powershell.exe`,
          indicating code-execution on the machine.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'Lateral movement: Impacket activity was observed on the device with field HostName=`mb-adfs`, showing
          the attacker attempting to move laterally across the network.'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'Persistence / privilege escalation: The attacker registered a new service by running the binary specified
          in field ProcessId__CreatedTimeUtc__CommandLine=`764__2024-06-20t08:30:13.7925191z__services.exe`, helping them
          maintain access to the system.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
