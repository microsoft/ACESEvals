tasks:
- task_id: incident_55_latest_train_set_task_85
  title: incident_55_latest_train_set_task_85
  description: 'According to the "System executable renamed and launched" alert raised at 22:35:01 UTC, which account name
    was used to run the renamed Windows executable?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation that began with a "Suspicious System Hardware Discovery" alert (22:35:00 UTC
      on 2024-07-04), analysts noted a process "svchost.exe" running under various user sessions on host 7661dfd4-218f-4016-8a87-66d68a7f098e.
      Just one second later, a related alert reported that a Windows system executable had been renamed and executed, suggesting
      an attempt to evade standard detections. The alert identifies the account that initiated this renamed executable.'
    question: 'According to the "System executable renamed and launched" alert raised at 22:35:01 UTC, which account name
      was used to run the renamed Windows executable?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attacker initiated hardware discovery using the process with ExtractedFileName `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, a renamed Windows executable was launched under the account Name `SYSTEM`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
