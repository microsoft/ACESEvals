tasks:
- task_id: incident_55_latest_train_set_task_89
  title: incident_55_latest_train_set_task_89
  description: 'According to the later alert about email messages with a malicious URL being removed after delivery, which
    user’s mailbox (provide the full email address) was affected?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4, 2024, Defender raised the alert "Suspicious sequence of exploration activities" on a device
      (AAD device ID 7661dfd4-218f-4016-8a87-66d68a7f098e). Several commands were run, including PowerShell scripts (e.g.,
      "powershell.exe -noexit -command set-location ..." and "powershell.exe c:\script\contosoadfsblatempcreds.ps1"), the
      "whoami.exe /user" command, and activity from "svchost.exe". The activity was executed under local user accounts such
      as "pwilson" and "bjenkins". A few days later, another alert in the same incident reported that email messages containing
      a malicious URL were delivered to a mailbox but subsequently removed.'
    question: 'According to the later alert about email messages with a malicious URL being removed after delivery, which
      user’s mailbox (provide the full email address) was affected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Lucas Grey@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Lucas Grey@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user with account Sid `S-1-5-21-561436748-3867387497-1732241745-3701` executed a suspicious 
          sequence of Windows exploration commands.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, an email account with Email `Lucas Grey@niseko.alpineskihouse.co` had messages containing 
          malicious URLs removed after delivery.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
