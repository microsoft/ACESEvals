tasks:
- task_id: incident_55_latest_train_set_task_51
  title: incident_55_latest_train_set_task_51
  description: 'What is the Security Identifier (SID) of the user account that triggered the suspicious remote activity related
    to the services.exe registration incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious service registration where the system program "services.exe"
      (process ID 764, created at 2024-06-20T08:30:13Z) was registered as a Windows service, we discovered a related alert
      that flagged suspicious remote activity taking place on the same machine just seconds earlier. This second alert points
      to a specific user account suspected of initiating remote commands against the host.'
    question: 'What is the Security Identifier (SID) of the user account that triggered the suspicious remote activity related
      to the services.exe registration incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was initiated by the account with Sid 
          `S-2-5-21-571436798-3864380397-1837441745-3206`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A system program was registered as a service on host `mb-adfs`, indicating possible persistence 
          activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
