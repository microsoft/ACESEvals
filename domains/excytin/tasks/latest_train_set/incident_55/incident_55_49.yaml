tasks:
- task_id: incident_55_latest_train_set_task_49
  title: incident_55_latest_train_set_task_49
  description: 'According to the Task Scheduler alert, what was the name of the executable that issued the command to create
    the scheduled task "run-exportadfstokensignincert.2024-07-02_09_48_23"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed a suspicious sequence of exploration activity initiated under
      the account "gsmith". The attacker ran several Windows commands, including "whoami.exe" and an obfuscated command via
      the binary "iy2orr1e.rrg.exe" on 2024-07-02 at around 09:48 UTC. Just moments later, a separate alert reported that
      a process invoked Task Scheduler to create a daily task called "run-exportadfstokensignincert.2024-07-02_09_48_23" which
      would execute the same encoded command, indicating an attempt to establish persistence.'
    question: 'According to the Task Scheduler alert, what was the name of the executable that issued the command to create
      the scheduled task "run-exportadfstokensignincert.2024-07-02_09_48_23"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'schtasks.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious exploration was performed by a process whose ExtractedFileName field has the value 
          `iy2orr1e.rrg.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'That same binary was then persisted via Task Scheduler: the process whose ProcessId__CreatedTimeUtc__CommandLine
          field has the value `4304__2024-07-02t09:48:23.4654342z__"schtasks.exe" /create /ru niseko\adfsadmin /rp toptc88coob3xvxtpbr8
          /sc daily /tn run-exportadfstokensignincert.2024-07-02_09_48_23 /tr "iy2orr1e.rrg.exe -windowstyle hidden -encodedcommand
          qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=" /st
          00:00:00 /f` created a scheduled task that runs `iy2orr1e.rrg.exe` daily.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
