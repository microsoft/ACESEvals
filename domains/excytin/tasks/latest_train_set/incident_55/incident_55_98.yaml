tasks:
- task_id: incident_55_latest_train_set_task_98
  title: incident_55_latest_train_set_task_98
  description: 'A related cloud sign-in associated with this incident was traced to an Azure AD identity. What is the Azure
    AD user ID (AadUserId) of the account involved in that cloud activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an incident flagged as an "Attempt to hide use of dual-purpose tool," analysts
      observed that on host "mb-adfs" the user "gsmith" executed an oddly-named binary (iy2orr1e.rrg.exe) from a hidden PowerShell
      command at 2024-07-02T09:48:23Z. This behavior suggests the user might have been trying to disguise the use of a well-known
      public tool for potentially malicious purposes.'
    question: 'A related cloud sign-in associated with this incident was traced to an Azure AD identity. What is the Azure
      AD user ID (AadUserId) of the account involved in that cloud activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:01.567512+00:00, an attempt to hide use of a dual-purpose tool was detected for
          the account (Field: AadUserId, Value: `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
