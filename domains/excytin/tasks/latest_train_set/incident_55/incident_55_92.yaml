tasks:
- task_id: incident_55_latest_train_set_task_92
  title: incident_55_latest_train_set_task_92
  description: 'According to the follow-up alert about the suspicious exploration commands, what is the SID of the account
    that ran those commands?'
  inherit_shared: true
  initial_context:
    incident_context: 'At 22:35:01 UTC on 2024-07-04, an alert titled “System executable renamed and launched” was raised
      after a Windows executable was run under the built-in SYSTEM account (SID S-2-2-78). Only two seconds later, a follow-up
      alert, “Suspicious sequence of exploration activities,” indicated that a different user account executed a chain of
      reconnaissance commands, suggesting possible lateral-movement preparation.'
    question: 'According to the follow-up alert about the suspicious exploration commands, what is the SID of the account
      that ran those commands?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A renamed Windows system executable (ExtractedFileName `iy2orr1e.rrg.exe`) was launched on the 
          host.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly afterwards, a suspicious sequence of exploration commands was executed by the account with 
          SID `S-2-5-21-571436798-3864380397-1837441745-3206`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
