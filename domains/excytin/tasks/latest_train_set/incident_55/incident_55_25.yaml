tasks:
- task_id: incident_55_latest_train_set_task_25
  title: incident_55_latest_train_set_task_25
  description: 'In the follow-up alert titled "Suspected AD FS DKM key read" raised on 2024-07-10, which user account (email
    address) was identified as having read the DKM key?'
  inherit_shared: true
  initial_context:
    incident_context: 'Analysts are reviewing a sequence of events that began with an "Ongoing hands-on-keyboard attack via
      Impacket toolkit" alert on host "mb-adfs" (observed on 2024-07-04). The initial alert showed suspicious use of PowerShell
      and LSASS, executed under the LocalSystem account, suggesting possible lateral-movement activity. A few days later,
      another alert indicated that someone accessed the Active Directory Federation Services (AD FS) Data Protection Master
      (DKM) key, an action often linked to credential theft or persistence.'
    question: 'In the follow-up alert titled "Suspected AD FS DKM key read" raised on 2024-07-10, which user account (email
      address) was identified as having read the DKM key?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Account Name: gsmith – Executed suspicious hands-on-keyboard commands via the Impacket toolkit on 2024-07-04
          22:35:01 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Account Email: gsmith@niseko.alpineskihouse.co – Subsequently accessed and read the AD FS DKM key (object
          id 4cac49d3-29d3-407e-8c9b-b7ebb21541b2) on 2024-07-10 11:24:45 UTC.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
