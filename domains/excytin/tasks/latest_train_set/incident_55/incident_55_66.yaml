tasks:
- task_id: incident_55_latest_train_set_task_66
  title: incident_55_latest_train_set_task_66
  description: 'According to the alert stating that "Email messages containing malicious URL were removed after delivery",
    what was the IP address of the original sender of those e-mail messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed user account "gsmith" executing a renamed tool (iy2orr1e.rrg.exe)
      on host "mb-adfs" on 2024-07-04. The alert described this as an attempt to hide the use of a dual-purpose tool that
      could be leveraged for malicious purposes. Subsequent alerts in the same incident later pointed to suspicious e-mail
      activity where messages containing malicious URLs were delivered and then automatically removed.'
    question: 'According to the alert stating that "Email messages containing malicious URL were removed after delivery",
      what was the IP address of the original sender of those e-mail messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '106.214.87.198'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '106.214.87.198'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: The attacker first deployed a dual-purpose tool that appeared under an unexpected name, process 
          ExtractedFileName `iy2orr1e.rrg.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: Next, a renamed Windows executable was launched – process ExtractedFileName `powershell.exe` – 
          likely to execute or control the hidden tool.
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: The attacker then tried to dump credentials from LSASS while running under account AadUserId 
          `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: Using the obtained credentials, account Sid `S-1-5-11-7842151660-4834030208-105586563-1139` was 
          observed sending internal phishing emails.
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: Those phishing messages originated from mailmessage SenderIP `106.214.87.198`, and were 
          subsequently detected and removed.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
