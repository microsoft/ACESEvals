tasks:
- task_id: incident_55_latest_train_set_task_62
  title: incident_55_latest_train_set_task_62
  description: 'According to the alert "Attempt to hide use of dual-purpose tool" raised at 22:35:01 UTC on 2024-07-04, which
    user account name was tied to this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a July 4th security incident, analysts observed a malicious PowerShell cmdlet
      executed from the Downloads folder of user "bjenkins" on device 7661dfd4-218f-4016-8a87-66d68a7f098e (originating from
      IP 72.5.72.208). Only seconds later, additional alerts were triggered: one for suspicious Impacket activity and another
      titled "Attempt to hide use of dual-purpose tool," indicating that an attacker may have renamed a legitimate public
      tool to avoid detection. This final alert is associated with a specific user account.'
    question: 'According to the alert "Attempt to hide use of dual-purpose tool" raised at 22:35:01 UTC on 2024-07-04, which
      user account name was tied to this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:01.395957+00:00, a suspicious Impacket command was executed by the account with
          field AadUserId and value `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`, indicating possible lateral-movement 
          activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Seconds later, at 2024-07-04 22:35:01.567512+00:00, the attacker tried to conceal a dual-purpose 
          tool under an unexpected filename while signed in as the account whose Name field equals `gsmith`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, at 2024-07-04 22:35:03.012758+00:00, code execution culminated in a malicious PowerShell 
          cmdlet launched with the process whose ExtractedFileName field is `powershell.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
