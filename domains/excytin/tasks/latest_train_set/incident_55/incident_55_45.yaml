tasks:
- task_id: incident_55_latest_train_set_task_45
  title: incident_55_latest_train_set_task_45
  description: 'Later in the same incident, the user pwilson@niseko.alpineskihouse.co added a password credential to an OAuth
    application (alert: "Unusual addition of credentials to an OAuth app"). What IPv6 address was associated with this suspicious
    credential-addition event?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we found that, on host "mb-winclient", a malicious PowerShell cmdlet was launched
      (process "powershell.exe" with ID 12412) from the folder "c:\users\bjenkins\downloads\midnight14" and later another
      instance (process ID 13968) executed the script "contosoadfsblatempcreds.ps1". This activity was performed under the
      accounts bjenkins and pwilson and raised the alert "A malicious PowerShell Cmdlet was invoked on the machine" because
      it may be related to credential theft or exploitation attempts.'
    question: 'Later in the same incident, the user pwilson@niseko.alpineskihouse.co added a password credential to an OAuth
      application (alert: "Unusual addition of credentials to an OAuth app"). What IPv6 address was associated with this suspicious
      credential-addition event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A malicious PowerShell Cmdlet was executed by the account with Sid 
          `S-1-5-21-551436448-9871687716-9837441745-1903`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, credentials were unusually added to an OAuth application from the IP address 
          `2801:e0a:1eb:dea0:642e:5bb6:d315:fbb3`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
