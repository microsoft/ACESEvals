tasks:
- task_id: incident_55_latest_train_set_task_32
  title: incident_55_latest_train_set_task_32
  description: 'According to the later alert that reported a user clicking a malicious link on the affected device, what is
    the exact URL that was accessed?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4, suspicious remote activity was detected on host "mb-adfs". The activity involved the user
      "gsmith" (running under LocalSystem) spawning both cmd.exe and an encoded PowerShell command. Moments later, a second
      alert reported that malicious code had been injected into another process on the same machine. A few days after these
      events, the device raised a new alert indicating that someone had clicked a malicious URL, suggesting a possible progression
      from local compromise to external command-and-control communication.'
    question: 'According to the later alert that reported a user clicking a malicious link on the affected device, what is
      the exact URL that was accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was detected where the process with ExtractedFileName `powershell.exe` 
          was launched.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A process was injected with potentially malicious code on the host with HostName `mb-winclient`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Later, a malicious URL was clicked on that device: Url `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
