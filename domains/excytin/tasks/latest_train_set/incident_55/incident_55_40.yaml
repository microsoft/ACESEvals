tasks:
- task_id: incident_55_latest_train_set_task_40
  title: incident_55_latest_train_set_task_40
  description: 'In the follow-up alert titled "Suspicious service registration," which executable (file name) was identified
    as being registered as a service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a suspicious sequence of exploration activities on July 4 2024, we observed
      several PowerShell and reconnaissance commands (including multiple launches of "whoami.exe" and an encoded PowerShell
      payload run by "iy2orr1e.rrg.exe"). These activities were executed under the user account "gsmith" and were linked to
      the same host (hostname withheld). Shortly after these discovery commands, another alert was raised indicating that
      a system program had been registered as a Windows service—an action often associated with establishing persistence or
      escalating privileges.'
    question: 'In the follow-up alert titled "Suspicious service registration," which executable (file name) was identified
      as being registered as a service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The host identified by HostName `mb-adfs` executed a suspicious sequence of exploration commands, 
          suggesting initial compromise or reconnaissance.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A process with ProcessId__CreatedTimeUtc__CommandLine 
          `764__2024-06-20t08:30:13.7925191z__services.exe` was subsequently registered as a service, indicating a 
          likely attempt to establish persistence on the same system.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
