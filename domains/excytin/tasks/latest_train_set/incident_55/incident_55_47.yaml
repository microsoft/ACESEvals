tasks:
- task_id: incident_55_latest_train_set_task_47
  title: incident_55_latest_train_set_task_47
  description: 'Which user account was identified as adding a new password-type credential to the OAuth application "SimulandApp"
    during the follow-up alert on July 7 2024?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that on July 4 2024 a process accessed LSASS memory (process name:
      lsass.exe, PID 760) on an endpoint – an activity often associated with credential dumping. Shortly before that, another
      alert indicated code injection into a separate process, suggesting malicious code execution. A few days later, investigators
      noted that credentials were unexpectedly added to a corporate OAuth application named “SimulandApp,” raising concerns
      that the earlier credential-theft activity may have enabled unauthorized changes to the app.'
    question: 'Which user account was identified as adding a new password-type credential to the OAuth application "SimulandApp"
      during the follow-up alert on July 7 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: "Alert: Sensitive credential memory read – Field: ProcessId__CreatedTimeUtc__CommandLine, Value: `12412__2024-07-02t09:47:16.330794z__\"\
          powershell.exe\" -noexit -command set-location -literalpath 'c:\\users\\bjenkins\\downloads\\midnight14'` – A PowerShell
          process (PID 12412) started on 2024-07-02 and accessed lsass.exe memory, likely to harvest credentials."
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Alert: A process was injected with potentially malicious code – Field: Sid, Value: `S-1-5-21-551436448-9871687716-9837441745-1903`
          – The account with SID S-1-5-21-551436448-9871687716-9837441745-1903 was involved in code injection, indicating
          malicious execution inside another process.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Alert: Unusual addition of credentials to an OAuth app – Field: Name, Value: `Luciano Herrera` – The
          user Luciano Herrera added a password-type credential to the OAuth application SimulandApp, which is suspicious
          and may reflect account compromise.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
