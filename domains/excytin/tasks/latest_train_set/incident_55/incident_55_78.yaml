tasks:
- task_id: incident_55_latest_train_set_task_78
  title: incident_55_latest_train_set_task_78
  description: 'According to the final alert in this sequence ("Attempt to hide use of dual-purpose tool"), which user account
    was associated with that suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, analysts observed that the domain controller "MB-DC1" accessed an AD FS DKM
      key on 2024-07-10, triggering the alert "Suspected AD FS DKM key read". A series of related alerts followed the same
      threat path, and the final alert in this chain—raised on 2024-07-04 22:35:01 UTC—reported an attempt to hide the use
      of a dual-purpose tool on a machine.'
    question: 'According to the final alert in this sequence ("Attempt to hide use of dual-purpose tool"), which user account
      was associated with that suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: An attempt was made to hide a dual-purpose tool by the account with Name `gsmith` (account Name).
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: The same account with Name `gsmith` (account Name) initiated a suspicious sequence of exploration 
          commands.
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: A malicious PowerShell Cmdlet was executed through the process with ExtractedFileName 
          `powershell.exe` (process ExtractedFileName).
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: The user identified by SID `S-1-5-21-551436448-9871687716-9837441745-1903` (account Sid) performed 
          a suspected DCSync replication request to the domain controller MB-DC1.
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: The domain controller with HostName `MB-DC1` (host HostName) subsequently read the ADFS DKM key, 
          indicating potential compromise of the directory services.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
