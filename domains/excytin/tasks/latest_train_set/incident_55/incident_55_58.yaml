tasks:
- task_id: incident_55_latest_train_set_task_58
  title: incident_55_latest_train_set_task_58
  description: 'According to the "System executable renamed and launched" alert raised on 2024-07-04 22:35:01 UTC, what is
    the name of the account that ran the renamed executable?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an email-borne threat, security teams noted that a message containing a
      malicious URL (https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/) was sent from santiago@vnevado.alpineskihouse.co
      to bjenkins@niseko.alpineskihouse.co on July 9 2024 and subsequently removed by the mail hygiene system. Pivoting from
      this phishing activity, telemetry shows that five days earlier, the same user environment experienced a "Suspicious
      System Hardware Discovery" event, immediately followed by an alert indicating a Windows system executable had been renamed
      and launched—an action often used by attackers to evade signature-based detection. Analysts now need to determine which
      built-in account actually executed the renamed system file.'
    question: 'According to the "System executable renamed and launched" alert raised on 2024-07-04 22:35:01 UTC, what is
      the name of the account that ran the renamed executable?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-09 11:49:57.362974+00:00, an email containing a malicious URL was delivered and later 
          removed for the user account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-04 22:35:00.746663+00:00, a suspicious system hardware discovery took place using the 
          process with ExtractedFileName `powershell.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: One second later, at 2024-07-04 22:35:01.543723+00:00, a renamed Windows executable was launched 
          under the built-in account Name `SYSTEM`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
