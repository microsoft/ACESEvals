  title: incident_55_latest_train_set_task_60
  description: 'Provide the exact URL that was identified in the "Malicious URL was clicked on that device" alert raised on
    2024-07-10.'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed that on host "mb-adfs" the process "iy2orr1e.rrg.exe" (a renamed
      system executable) was launched from a PowerShell command on 2024-07-04. Immediately afterwards a suspicious LDAP query
      was executed from the same device. Several days later, on 2024-07-10 at 11:24 UTC, the same machine generated an alert
      titled "Malicious URL was clicked on that device," indicating that a user had browsed to a potentially harmful web address.'
    question: 'Provide the exact URL that was identified in the "Malicious URL was clicked on that device" alert raised on
      2024-07-10.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
