        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A renamed Windows system executable was launched with ExtractedFileName `powershell.exe` (Time: 2024-07-04
          22:35:01.543723+00:00).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, a suspicious LDAP query was executed from the host identified by AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`
          (Time: 2024-07-04 22:35:03.848291+00:00).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
