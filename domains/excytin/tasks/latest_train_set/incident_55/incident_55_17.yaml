tasks:
- task_id: incident_55_latest_train_set_task_17
  title: incident_55_latest_train_set_task_17
  description: 'Which user account (provide the email address) was identified as performing the suspected DCSync replication
    request from MB-WINCLIENT to MB-DC1?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed that a user on a workstation accessed the malicious URL https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/
      on 2024-07-10 at 11:24 UTC, triggering the alert “Malicious URL was clicked on that device.” Shortly afterward, the
      same machine generated a “Suspicious System Hardware Discovery” alert, and later a “Suspected DCSync attack (replication
      of directory services)” alert indicating that a single replication request was sent from the workstation MB-WINCLIENT
      to the domain controller MB-DC1. Your task is to identify details about the account involved in this final DCSync alert.'
    question: 'Which user account (provide the email address) was identified as performing the suspected DCSync replication
      request from MB-WINCLIENT to MB-DC1?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-10 11:24:45.667104+00:00, the host with HostName `mb-winclient` was used to click a 
          malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: At 2024-07-04 22:35:00.746663+00:00, the account with Sid 
          `S-1-5-21-551436448-9871687716-9837441745-1903` performed suspicious system hardware discovery.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: At 2024-07-10 11:24:45.469423+00:00, the account with Email `Luciano 
          Herrera@niseko.alpineskihouse.co` initiated a suspected DCSync attack.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
