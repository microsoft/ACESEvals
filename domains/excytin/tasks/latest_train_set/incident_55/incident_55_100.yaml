tasks:
- task_id: incident_55_latest_train_set_task_100
  title: incident_55_latest_train_set_task_100
  description: 'According to the follow-up alert about the suspicious exploration activity, what was the name of the executable
    that was run to perform the reconnaissance?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we identified that user account ''gsmith'' (SID S-2-5-21-571436798-3864380397-1837441745-3206,
      Azure AD ID ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5) ran an obfuscated executable named "iy2orr1e.rrg.exe" with a hidden,
      base-64–encoded PowerShell command on host "mb-adfs". Microsoft Defender raised the alert "Attempt to hide use of dual-purpose
      tool" at 2024-07-04 22:35:01 UTC, indicating the file might be masking malicious activity. Just two seconds later, another
      alert titled "Suspicious sequence of exploration activities" was triggered because a separate process invoked several
      Windows discovery commands, suggesting the attacker began enumerating the environment after initial execution.'
    question: 'According to the follow-up alert about the suspicious exploration activity, what was the name of the executable
      that was run to perform the reconnaissance?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'whoami.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'whoami.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Alert: Attempt to hide use of dual-purpose tool – The activity was detected on host (HostName: `mb-adfs`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Alert: Suspicious sequence of exploration activities – The suspicious process executed was (ExtractedFileName:
          `whoami.exe`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
