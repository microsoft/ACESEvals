tasks:
- task_id: incident_55_latest_train_set_task_67
  title: incident_55_latest_train_set_task_67
  description: 'According to the final alert in this chain ("Email messages containing malicious URL removed after delivery"),
    what is the email address of the internal recipient who received the malicious email?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed that the user Luciano Herrera added a new password-type credential
      to an OAuth application (SimulandApp). Shortly afterwards, the same user context was tied to a process-injection alert
      and then to an internal phishing campaign originating from a corporate device. The sequence culminated in an alert titled
      "Email messages containing malicious URL removed after delivery", indicating that at least one internal recipient had
      already received the malicious message before it was retracted.'
    question: 'According to the final alert in this chain ("Email messages containing malicious URL removed after delivery"),
      what is the email address of the internal recipient who received the malicious email?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-04 22:35:02.726557 +00:00, a process was injected with potentially malicious code under 
          the account whose AadUserId is `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-07 08:54:40.074602 +00:00, email messages that contained malicious URLs and were 
          addressed to the recipient `santiago@vnevado.alpineskihouse.co` were removed after delivery.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: A little later, on 2024-07-07 10:09:33.920702 +00:00, an internal phishing campaign was carried out
          by the account whose Sid is `S-1-5-11-7842151660-4834030208-105586563-1139`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Finally, on 2024-07-10 11:24:45.686939 +00:00, the account whose Sid is 
          `S-1-5-21-551436448-9871687716-9837441745-1903` (Luciano Herrera) made an unusual addition of a Password 
          credential to the OAuth application ‘SimulandApp’.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
