tasks:
- task_id: incident_55_latest_train_set_task_46
  title: incident_55_latest_train_set_task_46
  description: 'Provide the exact URL that was clicked on July 10 2024 and triggered the "Malicious URL was clicked on that
    device" alert.'
  inherit_shared: true
  initial_context:
    incident_context: 'On the device named "mb-adfs", a suspicious sequence of exploration commands (including encoded PowerShell
      and enumeration with "whoami.exe") was observed on July 4 2024 under the user account "gsmith". Soon after, the same
      host showed an alert for suspicious access to the LSASS process, suggesting an attempt to harvest credentials. Several
      days later, on July 10 2024, a security alert reported that a malicious URL had been clicked from this device.'
    question: 'Provide the exact URL that was clicked on July 10 2024 and triggered the "Malicious URL was clicked on that
      device" alert.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A process with ExtractedFileName `powershell.exe` executed a suspicious sequence of exploration 
          commands (2024-07-04 22:35:03 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: On the same machine, a suspicious access to LSASS was observed on the host with AadDeviceId 
          `7661dfd4-218f-4016-8a87-66d68a7f098e` (2024-07-04 22:35:02 UTC).
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Subsequently, a malicious URL click was detected: `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`
          (field Url) on that device (2024-07-10 11:24:45 UTC).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
