tasks:
- task_id: incident_55_latest_train_set_task_79
  title: incident_55_latest_train_set_task_79
  description: 'Several days after the suspicious PowerShell activity, a user on the same device clicked a malicious link.
    Provide the full URL that was clicked.'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a security incident, we observed the user account "bjenkins" executing a suspicious
      PowerShell script named "contosoadfsblatempcreds.ps1" on the host (hostname not yet confirmed). The script was launched
      twice via different PowerShell commands, one of which originated from the Downloads folder. This activity raises concerns
      of credential theft or other malicious behavior.'
    question: 'Several days after the suspicious PowerShell activity, a user on the same device clicked a malicious link.
      Provide the full URL that was clicked.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A malicious PowerShell cmdlet was executed on the host with HostName `mb-winclient`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, a malicious URL with Url 
          `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/` was clicked on the same device.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
