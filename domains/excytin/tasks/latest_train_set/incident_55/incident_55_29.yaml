tasks:
- task_id: incident_55_latest_train_set_task_29
  title: incident_55_latest_train_set_task_29
  description: 'Retrieve the Security Identifier (SID) of the account associated with the “Suspicious System Hardware Discovery”
    alert from 2024-07-04 22:35 UTC.'
  inherit_shared: true
  initial_context:
    incident_context: 'Your investigation begins with an alert from 2024-07-09 titled “Email messages containing malicious
      URL removed after delivery”. The message had been sent from santiago@vnevado.alpineskihouse.co to bjenkins@niseko.alpineskihouse.co,
      involved the user account "Lucas Grey", and contained the URL https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/.
      While examining related entities you notice that the account’s SID is missing and that this email activity is linked
      (via shared entities) to an earlier alert raised on 2024-07-04 for “Suspicious System Hardware Discovery”, where an
      attacker apparently queried hardware information on a device. You need to identify which account (by SID) carried out
      that discovery activity to complete your incident timeline.'
    question: 'Retrieve the Security Identifier (SID) of the account associated with the “Suspicious System Hardware Discovery”
      alert from 2024-07-04 22:35 UTC.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-551436448-9871687716-9837441745-1903'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-551436448-9871687716-9837441745-1903'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An email message containing a malicious URL was delivered and later removed for the account with 
          Sid `S-1-5-21-561436748-3867387497-1732241745-3701`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, suspicious system hardware discovery activity was detected originating from the account with
          Sid `S-1-5-21-551436448-9871687716-9837441745-1903`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
