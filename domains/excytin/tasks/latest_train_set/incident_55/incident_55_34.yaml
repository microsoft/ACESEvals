tasks:
- task_id: incident_55_latest_train_set_task_34
  title: incident_55_latest_train_set_task_34
  description: 'What is the hostname of the device that accessed the AD FS DKM key, as reported in the "Suspected AD FS DKM
    key read" alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we noted that a malicious URL (https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/)
      was clicked from an endpoint, which later showed signs of system-hardware discovery activity. A few minutes after that,
      a “Suspected DCSync attack” alert reported that the workstation MB-WINCLIENT attempted directory-service replication.
      Shortly thereafter, another alert titled “Suspected AD FS DKM key read” indicated that a different device (a domain
      controller) accessed the AD FS Distributed Key Manager (DKM) key.'
    question: 'What is the hostname of the device that accessed the AD FS DKM key, as reported in the "Suspected AD FS DKM
      key read" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Alert shows a malicious URL was clicked on the device with HostName = `mb-winclient`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: The same device then raised an alert for Suspicious System Hardware Discovery performed under the 
          account with Sid = `S-1-5-21-551436448-9871687716-9837441745-1903`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Shortly after, the attacker initiated a suspected DCSync attack, where the device with HostName = 
          `mb-winclient` sent a replication request to the domain controller with HostName = `MB-DC1`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Finally, the domain controller with HostName = `MB-DC1` was observed reading the AD FS DKM key, 
          indicating possible credential-theft-related activity on that host.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
