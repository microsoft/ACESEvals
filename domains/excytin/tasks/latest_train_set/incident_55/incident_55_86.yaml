tasks:
- task_id: incident_55_latest_train_set_task_86
  title: incident_55_latest_train_set_task_86
  description: 'According to the later alert about a suspicious service creation, which user account (provide the email address)
    established the service named DDLOXJDSQSNGMUKKFUXQ on the system MB-ADFS?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a security incident, analysts observed that the user account “bjenkins”
      was linked to a process (lsass.exe, PID 760) running on host “mb-winclient.” This activity triggered an alert titled
      “Suspicious access to LSASS service,” which can indicate an attempt to harvest clear-text credentials for later lateral
      movement. Shortly after, another alert reported “Ongoing hands-on-keyboard attack via Impacket toolkit,” suggesting
      the threat actor may be leveraging stolen credentials to pivot across the network and create persistence mechanisms
      elsewhere.'
    question: 'According to the later alert about a suspicious service creation, which user account (provide the email address)
      established the service named DDLOXJDSQSNGMUKKFUXQ on the system MB-ADFS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Process – ExtractedFileName: `powershell.exe` was observed accessing LSASS memory on 2024-07-04 22:35:02.783154
          +00:00, indicating an attempt to dump credentials.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Account – Name: `gsmith` executed a command via the Impacket toolkit on 2024-07-04 22:35:01.395957 +00:00,
          suggesting hands-on-keyboard lateral-movement activity.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Account – Email: `gsmith@niseko.alpineskihouse.co` subsequently created the suspicious service `DDLOXJDSQSNGMUKKFUXQ`
          on 2024-07-10 11:24:45.488649 +00:00, showing continuation of malicious actions under the same user identity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
