tasks:
- task_id: incident_39_latest_train_set_task_72
  title: incident_39_latest_train_set_task_72
  description: 'According to the final alert in this sequence, what is the full URL that was clicked and classified as potentially
    malicious?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-10 an alert flagged a suspected overpass-the-hash (Kerberos) attempt in which the account
      "Emma Clark" on workstation VNEVADO-Win10V tried to authenticate to the domain controller. Within the same second, another
      alert reported that user "Ethan Brooks" on the same workstation performed SMB reconnaissance against the domain controller.
      Immediately afterward, a third alert was raised indicating that a user had clicked a link later determined to be malicious.'
    question: 'According to the final alert in this sequence, what is the full URL that was clicked and classified as potentially
      malicious?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: HostName `VNEVADO-Win10V` was involved in a suspected overpass-the-hash (Kerberos) authentication 
          attempt.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` performed SMB user and IP address 
          reconnaissance.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A potentially malicious URL click was detected on Url 
          `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
