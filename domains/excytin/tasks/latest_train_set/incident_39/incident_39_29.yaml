tasks:
- task_id: incident_39_latest_train_set_task_29
  title: incident_39_latest_train_set_task_29
  description: 'Provide the exact URL that was clicked and flagged as potentially malicious in the follow-up alert.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that the workstation VNEVADO-Win10V, used by Ethan Brooks (Account
      Executive), performed SMB enumeration against the domain controller VNEVADO-DC to gather recent IP information for two
      user accounts. Shortly after this reconnaissance activity, a separate alert indicated that a user in the same incident
      clicked a link that was later classified as malicious.'
    question: 'Provide the exact URL that was clicked and flagged as potentially malicious in the follow-up alert.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Account AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` performed SMB reconnaissance on VNEVADO-DC
          from VNEVADO-Win10V.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The potentially malicious URL 
          `https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/` was subsequently clicked.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
