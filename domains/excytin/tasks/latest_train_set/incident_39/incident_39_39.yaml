tasks:
- task_id: incident_39_latest_train_set_task_39
  title: incident_39_latest_train_set_task_39
  description: 'During the SMB reconnaissance from VNEVADO-Win10V to VNEVADO-DC, which email address was associated with the
    account that executed this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A potential human-operated attack chain began on device vnevado-win10b where the account "fk8mq" (SID
      S-0-6-5) connected from IP 141.216.110.153. As the investigation progressed, telemetry showed that a user on host VNEVADO-Win10V
      performed SMB user and IP address reconnaissance against the domain controller VNEVADO-DC, enumerating recent sessions.'
    question: 'During the SMB reconnaissance from VNEVADO-Win10V to VNEVADO-DC, which email address was associated with the
      account that executed this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An account with AadUserId `97e6a954-b6bd-48a5-808c-bd8464cce677` was first flagged for potential 
          human-operated malicious activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, an overpass-the-hash authentication attempt was observed against the domain 
          controller identified by HostName `VNEVADO-DC`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, the account with Email `Ethan Brooks@vnevado.alpineskihouse.co` performed SMB 
          reconnaissance on the same host `VNEVADO-DC`, enumerating active sessions and recent IP addresses.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
