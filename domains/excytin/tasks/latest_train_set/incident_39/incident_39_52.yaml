tasks:
- task_id: incident_39_latest_train_set_task_52
  title: incident_39_latest_train_set_task_52
  description: 'According to the linked "Suspicious remote activity" alert that predates Emma Clark’s overpass-the-hash attempt,
    which Security Identifier (SID) was associated with the account that triggered that remote activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed a suspected overpass-the-hash (Kerberos) attempt in which the
      help-desk administrator Emma Clark (account Emma Clark@vnevado.alpineskihouse.co) used the workstation VNEVADO-Win10V
      to try to authenticate against the domain controller VNEVADO-DC. The start of the alert chain involves Emma’s account
      and both hosts, but the security graph links this event to an earlier alert that flags suspicious remote activity initiated
      from another machine.'
    question: 'According to the linked "Suspicious remote activity" alert that predates Emma Clark’s overpass-the-hash attempt,
      which Security Identifier (SID) was associated with the account that triggered that remote activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An account with Sid `S-1-5-21-1540151660-3530000288-105586595-1517` attempted an overpass-the-hash Kerberos
          authentication (alert: “Suspected overpass-the-hash attack”).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A different account, identified by Sid `S-0-6-5`, was involved in suspicious remote activity on the
          machine (alert: “Suspicious remote activity”).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
