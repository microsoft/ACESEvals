tasks:
- task_id: incident_39_latest_train_set_task_42
  title: incident_39_latest_train_set_task_42
  description: 'According to the "Suspicious service launched" alert raised at 22:35:02 UTC on 2024-07-04, which executable
    file was identified as the service process that started on the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a potential kerberoasting attack, the endpoint vnevado-win10v was observed
      running a PowerShell command (`powershell.exe c:\m365dattack\get-krbticket.ps1`) followed shortly by `psexec.exe` executing
      a Rubeus ticket-dump command against a remote host. This activity triggered the alert “Possible use of the Rubeus kerberoasting
      tool” at 22:35:04 UTC on 2024-07-04. Just a few seconds later, a separate alert titled “Suspicious service launched”
      was raised on the same device, indicating that an attacker-controlled Windows service had started to maintain persistence
      or elevate privileges.'
    question: 'According to the "Suspicious service launched" alert raised at 22:35:02 UTC on 2024-07-04, which executable
      file was identified as the service process that started on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Possible use of the Rubeus kerberoasting tool was detected on the host whose AadDeviceId is `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`
          (Field: AadDeviceId, Value: `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'As part of this suspected kerberoasting activity, a process created or accessed the file `adminticket.txt`
          (Field: ExtractedFileName, Value: `adminticket.txt`), which likely contains extracted Kerberos tickets.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Around the same timeframe, a suspicious service named `services.exe` (Field: ExtractedFileName, Value:
          `services.exe`) was launched on the device, indicating a potential attempt at persistence or privilege escalation.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
