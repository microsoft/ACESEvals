tasks:
- task_id: incident_39_latest_train_set_task_30
  title: incident_39_latest_train_set_task_30
  description: 'What is the email address of the Helpdesk Administrator account that attempted the suspected overpass-the-hash
    authentication against VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a lateral-movement chain, we observed PsExec being leveraged to execute
      remote PowerShell commands that disabled real-time monitoring and manipulated Active Directory database files. This
      activity was flagged in the alert titled "PsExec launched a command on a remote device" on 2024-07-04. A few minutes
      earlier, another alert suggested possible use of the Kerberoasting tool Rubeus. Several days later, on 2024-07-10, a
      separate alert reported a suspected overpass-the-hash attempt in which a Helpdesk Administrator account from workstation
      VNEVADO-Win10V tried to authenticate against the domain controller VNEVADO-DC.'
    question: 'What is the email address of the Helpdesk Administrator account that attempted the suspected overpass-the-hash
      authentication against VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Emma Clark@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Emma Clark@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An attacker first leveraged the Rubeus tool under the account with Sid 
          `S-1-5-21-1540151660-3530000288-105586595-1517`, indicating possible kerberoasting activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Just a few seconds later PsExec was executed and launched a remote command that dropped/used the 
          file `adminticket.txt`, showing lateral-movement with harvested credentials.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Several days afterwards an overpass-the-hash attempt was detected when the account with Email `Emma
          Clark@vnevado.alpineskihouse.co` tried to authenticate to a domain controller, suggesting the stolen ticket 
          was reused.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
