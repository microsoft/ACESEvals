tasks:
- task_id: incident_39_latest_train_set_task_61
  title: incident_39_latest_train_set_task_61
  description: 'Shortly after this registration event, a lateral-movement alert identified the presence of the ‘Kekeo’ malware
    on the same device. What is the name of the executable that was detected as part of this malware?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent alert flagged a suspicious file registration event: the executable ''psexesvc.exe'' was registered
      as a service under the ''LocalSystem'' account on a device (AadDeviceId hidden). This activity may indicate an attacker
      is preparing persistence on the host.'
    question: 'Shortly after this registration event, a lateral-movement alert identified the presence of the ‘Kekeo’ malware
      on the same device. What is the name of the executable that was detected as part of this malware?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attacker registered a suspicious file as a service on the host identified by AadDeviceId 
          `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: ‘Kekeo’ malware activity was confirmed when the malicious file with Name `rubeus.exe` was detected 
          during lateral movement.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
