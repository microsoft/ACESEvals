tasks:
- task_id: incident_39_latest_train_set_task_13
  title: incident_39_latest_train_set_task_13
  description: 'What is the name of the PowerShell script file referenced in the earlier credential-theft alert that occurred
    moments before the mimikatz execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at 22:35:02 UTC, Microsoft Defender raised a “Malicious credential theft tool execution
      detected” alert after the process 5196 launched the command `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords
      exit`, indicating an attempt to dump user credentials. During the triage we noticed a second, nearly simultaneous alert
      of the same type that points to the use of a PowerShell script for credential theft.'
    question: 'What is the name of the PowerShell script file referenced in the earlier credential-theft alert that occurred
      moments before the mimikatz execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A known credential-theft PowerShell script was launched – file Name `get-krbticket.ps1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The execution is associated with the Azure AD user account whose AadUserId is 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
