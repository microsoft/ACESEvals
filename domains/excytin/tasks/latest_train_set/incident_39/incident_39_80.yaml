tasks:
- task_id: incident_39_latest_train_set_task_80
  title: incident_39_latest_train_set_task_80
  description: 'According to the “File dropped and launched from remote location” alert raised at 22:35:00 UTC on 4 July 2024,
    what is the IP address of the remote system that dropped and executed the file?'
  inherit_shared: true
  initial_context:
    incident_context: 'At 22:35:01 UTC on 4 July 2024, Defender raised a “Possible lateral movement” alert after detecting
      suspicious network activity coming from IP address 35.202.74.47 against one of our devices. Just moments earlier, another
      alert indicated that during a remote session a file had been dropped and executed on a different host – a classic technique
      for moving laterally in an environment.'
    question: 'According to the “File dropped and launched from remote location” alert raised at 22:35:00 UTC on 4 July 2024,
      what is the IP address of the remote system that dropped and executed the file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Possible lateral movement was observed on the host with AadDeviceId 
          `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Just prior to this, a remote session from IP address `141.216.110.153` dropped and executed a file,
          likely enabling the lateral movement.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
