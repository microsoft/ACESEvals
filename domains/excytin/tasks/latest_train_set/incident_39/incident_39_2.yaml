tasks:
- task_id: incident_39_latest_train_set_task_2
  title: incident_39_latest_train_set_task_2
  description: 'According to the “Suspected identity theft (pass-the-ticket)” alert, what is the Security Identifier (SID)
    of the compromised account whose Kerberos ticket was misused?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4th, an alert reported that the malware tool “Kekeo” (observed running as rubeus.exe, PID 2608,
      launched by account fk8mq) was active on one of our endpoints. Less than a week later, further activity escalated: a
      suspected overpass-the-hash attempt was logged when Emma Clark (Helpdesk Administrator) on host VNEVADO-Win10V tried
      to authenticate against the domain controller. Immediately afterward, a follow-up alert flagged a suspected pass-the-ticket
      identity-theft incident in which an attacker reused Julian Burke’s Kerberos ticket from VNEVADO-Win10B on VNEVADO-Win10V
      to access several resources.'
    question: 'According to the “Suspected identity theft (pass-the-ticket)” alert, what is the Security Identifier (SID)
      of the compromised account whose Kerberos ticket was misused?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-0-25-1848151668-3534030238-185306563-542'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-0-25-1848151668-3534030238-185306563-542'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Malware 'Kekeo' activity was detected on an account with AadUserId 
          `97e6a954-b6bd-48a5-808c-bd8464cce677` (2024-07-04 22:35:03 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Six days later, a suspected overpass-the-hash attempt originated from host with HostName 
          `VNEVADO-Win10V` (2024-07-10 11:24:45 UTC).
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Shortly after, a suspected pass-the-ticket attack leveraged the compromised account whose Sid is 
          `S-1-0-25-1848151668-3534030238-185306563-542`, using it on VNEVADO-Win10V to access multiple resources 
          (2024-07-10 11:24:45 UTC).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
