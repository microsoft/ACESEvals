  description: 'What is the Azure AD user (AadUserId) identified for the additional account linked to this attack path?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent incident, the account "tgs2z" used PsExec to run several remote commands such as disabling
      real-time antivirus protection and dumping Kerberos tickets from host ID 4d8d23e9-a77d-4e33-9435-b8c457e57ca1. These
      activities were observed in multiple processes, including psexec.exe, powershell.exe, rubeus.exe, and net.exe. While
      pivoting from this PsExec alert, analysts uncovered another Azure AD account that appears in the same attack path.'
    question: 'What is the Azure AD user (AadUserId) identified for the additional account linked to this attack path?'
