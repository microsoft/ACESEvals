tasks:
- task_id: incident_39_latest_train_set_task_35
  title: incident_39_latest_train_set_task_35
  description: 'According to the SID history injection alert that followed the suspicious remote activity, what is the name
    of the file that was involved in the injection?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4th 2024, host "vnevado-win10b" raised a "Suspicious remote activity" alert. The activity was
      carried out under the accounts "fk8mq" and "LocalSystem" (SIDs S-1-5-21-1540151660-3530000288-105586595-1517 and S-0-6-5)
      and involved the process "psexesvc.exe" that had started at 14:33 UTC. A few seconds later, additional alerts were triggered,
      including one that reported a Security ID (SID) history injection on the same device.'
    question: 'According to the SID history injection alert that followed the suspicious remote activity, what is the name
      of the file that was involved in the injection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dkwj.mze'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dkwj.mze'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A remote session dropped and executed a file using account Sid `S-1-5-21-1440151660-4837038288-105596163-1120`
          (Field: Sid) at 2024-07-04T22:35:02.050095Z.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The dropped file `dkwj.mze` (Field: Name) was then used to carry out a SID history injection at 2024-07-04T22:35:02.200786Z.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Moments later, the attacker leveraged the process `psexesvc.exe` (Field: ExtractedFileName) to perform
          further suspicious remote activity at 2024-07-04T22:35:03.473987Z.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
