tasks:
- task_id: incident_39_latest_train_set_task_70
  title: incident_39_latest_train_set_task_70
  description: 'Which IP address was recorded in connection with the "Malicious credential theft tool execution detected"
    alert on vnevado-win10b?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation of potential human-operated malicious activity on device vnevado-win10b, we
      noted that account “fk8mq” triggered a chain of alerts. First, a deceptive sign-in attempt was detected, and moments
      later an alert titled “Malicious credential theft tool execution detected” indicated that a credential-dumping tool
      had run on the same host.'
    question: 'Which IP address was recorded in connection with the "Malicious credential theft tool execution detected" alert
      on vnevado-win10b?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '65.233.23.156'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '65.233.23.156'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An alert flagged potential human-operated malicious activity involving the account Name `kyleg`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Moments earlier, a sign-in attempt was recorded using a deceptive user account whose Sid was 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Soon after, a malicious credential-theft tool was executed on the device, and activity was observed
          communicating with the external IP Address `65.233.23.156`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
