tasks:
- task_id: incident_39_latest_train_set_task_74
  title: incident_39_latest_train_set_task_74
  description: 'Analysts later identified a ‘Malicious credential theft tool execution detected’ alert that is linked to this
    same incident chain. According to that alert, what is the username (account name) associated with the process that attempted
    the credential theft?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that the IT director Julian Burke (account: Julian Burke@vnevado.alpineskihouse.co)
      initiated a suspected DCSync attack from host VNEVADO-Win10V against the domain controller VNEVADO-DC on 2024-07-10.
      This raised concerns about possible follow-up credential-theft activity in the environment.'
    question: 'Analysts later identified a ‘Malicious credential theft tool execution detected’ alert that is linked to this
      same incident chain. According to that alert, what is the username (account name) associated with the process that attempted
      the credential theft?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspected DCSync attack was initiated by account with AadUserId 
          `7fcf9695-68fc-4258-864d-e1e5b166c66f`, indicating a replication request from VNEVADO-Win10V to VNEVADO-DC.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly before, a suspicious service started the process `powershell.exe` (ExtractedFileName = 
          `powershell.exe`), suggesting an attempt to run potentially malicious commands or scripts.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Immediately after, a malicious credential-theft tool was executed by the account with Name `tgs2z`,
          confirming the attacker’s intent to dump credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
