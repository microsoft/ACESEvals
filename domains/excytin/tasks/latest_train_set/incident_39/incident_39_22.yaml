tasks:
- task_id: incident_39_latest_train_set_task_22
  title: incident_39_latest_train_set_task_22
  description: 'In the subsequent "Malicious credential theft tool execution detected" alert, which URL is referenced as part
    of the tool’s execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident began when account ''lucasb'' (SID S-1-5-21-1440151660-4837038288-105596163-1120
      / AAD Id 7fcf9695-68fc-4258-864d-e1e5b166c66f) launched a suspicious service. The service start sequence was triggered
      through PowerShell and NET commands that stopped and restarted Active Directory (NTDS) while attempting to modify SID
      history—behaviour often associated with privilege-escalation. This activity raised the "Suspicious service launched"
      alert on 2024-07-04 at 22:35 UTC. A few seconds later, additional alerts indicated the presence of Mimikatz, suggesting
      the attacker’s goal was credential theft.'
    question: 'In the subsequent "Malicious credential theft tool execution detected" alert, which URL is referenced as part
      of the tool’s execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-dc.vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-dc.vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious service was started that launched the process with ExtractedFileName `powershell.exe` 
          (2024-07-04 22:35:00 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, the Mimikatz credential-theft tool was detected on the host with HostName 
          `vnevado-win10v` (2024-07-04 22:35:04 UTC).
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The activity culminated in execution of a credential-theft command that referenced the malicious 
          Url `vnevado-dc.vnevado.alpineskihouse.co` (2024-07-04 22:35:04 UTC).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
