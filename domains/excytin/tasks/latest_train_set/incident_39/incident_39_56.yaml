tasks:
- task_id: incident_39_latest_train_set_task_56
  title: incident_39_latest_train_set_task_56
  description: 'What is the file name of the process that was used to stop services on host "vnevado-win10b"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation we observed a sign-in attempt with a deceptive user account "kyleg" on host
      "vnevado-win10b" (AAD device ID: fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb). Immediately afterwards, a remote session dropped
      a file on the same machine and executed it. Seconds later, a process on that device suspiciously stopped several running
      services – a typical tactic used by attackers to disable security controls before carrying out further actions.'
    question: 'What is the file name of the process that was used to stop services on host "vnevado-win10b"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt was made from IP address (Address: `141.216.110.153`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'During the same timeline, the deceptive user account (Name: `lucasb`) dropped and executed a file from
          a remote location.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Finally, the process (ExtractedFileName: `powershell.exe`) ran and suspiciously stopped services on
          the device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
