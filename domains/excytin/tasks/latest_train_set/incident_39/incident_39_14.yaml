tasks:
- task_id: incident_39_latest_train_set_task_14
  title: incident_39_latest_train_set_task_14
  description: 'According to the "Suspicious service launched" alert that followed, which executable file was run as the service
    process on host "vnevado-win10b"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a lateral-movement attempt, we observed that a remote session to host "vnevado-win10b"
      (device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb) dropped a file and executed it via the process "psexesvc.exe" (PID
      5912, created 2024-06-27 14:32:53 UTC). The activity was generated under the local account "fk8mq" (SID S-1-5-21-1540151660-3530000288-105586595-1517)
      and originated from IP 141.216.110.153. Immediately after this event, Microsoft Defender raised a second alert indicating
      that a suspicious service was launched on the same device—suggesting the attacker may have attempted to maintain persistence
      by starting an unusual service process.'
    question: 'According to the "Suspicious service launched" alert that followed, which executable file was run as the service
      process on host "vnevado-win10b"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A remote session dropped and executed a file with ExtractedFileName `psexesvc.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Soon after, a suspicious service started with ProcessId `652`, CreatedTimeUtc 
          `2024-06-19t12:56:00.7201251z`, and CommandLine `services.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
