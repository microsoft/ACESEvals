tasks:
- task_id: incident_39_latest_train_set_task_44
  title: incident_39_latest_train_set_task_44
  description: 'Which user account was identified as having registered the suspicious file as a service in the correlated
    alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, analysts observed that on 2024-07-04 a remote session dropped and executed
      the file "psexesvc.exe" (Process ID 7668) on the domain controller "vnevado-dc" while signed in as user "lucasb". This
      activity generated the alert "File dropped and launched from remote location". A correlated alert, raised seconds earlier,
      titled "Suspicious file registered as a service" indicates the attacker’s attempt to establish persistence by registering
      the dropped file as a Windows service.'
    question: 'Which user account was identified as having registered the suspicious file as a service in the correlated alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A remote session originating from IP address `141.216.110.153` dropped a file on the machine and 
          executed it.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The account `fk8mq` subsequently registered the suspicious file as a service, likely to establish 
          persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
