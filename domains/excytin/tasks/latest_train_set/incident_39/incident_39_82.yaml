tasks:
- task_id: incident_39_latest_train_set_task_82
  title: incident_39_latest_train_set_task_82
  description: 'Which user account (provide the full email address) was identified in the later alert as performing the SMB
    session enumeration from VNEVADO-Win10V against VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a credential-theft incident, Microsoft Defender flagged several executions
      of the tool "mimikatz.exe" on the workstation VNEVADO-Win10V, indicating possible harvesting of credentials for lateral
      movement. A few days later, a separate alert reported that a user on the same workstation enumerated SMB sessions on
      the domain controller VNEVADO-DC to gather recent IP information of other accounts.'
    question: 'Which user account (provide the full email address) was identified in the later alert as performing the SMB
      session enumeration from VNEVADO-Win10V against VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A Mimikatz credential theft tool was detected, and it was executed under the account whose Sid is 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, the account with Email `Ethan Brooks@vnevado.alpineskihouse.co` performed SMB 
          reconnaissance, enumerating sessions and recent IP addresses on the domain controller.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
