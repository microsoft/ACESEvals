tasks:
- task_id: incident_39_latest_train_set_task_58
  title: incident_39_latest_train_set_task_58
  description: 'Soon after the Rubeus activity, a separate alert titled "Successful logon using overpass-the-hash with potentially
    stolen credentials" was raised. According to that alert, what is the name of the executable file that was involved in
    the overpass-the-hash logon?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring has flagged activity on an endpoint that suggests the use of the Rubeus tool for
      Kerberoasting. Multiple suspicious processes were spawned, including "psexesvc.exe" and "rubeus.exe", which attempted
      to dump Kerberos tickets into an output file. Such behaviour often precedes credential-theft techniques like overpass-the-hash,
      where attackers leverage stolen hashes to obtain Kerberos tickets and authenticate to additional resources.'
    question: 'Soon after the Rubeus activity, a separate alert titled "Successful logon using overpass-the-hash with potentially
      stolen credentials" was raised. According to that alert, what is the name of the executable file that was involved in
      the overpass-the-hash logon?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lsass.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lsass.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attacker used the Rubeus kerberoasting tool on the host with AadDeviceId 
          `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`, indicating they were harvesting Kerberos tickets for offline cracking.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, a successful logon via overpass-the-hash was detected, showing that the attacker leveraged
          credentials extracted from the Local Security Authority process, `lsass.exe` (file Name: `lsass.exe`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
