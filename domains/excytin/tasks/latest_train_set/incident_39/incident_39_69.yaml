tasks:
- task_id: incident_39_latest_train_set_task_69
  title: incident_39_latest_train_set_task_69
  description: 'According to the "Malicious credential theft tool execution detected" alert raised at 22:35:00 UTC on 2024-07-04,
    what is the full SID of the account that was flagged?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a sequence of related alerts on host "vnevado-dc", we first observed a
      SID history injection attempt launched from a PowerShell command issued by the user account "lucasb" (SID ending in
      ...-1120). Seconds later, Microsoft Defender detected the presence of the Mimikatz credential-theft tool on the same
      device. Almost concurrently, another alert—"Malicious credential theft tool execution detected"—was raised, flagging
      a different user account whose security identifier (SID) was captured by the alert.'
    question: 'According to the "Malicious credential theft tool execution detected" alert raised at 22:35:00 UTC on 2024-07-04,
      what is the full SID of the account that was flagged?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-5-7-21-1843151660-3234030288-105586167-1422'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-5-7-21-1843151660-3234030288-105586167-1422'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Account Sid `S-5-7-21-1843151660-3234030288-105586167-1422` executed a known credential-theft 
          command.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Process ExtractedFileName `powershell.exe` was used to perform a SID-history injection.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Process ExtractedFileName `mimikatz.exe` was detected, confirming use of the Mimikatz 
          credential-theft tool.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
