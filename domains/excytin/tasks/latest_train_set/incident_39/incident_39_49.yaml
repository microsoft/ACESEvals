tasks:
- task_id: incident_39_latest_train_set_task_49
  title: incident_39_latest_train_set_task_49
  description: 'What is the email address of the Helpdesk Administrator account that attempted to authenticate during the
    suspected overpass-the-hash (Kerberos) attack detected on 2024-07-10?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed multiple dual-purpose tools, including the script "domaindominance27.ps1",
      being dropped and executed via PowerShell (Process ID 4676) on host VNEVADO-Win10V (AAD device ID 4d8d23e9-a77d-4e33-9435-b8c457e57ca1)
      by user tgs2z. A few seconds later, a detection for the lateral-movement tool ‘Kekeo’ was raised. Six days afterwards,
      the same workstation generated an alert for a suspected overpass-the-hash (Kerberos) attempt, where a Helpdesk Administrator
      account tried to authenticate against the domain controller.'
    question: 'What is the email address of the Helpdesk Administrator account that attempted to authenticate during the suspected
      overpass-the-hash (Kerberos) attack detected on 2024-07-10?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Emma Clark@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Emma Clark@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'File dropped: The dual-purpose tool `rubeus.exe` (file Name = rubeus.exe) was placed on the device,
          indicating preparation for credential-theft or lateral-movement activity.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: "Malware lateral movement: 'Kekeo' malware activity was detected originating from the account with Sid
          = `S-1-5-21-1540151660-3530000288-105586595-1517`, showing the attacker trying to move between hosts."
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Overpass-the-hash attempt: The account with Email = `Emma Clark@vnevado.alpineskihouse.co` attempted
          Kerberos authentication against a domain controller, consistent with an overpass-the-hash technique.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
