tasks:
- task_id: incident_39_latest_train_set_task_85
  title: incident_39_latest_train_set_task_85
  description: 'According to the "Possible lateral movement" alert that was raised shortly after the service-stopping activity,
    what is the name of the workstation the attacker is suspected to have moved to?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4, 2024, Microsoft Defender for Endpoint raised an alert titled "Suspicious process stopping
      services" on host vnevado-dc. The activity involved the user account "lucasb" launching the commands "powershell.exe"
      and "net.exe" to stop the NTDS service—behavior often associated with attempts to disable security controls before further
      malicious actions. A few days later, additional alerts suggested identity-theft activity (pass-the-ticket) and indicated
      that the attacker might have moved to another workstation in the environment.'
    question: 'According to the "Possible lateral movement" alert that was raised shortly after the service-stopping activity,
      what is the name of the workstation the attacker is suspected to have moved to?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10b'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10b'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:01.237308+00:00, a suspicious process stopped services on the device, involving
          the account with field AadUserId `7fcf9695-68fc-4258-864d-e1e5b166c66f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: At 2024-07-10 11:24:45.375523+00:00, suspected identity theft (pass-the-ticket) activity was 
          observed coming from the IP with field Address `35.202.74.47`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: At 2024-07-04 22:35:01.716777+00:00, possible lateral movement was detected on the host with field 
          HostName `vnevado-win10b`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
