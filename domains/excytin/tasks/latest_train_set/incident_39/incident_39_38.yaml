tasks:
- task_id: incident_39_latest_train_set_task_38
  title: incident_39_latest_train_set_task_38
  description: 'What is the Azure AD user ID (AadUserId) linked to the "Malicious credential theft tool execution detected"
    alert raised at 22:35:00 UTC on July 4 2024?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a July 4th security incident, we noted a "Suspicious access to LSASS service"
      alert at 22:35:03 UTC. The alert was tied to several Mimikatz-related processes, including one that ran the PowerShell
      script get-krbticket.ps1, suggesting an attempt to harvest credentials from LSASS. A few seconds earlier (22:35:00 UTC),
      another alert titled "Malicious credential theft tool execution detected" was raised for the same host, indicating the
      execution of a well-known credential-theft command line. We now need to identify which Azure AD account was associated
      with that malicious tool execution.'
    question: 'What is the Azure AD user ID (AadUserId) linked to the "Malicious credential theft tool execution detected"
      alert raised at 22:35:00 UTC on July 4 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious access to LSASS service was detected, targeting the account with Sid 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A malicious credential-theft tool was executed by the account with AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
