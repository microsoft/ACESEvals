tasks:
- task_id: incident_39_latest_train_set_task_16
  title: incident_39_latest_train_set_task_16
  description: 'According to the deceptive sign-in alert, what is the Security Identifier (SID) of the suspicious user account
    that attempted to sign in?'
  inherit_shared: true
  initial_context:
    incident_context: 'A malicious credential-theft tool (mimikatz.exe) was executed on one of the endpoints with the command
      line: "mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit Immediately afterwards, Microsoft
      Defender raised a separate alert titled "Sign-in attempt with deceptive user account," indicating that an attacker may
      have tried to log on using a decoy account on the same device.'
    question: 'According to the deceptive sign-in alert, what is the Security Identifier (SID) of the suspicious user account
      that attempted to sign in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-0-6-5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-0-6-5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A sign-in attempt was detected from a deceptive user account with Name `kyleg`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A second sign-in attempt involved the deceptive account with Sid `S-0-6-5`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Soon after, a malicious credential-theft tool was executed on host `vnevado-win10v`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
