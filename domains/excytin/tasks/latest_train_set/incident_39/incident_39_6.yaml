tasks:
- task_id: incident_39_latest_train_set_task_6
  title: incident_39_latest_train_set_task_6
  description: 'According to the "Suspicious service launched" alert raised at 22:35:02 UTC on 2024-07-04, what is the name
    of the executable that was started as the suspicious service (i.e., the image name of the process with PID 7668)?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation you observe that PsExec was used to run several remote commands from host
      ID 4d8d23e9-a77d-4e33-9435-b8c457e57ca1. For example, command lines show tools such as "psexec.exe" executing PowerShell
      scripts (domaindominance27.ps1, get-krbticket.ps1) and even disabling real-time monitoring through Windows Defender
      settings. These activities triggered the alert “PsExec launched a command on a remote device,” which is often an indicator
      of lateral-movement attempts. Shortly after, a “SID history injection” alert fired on host vnevado-win10b, suggesting
      the attacker tried to escalate privileges. Seconds later, another alert reported that a suspicious service was started
      on the same timeline, implying the attacker may have installed a service to maintain persistence.'
    question: 'According to the "Suspicious service launched" alert raised at 22:35:02 UTC on 2024-07-04, what is the name
      of the executable that was started as the suspicious service (i.e., the image name of the process with PID 7668)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'psexesvc.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious service was launched with ProcessId__CreatedTimeUtc__CommandLine 
          `7668__2024-06-27t14:34:10.0201983z__psexesvc.exe`, indicating PsExec’s service component being installed for 
          remote execution.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'On host `HostName: vnevado-dc`, a SID history injection was detected, suggesting the attacker escalated
          privileges on this domain controller.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Using those elevated privileges, PsExec ran the command `ExtractedFileName: net.exe` on a remote device,
          likely to enumerate or modify network-related settings.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
