tasks:
- task_id: incident_39_latest_train_set_task_84
  title: incident_39_latest_train_set_task_84
  description: 'According to the alert stating that the ''Kekeo'' malware was detected and active, what is the Azure AD user
    ID (AadUserId) associated with the account involved in this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'An investigation began after an email with the malicious URL "https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/"
      was sent from k1pt7ez@vnevado.alpineskihouse.co (sender IP 118.254.65.186) to the mailbox tgs2z@vnevado.alpineskihouse.co,
      an account belonging to Ethan Brooks. Although the message was removed post-delivery, follow-up alerts showed that multiple
      dual-purpose tools were subsequently dropped on the same device. Minutes later, Microsoft Defender flagged that the
      credential-theft tool “Kekeo” was running, indicating possible privilege-escalation activity tied to a specific Azure
      AD account.'
    question: 'According to the alert stating that the ''Kekeo'' malware was detected and active, what is the Azure AD user
      ID (AadUserId) associated with the account involved in this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An email containing a malicious URL was delivered to and later removed from the mailbox of the 
          account whose AadUserId is `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, the dual-purpose tool file with Name `rubeus.exe` was dropped on the device, 
          suggesting preparation for credential theft or lateral movement.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, the ‘Kekeo’ malware was detected as active under the account with AadUserId 
          `97e6a954-b6bd-48a5-808c-bd8464cce677`, indicating a progression from phishing to tool deployment and malware 
          execution.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
