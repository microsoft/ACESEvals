tasks:
- task_id: incident_39_latest_train_set_task_7
  title: incident_39_latest_train_set_task_7
  description: 'According to the correlated alert that reported a sign-in attempt with a deceptive user account, which account
    name was used in that suspicious log-on?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a security incident, we observed a Powershell command (PID 3780) that stopped
      the NTDS service and attempted to add a high-privilege SID history to the user account "bdadmin", indicating a possible
      SID history injection attack. Immediately following this, a remote session dropped and executed a file, suggesting lateral
      movement activity.'
    question: 'According to the correlated alert that reported a sign-in attempt with a deceptive user account, which account
      name was used in that suspicious log-on?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'kyleg'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'kyleg'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A remote session originating from IP Address `141.216.110.153` dropped and executed a file on the 
          device.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A SID history injection was detected against the account with Sid 
          `S-1-5-21-1440151660-4837038288-105596163-1120`, potentially granting elevated privileges.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A sign-in attempt using the deceptive user account Name `kyleg` was observed on the device.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
