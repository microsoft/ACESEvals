tasks:
- task_id: incident_39_latest_train_set_task_46
  title: incident_39_latest_train_set_task_46
  description: 'What is the name of the executable that was launched as the suspicious service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, a malicious credential-theft tool was executed using the command line that
      invoked mimikatz against the domain vnevado.alpineskihouse.co from IP 65.233.23.156. A few seconds later, the device
      also generated an alert indicating that a suspicious service was launched, suggesting the attacker may have tried to
      maintain persistence by starting a system service.'
    question: 'What is the name of the executable that was launched as the suspicious service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Account SID: S-5-7-21-1843151660-3234030288-105586167-1422 – A malicious credential-theft tool execution
          was detected under this user context.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'File Name: rubeus.exe – A dual-purpose tool that can facilitate credential theft was dropped onto the
          device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Host AadDeviceId: fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb – The host was observed running active ‘Kekeo’
          malware, indicating compromise.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'ProcessId__CreatedTimeUtc__CommandLine: 684__2024-06-26t17:11:52.8075185z__services.exe – A suspicious
          service (services.exe) was started, likely used to maintain persistence following the malware and tool deployment.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
