tasks:
- task_id: incident_39_latest_train_set_task_59
  title: incident_39_latest_train_set_task_59
  description: 'According to the "Kekeo" malware detection alert triggered at 2024-07-04 22:35:03 UTC, what is the name of
    the executable file that was identified as malicious on host "vnevado-dc"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host "vnevado-dc", a suspicious service was launched shortly after the account
      "lucasb" executed a PowerShell command to stop and start NTDS. Just seconds later, an alert titled "Anomalous account
      lookups" indicated that the same host began performing unusual user-account queries. Immediately following these events,
      Defender raised an additional alert flagging a known malware family named "Kekeo" on the device. The security team must
      determine the exact malicious file associated with this final malware detection.'
    question: 'According to the "Kekeo" malware detection alert triggered at 2024-07-04 22:35:03 UTC, what is the name of
      the executable file that was identified as malicious on host "vnevado-dc"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious service was launched using process with ExtractedFileName `net.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly afterwards, anomalous account look-ups were observed on host with HostName 
          `vnevado-win10v`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, the system detected the 'Kekeo' malware via a file whose Name is `rubeus.exe`, confirming 
          the presence of malicious activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
