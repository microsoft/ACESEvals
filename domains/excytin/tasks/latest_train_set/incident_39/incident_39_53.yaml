tasks:
- task_id: incident_39_latest_train_set_task_53
  title: incident_39_latest_train_set_task_53
  description: 'According to the alert about the quarantined email, what URL did the user ultimately click?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security Center flagged a device for potential human-operated malicious activity after observing multiple
      suspicious processes, including a PowerShell command that disabled real-time protection and the execution of Rubeus
      through PsExec (psexesvc.exe). Shortly after, another alert reported that PsExec launched a command on a remote host,
      suggesting lateral movement attempts. A few days later, a separate alert indicated that a user accessed a link contained
      in an email that had been automatically quarantined by Zero-Hour Auto Purge (ZAP).'
    question: 'According to the alert about the quarantined email, what URL did the user ultimately click?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: url=`https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/` was clicked by a user 
          even though the email containing it had been ZAP-quarantined, giving the attacker an initial foothold.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: account.Sid=`S-5-7-21-1843151660-3234030288-105586167-1422` was then used with PsExec to launch a 
          command on a remote device, showing lateral-movement activity.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: process.ExtractedFileName=`rubeus.exe` was executed on the device, indicating the attacker is now 
          running a credential-theft tool to harvest Kerberos tickets.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
