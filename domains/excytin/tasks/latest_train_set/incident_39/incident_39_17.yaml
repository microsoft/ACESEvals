tasks:
- task_id: incident_39_latest_train_set_task_17
  title: incident_39_latest_train_set_task_17
  description: 'According to the "Possible lateral movement" alert raised moments before the suspicious PsExec activity, what
    destination IP address was involved in that lateral move?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious remote activity alert, we observed that account "fk8mq" (SID
      S-1-5-21-1540151660-3530000288-105586595-1517) executed the tool "psexesvc.exe" (process ID 5512) from the IP address
      141.216.110.153. This execution may indicate an operator using PsExec-style commands to reach another machine. Just
      seconds earlier, Microsoft Defender for Endpoint raised a separate alert titled "Possible lateral movement", suggesting
      the attacker might have pivoted to a different host.'
    question: 'According to the "Possible lateral movement" alert raised moments before the suspicious PsExec activity, what
      destination IP address was involved in that lateral move?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '35.202.74.47'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was detected on host with AadDeviceId 
          `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb` at 2024-07-04T22:35:03.473987Z.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Almost simultaneously, possible lateral movement was observed originating from IP address 
          `35.202.74.47` at 2024-07-04T22:35:01.716777Z.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
