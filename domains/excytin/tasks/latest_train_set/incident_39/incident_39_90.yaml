tasks:
- task_id: incident_39_latest_train_set_task_90
  title: incident_39_latest_train_set_task_90
  description: 'According to the later alert about the malicious URL click (raised on 2024-07-10), what is the name of the
    user account that clicked the link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a Defender Antivirus tampering attempt on host "vnevado-win10v" (observed
      on 2024-07-04), the process "powershell.exe" (PID 6636) executed the script "get-krbticket.ps1" under the account "tgs2z".
      While pivoting from this activity, analysts uncovered a related alert raised six days later for a user who clicked a
      confirmed-malicious URL.'
    question: 'According to the later alert about the malicious URL click (raised on 2024-07-10), what is the name of the
      user account that clicked the link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attempt to disable Microsoft Defender Antivirus was detected from the account with Sid 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, the account named `Ethan Brooks` was observed clicking on a potentially malicious 
          URL.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
