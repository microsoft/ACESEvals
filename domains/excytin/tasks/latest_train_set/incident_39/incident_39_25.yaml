tasks:
- task_id: incident_39_latest_train_set_task_25
  title: incident_39_latest_train_set_task_25
  description: 'Which user account was identified in the "Suspicious remote activity" alert that followed the Mimikatz detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a recent incident, Microsoft Defender detected the execution of the credential-theft
      tool Mimikatz on one of our devices. The process command line was:

      "mimikatz.exe" "lsadump::dcsync /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit

      This activity triggered the alert "Mimikatz credential theft tool" at 22:35:04 UTC on 2024-07-04, suggesting an attacker
      was attempting to harvest credentials for further lateral movement. Shortly afterwards two additional alerts fired on
      the same host: one indicating that multiple dual-purpose tools had been dropped, and another titled "Suspicious remote
      activity", pointing to remote actions such as interactive sessions or scheduled-task creation originating from a different
      machine.'
    question: 'Which user account was identified in the "Suspicious remote activity" alert that followed the Mimikatz detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:02.140784+00:00, a dual-purpose tool was dropped on the device (file Name: psexesvc.exe).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'At 2024-07-04 22:35:03.473987+00:00, suspicious remote activity was carried out by the account (Name:
          fk8mq).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'At 2024-07-04 22:35:04.055507+00:00, the credential-theft process was detected running (ExtractedFileName:
          mimikatz.exe).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
