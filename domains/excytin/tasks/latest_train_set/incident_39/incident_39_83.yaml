tasks:
- task_id: incident_39_latest_train_set_task_83
  title: incident_39_latest_train_set_task_83
  description: 'In the alert "Suspicious sequence of exploration activities", which account name is reported as having executed
    the reconnaissance commands?'
  inherit_shared: true
  initial_context:
    incident_context: 'An investigation into a phishing campaign showed that an email containing a malicious URL was delivered
      and later removed. The email was sent from the sender address k1pt7ez@vnevado.alpineskihouse.co and referenced the URL
      https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/. The message is associated with the user account
      Ethan Brooks. During triage, analysts noted that another alert in the same incident, titled "Suspicious sequence of
      exploration activities", was raised a few days earlier when a process executed several reconnaissance commands on a
      compromised host. Analysts now need to connect the email activity to the on-host exploration activity.'
    question: 'In the alert "Suspicious sequence of exploration activities", which account name is reported as having executed
      the reconnaissance commands?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-04 22:35:02 UTC, the account with Name `tgs2z` ran a suspicious sequence of Windows 
          exploration commands, indicating possible reconnaissance activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, on 2024-07-10 11:24:45 UTC, email messages containing malicious URLs were detected 
          and removed for the Azure AD user whose AadUserId is `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
