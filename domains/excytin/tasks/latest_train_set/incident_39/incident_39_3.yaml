tasks:
- task_id: incident_39_latest_train_set_task_3
  title: incident_39_latest_train_set_task_3
  description: 'In the second mimikatz command that attempted the DCSync operation, which user account was specified after
    the "/user:" parameter?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 04 July 2024, a malicious credential-theft incident was detected on one of our devices. The initial
      alert showed process ID 5196 launching "mimikatz.exe" with commands to dump logon passwords. A few seconds later, a
      second, related mimikatz process started and tried to perform a DCSync operation against the domain vnevado.alpineskihouse.co,
      indicating an attempt to retrieve credentials for a specific domain account.'
    question: 'In the second mimikatz command that attempted the DCSync operation, which user account was specified after
      the "/user:" parameter?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'xfbzkp'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'xfbzkp'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Alert indicated malicious credential theft activity on host with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On that host, process `mimikatz.exe` started with ProcessId `4748` at 
          `2024-06-27T14:33:38.0249949Z`, using the command line `"mimikatz.exe" "lsadump::dcsync 
          /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit` to attempt credential dumping.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
