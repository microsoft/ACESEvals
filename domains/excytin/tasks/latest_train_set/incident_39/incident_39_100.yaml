tasks:
- task_id: incident_39_latest_train_set_task_100
  title: incident_39_latest_train_set_task_100
  description: 'According to the “Suspicious account creation” alert connected with the DCSync activity, what is the username
    of the newly created account?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 10 2024, Microsoft Defender flagged a “Suspected DCSync attack” in which the user Julian Burke
      (IT Director) operating from host VNEVADO-Win10V initiated a replication request against the domain controller VNEVADO-DC.
      A related alert shows that shortly beforehand Ethan Brooks performed SMB reconnaissance from the same workstation, enumerating
      sessions on the domain controller. As investigators follow the timeline of these related alerts, they note that a few
      days earlier the environment generated a “Suspicious account creation” alert indicating that an unexpected new user
      account had been added—often a sign an attacker is trying to establish persistent access.'
    question: 'According to the “Suspicious account creation” alert connected with the DCSync activity, what is the username
      of the newly created account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'An attacker attempted to replicate directory services: suspected DCSync attack against the host with
          HostName `VNEVADO-DC`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Just before the DCSync attempt, an account with Sid `S-5-7-21-1843151660-3234030288-105586167-1422`
          carried out user-and-IP reconnaissance over SMB.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A few days earlier, a suspicious new user account with Name `tgs2z` was created — this is the end 
          entity being questioned.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
