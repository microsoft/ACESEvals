tasks:
- task_id: incident_39_latest_train_set_task_75
  title: incident_39_latest_train_set_task_75
  description: 'For the alert that detected the malicious credential-theft tool execution, what is the Azure AD (AadUserId)
    of the account under which the tool was run?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a lateral-movement investigation we observed that a remote session dropped and immediately executed
      the file psexesvc.exe on an endpoint (alert: "File dropped and launched from remote location" at 2024-07-04 22:35:02
      UTC). Moments later, the same host triggered additional alerts for a process stopping services and for multiple dual-purpose
      tools being deposited. These events ultimately culminated in a "Malicious credential theft tool execution detected"
      alert, indicating that a credential-dumping utility was run under a specific cloud identity.'
    question: 'For the alert that detected the malicious credential-theft tool execution, what is the Azure AD (AadUserId)
      of the account under which the tool was run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:00.671776+00:00, a malicious credential-theft tool execution was detected from 
          the account with AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: At 2024-07-04 22:35:01.237308+00:00, the suspicious process `powershell.exe` (ExtractedFileName 
          field) stopped services on the device.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: At 2024-07-04 22:35:02.050095+00:00, a remote session dropped and launched a file using the account
          whose Name field is `lucasb`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: At 2024-07-04 22:35:02.140784+00:00, multiple dual-purpose tools were dropped under the account 
          whose Sid field is `S-5-7-21-1843151660-3234030288-105586167-1422`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
