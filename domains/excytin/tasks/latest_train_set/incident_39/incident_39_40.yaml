tasks:
- task_id: incident_39_latest_train_set_task_40
  title: incident_39_latest_train_set_task_40
  description: 'What was the Process ID of the second Mimikatz execution referenced by the same credential-theft alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a recent credential-theft incident, an alert titled "Malicious credential
      theft tool execution detected" was raised at 2024-07-04 22:35:02 UTC. The alert showed a process (ID 5176) launching
      the command `"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets" exit`, indicating use of the
      Mimikatz tool. Analysts later uncovered that the same alert also recorded a second execution of Mimikatz a few seconds
      earlier, but its exact process details were not immediately noted.'
    question: 'What was the Process ID of the second Mimikatz execution referenced by the same credential-theft alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '5196'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '5196'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Account with Sid `S-5-7-21-1843151660-3234030288-105586167-1422` was involved in a malicious 
          credential-theft tool execution.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Process with ID `5196`, created at `2024-06-27t14:32:35.4061023z`, ran the command line 
          `"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
