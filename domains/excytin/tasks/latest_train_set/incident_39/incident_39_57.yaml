tasks:
- task_id: incident_39_latest_train_set_task_57
  title: incident_39_latest_train_set_task_57
  description: 'According to the alert about the removed emails containing a malicious URL, what IP address was identified
    as the sender of those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, it was observed that the user Ethan Brooks (Account Executive) on workstation
      "VNEVADO-Win10V" performed SMB-based user and IP address reconnaissance against the domain controller "VNEVADO-DC",
      gathering network information about two accounts. Shortly after this network enumeration activity, security tools reported
      that several email messages containing a malicious URL were detected and automatically removed post-delivery.'
    question: 'According to the alert about the removed emails containing a malicious URL, what IP address was identified
      as the sender of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '118.254.65.186'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '118.254.65.186'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user with Email `Ethan Brooks@vnevado.alpineskihouse.co` performed SMB reconnaissance on 
          VNEVADO-DC.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An email containing a malicious URL was removed after delivery; it originated from SenderIP 
          `118.254.65.186`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
