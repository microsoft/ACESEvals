tasks:
- task_id: incident_39_latest_train_set_task_23
  title: incident_39_latest_train_set_task_23
  description: 'What is the name of the PowerShell script that was identified during the anomalous account look-up activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspected overpass-the-hash attempt in which Emma Clark (Helpdesk Administrator)
      tried to authenticate to the domain controller from host VNEVADO-Win10V, a second alert showed that Ethan Brooks performed
      SMB session enumeration against the same domain controller from the same workstation. A short time earlier, another
      alert had reported a surge of anomalous account look-up activity that appeared to be part of the same attack sequence.
      During that final stage, investigators identified a PowerShell script that was likely used to automate the account enumeration.'
    question: 'What is the name of the PowerShell script that was identified during the anomalous account look-up activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – HostName = `VNEVADO-DC`: On 2024-07-10 11:24:45 UTC a suspected over-pass-the-hash (Kerberos)
          attack was detected when Emma Clark attempted to authenticate against the domain controller VNEVADO-DC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – AadUserId = `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`: Two-tenths of a second earlier, on 2024-07-10
          11:24:45 UTC, the account with this Azure AD user ID carried out SMB reconnaissance from VNEVADO-Win10V, enumerating
          sessions on the same domain controller (VNEVADO-DC).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – Name = `domaindominance27.ps1`: Several days before, on 2024-07-04 22:35:03 UTC, the PowerShell
          script ‘domaindominance27.ps1’ was run, performing anomalous user-account look-ups – activity likely preparatory
          to the subsequent SMB and Kerberos attacks.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
