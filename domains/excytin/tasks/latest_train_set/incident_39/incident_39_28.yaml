tasks:
- task_id: incident_39_latest_train_set_task_28
  title: incident_39_latest_train_set_task_28
  description: 'According to the related alert that reports several dual-purpose tools being dropped, what is the name of
    the script or file that was copied to the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'While investigating a suspicious remote activity alert on host vnevado-win10b, we saw connections coming
      from the external IP 141.216.110.153. The activity relied on the service executable psexesvc.exe that was launched (PID
      5512) and ran under several system-level SIDs. The alert suggests that, during the remote session, an unknown file was
      placed on the endpoint, which may be linked to other detections in the same incident.'
    question: 'According to the related alert that reports several dual-purpose tools being dropped, what is the name of the
      script or file that was copied to the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:02.140784+00:00, multiple dual-purpose tools were dropped, including the file 
          Name `get-krbticket.ps1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: One second later, at 2024-07-04 22:35:03.473987+00:00, suspicious remote activity was detected that
          leveraged the file Name `psexesvc.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
