tasks:
- task_id: incident_38_latest_train_set_task_3
  title: incident_38_latest_train_set_task_3
  description: 'Provide the exact URL of the text file that the injected process attempted to access on Azure Blob Storage.'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4, 2024, a process that originated from the external IP address 202.183.149.174 ran on one
      of our hosts without any command-line arguments—behaviour that is unusual for that program and often associated with
      code-injection or masquerading attempts. Seconds earlier, security telemetry reported that code had been injected into
      another process, and the injected code subsequently tried to download a text file hosted in Azure Blob Storage.'
    question: 'Provide the exact URL of the text file that the injected process attempted to access on Azure Blob Storage.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A process named notepad.exe (ExtractedFileName = `notepad.exe`) was observed running with no 
          command-line arguments but exhibiting unexpected behavior, suggesting possible code injection or masquerading.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Prior to that, a suspicious process injection alert referenced the URL (Url = 
          `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`), indicating 
          that malicious code hosted at this address may have been injected into notepad.exe.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
