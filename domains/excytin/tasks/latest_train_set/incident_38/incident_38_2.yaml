tasks:
- task_id: incident_38_latest_train_set_task_2
  title: incident_38_latest_train_set_task_2
  description: 'To which external IP address did the compromised host "vnevado-win11a" attempt to communicate after the suspicious
    process injection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a suspicious process-injection event, we observed that the process "notepad.exe"
      (PID 8932, started at 2024-06-26T15:49:51Z) was running under user "nathans" on host "vnevado-win11a." This host was
      flagged after abnormal code was injected into another process, indicating that adversaries might be trying to hide malicious
      activity or establish command-and-control. We are now looking at subsequent network activity originating from this same
      machine.'
    question: 'To which external IP address did the compromised host "vnevado-win11a" attempt to communicate after the suspicious
      process injection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious process injection observed: The injected process communicated with external IP (Field: Address,
          Value: `72.5.72.208`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
