tasks:
- task_id: incident_134_latest_train_set_task_14
  title: incident_134_latest_train_set_task_14
  description: 'From which IP address did the risky Azure Active Directory session originate when the malicious inbox rule
    associated with the BEC attempt was created?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent security incident, a password-spray attack was observed. A sign-in attempt coming from
      the external IP address 170.54.121.63 succeeded, suggesting that a user account may have been compromised. Shortly after,
      another alert indicated that an attacker created a mailbox rule designed to hide incoming emails, a common technique
      seen in Business Email Compromise (BEC) fraud cases.'
    question: 'From which IP address did the risky Azure Active Directory session originate when the malicious inbox rule
      associated with the BEC attempt was created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '237.7.81.122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account compromised during the password-spray attack is Name `Nina Park`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious inbox rule related to BEC financial fraud was created from IP Address `237.7.81.122`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
