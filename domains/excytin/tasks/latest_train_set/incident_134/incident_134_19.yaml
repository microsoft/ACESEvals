tasks:
- task_id: incident_134_latest_train_set_task_19
  title: incident_134_latest_train_set_task_19
  description: 'What is the Azure AD user ID (AadUserId) that appears in the Password Spray alert raised on 2024-07-18 14:36:59
    UTC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we noted that on 2024-07-17 at 11:01 UTC there was a sign-in attempt from
      the anonymous IP address 170.54.121.63, suggesting use of a Tor exit node or anonymizing VPN. The following day, Microsoft
      Defender generated a separate alert for a suspected password spray attack against Azure AD accounts.'
    question: 'What is the Azure AD user ID (AadUserId) that appears in the Password Spray alert raised on 2024-07-18 14:36:59
      UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e036dee7-fa23-42ef-a019-468c8d3401f1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e036dee7-fa23-42ef-a019-468c8d3401f1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in attempt originated from the anonymous IP address (Field: Address, Value: 170.54.121.63).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, a password-spray attack targeted the user account (Field: AadUserId, Value: e036dee7-fa23-42ef-a019-468c8d3401f1).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
