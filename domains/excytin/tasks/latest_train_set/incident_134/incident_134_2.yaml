tasks:
- task_id: incident_134_latest_train_set_task_2
  title: incident_134_latest_train_set_task_2
  description: 'During the review of this incident, analysts noted the message was ultimately deleted. What email address
    originally sent this malicious message to raphaelt@vnevado.alpineskihouse.co?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 17 2024, Defender for Office 365 reported that an email containing the malicious URL https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/
      was delivered to the mailbox raphaelt@vnevado.alpineskihouse.co and subsequently removed. The URL was associated with
      the user account Nina Park, indicating a possible phishing attempt targeting that mailbox.'
    question: 'During the review of this incident, analysts noted the message was ultimately deleted. What email address originally
      sent this malicious message to raphaelt@vnevado.alpineskihouse.co?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: The alert shows that an email containing a malicious URL (Email messages containing malicious URL 
          removed after delivery) was sent from the Sender `alyssat@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
