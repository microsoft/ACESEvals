tasks:
- task_id: incident_134_latest_train_set_task_12
  title: incident_134_latest_train_set_task_12
  description: 'According to the password-spray alert raised on July 18 2024, from which IP address did the malicious login
    attempts originate?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a potential Business Email Compromise (BEC), the security team observed
      that user account "Nina Park" (email: Nina Park@vnevado.alpineskihouse.co) was flagged for sending suspicious emails
      on July 17 2024. The e-mails originated from IP address 237.7.81.122 and were sent to the mailbox nathan@avoriaz.alpineskihouse.co,
      raising concerns of credential theft and further compromise attempts. The next day, a separate alert was raised indicating
      that a password-spray attack had been detected in the environment. Analysts now need to correlate these two alerts and
      determine whether the same actor or infrastructure might be involved.'
    question: 'According to the password-spray alert raised on July 18 2024, from which IP address did the malicious login
      attempts originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious emails related to a BEC fraud attempt were sent from the account with AadUserId 
          `e036dee7-fa23-42ef-a019-468c8d3401f1` on 2024-07-17 11:55:04Z.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-18 14:36:59Z, a password-spray attack was detected from the IP address `170.54.121.63`, 
          indicating further attempts to compromise user accounts.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
