tasks:
- task_id: incident_134_latest_train_set_task_5
  title: incident_134_latest_train_set_task_5
  description: 'According to the follow-up alert about the email cleanup, what is the exact HTTPS URL that was stripped from
    the delivered messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security alert was raised after a user clicked on the link "http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/",
      which was flagged as potentially malicious. Shortly afterward, the security system reported that email messages containing
      a related malicious URL were automatically removed from user mailboxes.'
    question: 'According to the follow-up alert about the email cleanup, what is the exact HTTPS URL that was stripped from
      the delivered messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A potentially malicious URL click was detected from mailbox with MailboxPrimaryAddress 
          `raphaelt@vnevado.alpineskihouse.co`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Email messages containing the malicious Url 
          `https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/` were removed after delivery.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
