tasks:
- task_id: incident_134_latest_train_set_task_10
  title: incident_134_latest_train_set_task_10
  description: 'According to the follow-up alert regarding the suspicious sign-in, what is the address of the known malicious
    IP involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 17 2024 a user (raphaelt@vnevado.alpineskihouse.co) clicked a URL that security controls later
      classified as malicious. The click originated from the mailbox of that user and was associated with Nina Park’s Azure
      AD identity. Less than 24 hours later, a separate alert reported a sign-in coming from a known-bad IP address in close
      temporal proximity to the original URL-click incident.'
    question: 'According to the follow-up alert regarding the suspicious sign-in, what is the address of the known malicious
      IP involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-17 10:59:14.787387+00:00, a potentially malicious URL click was detected by user with 
          AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-18 13:48:02.042756+00:00, a sign-in attempt originated from the malicious IP address 
          `170.54.121.63`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
