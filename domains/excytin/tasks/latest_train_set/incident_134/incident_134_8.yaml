tasks:
- task_id: incident_134_latest_train_set_task_8
  title: incident_134_latest_train_set_task_8
  description: 'According to the related alert about messages with a malicious URL being removed after delivery, which user’s
    email address was the recipient of those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 17 2024 at 11:34 UTC, Microsoft security telemetry flagged a "Suspicious inbox manipulation
      rule" created through cloud application ID 20893 from IP address 237.7.81.122. This suggests an attacker may have gained
      access to a user mailbox and set rules to hide or exfiltrate email. A related alert indicates that email messages carrying
      a malicious URL were subsequently removed after delivery to one of the organization’s recipients.'
    question: 'According to the related alert about messages with a malicious URL being removed after delivery, which user’s
      email address was the recipient of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An email containing a malicious URL was delivered to the mailmessage recipient `raphaelt@vnevado.alpineskihouse.co`
          (Field: Recipient, Value: `raphaelt@vnevado.alpineskihouse.co`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Later, a suspicious inbox manipulation rule was detected on the account with SID `S-1-5-21-1874151667-3554330288-105586563-1715`
          (Field: Sid, Value: `S-1-5-21-1874151667-3554330288-105586563-1715`), indicating the attacker may have gained access
          to that mailbox and is altering rules to hide or exfiltrate emails.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
