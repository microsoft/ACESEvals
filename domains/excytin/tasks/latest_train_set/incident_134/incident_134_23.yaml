tasks:
- task_id: incident_134_latest_train_set_task_23
  title: incident_134_latest_train_set_task_23
  description: 'What is the name of the user account whose mailbox had the suspicious inbox rule created during the BEC financial
    fraud alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed a sign-in attempt coming from the anonymous IP address 170.54.121.63.
      Shortly afterwards, within the same risky session, a suspicious inbox rule was created that could hide incoming emails—a
      common tactic used in business email compromise campaigns.'
    question: 'What is the name of the user account whose mailbox had the suspicious inbox rule created during the BEC financial
      fraud alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account with field AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` signed in from an anonymous
          IP address.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, an inbox rule was created for the account with field Name `Nina Park`, indicating 
          potential BEC-related financial fraud.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
