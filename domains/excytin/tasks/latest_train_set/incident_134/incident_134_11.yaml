tasks:
- task_id: incident_134_latest_train_set_task_11
  title: incident_134_latest_train_set_task_11
  description: 'What is the primary email address of the mailbox from which the emails containing the malicious URL were removed
    on 2024-07-17 at 11:04:19 UTC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, analysts observed a sign-in originating from the known-malicious IP address
      170.54.121.63. Pivoting from this event, they correlated it with another alert raised a day earlier indicating that
      email messages containing a malicious URL had been delivered and subsequently removed from a single user mailbox. The
      goal is to verify which user mailbox was impacted by the malicious email campaign.'
    question: 'What is the primary email address of the mailbox from which the emails containing the malicious URL were removed
      on 2024-07-17 at 11:04:19 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-18 13:48:02.042756+00:00, a sign-in originating from a known malicious IP was associated
          with the account whose AadUserId is `e036dee7-fa23-42ef-a019-468c8d3401f1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-17 11:04:19.964546+00:00, email messages that contained a malicious URL were delivered 
          to and subsequently removed from the mailbox whose MailboxPrimaryAddress is 
          `raphaelt@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
