tasks:
- task_id: incident_134_latest_train_set_task_6
  title: incident_134_latest_train_set_task_6
  description: 'What specific IP address did the user (ID: e036dee7-fa23-42ef-a019-468c8d3401f1) use during the "Anonymous
    IP address" sign-in detected on 2024-07-17?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation we observed that Azure AD user with ID e036dee7-fa23-42ef-a019-468c8d3401f1
      recently triggered a "Malicious IP address" sign-in alert on 2024-07-18. While reviewing historical activity for this
      same account, we found an earlier alert titled "Anonymous IP address" that was raised on 2024-07-17, indicating the
      user had previously signed in through a potentially anonymizing service. The exact IP used in that prior event has not
      yet been identified.'
    question: 'What specific IP address did the user (ID: e036dee7-fa23-42ef-a019-468c8d3401f1) use during the "Anonymous
      IP address" sign-in detected on 2024-07-17?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-17 11:01:27.633644+00:00, a sign-in was detected from an anonymous IP address with 
          Address `170.54.121.63`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-18 13:48:02.042756+00:00, the account with AadUserId 
          `e036dee7-fa23-42ef-a019-468c8d3401f1` attempted to sign in from a malicious IP address.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
