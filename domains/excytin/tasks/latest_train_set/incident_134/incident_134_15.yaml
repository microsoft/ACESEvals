tasks:
- task_id: incident_134_latest_train_set_task_15
  title: incident_134_latest_train_set_task_15
  description: 'According to the alert titled "A potentially malicious URL click was detected", what was the email address
    of the sender of the message that contained the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an account compromise that originated from the unusual IP address 170.54.121.63,
      analysts noted that the attacker likely leveraged a successful password-spray attempt to access a user account. Shortly
      before this network activity, the same incident timeline shows that one of the organisation’s users clicked on a URL
      later confirmed to be malicious. That click occurred within an email message, but the sender’s address has not yet been
      verified.'
    question: 'According to the alert titled "A potentially malicious URL click was detected", what was the email address
      of the sender of the message that contained the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` was compromised following a 
          password-spray attack.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Earlier, a potentially malicious URL was clicked in an email whose Sender was 
          `alyssat@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
