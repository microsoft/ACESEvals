tasks:
- task_id: incident_134_latest_train_set_task_7
  title: incident_134_latest_train_set_task_7
  description: 'During the ‘Account compromised following a password-spray attack’ alert that occurred the next day, from
    which IP address did the suspicious sign-in originate?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent security incident began when an email containing a malicious URL (https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/)
      was delivered to – and then removed from – the mailbox of raphaelt@vnevado.alpineskihouse.co. The message originated
      from sender alyssat@vnevado.alpineskihouse.co and the sending IP was 254.241.243.229. Although the email was deleted,
      a follow-up alert indicated that the same user account was later involved in a suspected password-spray attack, resulting
      in a successful compromise after a sign-in from an unusual location and browser.'
    question: 'During the ‘Account compromised following a password-spray attack’ alert that occurred the next day, from which
      IP address did the suspicious sign-in originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account with Name `Nina Park` had an email that contained a malicious URL, which was later 
          removed.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, a password-spray attack originated from IP Address `170.54.121.63`, compromising the 
          same user account.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
