tasks:
- task_id: incident_134_latest_train_set_task_16
  title: incident_134_latest_train_set_task_16
  description: 'According to the later alert about mailbox-rule tampering, from which IP address did the suspicious inbox
    manipulation originate?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed a sign-in coming from the anonymous IP address 170.54.121.63.
      This connection raised an alert titled “Anonymous IP address,” suggesting the user may have been hiding their true origin
      (for example, via Tor or a VPN). Shortly after that sign-in, another alert was generated indicating that the same user’s
      mailbox rules were tampered with—often a technique attackers use to hide or forward sensitive mail.'
    question: 'According to the later alert about mailbox-rule tampering, from which IP address did the suspicious inbox manipulation
      originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '237.7.81.122'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '237.7.81.122'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Account.AadUserId: e036dee7-fa23-42ef-a019-468c8d3401f1 – The user signed in from an anonymous IP address
          on 2024-07-17 11:01:27.633644 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Ip.Address: 237.7.81.122 – A suspicious inbox-manipulation rule was created from this IP on 2024-07-17
          11:34:48.784934 UTC, suggesting the same user’s mailbox may have been compromised.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
