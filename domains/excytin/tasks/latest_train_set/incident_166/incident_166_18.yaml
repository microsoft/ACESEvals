tasks:
- task_id: incident_166_latest_train_set_task_18
  title: incident_166_latest_train_set_task_18
  description: 'From which IP address was the suspicious “ITCleanup” inbox rule created in Jordan P’s mailbox?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a possible Business Email Compromise (BEC) attempt involving the user account
      "Jordan P" (AadUserId: 89e933b9-5b2e-4bd6-bcdf-033db707ef82), analysts observed that the same user later created a suspicious
      inbox rule named "ITCleanup" to divert messages into the "RSS Feeds" folder. This activity suggests the mailbox may
      have been hijacked to conceal fraudulent communications.'
    question: 'From which IP address was the suspicious “ITCleanup” inbox rule created in Jordan P’s mailbox?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A possible BEC financial fraud was detected involving account Email `Jordan 
          P@vnevado.alpineskihouse.co`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious inbox manipulation rule was created from IP Address `192.238.237.190`, indicating the 
          account may be compromised and controlled from this source.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
