tasks:
- task_id: incident_166_latest_train_set_task_13
  title: incident_166_latest_train_set_task_13
  description: 'According to the “Possible BEC financial fraud” alert raised on 2024-07-23 at 16:09 UTC, what is the display
    name of the user account associated with this suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'A Password Spray attack was detected on 2024-07-23 at 14:23 UTC originating from the external IP address
      95.202.65.202. Investigators have since linked this malicious sign-in activity to a subsequent alert, raised later the
      same day at 16:09 UTC, entitled “Possible BEC financial fraud,” indicating that an adversary may be attempting a business
      email compromise against the organisation. The second alert is tied to a specific user account in the tenant.'
    question: 'According to the “Possible BEC financial fraud” alert raised on 2024-07-23 at 16:09 UTC, what is the display
      name of the user account associated with this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Password spray attack detected at 2024-07-23 14:23:51.925093+00:00 targeting the account with field
          AadUserId=`89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, at 2024-07-23 16:09:13.506099+00:00, a possible BEC financial fraud was observed involving 
          the account with field Name=`Jordan P`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
