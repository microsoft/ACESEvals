tasks:
- task_id: incident_166_latest_train_set_task_9
  title: incident_166_latest_train_set_task_9
  description: 'Identify the IP address that triggered the second “Anonymous IP address” alert at 09:11:31 UTC.'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of recent sign-in anomalies, a login was detected on 2024-07-22 at 08:45:32 UTC
      from the anonymous IP address 95.202.65.202. The sign-in was classified by identity protection as coming from an anonymizer
      service (for example, Tor or a VPN). A short while later, a second alert of the same type (“Anonymous IP address”) was
      raised the same morning, indicating another potentially risky connection, but from a different source IP.'
    question: 'Identify the IP address that triggered the second “Anonymous IP address” alert at 09:11:31 UTC.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous source.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The anonymous sign-in originated from IP address `192.238.237.190`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
