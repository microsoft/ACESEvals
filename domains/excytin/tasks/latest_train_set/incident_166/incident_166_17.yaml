tasks:
- task_id: incident_166_latest_train_set_task_17
  title: incident_166_latest_train_set_task_17
  description: 'Which user account (provide the full email address) had the suspicious inbox rule created during the risky
    session that began from the anonymous IP address 95.202.65.202?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent security incident, a sign-in was observed coming from the anonymous IP address 95.202.65.202.
      This activity triggered the “Anonymous IP address” alert, indicating the user may have been trying to hide their true
      location (for example, via Tor or a VPN). Later in the same risky Azure AD session, another alert—“BEC financial fraud”—was
      generated because an attacker created a suspicious inbox rule designed to hide incoming email messages, a common tactic
      in business email compromise.'
    question: 'Which user account (provide the full email address) had the suspicious inbox rule created during the risky
      session that began from the anonymous IP address 95.202.65.202?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address
          on 2024-07-22 08:45:32 UTC.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, a suspicious inbox rule associated with the email account `Jordan 
          P@vnevado.alpineskihouse.co` was created, indicating a potential BEC financial-fraud attempt on 2024-07-22 
          10:00:07 UTC.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
