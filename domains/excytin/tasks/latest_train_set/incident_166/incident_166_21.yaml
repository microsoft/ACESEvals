tasks:
- task_id: incident_166_latest_train_set_task_21
  title: incident_166_latest_train_set_task_21
  description: 'What external IP address is associated with the "BEC financial fraud" alert in this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed that a user who triggered a “BEC-related user signed in to SAP”
      alert accessed the SAP cloud application (AppId 100) from the external IP address 107.253.5.27. This same user is also
      tied to an earlier alert titled “BEC financial fraud,” which indicates that a suspicious inbox rule was created in a
      risky Azure Active Directory session—likely part of a Business Email Compromise attempt. You have the details for the
      first sign-in; now confirm the network information tied to the financial-fraud alert.'
    question: 'What external IP address is associated with the "BEC financial fraud" alert in this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Account Name: `Jordan P` signed in to SAP in a suspicious manner, indicating possible control takeover
          for Business Email Compromise (BEC).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'IP Address: `255.246.85.58` was used to create a suspicious inbox rule associated with BEC-related financial
          fraud.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
