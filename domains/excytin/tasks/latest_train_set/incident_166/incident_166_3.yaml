tasks:
- task_id: incident_166_latest_train_set_task_3
  title: incident_166_latest_train_set_task_3
  description: 'What is the AppId of the cloud application that appears on the same alert path as the suspicious inbox-manipulation
    rule?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-22 a suspicious inbox-manipulation rule was created in Jordan P’s mailbox (Jordan P@vnevado.alpineskihouse.co)
      from IP address 255.246.85.58. This behavior suggests a possible takeover of the user’s account. During triage, analysts
      noticed that an OAuth / cloud application was tied to the same activity path, indicating it may have been authorized
      to help perform or automate the rule changes.'
    question: 'What is the AppId of the cloud application that appears on the same alert path as the suspicious inbox-manipulation
      rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious inbox manipulation rule was detected on the cloud-application with AppId `20893`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
