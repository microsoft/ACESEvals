tasks:
- task_id: incident_166_latest_train_set_task_14
  title: incident_166_latest_train_set_task_14
  description: 'What is the email address of the user account associated with the "Possible BEC financial fraud" alert that
    appears to be linked to the sign-in from IP 192.238.237.190?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we noticed a sign-in from the anonymous IP address 192.238.237.190, which
      could indicate that an attacker was hiding their real location (for example by using Tor or a VPN). This sign-in is
      believed to be tied to later activity that triggered a "Possible BEC financial fraud" alert in which the same user account
      attempted actions consistent with a business-email-compromise attack.'
    question: 'What is the email address of the user account associated with the "Possible BEC financial fraud" alert that
      appears to be linked to the sign-in from IP 192.238.237.190?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-22 09:11:31.290020+00:00, there was a sign-in from an anonymous IP address for the 
          account with field AadUserId value `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-23 16:09:13.506099+00:00, a Possible BEC financial fraud alert flagged the account with 
          field Email value `Jordan P@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
