tasks:
- task_id: incident_166_latest_train_set_task_33
  title: incident_166_latest_train_set_task_33
  description: 'What is the anonymous public IP address that triggered the Microsoft Entra ID "Anonymous IP address" alert
    for user "Jordan P"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a suspicious SAP authentication alert, we saw that user "Jordan P" (email:
      Jordan P@vnevado.alpineskihouse.co, SID S-1-5-21-1740051960-3534030288-108486866-1602) accessed the SAP enterprise application
      from the external IP address 107.253.5.27. This SAP sign-in was already considered risky because the same user had a
      Microsoft Entra ID risky sign-in associated with it. Shortly before this event, Microsoft Entra ID generated an additional
      alert indicating that the same account had signed in from an anonymous network (such as Tor or a VPN).'
    question: 'What is the anonymous public IP address that triggered the Microsoft Entra ID "Anonymous IP address" alert
      for user "Jordan P"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious SAP authentication was detected for account (AadUserId: `89e933b9-5b2e-4bd6-bcdf-033db707ef82`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The risky sign-in came from an anonymous IP address (Address: `192.238.237.190`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
