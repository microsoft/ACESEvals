tasks:
- task_id: incident_166_latest_train_set_task_26
  title: incident_166_latest_train_set_task_26
  description: 'According to the alert about suspicious emails sent by a BEC-related user, what email address was used as
    the sender of those messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, analysts observed a sign-in originating from the anonymous IP address 192.238.237.190.
      This activity is linked to a later alert indicating that a potentially compromised user attempted to send fraudulent
      emails as part of a business email compromise (BEC) campaign.'
    question: 'According to the alert about suspicious emails sent by a BEC-related user, what email address was used as the
      sender of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous 
          IP address (Tor / anonymizer VPN) at 2024-07-22 09:11:31.290020+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, emails were sent from the sender address `laylaw@vnevado.alpineskihouse.co`, 
          triggering a 'Suspicious emails sent by BEC-related user' alert at 2024-07-22 10:14:23.841423+00:00.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
