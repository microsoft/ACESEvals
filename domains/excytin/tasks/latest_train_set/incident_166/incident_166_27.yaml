tasks:
- task_id: incident_166_latest_train_set_task_27
  title: incident_166_latest_train_set_task_27
  description: 'What is the display name of the user account that logged in to SAP after the risky sign-in from IP address
    192.238.237.190?'
  inherit_shared: true
  initial_context:
    incident_context: 'A sign-in from the anonymous IP address 192.238.237.190 was flagged earlier today, indicating potential
      malicious activity. Later, the same identity was observed successfully authenticating to the organization’s SAP system,
      triggering a “Suspicious SAP authentication” alert that may signal an attempt to access or modify sensitive financial
      data.'
    question: 'What is the display name of the user account that logged in to SAP after the risky sign-in from IP address
      192.238.237.190?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A sign-in from an anonymous IP address was detected for the account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, a suspicious SAP authentication was performed by the account with Name `Jordan P`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
