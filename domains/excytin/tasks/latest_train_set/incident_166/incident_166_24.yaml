tasks:
- task_id: incident_166_latest_train_set_task_24
  title: incident_166_latest_train_set_task_24
  description: 'According to the “Password Spray” alert raised on 2024-07-23, what is the source IP address associated with
    this password-spray activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a Business Email Compromise (BEC) incident, we observed that on 2024-07-22
      a user account belonging to “Jordan P” (email: Jordan P@vnevado.alpineskihouse.co) sent suspicious messages from the
      IP address 255.246.85.58 to the mailbox tony@avoriaz.alpineskihouse.co. Approximately one day later, the monitoring
      system raised an additional alert titled “Password Spray,” indicating that an attacker attempted to guess multiple passwords
      for various accounts in the tenant.'
    question: 'According to the “Password Spray” alert raised on 2024-07-23, what is the source IP address associated with
      this password-spray activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was observed sending suspicious
          emails related to a potential Business Email Compromise attempt (timestamp: 2024-07-22 10:14:23.841423+00:00).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A subsequent password-spray attack was detected originating from IP address `95.202.65.202` (timestamp:
          2024-07-23 14:23:51.925093+00:00).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
