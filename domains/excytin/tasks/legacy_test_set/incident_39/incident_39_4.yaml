tasks:
- task_id: incident_39_legacy_test_set_task_31
  title: incident_39_legacy_test_set_task_31
  description: Related to this investigation, we need to check on any remote session activities. Can you identify the 
    account name associated with the recent file drop and execution from a remote location?
  inherit_shared: true
  initial_context:
    incident_context: During a suspected identity theft (pass-the-ticket) incident, an actor used Julian Burke's 
      Kerberos ticket from VNEVADO-Win10B to access resources on VNEVADO-Win10V. This incident has raised concerns about
      unauthorized access and potential lateral movement within our network. The initial alert was triggered by a 
      suspicious activity involving the IP address `35.202.74.47` and the user account of Julian Burke, an IT director.
    question: Related to this investigation, we need to check on any remote session activities. Can you identify the 
      account name associated with the recent file drop and execution from a remote location?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'lucasb'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'lucasb'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: An actor took the Kerberos ticket of Julian Burke (IT director) with AadUserId 
          `7fcf9695-68fc-4258-864d-e1e5b166c66f` and used it from VNEVADO-Win10B to access resources on VNEVADO-Win10V.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: An account `lucasb` was involved in a remote session where a file was dropped and executed, 
          indicating a possible lateral movement or propagation by an attacker or malware.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
