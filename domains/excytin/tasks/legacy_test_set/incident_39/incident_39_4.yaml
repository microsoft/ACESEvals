    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-5-7-21-1843151660-3234030288-105586167-1422'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 1
        description: There was a suspicious service started on host `vnevado-dc` on 2024-07-04 22:35:02.631253.
      checkpoint_2:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 2
        description: The suspicious service launched `powershell.exe` on 2024-07-04 22:35:00.511266 on the same device.
      checkpoint_3:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 3
        description: The Mimikatz credential theft tool was detected on the device `vnevado-dc`, and the involved 
          account had the SID `S-5-7-21-1843151660-3234030288-105586167-1422` on 2024-07-04 22:35:04.055507.
  scoring_aggregation:
    max:
