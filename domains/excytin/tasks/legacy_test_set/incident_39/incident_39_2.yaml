  description: To further investigate this incident, identify the AadUserId associated with the 'Kekeo' malware 
    detection.
  inherit_shared: true
  initial_context:
    incident_context: A security incident involving SID history injection was detected on a device named `vnevado-dc`. 
      This kind of attack usually involves attackers using various tools to change the SID history of an existing domain
      account to an SID with elevated privileges. During this incident, the script involving the process 
      `powershell.exe` and `net1 stop ntds` were executed, indicating potential SID history manipulation to gain 
      elevated privileges. Further suspicious activity indicating the use of the Rubeus tool for kerberoasting and 
      potential pass-the-ticket attacks was also observed on the same endpoint. The timeline of the alerts suggests that
      the attacker may have been using these tools to gain unauthorized access.
