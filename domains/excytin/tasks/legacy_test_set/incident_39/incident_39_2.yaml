- task_id: incident_39_legacy_test_set_task_11
  title: incident_39_legacy_test_set_task_11
  description: Can you identify the process and its command line that was dropped and launched from a remote location 
    during this incident?
  inherit_shared: true
  initial_context:
    incident_context: A sequence of alerts indicative of potential human-operated malicious activity was observed on a 
      device on 2024-07-04. This activity may lead to ransomware or other payloads getting installed on target devices. 
      As part of the investigation, a file `rubeus.exe` was used in one of the alerts, and it was executed through 
      various processes and commands initiated by the account `kyleg`.
    question: Can you identify the process and its command line that was dropped and launched from a remote location 
      during this incident?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '5912__2024-06-27t14:32:53.2267179z__psexesvc.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '5912__2024-06-27t14:32:53.2267179z__psexesvc.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A sequence of alerts indicates potential human-operated malicious activity on the device associated
          with the account named `fk8mq`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A file named `psexesvc.exe` was dropped and launched on the device, with Process ID `5912` at 
          `2024-06-27t14:32:53.2267179z`, suggesting remote session activity that could be associated with lateral 
          movement or propagation by an attacker.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
