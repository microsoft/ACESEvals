- task_id: incident_5_legacy_test_set_task_71
  title: incident_5_legacy_test_set_task_71
  description: In this incident, potentially compromised assets are exhibiting ransomware-like behavior. Can you 
    identify the name of the file that has been impacted by ransomware?
  inherit_shared: true
  initial_context:
    incident_context: A security incident was detected involving a possible attempt to access a Primary Refresh Token 
      (PRT), which is an important artifact for Azure AD authentication. This event was associated with the process 
      `browsercore.exe` running on the host `vnevado-win11t` with the AadDeviceId 
      `e5799261-6720-4297-961e-bd9ca4275033`. PRTs enable Single Sign-On (SSO) and, if compromised, can allow an 
      attacker to move laterally or perform credential theft.
    question: In this incident, potentially compromised assets are exhibiting ransomware-like behavior. Can you identify
      the name of the file that has been impacted by ransomware?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'unstreaming.xlsx.lockbit'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'unstreaming.xlsx.lockbit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: There was a possible attempt to access a Primary Refresh Token (PRT) by the user with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Potentially compromised assets exhibiting ransomware-like behavior were detected, involving a file 
          named `unstreaming.xlsx.lockbit`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
