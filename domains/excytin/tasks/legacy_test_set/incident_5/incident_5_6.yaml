  initial_context:
    incident_context: There was a possible attempt to access the Primary Refresh Token (PRT) on a device via the process
      `browsercore.exe` with the Process ID 1640, which occurred on 2024-06-20 at 09:32:12 UTC. This security incident 
      might have been part of a larger effort to move laterally within the organization or perform credential theft 
      using Azure AD authentication tokens across Windows 10, Windows Server 2016, iOS, and Android devices. There is 
      also evidence of tampering with system recovery settings on the device, indicating adversaries were attempting to 
      disable or remove recovery options to prevent system recovery, potentially augmenting the effects of data 
      destruction or encryption for impact.
