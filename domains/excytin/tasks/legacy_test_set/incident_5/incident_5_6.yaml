tasks:
- task_id: incident_5_legacy_test_set_task_51
  title: incident_5_legacy_test_set_task_51
  description: Can you identify the executable file name of the process that attempted to access the Primary Refresh 
    Token (PRT) as part of the related alerts?
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving suspected tampering with system recovery settings using various commands
      and processes, including `vssblatemp.exe` to delete all volume shadow copies, was observed on device `vnevado-win11t`
      (AAD Device ID: `e5799261-6720-4297-961e-bd9ca4275033`). During the incident, the process `vssblatemp.exe` was executed
      with command: `vssblatemp.exe delete shadows /all`. This is part of an adversarial attempt to prevent the recovery of
      corrupted systems by deleting built-in operating system data or turning off recovery services. The incident was detected
      on 2024-07-04. This tampering could deny access to available backups and recovery options, augmenting the effects of
      data destruction or data encryption.'
    question: Can you identify the executable file name of the process that attempted to access the Primary Refresh 
      Token (PRT) as part of the related alerts?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'browsercore.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'browsercore.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: There was system recovery setting tampering by the Azure AD user with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: There was a possible attempt to access the Primary Refresh Token (PRT) involving the process 
          `browsercore.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
- task_id: incident_5_legacy_test_set_task_52
  title: incident_5_legacy_test_set_task_52
  description: A related alert indicated a possible compromised user account dropping ransomware-related files. Can you 
    identify the name of the specific file associated with the ransomware activity?
  inherit_shared: true
  initial_context:
    incident_context: A Mimikatz credential theft tool was detected on a device. Mimikatz is a credential theft tool 
      that can harvest plaintext passwords, password hashes, smartcard PINs, and Kerberos tickets. Attackers may use 
      this tool to harvest credentials to log into this or other devices on the network by impersonating a valid user. 
      The detection of Mimikatz is part of a broader security investigation. Additionally, there was later evidence of 
      lateral movement to the jump server `Vnevado-jump` using PSExec.
    question: A related alert indicated a possible compromised user account dropping ransomware-related files. Can you 
      identify the name of the specific file associated with the ransomware activity?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-userprttoken.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-userprttoken.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 1
        description: The Mimikatz credential theft tool was detected on the device with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 2
        description: Lateral movement to the jump server occurred using PSExec to IP address `99.83.111.100`.
      checkpoint_3:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 3
        description: A compromised user account was observed dropping a ransomware-related file named 
          `get-userprttoken.ps1` on several devices.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
