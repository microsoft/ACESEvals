- task_id: incident_5_legacy_test_set_task_14
  title: incident_5_legacy_test_set_task_14
  description: What is the name of the account involved in the system recovery setting tampering incident?
  inherit_shared: true
  initial_context:
    incident_context: There was a detection of unknown malware being active in the environment, which was stopped by 
      Windows Defender but it is recommended to further check the machine for signs of infection. Following that, there 
      were multiple alerts indicating possible attempts to access Primary Refresh Token (PRT) which is a key artifact 
      used for Azure AD authentication. Additionally, we observed an alert where system recovery settings were tampered 
      with, indicating that adversaries might be attempting to delete or disable built-in operating system data and 
      recovery services. This could prevent recovery of a corrupted system and denie access to backups and recovery 
      options. Various built-in Windows utilities can be exploited to disable or delete system recovery features, posing
      a risk to system integrity.
    question: What is the name of the account involved in the system recovery setting tampering incident?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dp5hn'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dp5hn'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 1
        description: An unknown malware was detected and was active on the host with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 2
        description: There was a possible attempt to access the Primary Refresh Token (PRT) involving the process 
          `browsercore.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 3
        description: The user with SID `S-1-5-21-1840191660-8534830288-125585561-1522` was involved in a potential 
          attempt to access the Primary Refresh Token (PRT).
      checkpoint_4:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 4
        description: System recovery setting tampering was observed on the account named `dp5hn`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
