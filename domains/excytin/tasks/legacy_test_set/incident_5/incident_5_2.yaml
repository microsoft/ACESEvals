- task_id: incident_5_legacy_test_set_task_16
  title: incident_5_legacy_test_set_task_16
  description: There was another instance of a similar process being run on the same host in this incident. Can you 
    identify the Process ID and the command line of this process?
  inherit_shared: true
  initial_context:
    incident_context: A security incident involving the Manatee Tempest activity group was flagged, where the actor 
      Manatee Tempest, known for its early malware campaigns like the Dridex banking trojan, has been active since June 
      2014. The group utilizes tactics such as drive-by downloads and FakeUpdates infections, facilitated by Mustard 
      Tempest to gain initial access. Later, they use the BLISTER loader to deliver Cobalt Strike beacons for lateral 
      movement and ransomware deployment. One of the events related to this incident involved a process running on the 
      host `vnevado-win11t` using the command `curl http://vectorsandarrows.com`. The Process ID was 88.
    question: There was another instance of a similar process being run on the same host in this incident. Can you 
      identify the Process ID and the command line of this process?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Process Id: 1332, Command Line: `curl http://vectorsandarrows.com`'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Process Id: 1332, Command Line: `curl http://vectorsandarrows.com`'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A user with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was associated with suspicious 
          activity linked to the Manatee Tempest cybercriminal group.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A process with Process ID `1332` used the command line `curl http://vectorsandarrows.com` on 
          `2024-06-20t09:10:52.7298237z`, indicating possible interaction with a malicious domain associated with 
          Manatee Tempest.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
