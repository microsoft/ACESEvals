    this file that was detected?
  inherit_shared: true
  initial_context:
    incident_context: A recent security incident was flagged due to the execution of a known credential theft tool, 
      which was used to dump user's credentials. This was detected on an account from a specific IP address.
    question: A related alert indicates the presence of a file associated with Mimikatz. Can you identify the name of 
      this file that was detected?
    # Main task submission evaluation - uses LLM-as-a-judge by default
