        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious activities were initiated by the user with SID 
          `S-2-5-21-571436798-3864380397-1837441745-3206`, involving a set of windows commands.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
