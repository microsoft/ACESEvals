    query. Can you identify the name of the account that was involved in this attempt?
  inherit_shared: true
  initial_context:
    incident_context: As part of a suspicious sequence of exploration activities reported on 2024-07-04, a process 
      executed a set of Windows commands like `powershell.exe` and `whoami.exe`. These specific commands are often used 
      by attackers to identify valuable assets and coordinate lateral movement after compromising a machine.
    question: In relation to this alert, there was an attempt to extract ADFS private keys using a suspicious LDAP 
      query. Can you identify the name of the account that was involved in this attempt?
