  description: During the incident, a suspicious service creation was detected. Can you find out which email account was
    involved in creating the suspicious service on host `mb-adfs`?
  inherit_shared: true
  initial_context:
    incident_context: A security incident involving a suspicious sequence of exploration activities occurred where a 
      series of Windows commands were executed by various processes on the host `mb-adfs`. These commands could 
      potentially indicate attackers identifying valuable assets and coordinating lateral movements after compromising 
      the machine. It included suspicious processes like `iy2orr1e.rrg.exe`, `powershell.exe`, and `whoami.exe`.
    question: During the incident, a suspicious service creation was detected. Can you find out which email account was 
      involved in creating the suspicious service on host `mb-adfs`?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
