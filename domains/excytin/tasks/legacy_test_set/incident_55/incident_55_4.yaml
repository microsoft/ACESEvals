        description: A system program was registered as a service on host `mb-adfs`, indicating potential malicious 
          intent to establish persistence or gain system privileges.
      checkpoint_2:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 2
