- task_id: incident_134_legacy_test_set_task_1
  title: incident_134_legacy_test_set_task_1
  description: Can you identify the anonymous IP address involved in the sign-in attempt related to this alert?
  inherit_shared: true
  initial_context:
    incident_context: A suspicious activity was detected where the inbox rules of user Nina Park, associated with the 
      email `Nina Park@vnevado.alpineskihouse.co`, were manipulated. It's suspected that an attacker might have gained 
      access to her inbox and is manipulating rules to delete or move messages or folders as part of data exfiltration 
      attempts. The attack likely involves a sign-in attempt from an anonymous IP address.
    question: Can you identify the anonymous IP address involved in the sign-in attempt related to this alert?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A user's inbox rules were suspiciously manipulated. The account associated with the suspicious 
          activity has AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: There was a sign-in from an anonymous IP address `170.54.121.63`, which could be linked to the 
          suspicious activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
