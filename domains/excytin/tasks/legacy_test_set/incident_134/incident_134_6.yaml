- task_id: incident_134_legacy_test_set_task_51
  title: incident_134_legacy_test_set_task_51
  description: Can you identify the name of the account involved in the BEC fraud attempt?
  inherit_shared: true
  initial_context:
    incident_context: A security incident involving suspicious emails sent by a possibly compromised user account 
      related to an ongoing BEC (business email compromise) fraud attempt was reported. Suspicious emails were sent to 
      `nathan@avoriaz.alpineskihouse.co` by `raphaelt@vnevado.alpineskihouse.co` from IP address `237.7.81.122`.
    question: Can you identify the name of the account involved in the BEC fraud attempt?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious emails were sent by the possibly compromised user account named `Nina Park`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
