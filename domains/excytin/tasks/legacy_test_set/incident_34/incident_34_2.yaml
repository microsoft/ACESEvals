- task_id: incident_34_legacy_test_set_task_11
  title: incident_34_legacy_test_set_task_11
  description: A related alert indicates suspicious activity involving PowerShell to download a file or run an encoded 
    command. Can you identify the process that was used in this suspicious activity?
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident involving an anomalous scheduled task was created on a device using `schtasks.exe`.
      This incident could be used by an attacker to obtain persistence on the device. The command involved in this alert was:
      `schtasks.exe /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive - (new) alpineskihouse\desktop\winatp-intro-backdoor.exe"
      /st 11:58 /f`. This suggests that the attacker may be trying to gain persistence by scheduling the execution of a potentially
      malicious executable.'
    question: A related alert indicates suspicious activity involving PowerShell to download a file or run an encoded 
      command. Can you identify the process that was used in this suspicious activity?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winword.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: An anomalous scheduled task was created using `powershell.exe`, which might be used by an attacker 
          to obtain persistence on the device.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious PowerShell download or encoded command was executed by `winword.exe`, indicating that 
          an attacker might be trying to download external payloads or execute commands on the device.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
