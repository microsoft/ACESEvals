- task_id: incident_322_legacy_test_set_task_11
  title: incident_322_legacy_test_set_task_11
  description: Within this sequence of events, there was a suspicious credential dump from NTDS.dit. Can you identify 
    the file name of the process that was used during this credential dump?
  inherit_shared: true
  initial_context:
    incident_context: A suspicious multi-stage security incident was detected involving multiple alerts. Initially, a 
      potentially malicious URL click was detected on August 1, 2024. The click was performed by a user 
      `alyssat@vnevado.alpineskihouse.co`. This was followed by an alert indicating that email messages containing 
      malicious URLs were removed after delivery. Subsequently, there was an alert from Azure Resource Manager noting a 
      suspicious operation from a proxy IP address. These activities can be indicative of malicious behavior attempting 
      to obfuscate their source.
    question: Within this sequence of events, there was a suspicious credential dump from NTDS.dit. Can you identify the
      file name of the process that was used during this credential dump?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 1
        description: The email recipient `alyssat@vnevado.alpineskihouse.co` clicked on a potentially malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 2
        description: The email associated with the user having AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` 
          contained a malicious URL and was removed after delivery.
      checkpoint_3:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 3
        description: There is a suspicious Azure Resource Manager operation from a proxy IP address originating from the
          host `vnevado-dc`.
      checkpoint_4:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 4
        description: The process `powershell.exe` was used in a suspicious credential dump from the NTDS.dit to obtain 
          user's credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
