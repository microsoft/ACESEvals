tasks:
- task_id: incident_322_legacy_test_set_task_51
  title: incident_322_legacy_test_set_task_51
  description: Can you identify the email of the user who performed the suspicious Azure Resource Management activities 
    in this incident?
  inherit_shared: true
  initial_context:
    incident_context: There was a multi-stage security incident detected involving the use of Ntdsutil to gather Active 
      Directory information. This might indicate an attacker preparing to move laterally within the network. 
      Additionally, Microsoft Defender for Resource Manager detected a resource management operation from a suspicious 
      proxy IP address. This suspicious activity often involves threat actors trying to hide their source IP. Following 
      this, there was a detection of suspicious Azure Resource Management (ARM) activities by a user account during a 
      risky session.
    question: Can you identify the email of the user who performed the suspicious Azure Resource Management activities 
      in this incident?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Hailey Johnson@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Hailey Johnson@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 1
        description: There is a collection of active directory information with ntutil.exe on host `vnevado-dc`.
      checkpoint_2:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 2
        description: There is a suspicious Azure Resource Manager operation from a proxy IP address `253.1.244.215`.
      checkpoint_3:
        target: trajectory
        max_score: 0.167
        weight: 1.0
        title: Checkpoint 3
        description: There are suspicious Azure Resource Management activities by a risky user with the account email 
          `Hailey Johnson@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
- task_id: incident_322_legacy_test_set_task_52
  title: incident_322_legacy_test_set_task_52
  description: What is the IP address detected in the proxy logs for the malicious URL connection?
  inherit_shared: true
  initial_context:
    incident_context: A file `powershell.exe` with ProcessId 2556 and `ntdsutil.exe` with ProcessId 6748 were observed 
      as part of a recent security incident where attackers might be using Ntdsutil to gather Active Directory 
      information. This incident is marked by various alerts. In a subsequent alert, a suspicious resource management 
      operation was detected from a proxy IP address, followed by a malicious URL clicked on a device. The incident 
      concluded with a connection from IP address 231.60.52.209 to login.micro.demo.antoinetest.ovh identified in the 
      proxy logs.
    question: What is the IP address detected in the proxy logs for the malicious URL connection?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '228.3.31.94'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '228.3.31.94'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 1
        description: An attacker is collecting Active Directory information with ntdsutil.exe on host `vnevado-dc`.
      checkpoint_2:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious Azure Resource Manager operation was performed through a proxy IP address associated 
          with the email account `Hailey Johnson@vnevado.alpineskihouse.co`.
      checkpoint_3:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 3
        description: A malicious URL was clicked on the device `vnevado-win11h`.
      checkpoint_4:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 4
        description: Suspicious connection from IP address `228.3.31.94` was detected in proxy logs going to 
          login.micro.demo.antoinetest.ovh, associated with the device `vnevado-win11h.vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
- task_id: incident_322_legacy_test_set_task_53
  title: incident_322_legacy_test_set_task_53
  description: After the email containing a malicious URL was sent, it appears a user clicked on it. Can you identify 
    the email recipient who clicked on the potentially malicious URL?
  inherit_shared: true
  initial_context:
    incident_context: In the course of a security incident, an email containing a malicious URL 
      (`dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`) was sent from `raphaelt@vnevado.alpineskihouse.co`.
      The sender's IP address was `202.205.215.225`. The email was addressed to Hailey Johnson (`Hailey 
      Johnson@vnevado.alpineskihouse.co`) whose user ID is `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`. The email was 
      delivered but later removed due to the malicious URL it contained. Can you identify the email recipient who 
      clicked on the potentially malicious URL?
    question: After the email containing a malicious URL was sent, it appears a user clicked on it. Can you identify the
      email recipient who clicked on the potentially malicious URL?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: The email account `alyssat@vnevado.alpineskihouse.co` received an email with a malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: The user with the email account `alyssat@vnevado.alpineskihouse.co` clicked on the malicious URL.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
- task_id: incident_322_legacy_test_set_task_54
  title: incident_322_legacy_test_set_task_54
  description: What command was executed using `powershell.exe` in the final alert related to Ntdsutil collecting Active
    Directory information?
  inherit_shared: true
  initial_context:
    incident_context: As part of a recent security incident, a user named Alyssa from Vnevado Alpha Ski House clicked on
      a potentially malicious URL. This was detected on 2024-08-01 at 12:44:53.271124+00:00 and was addressed in 
      subsequent alerts about email messages containing malicious URLs being removed after delivery as well as a 
      suspicious Azure Resource Manager operation from a proxy IP address.
    question: What command was executed using `powershell.exe` in the final alert related to Ntdsutil collecting Active 
      Directory information?
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '"powershell.exe" -encodedcommand '
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '"powershell.exe" -encodedcommand '
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 1
        description: A user with an email address `alyssat@vnevado.alpineskihouse.co` clicked on a potentially malicious
          URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 2
        description: An email containing a malicious URL that was delivered to the account with AadUserId 
          `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` was later removed.
      checkpoint_3:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 3
        description: There was a suspicious Azure Resource Manager operation from a proxy IP address on the host 
          `vnevado-dc`.
      checkpoint_4:
        target: trajectory
        max_score: 0.125
        weight: 1.0
        title: Checkpoint 4
        description: A process with Process ID `2556` initiated with the command line `powershell.exe -encodedcommand 
          `.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
