- task_id: incident_322_legacy_test_set_task_42
  title: incident_322_legacy_test_set_task_42
  description: During the investigation of a suspicious credential dump from NTDS.dit, what is the process ID and the 
    command line used for the dump operation?
  inherit_shared: true
  initial_context:
    incident_context: A security incident involved an Azure Resource Manager operation from a suspicious proxy IP 
      address, reported by Microsoft Defender for Resource Manager. The operation was linked to the Azure subscription 
      with SubscriptionId `7e838342-601f-4552-9baf-0dfb300cf555`. The suspicious IP address involved was 
      `253.1.244.215`, which is associated with proxy services like TOR. This behavior, while sometimes legitimate, is 
      frequently seen in malicious activities by threat actors attempting to obfuscate their IP.
    question: During the investigation of a suspicious credential dump from NTDS.dit, what is the process ID and the 
      command line used for the dump operation?
