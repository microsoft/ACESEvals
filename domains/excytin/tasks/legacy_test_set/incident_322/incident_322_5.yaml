    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '''Process Id: 6748, Command Line: "ntdsutil.exe" "ac i ntds" ifm "create'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '''Process Id: 6748, Command Line: "ntdsutil.exe" "ac i ntds" ifm "create'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: There was an Azure Resource Manager operation from a suspicious proxy IP address associated with 
          the host `vnevado-dc` at `2024-08-01 13:09:13.222398+00:00`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Attackers used the process `ntdsutil.exe` with the command line `ac i ntds ifm create full c:\temp 
          q q` and Process ID `6748` on `2024-08-01t12:37:30.2769191z` to dump NTDS.dit in order to obtain user 
          credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
