tasks:
- task_id: incident_166_latest_test_set_task_42
  title: incident_166_latest_test_set_task_42
  description: 'During that risky SAP sign-in connected to the BEC investigation, from which public IP address did the user
    account "Jordan P" access the SAP application?'
  inherit_shared: true
  initial_context:
    incident_context: ''
    question: 'During that risky SAP sign-in connected to the BEC investigation, from which public IP address did the user
      account "Jordan P" access the SAP application?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious SAP authentication occurred from IP address (Address: `107.253.5.27`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, the user account (AadUserId: `89e933b9-5b2e-4bd6-bcdf-033db707ef82`) was involved in a
          possible BEC financial fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
