tasks:
- task_id: incident_166_latest_test_set_task_64
  title: incident_166_latest_test_set_task_64
  description: 'Following this initial alert, a separate alert named “Possible BEC financial fraud” was triggered on July
    23 2024. What is the Azure AD User ID (AadUserId) of the account associated with that second alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 22 2024, an alert titled “Suspicious emails sent by BEC-related user” was raised after messages
      were delivered to the mailbox tony@avoriaz.alpineskihouse.co from the sender laylaw@vnevado.alpineskihouse.co using
      the IP address 255.246.85.58. This activity suggested a potential business-email-compromise attempt and prompted further
      monitoring.'
    question: 'Following this initial alert, a separate alert named “Possible BEC financial fraud” was triggered on July 23
      2024. What is the Azure AD User ID (AadUserId) of the account associated with that second alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious emails were sent by the user with Sid `S-1-5-21-1740051960-3534030288-108486866-1602` (alert:
          “Suspicious emails sent by BEC-related user” at 2024-07-22 10:14:23.841423 UTC).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Further activity consistent with a BEC financial fraud attempt was detected from the user with AadUserId
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82` (alert: “Possible BEC financial fraud” at 2024-07-23 16:09:13.506099 UTC).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
