tasks:
- task_id: incident_166_latest_test_set_task_2
  title: incident_166_latest_test_set_task_2
  description: 'What IP address was associated with the earlier “Anonymous IP address” sign-in alert that occurred at 08:45:32
    UTC on July 22 2024?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 22 2024, Microsoft Entra ID Protection generated an “Anonymous IP address” alert after a sign-in
      attempt originating from the IP address 192.238.237.190. This suggests the same user may have been trying to hide their
      location by using anonymizing services such as Tor or a VPN shortly after another suspicious sign-in earlier that morning.'
    question: 'What IP address was associated with the earlier “Anonymous IP address” sign-in alert that occurred at 08:45:32
      UTC on July 22 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Alert indicates a sign-in from an anonymous source for account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The anonymous activity originated from IP Address `95.202.65.202`, which was also flagged earlier 
          as coming from an anonymizing service.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
