tasks:
- task_id: incident_166_latest_test_set_task_85
  title: incident_166_latest_test_set_task_85
  description: 'Earlier that day, the same user triggered an "Anonymous IP address" alert indicating a sign-in through an
    anonymizing service. What was the source IP address associated with that anonymous sign-in?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we observed that user "Jordan P" (email: Jordan P@vnevado.alpineskihouse.co,
      SID: S-1-5-21-1740051960-3534030288-108486866-1602) successfully authenticated to the SAP enterprise application (App
      ID 100) from the external IP address 107.253.5.27 on 2024-07-22 12:59:26 UTC. This activity generated a "Suspicious
      SAP authentication" alert because the account had already been flagged as risky in Microsoft Entra ID.'
    question: 'Earlier that day, the same user triggered an "Anonymous IP address" alert indicating a sign-in through an anonymizing
      service. What was the source IP address associated with that anonymous sign-in?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A risky sign-in into SAP was detected from the user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`
          (alert time: 2024-07-22 12:59:26 UTC).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Earlier that day, a sign-in was recorded from the anonymous IP address `192.238.237.190` (alert time:
          2024-07-22 09:11:31 UTC), indicating that the attacker likely hid their origin while accessing the account.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
