tasks:
- task_id: incident_166_latest_test_set_task_24
  title: incident_166_latest_test_set_task_24
  description: 'According to the related "Anonymous IP address" alert raised during this incident, what is the IP address
    from which the anonymous sign-in attempt was made?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert titled "Suspicious emails sent by BEC-related user" was raised on 2024-07-22. It involved
      the user account "Jordan P" (SID S-1-5-21-1740051960-3534030288-108486866-1602) sending messages from the IP address
      255.246.85.58. The emails originated from sender laylaw@vnevado.alpineskihouse.co and were addressed to tony@avoriaz.alpineskihouse.co.
      This activity is part of a broader business-email-compromise investigation. A related alert in the same incident later
      indicated a sign-in attempt from an anonymous source.'
    question: 'According to the related "Anonymous IP address" alert raised during this incident, what is the IP address from
      which the anonymous sign-in attempt was made?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: User account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` was observed sending suspicious 
          emails potentially related to a Business Email Compromise (BEC).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Earlier, a sign-in was recorded from the anonymous IP address `95.202.65.202`, indicating the 
          session may have originated from a TOR or VPN service.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
