tasks:
- task_id: incident_166_latest_test_set_task_25
  title: incident_166_latest_test_set_task_25
  description: 'A short time earlier on the same day, the user’s mailbox had a rule named “ITCleanup” created to move messages
    into the “RSS Feeds” folder. From which external IP address did this earlier inbox-rule creation originate?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent investigation identified that at 10:00 UTC on July 22, 2024, the mailbox of user Jordan P
      (account SID S-1-5-21-1740051960-3534030288-108486866-1602) was accessed via cloud application 20893 from the external
      IP address 255.246.85.58. During that session, a suspicious inbox rule was added that could allow an attacker to hide
      or redirect messages.'
    question: 'A short time earlier on the same day, the user’s mailbox had a rule named “ITCleanup” created to move messages
      into the “RSS Feeds” folder. From which external IP address did this earlier inbox-rule creation originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox rule was created from IP address `192.238.237.190` (Field: Address) at 2024-07-22
          09:49:55.558204+00:00.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, at 2024-07-22 10:00:07.502771+00:00, another suspicious inbox manipulation was detected
          originating from cloud application with AppId `20893` (Field: AppId).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
