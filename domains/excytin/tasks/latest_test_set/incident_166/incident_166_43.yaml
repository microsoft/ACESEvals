tasks:
- task_id: incident_166_latest_test_set_task_43
  title: incident_166_latest_test_set_task_43
  description: 'In the earlier "BEC financial fraud" alert, from which IP address did the risky Azure AD session originate
    when the malicious inbox rule was created?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring flagged a "Possible BEC financial fraud" alert on 2024-07-23. The activity involved
      the user account "Jordan P" (AAD ID 89e933b9-5b2e-4bd6-bcdf-033db707ef82). Investigators noted that the same user was
      involved in an earlier incident, one day prior, when an inbox rule was created during a risky Azure AD session—typical
      behavior seen in business-email-compromise scenarios. That prior alert is titled "BEC financial fraud" and we need to
      review the network indicators associated with it.'
    question: 'In the earlier "BEC financial fraud" alert, from which IP address did the risky Azure AD session originate
      when the malicious inbox rule was created?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Possible BEC financial fraud was detected involving account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious inbox rule linked to BEC financial fraud was created from IP address `255.246.85.58`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
