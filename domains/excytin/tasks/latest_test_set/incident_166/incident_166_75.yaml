tasks:
- task_id: incident_166_latest_test_set_task_75
  title: incident_166_latest_test_set_task_75
  description: 'According to the Password Spray alert raised on 2024-07-23, what was the source IP address used in that attack?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we observed that user "Jordan P" (Jordan P@vnevado.alpineskihouse.co, SID
      S-1-5-21-1740051960-3534030288-108486866-1602) was flagged for a Business Email Compromise-related sign-in to the SAP
      cloud application (AppId 100) on 2024-07-22 from the external IP address 107.253.5.27. The following day, a separate
      alert reported that a Password Spray attack had been detected in the environment, possibly linked to the same threat
      actor.'
    question: 'According to the Password Spray alert raised on 2024-07-23, what was the source IP address used in that attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-22 14:09:41 UTC, a potentially compromised user with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in to SAP in a suspicious manner (BEC-related).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-23 14:23:51 UTC, a password-spray attack was detected coming from IP address 
          `95.202.65.202`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
