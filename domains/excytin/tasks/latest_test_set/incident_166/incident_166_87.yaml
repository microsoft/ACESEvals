tasks:
- task_id: incident_166_latest_test_set_task_87
  title: incident_166_latest_test_set_task_87
  description: 'What is the display name of the additional user account that appears in the related alert connected to this
    BEC investigation?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a Business Email Compromise (BEC) incident, analysts observed an alert
      titled "Suspicious emails sent by BEC-related user" that fired on 2024-07-22. In this alert, messages were sent from
      laylaw@vnevado.alpineskihouse.co to tony@avoriaz.alpineskihouse.co via the external IP 255.246.85.58, and activity was
      tied to an account with SID S-1-5-21-1740051960-3534030288-108486866-1602 (AAD user ID 89e933b9-5b2e-4bd6-bcdf-033db707ef82).
      While pivoting on related entities, defenders found a separate but connected alert that referenced a different user
      account also implicated in the campaign.'
    question: 'What is the display name of the additional user account that appears in the related alert connected to this
      BEC investigation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: The user account with Name `Jordan P` has sent suspicious emails indicating a possible BEC 
          (Business Email Compromise) attempt.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
