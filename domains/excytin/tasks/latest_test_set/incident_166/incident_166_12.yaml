tasks:
- task_id: incident_166_latest_test_set_task_12
  title: incident_166_latest_test_set_task_12
  description: 'A related alert titled ‘BEC financial fraud’ indicates that an attacker created a malicious inbox rule while
    signed in through a risky Azure AD session. Which user account (email address) is referenced in that ‘BEC financial fraud’
    alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a business-email-compromise (BEC) campaign, a ‘Suspicious emails sent by BEC-related
      user’ alert was raised. The messages were sent from laylaw@vnevado.alpineskihouse.co to tony@avoriaz.alpineskihouse.co
      and originated from the IP address 255.246.85.58. This suggests a compromised mailbox being leveraged for fraudulent
      communication.'
    question: 'A related alert titled ‘BEC financial fraud’ indicates that an attacker created a malicious inbox rule while
      signed in through a risky Azure AD session. Which user account (email address) is referenced in that ‘BEC financial
      fraud’ alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-07-22 10:00:07.521914+00:00, the “BEC financial fraud” alert indicated that the user account
          with Email `Jordan P@vnevado.alpineskihouse.co` (Field: Email) created a suspicious inbox rule, a common step in
          business email compromise.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'At 2024-07-22 10:14:23.841423+00:00, the “Suspicious emails sent by BEC-related user” alert showed that
          emails were sent from IP Address `255.246.85.58` (Field: Address), confirming active misuse of the compromised account.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
