tasks:
- task_id: incident_166_latest_test_set_task_60
  title: incident_166_latest_test_set_task_60
  description: 'What is the IP address from which the "Anonymous IP address" sign-in to user "Jordan P" originated?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a potential Business Email Compromise (BEC) involving user "Jordan P" (email:
      Jordan P@vnevado.alpineskihouse.co, SID: S-1-5-21-1740051960-3534030288-108486866-1602), we observed the creation of
      a malicious inbox rule while the user was signed in via a risky Azure AD session. Pivoting on the same user’s identifier,
      we identified an earlier alert titled "Anonymous IP address" that indicates the account was accessed through an anonymity-focused
      service (such as Tor or a VPN) shortly before the BEC activity.'
    question: 'What is the IP address from which the "Anonymous IP address" sign-in to user "Jordan P" originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A sign-in was detected from an anonymous IP address, Field: Address, Value: `192.238.237.190`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, a suspicious inbox rule was created for business-email-compromise using the Azure AD account,
          Field: AadUserId, Value: `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
