tasks:
- task_id: incident_166_latest_test_set_task_31
  title: incident_166_latest_test_set_task_31
  description: 'According to the alert about the anonymous sign-in, what IP address was used to access the environment?'
  inherit_shared: true
  initial_context:
    incident_context: 'A possible Business Email Compromise (BEC) attempt was detected involving the user account "Jordan
      P" (Jordan P@vnevado.alpineskihouse.co). While reviewing related alerts in the same incident, investigators noted a
      separate warning about a sign-in from an anonymous source (such as Tor or a VPN), suggesting the attacker may have tried
      to hide their origin.'
    question: 'According to the alert about the anonymous sign-in, what IP address was used to access the environment?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious events indicating a possible BEC financial fraud were detected for the account with 
          field AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A sign-in originated from an anonymous IP address with field Address `192.238.237.190`, suggesting 
          the user was hiding their true location.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
