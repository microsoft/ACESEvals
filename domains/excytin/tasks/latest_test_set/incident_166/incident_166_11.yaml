tasks:
- task_id: incident_166_latest_test_set_task_11
  title: incident_166_latest_test_set_task_11
  description: 'For the alert that reports the user’s suspicious sign-in to SAP, what is the App ID of the cloud application
    that was accessed?'
  inherit_shared: true
  initial_context:
    incident_context: 'Earlier on 2024-07-22 at 10:00 UTC, a Business Email Compromise (BEC) financial-fraud alert was raised
      after a risky Azure AD session from IP address 255.246.85.58 created a hidden-inbox rule. Hours later, the same user
      was observed signing in to SAP in a suspicious manner, generating a follow-up alert tied to the ongoing BEC investigation.'
    question: 'For the alert that reports the user’s suspicious sign-in to SAP, what is the App ID of the cloud application
      that was accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attacker created a suspicious inbox rule on the user account with Sid 
          `S-1-5-21-1740051960-3534030288-108486866-1602`, indicating potential business email compromise.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The same compromised user then signed in to the cloud application with AppId `100` (SAP), 
          suggesting the attacker is looking for or manipulating financial data.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
