tasks:
- task_id: incident_166_latest_test_set_task_41
  title: incident_166_latest_test_set_task_41
  description: 'According to the inbox-manipulation alert for Jordan P’s mailbox, from which IP address did the suspicious
    activity originate?'
  inherit_shared: true
  initial_context:
    incident_context: 'An investigation was opened after Microsoft Entra ID reported a suspicious SAP authentication: someone
      accessed the SAP cloud application (AppId 100) from the external IP 107.253.5.27. Although the responsible Azure AD
      user account is still being identified, this sign-in suggests the attacker may already have control of that identity.
      Shortly after, a second alert was raised – a suspicious inbox rule named "ITCleanup" was created in the mailbox of Jordan
      P (laylaw@vnevado.alpineskihouse.co), indicating possible post-compromise activity that could be used for phishing or
      data exfiltration.'
    question: 'According to the inbox-manipulation alert for Jordan P’s mailbox, from which IP address did the suspicious
      activity originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '192.238.237.190'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '192.238.237.190'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Risky user account signed in to SAP: AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious inbox manipulation rule was configured from IP address `192.238.237.190`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
