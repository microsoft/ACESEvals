tasks:
- task_id: incident_166_latest_test_set_task_63
  title: incident_166_latest_test_set_task_63
  description: 'According to the alert about suspicious emails sent by the BEC-related user, what email address was used as
    the sender?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a business email compromise (BEC) incident, we observed a sign-in to the
      company’s SAP cloud application (App ID 100) originating from the external IP address 107.253.5.27. This sign-in was
      linked to a user previously flagged in a BEC-related alert. Shortly before this SAP access, another alert indicated
      that the same compromised user had sent out suspicious emails, suggesting active misuse of the account.'
    question: 'According to the alert about suspicious emails sent by the BEC-related user, what email address was used as
      the sender?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A BEC-related user signed in to SAP in a suspicious manner using account Name `Jordan P`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious emails were subsequently sent by mailmessage Sender `laylaw@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
