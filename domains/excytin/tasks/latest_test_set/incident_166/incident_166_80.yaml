tasks:
- task_id: incident_166_latest_test_set_task_80
  title: incident_166_latest_test_set_task_80
  description: 'From a correlated alert, incident responders identified the Windows Security Identifier (SID) tied to Jordan
    P’s account. What is that SID?'
  inherit_shared: true
  initial_context:
    incident_context: 'A user named Jordan P (email: Jordan P@vnevado.alpineskihouse.co) was flagged after signing in to SAP
      from IP address 107.253.5.27. This activity was linked to an ongoing Business Email Compromise (BEC) investigation in
      Microsoft Defender XDR, indicating the account might have been taken over to access sensitive financial data in SAP.'
    question: 'From a correlated alert, incident responders identified the Windows Security Identifier (SID) tied to Jordan
      P’s account. What is that SID?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1740051960-3534030288-108486866-1602'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1740051960-3534030288-108486866-1602'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'A user account with Sid `S-1-5-21-1740051960-3534030288-108486866-1602` (field: Sid) that is already
          linked to Business Email Compromise (BEC) activity suspiciously signed in to SAP, indicating possible attacker control
          and access to sensitive financial data.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
