tasks:
- task_id: incident_166_latest_test_set_task_19
  title: incident_166_latest_test_set_task_19
  description: 'According to the alert about the suspicious emails, what email address appears as the sender of those potentially
    fraudulent messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security incident, we observed a risky sign-in to the SAP enterprise
      application (AppId 100) coming from the external IP address 107.253.5.27. This activity generated the “Suspicious SAP
      authentication” alert, indicating that an attacker might have gained access to search or modify sensitive financial
      data. Later in the same incident, another alert was raised for “Suspicious emails sent by BEC-related user,” suggesting
      that the compromised account began sending fraudulent emails to further the attack.'
    question: 'According to the alert about the suspicious emails, what email address appears as the sender of those potentially
      fraudulent messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` performed a suspicious 
          authentication to SAP.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, suspicious emails were sent from the sender address 
          `laylaw@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
