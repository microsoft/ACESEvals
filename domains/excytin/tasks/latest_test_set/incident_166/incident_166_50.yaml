tasks:
- task_id: incident_166_latest_test_set_task_50
  title: incident_166_latest_test_set_task_50
  description: 'From which external IP address did the risky "Suspicious SAP authentication" originate?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a possible Business Email Compromise (BEC) financial-fraud attempt, user
      account "Jordan P" (AadUserId 89e933b9-5b2e-4bd6-bcdf-033db707ef82) was flagged after several suspicious events were
      detected on 2024-07-23. While reviewing related activity, analysts found that the same user subsequently generated a
      "Suspicious SAP authentication" alert, indicating the account may have been used to access the organisation’s SAP system
      from an unusual network location.'
    question: 'From which external IP address did the risky "Suspicious SAP authentication" originate?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious SAP authentication: A risky sign-in to SAP was detected from IP Address `107.253.5.27` (entity
          field: Address).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Possible BEC financial fraud: The account with SID `S-1-5-21-1740051960-3534030288-108486866-1602` (entity
          field: Sid) was later involved in activity consistent with business email compromise.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
