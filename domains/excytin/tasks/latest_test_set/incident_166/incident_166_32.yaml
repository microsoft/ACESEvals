tasks:
- task_id: incident_166_latest_test_set_task_32
  title: incident_166_latest_test_set_task_32
  description: 'When the BEC-related user signed in to SAP, what external IP address was the sign-in initiated from?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 22, a “Suspicious inbox manipulation rule” alert was raised after activity coming from cloud
      application ID 20893 and the external IP address 255.246.85.58. During the same investigation we discovered that the
      very same user later generated a “BEC-related user signed in to SAP” alert, indicating possible account compromise and
      unauthorized access to SAP resources.'
    question: 'When the BEC-related user signed in to SAP, what external IP address was the sign-in initiated from?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious inbox manipulation rule was created for the account with Sid 
          `S-1-5-21-1740051960-3534030288-108486866-1602`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: That compromised user then signed in to SAP from the suspicious IP Address `107.253.5.27`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
