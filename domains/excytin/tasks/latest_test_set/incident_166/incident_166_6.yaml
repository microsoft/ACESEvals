tasks:
- task_id: incident_166_latest_test_set_task_6
  title: incident_166_latest_test_set_task_6
  description: 'From the “Password Spray” alert raised on 23 July 2024 at 14:23:51 UTC, identify the Azure AD user ID (AadUserId)
    of the affected account.'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 22 2024, an alert titled “Suspicious inbox manipulation rule” was raised for the user account
      Jordan P (email: Jordan P@vnevado.alpineskihouse.co). The alert noted that the user created a rule named “ITCleanup”
      moving messages to the “RSS Feeds” folder, a behavior often associated with mailbox compromise. Several IP addresses
      (e.g., 255.246.85.58, 192.238.237.190, 180.144.153.174) were observed, and activity involved cloud applications such
      as Microsoft Exchange Online (AppId 11161) and Microsoft 365 (AppId 20893). While investigating, you notice a related
      alert the next day reporting a “Password Spray” attack against the same environment.'
    question: 'From the “Password Spray” alert raised on 23 July 2024 at 14:23:51 UTC, identify the Azure AD user ID (AadUserId)
      of the affected account.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '89e933b9-5b2e-4bd6-bcdf-033db707ef82'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Alert 1 shows that the account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` (user Jordan 
          P) set a suspicious inbox rule named “ITCleanup,” moving messages to the folder “RSS Feeds.”
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Alert 2 then reports a Password Spray attack against the same account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`, indicating repeated login attempts and a likely effort to compromise 
          that mailbox.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
