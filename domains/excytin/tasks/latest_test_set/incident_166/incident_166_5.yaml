tasks:
- task_id: incident_166_latest_test_set_task_5
  title: incident_166_latest_test_set_task_5
  description: 'According to the follow-up alert "Suspicious emails sent by BEC-related user", which email address was identified
    as the sender of those suspicious messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we first observed an alert titled "Suspicious inbox manipulation rule" in
      which an unnamed user created a rule called "ITCleanup" that moves incoming messages to the RSS Feeds folder—behaviour
      commonly seen when attackers try to hide phishing replies or BEC traffic. This action occurred in Microsoft Exchange
      Online / Office 365 and involved several external IP addresses.'
    question: 'According to the follow-up alert "Suspicious emails sent by BEC-related user", which email address was identified
      as the sender of those suspicious messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'laylaw@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'laylaw@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious inbox manipulation rule named 'ITCleanup' was created in the mailbox of the account 
          with Email `Jordan P@vnevado.alpineskihouse.co`, suggesting the account may be compromised.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Following this, suspicious outbound messages were detected with the mailmessage Sender 
          `laylaw@vnevado.alpineskihouse.co`, indicating the compromised user is now sending potentially malicious 
          emails.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
