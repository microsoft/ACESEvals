tasks:
- task_id: incident_166_latest_test_set_task_34
  title: incident_166_latest_test_set_task_34
  description: 'What is the external IP address from which Jordan P’s risky sign-in to SAP was detected in the earlier “Suspicious
    SAP authentication” alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a business-email-compromise (BEC) incident, we observed that the account
      “Jordan P” (AadUserId 89e933b9-5b2e-4bd6-bcdf-033db707ef82) signed in to the organisation’s SAP environment in a suspicious
      manner at 14:09 UTC on 22 July 2024. Earlier the same day, a separate alert titled “Suspicious SAP authentication” had
      already been raised because the same risky user successfully authenticated to SAP from an external IP address that did
      not match the company’s normal network ranges.'
    question: 'What is the external IP address from which Jordan P’s risky sign-in to SAP was detected in the earlier “Suspicious
      SAP authentication” alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The BEC-related user with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in to SAP 
          suspiciously at 2024-07-22 14:09:41.075798+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious SAP authentication originated from IP address `107.253.5.27` at 2024-07-22 
          12:59:26.126190+00:00.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
