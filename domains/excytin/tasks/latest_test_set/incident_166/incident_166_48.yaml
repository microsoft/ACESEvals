tasks:
- task_id: incident_166_latest_test_set_task_48
  title: incident_166_latest_test_set_task_48
  description: 'What anonymous IP address triggered the sign-in alert that is potentially linked to the BEC activity on Jordan
    P’s mailbox?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation into a Business Email Compromise (BEC) attempt, we observed that the user
      account "Jordan P" (email: Jordan P@vnevado.alpineskihouse.co, SID: S-1-5-21-1740051960-3534030288-108486866-1602) created
      a suspicious inbox rule while connected from the IP address 255.246.85.58. This action occurred in what Microsoft Entra
      ID (Azure AD) classified as a risky session. Shortly before this rule was created, a separate alert reported a sign-in
      originating from an anonymous IP address that may be related to the same compromised account.'
    question: 'What anonymous IP address triggered the sign-in alert that is potentially linked to the BEC activity on Jordan
      P’s mailbox?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious inbox rule, consistent with BEC financial fraud, was created for the user account with
          AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: That risky activity followed a sign-in originating from the anonymous IP address with Address 
          `95.202.65.202`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
