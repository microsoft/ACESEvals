tasks:
- task_id: incident_166_latest_test_set_task_20
  title: incident_166_latest_test_set_task_20
  description: 'A follow-up alert reported that the same user created a suspicious inbox rule. Which cloud application (name
    and instance) is this inbox manipulation rule associated with?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation we observed a sign-in originating from the anonymous IP address 95.202.65.202
      that was associated with the Azure AD user ID 89e933b9-5b2e-4bd6-bcdf-033db707ef82. Such activity is commonly flagged
      because attackers often hide their real location behind Tor or anonymizing VPN services.'
    question: 'A follow-up alert reported that the same user created a suspicious inbox rule. Which cloud application (name
      and instance) is this inbox manipulation rule associated with?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'office 365__microsoft 365'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'office 365__microsoft 365'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous 
          IP address, suggesting initial compromise activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious inbox manipulation rule was later created in the cloud-application `Name__InstanceName:
          office 365__microsoft 365`, indicating that the attacker is abusing the user’s mailbox to hide or redirect messages.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
