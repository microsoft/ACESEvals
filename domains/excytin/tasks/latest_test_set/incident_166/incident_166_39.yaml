tasks:
- task_id: incident_166_latest_test_set_task_39
  title: incident_166_latest_test_set_task_39
  description: 'In the follow-up alert labelled “BEC financial fraud”, which IP address is recorded as the source of the risky
    Azure Active Directory session?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 22 2024, a security alert titled “Suspicious inbox manipulation rule” was triggered for cloud
      application ID 20893. The alert indicates that an attacker may have gained access to a user’s mailbox and is creating
      or changing inbox rules in order to hide or exfiltrate messages—an activity often linked to business-email-compromise
      (BEC) attempts.'
    question: 'In the follow-up alert labelled “BEC financial fraud”, which IP address is recorded as the source of the risky
      Azure Active Directory session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious inbox rule manipulation was detected on the account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A BEC financial fraud alert shows that the malicious inbox rule originated from IP address 
          `255.246.85.58`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
