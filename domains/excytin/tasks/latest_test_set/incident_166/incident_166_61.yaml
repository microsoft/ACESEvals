tasks:
- task_id: incident_166_latest_test_set_task_61
  title: incident_166_latest_test_set_task_61
  description: 'Identify the Security Identifier (SID) of the account that carried out the suspicious SAP authentication following
    the password-spray activity from 95.202.65.202.'
  inherit_shared: true
  initial_context:
    incident_context: 'A password spray attack was detected coming from the external IP address 95.202.65.202. Further investigation
      revealed that the attacker likely compromised an Azure AD user (AadUserId not yet confirmed) and subsequently authenticated
      to the organization’s SAP enterprise application, triggering a “Suspicious SAP authentication” alert. Analysts need
      to pinpoint which specific account was used in that SAP sign-in.'
    question: 'Identify the Security Identifier (SID) of the account that carried out the suspicious SAP authentication following
      the password-spray activity from 95.202.65.202.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1740051960-3534030288-108486866-1602'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1740051960-3534030288-108486866-1602'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-22 12:59:26 UTC, the user account with Sid 
          `S-1-5-21-1740051960-3534030288-108486866-1602` was involved in a suspicious SAP authentication event.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-23 14:23:51 UTC, a password-spray attack was detected against the account with AadUserId
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
