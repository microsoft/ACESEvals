tasks:
- task_id: incident_166_latest_test_set_task_84
  title: incident_166_latest_test_set_task_84
  description: 'A follow-up alert titled “BEC financial fraud” was later generated for the same user session. What is the
    display name of the account associated with this BEC alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed that the mailbox laylaw@vnevado.alpineskihouse.co was accessed
      from multiple external IP addresses (e.g., 95.202.65.202 and 180.144.153.174). Shortly afterward, a suspicious inbox
      rule named "ITCleanup" was created to move messages to the "RSS Feeds" folder. This activity raised a “Suspicious inbox
      manipulation rule” alert, suggesting possible account compromise aiming to hide or redirect email communications—often
      a precursor to business email compromise (BEC) attempts.'
    question: 'A follow-up alert titled “BEC financial fraud” was later generated for the same user session. What is the display
      name of the account associated with this BEC alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-07-22 09:49:55.558204+00:00, the account (Email: `Jordan P@vnevado.alpineskihouse.co`) created
          a suspicious inbox rule named “ITCleanup” that moves messages to the folder “RSS Feeds,” indicating possible mailbox
          compromise.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Eleven minutes later, at 2024-07-22 10:00:07.521914+00:00, the same user (Name: `Jordan P`) was detected
          creating another hiding-inbox rule during a risky Azure AD session, pointing to a potential Business Email Compromise
          (BEC) financial-fraud attempt.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
