tasks:
- task_id: incident_166_latest_test_set_task_40
  title: incident_166_latest_test_set_task_40
  description: 'In the alert about the BEC-related user’s suspicious SAP sign-in, what is the AppId of the cloud application
    that was used?'
  inherit_shared: true
  initial_context:
    incident_context: 'An investigation is underway into a business-email-compromise (BEC) incident. The first alert shows
      that the account laylaw@vnevado.alpineskihouse.co, connecting from IP 255.246.85.58, sent suspicious emails to tony@avoriaz.alpineskihouse.co.
      This raised concern that the user account might be compromised. Later in the same incident, the very same BEC-related
      user reportedly accessed the company’s SAP environment through a monitored cloud application, generating a separate
      alert about the suspicious SAP sign-in.'
    question: 'In the alert about the BEC-related user’s suspicious SAP sign-in, what is the AppId of the cloud application
      that was used?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A potentially compromised account with Email `Jordan P@vnevado.alpineskihouse.co` sent suspicious 
          emails, indicating the start of a BEC (Business Email Compromise) attempt.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The same BEC-related user then performed a suspicious sign-in to the cloud application SAP with 
          AppId `100`, suggesting the attacker is expanding access to sensitive financial data.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
