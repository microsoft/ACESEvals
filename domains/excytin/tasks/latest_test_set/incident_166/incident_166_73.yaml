tasks:
- task_id: incident_166_latest_test_set_task_73
  title: incident_166_latest_test_set_task_73
  description: 'What was the IP address associated with the "Suspicious inbox manipulation rule" alert tied to user Jordan
    P’s mailbox?'
  inherit_shared: true
  initial_context:
    incident_context: 'We are analyzing a Business Email Compromise (BEC) financial-fraud incident involving the user account
      "Jordan P" (AadUserId 89e933b9-5b2e-4bd6-bcdf-033db707ef82, SID S-1-5-21-1740051960-3534030288-108486866-1602). At 2024-07-22
      10:00:07 UTC an alert titled "BEC financial fraud" was triggered after a suspicious inbox rule was created during a
      risky Azure AD session. A related alert named "Suspicious inbox manipulation rule" reports that the same user set up
      a malicious rule called ITCleanup to move incoming mail to the RSS Feeds folder, a common tactic to hide fraudulent
      activity.'
    question: 'What was the IP address associated with the "Suspicious inbox manipulation rule" alert tied to user Jordan
      P’s mailbox?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious inbox manipulation rule was set from IP address `95.202.65.202`, moving incoming messages
          to the folder RSS Feeds (alert: “Suspicious inbox manipulation rule”, Time: 2024-07-22 09:49:55.558204 +00:00, entity
          field: Address, value: 95.202.65.202).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, in the same mailbox, a risky session created a rule intended for Business Email Compromise
          (alert: “BEC financial fraud”, Time: 2024-07-22 10:00:07.521914 +00:00, entity field: Sid, value: S-1-5-21-1740051960-3534030288-108486866-1602).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
