tasks:
- task_id: incident_166_latest_test_set_task_44
  title: incident_166_latest_test_set_task_44
  description: 'During the suspicious SAP log-in linked to the BEC investigation, from which public IP address did the user
    connect?'
  inherit_shared: true
  initial_context:
    incident_context: 'Earlier today, our monitoring systems flagged a sign-in to Microsoft 365 coming from the anonymous
      IP address 192.238.237.190, which typically indicates the use of Tor or an anonymizing VPN. This activity is associated
      with a user account currently under investigation for potential Business Email Compromise (BEC). A few hours later,
      the same user reportedly accessed the company’s SAP environment in a suspicious manner, possibly to view or alter sensitive
      financial data.'
    question: 'During the suspicious SAP log-in linked to the BEC investigation, from which public IP address did the user
      connect?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.253.5.27'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.253.5.27'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Account (AadUserId = 89e933b9-5b2e-4bd6-bcdf-033db707ef82) signed in from an anonymous IP address 
          at 2024-07-22 09:11:31.290020+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The same BEC-related user later signed in to SAP from IP address 107.253.5.27 at 2024-07-22 
          14:09:41.075798+00:00.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
