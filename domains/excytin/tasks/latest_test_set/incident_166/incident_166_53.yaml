tasks:
- task_id: incident_166_latest_test_set_task_53
  title: incident_166_latest_test_set_task_53
  description: 'According to the alert about the BEC-related user’s suspicious SAP sign-in, what is the cloud application
    ID (AppId) that was accessed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, analysts observed a sign-in originating from the anonymous IP address 95.202.65.202,
      which triggered the alert “Anonymous IP address” on 2024-07-22. The same user account later appeared in a separate alert
      indicating that the (potentially compromised) business-email-compromise-related user accessed the organisation’s SAP
      environment in a suspicious manner.'
    question: 'According to the alert about the BEC-related user’s suspicious SAP sign-in, what is the cloud application ID
      (AppId) that was accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '100'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '100'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-22 08:45:32.664841+00:00, the account with AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP address, suggesting the user session may
          be hidden behind Tor or a VPN.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later that day, at 2024-07-22 14:09:41.075798+00:00, the same potentially compromised user accessed
          the SAP cloud application with AppId `100`, triggering a BEC-related alert and indicating suspicious 
          interaction with sensitive financial data.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
