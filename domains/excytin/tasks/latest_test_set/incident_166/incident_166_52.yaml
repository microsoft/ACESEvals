tasks:
- task_id: incident_166_latest_test_set_task_52
  title: incident_166_latest_test_set_task_52
  description: 'What was the anonymous IP address from which the 08:45:32 UTC sign-in originated?'
  inherit_shared: true
  initial_context:
    incident_context: 'A suspicious inbox manipulation rule was detected on 2024-07-22 at 10:00:07 UTC for the user "Jordan
      P" (email "Jordan P@vnevado.alpineskihouse.co", SID S-1-5-21-1740051960-3534030288-108486866-1602). The activity was
      performed through cloud application ID 20893 and came from IP address 255.246.85.58. Correlation with other alerts shows
      that, earlier the same morning at 08:45:32 UTC, the same user account triggered an "Anonymous IP address" sign-in alert,
      indicating use of a privacy-enhancing service such as Tor or a VPN.'
    question: 'What was the anonymous IP address from which the 08:45:32 UTC sign-in originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '95.202.65.202'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '95.202.65.202'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-07-22 08:45:32.664841+00:00 a sign-in was detected from an anonymous IP address (Field: Address,
          Value: `95.202.65.202`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Later, at 2024-07-22 10:00:07.502771+00:00 the user (Field: AadUserId, Value: `89e933b9-5b2e-4bd6-bcdf-033db707ef82`)
          had suspicious inbox rules manipulated, suggesting the account may have been accessed from the previously observed
          anonymous IP.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
