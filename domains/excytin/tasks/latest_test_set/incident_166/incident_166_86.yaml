tasks:
- task_id: incident_166_latest_test_set_task_86
  title: incident_166_latest_test_set_task_86
  description: 'According to the ‘Suspicious inbox manipulation rule’ alert tied to the same incident, from which IP address
    was the malicious inbox rule change performed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a potential compromise, we observed a risky sign-in to the SAP cloud application
      (AppId 100) from the external IP address 107.253.5.27. This suspicious SAP authentication suggests that an attacker
      might have gained access to a user account to interact with sensitive financial data. Subsequent analysis revealed another
      alert in the same incident indicating that the same user later created an inbox rule in Outlook to move messages into
      a hidden folder—an activity frequently associated with phishing or data-exfiltration campaigns.'
    question: 'According to the ‘Suspicious inbox manipulation rule’ alert tied to the same incident, from which IP address
      was the malicious inbox rule change performed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A risky sign-in alert indicates that the account with Email `Jordan P@vnevado.alpineskihouse.co` 
          accessed the SAP application.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly afterwards, from the IP Address `255.246.85.58`, a suspicious inbox-manipulation rule named
          ITCleanup was created to move messages to the RSS Feeds folder.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
