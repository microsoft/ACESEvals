tasks:
- task_id: incident_166_latest_test_set_task_26
  title: incident_166_latest_test_set_task_26
  description: 'In the "Suspicious inbox manipulation rule" alert, what is the AppId of the cloud application associated with
    the malicious inbox rule activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a BEC-related security incident, we observed that the user account "Jordan
      P" (AadUserId 89e933b9-5b2e-4bd6-bcdf-033db707ef82, email Jordan P@vnevado.alpineskihouse.co) connected from IP address
      255.246.85.58 and created a suspicious inbox rule in a risky Azure AD session. This activity triggered the alert "BEC
      financial fraud." Further correlation revealed a second alert titled "Suspicious inbox manipulation rule" that is tied
      to the same user activity and references a specific cloud application used to carry out the rule manipulation.'
    question: 'In the "Suspicious inbox manipulation rule" alert, what is the AppId of the cloud application associated with
      the malicious inbox rule activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A business email compromise (BEC) attempt was detected when a suspicious inbox rule was created for
          the account with Sid `S-1-5-21-1740051960-3534030288-108486866-1602`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: This malicious inbox manipulation was carried out through the cloud application identified by AppId
          `20893`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
