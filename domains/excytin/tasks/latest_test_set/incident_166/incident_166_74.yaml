tasks:
- task_id: incident_166_latest_test_set_task_74
  title: incident_166_latest_test_set_task_74
  description: 'Which user’s email address was associated with the suspicious inbox manipulation rule named "ITCleanup" that
    is linked to the password-spray incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-23 a "Password Spray" attack was detected against the Azure AD account with ID 89e933b9-5b2e-4bd6-bcdf-033db707ef82
      from the external IP address 95.202.65.202. While tracing related activity, analysts discovered that this compromised
      identity is connected to an earlier alert in which a suspicious inbox rule called "ITCleanup" was created to move incoming
      messages to the "RSS Feeds" folder—often a sign that an attacker is attempting to hide malicious emails. Identifying
      the affected mailbox is critical to assess potential business-email-compromise impact.'
    question: 'Which user’s email address was associated with the suspicious inbox manipulation rule named "ITCleanup" that
      is linked to the password-spray incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A password spray attack was detected against the account with field AadUserId 
          `89e933b9-5b2e-4bd6-bcdf-033db707ef82`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious inbox manipulation rule (ITCleanup) was created for the mailbox with field Email 
          `Jordan P@vnevado.alpineskihouse.co`, moving messages to the RSS Feeds folder.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
