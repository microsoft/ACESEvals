tasks:
- task_id: incident_166_latest_test_set_task_30
  title: incident_166_latest_test_set_task_30
  description: 'What external IP address is associated with the "Suspicious inbox manipulation rule" alert linked to this
    incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security incident, we observed a "Suspicious SAP authentication" alert
      generated on 2024-07-22 at 12:59:26 UTC. The activity involved cloud application ID 100 and originated from the external
      IP address 107.253.5.27. This alert suggests a potentially compromised user account accessing SAP after a risky sign-in
      flagged by Microsoft Entra ID. Further correlation revealed another alert in the same incident: a "Suspicious inbox
      manipulation rule" indicating that an attacker may have altered mailbox rules to hide or exfiltrate email. Your task
      is to tie these two alerts together.'
    question: 'What external IP address is associated with the "Suspicious inbox manipulation rule" alert linked to this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '255.246.85.58'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '255.246.85.58'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Account Sid `S-1-5-21-1740051960-3534030288-108486866-1602` signed in to SAP in a suspicious manner
          on 2024-07-22 12:59:26 UTC, indicating possible compromise of that user account.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Inbox rules were manipulated from the suspicious IP Address `255.246.85.58` on 2024-07-22 10:00:07 
          UTC, suggesting an attacker may be using this IP to exfiltrate or hide email data.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
