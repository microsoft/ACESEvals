tasks:
- task_id: incident_166_latest_test_set_task_51
  title: incident_166_latest_test_set_task_51
  description: 'Which user account was identified in the later "Possible BEC financial fraud" alert that was connected to
    the anonymous sign-in from IP 95.202.65.202?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 22 July 2024 at 08:45 UTC, a sign-in originating from the anonymous IP address 95.202.65.202 triggered
      an alert in the environment. Investigators noted that this IP address was associated with an Entra ID (Azure AD) account
      whose identity still needed confirmation. The following day, a separate alert indicated potential Business Email Compromise
      (BEC) activity that was linked back to the same sign-in trail.'
    question: 'Which user account was identified in the later "Possible BEC financial fraud" alert that was connected to the
      anonymous sign-in from IP 95.202.65.202?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Jordan P'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Jordan P'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An account with AadUserId `89e933b9-5b2e-4bd6-bcdf-033db707ef82` signed in from an anonymous IP 
          address on 2024-07-22 08:45:32 UTC.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, on 2024-07-23 16:09:13 UTC, a Possible BEC financial-fraud attempt was detected 
          involving the account named `Jordan P`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
