tasks:
- task_id: incident_166_latest_test_set_task_38
  title: incident_166_latest_test_set_task_38
  description: 'What is the AppId of the cloud application involved in the suspicious inbox manipulation rule detected later
    in the incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, analysts noted a suspicious SAP authentication on 2024-07-22 in which a risky
      user accessed the SAP cloud application (AppId 100) from IP address 107.253.5.27. Later the same day, the same user’s
      mailbox exhibited a suspicious inbox-rule manipulation, hinting at possible data exfiltration through email.'
    question: 'What is the AppId of the cloud application involved in the suspicious inbox manipulation rule detected later
      in the incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious SAP authentication by account Name `Jordan P` indicated potential unauthorized access.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious inbox manipulation rule detected for cloud-application AppId `20893`, suggesting 
          possible email exfiltration activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
