tasks:
- task_id: incident_322_latest_test_set_task_41
  title: incident_322_latest_test_set_task_41
  description: 'According to the "Suspicious credential dump from NTDS.dit" alert, what is the process ID (PID) of the process
    that executed the encoded PowerShell command used for the dump?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a potential compromise, we observed that a user on host "vnevado-win11h"
      accessed a known malicious URL using the Microsoft Edge process (command line beginning with "msedge.exe"). This activity
      raised concern for possible follow-on actions such as credential theft. As we continued tracing related activity, we
      identified a subsequent alert titled "Suspicious credential dump from NTDS.dit," which indicates that the attacker may
      have attempted to extract credentials from the domain controller database.'
    question: 'According to the "Suspicious credential dump from NTDS.dit" alert, what is the process ID (PID) of the process
      that executed the encoded PowerShell command used for the dump?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '2556'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '2556'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious credential dumping activity was observed when process with field 
          ProcessId__CreatedTimeUtc__CommandLine value `2556__2024-08-01t12:37:29.6522416z__"powershell.exe" 
          -encodedcommand ...` accessed NTDS.dit.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, an Azure Resource Manager operation was performed from host with field HostName 
          value `vnevado-dc`, coming from a known proxy IP address.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Subsequently, the user account with field AadUserId value `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360` 
          clicked on a malicious URL, indicating the compromise reached the end user.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
