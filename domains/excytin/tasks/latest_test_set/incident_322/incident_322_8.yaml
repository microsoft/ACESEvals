tasks:
- task_id: incident_322_latest_test_set_task_8
  title: incident_322_latest_test_set_task_8
  description: 'According to the proxy-log alert, which external IP address did host vnevado-win11h.vnevado.alpineskihouse.co
    connect to when accessing the domain login.micro.demo.antoinetest.ovh?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing investigation, we observed that user "Hailey Johnson" clicked a suspicious link which
      was later quarantined by Zero-Hour Auto Purge (ZAP). Shortly after, another alert indicated that a malicious URL was
      accessed from a corporate workstation. Proxy logs now reveal that the same workstation (vnevado-win11h.vnevado.alpineskihouse.co)
      established a connection to the domain login.micro.demo.antoinetest.ovh, suggesting possible follow-on activity.'
    question: 'According to the proxy-log alert, which external IP address did host vnevado-win11h.vnevado.alpineskihouse.co
      connect to when accessing the domain login.micro.demo.antoinetest.ovh?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '231.60.52.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '231.60.52.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – Url: https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/  ➔ A user clicked
          this URL in an email that was later quarantined by Zero-Hour Auto Purge (ZAP).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – HostName: vnevado-win11h  ➔ The same malicious URL was then clicked on this device, indicating
          potential compromise of the workstation.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – Address: 231.60.52.209  ➔ Proxy logs show traffic from this external IP address to a suspicious
          host, confirming outbound communication associated with the earlier malicious activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
