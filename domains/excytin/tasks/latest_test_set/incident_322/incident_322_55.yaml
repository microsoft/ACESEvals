tasks:
- task_id: incident_322_latest_test_set_task_55
  title: incident_322_latest_test_set_task_55
  description: 'Provide the full URL that the user clicked, which led to the “User accessed a link in an email subsequently
    quarantined by ZAP” alert.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, you observe that the user alyssat@vnevado.alpineskihouse.co was reported in
      an alert titled “A potentially malicious URL click was detected.” Shortly after, additional alerts indicated that emails
      containing a malicious link were removed and that the same user later clicked a link in an email that was subsequently
      quarantined by zero-hour auto-purge (ZAP). Your task is to identify details about the specific link involved in that
      final alert.'
    question: 'Provide the full URL that the user clicked, which led to the “User accessed a link in an email subsequently
      quarantined by ZAP” alert.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A potentially malicious URL click was detected for mailmessage Recipient 
          `alyssat@vnevado.alpineskihouse.co`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The email containing the malicious URL was removed after delivery, linked to account Name `Hailey 
          Johnson`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A user accessed the link `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`, 
          which was subsequently quarantined by ZAP.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
