      same device by an identified user account, and the activity chain culminated in a separate alert flagging suspicious
      Azure Resource Management (ARM) operations initiated by that risky user. Analysts now need to determine further details
      about this cloud-based activity.'
    question: 'During the suspicious Azure Resource Management (ARM) operations carried out by the risky user, from which
      IP address did the activity originate?'
