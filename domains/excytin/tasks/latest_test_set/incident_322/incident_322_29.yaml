tasks:
- task_id: incident_322_latest_test_set_task_29
  title: incident_322_latest_test_set_task_29
  description: 'According to the last alert in this attack chain ("Malicious URL was clicked on that device"), which IP address
    was associated with the device that accessed the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'A sequence of related security alerts began when an attacker ran "powershell.exe" with an encoded command
      and then executed "ntdsutil.exe" to harvest Active Directory data from a domain controller (hostname withheld). Minutes
      later, Microsoft Defender for Resource Manager detected the same user performing suspicious ARM operations from a proxy
      network. Finally, an alert titled "Malicious URL was clicked on that device" was triggered, completing the attack chain.'
    question: 'According to the last alert in this attack chain ("Malicious URL was clicked on that device"), which IP address
      was associated with the device that accessed the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '172.33.118.200'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Attackers executed Ntdsutil to collect Active Directory data on the host with HostName 
          `vnevado-dc`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Later, a suspicious Azure Resource Manager operation originated from the account with AadUserId 
          `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Ultimately, a malicious URL was clicked from the device using IP Address `172.33.118.200`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
