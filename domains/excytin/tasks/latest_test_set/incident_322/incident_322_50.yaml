tasks:
- task_id: incident_322_latest_test_set_task_50
  title: incident_322_latest_test_set_task_50
  description: 'According to the alert "Ntdsutil collecting Active Directory information", what executable was run during
    this suspicious process?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the incident investigation we observed that a user on host "vnevado-win11h" browsed to a known-malicious
      URL using the process "msedge.exe" (PID 4256) at 2024-08-01T13:42:52Z. Additional correlated alerts show that shortly
      beforehand an alert titled "Ntdsutil collecting Active Directory information" was raised, indicating a suspicious attempt
      to gather AD data on the same environment. Details of that process are being examined to understand what was executed.'
    question: 'According to the alert "Ntdsutil collecting Active Directory information", what executable was run during this
      suspicious process?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ntdsutil.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ntdsutil.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A process with the field `ProcessId__CreatedTimeUtc__CommandLine` and value 
          `6748__2024-08-01t12:37:30.2769191z__"ntdsutil.exe" "ac i ntds" ifm "create full c:\temp" q q` was executed, 
          indicating the use of ntdsutil to collect Active Directory information.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: An Azure Resource Manager operation originated from the host with field `HostName` and value 
          `vnevado-dc`, coming from a suspicious proxy IP address.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The account with field `Name` and value `Hailey Johnson` clicked a malicious URL on the device.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
