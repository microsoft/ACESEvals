tasks:
- task_id: incident_322_latest_test_set_task_5
  title: incident_322_latest_test_set_task_5
  description: 'During the suspicious Azure Resource Management (ARM) activities that followed the malicious email, what was
    the external IP address associated with the risky user’s session?'
  inherit_shared: true
  initial_context:
    incident_context: 'An email containing the malicious URL "dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io"
      was sent from raphaelt@vnevado.alpineskihouse.co to alyssat@vnevado.alpineskihouse.co and later removed after delivery.
      This activity raised concerns about possible follow-on actions. Shortly after, Microsoft Defender generated a separate
      alert indicating that a risky user carried out suspicious Azure Resource Management (ARM) operations during a high-risk
      session.'
    question: 'During the suspicious Azure Resource Management (ARM) activities that followed the malicious email, what was
      the external IP address associated with the risky user’s session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '253.1.244.215'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-08-01 12:44:53 UTC, an email containing a malicious URL was delivered to — and subsequently
          removed from — the Azure AD user (Field: AadUserId, Value: 5e5dd0bd-f7ed-4583-8e9e-52f91e31a360).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Thirty-five minutes later, at 2024-08-01 13:19:20 UTC, suspicious Azure Resource Manager operations
          were carried out from the IP address (Field: Address, Value: 253.1.244.215), indicating that the same user account
          may have been compromised and abused from this source.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
