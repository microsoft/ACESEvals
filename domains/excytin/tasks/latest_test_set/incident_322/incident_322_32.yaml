tasks:
- task_id: incident_322_latest_test_set_task_32
  title: incident_322_latest_test_set_task_32
  description: 'Which user account name was ultimately identified in the related alert connected to this malicious URL click?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a recent alert, we observed that a malicious URL (https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/)
      was clicked from Microsoft Edge (process ID 4256) on host vnevado-win11h (device ID 76707c40-3343-490e-9205-88fdb51aefe0).
      The activity originated from IP address 172.33.118.200 and was tied to Azure AD user ID 5e5dd0bd-f7ed-4583-8e9e-52f91e31a360.
      Another related alert in the same incident identified a specific user account involved in this chain of events.'
    question: 'Which user account name was ultimately identified in the related alert connected to this malicious URL click?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Hailey Johnson'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Hailey Johnson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: The user account Name `Hailey Johnson` clicked on a malicious URL on the device.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
