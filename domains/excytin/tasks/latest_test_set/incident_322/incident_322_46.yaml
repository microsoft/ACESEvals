tasks:
- task_id: incident_322_latest_test_set_task_46
  title: incident_322_latest_test_set_task_46
  description: 'Which user’s mailbox (provide the email address) was identified as having clicked the malicious link in the
    final alert of this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a proxy alert reported that host 231.60.52.209 accessed the URL login.micro.demo.antoinetest.ovh.
      Subsequent alerts indicated that the same malicious link was clicked on a corporate device, and later Microsoft 365
      removed emails that had contained this URL after they had already reached users’ mailboxes. Finally, the system flagged
      a potentially malicious URL click by one of our users.'
    question: 'Which user’s mailbox (provide the email address) was identified as having clicked the malicious link in the
      final alert of this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: HostName `vnevado-win11h` was observed reaching out to the malicious site 
          login.micro.demo.antoinetest.ovh in the proxy logs (2024-08-01 12:47:22 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Account Name `Hailey Johnson` clicked a malicious URL on that same device, indicating potential 
          user-level compromise (2024-08-01 13:49:58 UTC).
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: MailMessage Recipient `alyssat@vnevado.alpineskihouse.co` received an email that contained a 
          malicious URL, which was subsequently removed after delivery (2024-08-01 12:44:53 UTC).
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: MailMessage Recipient `alyssat@vnevado.alpineskihouse.co` was also recorded clicking the 
          potentially malicious URL, confirming user interaction with the threat (2024-08-01 12:44:53 UTC).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
