tasks:
- task_id: incident_322_latest_test_set_task_1
  title: incident_322_latest_test_set_task_1
  description: 'What is the email address of the recipient who clicked the potentially malicious URL?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent security incident, we observed that the tool "ntdsutil.exe" was launched via PowerShell
      on an unknown host as part of a suspicious attempt to collect Active Directory information (alert: "Ntdsutil collecting
      Active Directory information", time 2024-08-01 12:54 UTC). Investigation shows the same incident later generated multiple
      cloud- and email-related alerts, including the removal of messages that contained a malicious URL and, shortly after,
      a user clicking that malicious link. The email alert indicates the message was delivered, removed, and then clicked
      by the intended recipient.'
    question: 'What is the email address of the recipient who clicked the potentially malicious URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Ntdsutil was executed on the domain-controller host with HostName `vnevado-dc`, indicating 
          potential Active Directory reconnaissance.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A resource-management operation coming through a suspicious proxy was performed by the account with
          Sid `S-1-5-21-1840151686-3534835288-156286563-1127`, suggesting lateral movement toward cloud assets.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: An email message sent to Recipient `alyssat@vnevado.alpineskihouse.co` that contained a malicious 
          URL was detected and removed after delivery.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Despite the removal, the same Recipient `alyssat@vnevado.alpineskihouse.co` subsequently clicked 
          the malicious URL, showing successful user engagement with the threat.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
