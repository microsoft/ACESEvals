tasks:
- task_id: incident_322_latest_test_set_task_26
  title: incident_322_latest_test_set_task_26
  description: 'According to the Azure Resource Manager alert that followed the NTDS.dit dumping activity, what is the Security
    Identifier (SID) of the account that performed the suspicious operation from the proxy IP?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a suspicious credential dumping activity was detected: the executable "ntdsutil.exe"
      (PID 6748, launched at 2024-08-01 12:37:30 UTC) was run via PowerShell right after an encoded-command invocation of
      "powershell.exe" (PID 2556). This occurred on a domain controller, indicating that an attacker may have tried to extract
      credentials from NTDS.dit. Later in the same incident, Microsoft Defender for Resource Manager raised an alert about
      a resource-management action that originated from a proxy-associated IP address, suggesting the attacker might be moving
      to cloud resources while attempting to stay anonymous.'
    question: 'According to the Azure Resource Manager alert that followed the NTDS.dit dumping activity, what is the Security
      Identifier (SID) of the account that performed the suspicious operation from the proxy IP?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840151686-3534835288-156286563-1127'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840151686-3534835288-156286563-1127'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious credential dumping activity was observed on host `vnevado-dc` (HostName = vnevado-dc).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, an Azure Resource Manager operation originated from a proxy IP by an account with SID
          `S-1-5-21-1840151686-3534835288-156286563-1127` (Sid = S-1-5-21-1840151686-3534835288-156286563-1127).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
