tasks:
- task_id: incident_322_latest_test_set_task_31
  title: incident_322_latest_test_set_task_31
  description: 'According to the alert titled "User accessed a link in an email subsequently quarantined by ZAP", what is
    the display name of the user who clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'A proxy alert reported that the device at IP address 231.60.52.209 (hostname vnevado-win11h.vnevado.alpineskihouse.co)
      reached out to the suspicious URL login.micro.demo.antoinetest.ovh. This behavior triggered further investigation. During
      the same incident timeline, another security control (Microsoft Defender for Office 365) raised an alert indicating
      that a user clicked a link in an email which was later quarantined by Zero-hour Auto Purge (ZAP).'
    question: 'According to the alert titled "User accessed a link in an email subsequently quarantined by ZAP", what is the
      display name of the user who clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Hailey Johnson'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Hailey Johnson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – Host compromise: Proxy logs show a suspicious connection from host with HostName `vnevado-win11h`
          to login.micro.demo.antoinetest.ovh on 2024-08-01 12:47:22 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – Malicious click: On that same device, the account with AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`
          clicked the malicious URL on 2024-08-01 13:49:58 UTC.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – Email source: The user with Name `Hailey Johnson` had earlier accessed a link in an email that
          was subsequently quarantined by ZAP at 2024-08-01 12:54:55 UTC, revealing the email as the likely origin of the
          malicious URL.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
