tasks:
- task_id: incident_322_latest_test_set_task_19
  title: incident_322_latest_test_set_task_19
  description: 'Identify the full URL that the user clicked in the email which was later quarantined by ZAP.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a credential-dumping attempt that leveraged the tool `ntdsutil.exe`, security
      telemetry shows the same activity cluster later triggered an Office 365 alert: a user clicked a link in an email that
      was subsequently quarantined by Zero-hour Auto Purge (ZAP). Analysts must verify details of this potentially malicious
      link to understand the attack chain.'
    question: 'Identify the full URL that the user clicked in the email which was later quarantined by ZAP.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The attacker first targeted the domain controller host (Field: HostName, Value: `vnevado-dc`) and successfully
          performed a suspicious credential dump from NTDS.dit.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'With credentials in hand, the attacker then carried out an Azure Resource Manager operation from a suspicious
          proxy using the compromised account (Field: Sid, Value: `S-1-5-21-1840151686-3534835288-156286563-1127`).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Finally, the same attack path led the user to click a malicious link (Field: Url, Value: `https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/`),
          which was later quarantined by Zero-Hour Auto Purge (ZAP).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
