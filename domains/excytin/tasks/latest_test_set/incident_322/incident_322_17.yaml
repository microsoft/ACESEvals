tasks:
- task_id: incident_322_latest_test_set_task_17
  title: incident_322_latest_test_set_task_17
  description: 'Which executable was identified as the process responsible for the suspicious NTDS.dit credential dump in
    the final alert of this incident?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a connection from the endpoint vnevado-win11h.vnevado.alpineskihouse.co (IP
      231.60.52.209) to the URL login.micro.demo.antoinetest.ovh triggered the alert "Malicious Url detected in Proxy logs"
      on 2024-08-01 12:47:22 UTC. Subsequent correlated alerts revealed that the attacker later performed a suspicious NTDS.dit
      credential dump on a domain controller, indicating an attempt to harvest user credentials.'
    question: 'Which executable was identified as the process responsible for the suspicious NTDS.dit credential dump in the
      final alert of this incident?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Alert shows a malicious URL connection originating from HostName `vnevado-win11h`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: On that device, the Account identified by Sid `S-1-5-21-1840151686-3534835288-156286563-1127` 
          clicked the malicious URL.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Subsequently, the attacker leveraged the Process with ExtractedFileName `powershell.exe` to perform
          a suspicious NTDS.dit credential dump.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Later, an Azure Resource Manager operation from a proxy IP was detected on HostName `vnevado-dc`, 
          indicating possible lateral movement toward the domain controller.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
