tasks:
- task_id: incident_322_latest_test_set_task_3
  title: incident_322_latest_test_set_task_3
  description: 'During the ‘Ntdsutil collecting Active Directory information’ alert, what was the Process ID (PID) of the
    ntdsutil.exe instance that ran on the domain controller?'
  inherit_shared: true
  initial_context:
    incident_context: 'Microsoft Defender for Resource Manager has raised an alert regarding a resource-management operation
      carried out from a proxy-associated IP address (253.1.244.215). The activity is tied to the Azure subscription 7e838342-601f-4552-9baf-0dfb300cf555
      in resource group "ctfcat" and involves the account "Hailey Johnson". During follow-up investigation on the same incident,
      analysts noticed that a short time earlier a tool called ntdsutil.exe was executed on the domain controller to export
      Active Directory data, suggesting possible credential-harvesting or lateral-movement preparation.'
    question: 'During the ‘Ntdsutil collecting Active Directory information’ alert, what was the Process ID (PID) of the ntdsutil.exe
      instance that ran on the domain controller?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '6748'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '6748'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-08-01T12:37:30.2769191Z, the process 'ntdsutil.exe' was launched with the parameters 
          ProcessId__CreatedTimeUtc__CommandLine=6748__2024-08-01t12:37:30.2769191z__"ntdsutil.exe" "ac i ntds" ifm 
          "create full c:\temp" q q, indicating an attempt to collect Active Directory information.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, at 2024-08-01T13:09:13.222398Z, a suspicious Azure Resource Manager operation was 
          observed from the host with HostName=vnevado-dc, showing the attacker pivoting to cloud resource manipulation 
          from the compromised domain controller.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
