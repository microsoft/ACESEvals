tasks:
- task_id: incident_322_latest_test_set_task_27
  title: incident_322_latest_test_set_task_27
  description: 'According to the alert about the user clicking a link that was later quarantined by ZAP, what is the full
    URL that the user accessed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a multi-stage incident, we observed that at 2024-08-01 12:54:34 UTC a process
      named "ntdsutil.exe" was launched through PowerShell on a specific host (hostname withheld), indicating possible Active
      Directory data collection. The same user later performed an Azure Resource Manager operation from a proxy-associated
      IP. Shortly afterwards, Microsoft Defender for Office 365 raised an alert because the user clicked a link in an email
      that was later quarantined by Zero-hour Auto Purge (ZAP).'
    question: 'According to the alert about the user clicking a link that was later quarantined by ZAP, what is the full URL
      that the user accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'HostName: vnevado-dc – Ntdsutil was executed on this host to collect Active Directory information.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Name: Hailey Johnson – This account initiated an Azure Resource Manager operation from a suspicious
          proxy IP address.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Url: https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/ – The user accessed this link
          in an email that was subsequently quarantined by ZAP.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
