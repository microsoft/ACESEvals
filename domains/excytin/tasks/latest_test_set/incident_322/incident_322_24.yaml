tasks:
- task_id: incident_322_latest_test_set_task_24
  title: incident_322_latest_test_set_task_24
  description: 'Which recipient received the email messages containing the malicious URL that were later removed?'
  inherit_shared: true
  initial_context:
    incident_context: 'An investigation began when a PowerShell script launched the tool "ntdsutil.exe" to harvest Active
      Directory data on a domain controller. Shortly afterward, a suspicious Azure Resource Manager operation was executed
      from a proxy IP address using a risky account SID. In the same incident timeline, Microsoft 365 security controls reported
      that one or more email messages containing a malicious URL were delivered to a user and later removed from their mailbox.'
    question: 'Which recipient received the email messages containing the malicious URL that were later removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The alert shows that on the host with HostName `vnevado-dc`, the tool `ntdsutil` was executed to 
          collect Active Directory information.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, an Azure Resource Manager operation was performed by a suspicious account identified 
          by Sid `S-1-5-21-1840151686-3534835288-156286563-1127`, coming from a proxy IP address.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, an email addressed to Recipient `alyssat@vnevado.alpineskihouse.co` was removed after 
          delivery because it contained a malicious URL.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
