tasks:
- task_id: incident_322_latest_test_set_task_10
  title: incident_322_latest_test_set_task_10
  description: 'According to the "Malicious Url detected in Proxy logs" alert, what external IP address was observed communicating
    with the domain login.micro.demo.antoinetest.ovh?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing investigation, Microsoft Defender for Resource Manager raised an alert for a resource-management
      operation executed on the Azure VM "vnevado-dc" (subscription 7e838342-601f-4552-9baf-0dfb300cf555, resource group "ctfcat").
      The operation originated from the suspicious proxy address 253.1.244.215. Shortly afterwards, another alert indicated
      that a malicious URL had been clicked from one of the organisation’s endpoints. A third alert, titled "Malicious Url
      detected in Proxy logs", reported that a workstation (vnevado-win11h.vnevado.alpineskihouse.co) reached out to the domain
      login.micro.demo.antoinetest.ovh, but the specific external IP seen in the proxy logs still needs to be confirmed.'
    question: 'According to the "Malicious Url detected in Proxy logs" alert, what external IP address was observed communicating
      with the domain login.micro.demo.antoinetest.ovh?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '228.3.31.94'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '228.3.31.94'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-08-01 13:09:13 UTC, a risky Azure Resource Manager operation was performed by the account 
          with Sid `S-1-5-21-1840151686-3534835288-156286563-1127`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'At 2024-08-01 13:49:58 UTC, a malicious URL was clicked on the host `vnevado-win11h` (Field: HostName).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'At 2024-08-01 12:47:22 UTC, proxy logs recorded a connection to a malicious URL originating from IP
          address `228.3.31.94` (Field: Address).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
