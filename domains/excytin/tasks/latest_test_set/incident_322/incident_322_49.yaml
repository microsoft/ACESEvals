tasks:
- task_id: incident_322_latest_test_set_task_49
  title: incident_322_latest_test_set_task_49
  description: 'According to the "Malicious URL was clicked on that device" alert, what is the IP address of the device that
    accessed the malicious URL?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring has flagged that user "Hailey Johnson" (email: Hailey Johnson@vnevado.alpineskihouse.co,
      SID ending in -1127) clicked a suspicious link contained in an email that was later quarantined by Zero-hour Auto Purge
      (ZAP). The link visited was: https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/

      Shortly after this event, another alert titled "Malicious URL was clicked on that device" was generated, indicating
      that the same risky URL was opened from Hailey’s device. Investigators now need to identify the network location from
      which this malicious URL was accessed.'
    question: 'According to the "Malicious URL was clicked on that device" alert, what is the IP address of the device that
      accessed the malicious URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '172.33.118.200'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user with account SID `S-1-5-21-1840151686-3534835288-156286563-1127` clicked a link in an email 
          that was later quarantined by Zero-hour Auto Purge (ZAP).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, a malicious URL was clicked from the device using the IP address `172.33.118.200`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
