  initial_context:
    incident_context: 'On 2024-08-01 at 12:47 UTC, the workstation vnevado-win11h (source IP 231.60.52.209) triggered a "Malicious
      Url detected in Proxy logs" alert after attempting an outbound connection to an unknown external login site. The specific
      destination URL needs to be identified to continue the investigation.'
    question: 'What is the full URL of the external site that vnevado-win11h tried to contact, which caused the "Malicious
      Url detected in Proxy logs" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'login.micro.demo.antoinetest.ovh'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'login.micro.demo.antoinetest.ovh'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'Proxy logs revealed that the host attempted to access a malicious resource (Url: login.micro.demo.antoinetest.ovh).'
  scoring_aggregation:
    max:
      scores:
      - submission
