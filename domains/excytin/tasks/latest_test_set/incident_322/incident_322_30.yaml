tasks:
- task_id: incident_322_latest_test_set_task_30
  title: incident_322_latest_test_set_task_30
  description: 'According to the alert titled "A potentially malicious URL click was detected" raised at 2024-08-01 12:44:53
    Z, what is the email address of the user who clicked the malicious link?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a credential-dumping activity where an attacker ran `ntdsutil.exe` from
      a PowerShell session, we traced related alerts in the same incident. Shortly after the dump attempt, Microsoft Defender
      for Resource Manager noted a suspicious Azure Resource Manager operation originating from a proxy IP, followed by an
      Exchange Online alert indicating that email messages with a malicious URL had been removed post-delivery. A final alert
      then reported that a user actually clicked the malicious link.'
    question: 'According to the alert titled "A potentially malicious URL click was detected" raised at 2024-08-01 12:44:53
      Z, what is the email address of the user who clicked the malicious link?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-08-01 12:49:26.753626+00:00 a suspicious credential dump of NTDS.dit was detected on the 
          domain controller with HostName=vnevado-dc.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: At 2024-08-01 13:09:13.222398+00:00 an Azure Resource Manager operation originated from a proxy IP 
          using the account Email=Hailey Johnson@vnevado.alpineskihouse.co.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: At 2024-08-01 12:44:53.291456+00:00 an email containing a malicious URL was delivered and later 
          removed for mail message Recipient=alyssat@vnevado.alpineskihouse.co.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: At 2024-08-01 12:44:53.271124+00:00 a potentially malicious URL click was detected from the same 
          mail message Recipient=alyssat@vnevado.alpineskihouse.co.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
