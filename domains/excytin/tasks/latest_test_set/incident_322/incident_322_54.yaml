tasks:
- task_id: incident_322_latest_test_set_task_54
  title: incident_322_latest_test_set_task_54
  description: 'According to the alert, which user’s mailbox ultimately received (and later had removed) the email containing
    the malicious URL?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring has flagged an incident in which an email originating from raphaelt@vnevado.alpineskihouse.co
      (sending IP 202.205.215.225) contained the suspicious URL dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io.
      The message was delivered and subsequently removed by the "Email messages containing malicious URL removed after delivery"
      alert raised on 2024-08-01 12:44:53 UTC.'
    question: 'According to the alert, which user’s mailbox ultimately received (and later had removed) the email containing
      the malicious URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-08-01 12:44:53.291456+00:00, an email containing a malicious URL was delivered and 
          subsequently removed. The affected MailMessage entity had Recipient `alyssat@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
