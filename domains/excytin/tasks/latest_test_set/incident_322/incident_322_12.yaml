tasks:
- task_id: incident_322_latest_test_set_task_12
  title: incident_322_latest_test_set_task_12
  description: 'What was the malicious URL that was removed from the user’s mailbox according to the follow-up alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that the user alyssat@vnevado.alpineskihouse.co clicked a link
      in an email, triggering the alert “A potentially malicious URL click was detected.” Shortly afterward, a follow-up alert
      reported that the email containing the same malicious link was automatically removed from the mailbox to prevent further
      exposure.'
    question: 'What was the malicious URL that was removed from the user’s mailbox according to the follow-up alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The alert shows a potentially malicious URL click was detected for recipient (Field: Recipient) `alyssat@vnevado.alpineskihouse.co`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, the email containing the malicious URL (Field: Url) `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`
          was removed after delivery.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
