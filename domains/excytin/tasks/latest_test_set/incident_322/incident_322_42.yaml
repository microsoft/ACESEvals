tasks:
- task_id: incident_322_latest_test_set_task_42
  title: incident_322_latest_test_set_task_42
  description: 'According to the alert about suspicious Azure Resource Management activities, what external IP address was
    associated with the risky user’s sign-in session?'
  inherit_shared: true
  initial_context:
    incident_context: 'A user in our organization clicked on a potentially malicious URL (https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/)
      contained in an email that was later quarantined by Zero-hour Auto Purge (ZAP). Shortly after this event, Microsoft
      Defender generated another alert indicating that the same user carried out suspicious Azure Resource Management (ARM)
      operations during a risky sign-in session originating from an external IP address.'
    question: 'According to the alert about suspicious Azure Resource Management activities, what external IP address was
      associated with the risky user’s sign-in session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '253.1.244.215'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '253.1.244.215'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user with account email `Hailey Johnson@vnevado.alpineskihouse.co` accessed a link in an email 
          that was later quarantined by Zero-hour Auto Purge (ZAP).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious Azure Resource Management activities were then detected coming from the IP address 
          `253.1.244.215`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
