tasks:
- task_id: incident_322_latest_test_set_task_21
  title: incident_322_latest_test_set_task_21
  description: 'What is the full Azure Resource ID of the virtual machine that was involved in the proxy-originated Azure
    Resource Manager operation?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of the incident a malicious URL was accessed from the host vnevado-win11h.vnevado.alpineskihouse.co
      (IP 231.60.52.209) leading to additional alerts, including a Microsoft Defender for Resource Manager alert that a resource
      management operation originated from a proxy IP. Analysts must determine which Azure resource was targeted.'
    question: 'What is the full Azure Resource ID of the virtual machine that was involved in the proxy-originated Azure Resource
      Manager operation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.compute/virtualmachines/vnevado-dc'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.compute/virtualmachines/vnevado-dc'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A malicious URL was first detected in the proxy logs coming from the host with HostName 
          `vnevado-win11h`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Later, the malicious URL was clicked from the account whose Email is `Hailey 
          Johnson@vnevado.alpineskihouse.co`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Shortly after, a suspicious Azure Resource Manager operation was carried out against the 
          azure-resource with ResourceId 
          `/subscriptions/7e838342-601f-4552-9baf-0dfb300cf555/resourcegroups/ctfcat/providers/microsoft.compute/virtualmachines/vnevado-dc`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
