tasks:
- task_id: incident_322_latest_test_set_task_53
  title: incident_322_latest_test_set_task_53
  description: 'According to the alert about the suspicious NTDS.dit credential dump, which executable was identified as the
    process used to perform this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that a user clicked on the URL https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/
      in an email that was later quarantined by Zero-hour Auto Purge (ZAP). Shortly afterward, Microsoft Defender for Resource
      Manager flagged an operation originating from a suspicious proxy IP, performed from an as-yet-unidentified host. Around
      the same timeframe, another alert reported a suspicious NTDS.dit credential-dumping attempt, suggesting that an attacker
      tried to extract credentials from the domain controller.'
    question: 'According to the alert about the suspicious NTDS.dit credential dump, which executable was identified as the
      process used to perform this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Account Name = `Hailey Johnson`: The user clicked on a link in an email that was later quarantined by
          ZAP (Time: 2024-08-01 12:54:55.663380+00:00).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Process ExtractedFileName = `powershell.exe`: PowerShell was used to perform a suspicious credential
          dump from NTDS.dit (Time: 2024-08-01 12:49:26.753626+00:00).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'HostName = `vnevado-dc`: An Azure Resource Manager operation originated from this host, coming through
          a suspicious proxy IP address (Time: 2024-08-01 13:09:13.222398+00:00).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
