tasks:
- task_id: incident_322_latest_test_set_task_13
  title: incident_322_latest_test_set_task_13
  description: 'What IP address was recorded in the alert indicating that a malicious URL was clicked on the device "vnevado-dc"?'
  inherit_shared: true
  initial_context:
    incident_context: 'Microsoft Defender for Resource Manager reported that the virtual machine "vnevado-dc" (resource ID
      ending in "/virtualmachines/vnevado-dc") performed a management operation from the suspicious proxy IP address 253.1.244.215.
      This activity originated from the Azure subscription 7e838342-601f-4552-9baf-0dfb300cf555 within the "ctfcat" resource
      group. Later in the same investigation, a separate alert titled "Malicious URL was clicked on that device" was raised
      for the same host, indicating possible web-based compromise activity.'
    question: 'What IP address was recorded in the alert indicating that a malicious URL was clicked on the device "vnevado-dc"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '172.33.118.200'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '172.33.118.200'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A resource management operation was performed from a proxy service and was tied to the account with
          AadUserId `5e5dd0bd-f7ed-4583-8e9e-52f91e31a360`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, a malicious URL was clicked from the IP address `Address=172.33.118.200`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
