tasks:
- task_id: incident_322_latest_test_set_task_14
  title: incident_322_latest_test_set_task_14
  description: 'What is the full URL that was present in the email messages which were removed after delivery?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we identified a security incident where a user on host "vnevado-win11h" (device
      ID 76707c40-3343-490e-9205-88fdb51aefe0, IP 172.33.118.200) launched the browser process "msedge.exe" and clicked a
      suspicious link at 13:49 UTC on 1 Aug 2024. Earlier, Exchange Online had already detected and removed emails containing
      that same malicious link.'
    question: 'What is the full URL that was present in the email messages which were removed after delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An email message containing the malicious URL (Url: `dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io`)
          was delivered and subsequently removed.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Later, the user account (Name: `Hailey Johnson`) clicked on that malicious URL.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
