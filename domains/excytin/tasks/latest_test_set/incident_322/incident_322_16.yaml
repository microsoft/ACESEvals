tasks:
- task_id: incident_322_latest_test_set_task_16
  title: incident_322_latest_test_set_task_16
  description: 'According to the alert about the removed email messages, what is the email address of the sender of those
    messages?'
  inherit_shared: true
  initial_context:
    incident_context: 'While investigating a security incident, we observed that a user clicked the URL "https://dj01161621.bravesand-e1ccd718.eastus.azurecontainerapps.io/"
      embedded in an email. The message was later quarantined by Zero-hour Auto Purge (ZAP) as part of the alert titled "User
      accessed a link in an email subsequently quarantined by ZAP" generated at 2024-08-01 12:54:55 UTC. A related alert,
      raised ten minutes earlier, indicates that email messages containing this same malicious URL were removed after delivery.'
    question: 'According to the alert about the removed email messages, what is the email address of the sender of those messages?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'raphaelt@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'raphaelt@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A malicious email was sent by sender `raphaelt@vnevado.alpineskihouse.co` (mailmessage.Sender) and 
          later removed after delivery.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, the user with SID `S-1-5-21-1840151686-3534835288-156286563-1127` (account.Sid) 
          clicked a link in the same email, which was later quarantined by ZAP.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
