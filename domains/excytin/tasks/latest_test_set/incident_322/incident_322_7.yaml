tasks:
- task_id: incident_322_latest_test_set_task_7
  title: incident_322_latest_test_set_task_7
  description: 'According to the cloud-side alert about an Azure Resource Manager operation coming from a suspicious proxy
    IP, which user account (provide the email address) executed that operation?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed an on-premises alert titled "Ntdsutil collecting Active Directory
      information" at 2024-08-01 12:54:34 UTC. The activity originated from an unspecified server and involved the execution
      of both "powershell.exe" and "ntdsutil.exe"—a common technique attackers use to extract Active Directory data for later
      lateral movement. Roughly fifteen minutes later, Microsoft Defender for Resource Manager raised another alert noting
      that someone performed Azure Resource Manager operations from an IP address associated with proxy services, a tactic
      often used to hide the attacker’s true source.'
    question: 'According to the cloud-side alert about an Azure Resource Manager operation coming from a suspicious proxy
      IP, which user account (provide the email address) executed that operation?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Hailey Johnson@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Hailey Johnson@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Attackers executed Ntdsutil to gather Active Directory information on the host with HostName 
          `vnevado-dc`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly afterward, an Azure Resource Manager operation was performed from a suspicious proxy IP 
          using the account with Email `Hailey Johnson@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
