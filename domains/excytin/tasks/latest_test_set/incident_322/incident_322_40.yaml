tasks:
- task_id: incident_322_latest_test_set_task_40
  title: incident_322_latest_test_set_task_40
  description: 'According to the alert about the email message that was removed after it was delivered, which recipient’s
    email address originally received that malicious message?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a proxy alert showed that a machine at IP address 231.60.52.209 attempted
      to reach the suspicious URL login.micro.demo.antoinetest.ovh. This activity triggered further alerts in the same incident,
      including one where an email message containing that malicious URL was delivered and later removed by security controls.'
    question: 'According to the alert about the email message that was removed after it was delivered, which recipient’s email
      address originally received that malicious message?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A malicious email was delivered to recipient `alyssat@vnevado.alpineskihouse.co` 
          (mailmessage.Recipient) and subsequently removed after delivery.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The host `vnevado-win11h` (host.HostName) established a connection to the malicious URL 
          `login.micro.demo.antoinetest.ovh`, as recorded in proxy logs.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The user account `Hailey Johnson@vnevado.alpineskihouse.co` (account.Email) clicked the malicious 
          URL on the device.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
