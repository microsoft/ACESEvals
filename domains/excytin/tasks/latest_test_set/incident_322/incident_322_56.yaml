tasks:
- task_id: incident_322_latest_test_set_task_56
  title: incident_322_latest_test_set_task_56
  description: 'According to the alert titled "Email messages containing malicious URL removed after delivery", from which
    IP address were those malicious emails originally sent?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a multi-stage intrusion, analysts observed a "Suspicious credential dump
      from NTDS.dit" on 2024-08-01 involving the execution of both an encoded PowerShell script ("powershell.exe") and the
      tool "ntdsutil.exe" on an affected device. Shortly after, an "Azure Resource Manager operation from a suspicious proxy
      IP address" was flagged for the same activity chain, suggesting possible lateral movement to the cloud. Further review
      uncovered that several email messages containing a malicious URL had been delivered to users’ mailboxes and were later
      automatically removed by security controls.'
    question: 'According to the alert titled "Email messages containing malicious URL removed after delivery", from which
      IP address were those malicious emails originally sent?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '202.205.215.225'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '202.205.215.225'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious credential dump from NTDS.dit was detected on the domain controller with HostName 
          `vnevado-dc`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: An Azure Resource Manager operation was performed by the account whose Name is `Hailey Johnson`, 
          and it originated from a proxy-associated IP.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Email messages containing a malicious URL were removed; they were sent from a mail message whose 
          SenderIP is `202.205.215.225`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
