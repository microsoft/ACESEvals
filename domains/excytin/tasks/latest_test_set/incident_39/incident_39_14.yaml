tasks:
- task_id: incident_39_latest_test_set_task_14
  title: incident_39_latest_test_set_task_14
  description: 'In the follow-up alert that reported a credential-theft tool execution, what is the name of the executable
    that was run on the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a device named "vnevado-win10b" (AadDeviceId: fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb)
      we observed indications of human-operated malicious activity. The sequence began with a suspicious sign-in attempt using
      a deceptive account and continued with further actions suggesting credential-theft behavior on the same endpoint.'
    question: 'In the follow-up alert that reported a credential-theft tool execution, what is the name of the executable
      that was run on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious credential-theft tool was run: field `ProcessId__CreatedTimeUtc__CommandLine` = `6880__2024-06-27t14:32:37.7041174z__"mimikatz.exe"
          privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co
          /run:\"powershell.exe dir \\vnevado-win10b\c$\"" exit`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, a deceptive sign-in was attempted using field `AadUserId` = 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, indicating an attacker-controlled account.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: These events culminated in an alert of potential human-operated activity involving field `Name` = 
          `kyleg`, suggesting the device is now under active malicious control.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
