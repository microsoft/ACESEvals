  description: 'What is the Azure AD user ID (AadUserId) tied to the "Kekeo" malware detection that occurred at 22:35:03 UTC
    on 2024-07-04?'
  inherit_shared: true
  initial_context:
    incident_context: 'During analysis of a recent incident we observed a series of suspicious "net.exe" commands (e.g., "net.exe
      user /domain" and queries for privileged groups) executed within seconds of each other. This behavior was flagged by
      the alert titled "Anomalous account lookups" on 2024-07-04 at 22:35 UTC, suggesting an attacker was enumerating domain
      accounts. Immediately afterward, another alert indicated that PsExec was used to run a command on a remote system, pointing
      to potential lateral-movement activity. Shortly following these events, Microsoft Defender detected active "Kekeo" malware
      on a machine, confirming a likely compromise associated with the same activity chain.'
    question: 'What is the Azure AD user ID (AadUserId) tied to the "Kekeo" malware detection that occurred at 22:35:03 UTC
      on 2024-07-04?'
