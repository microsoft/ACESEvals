tasks:
- task_id: incident_39_latest_test_set_task_92
  title: incident_39_latest_test_set_task_92
  description: 'During the suspected overpass-the-hash attempt on 2024-07-10, what is the name of the Helpdesk Administrator
    account that tried to authenticate to VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'A device named VNEVADO-Win10b raised a Potential human-operated malicious activity alert on 2024-07-04.
      During this event we observed several suspicious processes, including the execution of rubeus.exe (Process ID 2608)
      launched from the command line and the creation of the file adminticket.txt. The activity involved local accounts such
      as fk8mq and kyleg and came from the public IP address 141.216.110.153. A few days later, another alert was generated
      for a suspected overpass-the-hash (Kerberos) attempt from workstation VNEVADO-Win10V against the domain controller VNEVADO-DC,
      performed by a Helpdesk Administrator.'
    question: 'During the suspected overpass-the-hash attempt on 2024-07-10, what is the name of the Helpdesk Administrator
      account that tried to authenticate to VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Emma Clark'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Emma Clark'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Potential human-operated malicious activity was observed involving the Azure AD account with field 
          AadUserId = `97e6a954-b6bd-48a5-808c-bd8464cce677`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspected overpass-the-hash (Kerberos) attack occurred when the account with field Name = `Emma 
          Clark` attempted to authenticate against the domain controller.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
