tasks:
- task_id: incident_39_latest_test_set_task_65
  title: incident_39_latest_test_set_task_65
  description: 'According to the "Suspicious remote activity" alert triggered at 22:35:03 UTC, which executable file name
    was detected on the compromised machine?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring flagged a sequence of events that might indicate human-operated malicious activity.
      The chain starts with user account "kyleg" on a device (device identifier withheld) at 2024-07-04 22:35:04 UTC, where
      multiple alerts were raised, including one titled "Potential human-operated malicious activity." Just moments earlier,
      at 22:35:03 UTC, the same device generated an additional alert titled "Suspicious remote activity," suggesting that
      an external host may have executed commands or transferred files to establish interactive control or schedule tasks.'
    question: 'According to the "Suspicious remote activity" alert triggered at 22:35:03 UTC, which executable file name was
      detected on the compromised machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'psexesvc.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Device AadDeviceId `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb` exhibited signs of potential 
          human-operated malicious activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious remote activity on the same device involved the file `psexesvc.exe` (Name field).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
