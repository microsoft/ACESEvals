tasks:
- task_id: incident_39_latest_test_set_task_72
  title: incident_39_latest_test_set_task_72
  description: 'According to the alert that reported the active ‘Kekeo’ malware, what is the Azure AD user ID (AadUserId)
    of the account associated with this detection?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent investigation, we observed the execution of the well-known credential-theft utility
      “mimikatz.exe” (PID 6880) using a Pass-the-Hash command line, indicating an attempt to dump credentials on a domain-joined
      host. Almost simultaneously, PsExec was leveraged to launch commands on a remote device, suggesting lateral movement
      activity. Shortly after these events, Microsoft Defender flagged that an active instance of the ‘Kekeo’ malware was
      running on one of the organisation’s machines, implying successful follow-on compromise.'
    question: 'According to the alert that reported the active ‘Kekeo’ malware, what is the Azure AD user ID (AadUserId) of
      the account associated with this detection?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A malicious credential-theft tool was executed on the host with AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: PsExec was then used to launch the process `rubeus.exe` (ExtractedFileName `rubeus.exe`) on a 
          remote device, indicating possible lateral movement.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, active ‘Kekeo’ malware activity was detected under the user account with AadUserId 
          `97e6a954-b6bd-48a5-808c-bd8464cce677`, confirming the compromise of that user.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
