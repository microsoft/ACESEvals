tasks:
- task_id: incident_39_latest_test_set_task_96
  title: incident_39_latest_test_set_task_96
  description: 'What is the name of the user account that performed the SMB session enumeration on VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a suspected privilege-escalation attempt, telemetry shows that the account
      "lucasb" executed a PowerShell-based SID history injection from host "vnevado-dc". Immediately afterwards, the environment
      logged anomalous user-account look-up activity, indicating possible reconnaissance. A few days later, security monitoring
      detected that an unidentified user on workstation "VNEVADO-Win10V" enumerated SMB sessions against the domain controller
      "VNEVADO-DC", collecting recent IP-address information for two different accounts.'
    question: 'What is the name of the user account that performed the SMB session enumeration on VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Ethan Brooks'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Ethan Brooks'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A SID history injection was detected when process ExtractedFileName `net.exe` was executed.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Following that, anomalous account look-ups were performed by an account with Sid 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Subsequently, the account Name `Ethan Brooks` carried out SMB reconnaissance to enumerate recent IP
          addresses on VNEVADO-DC.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
