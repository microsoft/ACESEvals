tasks:
- task_id: incident_39_latest_test_set_task_98
  title: incident_39_latest_test_set_task_98
  description: 'For the "Suspicious service launched" alert, what is the Security Identifier (SID) of the account under which
    the service was started?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed that, on host "vnevado-win10v", several dual-purpose tools such
      as "mimikatz.exe" and "psexec.exe" were dropped and executed (e.g., ProcessId 6880 launching mimikatz with pass-the-hash
      parameters). This activity was captured in the alert titled "Multiple dual-purpose tools were dropped" that fired on
      2024-07-04 at 22:35:02 UTC. Just seconds earlier, another alert – "Suspicious service launched" – indicated that a new
      Windows service started on the same device, likely to maintain persistence or elevate privileges.'
    question: 'For the "Suspicious service launched" alert, what is the Security Identifier (SID) of the account under which
      the service was started?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1440151660-4837038288-105596163-1120'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1440151660-4837038288-105596163-1120'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Multiple dual-purpose tools were dropped on the device, including the process with field 
          ExtractedFileName=`powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious service was launched by the account with field 
          Sid=`S-1-5-21-1440151660-4837038288-105596163-1120`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
