tasks:
- task_id: incident_39_latest_test_set_task_7
  title: incident_39_latest_test_set_task_7
  description: 'According to the “Anomalous account lookups” alert that followed the antivirus-tampering event, what is the
    name of the script file associated with that suspicious account-enumeration activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security event on 2024-07-04, Microsoft Defender reported an attempted
      tampering of its antivirus service. The activity originated from a PowerShell process (`powershell.exe`, PID 6636) that
      executed the script `get-krbticket.ps1` from `c:\m365dattack\`. Only a few seconds later, another alert titled “Anomalous
      account lookups” was raised, suggesting the attacker may have been trying to enumerate user accounts just after the
      tampering attempt.'
    question: 'According to the “Anomalous account lookups” alert that followed the antivirus-tampering event, what is the
      name of the script file associated with that suspicious account-enumeration activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'domaindominance27.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'domaindominance27.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attempt to disable Microsoft Defender Antivirus was detected on host `vnevado-win10v` (HostName 
          = vnevado-win10v).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Moments later, the PowerShell script `domaindominance27.ps1` (File Name = domaindominance27.ps1) 
          was used to perform anomalous user-account lookups.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
