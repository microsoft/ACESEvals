tasks:
- task_id: incident_39_latest_test_set_task_6
  title: incident_39_latest_test_set_task_6
  description: 'According to the alert that detected malware associated with lateral movement, what is the name of the file
    that was identified as malicious?'
  inherit_shared: true
  initial_context:
    incident_context: 'Investigators observed that PsExec was used to remotely execute the following command: "powershell.exe
      -command net.exe stop ntds /y; … net.exe start ntds". This activity originated from the process psexec.exe (PID 5612)
      and is associated with the alert “PsExec launched a command on a remote device,” suggesting potential lateral-movement
      preparations. Shortly afterward, additional alerts indicated that multiple dual-purpose tools had been dropped on the
      same host, and finally an alert reported the presence of malware linked to lateral movement.'
    question: 'According to the alert that detected malware associated with lateral movement, what is the name of the file
      that was identified as malicious?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Account field 'Name' with value 'tgs2z' was observed using PsExec to run a command on a remote 
          device.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: File field 'Name' with value 'rubeus.exe' was dropped on the device as part of multiple 
          dual-purpose tools.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: File field 'Name' with value 'rubeus.exe' was subsequently detected as part of the 'Kekeo' malware 
          during lateral movement.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
