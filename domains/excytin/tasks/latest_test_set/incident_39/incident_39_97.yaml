tasks:
- task_id: incident_39_latest_test_set_task_97
  title: incident_39_latest_test_set_task_97
  description: 'According to the endpoint alert about the suspected Rubeus kerberoasting activity on 2024-07-04 22:35 UTC,
    what is the name of the account whose Kerberos tickets were targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'Analysts are examining an incident that began with several emails containing a malicious URL (https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/)
      sent from k1pt7ez@vnevado.alpineskihouse.co to the user Ethan Brooks. Although these messages were later removed, telemetry
      shows a link from this email activity to an endpoint alert raised on 2024-07-04 that signaled the possible execution
      of the Rubeus kerberoasting tool. Rubeus is often used by attackers to request service tickets in order to crack or
      reuse credentials.'
    question: 'According to the endpoint alert about the suspected Rubeus kerberoasting activity on 2024-07-04 22:35 UTC,
      what is the name of the account whose Kerberos tickets were targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 — Email compromise indicator: An email message that contained a malicious URL was delivered to,
          and later removed from, the user whose AadUserId is `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` (Field: AadUserId).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 — Lateral-movement / credential-theft indicator: Four days earlier, the endpoint showed evidence
          of the Rubeus kerberoasting tool being used by the account whose Name is `tgs2z` (Field: Name).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
