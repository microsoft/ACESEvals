tasks:
- task_id: incident_39_latest_test_set_task_24
  title: incident_39_latest_test_set_task_24
  description: 'According to the alert that reported multiple dual-purpose tools being dropped, what is the filename of one
    such tool that was placed on the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed a remote session that dropped and executed a file via the process
      "psexesvc.exe" (Process ID 5912 created at 2024-06-27T14:32:53Z). This behavior triggered an alert titled "File dropped
      and launched from remote location," suggesting potential lateral movement. Shortly afterward, additional alerts indicated
      that several publicly available dual-purpose tools had been copied to the same host, which adversaries often use for
      credential theft or privilege escalation.'
    question: 'According to the alert that reported multiple dual-purpose tools being dropped, what is the filename of one
      such tool that was placed on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:01.862275+00:00, a file was dropped and launched remotely: ExtractedFileName `psexesvc.exe`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: At 2024-07-04 22:35:02.140784+00:00, multiple dual-purpose tools were dropped, including file Name 
          `mimikatz.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: At 2024-07-04 22:35:04.098458+00:00, 'Kekeo' malware activity was detected involving file Name 
          `rubeus.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
