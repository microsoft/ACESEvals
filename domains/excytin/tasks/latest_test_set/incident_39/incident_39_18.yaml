tasks:
- task_id: incident_39_latest_test_set_task_18
  title: incident_39_latest_test_set_task_18
  description: 'A few days earlier, on 2024-07-04, the alert “Possible use of the Rubeus kerberoasting tool” was raised on
    an endpoint. According to that alert, which account name was involved in the suspected kerberoasting activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, security telemetry flagged a potentially malicious URL click on 2024-07-10
      by user Ethan Brooks (ethan brooks@vnevado.alpineskihouse.co). The click originated from a link hosted on an Azure Container
      Apps domain and triggered the alert “A potentially malicious URL click was detected.” Analysts suspect this activity
      may be related to subsequent credential-theft behavior observed elsewhere in the environment.'
    question: 'A few days earlier, on 2024-07-04, the alert “Possible use of the Rubeus kerberoasting tool” was raised on
      an endpoint. According to that alert, which account name was involved in the suspected kerberoasting activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'tgs2z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'tgs2z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A potentially malicious URL was clicked by account with Sid 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Possible use of the Rubeus kerberoasting tool was observed for account Name `tgs2z`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
