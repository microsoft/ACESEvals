tasks:
- task_id: incident_39_latest_test_set_task_42
  title: incident_39_latest_test_set_task_42
  description: 'Which executable was identified in the command line of the process associated with the "Malicious credential
    theft tool execution detected" alert that occurred immediately after the LSASS access?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host "vnevado-win10b" (device ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb),
      an attacker using the account "fk8mq" (SID S-1-5-21-...-1517) successfully authenticated via an overpass-the-hash technique
      at 22:35:01 UTC on July 4. The same session quickly led to a "Suspicious access to LSASS service" alert, suggesting
      an attempt to read sensitive credentials from memory. Seconds later, Microsoft Defender raised another alert titled
      "Malicious credential theft tool execution detected," indicating that a known password-dumping program was launched
      to extract credentials.'
    question: 'Which executable was identified in the command line of the process associated with the "Malicious credential
      theft tool execution detected" alert that occurred immediately after the LSASS access?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An overpass-the-hash logon was achieved through the process with ExtractedFileName `lsass.exe`, 
          giving the attacker valid Kerberos tickets.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Immediately afterward the attacker ran a credential-theft utility: ProcessId__CreatedTimeUtc__CommandLine
          `5176__2024-06-27t14:33:32.4282796z__"mimikatz.exe" privilege::debug "kerberos::ptt c:\m365dattack\admin-tickets"
          exit`, showing Mimikatz was executed to load forged tickets.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Those forged credentials were then used by the account with AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, which accessed the LSASS service suspiciously to harvest clear-text 
          passwords.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
