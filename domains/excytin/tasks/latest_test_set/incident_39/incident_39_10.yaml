tasks:
- task_id: incident_39_latest_test_set_task_10
  title: incident_39_latest_test_set_task_10
  description: 'A second alert raised only a few seconds later referenced an external destination fully-qualified domain name
    (FQDN). What is the exact URL that appeared in this follow-up alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a malicious credential-theft incident, we observed a process "mimikatz.exe"
      (PID 4112) launched via PowerShell on 2024-06-27, using a Pass-the-Hash command that targeted the domain vnevado.alpineskihouse.co.
      This activity generated a "Malicious credential theft tool execution detected" alert at 22:35:00 UTC on 4 July 2024.'
    question: 'A second alert raised only a few seconds later referenced an external destination fully-qualified domain name
      (FQDN). What is the exact URL that appeared in this follow-up alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-dc.vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-dc.vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A malicious credential-theft tool was executed under the account Name `tgs2z`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The same tool activity referenced the URL `vnevado-dc.vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
