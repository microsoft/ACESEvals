tasks:
- task_id: incident_39_latest_test_set_task_16
  title: incident_39_latest_test_set_task_16
  description: 'According to the alert showing that a file was dropped and executed from a remote location, which user account
    name initiated that remote session?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed a PowerShell command (process ID 3780) that invoked net.exe to
      stop the NTDS service, potentially to tamper with Active Directory. This activity triggered the alert “Suspicious process
      stopping services” on 2024-07-04 22:35:01 UTC. Immediately afterward, another alert titled “File dropped and launched
      from remote location” was raised, indicating that a file had been transferred to the same host during a remote session
      and then executed.'
    question: 'According to the alert showing that a file was dropped and executed from a remote location, which user account
      name initiated that remote session?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – entity: Name, value: lucasb – The account “lucasb” suspiciously stopped device services at
          2024-07-04 22:35:01.237308 +00:00.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – entity: Address, value: 141.216.110.153 – A remote session coming from the IP address 141.216.110.153
          dropped and executed a file at 2024-07-04 22:35:02.050095 +00:00.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – entity: Name, value: fk8mq – Another remote session, this time using the account “fk8mq”, dropped
          and launched a file at 2024-07-04 22:35:01.862275 +00:00.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
