tasks:
- task_id: incident_39_latest_test_set_task_85
  title: incident_39_latest_test_set_task_85
  description: 'According to the "SID history injection" alert that followed the tool drop, what is the Security Identifier
    (SID) of the account whose SID history was altered?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a recent security incident, we observed that multiple dual-purpose tools
      such as "rubeus.exe", "mimikatz.exe", "psexec.exe" and the script "domaindominance27.ps1" were dropped and executed
      on host "vnevado-win10v" (device ID 4d8d23e9-a77d-4e33-9435-b8c457e57ca1). The activity was attributed to the user account
      "tgs2z" (SID: S-5-7-21-1843151660-3234030288-105586167-1422). Shortly after these tools appeared, Defender raised a
      separate high-severity alert titled "SID history injection", indicating that an attacker may have modified a domain
      user’s SID history to gain elevated privileges on the same device.'
    question: 'According to the "SID history injection" alert that followed the tool drop, what is the Security Identifier
      (SID) of the account whose SID history was altered?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1440151660-4837038288-105596163-1120'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1440151660-4837038288-105596163-1120'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Multiple dual-purpose tools were dropped on the device, including the process (ExtractedFileName) 
          `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A SID history injection was then detected, targeting the account (Sid) 
          `S-1-5-21-1440151660-4837038288-105596163-1120`.
