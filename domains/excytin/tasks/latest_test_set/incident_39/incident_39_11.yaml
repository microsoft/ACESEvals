tasks:
- task_id: incident_39_latest_test_set_task_11
  title: incident_39_latest_test_set_task_11
  description: 'According to the “Sign-in attempt with deceptive user account” alert, what external IP address was used for
    the suspicious sign-in attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024 at about 22:35 UTC, Microsoft Defender generated an alert titled “Malicious credential
      theft tool execution detected.” The investigation showed the process “mimikatz.exe” (PID 4748) launched with a DCSync
      command against the vnevado.alpineskihouse.co domain and contacted the internal DNS name vnevado-dc.vnevado.alpineskihouse.co
      from the IP address 65.233.23.156. Just a few seconds earlier, a related alert, “Sign-in attempt with deceptive user
      account,” was triggered, suggesting an adversary attempted to log in with a fake account from an external location.'
    question: 'According to the “Sign-in attempt with deceptive user account” alert, what external IP address was used for
      the suspicious sign-in attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '35.202.74.47'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '35.202.74.47'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A malicious credential theft tool execution command line was detected on the host with HostName 
          `vnevado-win10v`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A sign-in attempt was detected from the IP Address `35.202.74.47` using a deceptive user account.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
