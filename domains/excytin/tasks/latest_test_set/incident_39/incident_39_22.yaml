tasks:
- task_id: incident_39_latest_test_set_task_22
  title: incident_39_latest_test_set_task_22
  description: 'According to the follow-up alert that identifies the credential-theft tool, what is the name of the file that
    was detected on the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host ''vnevado-win10v'', a detection named "Malicious credential theft tool
      execution detected" was raised. The activity originated from the user account ''tgs2z'' and involved a process launched
      via powershell.exe, suggesting an attempt to dump credentials. This start alert is connected to another alert raised
      just a few seconds later that explicitly names the credential-theft tool found on the device.'
    question: 'According to the follow-up alert that identifies the credential-theft tool, what is the name of the file that
      was detected on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Malicious credential-theft activity was first detected involving the Azure AD account with field 
          AadUserId equal to `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Moments later, the file with field Name equal to `mimikatz.exe` was discovered executing on the 
          device, confirming use of the Mimikatz credential-theft tool.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
