tasks:
- task_id: incident_39_latest_test_set_task_12
  title: incident_39_latest_test_set_task_12
  description: 'A few milliseconds later, a second alert reported an attempt to disable Microsoft Defender Antivirus on the
    same host. Which script file was identified in that tampering attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host "vnevado-dc", the account "lucasb" was observed launching a suspicious
      service via the command line (e.g., "net.exe stop ntds" followed by a restart). This activity triggered a "Suspicious
      service launched" alert, suggesting a possible attempt at persistence or privilege escalation.'
    question: 'A few milliseconds later, a second alert reported an attempt to disable Microsoft Defender Antivirus on the
      same host. Which script file was identified in that tampering attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious service initiated the process `powershell.exe` (ExtractedFileName = `powershell.exe`).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, an attempt to tamper with Microsoft Defender Antivirus was made using the script 
          file `get-krbticket.ps1` (Name = `get-krbticket.ps1`).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
