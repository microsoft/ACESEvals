tasks:
- task_id: incident_39_latest_test_set_task_69
  title: incident_39_latest_test_set_task_69
  description: 'According to the final "Microsoft Defender Antivirus tampering" alert in this sequence, what is the Azure
    AD user ID (AadUserId) of the account that attempted to disable Microsoft Defender Antivirus?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspected lateral-movement sequence, several "net.exe" commands were
      executed on a host to enumerate users and privileged groups, triggering the alert “Anomalous account lookups”. Minutes
      later, the attacker appeared to use PsExec to run remote commands, followed by activity consistent with the Rubeus kerberoasting
      tool. The chain culminated in an alert titled “Microsoft Defender Antivirus tampering”, indicating that someone tried
      to disable the endpoint-protection service—likely in an effort to evade further detection.'
    question: 'According to the final "Microsoft Defender Antivirus tampering" alert in this sequence, what is the Azure AD
      user ID (AadUserId) of the account that attempted to disable Microsoft Defender Antivirus?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Possible use of the Rubeus kerberoasting tool was detected on host HostName `vnevado-win10b`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Shortly afterwards, anomalous account lookups were performed by the account with Sid 
          `S-5-7-21-1843151660-3234030288-105586167-1422`, indicating reconnaissance activity.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: The attacker then leveraged PsExec to remotely run the process with ExtractedFileName `rubeus.exe`,
          continuing lateral-movement operations.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Finally, an attempt was made to disable Microsoft Defender Antivirus by the account whose AadUserId
          is `97e6a954-b6bd-48a5-808c-bd8464cce677`, showing clear defense-evasion intent.
