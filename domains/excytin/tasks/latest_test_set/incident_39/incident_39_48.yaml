tasks:
- task_id: incident_39_latest_test_set_task_48
  title: incident_39_latest_test_set_task_48
  description: 'According to the alert that detected the ''Kekeo'' malware during lateral movement, what is the Azure AD user
    ID (AadUserId) of the account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent security incident shows that on host ''vnevado-dc'', the account ''lucasb'' initiated a remote
      session and used the executable ''psexesvc.exe'' to drop and run a file, indicating possible lateral movement activity.
      Only seconds later, another alert reported that the ''Kekeo'' malware was detected on the same device, confirming an
      attempted lateral movement by an attacker.'
    question: 'According to the alert that detected the ''Kekeo'' malware during lateral movement, what is the Azure AD user
      ID (AadUserId) of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '97e6a954-b6bd-48a5-808c-bd8464cce677'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '97e6a954-b6bd-48a5-808c-bd8464cce677'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A remote session dropped and launched the file with ExtractedFileName `psexesvc.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The 'Kekeo' malware activity involved the account identified by AadUserId 
          `97e6a954-b6bd-48a5-808c-bd8464cce677`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
