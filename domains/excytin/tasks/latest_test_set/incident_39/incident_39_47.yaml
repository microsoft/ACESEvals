tasks:
- task_id: incident_39_latest_test_set_task_47
  title: incident_39_latest_test_set_task_47
  description: 'According to the "Suspected DCSync attack (replication of directory services)" alert, which user account (provide
    the full email address) issued the replication request to VNEVADO-DC?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-10 a user with mailbox tgs2z@vnevado.alpineskihouse.co clicked a link later determined to
      be malicious (https://ac27145722.livelygrass-8d4c4013.eastus2.azurecontainerapps.io/). Shortly afterward, additional
      suspicious activity was observed: first, SMB-based user and IP reconnaissance from the workstation VNEVADO-Win10V against
      the domain controller VNEVADO-DC, and then a "Suspected DCSync attack (replication of directory services)" in which
      a single replication request was sent to the domain controller. Investigators now need to identify the account behind
      that replication attempt.'
    question: 'According to the "Suspected DCSync attack (replication of directory services)" alert, which user account (provide
      the full email address) issued the replication request to VNEVADO-DC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Julian Burke@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Julian Burke@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` clicked on a malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: HostName `VNEVADO-DC` was targeted for SMB reconnaissance to gather IP address information.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Email `Julian Burke@vnevado.alpineskihouse.co` initiated a suspected DCSync attack by sending a 
          directory-services replication request to `VNEVADO-DC`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
