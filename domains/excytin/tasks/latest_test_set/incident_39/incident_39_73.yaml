tasks:
- task_id: incident_39_latest_test_set_task_73
  title: incident_39_latest_test_set_task_73
  description: 'According to the "Potential human-operated malicious activity" alert that was triggered right after the PsExec
    command, what is the SID of the account involved in that suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed a PsExec session that launched a command on the remote host "vnevado-win10v".
      The command was initiated from a PowerShell script and appears to disable real-time monitoring before executing additional
      tooling. A few seconds later, Microsoft Defender raised another alert on the same device flagging a potential human-operated
      attack that could precede ransomware deployment.'
    question: 'According to the "Potential human-operated malicious activity" alert that was triggered right after the PsExec
      command, what is the SID of the account involved in that suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1540151660-3530000288-105586595-1517'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'PsExec launched a remote command executing the file with ExtractedFileName `rubeus.exe` (Time: 2024-07-04
          22:35:03.229603+00:00).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, potential human-operated malicious activity was observed involving the account with Sid
          `S-1-5-21-1540151660-3530000288-105586595-1517` (Time: 2024-07-04 22:35:03.712134+00:00).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
