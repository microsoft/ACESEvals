tasks:
- task_id: incident_39_latest_test_set_task_62
  title: incident_39_latest_test_set_task_62
  description: 'Shortly after this activity, a separate alert reported that the malware family ‘Kekeo’ was detected on one
    of our endpoints. What is the Azure AD Device ID of the host where the ‘Kekeo’ malware was detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'While investigating a lateral movement attempt, telemetry shows that a remote session dropped and executed
      the file "psexesvc.exe" (Process ID 5912, created 2024-06-27 14:32:53 UTC). This activity triggered the alert "File
      dropped and launched from remote location" on 2024-07-04 22:35 UTC, suggesting an attacker may have been moving laterally
      or staging additional tools.'
    question: 'Shortly after this activity, a separate alert reported that the malware family ‘Kekeo’ was detected on one
      of our endpoints. What is the Azure AD Device ID of the host where the ‘Kekeo’ malware was detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '4d8d23e9-a77d-4e33-9435-b8c457e57ca1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '4d8d23e9-a77d-4e33-9435-b8c457e57ca1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – ip.Address: 141.216.110.153 — A remote session originating from IP 141.216.110.153 dropped
          a file and executed it on a target system.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – file.Name: rubeus.exe — The dropped file was identified as rubeus.exe and its execution is
          part of potential human-operated malicious activity.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – host.AadDeviceId: 4d8d23e9-a77d-4e33-9435-b8c457e57ca1 — The malicious activity culminated
          in the detection of the ‘Kekeo’ malware on the host with AadDeviceId 4d8d23e9-a77d-4e33-9435-b8c457e57ca1.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
