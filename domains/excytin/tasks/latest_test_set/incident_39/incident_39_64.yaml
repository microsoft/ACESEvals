tasks:
- task_id: incident_39_latest_test_set_task_64
  title: incident_39_latest_test_set_task_64
  description: 'A follow-up alert reported a malicious credential-theft tool execution. According to that alert, what executable
    was launched to perform the credential theft?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a Microsoft Defender Antivirus-tampering attempt, analysts noted a PowerShell
      command (process ID 6636) launching the script "get-krbticket.ps1" from the path C:\m365dattack. This suspicious activity
      suggests the attacker was preparing to extract credentials after trying to disable Microsoft Defender Antivirus.'
    question: 'A follow-up alert reported a malicious credential-theft tool execution. According to that alert, what executable
      was launched to perform the credential theft?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Antivirus tampering attempt referenced the file (Name=`get-krbticket.ps1`).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, a credential-theft process was launched 
          (ProcessId__CreatedTimeUtc__CommandLine=`7092__2024-06-27t14:32:46.4998999z__"mimikatz.exe" privilege::debug 
          "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co 
          /run:\"powershell.exe c:\m365dattack\get-krbticket.ps1\"" exit -wait`), indicating execution of Mimikatz that 
          invoked the same PowerShell script to dump credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
