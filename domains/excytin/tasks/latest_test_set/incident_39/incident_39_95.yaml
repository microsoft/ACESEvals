tasks:
- task_id: incident_39_latest_test_set_task_95
  title: incident_39_latest_test_set_task_95
  description: 'During the lateral-movement event where the ''Kekeo'' malware was detected, what IP address was associated
    with the affected device?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at 22:35:00 UTC, Microsoft Defender detected the execution of a known credential-theft
      tool using the command line "mimikatz.exe lsadump::dcsync ..." on a domain-joined host. Just seconds later, additional
      dual-purpose tools were dropped onto the same machine, suggesting the attacker was preparing for further malicious activity.
      Moments after, a separate alert signaled that the ‘Kekeo’ malware had appeared on another device, indicating the adversary’s
      attempt at lateral movement within the network.'
    question: 'During the lateral-movement event where the ''Kekeo'' malware was detected, what IP address was associated
      with the affected device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '141.216.110.153'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '141.216.110.153'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A malicious credential-theft tool was executed on host `vnevado-win10v` (HostName = 
          vnevado-win10v).
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Multiple dual-purpose tools, including the file `rubeus.exe` (Name = rubeus.exe), were dropped on 
          the same device.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: During a lateral-movement attempt, 'Kekeo' malware activity was detected originating from IP 
          address `141.216.110.153` (Address = 141.216.110.153).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
