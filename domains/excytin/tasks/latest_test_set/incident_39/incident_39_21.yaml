tasks:
- task_id: incident_39_latest_test_set_task_21
  title: incident_39_latest_test_set_task_21
  description: 'What is the AadUserId of the account identified in the "SID history injection" alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a credential-theft incident, we observed the execution of the tool "mimikatz.exe"
      on host "vnevado-win10v" under account "tgs2z" (SID S-5-7-21-1843151660-3234030288-105586167-1422). The malicious command
      attempted a DCSync against the domain vnevado.alpineskihouse.co. Just seconds later, additional alerts were raised:
      one for suspicious access to the LSASS service and another indicating that a SID history injection had occurred. Analysts
      must determine which Azure AD identity was affected by the SID history injection in order to assess possible privilege
      escalation.'
    question: 'What is the AadUserId of the account identified in the "SID history injection" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '7fcf9695-68fc-4258-864d-e1e5b166c66f'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '7fcf9695-68fc-4258-864d-e1e5b166c66f'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A malicious credential-theft tool was executed by the account with field AadUserId value 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Immediately afterwards, the attacker tried to read LSASS memory through the process with field 
          ExtractedFileName value `powershell.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, the threat actor performed a SID history injection using the account whose field AadUserId
          has the value `7fcf9695-68fc-4258-864d-e1e5b166c66f`, giving it elevated privileges.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
