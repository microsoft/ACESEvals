tasks:
- task_id: incident_39_latest_test_set_task_4
  title: incident_39_latest_test_set_task_4
  description: 'According to the later "Possible lateral movement" alert raised on 2024-07-04, what is the hostname of the
    device where this suspicious lateral movement activity was detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing investigation, security monitoring flagged a suspected DCSync attack in which the
      account belonging to Julian Burke on workstation VNEVADO-Win10V attempted to replicate data from the domain controller
      VNEVADO-DC. Moments later, a pass-the-ticket incident involving the same user and multiple endpoints was recorded, suggesting
      that an adversary might be leveraging stolen Kerberos credentials to widen access. Analysts are now examining a related
      alert that indicates the attacker may have progressed to moving laterally inside the network.'
    question: 'According to the later "Possible lateral movement" alert raised on 2024-07-04, what is the hostname of the
      device where this suspicious lateral movement activity was detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win10b'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win10b'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Account (Sid: S-1-5-21-1440151660-4837038288-105596163-1120) initiated a DCSync replication request
          from host VNEVADO-Win10V to VNEVADO-DC on 2024-07-10.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'IP address (Address: 35.202.74.47) was involved in a pass-the-ticket attack, re-using the Kerberos ticket
          of the same account on host VNEVADO-Win10V.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Host (HostName: vnevado-win10b) later showed signs of lateral movement, indicating the attacker likely
          pivoted to this device.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
