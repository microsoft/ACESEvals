tasks:
- task_id: incident_39_latest_test_set_task_31
  title: incident_39_latest_test_set_task_31
  description: 'According to the "File dropped and launched from remote location" alert, what is the name of the account that
    executed the dropped file?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the incident triage we first noted a "Suspicious service launched" alert where the process "services.exe"
      (PID 652) was started on the host. Just two seconds later Microsoft Defender raised a "''Kekeo'' malware was detected
      during lateral movement" alert, suggesting an adversary might be pivoting between machines. Immediately prior to these
      two alerts, another alert titled "File dropped and launched from remote location" indicated that a remote session had
      transferred a file to the device and executed it. Analysts need to identify which user account was responsible for that
      remote-file execution in order to continue the containment and remediation steps.'
    question: 'According to the "File dropped and launched from remote location" alert, what is the name of the account that
      executed the dropped file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:00.721436+00:00, a remote session using account Name `fk8mq` dropped a file and
          executed it on the device.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Two seconds later, at 2024-07-04 22:35:02.631253+00:00, the suspicious service with 
          ExtractedFileName `psexesvc.exe` was launched, suggesting the attacker established persistence.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, at 2024-07-04 22:35:04.098458+00:00, `Kekeo` malware activity was detected, tied to 
          account Sid `S-1-5-21-1540151660-3530000288-105586595-1517`, indicating successful lateral movement using that
          account.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
