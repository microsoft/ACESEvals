tasks:
- task_id: incident_39_latest_test_set_task_71
  title: incident_39_latest_test_set_task_71
  description: 'Which executable did the attacker run during the "Suspicious sequence of exploration activities" alert that
    followed the Defender tampering attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert titled "Microsoft Defender Antivirus tampering" was triggered on host vnevado-win10b after
      the account fk8mq (SID S-1-5-21-1540151660-3530000288-105586595-1517) ran a PowerShell command (process ID 6968) that
      attempted to disable Defender’s real-time monitoring. Security telemetry shows that, moments later, another alert flagged
      a suspicious sequence of Windows exploration commands executed on the same system—often a sign that an attacker is enumerating
      the environment following initial tampering. Investigators need to identify which command-line tool was used during
      this exploration step.'
    question: 'Which executable did the attacker run during the "Suspicious sequence of exploration activities" alert that
      followed the Defender tampering attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'whoami.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'whoami.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Multiple dual-purpose tools were dropped via the process with ProcessId `4676` at 
          `2024-06-27t14:32:08.4041849z`, launched with the command line "powershell.exe -executionpolicy bypass -file 
          c:\users\tgs2z\downloads\domaindominance27\domaindominance27.ps1".
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious exploration activity followed, carried out by the process with ProcessId `6512` at 
          `2024-06-27t14:32:19.285352z`, executing the command line "whoami.exe".
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: An attempt to disable Microsoft Defender Antivirus was detected from the account with AadUserId 
          `97e6a954-b6bd-48a5-808c-bd8464cce677`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: During lateral movement, the 'Kekeo' malware was detected on the device through the malicious file 
          `rubeus.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
