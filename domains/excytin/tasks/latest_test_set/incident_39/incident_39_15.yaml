tasks:
- task_id: incident_39_latest_test_set_task_15
  title: incident_39_latest_test_set_task_15
  description: 'One second after this process ran, a follow-up alert "Suspicious access to LSASS service" was raised, indicating
    an additional file was leveraged to interact with LSASS. What is the name of the file identified in that second alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a recent alert titled "Malicious credential theft tool execution detected"
      we observed the execution of a process with PID 5176 that launched the command line: "mimikatz.exe" privilege::debug
      "kerberos::ptt c:\m365dattack\admin-tickets" exit. Such activity typically precedes attempts to extract password material
      from LSASS in memory for lateral movement or privilege escalation.'
    question: 'One second after this process ran, a follow-up alert "Suspicious access to LSASS service" was raised, indicating
      an additional file was leveraged to interact with LSASS. What is the name of the file identified in that second alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-krbticket.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-krbticket.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Alert indicated malicious credential theft tool execution with process ExtractedFileName 
          `mimikatz.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, suspicious LSASS access was detected involving file Name `get-krbticket.ps1`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
