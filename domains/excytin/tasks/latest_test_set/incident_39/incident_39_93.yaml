tasks:
- task_id: incident_39_latest_test_set_task_93
  title: incident_39_latest_test_set_task_93
  description: 'What is the name of the executable that was started as part of the "Suspicious service launched" alert on
    host "vnevado-win10v"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host "vnevado-win10v" (AadDeviceId: 4d8d23e9-a77d-4e33-9435-b8c457e57ca1),
      Microsoft Defender detected the presence of the ''Kekeo'' malware, first flagging the file involved and then observing
      potential lateral-movement activity. Immediately afterward, a separate alert reported that a suspicious service had
      been launched on the same device—an event that often indicates an attacker trying to maintain persistence or elevate
      privileges.'
    question: 'What is the name of the executable that was started as part of the "Suspicious service launched" alert on host
      "vnevado-win10v"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'psexesvc.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious service was launched with ProcessId__CreatedTimeUtc__CommandLine 
          `7668__2024-06-27t14:34:10.0201983z__psexesvc.exe`, indicating that `psexesvc.exe` was executed as a service.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Moments later, the file Name `rubeus.exe` was detected as 'Kekeo' malware, confirming malicious 
          activity on the device.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Subsequently, 'Kekeo' malware activity was again observed during lateral movement via process 
          ExtractedFileName `psexesvc.exe`, showing the attacker is leveraging this executable to spread across the 
          network.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
