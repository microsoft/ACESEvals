tasks:
- task_id: incident_39_latest_test_set_task_82
  title: incident_39_latest_test_set_task_82
  description: 'According to the Microsoft Defender Antivirus tampering alert, which account name was used when someone attempted
    to disable the antivirus service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent investigation, we observed a suspected overpass-the-hash (Kerberos) attempt where the
      help-desk administrator Emma Clark on workstation VNEVADO-Win10V tried to authenticate against the domain controller
      VNEVADO-DC. While tracing related activity, another alert flagged an attempt to disable Microsoft Defender Antivirus
      on a system—an action that often indicates an effort to evade detection.'
    question: 'According to the Microsoft Defender Antivirus tampering alert, which account name was used when someone attempted
      to disable the antivirus service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Account (AadUserId: `97e6a954-b6bd-48a5-808c-bd8464cce677`) attempted an overpass-the-hash Kerberos
          authentication on 2024-07-10 11:24:45 UTC from host VNEVADO-Win10V to VNEVADO-DC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Account (Name: `fk8mq`) tried to disable the Microsoft Defender Antivirus service on 2024-07-04 22:35:03
          UTC, suggesting antivirus tampering.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
