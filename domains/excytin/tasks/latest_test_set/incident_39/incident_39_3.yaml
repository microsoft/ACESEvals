tasks:
- task_id: incident_39_latest_test_set_task_3
  title: incident_39_latest_test_set_task_3
  description: 'What was the process ID of the PowerShell process that executed the Set-MpPreference command to disable Microsoft
    Defender Antivirus real-time monitoring?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into potential human-operated malicious activity linked to the user account
      "kyleg" (seen coming from IP 141.216.110.153), an additional alert was raised only seconds earlier for "Microsoft Defender
      Antivirus tampering." According to this second alert, an attacker used PowerShell with the Set-MpPreference cmdlet to
      disable Defender’s real-time monitoring, indicating an evasion attempt against the device’s protections.'
    question: 'What was the process ID of the PowerShell process that executed the Set-MpPreference command to disable Microsoft
      Defender Antivirus real-time monitoring?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '6968'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '6968'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Microsoft Defender Antivirus tampering was attempted via process with Field: ProcessId__CreatedTimeUtc__CommandLine,
          Value: `6968__2024-06-27t14:33:05.7932439z__powershell  -command set-mppreference -disablerealtimemonitoring 1`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Potential human-operated malicious activity was later detected on the host with Field: AadDeviceId,
          Value: `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
