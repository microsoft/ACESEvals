tasks:
- task_id: incident_39_latest_test_set_task_34
  title: incident_39_latest_test_set_task_34
  description: 'In the related alert raised seconds earlier—"Multiple dual-purpose tools were dropped"—investigators observed
    that a well-known post-exploitation utility was written to disk. What is the name of that executable file?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, Microsoft Defender flagged an alert titled "PsExec launched a command on
      a remote device" on 2024-07-04. The alert showed that an attacker used PsExec (e.g., psexec.exe) together with several
      PowerShell-based commands such as get-krbticket.ps1 and other administrative utilities (e.g., net.exe) to run remote
      commands, disable real-time monitoring, and tamper with domain services. These activities indicate possible lateral-movement
      attempts and preparation for credential theft on the same endpoint.'
    question: 'In the related alert raised seconds earlier—"Multiple dual-purpose tools were dropped"—investigators observed
      that a well-known post-exploitation utility was written to disk. What is the name of that executable file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'PsExec was leveraged to execute a command on the remote host (Field: AadDeviceId, Value: `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Soon after, a dual-purpose tool was dropped on that device: file (Field: Name, Value: `rubeus.exe`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
