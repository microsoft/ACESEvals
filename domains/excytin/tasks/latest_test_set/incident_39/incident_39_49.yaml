tasks:
- task_id: incident_39_latest_test_set_task_49
  title: incident_39_latest_test_set_task_49
  description: 'During the subsequent "Potential human-operated malicious activity" alert on 4 July, which user account was
    identified as being involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring detected an anomalous chain of account lookup commands executed via several "net.exe"
      processes on 27 June (e.g., "net.exe" user /domain and related group queries). This activity was flagged under the alert
      titled "Anomalous account lookups," suggesting an attacker might be gathering information about potential targets. Shortly
      afterward, another alert indicated that PsExec was used to launch a command on a remote device, reinforcing concerns
      of lateral movement.'
    question: 'During the subsequent "Potential human-operated malicious activity" alert on 4 July, which user account was
      identified as being involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'fk8mq'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'fk8mq'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The first alert shows anomalous account look-ups carried out by account (Field: Name, Value: `tgs2z`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Next, PsExec was used to run a remote command that launched the process (Field: ExtractedFileName, Value:
          `rubeus.exe`).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Finally, these activities converged in a ‘potential human-operated malicious activity’ alert involving
          account (Field: Name, Value: `fk8mq`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
