tasks:
- task_id: incident_39_latest_test_set_task_5
  title: incident_39_latest_test_set_task_5
  description: 'According to the ''Microsoft Defender Antivirus tampering'' alert that followed, what is the SID of the account
    that attempted to disable the antivirus service on host ''vnevado-win10v''?'
  inherit_shared: true
  initial_context:
    incident_context: 'A sign-in attempt using a deceptive local account named ''tgs2z'' (SID: S-5-7-21-1843151660-3234030288-105586167-1422)
      was recorded on host ''vnevado-win10v''. Just seconds later, the same device triggered a ''Potential human-operated
      malicious activity'' alert, followed almost immediately by an alert indicating that someone tried to disable Microsoft
      Defender Antivirus on the machine.'
    question: 'According to the ''Microsoft Defender Antivirus tampering'' alert that followed, what is the SID of the account
      that attempted to disable the antivirus service on host ''vnevado-win10v''?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1540151660-3530000288-105586595-1517'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1540151660-3530000288-105586595-1517'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A deceptive sign-in was attempted with account field Name = `kyleg`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Soon after, suspicious human-operated activity was observed tied to account field AadUserId = 
          `97e6a954-b6bd-48a5-808c-bd8464cce677`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, an attempt to tamper with Microsoft Defender Antivirus was executed by the account whose 
          field Sid = `S-1-5-21-1540151660-3530000288-105586595-1517`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
