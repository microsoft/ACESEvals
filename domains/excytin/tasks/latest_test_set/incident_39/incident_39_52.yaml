tasks:
- task_id: incident_39_latest_test_set_task_52
  title: incident_39_latest_test_set_task_52
  description: 'According to the telemetry for the suspicious account-creation alert that followed this deceptive sign-in
    attempt, which executable was used to create the new user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'A sign-in attempt from account "kyleg" originating at IP address 35.202.74.47 was flagged as a deceptive-user
      activity. Such activity can indicate an attacker trying to obtain a foothold for lateral movement or data access. During
      the same timeframe, security telemetry shows that a brand-new user account was created on the host—suggesting the adversary
      may be establishing persistence.'
    question: 'According to the telemetry for the suspicious account-creation alert that followed this deceptive sign-in attempt,
      which executable was used to create the new user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'net.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'net.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A sign-in attempt was made using the deceptive account with Sid 
          `S-5-7-21-1843151660-3234030288-105586167-1422`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Soon after, a suspicious account was created through the process with ExtractedFileName `net.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
