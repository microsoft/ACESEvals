tasks:
- task_id: incident_39_latest_test_set_task_27
  title: incident_39_latest_test_set_task_27
  description: 'According to the "File dropped and launched from remote location" alert, what is the name of the executable
    that was started on the host?'
  inherit_shared: true
  initial_context:
    incident_context: 'On host "vnevado-win10v" (AAD Device ID: 4d8d23e9-a77d-4e33-9435-b8c457e57ca1), Microsoft Defender
      flagged the presence of the “Kekeo” malware at 22:35:03 UTC on 4 July 2024. A second alert seconds later suggested the
      malware was also observed during an attempted lateral-movement effort. Immediately before these detections, a separate
      alert reported that a file had been dropped and executed on the same machine by means of a remote session, indicating
      possible propagation activity. Investigators want to understand exactly what was executed during that remote drop-and-launch
      event.'
    question: 'According to the "File dropped and launched from remote location" alert, what is the name of the executable
      that was started on the host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'psexesvc.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'psexesvc.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A remote session dropped and executed a process with field ProcessId__CreatedTimeUtc__CommandLine 
          and value `5912__2024-06-27t14:32:53.2267179z__psexesvc.exe`, indicating potential lateral movement.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, the malware detector flagged a file with field Name and value `rubeus.exe` as the 
          'Kekeo' malware.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The same threat was observed attempting lateral movement coming from the IP with field Address and 
          value `141.216.110.153`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
