  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, security telemetry shows that on 2024-07-04 the host vnevado-win10b (device
      ID fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb) triggered an alert: "‘Kekeo’ malware was detected and was active." The malicious
      activity involved the process rubeus.exe being executed under the fk8mq user account (SID S-1-5-21-1540151660-3530000288-105586595-1517).
      A few moments later, PsExec was used—again involving the same user account—to launch a command on a remote device, suggesting
      possible lateral movement. Several days afterward, Microsoft Defender for Office 365 raised another alert indicating
      that a user clicked a link contained in a ZAP-quarantined email.'
    question: 'What is the full URL that the user clicked in the ZAP-quarantined email reported on 2024-07-10 11:24:45 UTC?'
