tasks:
- task_id: incident_39_latest_test_set_task_54
  title: incident_39_latest_test_set_task_54
  description: 'What is the security identifier (SID) of the account linked to the suspicious service that was launched on
    host vnevado-win10v?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of host vnevado-win10v (AadDeviceId 4d8d23e9-a77d-4e33-9435-b8c457e57ca1),
      we observed a start alert indicating that several dual-purpose tools—mimikatz.exe, rubeus.exe, psexec.exe—and the PowerShell
      script domaindominance27.ps1 were dropped and executed via a PowerShell process (PID 4676) by account tgs2z. These tools
      are often used for credential theft, privilege escalation and lateral movement. Just seconds earlier, another alert
      on the same device reported that a suspicious Windows service had been started, which could represent an attempt at
      persistence or privilege escalation.'
    question: 'What is the security identifier (SID) of the account linked to the suspicious service that was launched on
      host vnevado-win10v?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1440151660-4837038288-105596163-1120'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1440151660-4837038288-105596163-1120'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The dual-purpose tool with ExtractedFileName `powershell.exe` was dropped on the device (alert: “Multiple
          dual-purpose tools were dropped”).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A suspicious service was started by the account with Sid `S-1-5-21-1440151660-4837038288-105596163-1120`
          (alert: “Suspicious service launched”).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
