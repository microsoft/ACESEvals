tasks:
- task_id: incident_39_latest_test_set_task_2
  title: incident_39_latest_test_set_task_2
  description: 'According to the “Suspicious remote activity” alert tied to the execution of `rubeus.exe`, which user or service
    account was responsible for the remote actions on the affected machine?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a lateral-movement incident, security telemetry revealed that the file
      `rubeus.exe`—often associated with the ‘Kekeo’ malware family—was executed on a device shortly before suspicious remote
      actions were detected. The follow-up alert, titled “Suspicious remote activity,” indicates that commands were launched
      from a remote source against the same machine, suggesting possible privilege-escalation or post-exploitation behavior.
      Analysts must identify the principal that carried out these remote activities to determine next steps for containment
      and remediation.'
    question: 'According to the “Suspicious remote activity” alert tied to the execution of `rubeus.exe`, which user or service
      account was responsible for the remote actions on the affected machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'LocalSystem'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'LocalSystem'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The 'Kekeo' malware was detected during lateral movement on host with AadDeviceId 
          `fafdcd65-46c6-45a6-aa85-ec9b77ca0bcb`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious remote activity was executed under the account `LocalSystem`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
