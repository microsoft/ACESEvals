tasks:
- task_id: incident_39_latest_test_set_task_74
  title: incident_39_latest_test_set_task_74
  description: 'According to the related alert about dual-purpose tools being dropped, which executable file was identified
    on the targeted device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we observed PsExec being used to launch commands on remote devices, including
      one that stopped and started NTDS via net.exe and wrote output to a file named adminticket.txt. The alert indicates
      PsExec may have helped an attacker copy several dual-purpose tools to another host for credential theft or lateral movement.'
    question: 'According to the related alert about dual-purpose tools being dropped, which executable file was identified
      on the targeted device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: PsExec was used to remotely launch a process with ExtractedFileName `powershell.exe` at 2024-07-04 
          22:35:03.229603+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Prior to that, multiple dual-purpose tools were dropped, including the file with Name `rubeus.exe` 
          at 2024-07-04 22:35:02.140784+00:00.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
