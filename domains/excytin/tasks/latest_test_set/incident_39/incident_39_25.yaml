tasks:
- task_id: incident_39_latest_test_set_task_25
  title: incident_39_latest_test_set_task_25
  description: 'Shortly after this remote activity, a credential-theft command line was observed. Which executable (file name)
    was identified as the credential-theft tool that was run?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring flagged suspicious remote activity on host vnevado-win10b. The activity involved
      the service executable psexesvc.exe being launched under the LocalSystem account, suggesting a possible remote interactive
      session or lateral-movement attempt.'
    question: 'Shortly after this remote activity, a credential-theft command line was observed. Which executable (file name)
      was identified as the credential-theft tool that was run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was identified that involved the file Name `psexesvc.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Multiple dual-purpose tools were dropped on the host HostName `vnevado-win10v`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The credential-theft tool was executed by process ProcessId `4748` (CreatedTimeUtc 
          `2024-06-27t14:33:38.0249949z`) with CommandLine `"mimikatz.exe" "lsadump::dcsync 
          /domain:vnevado.alpineskihouse.co /user:xfbzkp" exit`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
