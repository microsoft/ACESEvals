tasks:
- task_id: incident_39_latest_test_set_task_8
  title: incident_39_latest_test_set_task_8
  description: 'According to the alert that detected the active "Kekeo" malware, what is the name of the executable file that
    was flagged?'
  inherit_shared: true
  initial_context:
    incident_context: 'While investigating suspicious Kerberos-related activity, we noted that the user account "tgs2z" (SID
      S-5-7-21-1843151660-3234030288-105586167-1422) executed the PowerShell script "get-krbticket.ps1" (process ID 6636)
      on host "vnevado-win10v". This behaviour triggered an alert indicating the possible use of a credential-stealing tool.
      Almost simultaneously, another alert reported that malware identified as "Kekeo" was active on the same machine.'
    question: 'According to the alert that detected the active "Kekeo" malware, what is the name of the executable file that
      was flagged?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A process with ExtractedFileName `rubeus.exe` was observed, indicating possible use of the Rubeus kerberoasting
          tool on the endpoint (Time: 2024-07-04 22:35:04.021732+00:00).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The same executable, identified as a file with Name `rubeus.exe`, was detected as active ‘Kekeo’ malware
          (Time: 2024-07-04 22:35:03.402097+00:00).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
