tasks:
- task_id: incident_39_latest_test_set_task_9
  title: incident_39_latest_test_set_task_9
  description: 'According to the ''Kekeo'' malware detection alert generated at 2024-07-04 22:35:03 UTC, what is the name
    of the executable file that was identified on the host?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on domain controller "vnevado-dc", the account "lucasb" (SID S-1-5-21-1440151660-4837038288-105596163-1120)
      was observed running a PowerShell command that stopped the NTDS service and attempted a SID-history injection, an action
      often used to gain elevated privileges. Moments later, a known credential-theft tool execution was detected on the same
      host, and almost simultaneously Microsoft Defender flagged a piece of malware associated with the toolset "Kekeo", indicating
      that malicious code had been placed on the system.'
    question: 'According to the ''Kekeo'' malware detection alert generated at 2024-07-04 22:35:03 UTC, what is the name of
      the executable file that was identified on the host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'rubeus.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'rubeus.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A SID history injection was detected using process ExtractedFileName `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A malicious credential-theft tool execution was observed on host HostName `vnevado-win10v`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The 'Kekeo' malware was detected with file Name `rubeus.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
