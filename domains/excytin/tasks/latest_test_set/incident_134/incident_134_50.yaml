tasks:
- task_id: incident_134_latest_test_set_task_50
  title: incident_134_latest_test_set_task_50
  description: 'What is the IP address that triggered the earlier “Anonymous IP address” sign-in alert related to the same
    user account?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert was raised for user Nina Park (`Nina Park@vnevado.alpineskihouse.co`) after a suspicious inbox
      rule was created from the source IP address 237.7.81.122 on 2024-07-17 at 11:34 UTC. This activity suggests a potential
      compromise where an attacker may have gained access to the mailbox and is manipulating email flow. While reviewing related
      events, you discover that the same user’s account was also associated with an earlier “Anonymous IP address” sign-in
      alert on the same day.'
    question: 'What is the IP address that triggered the earlier “Anonymous IP address” sign-in alert related to the same
      user account?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Alert at 2024-07-17 11:34:48.784934+00:00 shows the account (Field: AadUserId, Value: `e036dee7-fa23-42ef-a019-468c8d3401f1`)
          had its inbox rules suspiciously manipulated.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Prior alert at 2024-07-17 11:01:27.633644+00:00 indicates a sign-in from an anonymous IP address (Field:
          Address, Value: `170.54.121.63`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
