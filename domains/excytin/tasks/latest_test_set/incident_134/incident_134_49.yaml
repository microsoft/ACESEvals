tasks:
- task_id: incident_134_latest_test_set_task_49
  title: incident_134_latest_test_set_task_49
  description: 'Which sender address was associated with the email messages that were removed because they contained a malicious
    URL?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we noticed multiple sign-ins originating from an anonymous IP address (170.54.121.63).
      Shortly after that activity, Microsoft 365 Defender reported that several email messages containing a malicious URL
      were delivered to users’ mailboxes and subsequently removed by the service.'
    question: 'Which sender address was associated with the email messages that were removed because they contained a malicious
      URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The user account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` was observed signing in from
          an anonymous IP address.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A malicious email, later removed, was sent by Sender `alyssat@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
