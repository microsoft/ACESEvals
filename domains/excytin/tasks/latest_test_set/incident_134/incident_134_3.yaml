tasks:
- task_id: incident_134_latest_test_set_task_3
  title: incident_134_latest_test_set_task_3
  description: 'During the follow-up alert titled “BEC financial fraud,” which user account was identified as having a newly
    created hidden-mail inbox rule?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring has detected activity originating from cloud application ID 20893 that resulted
      in the creation of suspicious inbox manipulation rules within a user’s mailbox. This behavior suggests a potential attacker
      may have gained access and is attempting to conceal or divert legitimate email traffic—an action frequently linked to
      Business Email Compromise (BEC) schemes.'
    question: 'During the follow-up alert titled “BEC financial fraud,” which user account was identified as having a newly
      created hidden-mail inbox rule?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious inbox manipulation rule was set from IP address `237.7.81.122`, indicating an attacker
          may have gained unauthorized access.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: In the same time frame, the account `Nina Park` had a new inbox-hiding rule created during a risky 
          Azure AD session, suggesting a BEC-style financial fraud attempt.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
