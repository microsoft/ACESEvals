tasks:
- task_id: incident_134_latest_test_set_task_13
  title: incident_134_latest_test_set_task_13
  description: 'Roughly an hour after the initial malicious-URL click, the investigation flagged another alert: "Suspicious
    emails sent by BEC-related user." Which mailbox primary address was identified as the sender in this later suspicious-email
    activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 17 2024 at 10:59 UTC, an alert titled "A potentially malicious URL click was detected" was
      raised. The message had been sent from alyssat@vnevado.alpineskihouse.co to raphaelt@vnevado.alpineskihouse.co, and
      the user clicked the suspicious link http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/. This activity
      may be connected to a broader Business Email Compromise (BEC) campaign that triggered further investigation.'
    question: 'Roughly an hour after the initial malicious-URL click, the investigation flagged another alert: "Suspicious
      emails sent by BEC-related user." Which mailbox primary address was identified as the sender in this later suspicious-email
      activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'nathan@avoriaz.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'nathan@avoriaz.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A potentially malicious URL was clicked by the account (Email=`Nina 
          Park@vnevado.alpineskihouse.co`) at 2024-07-17T10:59:14.787387Z.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, suspicious emails were sent from mailbox 
          (MailboxPrimaryAddress=`nathan@avoriaz.alpineskihouse.co`) at 2024-07-17T11:55:04.449509Z.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
