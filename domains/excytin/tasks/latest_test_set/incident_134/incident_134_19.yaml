tasks:
- task_id: incident_134_latest_test_set_task_19
  title: incident_134_latest_test_set_task_19
  description: 'During the "Suspicious inbox manipulation rule" alert that is connected to the malicious sign-in from 170.54.121.63,
    what is the AppId of the cloud application involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security investigation is underway after a sign-in was observed from the known-malicious IP address
      170.54.121.63. This sign-in is linked to further activity in which an attacker appears to have created or modified an
      email inbox rule, a common tactic used to hide or exfiltrate messages after gaining access to a mailbox.'
    question: 'During the "Suspicious inbox manipulation rule" alert that is connected to the malicious sign-in from 170.54.121.63,
      what is the AppId of the cloud application involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On 2024-07-18 13:48:02.042756Z, a sign-in from a malicious IP address was linked to the account (AadUserId:
          `e036dee7-fa23-42ef-a019-468c8d3401f1`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The day before, on 2024-07-17 11:34:48.784934Z, suspicious inbox-manipulation rules were created in
          a cloud application (AppId: `20893`), indicating possible misuse of that application after the account compromise.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
