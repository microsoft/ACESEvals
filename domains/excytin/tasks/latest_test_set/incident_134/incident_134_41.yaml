tasks:
- task_id: incident_134_latest_test_set_task_41
  title: incident_134_latest_test_set_task_41
  description: 'During the password-spray attack detected at 14:36 UTC on 2024-07-18, what is the Azure AD User ID (AadUserId)
    of the account that was targeted?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert was triggered on 2024-07-18 at 13:48 UTC for a sign-in attempt coming from the known-malicious
      IP address 170.54.121.63. Shortly after this suspicious activity, another alert was raised at 14:36 UTC the same day
      indicating that a password-spray attack had been detected against an Azure AD account.'
    question: 'During the password-spray attack detected at 14:36 UTC on 2024-07-18, what is the Azure AD User ID (AadUserId)
      of the account that was targeted?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e036dee7-fa23-42ef-a019-468c8d3401f1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e036dee7-fa23-42ef-a019-468c8d3401f1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An authentication attempt originated from the malicious IP address (Field: Address, Value: 170.54.121.63)
          at 2024-07-18T13:48:02Z.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, a password-spray attack targeted the Azure AD account (Field: AadUserId, Value: e036dee7-fa23-42ef-a019-468c8d3401f1)
          at 2024-07-18T14:36:59Z.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
