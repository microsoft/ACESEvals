tasks:
- task_id: incident_134_latest_test_set_task_20
  title: incident_134_latest_test_set_task_20
  description: 'Identify the exact IP address that was reported in the “Anonymous IP address” alert triggered shortly after
    the malicious URL click.'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security incident, we observed that the user account “Nina Park” (email:
      Nina Park@vnevado.alpineskihouse.co, SID S-1-5-21-1874151667-3554330288-105586563-1715) clicked a URL that was later
      determined to be potentially malicious. This action triggered the alert titled “A potentially malicious URL click was
      detected” on 2024-07-17 at 10:59 UTC. Just a couple of minutes later, another alert—“Anonymous IP address”—was raised,
      indicating that the same user attempted to sign in from a network location associated with an anonymity service.'
    question: 'Identify the exact IP address that was reported in the “Anonymous IP address” alert triggered shortly after
      the malicious URL click.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: User with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` clicked on a potentially malicious URL 
          at 2024-07-17 10:59:14.787387+00:00.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A sign-in was observed from the anonymous IP address `170.54.121.63` at 2024-07-17 
          11:01:27.633644+00:00.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
