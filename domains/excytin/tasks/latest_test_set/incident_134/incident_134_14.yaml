tasks:
- task_id: incident_134_latest_test_set_task_14
  title: incident_134_latest_test_set_task_14
  description: 'From whom did the email originate that contained the malicious link clicked by the user?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed a sign-in originating from the malicious IP address 170.54.121.63.
      Further pivoting on the same user account revealed another alert indicating that the user clicked a link later determined
      to be malicious.'
    question: 'From whom did the email originate that contained the malicious link clicked by the user?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-18 13:48:02Z, a sign-in from a malicious IP address was detected for the account with 
          AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: At 2024-07-17 10:59:14Z, a potentially malicious URL was clicked in an email message whose Sender 
          field was `alyssat@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
