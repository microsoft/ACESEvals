tasks:
- task_id: incident_134_latest_test_set_task_39
  title: incident_134_latest_test_set_task_39
  description: 'According to the subsequent "Malicious IP address" alert associated with this incident, what is the IP address
    from which the risky sign-in originated?'
  inherit_shared: true
  initial_context:
    incident_context: 'An alert titled "Email messages containing malicious URL removed after delivery" was triggered after
      a message from alyssat@vnevado.alpineskihouse.co to raphaelt@vnevado.alpineskihouse.co was found to contain the suspicious
      link https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/. The message was sent from the IP address
      254.241.243.229 and eventually removed. The affected mailbox belongs to raphaelt@vnevado.alpineskihouse.co, and the
      related user account is Nina Park (SID S-1-5-21-1874151667-3554330288-105586563-1715).'
    question: 'According to the subsequent "Malicious IP address" alert associated with this incident, what is the IP address
      from which the risky sign-in originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An email containing a malicious URL was delivered and later removed for the account (Field: AadUserId,
          Value: `e036dee7-fa23-42ef-a019-468c8d3401f1`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, a sign-in was detected from a known malicious IP (Field: Address, Value: `170.54.121.63`),
          indicating potential compromise of the same user.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
