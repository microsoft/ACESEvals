tasks:
- task_id: incident_134_latest_test_set_task_35
  title: incident_134_latest_test_set_task_35
  description: 'What is the email address of the account that created the suspicious inbox rule referenced in the "BEC financial
    fraud" alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'A sign-in originating from the malicious IP address 170.54.121.63 was detected and flagged as suspicious.
      Investigation shows that the same Azure AD identity later triggered a "BEC financial fraud" alert after creating an
      inbox rule designed to hide incoming mail, indicating a potential business-email-compromise attempt.'
    question: 'What is the email address of the account that created the suspicious inbox rule referenced in the "BEC financial
      fraud" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Park@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Park@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attacker signed in using the account with AadUserId `e036dee7-fa23-42ef-a019-468c8d3401f1` from 
          a malicious IP address.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious inbox-hiding rule was then created for the account with Email `Nina 
          Park@vnevado.alpineskihouse.co`, indicating a potential BEC financial-fraud attempt.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
