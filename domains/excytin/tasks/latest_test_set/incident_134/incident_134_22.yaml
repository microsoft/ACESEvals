tasks:
- task_id: incident_134_latest_test_set_task_22
  title: incident_134_latest_test_set_task_22
  description: 'What is the Security Identifier (SID) of the account that clicked the malicious URL?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a password spray attack originating from IP address 170.54.121.63, we found
      that the same user account later triggered another alert: the user clicked on a link that was subsequently classified
      as malicious. Analysts need to pivot from the original password-spray alert to this malicious-URL-click alert to fully
      scope the incident.'
    question: 'What is the Security Identifier (SID) of the account that clicked the malicious URL?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1874151667-3554330288-105586563-1715'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1874151667-3554330288-105586563-1715'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-18 14:36:59Z, a password-spray attack targeted the Azure AD account with field AadUserId
          `e036dee7-fa23-42ef-a019-468c8d3401f1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Earlier, on 2024-07-17 10:59:14Z, the user account identified by field Sid 
          `S-1-5-21-1874151667-3554330288-105586563-1715` clicked a potentially malicious URL.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
