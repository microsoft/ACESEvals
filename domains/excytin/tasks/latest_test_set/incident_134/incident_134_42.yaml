tasks:
- task_id: incident_134_latest_test_set_task_42
  title: incident_134_latest_test_set_task_42
  description: 'According to the "Suspicious inbox manipulation rule" alert, what is the App ID of the cloud application involved
    in this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 17, 2024, security monitoring flagged the mailbox nathan@avoriaz.alpineskihouse.co after it
      sent emails typical of a business-email-compromise attempt. The alert, titled "Suspicious emails sent by BEC-related
      user," noted that the messages were sent from raphaelt@vnevado.alpineskihouse.co via IP address 237.7.81.122. While
      reviewing this activity, analysts also discovered a separate alert—"Suspicious inbox manipulation rule"—indicating that
      an attacker may have modified mailbox rules to conceal or exfiltrate data.'
    question: 'According to the "Suspicious inbox manipulation rule" alert, what is the App ID of the cloud application involved
      in this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '20893'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '20893'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious emails were sent by the user account Name `Nina Park`, indicating a possible 
          business-email-compromise scenario.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An inbox manipulation rule was created/edited through the cloud application AppId `20893`, 
          suggesting the attacker is attempting to hide or exfiltrate mail from the compromised account.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
