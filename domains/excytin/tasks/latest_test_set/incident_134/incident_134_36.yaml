tasks:
- task_id: incident_134_latest_test_set_task_36
  title: incident_134_latest_test_set_task_36
  description: 'According to the Password Spray alert raised on 18-Jul-2024, what was the source IP address used in the attack?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation we noted that on 17-Jul-2024 an email containing a malicious URL (https://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/)
      was sent from alyssat@vnevado.alpineskihouse.co to raphaelt@vnevado.alpineskihouse.co and later removed by the mail
      hygiene system. The activity involves several users, including the mailbox of raphaelt and the account of Nina Park.
      The next day, on 18-Jul-2024, a separate alert reported a Password Spray attack against the tenant.'
    question: 'According to the Password Spray alert raised on 18-Jul-2024, what was the source IP address used in the attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Email exposure: Account (AadUserId = e036dee7-fa23-42ef-a019-468c8d3401f1) received an email containing
          a malicious URL that was subsequently removed (2024-07-17 11:04:19.964546+00:00).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Credential-based attack: A password-spray attempt was detected originating from IP address (Address
          = 170.54.121.63) on 2024-07-18 14:36:59.143748+00:00.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
