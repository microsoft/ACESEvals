tasks:
- task_id: incident_134_latest_test_set_task_57
  title: incident_134_latest_test_set_task_57
  description: 'According to the "Password Spray" alert that occurred on 2024-07-18, what IP address was identified as the
    source of the attack?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-17 a security alert was raised after user Nina Park clicked the suspicious link "http://ms175052280.orangecliff-f53f26fd.eastus.azurecontainerapps.io/"
      that had been delivered to raphaelt@vnevado.alpineskihouse.co from alyssat@vnevado.alpineskihouse.co. The event was
      reported as "A potentially malicious URL click was detected" and involved several mail-related entities (sender, recipient,
      mailbox) as well as the user account of Nina Park. During follow-up monitoring, another alert titled "Password Spray"
      was triggered the next day, indicating that an attacker attempted to guess passwords for multiple accounts in rapid
      succession.'
    question: 'According to the "Password Spray" alert that occurred on 2024-07-18, what IP address was identified as the
      source of the attack?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '170.54.121.63'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '170.54.121.63'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-17, a malicious URL was clicked by the account with field AadUserId 
          `e036dee7-fa23-42ef-a019-468c8d3401f1`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-18, a password spray attack was detected coming from the IP with field Address 
          `170.54.121.63`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
