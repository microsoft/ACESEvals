tasks:
- task_id: incident_134_latest_test_set_task_33
  title: incident_134_latest_test_set_task_33
  description: 'According to the related email-based alert, what was the sender address of the messages that were removed
    after delivery?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a password-spray-related account compromise originating from the unusual
      IP address 170.54.121.63, we noted a related alert stating that email messages containing a malicious URL were delivered
      to users’ mailboxes but subsequently removed by security defenses.'
    question: 'According to the related email-based alert, what was the sender address of the messages that were removed after
      delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'alyssat@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'alyssat@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Alert indicates that an account with field Sid = `S-1-5-21-1874151667-3554330288-105586563-1715` 
          was compromised following a password-spray attack (time 2024-07-18 14:54:18 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Another alert shows an email message where the mailmessage field Sender = 
          `alyssat@vnevado.alpineskihouse.co` contained a malicious URL and was removed after delivery (time 2024-07-17 
          11:04:19 UTC).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
