tasks:
- task_id: incident_134_latest_test_set_task_7
  title: incident_134_latest_test_set_task_7
  description: 'For the email that contained the malicious link clicked by the user, what was the sender’s IP address recorded
    in the message headers?'
  inherit_shared: true
  initial_context:
    incident_context: 'While examining a Business Email Compromise (BEC)–related incident, we observed that the external IP
      address 237.7.81.122 was used in a risky Azure Active Directory session where an attacker created a suspicious inbox
      rule designed to hide incoming messages. This activity suggests an attempt at financial fraud. During the same time-frame,
      security logs show that the (currently unnamed) user also clicked a link later confirmed to be malicious.'
    question: 'For the email that contained the malicious link clicked by the user, what was the sender’s IP address recorded
      in the message headers?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '254.241.243.229'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '254.241.243.229'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-17 10:59:14.787387+00:00, an email message whose SenderIP field equals `254.241.243.229`
          was clicked by a user, indicating exposure to a malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: At 2024-07-17 11:34:48.803827+00:00, a suspicious inbox rule was created for the account whose Name
          field equals `Nina Park`, signaling a Business Email Compromise (BEC) financial-fraud attempt.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
