tasks:
- task_id: incident_38_latest_test_set_task_2
  title: incident_38_latest_test_set_task_2
  description: 'What is the executable file name of the process that was identified as the injection target in the follow-up
    alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation, we saw user "nathans" (SID S-1-5-21-1240151660-3534038288-105586567-4122) using
      host "vnevado-win11a" where a process named "notepad.exe" (PID 8932, created 2024-06-26 15:49:51 UTC) was involved in
      a suspicious code-injection event. Immediately afterward, another alert for the same technique (process injection) was
      raised, indicating that a different process became the recipient of the injected code.'
    question: 'What is the executable file name of the process that was identified as the injection target in the follow-up
      alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Alert 1 – Suspicious process injection: the target process had field ProcessId__CreatedTimeUtc__CommandLine
          with value `8932__2024-06-26t15:49:51.3043595z__"notepad.exe"`, showing that process ID 8932 (notepad.exe, created
          2024-06-26T15:49:51Z) received injected code.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Alert 2 – Suspicious process injection: the injecting or injected process is identified by field ExtractedFileName
          with value `powershell.exe`, indicating PowerShell was involved in the code-injection activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
