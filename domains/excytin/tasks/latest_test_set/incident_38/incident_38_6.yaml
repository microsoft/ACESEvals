tasks:
- task_id: incident_38_latest_test_set_task_6
  title: incident_38_latest_test_set_task_6
  description: 'According to the "Suspicious Application Window Discovery" alert that followed, what executable was launched
    on the device to perform the window-discovery activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious process injection event, we observed that a file-less payload
      was referenced from the URL https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt
      and code was injected into a running instance of notepad.exe. This activity occurred on the same device only seconds
      before another alert was raised for "Suspicious Application Window Discovery", indicating an attacker might have attempted
      to enumerate application windows after the injection step.'
    question: 'According to the "Suspicious Application Window Discovery" alert that followed, what executable was launched
      on the device to perform the window-discovery activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious process injection was detected on the host with AadDeviceId 
          `39d8c57f-2d08-4888-b0cd-12cd0679337a`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious application window discovery was executed by the process with ProcessId `7472`, 
          CreatedTimeUtc `2024-06-26t15:49:15.7860486z`, CommandLine `powershell.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
