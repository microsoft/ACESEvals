tasks:
- task_id: incident_38_latest_test_set_task_11
  title: incident_38_latest_test_set_task_11
  description: 'The "Suspicious process injection observed" alert points to a specific external resource that the injected
    code tried to reach. What is the full URL referenced in this alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4th 2024 at 22:35 UTC, the process "powershell.exe" (PID 7472, launched 2024-06-26T15:49:15Z)
      triggered a "Suspicious Application Window Discovery" alert, suggesting an attempt to enumerate the environment on the
      device. Just one second later, a follow-up alert titled "Suspicious process injection observed" indicated that code
      had been injected into another process, a common technique for hiding malicious activity.'
    question: 'The "Suspicious process injection observed" alert points to a specific external resource that the injected
      code tried to reach. What is the full URL referenced in this alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious application window discovery was performed by account with AadUserId 
          `12185914-91dd-4fb9-94f9-3252203b0426`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious process injection was observed that referenced the URL 
          `https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
