tasks:
- task_id: incident_38_latest_test_set_task_12
  title: incident_38_latest_test_set_task_12
  description: 'According to the "Suspicious Application Window Discovery" alert that followed, which executable was launched
    (give the process name)?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4, 2024, at 22:35 UTC our monitoring flagged a "Suspicious process injection observed" alert.
      Investigation showed that a process with command line "notepad.exe" executed after downloading content from the URL
      https://wcdstaticfilesprdeus.blob.core.windows.net/wcdstaticfiles/winatp-intro-fileless.txt. This behavior may indicate
      an attempt to hide malicious code inside a trusted process. Around the same time, another alert titled "Suspicious Application
      Window Discovery" was triggered on the same host, suggesting the attacker tried to enumerate windows or gather UI information
      for further malicious activity.'
    question: 'According to the "Suspicious Application Window Discovery" alert that followed, which executable was launched
      (give the process name)?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious PowerShell window-discovery command was executed (entity field 
          ProcessId__CreatedTimeUtc__CommandLine, value `4656__2024-06-26t15:49:41.4025245z__"powershell.exe" 
          -executionpolicy bypass -encodedcommand … -inputformat xml -outputformat text`).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Soon after, a process-injection alert showed the compromised host communicating with the external 
          IP address (entity field Address, value `72.5.72.208`).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
