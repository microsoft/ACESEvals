tasks:
- task_id: incident_34_latest_test_set_task_13
  title: incident_34_latest_test_set_task_13
  description: 'What is the SID of the user account under which the anomalous scheduled task was created on host "vnevado-win10e"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a security review, an analyst manually started an automated investigation on the workstation
      "vnevado-win10e.vnevado.alpineskihouse.co" to identify and remediate potential threats. Immediately after the investigation
      began, the system generated an alert titled "An anomalous scheduled task was created," indicating that someone had set
      up a suspicious scheduled task on the same host—often a tactic used for persistence. The alert logs show that this task
      was created under a specific user account, but only the security identifier (SID) for that account is recorded.'
    question: 'What is the SID of the user account under which the anomalous scheduled task was created on host "vnevado-win10e"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Automated investigation was manually started on host with HostName `vnevado-win10e` (2024-07-04 
          22:35:00 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Immediately after, an anomalous scheduled task was created by the account with Sid 
          `S-1-5-21-1870156660-7534030218-135086563-1193`, suggesting the attacker might be establishing persistence on 
          `vnevado-win10e`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
