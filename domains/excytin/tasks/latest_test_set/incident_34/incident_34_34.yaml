tasks:
- task_id: incident_34_latest_test_set_task_34
  title: incident_34_latest_test_set_task_34
  description: 'Which executable file was ultimately identified as the backdoor associated with the suspicious PowerShell
    activity on host ''vnevado-win10e''?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security incident, a PowerShell command was executed by a suspicious
      process under the account ''samuelf'' (SID S-1-5-21-1870156660-7534030218-135086563-1193) on host ''vnevado-win10e''
      (device ID 02b8f519-1123-4228-b32a-ccb78af3449f). Analysts determined that this activity was linked to a specific malicious
      executable later classified as a backdoor.'
    question: 'Which executable file was ultimately identified as the backdoor associated with the suspicious PowerShell activity
      on host ''vnevado-win10e''?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'At 2024-07-04 22:35:00.698474+00:00, the process (ExtractedFileName: `winatp-intro-backdoor.exe`) executed
          a suspicious PowerShell command.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
