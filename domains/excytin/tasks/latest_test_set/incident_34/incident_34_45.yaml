tasks:
- task_id: incident_34_latest_test_set_task_45
  title: incident_34_latest_test_set_task_45
  description: 'According to the alert "An uncommon file was created and added to a Run Key," which IP address is associated
    with this persistence activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a recent security incident, analysts noted that Microsoft Word (winword.exe)
      executed the macro-enabled document "rs4_winatp-intro-invoice.docm" (process ID 9780, UTC time 2024-06-26T11:57:20Z).
      This activity coincided with a "Suspicious LDAP query" alert, suggesting the attacker may have been performing domain
      reconnaissance. Within the same time window, another alert titled "An uncommon file was created and added to a Run Key"
      was raised, indicating that persistence might have been established on the compromised host.'
    question: 'According to the alert "An uncommon file was created and added to a Run Key," which IP address is associated
      with this persistence activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious LDAP query was executed by an account with Sid 
          `S-1-5-21-1870156660-7534030218-135086563-1193`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An uncommon file was created and added to a Run Key, and the activity is associated with the IP 
          address `72.5.72.208`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
