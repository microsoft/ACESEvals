tasks:
- task_id: incident_34_latest_test_set_task_69
  title: incident_34_latest_test_set_task_69
  description: 'A follow-up alert, "Suspicious PowerShell download or encoded command execution," was raised one second later.
    What is the Security Identifier (SID) of the account that ran this potentially malicious PowerShell activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that the host executed a suspicious PowerShell command line shortly
      after an Office document (winword.exe) spawned a series of scheduled-task commands (schtasks.exe) designed to run a
      file named "winatp-intro-backdoor.exe." This activity triggered the alert titled "Suspicious PowerShell command line"
      on 2024-07-04 at 22:35 UTC, suggesting that PowerShell may have been abused to run additional payloads or collect system
      information.'
    question: 'A follow-up alert, "Suspicious PowerShell download or encoded command execution," was raised one second later.
      What is the Security Identifier (SID) of the account that ran this potentially malicious PowerShell activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious PowerShell command line spawned a process with ExtractedFileName 
          `winatp-intro-backdoor.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The suspicious PowerShell download or encoded command execution was performed by the account with 
          Sid `S-1-5-21-1870156660-7534030218-135086563-1193`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
