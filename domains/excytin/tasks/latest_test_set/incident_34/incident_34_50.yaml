tasks:
- task_id: incident_34_latest_test_set_task_50
  title: incident_34_latest_test_set_task_50
  description: 'Immediately after the above PowerShell activity, an alert named "An uncommon file was created and added to
    a Run Key" was triggered. According to that alert, which IP address is associated with the event?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the incident, the machine executed a long and obfuscated PowerShell command that wrote a file
      called "winatp-intro-backdoor.exe" to the user’s Desktop and scheduled it to run via the "yrei" scheduled task. This
      behavior was captured in the alert titled "Suspicious PowerShell command line", highlighting potential persistence activity
      initiated through PowerShell and Schtasks.'
    question: 'Immediately after the above PowerShell activity, an alert named "An uncommon file was created and added to
      a Run Key" was triggered. According to that alert, which IP address is associated with the event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Account Sid: S-1-5-21-1870156660-7534030218-135086563-1193 – The user with this SID ran a suspicious
          PowerShell command at 2024-07-04 22:35:01 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'IP Address: 72.5.72.208 – One second later, activity from this IP created an uncommon file and placed
          it in a Run registry key, likely establishing persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
