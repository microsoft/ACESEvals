tasks:
- task_id: incident_34_latest_test_set_task_12
  title: incident_34_latest_test_set_task_12
  description: 'What is the name of the executable that launched the process responsible for the suspicious LDAP query detected
    at 22:35:02 UTC on 2024-07-04?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at 22:35 UTC our monitoring flagged an alert: “Powershell dropped a suspicious file on
      the machine and executed it.” The command line shows that PowerShell created a file named “winatp-intro-backdoor.exe”
      on the desktop and set up a scheduled task to run it. This activity was associated with an as-yet-unidentified user
      account. Almost simultaneously, another alert was raised for a “Suspicious LDAP query,” suggesting possible reconnaissance
      of the domain environment. Investigators need to understand which process issued that LDAP query.'
    question: 'What is the name of the executable that launched the process responsible for the suspicious LDAP query detected
      at 22:35:02 UTC on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winword.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The user account (Field: Name, Value: `samuelf`) launched a PowerShell session that dropped and executed
          a suspicious file on the machine at 2024-07-04 22:35:03Z.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Earlier, a process (Field: ProcessId__CreatedTimeUtc__CommandLine, Value: `9780__2024-06-26t11:57:20.2959493z__"winword.exe"
          c:\scripts\rs4_winatp-intro-invoice.docm`) performed a suspicious LDAP query, indicating reconnaissance activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
