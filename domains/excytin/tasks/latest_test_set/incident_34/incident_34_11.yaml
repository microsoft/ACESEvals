tasks:
- task_id: incident_34_latest_test_set_task_11
  title: incident_34_latest_test_set_task_11
  description: 'Subsequent analysis revealed that PowerShell later dropped and executed a potentially malicious file on the
    same machine. What is the name of the file that was dropped?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a suspicious PowerShell activity, analysts observed that the process "winword.exe"
      (PID 9780) executed a command on 2024-06-26T11:57:20Z to run a macro-enabled document (rs4_winatp-intro-invoice.docm).
      This behavior triggered an alert titled "Suspicious PowerShell download or encoded command execution," suggesting the
      process may have attempted to download or run additional payloads in memory.'
    question: 'Subsequent analysis revealed that PowerShell later dropped and executed a potentially malicious file on the
      same machine. What is the name of the file that was dropped?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: PowerShell executed a suspicious download or encoded command on device with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f` (2024-07-04 22:35:04.145779 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On the same machine, PowerShell then dropped and ran a suspicious file named 
          `winatp-intro-backdoor.exe` (2024-07-04 22:35:03.736539 UTC).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
