tasks:
- task_id: incident_34_latest_test_set_task_80
  title: incident_34_latest_test_set_task_80
  description: 'According to the “Anomaly detected in ASEP registry” alert that followed the suspicious PowerShell activity,
    what is the external IP address associated with the suspicious registry entry?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a recent threat, analysts observed a suspicious PowerShell command (PID
      8604) executed via "powershell.exe" that wrote a payload named "winatp-intro-backdoor.exe" to the user’s Desktop and
      created a one-time scheduled task called "yrei" to run it. This activity triggered the alert “Suspicious PowerShell
      command line” on 2024-07-04 22:35:01 UTC. Only moments later, a second alert titled “Anomaly detected in ASEP registry”
      was raised, indicating that a process had registered a potentially malicious command for automatic execution on reboot—suggesting
      an attempt at persistence by contacting an external network location.'
    question: 'According to the “Anomaly detected in ASEP registry” alert that followed the suspicious PowerShell activity,
      what is the external IP address associated with the suspicious registry entry?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Alert 1 shows a suspicious PowerShell command executed by account.Sid = 
          `S-1-5-21-1870156660-7534030218-135086563-1193`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Alert 2 indicates an anomaly in the ASEP registry tied to ip.Address = `72.5.72.208`, suggesting an
          attempt to establish persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
