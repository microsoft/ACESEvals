tasks:
- task_id: incident_34_latest_test_set_task_60
  title: incident_34_latest_test_set_task_60
  description: 'According to the related “Anomaly detected in ASEP registry” alert that followed the Task Scheduler abuse,
    what IP address was associated with the suspicious registry entry?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into suspicious Task Scheduler abuse, analysts observed a PowerShell script
      that created and immediately triggered a one-time task named “yrei.” The script wrote a file called "winatp-intro-backdoor.exe"
      to a user’s Desktop and used schtasks.exe to schedule and run it. This activity was flagged in the alert titled “Suspicious
      Task Scheduler activity” raised on 2024-07-04 at 22:35 UTC. A second, related alert fired almost simultaneously, indicating
      that a process had inserted a malicious command into an Auto-Start Extension Point (ASEP) registry key to ensure persistence
      after reboot.'
    question: 'According to the related “Anomaly detected in ASEP registry” alert that followed the Task Scheduler abuse,
      what IP address was associated with the suspicious registry entry?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious Task Scheduler activity was executed by the account (Name = 'samuelf'), indicating an 
          attempt to create or modify a scheduled task for persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An anomaly was detected in the ASEP registry originating from the IP (Address = '72.5.72.208'), 
          suggesting that a malicious command was planted to execute after a system reboot.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
