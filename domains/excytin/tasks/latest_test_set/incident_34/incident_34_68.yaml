tasks:
- task_id: incident_34_latest_test_set_task_68
  title: incident_34_latest_test_set_task_68
  description: 'According to the alert that recorded the manual launch of the automated investigation, what is the Azure AD
    device ID (AadDeviceId) of the host vnevado-win10e.vnevado.alpineskihouse.co?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 an alert flagged a suspicious LDAP query that appeared to originate from the user account
      "samuelf" after opening a macro-enabled Word document (winword.exe). Moments later, analyst u141 manually launched a
      Microsoft 365 automated investigation on the same workstation, identified in the alert text as vnevado-win10e.vnevado.alpineskihouse.co,
      to collect and remediate any threat artifacts discovered.'
    question: 'According to the alert that recorded the manual launch of the automated investigation, what is the Azure AD
      device ID (AadDeviceId) of the host vnevado-win10e.vnevado.alpineskihouse.co?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '02b8f519-1123-4228-b32a-ccb78af3449f'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '02b8f519-1123-4228-b32a-ccb78af3449f'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An automated investigation was manually initiated on host with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, a suspicious LDAP query was executed on the same host with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`, indicating potential reconnaissance activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
