tasks:
- task_id: incident_34_latest_test_set_task_7
  title: incident_34_latest_test_set_task_7
  description: 'According to the "Suspicious process executed PowerShell command" alert raised moments before the registry
    anomaly, what is the name of the process that ran the PowerShell command?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of an endpoint, the alert system flagged an "Anomaly detected in ASEP registry"
      at 2024-07-04 22:35:01 UTC. The activity originated from IP address 72.5.72.208, where a process (PID 10208) ran the
      command: reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe.
      This registry modification could allow malicious code to run automatically after a reboot. Shortly before this, another
      alert indicated that a suspicious process executed a PowerShell command, suggesting further post-exploitation activity.'
    question: 'According to the "Suspicious process executed PowerShell command" alert raised moments before the registry
      anomaly, what is the name of the process that ran the PowerShell command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Alert at 2024-07-04T22:35:01Z: An account (field AadUserId = `16320fec-8d90-403b-b7fe-78f715d4728d`)
          registered a suspicious command or file in an ASEP registry key, establishing persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Alert at 2024-07-04T22:35:00Z: A process (field ExtractedFileName = `powershell.exe`) executed a suspicious
          PowerShell command, which likely set up or triggered the ASEP registry change.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
