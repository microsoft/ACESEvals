tasks:
- task_id: incident_34_latest_test_set_task_39
  title: incident_34_latest_test_set_task_39
  description: 'According to the "An anomalous scheduled task was created" alert, which executable was used to register the
    scheduled task "yrei"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed that on host "vnevado-win10e" (device ID 02b8f519-1123-4228-b32a-ccb78af3449f)
      a suspicious PowerShell command (PID 8604) was executed that wrote a payload to the user’s Desktop and attempted to
      register a one-time scheduled task named "yrei" for persistence. Seconds later, Defender raised a separate alert titled
      "An anomalous scheduled task was created", indicating that another Windows utility was used to actually create this
      task.'
    question: 'According to the "An anomalous scheduled task was created" alert, which executable was used to register the
      scheduled task "yrei"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'schtasks.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'schtasks.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Host with AadDeviceId `02b8f519-1123-4228-b32a-ccb78af3449f` executed a suspicious PowerShell 
          command at 2024-07-04T22:35:00.698474Z.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On the same device, process entity with ProcessId__CreatedTimeUtc__CommandLine value 
          `1348__2024-06-26t12:00:40.0878355z__"schtasks.exe" /create /sc once /tn yrei /tr "c:\users\samuelf\onedrive -
          (new) alpineskihouse\desktop\winatp-intro-backdoor.exe" /st 11:58 /f` created an anomalous scheduled task, 
          indicating a likely attempt to establish persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
