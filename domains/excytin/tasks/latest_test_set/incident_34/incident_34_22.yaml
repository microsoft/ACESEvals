tasks:
- task_id: incident_34_latest_test_set_task_22
  title: incident_34_latest_test_set_task_22
  description: 'According to the “Suspicious PowerShell download or encoded command execution” alert raised at 2024-07-04
    22:35:04 UTC, which executable was the parent process that launched PowerShell?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that PowerShell dropped a suspicious file named `winatp-intro-backdoor.exe`
      on a machine. Only a second later, another alert titled “Suspicious PowerShell download or encoded command execution”
      was raised, indicating that a different process had invoked PowerShell to download a file or run an encoded command.
      Identifying this process is key to understanding how the attacker chained their actions.'
    question: 'According to the “Suspicious PowerShell download or encoded command execution” alert raised at 2024-07-04 22:35:04
      UTC, which executable was the parent process that launched PowerShell?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winword.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winword.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On host device with HostName `vnevado-win10e`, PowerShell dropped and executed a suspicious file (alert:
          “Powershell dropped a suspicious file on the machine”).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Immediately after, process with field ProcessId__CreatedTimeUtc__CommandLine `9780__2024-06-26t11:57:20.2959493z__"winword.exe"
          c:\scripts\rs4_winatp-intro-invoice.docm` ran a suspicious PowerShell download / encoded command (alert: “Suspicious
          PowerShell download or encoded command execution”).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
