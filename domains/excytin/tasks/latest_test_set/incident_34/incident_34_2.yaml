tasks:
- task_id: incident_34_latest_test_set_task_2
  title: incident_34_latest_test_set_task_2
  description: 'According to the alert that flagged the suspicious PowerShell download or encoded command at 22:35:01 UTC,
    what is the Security Identifier (SID) of the account under which the PowerShell process ran?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent investigation, it was observed that PowerShell dropped a suspicious file named "winatp-intro-backdoor.exe"
      on a device at 2024-07-04 22:35:03 UTC and executed it. Just moments earlier, at 22:35:01 UTC, another alert indicated
      that a process had executed PowerShell to download a file or run an encoded command—an activity commonly leveraged by
      attackers to stage additional payloads or run malicious instructions in memory.'
    question: 'According to the alert that flagged the suspicious PowerShell download or encoded command at 22:35:01 UTC,
      what is the Security Identifier (SID) of the account under which the PowerShell process ran?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An account with SID `S-1-5-21-1870156660-7534030218-135086563-1193` executed PowerShell to download
          a file or run an encoded command (Suspicious PowerShell download or encoded command execution).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The PowerShell process with ExtractedFileName `powershell.exe` then dropped and executed a 
          suspicious file on the machine (Powershell dropped a suspicious file on the machine).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
