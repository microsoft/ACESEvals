tasks:
- task_id: incident_34_latest_test_set_task_16
  title: incident_34_latest_test_set_task_16
  description: 'What is the AadUserId of the account associated with the “Suspicious LDAP query” alert that was triggered
    on host vnevado-win10e?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024 at 22:35 UTC a security operator (u141@ash.alpineskihouse.co) manually kicked off an
      automated investigation on the workstation vnevado-win10e (AadDeviceId: 02b8f519-1123-4228-b32a-ccb78af3449f). Just
      two seconds later, Microsoft Defender raised another alert on the same machine: “Suspicious LDAP query,” indicating
      possible domain-reconnaissance activity by a user account querying the directory.'
    question: 'What is the AadUserId of the account associated with the “Suspicious LDAP query” alert that was triggered on
      host vnevado-win10e?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '16320fec-8d90-403b-b7fe-78f715d4728d'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '16320fec-8d90-403b-b7fe-78f715d4728d'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An automated investigation was manually initiated on the device with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious LDAP query was executed by the account with AadUserId 
          `16320fec-8d90-403b-b7fe-78f715d4728d`, indicating potential reconnaissance activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
