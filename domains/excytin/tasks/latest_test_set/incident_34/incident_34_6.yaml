tasks:
- task_id: incident_34_latest_test_set_task_6
  title: incident_34_latest_test_set_task_6
  description: 'Identify the Azure AD device ID of the host on which user "u141" initiated the automated investigation.'
  inherit_shared: true
  initial_context:
    incident_context: 'While examining a security incident, analysts observed that the account "samuelf" launched a PowerShell
      command which created and executed a file called "winatp-intro-backdoor.exe". Moments later, user "u141" (u141@ash.alpineskihouse.co)
      manually triggered an automated investigation on the workstation vnevado-win10e.vnevado.alpineskihouse.co to assess
      any resulting threat activity.'
    question: 'Identify the Azure AD device ID of the host on which user "u141" initiated the automated investigation.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '02b8f519-1123-4228-b32a-ccb78af3449f'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '02b8f519-1123-4228-b32a-ccb78af3449f'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An automated investigation was manually started on the device whose AadDeviceId is 
          `02b8f519-1123-4228-b32a-ccb78af3449f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, PowerShell dropped and executed a suspicious file on the host with HostName 
          `vnevado-win10e`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
