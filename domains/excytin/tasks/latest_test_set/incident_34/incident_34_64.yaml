tasks:
- task_id: incident_34_latest_test_set_task_64
  title: incident_34_latest_test_set_task_64
  description: 'According to the alert stating that an uncommon file was created and added to a Run Key, what IP address is
    associated with this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on July 4 2024, we observed that a PowerShell process (PID 8604) executed a
      long, obfuscated command to drop a file named "winatp-intro-backdoor.exe" onto an endpoint’s desktop and schedule it
      for execution via the task ‘yrei’. This behaviour triggered the alert titled “Powershell dropped a suspicious file on
      the machine”. Just seconds earlier, the same host generated another alert, “An uncommon file was created and added to
      a Run Key”, suggesting that a newly created file was registered for persistence in the Registry—an action often linked
      to adversary attempts to maintain access after reboot.'
    question: 'According to the alert stating that an uncommon file was created and added to a Run Key, what IP address is
      associated with this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: PowerShell dropped and executed a suspicious file on the host with HostName `vnevado-win10e`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An uncommon file was created and added to a Run registry key from the source IP Address 
          `72.5.72.208`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
