tasks:
- task_id: incident_34_latest_test_set_task_37
  title: incident_34_latest_test_set_task_37
  description: 'According to the ''Anomaly detected in ASEP registry'' alert that is connected to the suspicious PowerShell
    activity, what IP address is associated with this registry modification?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation you observed a ''Suspicious PowerShell download or encoded command execution''
      alert. The process `powershell.exe` (PID 8604) was started on 2024-07-04 and used a long, base-64-encoded command that
      ultimately wrote a file named `winatp-intro-backdoor.exe` to the workstation’s desktop and scheduled it to run via `schtasks`.
      This PowerShell activity is linked to another alert that reported an ''Anomaly detected in ASEP registry'', indicating
      a potentially malicious command was registered to run at startup.'
    question: 'According to the ''Anomaly detected in ASEP registry'' alert that is connected to the suspicious PowerShell
      activity, what IP address is associated with this registry modification?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A PowerShell script was executed to download or run encoded content by the user account with 
          AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly afterwards, a process modified an ASEP registry key and referenced the suspicious IP 
          address `72.5.72.208`, indicating a potential persistence mechanism tied to that external host.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
