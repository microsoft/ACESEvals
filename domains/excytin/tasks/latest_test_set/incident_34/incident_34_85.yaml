tasks:
- task_id: incident_34_latest_test_set_task_85
  title: incident_34_latest_test_set_task_85
  description: 'Minutes after the ASEP registry modification, Microsoft Defender raised another alert stating that PowerShell
    had dropped and executed a suspicious file on the machine. What is the exact name of the file that was dropped?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed a connection from the external IP address 72.5.72.208 to one of
      our hosts. Shortly after, that same host generated an alert titled “Anomaly detected in ASEP registry,” indicating a
      suspicious command or file was registered to persist across reboots.'
    question: 'Minutes after the ASEP registry modification, Microsoft Defender raised another alert stating that PowerShell
      had dropped and executed a suspicious file on the machine. What is the exact name of the file that was dropped?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious command was registered in the ASEP registry on host HostName=`vnevado-win10e`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Powershell then dropped and executed a suspicious file Name=`winatp-intro-backdoor.exe` on the 
          machine.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
