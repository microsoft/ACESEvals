tasks:
- task_id: incident_34_latest_test_set_task_40
  title: incident_34_latest_test_set_task_40
  description: 'According to the "Anomaly detected in ASEP registry" alert linked to this incident, what is the external IP
    address that was involved?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a suspicious PowerShell activity ("powershell.exe" was launched from the
      file rs4_winatp-intro-invoice.docm) on 2024-07-04, analysts observed that the script tried to download and run a payload
      named "winatp-intro-backdoor.exe" and even scheduled a task called "yrei" for persistence. This behaviour triggered
      the alert titled "Suspicious PowerShell download or encoded command execution". A few seconds earlier, another alert—"Anomaly
      detected in ASEP registry"—was raised, indicating that a process had registered a suspicious command in the Auto-Start
      Extensibility Point (ASEP) registry to maintain persistence after reboot. That registry-related alert is linked to the
      same activity chain and references a single external IP address used by the attacker.'
    question: 'According to the "Anomaly detected in ASEP registry" alert linked to this incident, what is the external IP
      address that was involved?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A PowerShell command executed by user with AadUserId `16320fec-8d90-403b-b7fe-78f715d4728d` 
          attempted to download a file or run an encoded script.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly before, an anomaly was detected where a process associated with IP address `72.5.72.208` 
          registered a suspicious command in the ASEP registry, ensuring it persists after reboot.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
