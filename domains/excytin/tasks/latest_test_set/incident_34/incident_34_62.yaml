tasks:
- task_id: incident_34_latest_test_set_task_62
  title: incident_34_latest_test_set_task_62
  description: 'According to the "Anomaly detected in ASEP registry" alert that occurred at 22:35:01 UTC, which user account
    name was responsible for registering the suspicious command or file?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at 22:35:02 UTC, the host vnevado-win10e (device ID 02b8f519-1123-4228-b32a-ccb78af3449f)
      generated an alert: “An uncommon file was created and added to a Run Key.” The process winatp-intro-backdoor.exe (PID
      10208) executed a command that added itself to the HKCU\Software\Microsoft\Windows\CurrentVersion\RunOnce registry path,
      ensuring persistence after reboot. This action was performed under an account identified only by SID S-1-5-21-1870156660-7534030218-135086563-1193.
      In a closely-timed related alert, security telemetry flagged an “Anomaly detected in ASEP registry,” indicating another
      suspicious autorun entry on the same machine.'
    question: 'According to the "Anomaly detected in ASEP registry" alert that occurred at 22:35:01 UTC, which user account
      name was responsible for registering the suspicious command or file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An anomaly was detected in the ASEP registry by the account Name `samuelf`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, an uncommon file was created and added to a Run Key on the host HostName 
          `vnevado-win10e`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
