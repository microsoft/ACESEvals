tasks:
- task_id: incident_34_latest_test_set_task_73
  title: incident_34_latest_test_set_task_73
  description: 'What is the Security Identifier (SID) of the account associated with the "Suspicious LDAP query" alert that
    occurred right after the malicious PowerShell activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious PowerShell execution observed on 2024-07-04 at 22:35:01 UTC,
      a script created and scheduled a file called "winatp-intro-backdoor.exe" via schtasks on the same host. This early indicator
      suggests an attacker may have been staging persistence. Immediately after this PowerShell activity, another alert was
      raised for a "Suspicious LDAP query," which is commonly used by attackers for domain reconnaissance. The security team
      needs to tie these two alerts together to understand which user account performed the LDAP query.'
    question: 'What is the Security Identifier (SID) of the account associated with the "Suspicious LDAP query" alert that
      occurred right after the malicious PowerShell activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Account Name `samuelf` executed a suspicious PowerShell command on 2024-07-04 22:35:01 UTC, 
          suggesting possible in-memory payload execution or system reconnaissance.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Account SID `S-1-5-21-1870156660-7534030218-135086563-1193` carried out a suspicious LDAP query one
          second later (2024-07-04 22:35:02 UTC), indicating potential directory reconnaissance activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
