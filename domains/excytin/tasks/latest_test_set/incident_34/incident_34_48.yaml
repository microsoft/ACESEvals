tasks:
- task_id: incident_34_latest_test_set_task_48
  title: incident_34_latest_test_set_task_48
  description: 'What is the exact file name of the executable that was ultimately identified as the backdoor connected to
    this sequence of events?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious PowerShell command line executed on host "vnevado-win10e"
      (Device ID 02b8f519-1123-4228-b32a-ccb78af3449f) by user "samuelf" (AAD user ID 16320fec-8d90-403b-b7fe-78f715d4728d),
      several related processes were observed, including "winword.exe" launching a macro-enabled document and a scheduled
      task started with "schtasks.exe /run /tn yrei". Analysts now suspect that these activities eventually dropped and executed
      a dedicated backdoor on the same endpoint.'
    question: 'What is the exact file name of the executable that was ultimately identified as the backdoor connected to this
      sequence of events?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious PowerShell command was observed, extracting or executing the file with 
          ExtractedFileName `winatp-intro-backdoor.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
