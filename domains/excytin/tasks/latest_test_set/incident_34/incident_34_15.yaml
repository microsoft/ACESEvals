tasks:
- task_id: incident_34_latest_test_set_task_15
  title: incident_34_latest_test_set_task_15
  description: 'According to the “Suspicious process executed PowerShell command” alert, what was the Process ID of the process
    that launched the PowerShell payload?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 an alert reported that an uncommon executable (winatp-intro-backdoor.exe) was written
      to disk and registered in the HKCU RunOnce key. This change was made from IP address 72.5.72.208 by a process whose
      command line showed it adding the registry entry so the file would run after reboot. Just seconds earlier on the same
      host, Microsoft Defender also raised an alert that a suspicious process had executed an extensive, Base-64-heavy PowerShell
      command—likely a staging action for the backdoor that had just been installed.'
    question: 'According to the “Suspicious process executed PowerShell command” alert, what was the Process ID of the process
      that launched the PowerShell payload?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '8604'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '8604'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Alert 1 shows that an uncommon file was created and added to a Run Key by the account Name 
          `samuelf`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Alert 2 reveals the suspicious PowerShell execution: ProcessId `8604`, CreatedTimeUtc `2024-06-26T12:00:39.2886108Z`,
          CommandLine beginning with `"powershell.exe" -w movedn -exec bypass -command ...`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
