tasks:
- task_id: incident_34_latest_test_set_task_8
  title: incident_34_latest_test_set_task_8
  description: 'What is the Azure AD Device ID of the host vnevado-win10e.vnevado.alpineskihouse.co on which the manual Automated
    Investigation was started?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we noted that account ''samuelf'' executed a PowerShell command to drop and
      schedule the malicious file ''winatp-intro-backdoor.exe''. Shortly after, the security platform reported that user u141
      (u141@ash.alpineskihouse.co) manually triggered an Automated Investigation on the workstation vnevado-win10e.vnevado.alpineskihouse.co
      in response to the anomalous scheduled task that had been created.'
    question: 'What is the Azure AD Device ID of the host vnevado-win10e.vnevado.alpineskihouse.co on which the manual Automated
      Investigation was started?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '02b8f519-1123-4228-b32a-ccb78af3449f'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '02b8f519-1123-4228-b32a-ccb78af3449f'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An anomalous scheduled task was created on the host with HostName `vnevado-win10e`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: User `u141` manually initiated an automated investigation on the device with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
