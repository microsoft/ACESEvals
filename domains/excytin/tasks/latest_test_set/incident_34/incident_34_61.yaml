tasks:
- task_id: incident_34_latest_test_set_task_61
  title: incident_34_latest_test_set_task_61
  description: 'According to the "Suspicious PowerShell download or encoded command execution" alert that occurred moments
    after the manual investigation began, which user account was associated with the suspicious PowerShell activity on host
    vnevado-win10e?'
  inherit_shared: true
  initial_context:
    incident_context: 'An automated investigation was manually initiated on host vnevado-win10e (AadDeviceId 02b8f519-1123-4228-b32a-ccb78af3449f)
      by user u141 (u141@ash.alpineskihouse.co). Just seconds later, the same device generated a new alert titled "Suspicious
      PowerShell download or encoded command execution," indicating that PowerShell was used to download a file or run an
      encoded command—behavior commonly associated with attacker activity.'
    question: 'According to the "Suspicious PowerShell download or encoded command execution" alert that occurred moments
      after the manual investigation began, which user account was associated with the suspicious PowerShell activity on host
      vnevado-win10e?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An automated investigation was manually started on the host with AadDeviceId 
          `02b8f519-1123-4228-b32a-ccb78af3449f`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Soon after, the account with Name `samuelf` executed a suspicious PowerShell download or encoded 
          command.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
