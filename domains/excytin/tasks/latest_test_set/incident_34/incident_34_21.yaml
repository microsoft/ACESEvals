tasks:
- task_id: incident_34_latest_test_set_task_21
  title: incident_34_latest_test_set_task_21
  description: 'A subsequent alert in this incident flagged a process that executed a PowerShell command to download a file
    or run an encoded script. What was the name of the executable process involved in that PowerShell-related alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into an alert titled "Anomaly detected in ASEP registry", we observed that
      a process with ID 10208 executed the command `reg add hkcu\software\microsoft\windows\currentversion\runonce /f /v yrei
      /t reg_expand_sz /d %userprofile%\desktop\winatp-intro-backdoor.exe` from IP address 72.5.72.208. This behavior indicates
      an attempt to persist a malicious executable so it runs on the next reboot.'
    question: 'A subsequent alert in this incident flagged a process that executed a PowerShell command to download a file
      or run an encoded script. What was the name of the executable process involved in that PowerShell-related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'An alert indicated that an account (Sid: `S-1-5-21-1870156660-7534030218-135086563-1193`) created or
          modified an ASEP registry key to establish persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, a process (ExtractedFileName: `powershell.exe`) was observed executing a suspicious download
          or encoded command, likely leveraging that persistence.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
