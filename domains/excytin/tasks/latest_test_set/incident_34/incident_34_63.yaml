tasks:
- task_id: incident_34_latest_test_set_task_63
  title: incident_34_latest_test_set_task_63
  description: 'What is the name of the executable that the suspicious PowerShell script drops to disk and schedules for execution,
    as identified in the ''Suspicious PowerShell command line'' alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'While investigating a "Suspicious Task Scheduler activity" on host "vnevado-win10e", security analysts
      noted that the user account "samuelf" leveraged "powershell.exe" together with "schtasks.exe" to create and immediately
      run a task named "yrei". The PowerShell script, launched via an encoded command, reconstructs a binary from Base64,
      writes it to the user’s Desktop, and schedules the task to execute that binary. A subsequent alert titled "Suspicious
      PowerShell command line" was raised for the same timeframe and machine, indicating the drop-and-execute behavior of
      this payload.'
    question: 'What is the name of the executable that the suspicious PowerShell script drops to disk and schedules for execution,
      as identified in the ''Suspicious PowerShell command line'' alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious Task Scheduler activity was initiated by account Name `samuelf`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious PowerShell command line executed the file Name `winatp-intro-backdoor.exe`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
