tasks:
- task_id: incident_34_latest_test_set_task_17
  title: incident_34_latest_test_set_task_17
  description: 'What is the exact name of the executable file that PowerShell downloaded and executed during this suspicious
    activity on host "vnevado-win10e"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an alert titled "Powershell dropped a suspicious file on the machine" was
      raised on 2024-07-04. The event involved the process "powershell.exe" executed by user account "samuelf" (SID S-1-5-21-1870156660-7534030218-135086563-1193)
      on the Windows 10 host "vnevado-win10e" (AAD device ID 02b8f519-1123-4228-b32a-ccb78af3449f). According to the alert,
      PowerShell downloaded and immediately ran a potentially malicious executable, but the alert summary does not list the
      file’s name.'
    question: 'What is the exact name of the executable file that PowerShell downloaded and executed during this suspicious
      activity on host "vnevado-win10e"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: 'Powershell dropped a suspicious file on the machine (Field: Name, Value: `winatp-intro-backdoor.exe`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
