tasks:
- task_id: incident_34_latest_test_set_task_59
  title: incident_34_latest_test_set_task_59
  description: 'According to the “Suspicious PowerShell command line” alert raised at 22:35:01 UTC, what is the name of the
    file that was involved in this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation you found that on 2024-07-04 at 22:35:02 UTC a system communicating with the
      external IP address 72.5.72.208 created an uncommon file and registered it in a Windows Run registry key – a typical
      persistence technique. One second earlier, the same endpoint triggered a “Suspicious PowerShell command line” alert,
      indicating that PowerShell had likely been abused to fetch or execute a payload in-memory.'
    question: 'According to the “Suspicious PowerShell command line” alert raised at 22:35:01 UTC, what is the name of the
      file that was involved in this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Alert shows an uncommon file was created and added to a Run Key on the host with HostName 
          `vnevado-win10e`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Another alert reveals a suspicious PowerShell command line that referenced the file with Name 
          `winatp-intro-backdoor.exe`, indicating the malicious payload in use.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
