tasks:
- task_id: incident_34_latest_test_set_task_38
  title: incident_34_latest_test_set_task_38
  description: 'Which external IP address is referenced in the alert that reports the creation of an uncommon file added to
    a Run Key immediately after the malicious PowerShell activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a suspicious PowerShell activity on 2024-07-04, analysts observed a process
      (`powershell.exe`, PID 8604) that executed a long, base-64-encoded command. The script rebuilt a payload named `winatp-intro-backdoor.exe`,
      saved it to the Desktop, registered it with `schtasks`, and modified a Run-type registry location to ensure execution
      after reboot. Just a fraction of a second later, a second alert was raised: “An uncommon file was created and added
      to a Run Key,” indicating possible persistence establishment by the attacker. This follow-up alert is linked to the
      same activity chain and includes network information about an external system contacted during the event.'
    question: 'Which external IP address is referenced in the alert that reports the creation of an uncommon file added to
      a Run Key immediately after the malicious PowerShell activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account Name `samuelf` executed a suspicious PowerShell command that attempted to download a 
          file or run encoded content.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The IP Address `72.5.72.208` is associated with the creation of an uncommon file that was added to 
          a Run registry key for persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
