tasks:
- task_id: incident_34_latest_test_set_task_54
  title: incident_34_latest_test_set_task_54
  description: 'According to the alert that reports the creation of the anomalous scheduled task, what is the username of
    the account that created the task?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation you observed a process starting Task Scheduler with the command line "schtasks.exe
      /run /tn yrei" (Process ID 1616, created 2024-06-26T12:00:40Z). This action triggered the alert "Suspicious Task Scheduler
      activity" indicating a potential attempt to establish persistence. Pivoting from that alert revealed another alert titled
      "An anomalous scheduled task was created," suggesting a user account was responsible for creating the suspicious task.'
    question: 'According to the alert that reports the creation of the anomalous scheduled task, what is the username of the
      account that created the task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A process with ExtractedFileName `winatp-intro-backdoor.exe` was used through Task Scheduler, 
          suggesting attempted persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, an anomalous scheduled task was created by the account with Name `samuelf`, 
          indicating possible attacker-controlled persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
