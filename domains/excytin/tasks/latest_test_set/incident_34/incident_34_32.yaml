tasks:
- task_id: incident_34_latest_test_set_task_32
  title: incident_34_latest_test_set_task_32
  description: 'What is the name of the file that PowerShell dropped and executed on the machine following the LDAP reconnaissance
    activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed a process "winword.exe" executing a document macro (rs4_winatp-intro-invoice.docm).
      Immediately after this suspicious LDAP query was generated, Microsoft Defender recorded that PowerShell dropped and
      executed a suspicious file on the same machine.'
    question: 'What is the name of the file that PowerShell dropped and executed on the machine following the LDAP reconnaissance
      activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:02.608830+00:00 a suspicious LDAP query was run, performed under the account 
          with Sid `S-1-5-21-1870156660-7534030218-135086563-1193`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Seconds later, at 2024-07-04 22:35:03.736539+00:00, PowerShell dropped and executed the suspicious 
          file `winatp-intro-backdoor.exe` on the machine.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
