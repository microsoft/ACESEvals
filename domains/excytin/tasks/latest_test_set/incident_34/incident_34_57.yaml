tasks:
- task_id: incident_34_latest_test_set_task_57
  title: incident_34_latest_test_set_task_57
  description: 'According to the alert titled "Suspicious process executed PowerShell command" raised at 2024-07-04 22:35:00
    UTC, what is the Security Identifier (SID) of the account that ran the PowerShell command?'
  inherit_shared: true
  initial_context:
    incident_context: 'Microsoft security monitoring flagged that the process "winword.exe" (PID 9780) launched the document
      "rs4_winatp-intro-invoice.docm" on 2024-07-04 22:35:04 UTC and then invoked PowerShell to download or run an encoded
      command. Because attackers often use such techniques to execute malicious payloads in memory, the incident is being
      investigated. A related alert fired only a few seconds earlier states that a suspicious process executed a PowerShell
      command, and analysts need to determine which user account (identified by its SID) was responsible for that execution.'
    question: 'According to the alert titled "Suspicious process executed PowerShell command" raised at 2024-07-04 22:35:00
      UTC, what is the Security Identifier (SID) of the account that ran the PowerShell command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1870156660-7534030218-135086563-1193'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1870156660-7534030218-135086563-1193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:00.698474+00:00, a suspicious process executed a PowerShell command under the 
          user account with Sid `S-1-5-21-1870156660-7534030218-135086563-1193`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A few seconds later, at 2024-07-04 22:35:04.145779+00:00, the same user account with Sid 
          `S-1-5-21-1870156660-7534030218-135086563-1193` executed PowerShell to download a file or run an encoded 
          command.
  scoring_aggregation:
    max:
