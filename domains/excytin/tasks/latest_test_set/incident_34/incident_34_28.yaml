tasks:
- task_id: incident_34_latest_test_set_task_28
  title: incident_34_latest_test_set_task_28
  description: 'Which user account was associated with the alert indicating that an uncommon file was created and added to
    a Run Key on host vnevado-win10e?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host vnevado-win10e (device ID 02b8f519-1123-4228-b32a-ccb78af3449f), we
      observed the process winatp-intro-backdoor.exe (PID 10208) adding a persistence entry to the RunOnce registry path.
      This action triggered the alert “Anomaly detected in ASEP registry”, indicating that a potentially malicious program
      may execute automatically after reboot. Immediately afterward, a second alert titled “An uncommon file was created and
      added to a Run Key” was raised for the same machine, signaling that a suspicious file had been written to disk and registered
      for automatic startup.'
    question: 'Which user account was associated with the alert indicating that an uncommon file was created and added to
      a Run Key on host vnevado-win10e?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Account (Name: samuelf) triggered an alert for an anomaly detected in the ASEP registry where a suspicious
          command or file was registered for persistence.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Account (Name: samuelf) then created an uncommon file and added it to a Run registry key, further establishing
          persistence on the system.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
