tasks:
- task_id: incident_34_latest_test_set_task_67
  title: incident_34_latest_test_set_task_67
  description: 'According to the alert that flagged the suspicious PowerShell command execution, which user account triggered
    the command?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation, we observed that the executable "schtasks.exe" was used to create an anomalous
      scheduled task on one of the devices—an activity often associated with attackers attempting to gain persistence. Pivoting
      from this event, telemetry shows that only seconds earlier a related alert was triggered indicating a suspicious process
      had run a PowerShell command on the same host. We need to identify the user behind that PowerShell activity.'
    question: 'According to the alert that flagged the suspicious PowerShell command execution, which user account triggered
      the command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04T22:35:01.260626Z, an anomalous scheduled task was created under account Sid 
          `S-1-5-21-1870156660-7534030218-135086563-1193`, indicating a possible attempt to gain persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: One second earlier, at 2024-07-04T22:35:00.698474Z, the account Name `samuelf` executed a 
          suspicious PowerShell command, showing potential malicious activity and linking the user to the persistence 
          mechanism.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
