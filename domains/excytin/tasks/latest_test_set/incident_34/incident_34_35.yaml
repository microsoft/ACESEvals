tasks:
- task_id: incident_34_latest_test_set_task_35
  title: incident_34_latest_test_set_task_35
  description: 'According to the alert about the suspicious process that executed a PowerShell command, which user account
    was responsible for running that command?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that on 2024-07-04 at 22:35:03 UTC, PowerShell dropped and ran
      a suspicious file named "winatp-intro-backdoor.exe" on one of the hosts. This behavior can indicate an attempt by an
      attacker to execute malicious payloads in memory while avoiding detection. Shortly before this event, a separate alert
      reported that a suspicious process had executed a PowerShell command, suggesting a possible link between the two activities.'
    question: 'According to the alert about the suspicious process that executed a PowerShell command, which user account
      was responsible for running that command?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'samuelf'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'samuelf'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Process with ProcessId__CreatedTimeUtc__CommandLine 
          `8604__2024-06-26t12:00:39.2886108z__"powershell.exe" -w movedn ...` dropped and ran a suspicious file on the 
          machine.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The PowerShell command was executed by the account with Name `samuelf`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
