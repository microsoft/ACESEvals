tasks:
- task_id: incident_34_latest_test_set_task_55
  title: incident_34_latest_test_set_task_55
  description: 'According to the follow-up alert that reported PowerShell dropping a suspicious executable, what is the exact
    name of the file that was placed on the machine?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024 at 22:35 UTC, an anomalous scheduled task was created on a host via the process "schtasks.exe",
      suggesting that an attacker might be trying to gain persistence. Just a few seconds later in the same incident, a follow-up
      alert indicated that PowerShell deposited and executed a potentially malicious file on the system.'
    question: 'According to the follow-up alert that reported PowerShell dropping a suspicious executable, what is the exact
      name of the file that was placed on the machine?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'winatp-intro-backdoor.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'winatp-intro-backdoor.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Account Name `samuelf` created an anomalous scheduled task, suggesting the attacker established 
          persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: PowerShell subsequently dropped and executed the suspicious file Name `winatp-intro-backdoor.exe`, 
          indicating malicious code execution on the host.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
