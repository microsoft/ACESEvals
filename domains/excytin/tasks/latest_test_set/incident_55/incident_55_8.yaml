tasks:
- task_id: incident_55_latest_test_set_task_8
  title: incident_55_latest_test_set_task_8
  description: 'What is the SID of the account associated with the "ADFS private key extraction attempt" detected at 22:35:02
    UTC on 2024-07-04?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an internal phishing campaign linked to users Nina Sullivan and Lucas Grey,
      several earlier events on 2024-07-04 drew attention. First, a process accessed LSASS memory, suggesting credential theft
      activity; moments later, remote activity was initiated on the same machine. Only seconds after that, an alert titled
      “ADFS private key extraction attempt” was generated, indicating a suspicious LDAP query that could be used to steal
      ADFS private keys or enable lateral movement. Analysts need to understand which account was tied to this final LDAP-based
      extraction attempt.'
    question: 'What is the SID of the account associated with the "ADFS private key extraction attempt" detected at 22:35:02
      UTC on 2024-07-04?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A compromised user began by sending internal phishing emails from the account whose AadUserId is 
          `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Next, an attacker dumped credentials by reading the memory of the process whose ExtractedFileName 
          is `lsass.exe`.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Armed with those credentials, the attacker carried out suspicious remote activity under the account
          whose Sid is `S-2-5-21-571436798-3864380397-1837441745-3206`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Finally, the same account (Sid `S-2-5-21-571436798-3864380397-1837441745-3206`) attempted to 
          extract ADFS private keys, completing the attack path.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
