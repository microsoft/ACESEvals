tasks:
- task_id: incident_55_latest_test_set_task_79
  title: incident_55_latest_test_set_task_79
  description: 'A few days after the credential addition, a suspected DCSync attack was detected. To which host did Luciano
    Herrera’s client send the replication request?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an incident, we observed that the user Luciano Herrera (pwilson@niseko.alpineskihouse.co)
      added a new password-type credential to an OAuth application called "SimulandApp" that is linked to the Office 365 tenant
      (App ID 11161, OAuth App ID 4d9476b8-6ae6-459b-a273-5837c15b5981). The activity originated from the external IP address
      36.193.21.220 and was flagged as an unusual addition of credentials to an OAuth app, suggesting the application might
      have been compromised.'
    question: 'A few days after the credential addition, a suspected DCSync attack was detected. To which host did Luciano
      Herrera’s client send the replication request?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Name: Luciano Herrera added a new Password credential to the OAuth application SimulandApp on 2024-07-07
          09:54:21.810789+00:00, an unusual action that could indicate compromise.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'HostName: MB-DC1 was the target of a suspected DCSync replication request initiated on 2024-07-10 11:24:45.469423+00:00,
          likely leveraging the prior credential addition performed by Luciano Herrera.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
