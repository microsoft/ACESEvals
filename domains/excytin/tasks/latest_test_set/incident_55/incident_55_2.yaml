tasks:
- task_id: incident_55_latest_test_set_task_2
  title: incident_55_latest_test_set_task_2
  description: 'In a later related alert about a suspicious sequence of exploration activities, which executable was run by
    the process involved in that activity on the same host?'
  inherit_shared: true
  initial_context:
    incident_context: 'User gsmith@niseko.alpineskihouse.co was observed creating a suspicious service named DDLOXJDSQSNGMUKKFUXQ
      on host MB-ADFS. This activity may indicate an attempt to execute malicious commands on the system.'
    question: 'In a later related alert about a suspicious sequence of exploration activities, which executable was run by
      the process involved in that activity on the same host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'whoami.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'whoami.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Account (Sid: S-2-5-21-571436798-3864380397-1837441745-3206) created the suspicious service “DDLOXJDSQSNGMUKKFUXQ”
          on host MB-ADFS.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Process (ProcessId__CreatedTimeUtc__CommandLine: 3468__2024-07-04t00:00:02.3476619z__"whoami.exe") was
          executed, showing reconnaissance activity on the machine.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
