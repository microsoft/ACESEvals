tasks:
- task_id: incident_55_latest_test_set_task_38
  title: incident_55_latest_test_set_task_38
  description: 'According to the suspected DCSync attack alert, which account (user name) initiated the directory-replication
    request to MB-DC1?'
  inherit_shared: true
  initial_context:
    incident_context: 'You are investigating an incident that began with an internal phishing campaign observed on 2024-07-07.
      Phishing emails were sent from a compromised device by user accounts such as “Nina Sullivan” and “Lucas Grey,” and the
      message included the URL http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/.  The same compromised
      session later showed evidence of a suspicious system-hardware discovery attempt.  A few days afterward, another alert
      was raised for a suspected DCSync attack in which an unknown user on host MB-WINCLIENT issued a single directory-replication
      request to domain controller MB-DC1.'
    question: 'According to the suspected DCSync attack alert, which account (user name) initiated the directory-replication
      request to MB-DC1?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-04, the account with field AadUserId value `2de70991-2799-4a95-b734-8e3df3a50118` 
          carried out Suspicious System Hardware Discovery.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-07, the account with field AadUserId value `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` 
          launched an Internal Phishing Campaign.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: On 2024-07-10, the account with field Name value `Luciano Herrera` performed a suspected DCSync 
          attack, indicating the final malicious activity in this sequence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
