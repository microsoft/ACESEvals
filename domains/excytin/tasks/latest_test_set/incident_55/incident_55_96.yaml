tasks:
- task_id: incident_55_latest_test_set_task_96
  title: incident_55_latest_test_set_task_96
  description: 'Which user account was identified in the alert titled "Attempt to hide use of dual-purpose tool" that occurred
    on 2024-07-04 22:35:01 UTC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed a suspicious service registration on 2024-07-04. In this event,
      the executable "services.exe" (Process ID 764, created at 2024-06-20T08:30:13Z) was registered as a Windows service,
      a technique often used to gain persistence or elevated privileges. Shortly before this service registration, another
      alert was triggered indicating that a well-known dual-purpose tool was executed from an unexpected filename—suggesting
      an attempt to conceal malicious activity.'
    question: 'Which user account was identified in the alert titled "Attempt to hide use of dual-purpose tool" that occurred
      on 2024-07-04 22:35:01 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious service registration was detected on the host (Field: HostName, Value: `mb-adfs`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A dual-purpose tool was hidden by the account (Field: Name, Value: `gsmith`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
