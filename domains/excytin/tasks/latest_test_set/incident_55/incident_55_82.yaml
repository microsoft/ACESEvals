tasks:
- task_id: incident_55_latest_test_set_task_82
  title: incident_55_latest_test_set_task_82
  description: 'A follow-up alert fired just two seconds later, titled “Suspicious access to LSASS service”. Which DLL file
    does this alert identify as being accessed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During triage you observe that at 22:35:00 UTC on 4 July 2024 a “Suspicious System Hardware Discovery”
      alert was raised. The activity stemmed from the host process “svchost.exe -k netsvcs -p -s winmgmt”, executed under
      the user account “pwilson”. Shortly after, another process launched a PowerShell script (contosoadfsblatempcreds.ps1)
      from “powershell.exe”. These events may indicate an attacker gathering information in preparation for credential theft.'
    question: 'A follow-up alert fired just two seconds later, titled “Suspicious access to LSASS service”. Which DLL file
      does this alert identify as being accessed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'hid.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'hid.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious system hardware discovery was carried out by the account Name `bjenkins`, indicating 
          reconnaissance activity on the device.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Soon after, LSASS was accessed suspiciously with the file Name `hid.dll`, suggesting a potential 
          attempt to dump credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
