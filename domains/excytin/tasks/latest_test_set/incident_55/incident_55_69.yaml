tasks:
- task_id: incident_55_latest_test_set_task_69
  title: incident_55_latest_test_set_task_69
  description: 'According to the "ADFS private key extraction attempt" alert that followed, what is the SID of the account
    that initiated the suspicious LDAP query?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024 at 22:35 UTC, Microsoft Defender detected a "System executable renamed and launched"
      event. In this alert, a renamed system executable (powershell.exe launched via an encoded command, running under the
      SYSTEM account with SID S-2-2-78) was observed. Less than two seconds later, another alert indicated an attempted extraction
      of Active Directory Federation Services (ADFS) private keys using a suspicious LDAP query—suggesting a potential lateral-movement
      or credential-theft activity stemming from the same sequence of events.'
    question: 'According to the "ADFS private key extraction attempt" alert that followed, what is the SID of the account
      that initiated the suspicious LDAP query?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A renamed system executable was launched with ExtractedFileName `iy2orr1e.rrg.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An ADFS private-key extraction attempt was performed by the account with Sid 
          `S-2-5-21-571436798-3864380397-1837441745-3206`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
