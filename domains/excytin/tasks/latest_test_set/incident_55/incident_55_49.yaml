tasks:
- task_id: incident_55_latest_test_set_task_49
  title: incident_55_latest_test_set_task_49
  description: 'What is the Security Identifier (SID) of the account involved in the "System executable renamed and launched"
    alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a recent alert on host "mb-winclient", we observed a process-injection
      event in which the script "contosoadfsblatempcreds.ps1" was executed by PowerShell (process ID 13968) under the user
      account "bjenkins". The injection indicates that malicious code may have been placed inside another process to hide
      its activity. Immediately after this event, a second alert titled "System executable renamed and launched" was triggered,
      suggesting that an attacker renamed and ran a legitimate Windows executable to evade detection. Analysts need to identify
      which user context was associated with this suspicious launch.'
    question: 'What is the Security Identifier (SID) of the account involved in the "System executable renamed and launched"
      alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-2-78'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-2-78'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Process alert: The target process with ExtractedFileName `powershell.exe` was injected with potentially
          malicious code at 2024-07-04 22:35:02.726557+00:00.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Account alert: Moments before, a renamed system executable was launched by the user account with Sid
          `S-2-2-78`, indicating that this account is likely responsible for the injection activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
