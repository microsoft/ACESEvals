tasks:
- task_id: incident_55_latest_test_set_task_83
  title: incident_55_latest_test_set_task_83
  description: 'Which user account (provide the full display name) was reported as adding the suspicious password credential
    to the OAuth application "SimulandApp"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into an internal phishing campaign, two corporate users – Nina Sullivan and
      Lucas Grey – were identified as having sent malicious email from a compromised device that also contacted the URL http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/.
      A few days later, security telemetry flagged a separate alert describing an unusual addition of a password-type credential
      to a registered OAuth application named “SimulandApp.” According to the alert, this action was performed by a single
      user account, suggesting that the threat actor may have pivoted and is now abusing cloud identity infrastructure.'
    question: 'Which user account (provide the full display name) was reported as adding the suspicious password credential
      to the OAuth application "SimulandApp"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` was observed sending 
          internal-phishing emails (Internal phishing campaign detected on 2024-07-07).
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Later, the account identified by Sid `S-1-5-21-551436448-9871687716-9837441745-1903` executed a 
          suspicious sequence of Windows exploration commands on 2024-07-04, indicating possible lateral-movement 
          preparation.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, on 2024-07-10 the user `Luciano Herrera` (field Name, value `Luciano Herrera`) added a 
          password-type credential to the OAuth application “SimulandApp,” an unusual action that could enable further 
          compromise.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
