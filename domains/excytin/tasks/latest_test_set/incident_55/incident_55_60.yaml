tasks:
- task_id: incident_55_latest_test_set_task_60
  title: incident_55_latest_test_set_task_60
  description: 'For the "Attempt to hide use of dual-purpose tool" alert that concludes this series of events, what is the
    SID of the account associated with that alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'While investigating a "Sensitive credential memory read" alert on host "mb-winclient", we observed
      that account "bjenkins" (SID S-1-5-21-561436748-3867387497-1732241745-3701) launched a PowerShell session from IP 72.5.72.208
      and accessed lsass.exe. This activity was immediately followed by a "Suspicious remote activity" alert on the same machine,
      and then an "Attempt to hide use of dual-purpose tool" alert, indicating an attacker may have renamed a legitimate tool
      to avoid detection.'
    question: 'For the "Attempt to hide use of dual-purpose tool" alert that concludes this series of events, what is the
      SID of the account associated with that alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A process scanned the memory of `lsass.exe` (ExtractedFileName = lsass.exe), potentially to harvest
          credentials.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Suspicious remote activity originated from the host `mb-adfs` (HostName = mb-adfs).
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: An account with SID `S-2-5-21-571436798-3864380397-1837441745-3206` (Sid = 
          S-2-5-21-571436798-3864380397-1837441745-3206) tried to disguise the use of a dual-purpose tool.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
