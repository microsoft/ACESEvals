tasks:
- task_id: incident_55_latest_test_set_task_45
  title: incident_55_latest_test_set_task_45
  description: 'What is the full URL that was identified as malicious in the "A potentially malicious URL click was detected"
    alert on 2024-07-10?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of suspicious activity on host "mb-adfs", the account "gsmith" (AadUserId ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5)
      executed a renamed Windows executable (iy2orr1e.rrg.exe) using a hidden, encoded PowerShell command. This triggered
      the alert "ADFS private key extraction attempt" on 2024-07-04. Several related alerts followed, ultimately leading to
      an alert issued on 2024-07-10 indicating that a user had clicked a potentially malicious link.'
    question: 'What is the full URL that was identified as malicious in the "A potentially malicious URL click was detected"
      alert on 2024-07-10?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A malicious process was spawned with the entity field 'ProcessId__CreatedTimeUtc__CommandLine' and 
          value '3116__2024-07-02t09:48:23.9439954z__"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand 
          qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=',
          indicating an ADFS private-key extraction attempt.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Soon after, a renamed system executable with the entity field 'ExtractedFileName' and value 
          'powershell.exe' was launched, suggesting the attacker used a masqueraded PowerShell binary to continue 
          execution.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: The exploration activity was executed under the account with the entity field 'AadUserId' and value
          'a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0', showing which user context the attacker leveraged.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: The sequence culminated in the user clicking a malicious link with the entity field 'Url' and value
          'http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/', confirming delivery of the attack 
          via a harmful URL.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
