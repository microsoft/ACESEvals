tasks:
- task_id: incident_55_latest_test_set_task_43
  title: incident_55_latest_test_set_task_43
  description: 'According to the correlated alert about the attempt to conceal a dual-purpose tool, what is the hostname of
    the device on which this renamed tool was observed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation we observed that the user gsmith@niseko.alpineskihouse.co accessed the AD
      FS Data Protection (DKM) key on 2024-07-10, triggering the alert “Suspected AD FS DKM key read.” Correlation with earlier
      activity shows another alert titled “Attempt to hide use of dual-purpose tool,” which indicates that a well-known public
      tool was renamed and executed on a particular server to evade detection. Knowing which machine was involved is critical
      for scoping the incident and determining possible lateral movement paths.'
    question: 'According to the correlated alert about the attempt to conceal a dual-purpose tool, what is the hostname of
      the device on which this renamed tool was observed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mb-adfs'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mb-adfs'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On 2024-07-04, the host (Field: HostName, Value: `mb-adfs`) ran a known dual-purpose tool under an unexpected
          filename, likely attempting to hide the tool’s use.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'On 2024-07-10, the account (Field: AadUserId, Value: `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`) read the
          AD FS DKM key for object ID 4cac49d3-29d3-407e-8c9b-b7ebb21541b2, indicating suspicious access.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
