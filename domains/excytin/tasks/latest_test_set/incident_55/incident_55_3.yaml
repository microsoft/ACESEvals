tasks:
- task_id: incident_55_latest_test_set_task_3
  title: incident_55_latest_test_set_task_3
  description: 'During the follow-up alert on 2024-07-06 titled "Attempt to hide use of dual-purpose tool", which user account
    was reported as being involved in this activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04, the SOC detected a "Suspicious Task Scheduler activity" alert. Investigation showed
      that powershell.exe executed a base-64 encoded command and immediately invoked schtasks.exe to create and run a scheduled
      task named "run-exportadfstokensignincert.2024-07-02_09_48_23", likely in an attempt to gain persistence.'
    question: 'During the follow-up alert on 2024-07-06 titled "Attempt to hide use of dual-purpose tool", which user account
      was reported as being involved in this activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious Task Scheduler activity was detected that involved the process with ExtractedFileName 
          `iy2orr1e.rrg.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, an attempt to hide a dual-purpose tool was observed and attributed to the account Name 
          `gsmith`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
