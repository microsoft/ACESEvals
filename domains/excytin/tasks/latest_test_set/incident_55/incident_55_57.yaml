tasks:
- task_id: incident_55_latest_test_set_task_57
  title: incident_55_latest_test_set_task_57
  description: 'What is the Azure AD user ID (AadUserId) associated with the account that triggered the "Sensitive credential
    memory read" alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a suspected reconnaissance attempt, we observed the user account "pwilson"
      (SID: S-1-5-21-551436448-9871687716-9837441745-1903, Azure AD user ID 2de70991-2799-4a95-b734-8e3df3a50118) running
      the PowerShell script "ldaprequest.ps1" on 2024-07-04 at 22:35:03 UTC, which triggered the alert "Suspicious LDAP query."
      Just moments later, another alert titled "Sensitive credential memory read" signaled that a process had accessed LSASS
      memory on the same device, suggesting a rapid follow-up attack step by a (possibly different) user.'
    question: 'What is the Azure AD user ID (AadUserId) associated with the account that triggered the "Sensitive credential
      memory read" alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:03.848291+00:00, a Suspicious LDAP query was executed from host with 
          AadDeviceId `7661dfd4-218f-4016-8a87-66d68a7f098e`, indicating reconnaissance activity against the domain.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Just seconds later, at 2024-07-04 22:35:04.120690+00:00, an attacker using account with AadUserId 
          `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` performed a Sensitive credential memory read on lsass.exe, likely 
          leveraging information gained from the earlier LDAP query to dump credentials.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
