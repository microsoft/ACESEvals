tasks:
- task_id: incident_55_latest_test_set_task_19
  title: incident_55_latest_test_set_task_19
  description: 'According to the alert about the emails that were removed after delivery, what is the Sender IP address from
    which those malicious messages originated?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that the user account "gsmith" (AadUserId ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5)
      initiated a suspicious sequence of exploration activities on host "mb-adfs" using the file "iy2orr1e.rrg.exe", together
      with commands such as "whoami.exe" and an encoded PowerShell payload. Shortly after, the same user attempted to access
      the LSASS service—behavior often associated with credential theft. Several days later, security controls detected and
      removed email messages that had been delivered with a malicious URL.'
    question: 'According to the alert about the emails that were removed after delivery, what is the Sender IP address from
      which those malicious messages originated?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '119.36.50.193'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '119.36.50.193'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious sequence of exploration activities was carried out using the process ExtractedFileName
          `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly before, a suspicious access to the LSASS service was performed by the account AadUserId 
          `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Later, email messages containing a malicious URL that originated from the mailmessage SenderIP 
          `119.36.50.193` were detected and removed after delivery.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
