tasks:
- task_id: incident_55_latest_test_set_task_86
  title: incident_55_latest_test_set_task_86
  description: 'According to the alert titled "Email messages containing malicious URL removed after delivery" raised on 2024-07-07,
    what is the primary email address of the mailbox from which the malicious messages were removed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed that user accounts "pwilson" and "bjenkins" executed suspicious
      PowerShell scripts on host "mb-winclient" (device ID 7661dfd4-218f-4016-8a87-66d68a7f098e) on July 4 2024. A few days
      later, an "Internal phishing campaign" alert was raised, and shortly after that, another alert reported that email messages
      containing a malicious URL were removed after delivery. Analysts now need to identify which mailbox was affected by
      this mail-borne threat.'
    question: 'According to the alert titled "Email messages containing malicious URL removed after delivery" raised on 2024-07-07,
      what is the primary email address of the mailbox from which the malicious messages were removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A malicious PowerShell Cmdlet was executed by the account with AadUserId 
          `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` (2024-07-04 22:35:03 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Three days later, the account with Email `Nina Sullivan@vnevado.alpineskihouse.co` launched an 
          internal phishing campaign from the same environment (2024-07-07 10:09:33 UTC).
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Phishing emails containing a malicious URL reached – and were later removed from – the mailbox 
          whose MailboxPrimaryAddress is `santiago@vnevado.alpineskihouse.co` (2024-07-07 08:54:40 UTC).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
