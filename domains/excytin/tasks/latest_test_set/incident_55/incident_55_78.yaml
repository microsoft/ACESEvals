tasks:
- task_id: incident_55_latest_test_set_task_78
  title: incident_55_latest_test_set_task_78
  description: 'According to the alert "Attempt to hide use of dual-purpose tool", under what unexpected filename did the
    attackers run the dual-purpose tool?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of suspicious activity on host "mb-winclient", analysts observed several concerning
      behaviors linked to the user account "bjenkins". First, an alert flagged possible credential harvesting when LSASS was
      accessed, and later execution of Impacket-related commands suggested hands-on-keyboard lateral movement. Shortly after
      these events, another alert was raised indicating that attackers might be trying to disguise a well-known dual-purpose
      tool by renaming its executable.'
    question: 'According to the alert "Attempt to hide use of dual-purpose tool", under what unexpected filename did the attackers
      run the dual-purpose tool?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'iy2orr1e.rrg.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'iy2orr1e.rrg.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A suspicious access to the LSASS service was detected from the process with ExtractedFileName `powershell.exe`
          (Time: 2024-07-04 22:35:02.783154+00:00).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Almost simultaneously, an ongoing hands-on-keyboard attack via the Impacket toolkit was attributed to
          the account with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` (Time: 2024-07-04 22:35:01.395957+00:00).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Later, the attacker tried to conceal activity by executing a dual-purpose tool under a misleading name;
          the process identified by ProcessId__CreatedTimeUtc__CommandLine `5752__2024-07-06t00:00:01.7155092z__"iy2orr1e.rrg.exe"
          -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`
          was observed (Time: 2024-07-06 00:09:58.973357+00:00).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
