tasks:
- task_id: incident_55_latest_test_set_task_25
  title: incident_55_latest_test_set_task_25
  description: 'Which user account (provide the email address) was identified as the creator of the suspicious service "DDLOXJDSQSNGMUKKFUXQ"
    on host MB-ADFS?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024, a hands-on-keyboard attack was detected on host MB-ADFS. The alert indicated that the
      attacker executed the Impacket toolkit through a PowerShell command (powershell.exe) running under the LocalSystem account,
      likely in an attempt to move laterally across the network. Several days later, another alert flagged the creation of
      a new Windows service named "DDLOXJDSQSNGMUKKFUXQ" on the same host, suggesting continued malicious activity.'
    question: 'Which user account (provide the email address) was identified as the creator of the suspicious service "DDLOXJDSQSNGMUKKFUXQ"
      on host MB-ADFS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:01.395957+00:00, a hands-on-keyboard attack via the Impacket toolkit was 
          detected, executed by the account with field AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: At 2024-07-10 11:24:45.488649+00:00, a suspicious service named DDLOXJDSQSNGMUKKFUXQ was created on
          host MB-ADFS by the account with field Email `gsmith@niseko.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
