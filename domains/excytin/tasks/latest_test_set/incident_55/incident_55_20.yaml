tasks:
- task_id: incident_55_latest_test_set_task_20
  title: incident_55_latest_test_set_task_20
  description: 'The investigation shows that only a couple of seconds before this service registration, a related alert titled
    "System executable renamed and launched" was triggered. Which Windows account was used to run that renamed system executable?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at 22:35 UTC, Defender raised a "Suspicious service registration" alert after the binary
      "services.exe" (PID 764, created 2024-06-20 08:30 UTC) was registered as a Windows service on one of our hosts. This
      activity can indicate an attempt to gain persistence or elevated privileges.'
    question: 'The investigation shows that only a couple of seconds before this service registration, a related alert titled
      "System executable renamed and launched" was triggered. Which Windows account was used to run that renamed system executable?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'SYSTEM'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'SYSTEM'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:01.543723+00:00, the account with Name `SYSTEM` launched a Windows executable 
          that had been renamed, indicating potential malicious activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Two seconds later, at 2024-07-04 22:35:03.448593+00:00, a suspicious service was registered on the 
          host with HostName `mb-adfs`, suggesting the attacker may have used the renamed executable to establish 
          persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
