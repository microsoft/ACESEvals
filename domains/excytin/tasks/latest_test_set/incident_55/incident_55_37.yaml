tasks:
- task_id: incident_55_latest_test_set_task_37
  title: incident_55_latest_test_set_task_37
  description: 'According to the follow-up alert that detected a malicious PowerShell Cmdlet on the same machine, which user
    account was responsible for running that Cmdlet?'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent alert flagged a suspicious sequence of exploration activities in which utilities such as "whoami.exe"
      and an encoded PowerShell payload were run in quick succession. These commands suggest an attempt to enumerate system
      information and prepare for further malicious actions.'
    question: 'According to the follow-up alert that detected a malicious PowerShell Cmdlet on the same machine, which user
      account was responsible for running that Cmdlet?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'pwilson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious sequence of exploration activities was executed through the process with 
          ExtractedFileName `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, a malicious PowerShell Cmdlet was invoked by the user account whose Name is 
          `pwilson`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
