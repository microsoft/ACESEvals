tasks:
- task_id: incident_55_latest_test_set_task_51
  title: incident_55_latest_test_set_task_51
  description: 'According to the “Sensitive credential memory read” alert that followed the ADFS private-key extraction attempt,
    what is the SID of the account whose credentials were accessed from LSASS?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04, an alert titled “ADFS private key extraction attempt” was raised for host "mb-adfs"
      after the user account "gsmith" (AadUserId ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5) ran the executable "iy2orr1e.rrg.exe"
      with an encoded PowerShell command. This activity was followed seconds later by another alert indicating an ongoing
      hands-on-keyboard attack using the Impacket toolkit, suggesting the attacker was moving laterally. Shortly after, a
      third alert reported that a process had scanned or dumped LSASS memory, a technique commonly used to harvest credentials.'
    question: 'According to the “Sensitive credential memory read” alert that followed the ADFS private-key extraction attempt,
      what is the SID of the account whose credentials were accessed from LSASS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-561436748-3867387497-1732241745-3701'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-561436748-3867387497-1732241745-3701'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – ADFS private key extraction attempt: The activity was initiated by the Azure AD user account
          with AadUserId `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` (Time: 2024-07-04 22:35:02 UTC).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – Hands-on-keyboard lateral movement: The attacker then leveraged the Impacket toolkit, spawning
          the process with ExtractedFileName `lsass.exe` on a remote host to explore network shares and execute commands (Time:
          2024-07-04 22:35:01 UTC).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – Credential theft: Finally, a Sensitive credential memory read was performed against the Local
          Security Authority Subsystem Service, targeting the account whose Sid is `S-1-5-21-561436748-3867387497-1732241745-3701`,
          indicating potential credential dumping (Time: 2024-07-04 22:35:04 UTC).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
