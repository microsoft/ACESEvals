tasks:
- task_id: incident_55_latest_test_set_task_59
  title: incident_55_latest_test_set_task_59
  description: 'According to the final alert “Attempt to hide use of dual-purpose tool,” what is the Azure AD user ID (AadUserId)
    associated with the account involved in that event?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 10 2024, security monitoring flagged that user Lucas Grey (bjenkins@niseko.alpineskihouse.co)
      clicked a URL later determined to be malicious: http://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/.
      Follow-up alerts showed a malicious PowerShell cmdlet execution and a suspicious sequence of exploration commands on
      the same host. The activity chain ended with an alert titled “Attempt to hide use of dual-purpose tool,” indicating
      an effort to disguise the presence of a publicly available tool for potentially malicious purposes.'
    question: 'According to the final alert “Attempt to hide use of dual-purpose tool,” what is the Azure AD user ID (AadUserId)
      associated with the account involved in that event?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-10 the account with field Sid=`S-1-5-21-561436748-3867387497-1732241745-3701` clicked on
          a malicious URL.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-04 the process with field ExtractedFileName=`powershell.exe` was executed with a 
          malicious PowerShell cmdlet.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: On 2024-07-04 the account with field AadUserId=`ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` performed a 
          suspicious sequence of exploration activities.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: On 2024-07-04 the same account with field AadUserId=`ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` 
          attempted to hide the use of a dual-purpose tool.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
