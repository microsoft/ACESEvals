tasks:
- task_id: incident_55_latest_test_set_task_75
  title: incident_55_latest_test_set_task_75
  description: 'According to the Impacket-related alert in this incident, what file (or environment variable reference) did
    the attacker invoke when executing commands with the toolkit?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a process named "iy2orr1e.rrg.exe" was launched on an endpoint using a hidden,
      Base64-encoded PowerShell command — activity that triggered the alert “Attempt to hide use of dual-purpose tool.” This
      suggests an attacker may be concealing a public utility under an unexpected filename for malicious purposes. Pivoting
      from this alert reveals a related detection flagging an "Ongoing hands-on-keyboard attack via Impacket toolkit," which
      indicates lateral-movement attempts from the same incident.'
    question: 'According to the Impacket-related alert in this incident, what file (or environment variable reference) did
      the attacker invoke when executing commands with the toolkit?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '%comspec%'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '%comspec%'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An attempt to hide the use of a dual-purpose tool was detected on the host with HostName `mb-adfs`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A hands-on-keyboard attack using the Impacket toolkit executed a suspicious command through the 
          file Name `%comspec%`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
