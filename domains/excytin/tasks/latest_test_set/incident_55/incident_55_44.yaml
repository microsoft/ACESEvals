tasks:
- task_id: incident_55_latest_test_set_task_44
  title: incident_55_latest_test_set_task_44
  description: 'According to the subsequent alert titled "Suspicious service registration" that followed these activities,
    which executable was registered as a Windows service?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation you observed that user Luciano Herrera added password-based credentials to
      an OAuth application (SimulandApp) in Office 365, which can indicate a potential compromise aiming to spread phishing
      or exfiltrate data. This activity originated from IP address 36.193.21.220 and is linked to further suspicious behavior
      on the same endpoint, including the execution of Windows reconnaissance commands and malicious use of Task Scheduler
      to establish persistence.'
    question: 'According to the subsequent alert titled "Suspicious service registration" that followed these activities,
      which executable was registered as a Windows service?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'services.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'services.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:02Z, Task Scheduler activity was observed on host with HostName `mb-adfs`, 
          suggesting an attempt to gain or maintain persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Immediately after, a suspicious service registration occurred involving the process whose 
          ExtractedFileName is `services.exe`, reinforcing persistence on the same system.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Within the same second, a process with ExtractedFileName `powershell.exe` executed a suspicious 
          sequence of exploration commands, likely performing internal reconnaissance.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Three days later, on 2024-07-07 09:54:21Z, the attacker-controlled account with AadUserId 
          `2de70991-2799-4a95-b734-8e3df3a50118` added a Password credential to the OAuth application SimulandApp, 
          completing the compromise chain.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
