tasks:
- task_id: incident_55_latest_test_set_task_30
  title: incident_55_latest_test_set_task_30
  description: 'Which local account was reported as the origin of the ‘Suspicious remote activity’ detected at 22:35:02 UTC
    on July 4 2024?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed a series of potentially malicious reconnaissance commands executed
      on a host. The activity was initiated by user bjenkins, who ran several utilities such as whoami.exe and multiple PowerShell
      scripts from the Downloads directory. This behavior triggered the alert titled “Suspicious sequence of exploration activities”
      on 2024-07-04 at 22:35 UTC, indicating that an unknown process (file name not yet confirmed) was chaining these commands
      to enumerate system information—an approach commonly used to prepare for lateral movement. Almost simultaneously, another
      alert, “Suspicious remote activity,” was raised on the same machine, suggesting that a remote session or action had
      been started from the host just seconds earlier.'
    question: 'Which local account was reported as the origin of the ‘Suspicious remote activity’ detected at 22:35:02 UTC
      on July 4 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'LocalSystem'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'LocalSystem'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity originated from the account with Name `LocalSystem` (alert time: 2024-07-04
          22:35:02.377104+00:00).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Immediately afterward, the process with ExtractedFileName `powershell.exe` executed a sequence of exploration
          commands on the host (alert time: 2024-07-04 22:35:03.197761+00:00).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
