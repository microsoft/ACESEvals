tasks:
- task_id: incident_55_latest_test_set_task_42
  title: incident_55_latest_test_set_task_42
  description: 'Which domain controller host was identified as having read the ADFS DKM key in the final alert of this incident
    chain?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an intrusion investigation, we first observed a suspicious sequence of exploration commands
      executed on host "mb-adfs" by account "gsmith", including the use of tools such as whoami.exe and a renamed PowerShell
      payload (iy2orr1e.rrg.exe). Shortly afterward, the same overall activity cluster generated an alert for a suspicious
      LDAP query, indicating possible reconnaissance against Active Directory. Several days later, a suspected DCSync attack
      was detected from workstation "MB-WINCLIENT" to an internal domain controller. Moments after this replication request,
      another alert reported that the domain controller accessed the Data Protection Master (DKM) key for an ADFS object,
      suggesting an attempt to compromise federation services.'
    question: 'Which domain controller host was identified as having read the ADFS DKM key in the final alert of this incident
      chain?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – Reconnaissance started with the suspicious process (ExtractedFileName: `powershell.exe`) executing
          a sequence of Windows exploration commands.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – The attacker leveraged an account (Sid: `S-1-5-21-551436448-9871687716-9837441745-1903`) to
          run a suspicious LDAP query and enumerate directory information.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – Lateral-movement escalated when a suspected DCSync attack was launched against the domain controller
          (HostName: `MB-DC1`) to replicate directory services data.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Step 4 – Compromise deepened as the same domain controller (HostName: `MB-DC1`) accessed the AD FS DKM
          key, indicating an attempt to obtain sensitive federation secrets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
