  description: 'What exact URL was embedded in the phishing emails associated with the "Internal phishing" campaign detected
    on July 7, 2024?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspected DCSync attack on July 10, 2024, we identified that the account
      belonging to Luciano Herrera (CIO) on host MB-WINCLIENT sent an unexpected replication request to domain controller
      MB-DC1. Subsequent analysis revealed that the same user account is linked to additional suspicious activities, including
      an "Internal phishing" campaign detected on July 7, 2024, in which phishing emails were sent from an internal device
      to other employees.'
    question: 'What exact URL was embedded in the phishing emails associated with the "Internal phishing" campaign detected
      on July 7, 2024?'
