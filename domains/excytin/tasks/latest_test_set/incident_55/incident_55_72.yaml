tasks:
- task_id: incident_55_latest_test_set_task_72
  title: incident_55_latest_test_set_task_72
  description: 'Which user’s mailbox had those email messages with the malicious URL that were removed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation we observed that a user on host "mb-winclient" (device ID 7661dfd4-218f-4016-8a87-66d68a7f098e)
      clicked a malicious URL on 2024-07-10. Further analysis shows that, a day earlier, security systems automatically removed
      email messages from a specific mailbox after detecting the same malicious URL inside them.'
    question: 'Which user’s mailbox had those email messages with the malicious URL that were removed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Lucas Grey@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Lucas Grey@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 2024-07-09 11:49:57Z – Email account `Lucas Grey@niseko.alpineskihouse.co` had a message containing
          a malicious URL that was removed after delivery.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 2024-07-10 11:24:45Z – A device later clicked the malicious URL 
          `https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
