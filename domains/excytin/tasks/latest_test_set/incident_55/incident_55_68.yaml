tasks:
- task_id: incident_55_latest_test_set_task_68
  title: incident_55_latest_test_set_task_68
  description: 'Which host is reported to have read the AD FS DKM key in the final alert of this incident sequence?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4th, 2024, our monitoring detected an "ADFS private key extraction attempt" coming from host
      "mb-adfs", where a suspicious process (iy2orr1e.rrg.exe) was executed under the gsmith account. This initial activity
      was followed by a "Suspicious sequence of exploration activities" and a "Suspicious System Hardware Discovery" alert,
      indicating reconnaissance on the same environment. Several days later, on July 10th, the investigation timeline shows
      a suspected DCSync operation, after which another alert was generated for an Active Directory Federation Services (AD
      FS) Data Protection Manager (DKM) key access. The final alert states that one of our domain controllers accessed the
      DKM key for an ADFS object.'
    question: 'Which host is reported to have read the AD FS DKM key in the final alert of this incident sequence?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'ProcessId__CreatedTimeUtc__CommandLine: `3116__2024-07-02t09:48:23.9439954z__"iy2orr1e.rrg.exe" -windowstyle
          hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`
          – A rogue executable (iy2orr1e.rrg.exe) was launched with an encoded PowerShell command, attempting to extract ADFS
          private keys.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'ExtractedFileName: `powershell.exe` – The attacker then leveraged PowerShell to run a suspicious sequence
          of exploration commands on the host.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'Sid: `S-1-5-21-551436448-9871687716-9837441745-1903` – The compromised account associated with this
          SID performed system-hardware discovery to gather further information.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'HostName: `MB-DC1` – The attacker proceeded to issue a DCSync-style replication request from domain
          controller MB-DC1, indicating an attempt to replicate directory data.'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'HostName: `MB-DC1` – Finally, MB-DC1 accessed (read) the AD FS DKM key, confirming that the attacker
          obtained highly sensitive federation-service keys.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
