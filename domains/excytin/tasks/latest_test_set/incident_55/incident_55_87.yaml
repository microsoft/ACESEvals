tasks:
- task_id: incident_55_latest_test_set_task_87
  title: incident_55_latest_test_set_task_87
  description: 'Which user account was identified as initiating the directory-services replication request in the suspected
    DCSync attack on 10 July 2024?'
  inherit_shared: true
  initial_context:
    incident_context: 'Early on 7 July 2024 an email with a malicious URL (http://kn017721628.wittytree-b6f239d6.northeurope.azurecontainerapps.io/)
      was delivered to, and later removed from, the mailbox of santiago@vnevado.alpineskihouse.co. The message came from sender
      4qs6v9m@vnevado.alpineskihouse.co via IP 106.214.87.198, indicating a successful phishing attempt. Shortly afterwards
      an internal phishing campaign was launched from a compromised user account, and process-injection activity was detected
      on an endpoint. A few days later, on 10 July 2024, Microsoft Defender raised a ‘Suspected DCSync attack (replication
      of directory services)’ alert after a workstation (MB-WINCLIENT) sent a replication request to the domain controller
      (MB-DC1).'
    question: 'Which user account was identified as initiating the directory-services replication request in the suspected
      DCSync attack on 10 July 2024?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Initial compromise: A malicious email was delivered (and later removed) to the user with AadUserId `28058d92-fc24-4869-9231-6546a34b00f2`
          at 2024-07-07 08:54:40Z.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Lateral movement begins: The attacker, controlling the account with Sid `S-1-5-21-561436748-3867387497-1732241745-3701`,
          launched an internal phishing campaign against other employees at 2024-07-07 10:09:33Z.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Privilege-escalation technique: A process-injection event occurred under the account Sid `S-1-5-21-551436448-9871687716-9837441745-1903`
          on 2024-07-04 22:35:02Z, showing the attacker executing malicious code inside a trusted process.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'End goal reached: Using the high-privilege account Name `Luciano Herrera`, the attacker performed a
          DCSync‐style directory-replication request against the domain controller on 2024-07-10 11:24:45Z.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
