tasks:
- task_id: incident_55_latest_test_set_task_55
  title: incident_55_latest_test_set_task_55
  description: 'Which user''s email address was identified in the alert that reported emails with malicious URLs being removed
    after delivery?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host "mb-adfs", we observed that "schtasks.exe" created and immediately
      launched a task that executed the file "iy2orr1e.rrg.exe" with an encoded PowerShell command on 2024-07-04. This triggered
      a "Suspicious Task Scheduler activity" alert, suggesting the attacker was attempting to establish persistence. Minutes
      later, a "Sensitive credential memory read" alert indicated LSASS memory access, pointing to possible credential dumping.
      A few days after these endpoint events, the mail system raised an "Email messages containing malicious URL removed after
      delivery" alert, showing that a specific user had received malicious emails which were subsequently purged.'
    question: 'Which user''s email address was identified in the alert that reported emails with malicious URLs being removed
      after delivery?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Lucas Grey@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Lucas Grey@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 2024-07-04T22:35:02Z – The attacker leveraged Task Scheduler to create/modify a task that launches 
          the process with ExtractedFileName "powershell.exe", establishing persistence.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 2024-07-04T22:35:04Z – Immediately afterward, a Sensitive Credential Memory Read was performed by 
          the account whose AadUserId is "a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0", dumping LSASS to harvest credentials.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 2024-07-09T11:49:57Z – Malicious-URL emails were delivered and subsequently removed from the 
          mailbox of the account whose Email is "Lucas Grey@niseko.alpineskihouse.co", showing the threat’s continued 
          activity against this user.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
