tasks:
- task_id: incident_55_latest_test_set_task_21
  title: incident_55_latest_test_set_task_21
  description: 'A few days after the remote activity on host "mb-adfs", the incident escalated when a user clicked a link
    that was later classified as malicious. Which mailbox was associated with this potentially malicious URL click detected
    on 2024-07-10 at 11:24:45 UTC?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious remote activity alert on host "mb-adfs", several processes
      were launched under the LocalSystem and gsmith accounts, including cmd.exe spawning an encoded-command PowerShell instance.
      This activity raised concerns about remote code execution and possible follow-on actions in the environment.'
    question: 'A few days after the remote activity on host "mb-adfs", the incident escalated when a user clicked a link that
      was later classified as malicious. Which mailbox was associated with this potentially malicious URL click detected on
      2024-07-10 at 11:24:45 UTC?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was detected launching the process (ExtractedFileName = 
          `powershell.exe`).
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A process-injection attempt involved the account (Sid = 
          `S-1-5-21-561436748-3867387497-1732241745-3701`).
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Later, a user through the mailbox (MailboxPrimaryAddress = `bjenkins@niseko.alpineskihouse.co`) 
          clicked a malicious URL.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
