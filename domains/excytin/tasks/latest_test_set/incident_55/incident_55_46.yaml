tasks:
- task_id: incident_55_latest_test_set_task_46
  title: incident_55_latest_test_set_task_46
  description: 'Subsequent telemetry showed that another server read the AD FS Data Protection (DKM) key. What is the hostname
    of the server that accessed the DKM key?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed a potentially malicious code-injection event on host "mb-winclient".
      The activity involved the execution of a PowerShell script named "contosoadfsblatempcreds.ps1" by user account "bjenkins"
      (AadUserId a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0). This suspicious process injection raised concerns that the attacker
      might attempt to harvest credentials or replicate directory services later in the attack chain.'
    question: 'Subsequent telemetry showed that another server read the AD FS Data Protection (DKM) key. What is the hostname
      of the server that accessed the DKM key?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'MB-DC1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'MB-DC1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An initial alert shows a process receiving injected code that was executed under the user account 
          with AadUserId `2de70991-2799-4a95-b734-8e3df3a50118`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, a suspected DCSync attack was detected in which the domain controller identified by 
          HostName `MB-DC1` received a replication request.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: In a related event, the same domain controller (HostName `MB-DC1`) performed a suspicious read of 
          the AD FS DKM key, indicating possible compromise of sensitive federation service secrets.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
