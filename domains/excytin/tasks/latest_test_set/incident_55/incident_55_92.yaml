tasks:
- task_id: incident_55_latest_test_set_task_92
  title: incident_55_latest_test_set_task_92
  description: 'According to the "Suspicious Task Scheduler activity" alert that followed the Impacket incident, what is the
    name of the executable that was associated with the newly created or modified scheduled task?'
  inherit_shared: true
  initial_context:
    incident_context: 'At 22:35:01 UTC on July 4 2024, Microsoft Defender flagged an "Ongoing hands-on-keyboard attack via
      Impacket toolkit" on an endpoint (host name withheld). The alert showed the attackers invoking the system process lsass.exe
      from accounts such as LocalSystem and a user named gsmith, suggesting possible lateral-movement attempts. Just one second
      later, a related alert titled "Suspicious Task Scheduler activity" indicated that the same intrusion chain had created
      or modified a scheduled task—an action commonly used to achieve persistence.'
    question: 'According to the "Suspicious Task Scheduler activity" alert that followed the Impacket incident, what is the
      name of the executable that was associated with the newly created or modified scheduled task?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'iy2orr1e.rrg.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'iy2orr1e.rrg.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Hands-on-keyboard activity was detected when Impacket executed a command on host HostName = 
          `mb-adfs` at 2024-07-04 22:35:01Z.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Moments later, Task Scheduler was abused to create or alter a task that points to the suspicious 
          binary ExtractedFileName = `iy2orr1e.rrg.exe`, indicating an attempt to establish persistence.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
