      with an internal phishing campaign in which a compromised user sent phishing emails to other employees. A follow-up
      alert reported that the offending emails were subsequently purged by the email security system because they contained
      a malicious URL.'
    question: 'What is the full URL that was identified as malicious in the email messages that were removed after delivery?'
