  inherit_shared: true
  initial_context:
    incident_context: 'On host ''mb-winclient'', the process ''svchost.exe'' (PID 2880) was observed running with the winmgmt
      service, and later a PowerShell script was launched by user accounts including ''bjenkins'' and ''pwilson''. This activity
