tasks:
- task_id: incident_55_latest_test_set_task_11
  title: incident_55_latest_test_set_task_11
  description: 'In the alert titled "Suspicious sequence of exploration activities" that followed the Task Scheduler event,
    what is the Security Identifier (SID) of the account associated with those exploration commands?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious Task Scheduler activity on host "mb-adfs", we observed that
      a PowerShell command and the binary "iy2orr1e.rrg.exe" were launched via "schtasks.exe" under the account niseko\adfsadmin.
      Just one second after this task was created, another alert titled "Suspicious sequence of exploration activities" was
      raised, indicating that the same workflow continued with further reconnaissance commands.'
    question: 'In the alert titled "Suspicious sequence of exploration activities" that followed the Task Scheduler event,
      what is the Security Identifier (SID) of the account associated with those exploration commands?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-551436448-9871687716-9837441745-1903'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-551436448-9871687716-9837441745-1903'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious Task Scheduler activity was detected involving the process with ExtractedFileName 
          `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A subsequent suspicious sequence of exploration activities was executed by the account with Sid 
          `S-1-5-21-551436448-9871687716-9837441745-1903`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
