tasks:
- task_id: incident_55_latest_test_set_task_26
  title: incident_55_latest_test_set_task_26
  description: 'According to the concluding alert that flagged suspicious remote activity, what is the name of the executable
    file that was launched remotely?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of a sequence of potentially related security events, we noted that host "MB-DC1"
      accessed the AD FS DKM key, followed minutes later by a suspected DCSync replication request originating from a user
      on workstation MB-WINCLIENT. Shortly thereafter, a suspicious LDAP query was executed, indicative of reconnaissance
      activity preceding remote actions on a target machine.'
    question: 'According to the concluding alert that flagged suspicious remote activity, what is the name of the executable
      file that was launched remotely?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'powershell.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'powershell.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity was first detected when the file with Name `powershell.exe` was 
          executed.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: That same executable, seen as a process with ExtractedFileName `powershell.exe`, then carried out a
          suspicious LDAP query against the domain.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Next, the attacker leveraged the compromised account with Sid 
          `S-1-5-21-551436448-9871687716-9837441745-1903` to perform a DCSync replication request from MB-WINCLIENT to 
          MB-DC1.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Finally, the domain controller whose HostName is `MB-DC1` read the AD FS DKM key, indicating the 
          attacker’s attempt to access federation service secrets.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
