tasks:
- task_id: incident_55_latest_test_set_task_14
  title: incident_55_latest_test_set_task_14
  description: 'According to the alert about the unusual addition of credentials to the OAuth app "SimulandApp", what is the
    full name of the user account that performed this action?'
  inherit_shared: true
  initial_context:
    incident_context: 'During a recent investigation, a device accessed the malicious URL "https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/".
      Not long after, the same incident timeline showed a suspicious sequence of Windows exploration commands executed under
      an unidentified user account. Shortly thereafter, investigators observed that credentials were unusually added to an
      OAuth application named "SimulandApp", suggesting possible attacker activity.'
    question: 'According to the alert about the unusual addition of credentials to the OAuth app "SimulandApp", what is the
      full name of the user account that performed this action?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The attack chain begins on host with HostName `mb-winclient`, where a malicious URL was clicked on 
          2024-07-10.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Following that, the account identified by Sid `S-1-5-21-551436448-9871687716-9837441745-1903` 
          executed a suspicious sequence of Windows exploration commands on 2024-07-04, showing possible reconnaissance 
          or lateral-movement preparation.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, the user account with Name `Luciano Herrera` added a password credential to the OAuth 
          application SimulandApp on 2024-07-07—an unusual action that may indicate the attacker achieved persistence 
          through this compromised identity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
