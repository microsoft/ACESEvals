tasks:
- task_id: incident_55_latest_test_set_task_28
  title: incident_55_latest_test_set_task_28
  description: 'According to the alert about the unusual addition of credentials to an OAuth app, which user account (email
    address) performed the credential addition?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious service creation on host MB-ADFS, we found that the user gsmith@niseko.alpineskihouse.co
      had created a new service named DDLOXJDSQSNGMUKKFUXQ, likely to execute malicious commands. This activity was one of
      several alerts in the broader incident, which later also included an "Unusual addition of credentials to an OAuth app"—a
      sign that an attacker may have compromised an application to gain further access.'
    question: 'According to the alert about the unusual addition of credentials to an OAuth app, which user account (email
      address) performed the credential addition?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Luciano Herrera@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Luciano Herrera@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'On 2024-07-04 the attacker leveraged Impacket to run a remote command: process field ExtractedFileName
          = `powershell.exe`, marking the start of hands-on-keyboard activity.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Moments later, a reconnaissance step was observed when the account field AadUserId = 
          `2de70991-2799-4a95-b734-8e3df3a50118` executed a suspicious LDAP query to enumerate directory data.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: On 2024-07-07 the threat actor expanded access by using the account field Email = `Luciano 
          Herrera@niseko.alpineskihouse.co` to add a password credential to the OAuth application SimulandApp.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Finally, on 2024-07-10 persistence was established when the account field Name = `gsmith` created 
          the malicious service `DDLOXJDSQSNGMUKKFUXQ` on host MB-ADFS.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
