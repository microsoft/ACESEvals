tasks:
- task_id: incident_55_latest_test_set_task_63
  title: incident_55_latest_test_set_task_63
  description: 'Which user’s email address was identified as accessing the ADFS DKM key in the "Suspected AD FS DKM key read"
    alert raised on 2024-07-10?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a recent security incident, we observed that on 2024-07-04 a process named
      "svchost.exe" was launched on host "mb-winclient" by account "pwilson" (SID S-1-5-21-561436748-3867387497-1732241745-3701).
      This activity triggered the alert "Suspicious System Hardware Discovery." Just seconds later, another alert titled "Suspicious
      sequence of exploration activities" indicated that Windows commands were executed, suggesting an attacker was mapping
      the environment for lateral movement. Several days afterward, a follow-up alert "Suspected AD FS DKM key read" was raised,
      indicating that a different user account successfully accessed the DKM key for an ADFS object (ID 4cac49d3-29d3-407e-8c9b-b7ebb21541b2).'
    question: 'Which user’s email address was identified as accessing the ADFS DKM key in the "Suspected AD FS DKM key read"
      alert raised on 2024-07-10?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious System Hardware Discovery was executed using process with ExtractedFileName 
          `powershell.exe`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: A Suspicious sequence of exploration activities was conducted by the account with Name `gsmith`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Subsequently, the same user (account Email `gsmith@niseko.alpineskihouse.co`) performed a suspected
          AD FS DKM key read.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
