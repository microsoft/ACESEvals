tasks:
- task_id: incident_55_latest_test_set_task_85
  title: incident_55_latest_test_set_task_85
  description: 'According to the alert that reported “Email messages containing malicious URL removed after delivery”, which
    user’s mailbox was identified as having received the malicious email?'
  inherit_shared: true
  initial_context:
    incident_context: 'On the server named "mb-adfs" a renamed executable (iy2orr1e.rrg.exe) was launched via a PowerShell
      command, generating the alert "System executable renamed and launched". Follow-on alerts indicated code injection activity
      and internal phishing from the same device. The investigation chain ultimately reached an email security alert reporting
      that previously delivered messages containing a malicious URL were purged from users’ mailboxes.'
    question: 'According to the alert that reported “Email messages containing malicious URL removed after delivery”, which
      user’s mailbox was identified as having received the malicious email?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'santiago@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'santiago@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – Process: A renamed system executable was launched with ExtractedFileName `powershell.exe` (2024-07-04
          22:35:01).'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – Account: Code was injected into another process by the account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0`
          (2024-07-04 22:35:02).'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – MailMessage: Malicious emails were delivered and later removed for the Recipient `santiago@vnevado.alpineskihouse.co`
          (2024-07-07 08:54:40).'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Step 4 – Account: An internal phishing campaign was then sent from the compromised account with AadUserId
          `28058d92-fc24-4869-9231-6546a34b00f2` (2024-07-07 10:09:33).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
