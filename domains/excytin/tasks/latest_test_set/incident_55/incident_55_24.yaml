tasks:
- task_id: incident_55_latest_test_set_task_24
  title: incident_55_latest_test_set_task_24
  description: 'Identify the Application (client) ID of the OAuth app to which credentials were unusually added by Luciano
    Herrera during this incident.'
  inherit_shared: true
  initial_context:
    incident_context: 'A recent investigation revealed that on host "mb-adfs" the SYSTEM account executed a renamed Windows
      executable (iy2orr1e.rrg.exe) via a PowerShell-encoded command, triggering the alert "System executable renamed and
      launched". Such activity often precedes further malicious actions like reconnaissance, lateral movement, or cloud abuse.
      Subsequent alerts in the same incident showed a suspicious sequence of Windows command-line exploration, and a few days
      later a user named Luciano Herrera (pwilson@niseko.alpineskihouse.co) unexpectedly added a password credential to a
      cloud-hosted OAuth application (SimulandApp), suggesting potential abuse of that app for broader access.'
    question: 'Identify the Application (client) ID of the OAuth app to which credentials were unusually added by Luciano
      Herrera during this incident.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '4d9476b8-6ae6-459b-a273-5837c15b5981'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '4d9476b8-6ae6-459b-a273-5837c15b5981'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'A renamed system executable was launched: ExtractedFileName = `powershell.exe`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Suspicious exploration commands were executed by an account: Sid = `S-1-5-21-551436448-9871687716-9837441745-1903`.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'An unusual credential was added to an OAuth application: OAuthAppId = `4d9476b8-6ae6-459b-a273-5837c15b5981`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
