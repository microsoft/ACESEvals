tasks:
- task_id: incident_55_latest_test_set_task_27
  title: incident_55_latest_test_set_task_27
  description: 'According to the 4-Jul-2024 alert about the malicious PowerShell Cmdlet, which user account (account name)
    executed the Cmdlet?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation we found that on 9-Jul-2024 a number of emails containing the URL https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/
      were delivered to (and later removed from) the mailbox bjenkins@niseko.alpineskihouse.co. The messages were sent from
      the address santiago@vnevado.alpineskihouse.co and appear to have been associated with the user account belonging to
      Lucas Grey. Tracing the activity back, we discovered an earlier security alert from 4-Jul-2024 that reported a malicious
      PowerShell Cmdlet being executed on a machine. Your task is to correlate these two events.'
    question: 'According to the 4-Jul-2024 alert about the malicious PowerShell Cmdlet, which user account (account name)
      executed the Cmdlet?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'pwilson'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'pwilson'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An email message addressed to the account with Sid `S-1-5-21-561436748-3867387497-1732241745-3701` 
          contained a malicious URL and was later removed after delivery.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The user account with Name `pwilson` invoked a malicious PowerShell Cmdlet on the machine.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
