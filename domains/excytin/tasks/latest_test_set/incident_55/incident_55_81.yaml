tasks:
- task_id: incident_55_latest_test_set_task_81
  title: incident_55_latest_test_set_task_81
  description: 'What is the email address of the account that created the suspicious service DDLOXJDSQSNGMUKKFUXQ on MB-ADFS,
    as reported in the final alert of this incident chain?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation that began with the removal of an email containing a malicious URL sent from
      santiago@vnevado.alpineskihouse.co to the mailbox bjenkins@niseko.alpineskihouse.co (owned by user Lucas Grey), multiple
      related alerts were uncovered. These included a suspicious LSASS access and indications of an Impacket-based hands-on-keyboard
      attack. A few days later, the attacker progressed and a new alert titled “Suspicious service creation” was triggered,
      indicating that an account had created the service DDLOXJDSQSNGMUKKFUXQ on the host MB-ADFS—likely to execute malicious
      commands.'
    question: 'What is the email address of the account that created the suspicious service DDLOXJDSQSNGMUKKFUXQ on MB-ADFS,
      as reported in the final alert of this incident chain?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Step 1 – account.AadUserId: `ec3ec68b-fdeb-4fe4-9a29-acd445e1ccc5` was observed running the Impacket
          toolkit (alert: “Ongoing hands-on-keyboard attack via Impacket toolkit”, 2024-07-04 22:35:01 UTC), indicating an
          attacker establishing interactive control on the device.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Step 2 – process.ExtractedFileName: `powershell.exe` was then used to access LSASS memory (alert: “Suspicious
          access to LSASS service”, 2024-07-04 22:35:02 UTC), suggesting the attacker attempted to dump credentials after
          gaining that interactive foothold.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Step 3 – account.AadUserId: `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` later received email messages that
          contained a malicious URL which were removed after delivery (alert: “Email messages containing malicious URL removed
          after delivery”, 2024-07-09 11:49:57 UTC), showing the attacker’s continued effort to spread or phish additional
          users with compromised credentials.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Step 4 – account.Email: `gsmith@niseko.alpineskihouse.co` finally created the suspicious service “DDLOXJDSQSNGMUKKFUXQ”
          on host MB-ADFS (alert: “Suspicious service creation”, 2024-07-10 11:24:45 UTC), completing the attacker’s objective
          of establishing persistence on the endpoint.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
