tasks:
- task_id: incident_55_latest_test_set_task_65
  title: incident_55_latest_test_set_task_65
  description: 'What is the Security Identifier (SID) of the account that launched the ADFS private key extraction attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'While reviewing a "Suspicious service registration" alert triggered on 2024-07-04, investigators saw
      that the Windows system process "services.exe" (PID 764) was registered as a service, a common technique for persistence
      or privilege escalation. This alert is linked—through a shared host—to another alert raised one second earlier that
      reported an attempted extraction of an ADFS private key via a suspicious LDAP query. To determine whether the same user
      was involved in both activities, the analyst now needs to look at the account details recorded in the ADFS private key
      extraction attempt.'
    question: 'What is the Security Identifier (SID) of the account that launched the ADFS private key extraction attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-2-5-21-571436798-3864380397-1837441745-3206'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-2-5-21-571436798-3864380397-1837441745-3206'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'HostName: mb-adfs – A system program was suspiciously registered as a service on host `mb-adfs`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Sid: S-2-5-21-571436798-3864380397-1837441745-3206 – An LDAP query indicating an attempt to extract
          ADFS private keys was executed by the account with SID `S-2-5-21-571436798-3864380397-1837441745-3206`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
