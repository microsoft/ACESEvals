tasks:
- task_id: incident_55_latest_test_set_task_4
  title: incident_55_latest_test_set_task_4
  description: 'What is the full email address of the account that created the suspicious service DDLOXJDSQSNGMUKKFUXQ on
    MB-ADFS?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that the domain controller MB-DC1 read the AD FS DKM key, triggering
      a “Suspected AD FS DKM key read” alert. Shortly after, additional alerts indicated possible DCSync activity and other
      hands-on-keyboard behavior, eventually leading to a “Suspicious service creation” event in which a new service named
      DDLOXJDSQSNGMUKKFUXQ was created on host MB-ADFS.'
    question: 'What is the full email address of the account that created the suspicious service DDLOXJDSQSNGMUKKFUXQ on MB-ADFS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'gsmith@niseko.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'gsmith@niseko.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 1
        description: 'HostName: MB-DC1 read the AD FS DKM key, indicating a potential compromise of sensitive credentials.'
      checkpoint_2:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 2
        description: 'AadUserId: 2de70991-2799-4a95-b734-8e3df3a50118 issued a DCSync replication request to MB-DC1, attempting
          to extract directory data.'
      checkpoint_3:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 3
        description: 'ExtractedFileName: powershell.exe ran a suspicious sequence of discovery commands, suggesting internal
          reconnaissance activity.'
      checkpoint_4:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 4
        description: 'Name: gsmith executed commands through the Impacket toolkit, demonstrating hands-on-keyboard lateral-movement
          techniques.'
      checkpoint_5:
        target: trajectory
        max_score: 0.2
        weight: 1.0
        title: Checkpoint 5
        description: 'Email: gsmith@niseko.alpineskihouse.co created the service DDLOXJDSQSNGMUKKFUXQ on MB-ADFS to run potentially
          malicious code.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
        - checkpoint_5
