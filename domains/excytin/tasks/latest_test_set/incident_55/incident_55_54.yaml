tasks:
- task_id: incident_55_latest_test_set_task_54
  title: incident_55_latest_test_set_task_54
  description: 'According to the alert about the malicious PowerShell cmdlet that followed the LDAP reconnaissance, which
    user account executed the cmdlet?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024 we observed a suspicious LDAP query executed from PowerShell (script "ldaprequest.ps1",
      process ID 11116, start time 2024-07-02 09:47:42 UTC). This reconnaissance activity was followed, on the same machine,
      by an alert stating that a malicious PowerShell cmdlet had been invoked—potentially for credential theft or further
      exploitation.'
    question: 'According to the alert about the malicious PowerShell cmdlet that followed the LDAP reconnaissance, which user
      account executed the cmdlet?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bjenkins'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bjenkins'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A malicious PowerShell Cmdlet was invoked on the machine by the account with Name `bjenkins` (Field:
          Name, Value: `bjenkins`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, a suspicious LDAP query was executed from the IP address (Field: Address, Value: `72.5.72.208`),
          suggesting possible reconnaissance activity.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
