tasks:
- task_id: incident_55_latest_test_set_task_61
  title: incident_55_latest_test_set_task_61
  description: 'Investigators discovered that the same renamed executable was involved in an earlier "ADFS private key extraction
    attempt." What Process ID was recorded for that earlier execution of "iy2orr1e.rrg.exe"?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security monitoring has flagged an alert titled “Attempt to hide use of dual-purpose tool.” On 2024-07-06
      an executable named "iy2orr1e.rrg.exe" was launched with a hidden window and a long base-64 encoded command. The command
      line for this process shows a Process ID of 5752 and a creation time of 2024-07-06T00:00:01Z. This activity suggests
      an attempt to cloak a publicly available tool that could be used maliciously.'
    question: 'Investigators discovered that the same renamed executable was involved in an earlier "ADFS private key extraction
      attempt." What Process ID was recorded for that earlier execution of "iy2orr1e.rrg.exe"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '8764'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '8764'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Alert 1: In the attempt to hide use of a dual-purpose tool, the entity affected is account Name `gsmith`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Alert 2: In the ADFS private key extraction attempt, the entity affected is process (ProcessId__CreatedTimeUtc__CommandLine)
          `8764__2024-07-04t00:00:01.698205z__"iy2orr1e.rrg.exe" -windowstyle hidden -encodedcommand qwa6afwauwbjahiaaqbwahqacwbcaeuaeabwag8acgb0aeearabgafmavabvagsazqbuafmaaqbnag4aaqbuaemazqbyahqalgbwahmamqa=`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
