      were observed, including "lsass.exe" and an encoded PowerShell command, all initiated around 22:35 UTC on 2024-07-04.
      Shortly after this remote activity alert, another alert titled "Suspicious sequence of exploration activities" was triggered,
      indicating that a process executed multiple Windows discovery commands—behavior often linked to lateral-movement preparation.'
    question: 'According to the "Suspicious sequence of exploration activities" alert raised at 22:35:03 UTC on 2024-07-04,
      what is the Security Identifier (SID) of the account associated with these exploration commands?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-551436448-9871687716-9837441745-1903'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
