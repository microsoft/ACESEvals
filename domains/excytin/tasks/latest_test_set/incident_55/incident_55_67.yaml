tasks:
- task_id: incident_55_latest_test_set_task_67
  title: incident_55_latest_test_set_task_67
  description: 'According to the alert about the unusual credential addition to "SimulandApp," what is the OAuth application’s
    App ID that received the new password credential?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a security incident, we observed a "Sensitive credential memory read" alert
      on 2024-07-04, indicating that `lsass.exe` (PID 760) had its memory accessed—an activity commonly used to extract authentication
      secrets. Around the same time, a "Suspicious System Hardware Discovery" alert was raised, tied to an unidentified user
      account. A few days later, a separate alert reported that the user Luciano Herrera (pwilson@niseko.alpineskihouse.co)
      performed an unusual addition of password-type credentials to a cloud OAuth application named "SimulandApp."'
    question: 'According to the alert about the unusual credential addition to "SimulandApp," what is the OAuth application’s
      App ID that received the new password credential?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '4d9476b8-6ae6-459b-a273-5837c15b5981'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '4d9476b8-6ae6-459b-a273-5837c15b5981'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: An attacker initiated a credential-dumping attempt by launching the process with ExtractedFileName 
          `powershell.exe`, which read LSASS memory.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The same activity trail shows the adversary-controlled account identified by AadUserId 
          `2de70991-2799-4a95-b734-8e3df3a50118` performing suspicious system-hardware discovery on the host.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Ultimately, the threat actor pivoted to the cloud and added new password-type credentials to the 
          OAuth application with OAuthAppId `4d9476b8-6ae6-459b-a273-5837c15b5981`, indicating the app has been 
          compromised.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
