tasks:
- task_id: incident_55_latest_test_set_task_50
  title: incident_55_latest_test_set_task_50
  description: 'Which user account was identified as sending the internal phishing emails from the compromised device on July
    7th?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4th, security monitoring flagged a device where the system process "services.exe" (PID 764)
      had been registered as a service—often a sign of an attacker attempting persistence or privilege escalation. Within
      seconds, the same host showed execution of the Impacket toolkit and a process reading LSASS memory, suggesting credential
      theft and lateral-movement activity. Three days later, the compromised device was used to launch an internal phishing
      campaign, indicating the attacker may have taken control of a legitimate user account.'
    question: 'Which user account was identified as sending the internal phishing emails from the compromised device on July
      7th?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Nina Sullivan'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Nina Sullivan'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious system program was registered as a service on host HostName `mb-adfs`.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, the Impacket toolkit invoked the process ExtractedFileName `powershell.exe`, 
          suggesting hands-on-keyboard activity for lateral movement.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: The intrusion escalated when an attacker-controlled process accessed LSASS, leading to a Sensitive 
          credential memory read under account Sid `S-1-5-21-561436748-3867387497-1732241745-3701`.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Using the harvested credentials, the compromised account Name `Nina Sullivan` initiated an internal
          phishing campaign against other users in the organization.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
