tasks:
- task_id: incident_55_latest_test_set_task_34
  title: incident_55_latest_test_set_task_34
  description: 'In the "Sensitive credential memory read" alert linked to this email-borne attack, which IP address was identified
    as involved in the activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an email security incident, multiple messages containing a malicious URL (https://ym018491661.wittytree-b6f239d6.northeurope.azurecontainerapps.io/)
      were sent from santiago@vnevado.alpineskihouse.co to the mailbox of bjenkins@niseko.alpineskihouse.co, with the account
      belonging to Lucas Grey involved in the correspondence. Although these messages were later removed, further investigation
      revealed a related alert titled "Sensitive credential memory read," indicating that an attacker accessed LSASS process
      memory to harvest credentials.'
    question: 'In the "Sensitive credential memory read" alert linked to this email-borne attack, which IP address was identified
      as involved in the activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '72.5.72.208'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '72.5.72.208'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Sensitive LSASS credential memory was read from host traffic associated with the IP Address `72.5.72.208`
          (Field: Address) on 2024-07-04 22:35:04.120690+00:00.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Email messages that contained a malicious URL were delivered to—and subsequently removed from—the user
          account with AadUserId `a2d0f7c2-b0a0-43bd-bce0-27d8ae3be4d0` (Field: AadUserId) on 2024-07-09 11:49:57.362974+00:00.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
