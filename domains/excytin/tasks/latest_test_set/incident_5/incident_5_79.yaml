tasks:
- task_id: incident_5_latest_test_set_task_79
  title: incident_5_latest_test_set_task_79
  description: 'According to the alert that flagged the possible PRT access attempt, what is the name of the executable (process)
    that was launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into ransomware-like activity detected on multiple devices, an alert reported
      that assets communicating with IP address 99.83.111.100 and associated with the user SID S-0-6-5 had executed suspicious
      files such as get-userprttoken.ps1 and two archives named characterical.zip and characterical.zip.lockbit. While reviewing
      related activity, the team also noted a separate alert raised at 2024-07-04 22:35:01 UTC indicating a possible attempt
      to access a Primary Refresh Token (PRT).'
    question: 'According to the alert that flagged the possible PRT access attempt, what is the name of the executable (process)
      that was launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'browsercore.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'browsercore.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'HostName: vnevado-win11t – This device is showing ransomware-like activity and is likely compromised.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'ProcessId: 7036, CreatedTimeUtc: 2024-06-20T09:29:49.304018Z, CommandLine: "browsercore.exe" – The process
          browsercore.exe was executed and is suspected of attempting to access a Primary Refresh Token (PRT).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
