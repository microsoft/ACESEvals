tasks:
- task_id: incident_5_latest_test_set_task_18
  title: incident_5_latest_test_set_task_18
  description: 'In the "Windows Sysinternals tool renamed" alert that followed, what is the name of the executable that was
    launched after being renamed?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of an "Unknown malware was detected and was active" alert, several instances
      of the credential-stealing utility "mimikatz.exe" (along with its companion file "mimilib.dll") were observed running
      with high-privilege commands on the affected host. Just seconds later, another alert titled "Windows Sysinternals tool
      renamed" was raised, indicating that a legitimate Sysinternals utility had been copied under a different name and executed—often
      a tactic used to mask malicious activity.'
    question: 'In the "Windows Sysinternals tool renamed" alert that followed, what is the name of the executable that was
      launched after being renamed?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'notepad.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'notepad.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Unknown malware activity was detected on the account (Name: `tgs2z`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A Sysinternals tool was renamed and executed with the process (ProcessId__CreatedTimeUtc__CommandLine:
          `6428__2024-06-20t09:07:40.2264462z__notepad.exe  \\vnevado-jump cmd.ee`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
