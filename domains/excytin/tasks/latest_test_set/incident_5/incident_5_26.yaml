tasks:
- task_id: incident_5_latest_test_set_task_26
  title: incident_5_latest_test_set_task_26
  description: 'What is the exact file name of the credential-theft tool reported in the subsequent "Mimikatz credential theft
    tool" alert on the same device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation we observed that on 2024-07-04 a process named "vssblatemp.exe" (PID 1900)
      executed the command "delete shadows /all" on host "vnevado-win11u" under account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522).
      This resulted in an alert titled "File backups were deleted", a common precursor to ransomware. Within one second of
      this event, the same device raised another alert indicating that a credential-theft tool had been detected.'
    question: 'What is the exact file name of the credential-theft tool reported in the subsequent "Mimikatz credential theft
      tool" alert on the same device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity originated from IP (Field: Address) `99.83.111.100`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker placed and ran the credential-theft tool file (Field: Name) `mimikatz.exe` on the compromised
          device.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Leveraging stolen credentials, the attacker executed PSExec with the account (Field: Sid) `S-5-7-21-1843151660-3234030288-105586167-1422`
          to move laterally to the jump server.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'With elevated access, the attacker used the account (Field: AadUserId) `731adb71-b11c-4bbf-850b-57989b350e96`
          to delete all file snapshots and shadow copies, removing backups from the system.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
