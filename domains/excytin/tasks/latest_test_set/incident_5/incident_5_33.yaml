tasks:
- task_id: incident_5_latest_test_set_task_33
  title: incident_5_latest_test_set_task_33
  description: 'During the same incident, a separate alert states that a ransomware payload was remotely launched on another
    device. What is the Azure AD device ID (AadDeviceId) of that second device?'
  inherit_shared: true
  initial_context:
    incident_context: 'The security incident began when numerous files on device vnevado-win11t suddenly received the extensions
      ".zip" and ".zip.lockbit", suggesting mass encryption activity. This activity was flagged in the alert “Possible ransomware
      activity based on a known malicious extension,” which also noted the presence of the script get-userprttoken.ps1 and
      referenced the account with SID S-0-6-5. Investigators suspect this is part of a larger human-operated ransomware campaign.'
    question: 'During the same incident, a separate alert states that a ransomware payload was remotely launched on another
      device. What is the Azure AD device ID (AadDeviceId) of that second device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bc00e484-d0e5-4da4-9472-95568cccc07e'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bc00e484-d0e5-4da4-9472-95568cccc07e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Possible ransomware activity was detected with many files being appended with a known malicious 
          extension coming from ip.Address `99.83.111.100`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, a ransomware payload was remotely launched on host.AadDeviceId 
          `bc00e484-d0e5-4da4-9472-95568cccc07e`, confirming the attack progression.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
