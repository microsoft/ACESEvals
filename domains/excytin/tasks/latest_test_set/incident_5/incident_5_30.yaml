tasks:
- task_id: incident_5_latest_test_set_task_30
  title: incident_5_latest_test_set_task_30
  description: 'Which user account (email address) was associated with the blocked SMB lateral-movement attempt on 2024-07-10?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, an account identified as "dp5hn" launched the command ''curl http://vectorsandarrows.com''
      (process ID 88) on a device that triggered a "CommandAndControl" malware alert for potential lateral movement. A few
      days later, attack-disruption controls automatically blocked an attempt to create, delete, or modify files over SMB
      across multiple devices, indicating another lateral-movement effort.'
    question: 'Which user account (email address) was associated with the blocked SMB lateral-movement attempt on 2024-07-10?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'Grace Chen@vnevado.alpineskihouse.co'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'Grace Chen@vnevado.alpineskihouse.co'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-04 22:35:02 UTC, ‘CommandAndControl’ malware was detected during lateral movement on the
          host whose AadDeviceId is `e5799261-6720-4297-961e-bd9ca4275033`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-10 11:24:45 UTC, an attacker’s lateral-movement attempt over SMB was blocked; it 
          originated from the account with Email `Grace Chen@vnevado.alpineskihouse.co`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
