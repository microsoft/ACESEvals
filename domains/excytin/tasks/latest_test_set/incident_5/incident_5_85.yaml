tasks:
- task_id: incident_5_latest_test_set_task_85
  title: incident_5_latest_test_set_task_85
  description: 'According to the “Suspicious WMI process creation” alert that occurred immediately after the C2 activity,
    what is the name of the executable that was launched via WMI?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024, at 22:35:01 UTC, Defender blocked Command-and-Control behaviour associated with the
      URL ‘http://vectorsandarrows.com/’. Just one second later, a follow-up alert titled “Suspicious WMI process creation”
      was raised on the same machine, indicating that malware may have used Windows Management Instrumentation (WMI) to spawn
      an additional process.'
    question: 'According to the “Suspicious WMI process creation” alert that occurred immediately after the C2 activity, what
      is the name of the executable that was launched via WMI?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vssblatemp.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'A Command and Control attempt was blocked that involved the account (Name: `dp5hn`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, a suspicious WMI-spawned process (ExtractedFileName: `vssblatemp.exe`) was created on
          the host.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
