tasks:
- task_id: incident_5_latest_test_set_task_29
  title: incident_5_latest_test_set_task_29
  description: 'Immediately after these events, Defender raised an alert for possible lateral movement to another device.
    According to that alert, what IP address was involved in the suspected lateral movement?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, a C2-related alert was raised when the process with command line "curl http://vectorsandarrows.com"
      (PID 5572) executed on host vnevado-win11u (AAD device ID bc00e484-d0e5-4da4-9472-95568cccc07e). This Command-and-Control
      behavior was blocked, indicating an active malware attempt on the machine. A few seconds later, additional suspicious
      activity—including tampering with system-recovery settings—was observed on the same device, suggesting the attacker
      might be preparing the system for further compromise or data destruction.'
    question: 'Immediately after these events, Defender raised an alert for possible lateral movement to another device. According
      to that alert, what IP address was involved in the suspected lateral movement?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '83.162.58.168'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '83.162.58.168'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The account (Field: Name) with value `dp5hn` was involved in Command and Control behavior that was blocked.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The host (Field: AadDeviceId) with value `e5799261-6720-4297-961e-bd9ca4275033` experienced system-recovery-setting
          tampering.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Possible lateral movement was detected toward the IP (Field: Address) with value `83.162.58.168`.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
