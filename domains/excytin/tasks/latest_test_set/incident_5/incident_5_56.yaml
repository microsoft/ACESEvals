tasks:
- task_id: incident_5_latest_test_set_task_56
  title: incident_5_latest_test_set_task_56
  description: 'Which URL was identified and blocked in the "Command and Control behavior was blocked" alert that is linked
    to the Manatee Tempest activity on host "vnevado-win10r"?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into activity attributed to the Russia-based threat actor Manatee Tempest,
      we observed a process launched via curl from host "vnevado-win10r" (device ID 9d4887ba-0b69-47d6-89bc-9b32787f379e)
      that attempted to contact an external website. This occurred just moments before Defender generated a separate alert
      indicating that command-and-control behaviour had been blocked, suggesting the same destination was involved in both
      events.'
    question: 'Which URL was identified and blocked in the "Command and Control behavior was blocked" alert that is linked
      to the Manatee Tempest activity on host "vnevado-win10r"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Manatee Tempest activity was tied to the account with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Command-and-control traffic was blocked from the malicious Url `http://vectorsandarrows.com/`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
