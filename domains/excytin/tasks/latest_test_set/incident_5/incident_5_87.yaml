tasks:
- task_id: incident_5_latest_test_set_task_87
  title: incident_5_latest_test_set_task_87
  description: 'According to the ransomware-launch alert at 22:35:02 UTC, what is the SID of the account that initiated the
    remote payload execution?'
  inherit_shared: true
  initial_context:
    incident_context: 'Investigation began with a network alert flagging IP address 83.162.58.168 for possible lateral movement
      activity at 22:35:01 UTC on 2024-07-04. Just one second later, a separate alert reported that a ransomware payload was
      remotely launched on the target device, suggesting the attacker may have successfully moved laterally and executed malicious
      code.'
    question: 'According to the ransomware-launch alert at 22:35:02 UTC, what is the SID of the account that initiated the
      remote payload execution?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840191660-8534830288-125585561-1522'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Lateral movement activity was detected on host `vnevado-win11t` (Field: HostName, Value: vnevado-win11t).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Shortly after, ransomware was remotely launched by the account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`
          (Field: Sid, Value: S-1-5-21-1840191660-8534830288-125585561-1522).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
