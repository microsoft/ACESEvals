tasks:
- task_id: incident_5_latest_test_set_task_11
  title: incident_5_latest_test_set_task_11
  description: 'According to the ransomware-like behavior alert that followed the recovery-setting tampering, what is the
    name of the suspicious file associated with the activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a system-recovery-setting tampering alert, analysts observed the executable
      "vssblatemp.exe" deleting volume-shadow copies and a "bcdedit" command disabling Windows recovery features on an endpoint.
      Just seconds later, Microsoft Defender raised a second alert indicating that the same endpoint was now exhibiting ransomware-like
      behavior and attempting to spread laterally. Analysts need to identify the malicious file referenced in this ransomware-behavior
      alert to assess its impact and begin containment.'
    question: 'According to the ransomware-like behavior alert that followed the recovery-setting tampering, what is the name
      of the suspicious file associated with the activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:01.158784+00:00, the device with AadDeviceId 
          `e5799261-6720-4297-961e-bd9ca4275033` was observed tampering with system-recovery settings, potentially to 
          impede future restoration efforts.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Two seconds later (2024-07-04 22:35:03.888143+00:00), a file named `characterical.zip` was detected
          exhibiting ransomware-like behavior on the compromised assets, indicating possible malicious encryption 
          activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
