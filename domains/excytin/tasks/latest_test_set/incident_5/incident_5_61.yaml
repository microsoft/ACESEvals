tasks:
- task_id: incident_5_latest_test_set_task_61
  title: incident_5_latest_test_set_task_61
  description: 'According to the "Possible lateral movement" alert raised on 2024-07-04, what IP address is linked to the
    suspicious lateral-movement activity?'
  inherit_shared: true
  initial_context:
    incident_context: ''
    question: 'According to the "Possible lateral movement" alert raised on 2024-07-04, what IP address is linked to the suspicious
      lateral-movement activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '38.142.109.10'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '38.142.109.10'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Device exhibiting ransomware-like behavior detected: AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Possible lateral movement observed from IP address `38.142.109.10`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
