tasks:
- task_id: incident_5_latest_test_set_task_40
  title: incident_5_latest_test_set_task_40
  description: 'For the "Possible attempt to access Primary Refresh Token (PRT)" alert raised at 22:35:01 UTC on 2024-07-04,
    what is the Azure AD user ID (AadUserId) of the account linked to this suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of ransomware-like activity on host vnevado-win11t (device ID e5799261-6720-4297-961e-bd9ca4275033)
      at 22:35 UTC on 2024-07-04, Microsoft Defender raised an alert titled "Suspicious ''GenRansom'' behavior was detected."
      Just seconds earlier, another alert indicated a "Possible attempt to access Primary Refresh Token (PRT)," suggesting
      that an attacker may have tried to steal authentication tokens for lateral movement or credential theft.'
    question: 'For the "Possible attempt to access Primary Refresh Token (PRT)" alert raised at 22:35:01 UTC on 2024-07-04,
      what is the Azure AD user ID (AadUserId) of the account linked to this suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '731adb71-b11c-4bbf-850b-57989b350e96'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '731adb71-b11c-4bbf-850b-57989b350e96'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The host with HostName `vnevado-win11t` exhibited suspicious 'GenRansom' behavior, suggesting 
          active malware activity on the machine.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: An account identified by AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` attempted to access a 
          Primary Refresh Token (PRT), indicating a potential credential-theft or lateral-movement attempt.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
