tasks:
- task_id: incident_5_latest_test_set_task_69
  title: incident_5_latest_test_set_task_69
  description: 'According to the "Malicious credential theft tool execution detected" alert, which external IP address was
    involved in this credential theft attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation on host ''vnevado-win11u'' (device ID: bc00e484-d0e5-4da4-9472-95568cccc07e),
      several concerning events were observed on 2024-07-04. The ‘Suspicious remote activity’ alert showed commands such as
      disabling recovery (`bcdedit /set recoveryenabled no`), ignoring boot failures, deleting shadow copies with `vssblatemp.exe`,
      and fetching content with `curl http://vectorsandarrows.com`. Immediately afterward, the system raised a separate alert
      titled “Malicious credential theft tool execution detected,” indicating that a known credential-dumping utility had
      run on the same machine.'
    question: 'According to the "Malicious credential theft tool execution detected" alert, which external IP address was
      involved in this credential theft attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'The attacker initiated suspicious remote activity from IP address (Address: 99.83.111.100) on 2024-07-04
          22:35:01 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Seconds later, a malicious credential-theft tool was executed from a different source IP (Address: 107.224.99.179)
          on 2024-07-04 22:35:02 UTC, indicating an attempt to dump credentials.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On 2024-07-10 11:24:45 UTC, the threat actor leveraged those stolen credentials to move laterally with
          PsExec to the jump server (Account Name: tgs2z).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
