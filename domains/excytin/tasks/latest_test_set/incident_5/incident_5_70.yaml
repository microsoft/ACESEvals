tasks:
- task_id: incident_5_latest_test_set_task_70
  title: incident_5_latest_test_set_task_70
  description: 'During the follow-up investigation, Microsoft Defender generated a separate alert named “Possible lateral
    movement.” According to that alert, what IP address was involved in the suspected lateral movement activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4 2024, Microsoft Defender raised an alert titled “Unknown malware was detected and was active.”
      Analysis of the device showed multiple executions of “mimikatz.exe” spawning child processes such as notepad.exe and
      cmd.exe, indicating that the attacker was attempting to extract or leverage credentials. This initial alert suggests
      the machine may already have been compromised and is now being used as a foothold for further malicious activity, such
      as lateral movement inside the environment.'
    question: 'During the follow-up investigation, Microsoft Defender generated a separate alert named “Possible lateral movement.”
      According to that alert, what IP address was involved in the suspected lateral movement activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '83.162.58.168'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '83.162.58.168'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: An unknown malware became active under account AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` on 
          2024-07-04 22:35:01, indicating initial compromise.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Almost simultaneously, suspicious network activity originated from IP Address `83.162.58.168`, 
          suggesting the attacker began probing for lateral-movement opportunities.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'Six days later, on 2024-07-10 11:24:45, the attacker used PSExec from IP Address `99.83.111.100` to
          target the jump server (alert: “PSExec to Vnevado-jump”), representing a successful step in lateral movement.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: During the same minute, an attempt to access files over SMB was automatically blocked on device 
          AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`, showing that the attacker’s lateral move reached this 
          specific host but was contained.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
