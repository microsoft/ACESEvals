tasks:
- task_id: incident_5_latest_test_set_task_65
  title: incident_5_latest_test_set_task_65
  description: 'In the "Active unknown malware was detected" alert raised at 22:35:03 UTC on 2024-07-04, what is the name
    of the executable file that was identified as the active malware?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation, we observed that access to the URL "http://vectorsandarrows.com/" triggered
      an alert titled "Command and Control behavior was blocked" on 2024-07-04 at 22:35:01 UTC. A few seconds later, additional
      alerts followed, including "Suspicious remote activity" and a lateral-movement alert "PSExec to Vnevado-jump." Roughly
      two seconds after the first alert, Defender raised another alert called "Active unknown malware was detected," indicating
      that a malicious executable was currently active on the host.'
    question: 'In the "Active unknown malware was detected" alert raised at 22:35:03 UTC on 2024-07-04, what is the name of
      the executable file that was identified as the active malware?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Command and control behavior was blocked for the account with Sid 
          `S-1-5-21-1840191660-8534830288-125585561-1522` (2024-07-04 22:35:01 UTC).
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Almost simultaneously, suspicious remote activity originated from the IP Address `99.83.111.100`, 
          indicating an external controller attempting to interact with the machine (2024-07-04 22:35:01 UTC).
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: Two seconds later, the file named `mimikatz.exe` was detected running, confirming the presence of 
          active credential-dumping malware on the host (2024-07-04 22:35:03 UTC).
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Six days afterward, lateral movement was observed when PSExec connected to the jump-server whose 
          AadDeviceId is `4d8d23e9-a77d-4e33-9435-b8c457e57ca1`, suggesting the attacker used credentials harvested by 
          the earlier mimikatz infection (2024-07-10 11:24:45 UTC).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
