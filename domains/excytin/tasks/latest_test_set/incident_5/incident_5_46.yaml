tasks:
- task_id: incident_5_latest_test_set_task_46
  title: incident_5_latest_test_set_task_46
  description: 'According to the PRT-access alert, what is the host name of the device where the possible Primary Refresh
    Token attack occurred?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4th, a user account was suspected of dropping ransomware-related files—including ponceau.7z,
      get-userprttoken.ps1 and others—onto the workstation vnevado-win11u. Less than a second later, a related alert signaled
      a possible attempt to access a Primary Refresh Token (PRT) on a different machine in the same incident.'
    question: 'According to the PRT-access alert, what is the host name of the device where the possible Primary Refresh Token
      attack occurred?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11t'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11t'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A user account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was observed dropping 
          ransomware-related files, indicating the account may be compromised.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, a possible attempt to access a Primary Refresh Token (PRT) was detected on host 
          `vnevado-win11t`, suggesting the attacker is trying to expand access or maintain persistence on this machine.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
