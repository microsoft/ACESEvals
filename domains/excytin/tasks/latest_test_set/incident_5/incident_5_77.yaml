tasks:
- task_id: incident_5_latest_test_set_task_77
  title: incident_5_latest_test_set_task_77
  description: 'According to the follow-up alert about the possible attempt to access a Primary Refresh Token, which executable
    was reported as participating in that suspicious activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a system-recovery-setting tampering alert, we observed the use of native
      Windows utilities such as "vssblatemp.exe delete shadows /all" and the command "bcdedit /set recoveryenabled no"—actions
      typically meant to hinder restoration and backup options on an affected device. Shortly after this tampering activity,
      Microsoft Defender raised another alert indicating a possible attempt to access a Primary Refresh Token (PRT), suggesting
      the attacker might be pivoting from destructive activity to credential theft or lateral movement.'
    question: 'According to the follow-up alert about the possible attempt to access a Primary Refresh Token, which executable
      was reported as participating in that suspicious activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'browsercore.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'browsercore.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'System recovery settings were tampered with on host `vnevado-win10s` (entity field: HostName, value:
          `vnevado-win10s`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A possible attempt to access a Primary Refresh Token (PRT) was observed originating from the process
          `browsercore.exe` (entity field: ExtractedFileName, value: `browsercore.exe`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
