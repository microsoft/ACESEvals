tasks:
- task_id: incident_5_latest_test_set_task_35
  title: incident_5_latest_test_set_task_35
  description: 'What is the name of the file that was detected as unknown malware in the follow-up alert on vnevado-win11u?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed that, on 2024-07-04 at 22:35:01 UTC, a ransomware payload was
      remotely launched on the workstation vnevado-win11u while the signed-in user account was dp5hn (SID S-1-5-21-1840191660-8534830288-125585561-1522).
      This was quickly followed by lateral-movement activity using PSExec toward the jump server. Shortly after the ransomware
      launch, Microsoft Defender raised another alert on the same device stating that an unknown piece of malware was active.'
    question: 'What is the name of the file that was detected as unknown malware in the follow-up alert on vnevado-win11u?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimilib.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimilib.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Ransomware payload was remotely launched from IP address `99.83.111.100` (Field: Address, Type: ip).'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'The attacker then used PSExec for lateral movement to the jump-server `vnevado-win10v` (Field: HostName,
          Type: host).'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'On the compromised host, the malicious file `mimilib.dll` was detected as active (Field: Name, Type:
          file).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
