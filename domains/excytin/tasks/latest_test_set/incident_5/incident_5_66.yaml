tasks:
- task_id: incident_5_latest_test_set_task_66
  title: incident_5_latest_test_set_task_66
  description: 'According to the "Suspicious WMI process creation" alert observed immediately after the Manatee Tempest activity,
    what is the name of the script file that was executed via WMI on host "vnevado-win10r"?'
  inherit_shared: true
  initial_context:
    incident_context: 'As part of the investigation into the "Manatee Tempest" activity on July 4, 2024, security telemetry
      showed that the endpoint vnevado-win10r (device ID 9d4887ba-0b69-47d6-89bc-9b32787f379e) executed the command `curl
      http://vectorsandarrows.com`, reaching out to the external IP 198.43.121.209. This behavior triggered an alert associating
      the activity with the Russia-based Manatee Tempest threat group, known for leveraging drive-by downloads and WMI-based
      techniques for further compromise. Moments later, the same machine raised an alert for a suspicious WMI-spawned process,
      suggesting a follow-on malicious script execution.'
    question: 'According to the "Suspicious WMI process creation" alert observed immediately after the Manatee Tempest activity,
      what is the name of the script file that was executed via WMI on host "vnevado-win10r"?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'get-userprttoken.ps1'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'get-userprttoken.ps1'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account with Name `dp5hn` was flagged in the alert about the Manatee Tempest activity group.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious WMI-spawned process with ExtractedFileName `get-userprttoken.ps1` was subsequently 
          detected on the host.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
