tasks:
- task_id: incident_5_latest_test_set_task_42
  title: incident_5_latest_test_set_task_42
  description: 'According to the follow-up alert that flagged a suspicious WMI process creation, what is the name of the executable
    that was started through WMI?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident started with a possible attempt to access a Primary Refresh Token (PRT). The activity
      was observed on 2024-07-04 at 22:35:01 UTC when the process "browsercore.exe" (PID 2676) was launched. Such PRT-access
      attempts can enable lateral movement or credential theft. Only two seconds later, another alert in the same incident
      reported a suspicious process spawned via Windows Management Instrumentation (WMI).'
    question: 'According to the follow-up alert that flagged a suspicious WMI process creation, what is the name of the executable
      that was started through WMI?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vssblatemp.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: HostName `vnevado-win10s` showed a possible attempt to access a Primary Refresh Token (PRT).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A WMI-spawned process with ExtractedFileName `vssblatemp.exe` was then created, indicating 
          suspicious activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
