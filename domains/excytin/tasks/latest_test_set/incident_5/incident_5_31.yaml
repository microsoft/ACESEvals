tasks:
- task_id: incident_5_latest_test_set_task_31
  title: incident_5_latest_test_set_task_31
  description: 'According to the "Manatee Tempest activity group" alert in this incident, what external IP address was associated
    with the actor’s activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a lateral-movement alert titled "PSExec to Vnevado-jump", the user account
      tgs2z (email tgs2z@vnevado.alpineskihouse.co) was observed launching notepad.exe from host vnevado-win10v (device ID
      4d8d23e9-a77d-4e33-9435-b8c457e57ca1). The activity originated from the internal IP address 141.216.110.153 and appears
      linked to subsequent ransomware activity detected a few days earlier. That earlier chain culminated in an alert identifying
      the threat actor "Manatee Tempest", which is known for delivering Cobalt Strike beacons and deploying ransomware after
      partnering with an access broker.'
    question: 'According to the "Manatee Tempest activity group" alert in this incident, what external IP address was associated
      with the actor’s activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A ransomware payload was remotely launched by the account with field `Sid` value 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The activity was tied to the Manatee Tempest threat actor using the IP with field `Address` value 
          `198.43.121.209`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Subsequently, the attacker executed PSExec from the IP with field `Address` value `99.83.111.100`, 
          achieving lateral movement to the jump server `vnevado-jump`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
