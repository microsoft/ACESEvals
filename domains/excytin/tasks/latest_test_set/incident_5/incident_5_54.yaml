tasks:
- task_id: incident_5_latest_test_set_task_54
  title: incident_5_latest_test_set_task_54
  description: 'Later in the sequence, Microsoft Defender blocked outbound Command-and-Control traffic generated by the malware.
    What was the destination URL that was blocked?'
  inherit_shared: true
  initial_context:
    incident_context: 'Investigation has revealed that an attacker ran several renamed Sysinternals tools and Mimikatz-like
      commands on a host, suggesting privilege escalation activity. The initial alert ("Windows Sysinternals tool renamed")
      was raised on 2024-07-04 at 22:35 UTC after the suspicious executable was launched. Follow-on alerts in the same incident
      point to lateral movement toward the jump server and ransomware-style behavior across multiple devices.'
    question: 'Later in the sequence, Microsoft Defender blocked outbound Command-and-Control traffic generated by the malware.
      What was the destination URL that was blocked?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: On 2024-07-04 22:35:02 UTC, the attacker used a renamed Windows Sysinternals tool while signed in 
          with account AadUserId `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`, indicating an attempt to hide malicious 
          activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: On 2024-07-10 11:24:45 UTC, the threat actor leveraged PSExec from IP address `99.83.111.100` to 
          access the Vnevado-jump server, showing lateral-movement behavior.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: The host identified by AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033` then exhibited 
          ransomware-like activity, confirming that the attacker compromised this device.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: A subsequent attempt to communicate with the command-and-control URL `http://vectorsandarrows.com/`
          was blocked at 2024-07-04 22:35:03 UTC, disrupting the attacker’s control channel.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
