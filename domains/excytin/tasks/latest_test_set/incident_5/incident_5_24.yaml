tasks:
- task_id: incident_5_latest_test_set_task_24
  title: incident_5_latest_test_set_task_24
  description: 'Identify the name of the executable that was started on host "vnevado-win11t" at the moment the "Possible
    attempt to access Primary Refresh Token (PRT)" alert was raised.'
  inherit_shared: true
  initial_context:
    incident_context: 'While investigating the sequence of alerts beginning with suspicious ransomware-like activity on the
      workstation "vnevado-win11t", security telemetry later flagged a "Possible attempt to access Primary Refresh Token (PRT)"
      only seconds after the initial ransomware alert. Analysts noted that a single process started on the device exactly
      at the time of the PRT alert and may have facilitated the credential-theft attempt. Details of that process have not
      yet been documented in the case notes.'
    question: 'Identify the name of the executable that was started on host "vnevado-win11t" at the moment the "Possible attempt
      to access Primary Refresh Token (PRT)" alert was raised.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'browsercore.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'browsercore.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Ransomware-like file system activity was observed on host HostName `vnevado-win11t`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Almost immediately afterwards, a ransomware payload was remotely launched by the account Name 
          `dp5hn`.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: A related alert shows process ProcessId__CreatedTimeUtc__CommandLine 
          `2676__2024-06-20t09:10:59.867384z__"browsercore.exe"` attempting to access the Primary Refresh Token (PRT), 
          indicating possible lateral movement or credential theft.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
