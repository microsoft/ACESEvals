tasks:
- task_id: incident_5_latest_test_set_task_83
  title: incident_5_latest_test_set_task_83
  description: 'According to the "Malicious credential theft tool execution detected" alert raised at 22:35:02 UTC on 2024-07-04,
    which external IP address was involved in this credential-dumping activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a series of related alerts, analysts noted a "Suspicious remote activity"
      on 2024-07-04 involving host device f5b847aa-8712-4bf6-b4f7-ed6cd89e1505. The activity was carried out under the account
      "dp5hn" (AadUserId 731adb71-b11c-4bbf-850b-57989b350e96) and included multiple potentially harmful commands such as
      disabling Windows recovery ("bcdedit /set recoveryenabled no"), tampering with VSS snapshots ("vssblatemp.exe delete
      shadows /all"), and issuing a curl request to an external site. This remote activity is believed to have facilitated
      further malicious actions, culminating only seconds later in a separate alert titled "Malicious credential theft tool
      execution detected," indicating an attempt to dump credentials on the same endpoint.'
    question: 'According to the "Malicious credential theft tool execution detected" alert raised at 22:35:02 UTC on 2024-07-04,
      which external IP address was involved in this credential-dumping activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: Suspicious remote activity originated from ip.Address `99.83.111.100` on 2024-07-04, indicating an 
          external foothold.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Shortly after, a malicious credential-theft tool was executed from ip.Address `107.224.99.179`, 
          showing the attacker harvesting credentials.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: With the stolen credentials, the attacker later used account.AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` on 2024-07-10 to run PSExec and move laterally to the jump server 
          Vnevado-jump.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
