tasks:
- task_id: incident_5_latest_test_set_task_94
  title: incident_5_latest_test_set_task_94
  description: 'In the alert about assets showing ransomware-like behavior, investigators found a suspicious archive involved
    in the activity. What is the exact name of that archive file?'
  inherit_shared: true
  initial_context:
    incident_context: 'A security incident was triggered after multiple unusual commands such as "vssblatemp.exe delete shadows
      /all" and other PowerShell and bcdedit modifications were executed on host vnevado-win10r (device ID 9d4887ba-0b69-47d6-89bc-9b32787f379e).
      This activity led to a start alert titled "Suspicious WMI process creation," suggesting that malware was spawning new
      processes on the machine to evade detection. Shortly afterward, another alert indicated that compromised assets were
      exhibiting ransomware-like behavior on the network.'
    question: 'In the alert about assets showing ransomware-like behavior, investigators found a suspicious archive involved
      in the activity. What is the exact name of that archive file?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account identified by AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` was involved in a 
          suspicious WMI process creation event.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Following this, the file with Name `characterical.zip` was detected on assets showing 
          ransomware-like behavior.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
