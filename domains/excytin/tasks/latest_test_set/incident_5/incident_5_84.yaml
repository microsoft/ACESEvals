tasks:
- task_id: incident_5_latest_test_set_task_84
  title: incident_5_latest_test_set_task_84
  description: 'Which executable was launched to delete all volume shadow copies during the "System recovery setting tampering"
    alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a ransomware-like outbreak on device "vnevado-win11u" (AadDeviceId: bc00e484-d0e5-4da4-9472-95568cccc07e,
      IP 99.83.111.100), several suspicious files such as "unstreaming.xlsx.lockbit" and "syncretic.7z" were detected. The
      alert titled "Potentially compromised assets exhibiting ransomware-like behavior" indicates that an attacker may have
      gained a foothold and is attempting to disable recovery capabilities across the system. Shortly before this, a second
      alert reported that someone tampered with the system’s recovery settings in order to remove volume shadow copies and
      hinder future restoration.'
    question: 'Which executable was launched to delete all volume shadow copies during the "System recovery setting tampering"
      alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vssblatemp.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vssblatemp.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'The alert shows that the user account with Field: Name, Value: `dp5hn` is exhibiting ransomware-like
          behavior across multiple devices.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A malicious process with Field: ProcessId__CreatedTimeUtc__CommandLine, Value: `7236__2024-06-20t09:10:51.2193152z__vssblatemp.exe
          delete shadows /all` was executed, tampering with system-recovery settings by deleting all volume shadow copies.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
