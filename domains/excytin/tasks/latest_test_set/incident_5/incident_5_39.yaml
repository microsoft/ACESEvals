tasks:
- task_id: incident_5_latest_test_set_task_39
  title: incident_5_latest_test_set_task_39
  description: 'According to the Manatee Tempest alert raised moments after the shadow-copy deletion, what IP address was
    identified as related to the threat actor’s activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a ransomware-related incident, we observed that on July 4 2024 a process
      named "vssblatemp.exe" executed the command "vssblatemp.exe delete shadows /all" on host "vnevado-win11t" (device ID
      e5799261-6720-4297-961e-bd9ca4275033). This activity triggered the alert "File backups were deleted", which is commonly
      associated with ransomware operators attempting to inhibit recovery. A short time later, another alert tied to the same
      timeline identified activity attributed to the Russia-based threat group Manatee Tempest.'
    question: 'According to the Manatee Tempest alert raised moments after the shadow-copy deletion, what IP address was identified
      as related to the threat actor’s activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The alert shows that all file snapshots and shadow copies were deleted, carried out by the account 
          with Name `dp5hn`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The Manatee Tempest actor’s activity is observed communicating with the IP Address 
          `198.43.121.209`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
