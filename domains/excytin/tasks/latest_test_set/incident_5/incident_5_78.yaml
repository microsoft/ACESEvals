tasks:
- task_id: incident_5_latest_test_set_task_78
  title: incident_5_latest_test_set_task_78
  description: 'According to the related "Possible attempt to access Primary Refresh Token (PRT)" alert raised at 22:35:00
    UTC, which external IP address was implicated in the attempted PRT access?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a suspicious WMI-initiated process chain on 2024-07-04, we observed several
      commands executed within seconds of each other, including deletion of shadow copies ("vssblatemp.exe delete shadows
      /all"), tampering with boot configuration ("bcdedit /set" commands), and a PowerShell script invocation ("get-userprttoken.ps1").
      This activity triggered a "Suspicious WMI process creation" alert at 22:35:02 UTC. Just moments earlier, Microsoft Defender
      also raised a "Possible attempt to access Primary Refresh Token (PRT)" alert, suggesting an attacker may have tried
      to steal authentication tokens to enable lateral movement or credential theft.'
    question: 'According to the related "Possible attempt to access Primary Refresh Token (PRT)" alert raised at 22:35:00
      UTC, which external IP address was implicated in the attempted PRT access?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '107.224.99.179'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '107.224.99.179'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious WMI process creation was observed involving the user with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: An attempt to access a Primary Refresh Token (PRT) was detected via the process `browsercore.exe` 
          (ExtractedFileName).
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The PRT-related activity originated from the external IP address `107.224.99.179` (Address).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
