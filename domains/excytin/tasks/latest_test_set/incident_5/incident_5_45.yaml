tasks:
- task_id: incident_5_latest_test_set_task_45
  title: incident_5_latest_test_set_task_45
  description: 'In the "Command and Control behavior was blocked" alert generated at 22:35:01 UTC on 2024-07-04, which exact
    URL was identified as the command-and-control endpoint?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 at 22:35 UTC, Microsoft Defender flagged the hack-tool Mimikatz on a device after detecting
      the DLL named "mimilib.dll". A few seconds later, a follow-up alert reported that outbound command-and-control activity
      from the same investigation was blocked, suggesting the attacker attempted to reach an external infrastructure.'
    question: 'In the "Command and Control behavior was blocked" alert generated at 22:35:01 UTC on 2024-07-04, which exact
      URL was identified as the command-and-control endpoint?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 2024-07-04 22:35:00 UTC – The host identified by field AadDeviceId 
          `4d8d23e9-a77d-4e33-9435-b8c457e57ca1` was detected running the Mimikatz credential-theft tool.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 2024-07-04 22:35:01 UTC – A Command-and-Control attempt to the URL `http://vectorsandarrows.com/` 
          (field Url) was blocked, showing the malware on the same device was already trying to communicate out.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 2024-07-04 22:35:03 UTC – The attacker, operating with the compromised account whose field Sid is 
          `S-1-5-21-1840191660-8534830288-125585561-1522`, began ransomware-like activity across other assets.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 2024-07-10 11:24:45 UTC – Lateral movement was observed when PSExec connected to the jump server 
          through the IP address `99.83.111.100` (field Address), confirming the attacker’s spread inside the network.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
