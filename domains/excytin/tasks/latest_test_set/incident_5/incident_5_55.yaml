tasks:
- task_id: incident_5_latest_test_set_task_55
  title: incident_5_latest_test_set_task_55
  description: 'According to the "Suspicious access to LSASS service" alert, which DLL file was used during the attempted
    credential theft from LSASS?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a ransomware-like incident on host "vnevado-win11t", the user account "dp5hn"
      was observed running several files (e.g., get-userprttoken.ps1, characterical.zip) just before multiple alerts were
      triggered. One of those alerts, titled "Suspicious access to LSASS service", indicates that an attacker may have attempted
      to dump credentials from memory immediately after the ransomware-style behaviors were detected. The specific file involved
      in that LSASS access was not yet identified in the initial triage.'
    question: 'According to the "Suspicious access to LSASS service" alert, which DLL file was used during the attempted credential
      theft from LSASS?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'hid.dll'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'hid.dll'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: A potentially compromised asset communicated with the suspicious IP address having Address 
          `99.83.111.100`.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: Lateral movement was then performed via PSExec by a user account with AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` toward the jump server.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: Finally, the attacker attempted to dump credentials by accessing LSASS with the malicious DLL file 
          Name `hid.dll`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
