tasks:
- task_id: incident_5_latest_test_set_task_14
  title: incident_5_latest_test_set_task_14
  description: 'Separate from this Manatee Tempest activity, a related alert reported a possible attempt to access a Primary
    Refresh Token (PRT). What is the AAD Device ID of the host implicated in that PRT-access attempt?'
  inherit_shared: true
  initial_context:
    incident_context: 'During investigation of activity attributed to the Manatee Tempest threat group, we observed host "vnevado-win11t"
      (AAD Device ID e5799261-6720-4297-961e-bd9ca4275033) issuing a command (`curl http://vectorsandarrows.com`) to the IP
      198.43.121.209, suggesting potential command-and-control communication established via the malicious domain vectorsandarrows.com.'
    question: 'Separate from this Manatee Tempest activity, a related alert reported a possible attempt to access a Primary
      Refresh Token (PRT). What is the AAD Device ID of the host implicated in that PRT-access attempt?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '9d4887ba-0b69-47d6-89bc-9b32787f379e'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '9d4887ba-0b69-47d6-89bc-9b32787f379e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Account Name `dp5hn` was identified in malicious activity attributed to the Russia-based group 
          Manatee Tempest.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Host AadDeviceId `9d4887ba-0b69-47d6-89bc-9b32787f379e` showed a possible attempt to access a 
          Primary Refresh Token, indicating credential-theft or lateral-movement activity.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
