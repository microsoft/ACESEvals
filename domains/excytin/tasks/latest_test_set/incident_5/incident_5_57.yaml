tasks:
- task_id: incident_5_latest_test_set_task_57
  title: incident_5_latest_test_set_task_57
  description: 'Identify the security identifier (SID) of the account that carried out these system-recovery–disabling commands
    on the device.'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into suspicious activity on host ''vnevado-win11u'', we observed that the user
      account ''dp5hn'' (AadUserId 731adb71-b11c-4bbf-850b-57989b350e96) executed native Windows utilities such as ''vssblatemp.exe''
      and ''bcdedit.exe'' in quick succession. The commands issued (for example, ''vssblatemp.exe delete shadows /all'' and
      ''bcdedit /set recoveryenabled no'') indicate an attempt to tamper with system-recovery settings—an established technique
      used by adversaries to disable backups and hinder recovery efforts.'
    question: 'Identify the security identifier (SID) of the account that carried out these system-recovery–disabling commands
      on the device.'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840191660-8534830288-125585561-1522'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 1.0
        weight: 1.0
        title: Checkpoint 1
        description: System recovery setting tampering was detected, carried out by the account with Sid 
          `S-1-5-21-1840191660-8534830288-125585561-1522`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
