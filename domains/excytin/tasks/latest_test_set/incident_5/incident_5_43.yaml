tasks:
- task_id: incident_5_latest_test_set_task_43
  title: incident_5_latest_test_set_task_43
  description: 'During the subsequent "System recovery setting tampering" alert, what exact Windows command was executed to
    disable the operating system’s recovery feature?'
  inherit_shared: true
  initial_context:
    incident_context: 'A ransomware payload was remotely launched on a device in our environment at 22:35 UTC, originating
      from the external IP address 99.83.111.100. This activity suggests an attempt to encrypt data and disrupt normal operations.
      Investigators should note that disabling built-in recovery mechanisms often follows such attacks, as adversaries seek
      to hinder remediation efforts.'
    question: 'During the subsequent "System recovery setting tampering" alert, what exact Windows command was executed to
      disable the operating system’s recovery feature?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bcdedit /set recoveryenabled no'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bcdedit /set recoveryenabled no'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A process tampered with system recovery by executing the command line `bcdedit /set recoveryenabled
          no` (ProcessId__CreatedTimeUtc__CommandLine = `4828__2024-06-20t09:31:59.6743318z__bcdedit /set 
          recoveryenabled no`).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, a ransomware payload was remotely launched by the account with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`, indicating a likely attempt to disable recovery before encryption.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
