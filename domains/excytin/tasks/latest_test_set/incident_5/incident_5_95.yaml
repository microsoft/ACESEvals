tasks:
- task_id: incident_5_latest_test_set_task_95
  title: incident_5_latest_test_set_task_95
  description: 'What was the process ID (PID) of the Mimikatz instance that ran the "sekurlsa::logonpasswords exit" command
    and triggered the related alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During our investigation we identified a malicious credential theft tool (Mimikatz) being launched
      on a host. One execution was started at 2024-06-20 09:03:47 UTC with process ID 2020 using the command line: "mimikatz.exe"
      privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co
      /run:..\notepad.exe //vnevado-jump cmd.exe" This activity triggered the alert “Malicious credential theft tool execution
      detected”. A second, related alert was raised a moment earlier for the same tool, this time executing the command that
      included "sekurlsa::logonpasswords exit" to dump credentials.'
    question: 'What was the process ID (PID) of the Mimikatz instance that ran the "sekurlsa::logonpasswords exit" command
      and triggered the related alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '1044'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '1044'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A process with ExtractedFileName `mimikatz.exe` was detected, indicating execution of the 
          credential-theft tool Mimikatz.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The process (field `ProcessId__CreatedTimeUtc__CommandLine`, value 
          `1044__2024-06-20t08:59:25.9440469z__"mimikatz.exe" privilege::debug sekurlsa::logonpasswords exit`) shows 
          that Process ID 1044 ran at 2024-06-20 08:59:25 UTC with the command line to dump logon passwords.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
