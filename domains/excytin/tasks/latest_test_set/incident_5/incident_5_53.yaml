tasks:
- task_id: incident_5_latest_test_set_task_53
  title: incident_5_latest_test_set_task_53
  description: 'According to the ransomware-related alert, what is the name of the file that was observed with the suspicious
    extension?'
  inherit_shared: true
  initial_context:
    incident_context: 'An investigation uncovered lateral movement activity to a jump server (alert titled "PSExec to Vnevado-jump"
      on 2024-07-10). The action was performed by account tgs2z (SID S-5-7-21-1843151660-3234030288-105586167-1422, email
      tgs2z@vnevado.alpineskihouse.co) from host vnevado-win10v, communicating over IP 141.216.110.153. Not long after, a
      separate alert reported that many files on another device suddenly received a file-extension commonly linked to ransomware
      campaigns, indicating possible mass encryption.'
    question: 'According to the ransomware-related alert, what is the name of the file that was observed with the suspicious
      extension?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'unstreaming.xlsx'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'unstreaming.xlsx'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Attackers initiated lateral movement by executing PSExec from the source IP address (Field: Address,
          Value: `99.83.111.100`) to the jump server.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Subsequently, possible ransomware activity was detected on the device as numerous files—including the
          file (Field: Name, Value: `unstreaming.xlsx`)—were modified to include a known malicious extension.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
