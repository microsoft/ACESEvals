tasks:
- task_id: incident_5_latest_test_set_task_22
  title: incident_5_latest_test_set_task_22
  description: 'In the related "File backups were deleted" alert, what Process ID (PID) was associated with the command that
    removed all shadow copies from the host?'
  inherit_shared: true
  initial_context:
    incident_context: 'Security telemetry shows that host "vnevado-win11u" (AAD device ID bc00e484-d0e5-4da4-9472-95568cccc07e)
      is exhibiting clear ransomware-like behavior: multiple files (for example, "unstreaming.xlsx.lockbit", "ponceau.7z.lockbit",
      "earlap.doc.lockbit") were encrypted and the activity came from IP 99.83.111.100 while running under the account SID
      S-0-6-5. In addition to the encryption activity, backups on the system were completely removed – a common step attackers
      take to prevent easy recovery.'
    question: 'In the related "File backups were deleted" alert, what Process ID (PID) was associated with the command that
      removed all shadow copies from the host?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '7236'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '7236'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Process: ProcessId__CreatedTimeUtc__CommandLine = `7236__2024-06-20t09:10:51.2193152z__vssblatemp.exe
          delete shadows /all` – this process executed the command to delete all VSS shadow copies and file snapshots, a common
          precursor to ransomware encryption.'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'Account: AadUserId = `731adb71-b11c-4bbf-850b-57989b350e96` – this user account is flagged as potentially
          compromised and is suspected of driving the ransomware-like behavior across multiple assets.'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
