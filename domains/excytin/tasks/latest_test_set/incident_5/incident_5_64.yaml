tasks:
- task_id: incident_5_latest_test_set_task_64
  title: incident_5_latest_test_set_task_64
  description: 'What is the Azure AD device ID of the host where the "Ransomware behavior detected in the file system" alert
    was raised?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an ongoing investigation, we observed a sequence of malicious actions that began on device "vnevado-win10r"
      (AadDeviceId 9d4887ba-0b69-47d6-89bc-9b32787f379e). The attacker first tampered with system-recovery settings by running
      commands such as "vssblatemp.exe delete shadows /all" and "bcdedit /set recoveryenabled no", presumably to hinder future
      restoration efforts. Moments later, a "Suspicious remote activity" alert indicated that another machine in the environment
      had been accessed remotely. Shortly after, Defender raised a "Ransomware behavior detected in the file system" alert
      on that remotely accessed machine, suggesting active mass-encryption activity.'
    question: 'What is the Azure AD device ID of the host where the "Ransomware behavior detected in the file system" alert
      was raised?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e5799261-6720-4297-961e-bd9ca4275033'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e5799261-6720-4297-961e-bd9ca4275033'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: 'Ransomware behavior was detected in the file system on the host (Field: AadDeviceId, Value: `e5799261-6720-4297-961e-bd9ca4275033`)
          at 2024-07-04 22:35:01.737130+00:00.'
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: 'Just seconds later, suspicious remote activity was observed on the same host (Field: AadDeviceId, Value:
          `e5799261-6720-4297-961e-bd9ca4275033`) at 2024-07-04 22:35:01.893209+00:00.'
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: 'Soon after, the account (Field: Name, Value: `dp5hn`) tampered with system recovery settings on that
          device at 2024-07-04 22:35:02.226256+00:00, likely to cripple recovery options in the wake of the ransomware activity.'
  scoring_aggregation:
