tasks:
- task_id: incident_5_latest_test_set_task_52
  title: incident_5_latest_test_set_task_52
  description: 'For the "System recovery setting tampering" alert, what is the SID of the account that performed the tampering?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed PsExec launching commands such as "cmd.exe" and "notepad.exe"
      (process IDs 8656, 6428, 6624) indicating remote execution activity. This activity was followed by lateral movement
      to a jump server and a ransomware payload being remotely launched. Shortly after, an alert titled "System recovery setting
      tampering" was raised, indicating that the attacker tried to disable Windows recovery mechanisms on the affected device.'
    question: 'For the "System recovery setting tampering" alert, what is the SID of the account that performed the tampering?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'S-1-5-21-1840191660-8534830288-125585561-1522'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'S-1-5-21-1840191660-8534830288-125585561-1522'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: At 2024-07-04 22:35:01 UTC an attacker used PsExec to launch a command on the remote device with 
          HostName=vnevado-win10v.
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: At 2024-07-04 22:35:02 UTC the attacker tampered with system-recovery settings while signed in 
          under the account Sid=S-1-5-21-1840191660-8534830288-125585561-1522.
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: At 2024-07-04 22:35:03 UTC a ransomware payload was remotely executed by the Azure AD account 
          AadUserId=731adb71-b11c-4bbf-850b-57989b350e96.
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
