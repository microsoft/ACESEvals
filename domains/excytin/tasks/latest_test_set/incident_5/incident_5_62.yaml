tasks:
- task_id: incident_5_latest_test_set_task_62
  title: incident_5_latest_test_set_task_62
  description: 'According to the related alert titled “Possible compromised user account delivering ransomware-related files”,
    what is the exact name of the ransomware file that the attacker’s account was seen dropping?'
  inherit_shared: true
  initial_context:
    incident_context: 'On 2024-07-04 a high-priority alert reported that multiple assets, including the device vnevado-win11t
      (AadDeviceId e5799261-6720-4297-961e-bd9ca4275033) and user account dp5hn (SID S-1-5-21-1840191660-8534830288-125585561-1522),
      were exhibiting ransomware-like behavior. The security platform noted that the same user or device might be moving laterally
      and distributing malicious files, triggering automated remediation actions.'
    question: 'According to the related alert titled “Possible compromised user account delivering ransomware-related files”,
      what is the exact name of the ransomware file that the attacker’s account was seen dropping?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip.lockbit'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip.lockbit'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A compromised user account delivered the ransomware-related file with Name 
          `characterical.zip.lockbit` across several devices.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Shortly afterwards, the device identified by AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033` 
          began to exhibit ransomware-like behavior, confirming compromise.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
