tasks:
- task_id: incident_5_latest_test_set_task_3
  title: incident_5_latest_test_set_task_3
  description: 'In the alert that attributes malicious actions to the Manatee Tempest activity group, what IP address is listed
    as part of their infrastructure?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a recent incident, we observed "System recovery setting tampering" on a
      device where the executable vssblatemp.exe was launched with the command "vssblatemp.exe delete shadows /all" and bcdedit
      was used to disable recovery. This activity is often associated with ransomware operators who try to impede system restoration.
      In the very same time frame, another alert was raised identifying activity attributed to the Russia-based threat actor
      Manatee Tempest, which is known for deploying Cobalt Strike beacons and ransomware after gaining initial access.'
    question: 'In the alert that attributes malicious actions to the Manatee Tempest activity group, what IP address is listed
      as part of their infrastructure?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: The account `dp5hn` tampered with system recovery settings on the device (System recovery setting 
          tampering).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: The IP address `198.43.121.209` is tied to the Russia-based threat actor Manatee Tempest (Manatee 
          Tempest activity group).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
