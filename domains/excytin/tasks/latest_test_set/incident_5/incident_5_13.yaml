tasks:
- task_id: incident_5_latest_test_set_task_13
  title: incident_5_latest_test_set_task_13
  description: 'A few seconds later, another alert flagged the execution of a known credential-theft utility (process ID 2020).
    What is the name of the executable that was run?'
  inherit_shared: true
  initial_context:
    incident_context: 'On July 4, 2024 at 22:35 UTC, host "vnevado-win10r" raised a "System recovery setting tampering" alert.
      The account "dp5hn" (SID S-1-5-21-1840191660-8534830288-125585561-1522) launched several commands such as "vssblatemp.exe
      delete shadows /all" and "bcdedit /set recoveryenabled no", actions commonly used by attackers to disable Windows-built-in
      recovery features before advancing their intrusion.'
    question: 'A few seconds later, another alert flagged the execution of a known credential-theft utility (process ID 2020).
      What is the name of the executable that was run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: 'Account (Field: Name, Value: `dp5hn`) was observed tampering with the system-recovery settings on 2024-07-04
          22:35:02 UTC.'
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: 'Process (Field: ProcessId__CreatedTimeUtc__CommandLine, Value: `2020__2024-06-20t09:03:47.538167z__"mimikatz.exe"
          privilege::debug "sekurlsa::pth /user:fk8mq /ntlm:96def1a633fc6790124d5f8fe21cc72b /domain:vnevado.alpineskihouse.co
          /run:..\notepad.exe //vnevado-jump cmd.exe"`) executed a known credential-theft tool a few seconds later.'
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: 'IP address (Field: Address, Value: `99.83.111.100`) was then linked to ransomware-like behavior across
          multiple assets at 2024-07-04 22:35:03 UTC.'
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: 'Finally, lateral movement was detected on 2024-07-10 11:24:45 UTC via PSExec to the jump server (Field:
          HostName, Value: `vnevado-win10v`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
