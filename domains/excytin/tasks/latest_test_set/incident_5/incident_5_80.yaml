tasks:
- task_id: incident_5_latest_test_set_task_80
  title: incident_5_latest_test_set_task_80
  description: 'A related alert was triggered moments earlier stating that a ransomware payload was remotely launched on a
    different device. According to that alert, what is the hostname of the device where the ransomware execution occurred?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation of a potential ransomware outbreak, security telemetry revealed that device
      ''vnevado-win11t'' exhibited ransomware-like behavior after suspicious files such as ''get-userprttoken.ps1'' and ''characterical.zip''
      appeared. The incident indicates the attacker may be moving laterally to additional machines.'
    question: 'A related alert was triggered moments earlier stating that a ransomware payload was remotely launched on a
      different device. According to that alert, what is the hostname of the device where the ransomware execution occurred?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'vnevado-win11u'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'vnevado-win11u'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Potentially compromised assets exhibiting ransomware-like behavior are associated with the account 
          having Sid `S-1-5-21-1840191660-8534830288-125585561-1522`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A ransomware payload was remotely launched on the host `vnevado-win11u`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
