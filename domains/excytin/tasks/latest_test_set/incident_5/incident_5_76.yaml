tasks:
- task_id: incident_5_latest_test_set_task_76
  title: incident_5_latest_test_set_task_76
  description: 'According to the “Windows Sysinternals tool renamed” alert associated with this incident, what is the name
    of the executable file that was detected after being renamed and launched?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of a lateral-movement attempt titled “PSExec to Vnevado-jump” (observed on
      2024-07-10), analysts noted activity originating from IP addresses 99.83.111.100 and 141.216.110.153. The action involved
      the user tgs2z@vnevado.alpineskihouse.co and included the launch of notepad.exe, suggesting a potential attempt to mask
      malicious behavior. While reviewing the same incident, another alert reported that a Windows Sysinternals utility had
      been renamed and executed—often a sign that an attacker is trying to hide post-exploitation tools.'
    question: 'According to the “Windows Sysinternals tool renamed” alert associated with this incident, what is the name
      of the executable file that was detected after being renamed and launched?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'mimikatz.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'mimikatz.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: An adversary first renamed and executed a Windows Sysinternals tool as the file `mimikatz.exe` 
          (file.Name = `mimikatz.exe`).
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Later, the same intrusion path shows the attacker account with AadUserId 
          `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1` (account.AadUserId = `1d94aaf6-efe6-4e76-ad56-ffd7d1257bc1`) using 
          PsExec for lateral movement to the host Vnevado-jump.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
