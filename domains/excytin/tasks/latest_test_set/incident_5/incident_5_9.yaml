tasks:
- task_id: incident_5_latest_test_set_task_9
  title: incident_5_latest_test_set_task_9
  description: 'During the alert that reported the compromised user account dropping ransomware-related files, what is the
    exact name of the file that was deposited on several devices?'
  inherit_shared: true
  initial_context:
    incident_context: 'Microsoft Defender has raised an alert indicating that a ransomware payload was remotely launched on
      host `vnevado-win11u` from the user account `dp5hn` (SID `S-1-5-21-1840191660-8534830288-125585561-1522`) coming from
      the external IP address `99.83.111.100`. This suggests an attempt to encrypt data on the device. Investigators learned
      that, moments earlier, the same user account was flagged in another alert for dropping a ransomware-related file across
      multiple devices—likely part of the same lateral-movement activity.'
    question: 'During the alert that reported the compromised user account dropping ransomware-related files, what is the
      exact name of the file that was deposited on several devices?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'syncretic.7z'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'syncretic.7z'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'On device with HostName `vnevado-win11u`, a ransomware payload was remotely launched, indicating an
          attempt to encrypt its data (Time: 2024-07-04 22:35:03.038773+00:00).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'A compromised user account was observed dropping the ransomware-related file `syncretic.7z` onto multiple
          devices, facilitating lateral movement and further infections (Time: 2024-07-04 22:35:00.773532+00:00).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
