tasks:
- task_id: incident_5_latest_test_set_task_21
  title: incident_5_latest_test_set_task_21
  description: 'What exact command line was executed by the process spawned via WMI in the "Suspicious WMI process creation"
    alert?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we observed that on host "vnevado-win10s" (device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505)
      the executable "browsercore.exe" (PID 2676) ran and triggered an alert for a possible attempt to access a Primary Refresh
      Token (PRT). Moments later, the same endpoint generated a separate alert for a Suspicious WMI process creation, suggesting
      malware may have used WMI to spawn a new process.'
    question: 'What exact command line was executed by the process spawned via WMI in the "Suspicious WMI process creation"
      alert?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'bcdedit /set recoveryenabled no'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'bcdedit /set recoveryenabled no'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Possible attempt to access a Primary Refresh Token (PRT) was detected for the account with 
          AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: A suspicious WMI process was created (ProcessId `3464`) at `2024-06-20t09:29:37.8767978z` with the 
          command line `bcdedit /set recoveryenabled no`.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
