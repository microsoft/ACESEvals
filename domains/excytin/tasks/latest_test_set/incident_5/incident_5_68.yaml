tasks:
- task_id: incident_5_latest_test_set_task_68
  title: incident_5_latest_test_set_task_68
  description: 'According to the final alert that signaled a known credential-theft tool execution, what is the name of the
    executable that was run?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into a ransomware-style attack, we observed that host ''vnevado-win10r'' had
      all file snapshots and shadow copies deleted via the process ''vssblatemp.exe'', launched by account ''dp5hn''. Almost
      immediately afterward, the system raised several ''Possible attempt to access Primary Refresh Token (PRT)'' alerts.
      Seconds later, a separate alert titled ''Malicious credential theft tool execution detected'' was triggered on the same
      device, indicating that the attacker executed a well-known credential-theft utility.'
    question: 'According to the final alert that signaled a known credential-theft tool execution, what is the name of the
      executable that was run?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'cmd.exe'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'cmd.exe'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 1
        description: Initial credential access was attempted using account with Sid 
          `S-5-7-21-1843151660-3234030288-105586167-1422` (account.Sid).
      checkpoint_2:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 2
        description: Immediately after, the attacker deleted all file backups while logged in as Azure AD user 
          `731adb71-b11c-4bbf-850b-57989b350e96` (account.AadUserId).
      checkpoint_3:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 3
        description: To further their intrusion, the process `browsercore.exe` (process.ExtractedFileName) was used in 
          an attempt to access the Primary Refresh Token (PRT).
      checkpoint_4:
        target: trajectory
        max_score: 0.25
        weight: 1.0
        title: Checkpoint 4
        description: Finally, the attacker executed a known credential-theft command via `cmd.exe` 
          (process.ExtractedFileName).
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
        - checkpoint_4
