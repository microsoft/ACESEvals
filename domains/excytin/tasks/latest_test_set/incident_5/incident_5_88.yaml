tasks:
- task_id: incident_5_latest_test_set_task_88
  title: incident_5_latest_test_set_task_88
  description: 'A correlated alert identifies the "Manatee Tempest activity group" as involved in this incident. Which IP
    address is listed in that alert as related to Manatee Tempest’s activity?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation of suspicious remote activity on July 4, 2024, analysts observed several potentially
      malicious commands executed from a remote source on a device with AAD device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505.
      Examples included running "bcdedit" commands to disable recovery options, deleting shadow copies with "vssblatemp.exe",
      and using curl to contact an external site (http://vectorsandarrows.com). This activity raised concerns about an ongoing
      intrusion, prompting a deeper review of correlated alerts.'
    question: 'A correlated alert identifies the "Manatee Tempest activity group" as involved in this incident. Which IP address
      is listed in that alert as related to Manatee Tempest’s activity?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '198.43.121.209'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '198.43.121.209'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: 'Suspicious remote activity was initiated by the account with Name `dp5hn` (Field: Name, Value: `dp5hn`).'
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: 'The activity is associated with infrastructure used by Manatee Tempest, communicating with the IP Address
          `198.43.121.209` (Field: Address, Value: `198.43.121.209`).'
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
