tasks:
- task_id: incident_5_latest_test_set_task_59
  title: incident_5_latest_test_set_task_59
  description: 'According to the lateral-movement alert that detected the ''CommandAndControl'' malware, what is the Azure
    AD device ID of the host where the malware was found?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we identified suspicious WMI-based process creations on workstation "vnevado-win11u"
      (device ID bc00e484-d0e5-4da4-9472-95568cccc07e). Several commands were executed in quick succession, including disabling
      recovery options with "bcdedit", deleting shadow copies via "vssblatemp.exe", and running a PowerShell script (get-userprttoken.ps1).
      Shortly after these activities, another alert in the same incident reported that a ''CommandAndControl'' malware had
      been detected on a different device, indicating possible lateral movement from the initially affected machine.'
    question: 'According to the lateral-movement alert that detected the ''CommandAndControl'' malware, what is the Azure
      AD device ID of the host where the malware was found?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'e5799261-6720-4297-961e-bd9ca4275033'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'e5799261-6720-4297-961e-bd9ca4275033'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A suspicious WMI process creation was executed by the user account with AadUserId 
          `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: "'CommandAndControl' malware activity was detected on the host with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`."
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
