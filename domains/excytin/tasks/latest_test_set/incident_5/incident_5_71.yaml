tasks:
- task_id: incident_5_latest_test_set_task_71
  title: incident_5_latest_test_set_task_71
  description: 'According to the alert titled ''Potentially compromised assets exhibiting ransomware-like behavior'', what
    is the name of the suspicious archive file that was identified on the device?'
  inherit_shared: true
  initial_context:
    incident_context: 'During an investigation into suspected ransomware activity, security monitoring flagged host ''vnevado-win11u''
      (device ID bc00e484-d0e5-4da4-9472-95568cccc07e) after unusual file-system changes consistent with mass encryption behavior.
      Shortly before this, the same device issued a command that deleted all file snapshots and shadow copies, a common tactic
      seen in ransomware attacks. A follow-up alert titled ''Potentially compromised assets exhibiting ransomware-like behavior''
      indicates that an additional suspicious archive file was involved in the incident.'
    question: 'According to the alert titled ''Potentially compromised assets exhibiting ransomware-like behavior'', what
      is the name of the suspicious archive file that was identified on the device?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'characterical.zip'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'characterical.zip'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 1
        description: The host with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e` showed ransomware-style 
          file-system activity.
      checkpoint_2:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 2
        description: The account with AadUserId `731adb71-b11c-4bbf-850b-57989b350e96` deleted all file backups and 
          shadow copies, a common ransomware tactic.
      checkpoint_3:
        target: trajectory
        max_score: 0.333
        weight: 1.0
        title: Checkpoint 3
        description: The file named `characterical.zip` is present on the compromised assets that are exhibiting 
          ransomware-like behavior.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
        - checkpoint_3
