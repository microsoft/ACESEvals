  title: incident_5_latest_test_set_task_49
  description: 'What is the Azure AD Device ID of the device where the system recovery setting tampering was detected?'
  inherit_shared: true
  initial_context:
    incident_context: 'During the investigation we identified a ''CommandAndControl'' malware infection on host "vnevado-win10s"
      (AAD Device ID f5b847aa-8712-4bf6-b4f7-ed6cd89e1505). The malicious process (PID 6460) executed the command "curl http://vectorsandarrows.com".
      Just seconds after this detection, a separate alert warned that system recovery settings were tampered with on another
      device in the environment.'
    question: 'What is the Azure AD Device ID of the device where the system recovery setting tampering was detected?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - '9d4887ba-0b69-47d6-89bc-9b32787f379e'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: '9d4887ba-0b69-47d6-89bc-9b32787f379e'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: Command-and-control malware was detected in a lateral-movement attempt by the account with 
          AadUserId `731adb71-b11c-4bbf-850b-57989b350e96`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Immediately afterward, the attacker tampered with system-recovery settings on the host whose 
          AadDeviceId is `9d4887ba-0b69-47d6-89bc-9b32787f379e`, likely to hinder remediation.
  scoring_aggregation:
    max:
