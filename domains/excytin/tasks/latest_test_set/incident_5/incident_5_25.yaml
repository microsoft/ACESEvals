tasks:
- task_id: incident_5_latest_test_set_task_25
  title: incident_5_latest_test_set_task_25
  description: 'According to the "Command and Control behavior was blocked" alert that fired moments after the ransomware
    launch, what URL was the malware attempting to reach?'
  inherit_shared: true
  initial_context:
    incident_context: 'At 22:35:02 UTC on July 4 a device in the environment was contacted from the external IP address 99.83.111.100
      and a ransomware payload was remotely launched, triggering a high-severity alert. Investigators are now correlating
      that event with an immediate follow-up alert that reported Command-and-Control (C2) activity being blocked on the same
      host.'
    question: 'According to the "Command and Control behavior was blocked" alert that fired moments after the ransomware launch,
      what URL was the malware attempting to reach?'
    # Main task submission evaluation - uses LLM-as-a-judge by default
    # To use static matching instead, change strategy to "static" and set:
    #   criteria:
    #     expected_answers:
    #       - 'http://vectorsandarrows.com/'
  scoring:
    llm_judge:
      model: openai/azure/gpt-4.1
      steps_per_message: 50
      judge_system_template: judge/checkpoint_judge_system.md
      judge_user_template: judge/checkpoint_judge_user.md
      submission:
        target: submission
        judge_system_template: judge/submission_judge_system.md
        judge_user_template: judge/submission_judge_user.md
        description: 'http://vectorsandarrows.com/'
        max_score: 1.0
      checkpoint_1:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 1
        description: A ransomware payload was remotely launched on the device by the account Name `dp5hn`.
      checkpoint_2:
        target: trajectory
        max_score: 0.5
        weight: 1.0
        title: Checkpoint 2
        description: Subsequently, Command-and-Control traffic was blocked when the URL `http://vectorsandarrows.com/` 
          was detected.
  scoring_aggregation:
    max:
      scores:
      - submission
      - - checkpoint_1
        - checkpoint_2
