# CRSBench domain metadata — inspect_evals convention
slug: crsbench
name: "CRSBench Vulnerability Patching"
description: >
  Vulnerability patching benchmark based on CRSBench — agent receives
  vulnerable source code, crash-triggering POVs, and must write a
  source-code patch that fixes the crash without breaking functionality.
version: "1.0.0"
tags:
  - vulnerability-patching
  - fuzzing
  - asan
  - cybersecurity
  - crsbench

images:
  sandbox:
    tag: "saber/crsbench/sandbox:latest"
    dockerfile: "docker/Dockerfile.sandbox"
  # Per-benchmark images (built by crsbench.scripts.build_images, not SABER's
  # image builder):
  #   tag pattern: saber/crsbench/benchmark:<benchmark-id>
  #   Two-layer build: Layer 1 (benchmark env) + Layer 2 (SABER tooling + source)
