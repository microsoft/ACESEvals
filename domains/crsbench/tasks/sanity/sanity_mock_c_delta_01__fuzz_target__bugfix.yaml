tasks:
- task_id: sanity_mock_c_delta_01__fuzz_target__bugfix
  title: "Fix vulnerability in sanity-mock-c project (delta-01)"
  description: >
    A heap buffer overflow vulnerability has been found in a mock C project.
    You are given the crash-triggering POV and must write a source-code patch
    that fixes the vulnerability without breaking unit tests.

  initial_context:
    project: sanity-mock-c
    harness_name: fuzz_target
    benchmark_id: sanity-mock-c-delta-01

  initial_files:
    /workspace/source: "data/benchmarks/sanity-mock-c-delta-01/staged/"
    /workspace/build/fuzz_target: "data/benchmarks/sanity-mock-c-delta-01/build/fuzz_target"
    /workspace/povs/: "data/benchmarks/sanity-mock-c-delta-01/.aixcc/fuzz_target/cpv_0/blobs/"

  scoring:
    crsbench_patch_verify:
      submission:
        target: submission
        max_score: 1.0
        source_dir: /workspace/source
        build_script: /workspace/source/build.sh
        harness_name: fuzz_target
        harness_path: /workspace/build/fuzz_target
        pov_dir: /workspace/povs
        test_script: /workspace/source/test.sh
        patch_dir: /submit/patches
    llm_judge:
      crash_analysis:
        target: trajectory
        model: openai/azure/gpt-4.1
        judge_system_template: judge/crash_analysis_system.j2
        judge_user_template: judge/crash_analysis_user.j2
        steps_per_message: 10
        max_score: 1.0
        weight: 0.15
        title: "Crash Analysis"
        description: "Agent reproduces the crash and analyzes the ASAN output"
        hints:
          - "Run the POV against the harness binary"
          - "Read and interpret the AddressSanitizer crash report"
      root_cause:
        target: trajectory
        model: openai/azure/gpt-4.1
        judge_system_template: judge/root_cause_system.j2
        judge_user_template: judge/root_cause_user.j2
        steps_per_message: 10
        max_score: 1.0
        weight: 0.20
        title: "Root Cause Analysis"
        description: "Agent traces from crash site to identify the vulnerable code"
        hints:
          - "Identify the vulnerability type (buffer overflow, use-after-free, etc.)"
          - "Locate the specific source code that causes the vulnerability"
    tool_call:
      patch_created:
        target: trajectory
        expected_tools:
          - bash
          - submit_patch
        max_score: 1.0
        weight: 0.15
        title: "Patch Created"
        description: "Agent produces a unified diff patch file"

  scoring_aggregation:
    average:
      scores:
        - submission
        - - crash_analysis
          - root_cause
          - patch_created
