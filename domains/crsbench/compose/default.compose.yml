# CRSBench per-sample sandbox — managed by inspect_ai DockerSandboxEnvironment
# Each sample uses a pre-built Docker image that contains the benchmark's
# source code, dependencies, and SABER tooling. The image tag comes from
# the task YAML's initial_context.benchmark_image, promoted to top-level
# sample metadata by the converter, and exposed here via inspect_ai's
# SAMPLE_METADATA_* env var interpolation.

services:
  default:
    image: ${SAMPLE_METADATA_BENCHMARK_IMAGE}
    x-local: true
    working_dir: /workspace
    command: "tail -f /dev/null"
    init: true
    environment:
      - CC=clang
      - CXX=clang++
      - CFLAGS=-fsanitize=address -fno-omit-frame-pointer -g
      - CXXFLAGS=-fsanitize=address -fno-omit-frame-pointer -g
      - SRC=/workspace/source
      - OUT=/workspace/build
      - ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # ASAN + JVM builds need substantial memory
          memory: 8G
          pids: 512

networks:
  sandbox-net:
    driver: bridge
    internal: true
