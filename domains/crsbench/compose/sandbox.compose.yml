# CRSBench per-sample sandbox — managed by inspect_ai DockerSandboxEnvironment
# Provides a vulnerability research workstation with C/C++ and Java tooling.

services:
  default:
    image: saber/crsbench/sandbox:latest
    x-local: true
    working_dir: /workspace
    command: "tail -f /dev/null"
    init: true
    environment:
      - CC=clang
      - CXX=clang++
      - CFLAGS=-fsanitize=address -fno-omit-frame-pointer -g
      - CXXFLAGS=-fsanitize=address -fno-omit-frame-pointer -g
      - SRC=/workspace/source
      - OUT=/workspace/build
      - LIB_FUZZING_ENGINE=/usr/lib/llvm-19/lib/libFuzzer.a
      - ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
      - JAVA_HOME=/usr/lib/jvm/default-java
      - MVN=/usr/local/bin/mvn
    networks:
      - sandbox-net
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # ASAN + JVM builds need substantial memory
          memory: 8G
          pids: 512

networks:
  sandbox-net:
    driver: bridge
    internal: true
