# No profiles needed - server has full privileges by default

ports:
  rest:
    container: 8000
    public: false
  
  mcp:
    container: 8001
    public: false

capabilities:
  networking:
    internet_access: false
    custom_networks:
      - "saber-dual-network"
  
  filesystem:
    host_access: false
    writable_paths:
      - "/app/logs"
      - "/app/data"
  
  execution:
    docker_socket: true
    privileged: true
    tools:
      - "python"
      - "curl"
      - "nmap"
      - "netcat"
      - "ssh-client"

resources:
  cpu_limit: "6.0"
  memory_limit: "12g"
  storage_limit: "30g"

metadata:
  maintainer: "saber-team@security.com"
  documentation: "https://github.com/saber-team/saber/tree/main/domains/saber_dual"
  repository: "https://github.com/saber-team/saber"
  tags:
    - "multi-agent"
    - "collaboration"
    - "dual-agent"
    - "coordination"