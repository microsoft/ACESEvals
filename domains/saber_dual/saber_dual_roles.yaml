# Example role-based configuration for saber_dual orchestrated tasks
# Usage: inspect eval saber_dual -T roles_file=configs/saber_dual_roles.yaml
#
# NOTE: When all roles have models defined, the --model flag is optional!
#       Inspect AI's model requirement is automatically bypassed.

# Role-specific configurations
roles:
  red:
    agent: react
    model: openai/azure/gpt-4.1
  
  blue:
    agent: react
    model: openai/azure/gpt-4.1
    submit: false  # Blue team monitors continuously, never submits
    description: "Continuous monitoring agent - operates without submit capability"

# Default configuration for any roles not explicitly defined
defaults:
  agent: react
  model: openai/azure/gpt-4o-mini
