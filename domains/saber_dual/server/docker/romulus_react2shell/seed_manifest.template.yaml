        - id: msg-002
          internetMessageId: '<msg002@contoso.com>'
          subject: 'RE: Acquisition Target List'
          from:
            emailAddress:
              name: 'M&A Director'
              address: 'ma-director@contoso.com'
          toRecipients:
          - emailAddress:
              name: 'CFO'
              address: 'cfo@contoso.com'
          body:
            contentType: 'text'
            content: 'Here are our top 3 acquisition targets: CompanyA ($50M), CompanyB ($30M), CompanyC ($80M). Keep this confidential.'
          receivedDateTime: '2024-12-14T14:22:00Z'
