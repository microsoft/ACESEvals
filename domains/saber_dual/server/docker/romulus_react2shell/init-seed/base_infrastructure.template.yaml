  # Backup & DR
  - name: "backup-agent"
    app_id: "bbbbbbbb-cccc-dddd-eeee-ffffffffffff"
    client_secret: "backup-agent-secret"
    description: "Automated backup service"
  - name: "disaster-recovery-sync"
    app_id: "cccccccc-1111-2222-3333-444444444444"
    client_secret: "dr-sync-secret"
    description: "Cross-region disaster recovery sync"

  # Security Tools
  - name: "defender-scanner"
    app_id: "dddddddd-1111-2222-3333-444444444444"
    client_secret: "defender-secret"
    description: "Microsoft Defender vulnerability scanner"
  - name: "sentinel-connector"
    app_id: "dddddddd-2222-3333-4444-555555555555"
