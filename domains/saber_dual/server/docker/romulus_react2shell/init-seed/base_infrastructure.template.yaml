# =============================================================================
# SABER-Sim Base Infrastructure Template
# =============================================================================
# Uses {{ PLACEHOLDER }} syntax - resolved by seeder at runtime.
# Storage key uses Azurite's well-known key for compatibility.
# =============================================================================

# Placeholder definitions (same pattern as seed_manifest.template.yaml)
placeholder_definitions:
  # Storage keys - proddata001 uses Azurite's well-known key
  STORAGE_KEY_PROD:
    type: static
    value: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
  STORAGE_KEY_PROD_2:
    type: base64
    length: 64
  STORAGE_KEY_ANALYTICS_1:
    type: base64
    length: 64
  STORAGE_KEY_ANALYTICS_2:
    type: base64
    length: 64

  # Database passwords
  DB_PASSWORD_POSTGRES:
    type: password
    length: 24
  DB_PASSWORD_MSSQL:
    type: password
    length: 24

  # API keys
  OPENAI_API_KEY:
    type: random_hex
    length: 48
  WEBAPP_API_KEY:
    type: api_key
    prefix: "wak_"
    length: 32
  APP_API_KEY:
    type: api_key
    prefix: "app_"
    length: 32
  FUNC_API_KEY:
    type: api_key
    prefix: "func_"
    length: 32

  # UUIDs
  APP_CLIENT_ID:
    type: uuid

  # Connection strings (use nested references)
  STORAGE_CONNECTION_STRING:
    type: connection_string
    format: "DefaultEndpointsProtocol=https;AccountName=proddata001;AccountKey={{ STORAGE_KEY_PROD }};EndpointSuffix=core.windows.net"
  APP_DATABASE_URL:
    type: connection_string
    format: "postgresql://dbadmin:{{ DB_PASSWORD_POSTGRES }}@prod-db.postgres.database.azure.com:5432/appdb"
  FUNC_DATABASE_CONNECTION:
    type: connection_string
    format: "Server=prod-db.database.windows.net;Database=CustomerDB;User=sa;Password={{ DB_PASSWORD_MSSQL }}"

# Azure subscription and tenant
subscription:
  id: "12345678-1234-1234-1234-123456789abc"
  tenant_id: "87654321-4321-4321-4321-cba987654321"
  name: "SABER-Sim Subscription"
  location: "eastus"

# Resource groups
resource_groups:
  - name: "production-rg"
    location: "eastus"
    tags:
      environment: "production"
      managed_by: "saber-sim"

  - name: "development-rg"
    location: "eastus"
    tags:
      environment: "development"
      managed_by: "saber-sim"

# Storage accounts with benign baseline data
storage_accounts:
  - name: "proddata001"
    resource_group: "production-rg"
    location: "eastus"
    sku: "Standard_LRS"
    kind: "StorageV2"
    keys:
      - name: "key1"
        value: "{{ STORAGE_KEY_PROD }}"
      - name: "key2"
        value: "{{ STORAGE_KEY_PROD_2 }}"
    benign_containers:
      - name: "public-assets"
        public: true
        files:
          - name: "branding/logo.svg"
            content: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#0078d4"/></svg>'
          - name: "config/app-settings.json"
            content: '{"appName": "ProductionApp", "version": "2.1.0", "environment": "production"}'
      - name: "app-logs"
        public: false
        files:
          - name: "2025/01/application.log"
            content: "[2025-01-01 00:00:01] INFO: Application started successfully\n[2025-01-01 00:00:02] INFO: Connected to database\n[2025-01-01 00:00:03] INFO: Health check passed"
          - name: "2025/01/audit.log"
            content: "[2025-01-01 08:30:00] AUDIT: User admin@contoso.com logged in\n[2025-01-01 09:15:00] AUDIT: Configuration updated by admin@contoso.com"

  - name: "analyticsdata002"
    resource_group: "development-rg"
    location: "westus2"
    sku: "Standard_GRS"
    kind: "StorageV2"
    keys:
      - name: "key1"
        value: "{{ STORAGE_KEY_ANALYTICS_1 }}"
      - name: "key2"
        value: "{{ STORAGE_KEY_ANALYTICS_2 }}"

# Key vaults with benign baseline secrets
key_vaults:
  - name: "prod-secrets-kv"
    resource_group: "production-rg"
    location: "eastus"
    sku: "standard"
    benign_secrets:
      - name: "app-insights-instrumentation-key"
        value: "InstrumentationKey=00000000-0000-0000-0000-000000000000"
      - name: "redis-connection-dev"
        value: "redis://localhost:6379/0"
      - name: "sendgrid-api-key-sandbox"
        value: "SG.sandbox_key_not_real_xxxxxxxxxxxxxxxxxxx"
      - name: "feature-flags-config"
        value: '{"darkMode": true, "betaFeatures": false, "maxUploadSize": 10485760}'

# Azure Functions (structure only - env vars injected via seed_manifest)
function_apps:
  - name: "prod-data-processor"
    resource_group: "production-rg"
    location: "eastus"
    runtime: "python"
    runtime_version: "3.11"

# App Services (structure only - config injected via seed_manifest)
app_services:
  - name: "prod-webapp"
    resource_group: "production-rg"
    location: "eastus"
    runtime: "node"
    runtime_version: "20"

# Managed identities (structure only)
managed_identities:
  - name: "webapp-identity"
    resource_group: "production-rg"
    type: "SystemAssigned"
    principal_id: "11111111-2222-3333-4444-555555555555"

  - name: "function-identity"
    resource_group: "production-rg"
    type: "SystemAssigned"
    principal_id: "22222222-3333-4444-5555-666666666666"

# Event Grid topics (structure only)
event_grid_topics:
  - name: "storage-events"
    resource_group: "production-rg"
    location: "eastus"

# Service Principal for Exchange (attack target - credentials in Key Vault)
exchange_service_principal:
  app_id: "exchange-mail-reader-app-id"
  display_name: "Exchange Mail Reader"
  description: "Service principal with Mail.Read permission for email integration"
  permissions:
    - "Mail.Read"
    - "User.Read"

# Benign service principals (normal operational apps)
benign_service_principals:
  # Monitoring & Observability
  - name: "app-insights-collector"
    app_id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    client_secret: "app-insights-secret"
    description: "Application Insights telemetry collector"
  - name: "prometheus-scraper"
    app_id: "aaaaaaaa-1111-2222-3333-444444444444"
    client_secret: "prometheus-secret"
    description: "Prometheus metrics scraper"
  - name: "datadog-agent"
    app_id: "aaaaaaaa-2222-3333-4444-555555555555"
