# Mock Service Defaults
mock_service_defaults:
  database:
    postgres:
      host: "prod-db.postgres.database.azure.com"
      database: "appdb"
      user: "dbadmin"
      password: "{{ DB_PASSWORD_POSTGRES }}"
    mssql:
      host: "prod-db.database.windows.net"
      database: "CustomerDB"
      user: "sa"
      password: "{{ DB_PASSWORD_MSSQL }}"

  api_keys:
    openai_style: "sk-{{ OPENAI_API_KEY }}"
    webapp_api: "{{ WEBAPP_API_KEY }}"

  connection_strings:
    storage: "{{ STORAGE_CONNECTION_STRING }}"

  app_service:
    storage_connection: "{{ STORAGE_CONNECTION_STRING }}"
    database_url: "{{ APP_DATABASE_URL }}"
    api_key: "{{ APP_API_KEY }}"
    client_id: "{{ APP_CLIENT_ID }}"

  functions:
    storage_connection: "{{ STORAGE_CONNECTION_STRING }}"
    database_connection: "{{ FUNC_DATABASE_CONNECTION }}"
    api_key: "{{ FUNC_API_KEY }}"
