# =============================================================================
# SABER-Sim Network Configuration
# =============================================================================
# This file defines the network topology and service IP assignments.
# It serves as the single source of truth for network-related configuration.
#
# The SUBNET_PREFIX environment variable (default: 172.30) controls the
# base network prefix. All IP addresses are relative to this prefix.
#
# Network segments use the following third octets by default:
#   - external_net: .100.x (Internet simulation)
#   - dmz_net:      .20.x  (Public-facing tier)
#   - corp_net:     .10.x  (Internal services)
#   - mgmt_net:     .30.x  (Control plane)

# =============================================================================
# Network Definitions
# =============================================================================
networks:
  external_net:
    description: "External network (Internet simulation / attacker entry point)"
    subnet_id: 100  # Results in ${SUBNET_PREFIX}.100.0/24
    purpose: internet

  dmz_net:
    description: "DMZ network (public-facing services)"
    subnet_id: 20   # Results in ${SUBNET_PREFIX}.20.0/24
    purpose: dmz

  corp_net:
    description: "Corporate network (internal/backend services)"
    subnet_id: 10   # Results in ${SUBNET_PREFIX}.10.0/24
    purpose: internal

  mgmt_net:
    description: "Management network (control plane)"
    subnet_id: 30   # Results in ${SUBNET_PREFIX}.30.0/24
    purpose: management

# =============================================================================
# Service IP Assignments
# =============================================================================
# Each service has a host_id (last octet) within its network segment.
# Full IP = ${SUBNET_PREFIX}.${subnet_id}.${host_id}
#
# Reserved host IDs:
#   .1   = Docker gateway (automatic)
#   .2   = Network gateway service (on all networks)
#   .200 = Log collector (on all networks)
#   .250 = Init container
#   .251 = Network test container

services:
  # === Network Infrastructure ===
  gateway:
    container_name: network-gateway
    description: "NSG simulation and inter-network routing"
    networks:
      external_net: 2   # ${SUBNET_PREFIX}.100.2
      dmz_net: 2        # ${SUBNET_PREFIX}.20.2
      corp_net: 2       # ${SUBNET_PREFIX}.10.2
      mgmt_net: 2       # ${SUBNET_PREFIX}.30.2
    ports:
      - 8080

  dns:
    container_name: azure-dns
    description: "CoreDNS resolver for Azure endpoint simulation"
    networks:
      dmz_net: 3        # ${SUBNET_PREFIX}.20.3
    ports:
      - 53/udp

  azure-sentinel:
    container_name: azure-sentinel
    description: "Azure Sentinel SIEM simulation"
    networks:
      external_net: 200 # ${SUBNET_PREFIX}.100.200
      dmz_net: 200      # ${SUBNET_PREFIX}.20.200
      corp_net: 200     # ${SUBNET_PREFIX}.10.200
      mgmt_net: 200     # ${SUBNET_PREFIX}.30.200
    ports:
      - 5000

  # === DMZ Services (Public-Facing) ===
  front-door:
    container_name: azure-front-door
    description: "Azure Front Door with WAF (reverse proxy + WAF)"
    azure_hostname: prod-webapp.azurefd.net
    networks:
      external_net: 5   # ${SUBNET_PREFIX}.100.5 (attacker entry point)
      dmz_net: 5        # ${SUBNET_PREFIX}.20.5 (forwards to app-service)
    ports:
      - 8080

  app-service:
    container_name: azure-app-service
    description: "Azure App Service mock (web application)"
    azure_hostname: prod-webapp.azurewebsites.net
    networks:
      dmz_net: 10       # ${SUBNET_PREFIX}.20.10
      corp_net: 31      # ${SUBNET_PREFIX}.10.31 (backend access)
    ports:
      - 8080

  # === Corporate Network Services (Internal) ===
  azurite:
    container_name: azure-blob-storage
    description: "Azure Blob Storage (Azurite emulator)"
    azure_hostname: proddata001.blob.core.windows.net
    networks:
      corp_net: 10      # ${SUBNET_PREFIX}.10.10
    ports:
      - 10000  # Blob
      - 10001  # Queue
      - 10002  # Table

  keyvault:
    container_name: azure-keyvault
    description: "Azure Key Vault mock"
    azure_hostname: prod-secrets-kv.vault.azure.net
    networks:
      corp_net: 20      # ${SUBNET_PREFIX}.10.20
    ports:
      - 443

  azure-functions:
    container_name: azure-functions
    description: "Azure Functions runtime mock"
    azure_hostname: prod-data-processor.azurewebsites.net
    networks:
      corp_net: 30      # ${SUBNET_PREFIX}.10.30
      mgmt_net: 30      # ${SUBNET_PREFIX}.30.30 (IMDS access)
    ports:
      - 7071

  eventgrid:
    container_name: azure-eventgrid
    description: "Azure Event Grid mock"
    azure_hostname: storage-events.eventgrid.azure.net
    networks:
      corp_net: 40      # ${SUBNET_PREFIX}.10.40
    ports:
      - 4000

  # === Management Network Services (Control Plane) ===
  azure-ad:
    container_name: azure-ad
    description: "Azure AD / Entra ID mock (token service)"
    azure_hostname: login.microsoftonline.com
    networks:
      mgmt_net: 20      # ${SUBNET_PREFIX}.30.20
    ports:
      - 8080

  imds:
    container_name: azure-imds
    description: "Instance Metadata Service mock"
    azure_hostname: "169.254.169.254"
    networks:
      mgmt_net: 21      # ${SUBNET_PREFIX}.30.21
    ports:
      - 80

  arm-api:
    container_name: azure-arm
    description: "Azure Resource Manager API mock"
    azure_hostname: management.azure.com
    networks:
      mgmt_net: 22      # ${SUBNET_PREFIX}.30.22
    ports:
      - 443

  # === Utility Containers ===
  init:
    container_name: env-initializer
    description: "Environment initialization container"
    networks:
      corp_net: 250     # ${SUBNET_PREFIX}.10.250

  network-test:
    container_name: network-test
    description: "Network debugging container (test profile only)"
    networks:
      external_net: 251 # ${SUBNET_PREFIX}.100.251
      dmz_net: 251      # ${SUBNET_PREFIX}.20.251
      corp_net: 251     # ${SUBNET_PREFIX}.10.251
      mgmt_net: 251     # ${SUBNET_PREFIX}.30.251

# =============================================================================
# DNS Resolution Mapping
# =============================================================================
# Maps Azure service hostnames to internal service targets.
# The Corefile template uses this to generate DNS entries.

dns_mappings:
  - pattern: "*.blob.core.windows.net"
    target_service: azurite
    target_network: corp_net

  - pattern: "*.vault.azure.net"
    target_service: keyvault
    target_network: corp_net

  - pattern: "*.microsoftonline.com"
    target_service: azure-ad
    target_network: mgmt_net

  - pattern: "management.azure.com"
    target_service: arm-api
    target_network: mgmt_net

  - pattern: "*.azurewebsites.net"
    target_service: azure-functions
    target_network: corp_net

  - pattern: "*.eventgrid.azure.net"
    target_service: eventgrid
    target_network: corp_net

  - pattern: "*.azurewebsites.windows.net"
    target_service: app-service
    target_network: dmz_net

  - pattern: "*.azurefd.net"
    target_service: front-door
    target_network: external_net
