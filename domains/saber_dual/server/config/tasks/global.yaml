domain: saber_dual

global_defaults:
  execution_config:
    executors:
      bash:
        timeout: 180

  episode_config:
    max_steps: 30  # Default for red team - blue team overrides to 1000

    # Transcript coordination configuration
    # Default: push enabled, pull disabled (red team / single-agent behavior)
    # Blue team tasks override pull.enabled=true to receive injections
    transcript_config:
      websocket:
        push:
          enabled: true
        pull:
          enabled: false

  benchmark_config:
    episode_attempts: 1
