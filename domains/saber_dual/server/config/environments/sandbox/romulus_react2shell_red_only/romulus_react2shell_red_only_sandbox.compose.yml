---
# Romulus React2Shell Red Team Only Sandbox Environment
# Full cyber range with all Azure services for red team testing
# WITHOUT the blue team Sentinel execution environment
#
# Required Environment Variables:
# - EPISODE_ID: Unique identifier for episode isolation
#
# This compose file combines:
# - All Azure infrastructure services (from blue team compose)
# - Red team attacker sandbox
# - NO blue team Sentinel/Kusto components

services:
  # ==========================================================================
  # Red Team Attacker Sandbox
  # ==========================================================================
  romulus-red-sandbox:
    image: saber/saber_dual/sandbox:latest
    container_name: romulus-red-sandbox-${EPISODE_ID:-default}
    working_dir: /workspace
    user: "0:0"  # Run as root for penetration testing tools
    privileged: true  # Enable privileged mode for network scanning and security tools
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - EPISODE_ID=${EPISODE_ID:-default}
      - AGENT_ROLE=red_team
      - TARGET_NETWORK=azure_cloud
      # Target service discovery hints
      - FRONT_DOOR_HOST=romulus-front-door
      - FRONT_DOOR_PORT=8080
      - AKS_POD_HOST=romulus-aks-pod
      - AKS_POD_PORT=8080
      - KUBERNETES_API_HOST=romulus-kubernetes-api
      - KUBERNETES_API_PORT=443
      - EXCHANGE_HOST=romulus-exchange-online
      - EXCHANGE_PORT=443
    networks:
      - saber-episode-network
    depends_on:
      romulus-init-seed:
        condition: service_completed_successfully
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    labels:
      - "saber.execution.service=true"
      - "saber.domain=saber_dual"
      - "saber.service.type=sandbox"
      - "saber.service.name=romulus-red-sandbox"
      - "saber.agent.role=red_team"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.network.access=external"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Azure Identity & Authentication (start first, init-seed depends on these)
  # ==========================================================================
  romulus-azure-ad:
    image: saber/saber_dual/romulus_react2shell/azure-ad:latest
    container_name: romulus-azure-ad-${EPISODE_ID:-default}
    hostname: login.microsoftonline.com
    environment:
      - TENANT_ID=87654321-4321-4321-4321-cba987654321
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=identity"
      - "saber.service.name=romulus-azure-ad"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  romulus-imds:
    image: saber/saber_dual/romulus_react2shell/imds:latest
    container_name: romulus-imds-${EPISODE_ID:-default}
    hostname: "169.254.169.254"
    environment:
      - SUBSCRIPTION_ID=12345678-1234-1234-1234-123456789abc
      - RESOURCE_GROUP=production-rg
      - VM_NAME=aks-pod-001
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=imds"
      - "saber.service.name=romulus-imds"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Azure Data Services  
  # ==========================================================================
  romulus-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: romulus-azurite-${EPISODE_ID:-default}
    hostname: proddata001.blob.core.windows.net
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck
    environment:
      - AZURITE_ACCOUNTS=proddata001:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=storage"
      - "saber.service.name=romulus-azurite"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  romulus-keyvault:
    image: saber/saber_dual/romulus_react2shell/keyvault:latest
    container_name: romulus-keyvault-${EPISODE_ID:-default}
    hostname: prod-secrets-kv.vault.azure.net
    environment:
      - VAULT_NAME=prod-secrets-kv
      - TENANT_ID=87654321-4321-4321-4321-cba987654321
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      romulus-azure-ad:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, ssl; urllib.request.urlopen('https://localhost:443/health', context=ssl._create_unverified_context())\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=keyvault"
      - "saber.service.name=romulus-keyvault"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Azure Management Plane
  # ==========================================================================
  romulus-arm-api:
    image: saber/saber_dual/romulus_react2shell/arm-api:latest
    container_name: romulus-arm-api-${EPISODE_ID:-default}
    hostname: management.azure.com
    environment:
      - SUBSCRIPTION_ID=12345678-1234-1234-1234-123456789abc
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      romulus-azure-ad:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, ssl; urllib.request.urlopen('https://localhost:443/health', context=ssl._create_unverified_context())\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=arm"
      - "saber.service.name=romulus-arm-api"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Kubernetes Services
  # ==========================================================================
  romulus-kubernetes-api:
    image: saber/saber_dual/romulus_react2shell/kubernetes-api:latest
    container_name: romulus-kubernetes-api-${EPISODE_ID:-default}
    hostname: kubernetes.default.svc
    environment:
      - CLUSTER_NAME=aks-prod-cluster
      - TENANT_ID=87654321-4321-4321-4321-cba987654321
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      romulus-azure-ad:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, ssl; urllib.request.urlopen('https://localhost:443/health', context=ssl._create_unverified_context())\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=kubernetes"
      - "saber.service.name=romulus-kubernetes-api"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # AKS Application Services
  # ==========================================================================
  romulus-aks-pod:
    image: saber/saber_dual/romulus_react2shell/aks-pod:latest
    container_name: romulus-aks-pod-${EPISODE_ID:-default}
    hostname: hr-app.aks.internal
    environment:
      - POD_NAME=hr-app-pod
      - NAMESPACE=production
      - SERVICE_ACCOUNT=hr-app-sa
      - IMDS_HOST=romulus-imds
      - IMDS_PORT=80
      - SUBSCRIPTION_ID=12345678-1234-1234-1234-123456789abc
      - AZURE_TENANT_ID=87654321-4321-4321-4321-cba987654321
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      romulus-imds:
        condition: service_healthy
      romulus-kubernetes-api:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=webapp"
      - "saber.service.name=romulus-aks-pod"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  romulus-front-door:
    image: saber/saber_dual/romulus_react2shell/front-door:latest
    container_name: romulus-front-door-${EPISODE_ID:-default}
    hostname: prod-webapp.azurefd.net
    environment:
      - BACKEND_URL=http://romulus-aks-pod:8080
      - WAF_MODE=Detection
      - SUBSCRIPTION_ID=12345678-1234-1234-1234-123456789abc
      - RESOURCE_GROUP=production-rg
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      romulus-aks-pod:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=frontend"
      - "saber.service.name=romulus-front-door"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  romulus-azure-functions:
    image: saber/saber_dual/romulus_react2shell/azure-functions:latest
    container_name: romulus-azure-functions-${EPISODE_ID:-default}
    hostname: prod-data-processor.azurewebsites.net
    environment:
      - FUNCTION_APP_NAME=prod-data-processor
      - FUNCTIONS_WORKER_RUNTIME=python
      - IDENTITY_ENDPOINT=http://romulus-imds:80/metadata/identity/oauth2/token
      - IDENTITY_HEADER=mock-identity-header
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      romulus-imds:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7071/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=functions"
      - "saber.service.name=romulus-azure-functions"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Exchange Online Service
  # ==========================================================================
  romulus-exchange-online:
    image: saber/saber_dual/romulus_react2shell/exchange-online:latest
    container_name: romulus-exchange-online-${EPISODE_ID:-default}
    hostname: graph.microsoft.com
    environment:
      - TENANT_ID=87654321-4321-4321-4321-cba987654321
      - ORGANIZATION_ID=org-12345678-1234-1234-1234-123456789abc
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      romulus-azure-ad:
        condition: service_healthy
      romulus-keyvault:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, ssl; urllib.request.urlopen('https://localhost:443/health', context=ssl._create_unverified_context())\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=exchange"
      - "saber.service.name=romulus-exchange-online"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Network Services
  # ==========================================================================
  romulus-gateway:
    image: saber/saber_dual/romulus_react2shell/gateway:latest
    container_name: romulus-gateway-${EPISODE_ID:-default}
    hostname: gateway
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=gateway"
      - "saber.service.name=romulus-gateway"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  romulus-dns:
    image: coredns/coredns:latest
    container_name: romulus-dns-${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    restart: "no"
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=dns"
      - "saber.service.name=romulus-dns"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Init Containers
  # ==========================================================================
  romulus-init-logs:
    image: saber/saber_dual/romulus_react2shell/init-logs:latest
    container_name: romulus-init-logs-${EPISODE_ID:-default}
    environment:
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    restart: "no"
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=init"
      - "saber.service.name=romulus-init-logs"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  romulus-init-seed:
    image: saber/saber_dual/romulus_react2shell/init-seed:latest
    container_name: romulus-init-seed-${EPISODE_ID:-default}
    environment:
      - EPISODE_ID=${EPISODE_ID:-default}
      - AZURITE_HOST=romulus-azurite
      - KEYVAULT_HOST=romulus-keyvault
      - AZURE_AD_HOST=romulus-azure-ad
      - IMDS_HOST=romulus-imds
      - ARM_HOST=romulus-arm-api
      - AKS_POD_HOST=romulus-aks-pod
      - KUBERNETES_API_HOST=romulus-kubernetes-api
      - FUNCTIONS_HOST=romulus-azure-functions
      - EXCHANGE_HOST=romulus-exchange-online
    networks:
      - saber-episode-network
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/seeding_complete"]
      interval: 2s
      timeout: 2s
      retries: 90
      start_period: 5s
    depends_on:
      romulus-azure-ad:
        condition: service_healthy
      romulus-imds:
        condition: service_healthy
      romulus-azurite:
        condition: service_healthy
      romulus-keyvault:
        condition: service_healthy
      romulus-arm-api:
        condition: service_healthy
      romulus-aks-pod:
        condition: service_healthy
      romulus-kubernetes-api:
        condition: service_healthy
      romulus-azure-functions:
        condition: service_healthy
      romulus-exchange-online:
        condition: service_healthy
    restart: "no"
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=init"
      - "saber.service.name=romulus-init-seed"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  romulus-log-streamer:
    image: saber/saber_dual/romulus_react2shell/log-streamer:latest
    container_name: romulus-log-streamer-${EPISODE_ID:-default}
    environment:
      - AZURE_SENTINEL_URL=http://romulus-sentinel:5000
      - POLL_INTERVAL=5
      - EPISODE_ID=${EPISODE_ID:-default}
      - OUTPUT_DIR=/app/logs
    networks:
      - saber-episode-network
    depends_on:
      romulus-sentinel:
        condition: service_started
      romulus-init-logs:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=log-streamer"
      - "saber.service.name=romulus-log-streamer"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Azure Sentinel - SIEM Environment (running but not used by agent)
  # Provides realistic log aggregation even without blue team agent
  # ==========================================================================
  romulus-kusto-emulator:
    image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
    container_name: romulus-kusto-${EPISODE_ID:-default}
    hostname: kusto.local
    environment:
      - ACCEPT_EULA=Y
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/ > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s  # Kusto startup time on native x64
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=kusto"
      - "saber.service.name=romulus-kusto"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

  romulus-sentinel:
    image: saber/saber_dual/romulus_react2shell/sentinel:latest
    container_name: romulus-sentinel-${EPISODE_ID:-default}
    hostname: azure-sentinel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    user: "root"
    environment:
      - OUTPUT_FORMAT=azure_monitor
      - KUSTO_URL=http://romulus-kusto-emulator:8080
      - KEYVAULT_URL=https://romulus-keyvault:443
      - AZURE_AD_URL=http://romulus-azure-ad:8080
      - IMDS_URL=http://romulus-imds:80
      - ARM_URL=https://romulus-arm-api:443
      - FUNCTIONS_URL=http://romulus-azure-functions:7071
      - AKS_POD_URL=http://romulus-aks-pod:8080
      - KUBERNETES_API_URL=https://romulus-kubernetes-api:443
      - EXCHANGE_URL=https://romulus-exchange-online:443
      - FRONT_DOOR_URL=http://romulus-front-door:8080
      - EPISODE_ID=${EPISODE_ID:-default}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AGENT_ROLE=blue_team
      - LOG_ACCESS_ENABLED=true
      - DOCKER_SOCKET_ACCESS=true
    networks:
      - saber-episode-network
    depends_on:
      romulus-init-seed:
        condition: service_completed_successfully
      romulus-kusto-emulator:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=siem"
      - "saber.service.name=romulus-sentinel"
      - "saber.scenario=romulus_react2shell_red_only"
      - "saber.episode.id=${EPISODE_ID:-default}"

# No volumes section needed! All data pushed via HTTP APIs

# Network stub for local validation - overwritten by ComposeOrchestrator at runtime
networks:
  saber-episode-network:
    driver: bridge
