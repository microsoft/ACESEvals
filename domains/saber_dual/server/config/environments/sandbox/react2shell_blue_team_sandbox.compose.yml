---
# React2Shell Blue Team Sandbox Environment
# Azure cloud attack simulation for threat hunting evaluation
# 
# NO SHARED VOLUMES NEEDED - init-seed pushes config via HTTP APIs:
# - POST /admin/config → ARM, Azure AD, IMDS
# - POST /admin/tokens → inject valid tokens  
# - PUT /blobs → seed Azurite storage

services:
  # ==========================================================================
  # Azure Identity & Authentication (start first, init-seed depends on these)
  # ==========================================================================
  react2shell-azure-ad:
    image: saber/saber_dual/react2shell-azure-ad:latest
    container_name: react2shell-azure-ad-${EPISODE_ID:-default}
    hostname: login.microsoftonline.com
    environment:
      - TENANT_ID=87654321-4321-4321-4321-cba987654321
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=identity"
      - "saber.service.name=react2shell-azure-ad"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  react2shell-imds:
    image: saber/saber_dual/react2shell-imds:latest
    container_name: react2shell-imds-${EPISODE_ID:-default}
    hostname: "169.254.169.254"
    environment:
      - SUBSCRIPTION_ID=12345678-1234-1234-1234-123456789abc
      - RESOURCE_GROUP=production-rg
      - VM_NAME=webapp-vm-001
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=imds"
      - "saber.service.name=react2shell-imds"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Azure Data Services  
  # ==========================================================================
  react2shell-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: react2shell-azurite-${EPISODE_ID:-default}
    hostname: proddata001.blob.core.windows.net
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --skipApiVersionCheck
    environment:
      - AZURITE_ACCOUNTS=proddata001:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=storage"
      - "saber.service.name=react2shell-azurite"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  react2shell-keyvault:
    image: saber/saber_dual/react2shell-keyvault:latest
    container_name: react2shell-keyvault-${EPISODE_ID:-default}
    hostname: prod-secrets-kv.vault.azure.net
    environment:
      - VAULT_NAME=prod-secrets-kv
      - TENANT_ID=87654321-4321-4321-4321-cba987654321
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      react2shell-azure-ad:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, ssl; urllib.request.urlopen('https://localhost:443/health', context=ssl._create_unverified_context())\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=keyvault"
      - "saber.service.name=react2shell-keyvault"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Azure Management Plane
  # ==========================================================================
  react2shell-arm-api:
    image: saber/saber_dual/react2shell-arm-api:latest
    container_name: react2shell-arm-api-${EPISODE_ID:-default}
    hostname: management.azure.com
    environment:
      - SUBSCRIPTION_ID=12345678-1234-1234-1234-123456789abc
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      react2shell-azure-ad:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, ssl; urllib.request.urlopen('https://localhost:443/health', context=ssl._create_unverified_context())\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=arm"
      - "saber.service.name=react2shell-arm-api"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Azure Application Services
  # ==========================================================================
  react2shell-app-service:
    image: saber/saber_dual/react2shell-app-service:latest
    container_name: react2shell-app-service-${EPISODE_ID:-default}
    hostname: prod-webapp.azurewebsites.net
    environment:
      - APP_SERVICE_NAME=prod-webapp
      - SITE_NAME=prod-webapp.azurewebsites.net
      - SUBSCRIPTION_ID=12345678-1234-1234-1234-123456789abc
      - RESOURCE_GROUP=production-rg
      - AZURE_TENANT_ID=87654321-4321-4321-4321-cba987654321
      - IMDS_HOST=react2shell-imds
      - IMDS_PORT=80
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      react2shell-imds:
        condition: service_healthy
      react2shell-azure-ad:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=webapp"
      - "saber.service.name=react2shell-app-service"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  react2shell-front-door:
    image: saber/saber_dual/react2shell-front-door:latest
    container_name: react2shell-front-door-${EPISODE_ID:-default}
    hostname: prod-webapp.azurefd.net
    environment:
      - BACKEND_URL=http://react2shell-app-service:8080
      - WAF_MODE=Detection
      - SUBSCRIPTION_ID=12345678-1234-1234-1234-123456789abc
      - RESOURCE_GROUP=production-rg
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      react2shell-app-service:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=frontend"
      - "saber.service.name=react2shell-front-door"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  react2shell-functions:
    image: saber/saber_dual/react2shell-functions:latest
    container_name: react2shell-functions-${EPISODE_ID:-default}
    hostname: prod-data-processor.azurewebsites.net
    environment:
      - FUNCTION_APP_NAME=prod-data-processor
      - FUNCTIONS_WORKER_RUNTIME=python
      - IDENTITY_ENDPOINT=http://react2shell-imds:80/metadata/identity/oauth2/token
      - IDENTITY_HEADER=mock-identity-header
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    depends_on:
      react2shell-imds:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7071/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=functions"
      - "saber.service.name=react2shell-functions"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Init Container - Seeds all services via HTTP APIs
  # Runs AFTER services are healthy, pushes config/data via REST
  # ==========================================================================
  react2shell-init-seed:
    image: saber/saber_dual/react2shell-init-seed:latest
    container_name: react2shell-init-seed-${EPISODE_ID:-default}
    environment:
      - EPISODE_ID=${EPISODE_ID:-default}
      - AZURITE_HOST=react2shell-azurite
      - KEYVAULT_HOST=react2shell-keyvault
      - AZURE_AD_HOST=react2shell-azure-ad
      - IMDS_HOST=react2shell-imds
      - ARM_HOST=react2shell-arm-api
      - APP_SERVICE_HOST=react2shell-app-service
      - FUNCTIONS_HOST=react2shell-functions
    networks:
      - saber-episode-network
    depends_on:
      react2shell-azure-ad:
        condition: service_healthy
      react2shell-imds:
        condition: service_healthy
      react2shell-azurite:
        condition: service_healthy
      react2shell-keyvault:
        condition: service_healthy
      react2shell-arm-api:
        condition: service_healthy
      react2shell-app-service:
        condition: service_healthy
      react2shell-functions:
        condition: service_healthy
    restart: "no"
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=init"
      - "saber.service.name=react2shell-init-seed"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # ==========================================================================
  # Azure Sentinel - Blue Team Execution Environment
  # This is where the agent runs commands
  # ==========================================================================
  react2shell-kusto-emulator:
    image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
    platform: linux/amd64  # Required - no ARM image available, will use QEMU emulation on ARM hosts
    container_name: react2shell-kusto-${EPISODE_ID:-default}
    hostname: kusto.local
    environment:
      - ACCEPT_EULA=Y
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/ > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 120s  # Kusto takes a while to start, especially under emulation
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=kusto"
      - "saber.service.name=react2shell-kusto"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

  react2shell-sentinel:
    image: saber/saber_dual/react2shell-sentinel:latest
    container_name: react2shell-sentinel-${EPISODE_ID:-default}
    hostname: azure-sentinel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    user: "root"
    environment:
      - OUTPUT_FORMAT=azure_monitor
      - KUSTO_URL=http://react2shell-kusto-emulator:8080
      - KEYVAULT_URL=https://react2shell-keyvault:443
      - AZURE_AD_URL=http://react2shell-azure-ad:8080
      - IMDS_URL=http://react2shell-imds:80
      - ARM_URL=https://react2shell-arm-api:443
      - FUNCTIONS_URL=http://react2shell-functions:7071
      - APP_SERVICE_URL=http://react2shell-app-service:8080
      - FRONT_DOOR_URL=http://react2shell-front-door:8080
      - EPISODE_ID=${EPISODE_ID:-default}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AGENT_ROLE=blue_team
      - LOG_ACCESS_ENABLED=true
      - DOCKER_SOCKET_ACCESS=true
    networks:
      - saber-episode-network
    depends_on:
      react2shell-init-seed:
        condition: service_completed_successfully
      react2shell-kusto-emulator:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    labels:
      - "saber.execution.service=true"
      - "saber.domain=saber_dual"
      - "saber.service.type=siem"
      - "saber.service.name=react2shell-sentinel"
      - "saber.agent.role=blue_team"
      - "saber.scenario=react2shell"
      - "saber.episode.id=${EPISODE_ID:-default}"

# No volumes section needed! All data pushed via HTTP APIs

# Network stub for local validation - overwritten by ComposeOrchestrator at runtime
networks:
  saber-episode-network:
    driver: bridge
