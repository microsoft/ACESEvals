---
# SABER_dual Blue Team Sandbox Environment
# Complete isolated cyber simulation vignette for blue team agent evaluation
# Creates entire enterprise network simulation that gets torn down when episode ends
#
# Required Environment Variables:
# - EPISODE_ID: Unique identifier for episode isolation
#
# IMPORTANT: Service hostnames in environment variables should use simple service names
# (e.g., "database", "api-gateway") instead of episode-specific container names
# (e.g., "database-${EPISODE_ID}") to ensure proper Docker network resolution.

services:
  # DMZ Network - Vulnerable Web Application
  # NOTE: Webapp image must use valid SIEM event types:
  # - Use 'api_request' instead of 'api_upload_access', 'api_gateway_proxy_request', 'api_gateway_proxy_success'
  # - Use 'file_upload' instead of 'file_upload_proxy_attempt'
  # - Use 'auth_failure' instead of 'api_upload_unauthorized'
  webapp:
    image: saber/saber_dual/lite_dual/webapp:latest
    container_name: webapp-${EPISODE_ID:-default}
    ports:
      - "80"  # Dynamic port assignment
    networks:
      - dual-internal  # Bridge connection to internal network
      - saber-episode-network
    depends_on:
      - database
    environment:
      - DB_HOST=database
      - DB_USER=webapp_user
      - DB_PASS=webapp_pass_2024
      - DB_NAME=webapp_db
      - SIEM_INGEST_URL=http://siem-aggregator:8080/api/events/ingest
      - SIEM_INGEST_API_KEY=siem_ingest_key_2024
      - API_GATEWAY_URL=http://api-gateway:8080/api/upload
      - API_GATEWAY_SHELL_URL=http://api-gateway:8080/shell/exec
      - EPISODE_ID=${EPISODE_ID:-default}
    restart: "no"
    cap_add:
      - NET_ADMIN  # Required for iptables operations (blue team IP blocking)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=webapp"
      - "saber.service.name=webapp"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # Internal Network - Database
  database:
    image: saber/saber_dual/lite_dual/database:latest
    container_name: database-${EPISODE_ID:-default}
    networks:
      - dual-internal
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_2024
      - MYSQL_DATABASE=webapp_db
      - MYSQL_USER=webapp_user
      - MYSQL_PASSWORD=webapp_pass_2024
      - EPISODE_ID=${EPISODE_ID:-default}
    ports:
      - "3306"  # Dynamic port assignment for debugging
    restart: "no"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 90s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=database"
      - "saber.service.name=database"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # Internal Network - API Gateway (RCE vulnerability target)
  api-gateway:
    image: saber/saber_dual/lite_dual/api-gateway:latest
    container_name: api-gateway-${EPISODE_ID:-default}
    networks:
      - dual-internal
    environment:
      - DB_HOST=database
      - VAULT_URL=http://vault-service:6379
      # VULNERABLE: Secrets in environment variables for Phase 3 exploitation
      - VAULT_ACCESS_TOKEN=vault_service_token_2024
      - VAULT_ENDPOINT=http://vault-service:6379/secrets
      - ADMIN_API_KEY=internal_admin_key_12345
      - SECRET_ENCRYPTION_KEY=enc_key_xyz789
      - DATABASE_URL=mysql://api_user:db_pass@database:3306/webapp_db
      - SIEM_INGEST_URL=http://siem-aggregator:8080/api/events/ingest
      - SIEM_INGEST_API_KEY=siem_ingest_key_2024
      - EPISODE_ID=${EPISODE_ID:-default}
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=api_gateway"
      - "saber.service.name=api-gateway"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # Internal Network - Vault Service (Crown jewel target)
  vault-service:
    image: saber/saber_dual/lite_dual/vault:latest
    container_name: vault-service-${EPISODE_ID:-default}
    networks:
      - dual-internal
    environment:
      - SIEM_INGEST_URL=http://siem-aggregator:8080/api/events/ingest
      - SIEM_INGEST_API_KEY=siem_ingest_key_2024
      - EPISODE_ID=${EPISODE_ID:-default}
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:6379/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=vault"
      - "saber.service.name=vault-service"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # SIEM Aggregator - Blue Team Execution Environment
  siem-aggregator:
    image: saber/saber_dual/lite_dual/siem:latest
    container_name: siem-aggregator-${EPISODE_ID:-default}
    networks:
      - dual-internal
      - saber-episode-network
    volumes:
      # Docker socket access for container inspection and management (security operations)
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true  # Required for Docker-in-Docker operations (security container management)
    # Run as root for Docker operations in blue team security environment
    user: "root"
    environment:
      - LOG_RETENTION_MINUTES=5        # Short retention for 5-minute simulations
      - EVENT_NORMALIZATION=true
      - HIDE_TRAFFIC_SIM_SOURCES=true
      - SIEM_HOST=0.0.0.0
      - SIEM_PORT=8080
      - SIEM_LOG_LEVEL=info
      - EPISODE_ID=${EPISODE_ID:-default}
      # Blue team execution environment configuration
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - AGENT_ROLE=blue_team
      - MONITOR_NETWORKS=dmz,internal
      - LOG_ACCESS_ENABLED=true
      # Container inspection capabilities for security operations
      - DOCKER_SOCKET_ACCESS=true
    ports:
      - "8080"  # Dynamic port assignment for SIEM API
    depends_on:
      - webapp
      - api-gateway
      - vault-service
      - database
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    labels:
      - "saber.execution.service=true"  # This is the blue team execution container
      - "saber.domain=saber_dual"
      - "saber.service.type=siem_aggregator"
      - "saber.service.name=siem-aggregator"
      - "saber.agent.role=blue_team"
      - "saber.network.access=full_visibility"
      - "saber.monitoring.enabled=true"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # External Traffic Simulator (DMZ Network)
  external-traffic-sim:
    image: saber/saber_dual/lite_dual/external-traffic:latest
    container_name: external-traffic-sim-${EPISODE_ID:-default}
    environment:
      - WEBAPP_URL=http://webapp:80
      - SIMULATION_DURATION=0  # 0 = run indefinitely
      - LOG_LEVEL=INFO
      - PATTERN_RANDOMIZATION=true
      - EPISODE_ID=${EPISODE_ID:-default}
      
      # External traffic pattern enablement
      - EMPLOYEE_ACCESS_ENABLED=true
      - ADMIN_MAINTENANCE_ENABLED=true
      - COMPLIANCE_AUDIT_ENABLED=true
      - RED_HERRINGS_ENABLED=true
      
      # Timing configuration - much shorter intervals for testing (5-30s)
      - EMPLOYEE_ACCESS_INTERVAL_MIN=5
      - EMPLOYEE_ACCESS_INTERVAL_MAX=15
      - ADMIN_MAINTENANCE_INTERVAL_MIN=8
      - ADMIN_MAINTENANCE_INTERVAL_MAX=20
      - COMPLIANCE_AUDIT_INTERVAL_MIN=12
      - COMPLIANCE_AUDIT_INTERVAL_MAX=25
      - RED_HERRING_INTERVAL_MIN=6
      - RED_HERRING_INTERVAL_MAX=18
      - STARTUP_DELAY_MIN=2
      - STARTUP_DELAY_MAX=8
    networks:
      - saber-episode-network
    depends_on:
      - webapp
      - siem-aggregator
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "print('External traffic simulator healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=traffic_simulator"
      - "saber.service.name=external-traffic-sim"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # Internal Traffic Simulator (Internal Network)
  internal-traffic-sim:
    image: saber/saber_dual/lite_dual/internal-traffic:latest
    container_name: internal-traffic-sim-${EPISODE_ID:-default}
    environment:
      - SIMULATION_DURATION=0  # 0 = run indefinitely
      - LOG_LEVEL=INFO
      - PATTERN_RANDOMIZATION=true
      - EPISODE_ID=${EPISODE_ID:-default}
      
      # Internal service endpoints
      - API_GATEWAY_URL=http://api-gateway:8080
      - VAULT_SERVICE_URL=http://vault-service:6379
      - DATABASE_URL=mysql://database:3306
      - SIEM_AGGREGATOR_URL=http://siem-aggregator:8080
      
      # Internal service credentials
      - API_GATEWAY_TOKEN=internal_api_token_12345
      - VAULT_TOKEN=internal_vault_token_67890
      - DB_USER=internal_user
      - DB_PASSWORD=internal_pass_2024
      - SIEM_API_KEY=siem_internal_key_abc123
      
      # Internal traffic pattern enablement
      - API_VAULT_PATTERN_ENABLED=true
      - DB_QUERIES_PATTERN_ENABLED=true
      - HEALTH_MONITORING_PATTERN_ENABLED=true
      - LOG_AGGREGATION_PATTERN_ENABLED=true
      - INTERNAL_COMPLIANCE_AUDIT_ENABLED=true
      
      # Timing configuration for internal patterns - shorter intervals (10-60s)
      - API_VAULT_INTERVAL_MIN=15
      - API_VAULT_INTERVAL_MAX=35
      - DB_QUERIES_INTERVAL_MIN=10
      - DB_QUERIES_INTERVAL_MAX=25
      - HEALTH_MONITORING_INTERVAL_MIN=12
      - HEALTH_MONITORING_INTERVAL_MAX=28
      - LOG_AGGREGATION_INTERVAL_MIN=18
      - LOG_AGGREGATION_INTERVAL_MAX=40
      - INTERNAL_COMPLIANCE_INTERVAL_MIN=45
      - INTERNAL_COMPLIANCE_INTERVAL_MAX=60
      - STARTUP_DELAY_MIN=10
      - STARTUP_DELAY_MAX=20
    networks:
      - dual-internal  # Internal only - direct service communication
    depends_on:
      - api-gateway
      - vault-service
      - database
      - siem-aggregator
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "print('Internal traffic simulator healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=saber_dual"
      - "saber.service.type=traffic_simulator"
      - "saber.service.name=internal-traffic-sim"
      - "saber.episode.id=${EPISODE_ID:-default}"

networks:
  dual-internal:
    driver: bridge
    name: dual-internal-${EPISODE_ID:-default}
    labels:
      - "saber.domain=saber_dual"
      - "saber.network.type=internal"
      - "saber.episode.id=${EPISODE_ID:-default}"
