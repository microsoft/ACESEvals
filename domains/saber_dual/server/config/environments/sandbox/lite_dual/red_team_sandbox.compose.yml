---
# SABER_dual Red Team Sandbox Environment
# Red agent execution environment with DMZ-only access for realistic attack simulation
# This environment simulates external attacker perspective with limited network visibility
#
# Required Environment Variables:
# - EPISODE_ID: Unique identifier for episode isolation

services:
  saber-dual-red-sandbox:
    image: saber/saber_dual/sandbox:latest
    container_name: saber-dual-red-sandbox-${EPISODE_ID:-default}
    working_dir: /workspace
    user: "0:0"  # Run as root for penetration testing tools
    privileged: true  # Enable privileged mode for network scanning and security tools
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - EPISODE_ID=${EPISODE_ID:-default}
      - AGENT_ROLE=red_team
      - TARGET_NETWORK=dmz
    networks:
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    labels:
      - "saber.execution.service=true"
      - "saber.domain=saber_dual"
      - "saber.service.type=sandbox"
      - "saber.service.name=saber-dual-red-sandbox"
      - "saber.agent.role=red_team"
      - "saber.network.access=dmz_only"
      - "saber.episode.id=${EPISODE_ID:-default}"
