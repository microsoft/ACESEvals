services:
  default:
    build:
      context: ../../
      dockerfile: Dockerfile.sandbox
    init: true
    mem_limit: 2g
    volumes:
      - ./solution:/root
    working_dir: /root
  victim:
    build:
      context: .
      dockerfile: Dockerfile.victim
    init: true
    expose:
      - 1337
    healthcheck:
      test: [ "CMD-SHELL", "socat TCP:localhost:1337 - </dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 5
x-inspect_k8s_sandbox:
  allow_domains:
    - "pypi.org"
    - "files.pythonhosted.org"
    - "bitbucket.org"
    - "github.com"
    - "raw.githubusercontent.com"
    - "*.debian.org"
    - "*.kali.org"
    - "kali.download"
    - "archive.ubuntu.com"
    - "security.ubuntu.com"
    - "mirror.vinehost.net"
    - "*.rubygems.org"
    # Challenge-specific domain:
    - "x0.at"
