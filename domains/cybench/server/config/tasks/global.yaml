domain: cybench

global_defaults:
  prompts:
    assistant: "assistants/inspect_assistant.md"
    submit: "submits/inspect_submit.md"
    continue: "continues/inspect_continue.md"
    
  execution_config:
    executors:
      bash:
        timeout: 180
      python:
        timeout: 180

  episode_config:
    max_steps: 30

    # Transcript coordination configuration
    # Single-agent tasks use default settings (push enabled, pull disabled)
    transcript_config:
      websocket:
        push:
          enabled: true
        pull:
          enabled: false

  benchmark_config:
    episode_attempts: 3
