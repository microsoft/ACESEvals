services:
  default:
    image: saber/cti_realm/sandbox:latest
    x-local: true
    working_dir: /workspace
    init: true
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - KUSTO_CLUSTER_URL=http://saber-cti-kusto-emulator:8080
      - KUSTO_DATABASE=NetDefaultDB
      - MITRE_SERVICE_URL=http://saber-cti-mitre-service:8081
      - QUERY_TIMEOUT=60
      - MAX_QUERY_ROWS=10000
    networks:
      - cti-realm-database
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
          pids: 512

networks:
  cti-realm-database:
    external: true
    name: ${SABER_PROJECT}_cti-realm-database
