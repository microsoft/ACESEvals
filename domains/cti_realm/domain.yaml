# SABER Domain Manifest for CTI Realm
# Cyber Threat Intelligence Detection Rule Development Benchmark
schemaVersion: "1.0.0"

domain:
  slug: "cti_realm"
  name: "CTI Realm - Cyber Threat Intelligence"
  description: "Cyber threat intelligence analysis and detection rule development benchmark"
  version: "1.0.0"

# Docker images for the domain
images:
  sandbox:
    tag: "saber/cti_realm/sandbox:latest"
    dockerfile: "server/docker/Dockerfile.sandbox"
    labels:
      saber.domain: "cti_realm"
      saber.component: "sandbox"

# Required ports configuration
ports:
  rest:
    container: 8000
    public: false

  mcp:
    container: 8001
    public: false

volumes:
  - type: "bind"
    source: "./server/data"
    target: "/app/data"
    readonly: false
    description: "CTI reports, MITRE data, and detection rule templates"

capabilities:
  networking:
    internet_access: false
    custom_networks:
      - "cti-realm-database"

  filesystem:
    host_access: false
    writable_paths:
      - "/app/logs"
      - "/app/data"

  execution:
    docker_socket: false
    privileged: false
    tools:
      - "python"
      - "curl"
      - "jq"
      - "yq"

resources:
  cpu_limit: "2.0"
  memory_limit: "4g"
  storage_limit: "8g"

metadata:
  maintainer: "saber-team@security.com"
  documentation: "https://github.com/saber-team/saber/tree/main/domains/cti_realm"
  repository: "https://github.com/saber-team/saber"
  tags:
    - "cti"
    - "threat-intelligence"
    - "detection-rules"
    - "sigma"
    - "kql"
    - "mitre-attack"
    - "cybersecurity"
