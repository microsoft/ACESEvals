# Shared configuration for all cti_realm tasks
# This configuration will be merged into all tasks in this directory

dataset: cti_realm_25

sandbox_environment: "default"

scoring_aggregation:
  average:
    scores:
    - submission
    - - c0_cti_analysis
      - c1_threat_context
      - c2_data_exploration
      - c3_query_execution
      - c4_detection_quality

initial_context:
  kusto_connection:
    cluster_url: "http://saber-cti-kusto-emulator:8080"
    database: "NetDefaultDB"
    connection_example: "Use the kusto_query tool to execute KQL queries"

  mitre_service:
    url: "http://saber-cti-mitre-service:8081"
    endpoints:
      - "/techniques" # Get MITRE ATT&CK techniques
      - "/groups" # Get threat actor groups
      - "/software" # Get malware/tool information
