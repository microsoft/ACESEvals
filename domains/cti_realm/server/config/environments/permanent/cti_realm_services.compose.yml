---
# Permanent services and networks for the CTI Realm domain
# This compose file defines all permanent infrastructure that runs continuously

services:
  kusto-emulator:
    image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
    container_name: saber-cti-kusto-emulator
    labels:
      - "saber.domain=cti_realm"
      - "saber.service.type=permanent"
      - "saber.service.name=kusto-emulator"
      - "saber.execution.service=true"
    ports:
      - "8080:8080"
    environment:
      - ACCEPT_EULA=Y
    networks:
      - cti-realm-database

  # Initialize Kusto with tables and data
  kusto-init:
    image: python:3.11-slim
    depends_on:
      - kusto-emulator
    volumes:
      - /root/SABER/domains/cti_realm/server/data/kusto_init:/app
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && python init_kusto.py && python load_data.py"
    networks:
      - cti-realm-database
    restart: "unless-stopped"
    labels:
      - "saber.domain=cti_realm"
      - "saber.service.type=permanent-init"
      - "saber.service.name=kusto-init"

  # MITRE ATT&CK service
  mitre-service:
    image: python:3.11-slim
    container_name: saber-cti-mitre-service
    labels:
      - "saber.domain=cti_realm"
      - "saber.service.type=permanent"
      - "saber.service.name=mitre-service"
    ports:
      - "8081:8081"
    volumes:
      - /root/SABER/domains/cti_realm/server/data/mitre_service:/app
    working_dir: /app
    command: >
      bash -c "apt-get update && apt-get install -y curl &&
      for i in {1..30}; do
        if [ -f requirements.txt ] && [ -s requirements.txt ]; then
          echo 'Volume mount ready, requirements.txt found';
          break;
        fi;
        echo 'Waiting for volume mount... attempt '$$i'/30';
        sleep 2;
      done &&
      if [ ! -f requirements.txt ]; then
        echo 'ERROR: requirements.txt not found after waiting';
        ls -la;
        exit 1;
      fi &&
      pip install -r requirements.txt && python mitre_api.py"
    networks:
      - cti-realm-database

# Shared network for communication with sandbox environments
networks:
  cti-realm-database:
    driver: bridge
    labels:
      - "saber.domain=cti_realm"
      - "saber.network.type=shared"
      - "saber.network.name=cti-realm-database"

# No persistent volumes needed - data reloaded each time (following excytin pattern)
