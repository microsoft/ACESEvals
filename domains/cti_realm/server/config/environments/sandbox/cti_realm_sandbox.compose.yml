---
# CTI Realm Sandbox Environment - Cyber Threat Intelligence Analysis
# Lightweight sandbox for threat hunting and detection rule development
# This replaces the dynamic environment generation from environments.yaml
#
# Required Environment Variables:
# - EPISODE_ID: Unique identifier for episode isolation

services:
  cti-realm-sandbox:
    image: saber/cti_realm/sandbox:latest
    container_name: cti-realm-sandbox-${EPISODE_ID:-default}
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - EPISODE_ID=${EPISODE_ID:-default}
      - KUSTO_CLUSTER_URL=http://saber-cti-kusto-emulator:8080
      - KUSTO_DATABASE=NetDefaultDB
      - MITRE_SERVICE_URL=http://saber-cti-mitre-service:8081
      - QUERY_TIMEOUT=60
      - MAX_QUERY_ROWS=10000
    networks:
      - cti-realm-database
      - saber-episode-network
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    labels:
      - "saber.execution.service=true"
      - "saber.domain=cti_realm"
      - "saber.service.type=sandbox"
      - "saber.service.name=cti-realm-sandbox"
      - "saber.episode.id=${EPISODE_ID:-default}"

networks:
  # External shared network for database access (created by permanent services)
  cti-realm-database:
    external: true
    name: ${PERMANENT_NETWORK_PREFIX}cti-realm-database
